name: Sync Texas property tax rates

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'
  push:
    branches:
      - feature/property-tax-rate-platform

permissions:
  contents: write

concurrency:
  group: property-tax-rate-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync official Comptroller rates
        run: python scripts/data/sync-property-tax-rates.py

      - name: Verify generated dataset is non-empty
        shell: bash
        run: |
          grep -q "status: 'synced'" src/data/property/texas-tax-rates.generated.ts
          grep -Eq 'recordCount: [1-9][0-9]{3,}' src/data/property/texas-tax-rates.generated.ts
          grep -q 'latestFinalizedYear: 2025' src/data/property/texas-tax-rates.generated.ts
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application with generated rate data
        run: npm run build

      - name: Commit refreshed dataset
        shell: bash
        run: |
          if git diff --quiet -- src/data/property/texas-tax-rates.generated.ts; then
            echo 'No tax-rate changes.'
            exit 0
          fi
          git config user.name 'TexasDefined Data Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- src/data/property/texas-tax-rates.generated.ts
          git commit -m 'Refresh official Texas property tax rates'
          git push origin "HEAD:${GITHUB_REF_NAME}"
