name: Sync Texas property tax rates

on:
  # Verify the importer once when its source or synchronization workflow changes.
  # Scheduled monthly checks remain the regular unattended update mechanism.
  push:
    branches: [main]
    paths:
      - 'supabase/functions/import-texas-property-tax-rates/index.ts'
      - '.github/workflows/sync-property-tax-rates.yml'
  schedule:
    - cron: '23 11 3 * *'
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Check every retained official tax year since 2021'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: texas-property-tax-rate-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ftkznprjljkhymknvhye.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY }}
      RATE_HISTORY_LOOKBACK_YEARS: ${{ vars.RATE_HISTORY_LOOKBACK_YEARS || '5' }}
      FORCE_FULL_TAX_HISTORY: ${{ inputs.full_history || 'false' }}
      TEXAS_TAX_IMPORT_CLI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Require existing Supabase credentials
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL is not configured"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Existing Supabase service-role secret is missing"; exit 1; }

      - name: Check every eligible published year, including historic revisions
        shell: bash
        run: |
          set -euo pipefail
          current_year="$(date -u +%Y)"
          lookback="$RATE_HISTORY_LOOKBACK_YEARS"
          [[ "$lookback" =~ ^[0-9]+$ ]] || { echo "::error::RATE_HISTORY_LOOKBACK_YEARS must be a nonnegative integer"; exit 1; }
          (( lookback <= 15 )) || { echo "::error::Historical lookback exceeds safety limit (15 years)"; exit 1; }
          oldest=$((current_year-lookback))
          if (( oldest < 2021 )); then oldest=2021; fi
          # Annual recheck catches revisions to tax years outside the rolling
          # monthly lookback, rather than silently abandoning older records.
          if [[ "$(date -u +%m)" == "01" || "$FORCE_FULL_TAX_HISTORY" == "true" ]]; then
            oldest=2021
            echo "Running complete historical audit from 2021 through $current_year"
          fi
          failures=0
          published=0
          echo "## Texas property tax source synchronization" >> "$GITHUB_STEP_SUMMARY"
          echo "| Year | Outcome | Records | Changes |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---:|---|" >> "$GITHUB_STEP_SUMMARY"
          for ((year=current_year;year>=oldest;year--)); do
            response_file="$(mktemp)"
            echo "Checking official workbooks for $year"
            # Heavy workbook parsing runs in the GitHub runner, not inside a
            # short-CPU-budget Supabase Edge isolate. Same pinned source module.
            if TEXAS_TAX_IMPORT_YEAR="$year" deno run --node-modules-dir=none -A \
              supabase/functions/import-texas-property-tax-rates/index.ts \
              > "$response_file"; then
              status=200
            else
              status=500
              echo "::error::Year $year: importer process failed (see failure details below)"
            fi
            outcome="$(jq -r '.status // "error"' "$response_file" 2>/dev/null || echo error)"
            good="$(jq -r '.ok // false' "$response_file" 2>/dev/null || echo false)"
            count="$(jq -r '.count // .normalizedCount // "—"' "$response_file" 2>/dev/null || echo '—')"
            changes="$(jq -r 'if .added != null then "added: \(.added), removed: \(.removed), modified: \(.modified)" else "—" end' "$response_file" 2>/dev/null || echo '—')"
            reason="$(jq -r '.error // .reason // ""' "$response_file" 2>/dev/null | head -c 300 || true)"
            if [[ "$status" == 2?? && "$good" == true && "$outcome" == imported ]]; then
              published=$((published+1))
              echo "$year: imported ($count records; $changes)"
            elif [[ "$status" == 2?? && "$good" == true && "$outcome" == unchanged ]]; then
              published=$((published+1))
              echo "$year: unchanged; preserving current records"
            elif [[ "$status" == 2?? && "$good" == true && "$outcome" == unavailable && "$year" == "$current_year" ]]; then
              echo "$year: official current-year workbooks not yet available (expected publication delay)"
            else
              echo "::error::Year $year: HTTP $status, $outcome. $reason"
              failures=$((failures+1))
            fi
            echo "| $year | $outcome (HTTP $status) | $count | $changes |" >> "$GITHUB_STEP_SUMMARY"
            rm -f "$response_file"
          done
          if (( published==0 )); then
            echo "::error::No published historical year was successfully checked"
            failures=$((failures+1))
          fi
          if (( failures>0 )); then
            echo "::error::$failures property-tax sync checks failed; see yearly summary"
            exit 1
          fi
          echo "All eligible tax years checked independently; unchanged datasets retained."
