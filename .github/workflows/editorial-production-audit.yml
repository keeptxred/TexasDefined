name: Editorial production audit

on:
  schedule:
    - cron: '23 11 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/editorial-production-audit.yml'
      - 'src/data/articles*.ts'
      - 'src/data/fixtures/**'
      - 'src/routes/article.$slug.tsx'
      - 'src/routes/article.$slug.lazy.tsx'
  push:
    branches: [main]
    paths:
      - 'src/data/articles*.ts'
      - 'src/data/fixtures/**'
      - 'src/routes/article.$slug.tsx'
      - 'src/routes/article.$slug.lazy.tsx'

permissions:
  contents: read

concurrency:
  group: editorial-production-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-editorial-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Inventory every current editorial article
        shell: bash
        run: |
          set -euo pipefail
          cat > .audit-editorial.mjs <<'EOF'
          import { createServer } from 'vite';
          import fs from 'node:fs';
          const vite = await createServer({ server: { middlewareMode: true }, appType: 'custom', logLevel: 'error' });
          try {
            const mod = await vite.ssrLoadModule('/src/data/index.ts');
            const rows = await mod.platform.articles.list(mod.scope);
            const unique = [...new Map(rows.map((row) => [row.slug, row])).values()]
              .filter((row) => row?.slug)
              .sort((a, b) => a.slug.localeCompare(b.slug));
            if (!unique.length) throw new Error('Editorial repository returned zero articles');
            fs.writeFileSync('/tmp/article-slugs.txt', unique.map((row) => row.slug).join('\n') + '\n');
            console.log(`Editorial inventory: ${unique.length} unique articles`);
          } finally {
            await vite.close();
          }
          EOF
          node .audit-editorial.mjs
          rm .audit-editorial.mjs

      - name: Verify every article page and rendered hero image in production
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/results.txt

          check_article() {
            slug="$1"
            url="https://texasdefined.com/article/$slug"
            body=$(mktemp)
            code=$(curl -A 'TexasDefinedEditorialAudit/1.0 (+https://texasdefined.com)' -L -sS -o "$body" -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || echo 000)
            if [[ "$code" != "200" ]] || grep -Eqi 'Story unavailable|This story is no longer available|page not found|(^|>)404([^0-9]|<)' "$body"; then
              printf 'FAIL\tpage\t%s\t%s\n' "$code" "$url"
              rm -f "$body"
              return 0
            fi

            image=$(python3 - "$body" <<'PY'
          import re, sys
          from pathlib import Path
          html = Path(sys.argv[1]).read_text(errors='ignore')
          patterns = [
              r'<meta[^>]+property=["\x27]og:image["\x27][^>]+content=["\x27]([^"\x27]+)',
              r'<meta[^>]+content=["\x27]([^"\x27]+)["\x27][^>]+property=["\x27]og:image["\x27]',
          ]
          for p in patterns:
              m = re.search(p, html, re.I)
              if m:
                  print(m.group(1))
                  break
          PY
          )
            if [[ -z "$image" ]]; then
              printf 'FAIL\timage-metadata\t000\t%s\n' "$url"
              rm -f "$body"
              return 0
            fi
            if [[ "$image" == /* ]]; then image="https://texasdefined.com$image"; fi
            image_result=$(curl -A 'TexasDefinedEditorialAudit/1.0 (+https://texasdefined.com)' -L -sS -o /dev/null -w '%{http_code}\t%{content_type}' --connect-timeout 10 --max-time 30 "$image" || printf '000\t')
            IFS=$'\t' read -r image_code image_type <<< "$image_result"
            if [[ "$image_code" != "200" || ! "$image_type" =~ ^image/(jpeg|png|webp)(\;.*)?$ ]]; then
              printf 'FAIL\timage\t%s\t%s\t%s\n' "$image_code" "$image_type" "$url"
              rm -f "$body"
              return 0
            fi

            printf 'PASS\t200\t%s\n' "$url"
            rm -f "$body"
          }
          export -f check_article

          xargs -r -n1 -P8 bash -c 'check_article "$1"' _ < /tmp/article-slugs.txt | sort > /tmp/results.txt
          total=$(wc -l < /tmp/results.txt | tr -d ' ')
          passed=$(grep -c '^PASS' /tmp/results.txt || true)
          failed=$(grep -c '^FAIL' /tmp/results.txt || true)

          echo "Total checked: $total"
          echo "Passed: $passed"
          echo "Failed: $failed"
          grep '^FAIL' /tmp/results.txt || true

          {
            echo '## TexasDefined editorial production audit'
            echo
            echo "- Total checked: $total"
            echo "- Passed: $passed"
            echo "- Failed: $failed"
            if [[ "$failed" -gt 0 ]]; then
              echo
              echo '### Failures'
              echo '```'
              grep '^FAIL' /tmp/results.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          test "$failed" -eq 0
