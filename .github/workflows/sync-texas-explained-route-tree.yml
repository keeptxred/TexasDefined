name: Sync Texas Explained route tree

on:
  push:
    branches:
      - feat/texas-explained-authority-v2
    paths:
      - ".github/workflows/sync-texas-explained-route-tree.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/texas-explained-authority-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate route tree through production build
        run: npm run build
      - name: Commit generated route tree and remove helper
        shell: bash
        run: |
          set -euo pipefail
          test -f src/routeTree.gen.ts
          grep -F "import('./routes/texas-explained.lazy').then((d) => d.Route)" src/routeTree.gen.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-texas-explained-route-tree.yml
          git add src/routeTree.gen.ts
          git diff --cached --check
          git commit -m "Sync Texas Explained lazy route tree"
          git push origin HEAD:feat/texas-explained-authority-v2
