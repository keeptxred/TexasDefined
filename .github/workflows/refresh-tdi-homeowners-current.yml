name: Refresh TDI Homeowners Premiums

on:
  schedule:
    - cron: '37 12 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-tdi-homeowners-current.yml'
      - 'scripts/data/refresh-tdi-homeowners-current.mjs'
      - 'scripts/data/refresh-tdi-homeowners-current.test.mjs'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: tdi-homeowners-current-scheduled-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test official TDI chart extraction and source/revision guards
        run: node --test scripts/data/refresh-tdi-homeowners-current.test.mjs
      - name: Review official TDI annual premium and coverage charts
        run: node scripts/data/refresh-tdi-homeowners-current.mjs
      - name: Detect verified new official-source values
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/generated/tdi-homeowners-current.json src/data/texas-data-center.ts; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "No new verified TDI premium/coverage figures. Historical research unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/data/generated/tdi-homeowners-current.json src/data/texas-data-center.ts >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create isolated verified data branch
        if: steps.changes.outputs.changed == 'yes'
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/texas-data-tdi-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/data/generated/tdi-homeowners-current.json src/data/texas-data-center.ts
          git commit -m "data: refresh official TDI homeowners averages"
          git push origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: Open protected official data refresh PR
        if: steps.changes.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Refresh latest verified TDI homeowners premiums" \
            --body "Scheduled official Texas Department of Insurance homeowners premium/coverage chart refresh. Official TDI source chart data, matching years, policy type and revision bounds are validated; historical research page is preserved. The owner-side GitHub finisher validates the exact PR head against current main and protected CI before merging; no user approval is needed."
          echo "Refresh PR opened; protected GitHub finisher handles merging." >> "$GITHUB_STEP_SUMMARY"
