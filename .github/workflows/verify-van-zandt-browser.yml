name: Van Zandt desktop and mobile production acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/ci/verify-van-zandt-browser.mjs'
      - '.github/workflows/verify-van-zandt-browser.yml'
      - 'src/components/property/CountyTaxRateSection.tsx'
      - 'src/components/sports/HighSchoolFootballLookup.tsx'
      - 'src/components/content/VanZandtCountySpotlight.tsx'
      - 'src/data/county-profile.remote.ts'
      - 'src/routes/$kind.$slug.tsx'
      - 'src/data/knowledge-graph/index.ts'
      - 'scripts/ci/verify-van-zandt-closure.mjs'
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: van-zandt-browser-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chrome browser automation dependency
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-van-zandt-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1 axe-core@4.10.3
      - name: Verify desktop/mobile load, failure fallback, SEO and published links
        run: node scripts/ci/verify-van-zandt-browser.mjs
      - name: Verify all county team pages, 16s hung requests, OSM links and focused accessibility
        env:
          VERIFY_EXTERNAL_OSM: ${{ github.event_name == 'pull_request' }}
          EXPECT_SERVER_ONLY_COUNTY_SOURCES: ${{ github.event_name == 'workflow_run' }}
        run: node scripts/ci/verify-van-zandt-closure.mjs
      - name: Preserve Chrome screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: van-zandt-browser-acceptance
          path: artifacts/van-zandt-acceptance/
          if-no-files-found: warn
          retention-days: 14
