name: Football Batch018 25-school live Chrome evidence (no graduation)
on:
  workflow_run:
    workflows: ['Deploy TexasDefined production']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
  deployments: read
  actions: read
# Only eligible Chrome jobs join this queue. Unrelated issue comments must
# not consume a pending slot or displace an authorized 25-school acceptance.
jobs:
  chrome:
    if: ${{ (github.event_name == 'issue_comment' && github.event.issue.number == 5794 && github.actor == 'keeptxred' && github.event.comment.body == '/run-b018-chrome') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}
    # Share deploy-production's actual publish lock. A new Worker release
    # cannot replace the pinned UUID halfway through 75 real browser checks.
    # Still require exact signed source/Worker equality in the browser.
    concurrency:
      group: texasdefined-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require 25 authored Batch018 guides without premature registry promotion
        id: batch_scope
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const reg=JSON.parse(readFileSync('docs/football-authority/REGISTRY.json','utf8'));
          const source=readFileSync('src/data/high-school-football/football-program-profile.server.ts','utf8');
          const slugs=["fabens","fairfield","falfurrias","falls-city","farmersville","farwell","ferris","first-baptist-dallas","flatonia","florence","floresville","floydada","follett","forestburg","forney","forsan","fort-bend-austin","fort-bend-bush","fort-bend-christian","fort-bend-clements","fort-bend-crawford","fort-bend-dulles","fort-bend-elkins","fort-bend-hightower","fort-bend-kempner"];
          if(slugs.length!==25 || !['getBatch018FirstFabensEditorial','getBatch018FairfieldEditorial','getBatch018FalfurriasEditorial','getBatch018FallsCityEditorial','getBatch018FarmersvilleEditorial','getBatch018SecondFiveEditorial','getBatch018ThirdFiveEditorial','getBatch018FourthFiveEditorial','getBatch018FifthFiveEditorial'].every(method=>source.includes(method+'(canonicalSlug)')))throw Error('Batch018 source roster not fully authored');
          if(reg.batch?.number!==18 && !reg.completedBatches?.some(x=>x.number===18))throw Error('Batch018 registry missing');
          const statuses=slugs.map(slug=>reg.schoolRecords.find(s=>s.slug===slug)?.status);
          if(statuses.every(status=>status==='VERIFIED')){
            appendFileSync(process.env.GITHUB_OUTPUT,'active=false'+String.fromCharCode(10));
            console.log('Batch018 already graduated; no redundant Chrome job.');
          }else if(statuses.every(status=>status==='IMPLEMENTED')){
            appendFileSync(process.env.GITHUB_OUTPUT,'active=true'+String.fromCharCode(10));
          }else throw Error('Batch018 mixed or unsupported certification state; fail closed');
          NODE
      - name: Resolve exact live Worker to verified GitHub source SHA
        if: steps.batch_scope.outputs.active == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The verified Worker deployment ledger can arrive after the successful
          # production workflow event. Retry only the strict identity check;
          # never relax the signed SHA, Worker UUID or success-status assertions.
          for attempt in 1 2 3 4 5; do
            node scripts/ci/pin-football-b010-production-release.mjs
            if grep -q '^ready=true$' "$GITHUB_OUTPUT"; then
               echo "Verified Worker ledger pinned on attempt $attempt"
               exit 0
             fi
             if [ "$attempt" -lt 5 ]; then
               echo "Exact signed Worker ledger not yet visible; retry in 30s ($attempt/5)"
               sleep 30
             fi
           done
           echo "No exact signed source release after bounded retries" >&2
           exit 1
      - name: Require exact signed production release for active Batch018
        if: steps.batch_scope.outputs.active == 'true' && steps.release.outputs.ready != 'true'
        run: |
          echo 'No exact signed Worker/source release: cannot skip 75 Chrome cases.' >&2
          exit 1
      - name: Check out exact published source
        if: steps.batch_scope.outputs.active == 'true' && steps.release.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
      - name: Install isolated real Chrome driver
        if: steps.batch_scope.outputs.active == 'true' && steps.release.outputs.ready == 'true'
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/td-b018-chrome --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify all Batch018 schools and counties in real Chrome
        if: steps.batch_scope.outputs.active == 'true' && steps.release.outputs.ready == 'true'
        env:
          FOOTBALL_CHROME_SOURCE_SHA: ${{ steps.release.outputs.sha }}
          FOOTBALL_EXPECTED_WORKER_VERSION: ${{ steps.release.outputs.worker }}
        run: |
          node --check scripts/ci/verify-football-b018-production.mjs
          node scripts/ci/verify-football-b018-production.mjs
      - name: Upload compact Batch018 machine evidence
        if: always() && steps.batch_scope.outputs.active == 'true' && steps.release.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: football-b018-25-school-live-chrome-evidence
          path: |
            artifacts/b018-chrome-report.json
            artifacts/b018-chrome-screenshots/*.png
          retention-days: 7
          if-no-files-found: error
