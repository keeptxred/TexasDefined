name: Verify live Texas lake authority

on:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed
  workflow_dispatch:
  schedule:
    # Weekly after the normal production release window; all results retain a dated artifact.
    - cron: "17 15 * * 1"

permissions:
  contents: read

jobs:
  live-lake-authority:
    name: Check lake, county and state park reciprocal routes
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test live canonical lake pages and their reciprocal links
        run: node scripts/ci/verify-live-fishing-authority.mjs
      - name: Preserve dated failures and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lake-authority-live-acceptance
          path: .artifacts/lake-authority-production-acceptance.json
          if-no-files-found: warn
          retention-days: 90
