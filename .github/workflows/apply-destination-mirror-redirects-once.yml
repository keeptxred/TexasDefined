name: Apply destination mirror redirects once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-destination-mirror-redirects-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-destination-mirror-redirects-once-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply asserted patch
        run: python scripts/tmp-apply-destination-mirror-redirects.py

      - name: Validate entity and destination policies
        run: |
          node scripts/data/validate-entity-template-quality.mjs
          node scripts/data/validate-destination-indexing-policy.mjs

      - name: Build production application
        run: npm run build

      - name: Validate client performance budget
        run: npm run performance:validate

      - name: Commit validated application changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/tmp-apply-destination-mirror-redirects.py
          git add src/data/knowledge-graph/relationships.ts 'src/routes/$kind.$slug.tsx' scripts/data/validate-entity-template-quality.mjs
          git commit -m 'Redirect destination mirror entity routes'
          git pull --rebase origin main
          git push origin HEAD:main
