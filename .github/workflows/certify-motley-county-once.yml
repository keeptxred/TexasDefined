# retrigger after workflow entered default branch
name: Certify Motley County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-motley-county-once.yml'

permissions:
  contents: write

concurrency:
  group: certify-motley-county-once
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate deploy and certify Motley County
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          marker='.github/certification/motley-county.json'
          base_target='46b7b3d82614f69825b0903f379528f0a619fb46'
          fixture='src/data/fixtures/motley-county-matador-roaring-springs-matador-ranch-rolling-plains-texas.ts'
          profile='src/data/county-series-profiles-rolling-plains.ts'
          map='src/data/county-series.ts'
          hero='https://commons.wikimedia.org/wiki/Special:Redirect/file/Motley_County%2C_TX%2C_Courthouse_IMG_1544.JPG?width=1600'
          legacy_slug='motley-county-matador-roaring-springs-matador-ranch-rolling-plains-texas'

          record() {
            status="$1"; stage="$2"; detail="$3"; target="$(git rev-parse HEAD)"
            mkdir -p "$(dirname "$marker")"
            python3 - "$marker" "$status" "$stage" "$target" "$detail" <<'PY'
          import datetime, json, pathlib, sys
          path, status, stage, target, detail = sys.argv[1:]
          pathlib.Path(path).write_text(json.dumps({
            'county': 'motley', 'status': status, 'stage': stage,
            'county_commit': target, 'tested_main': target, 'detail': detail[-12000:],
            'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }, indent=2) + '\n', encoding='utf-8')
          PY
            git add "$marker"
            git commit -m "Record Motley County production ${status}" >/dev/null || true
            git push origin HEAD:main
          }

          git merge-base --is-ancestor "$base_target" HEAD || { record fail source 'Motley fixture/profile commits are not in current main ancestry'; exit 1; }
          test -f "$fixture" || { record fail source 'Motley fixture missing'; exit 1; }
          grep -Fq 'countySlug: "motley"' "$profile" || { record fail source 'Motley profile registration missing'; exit 1; }

          python3 - "$map" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          entry = '  ["motley-county-matador-roaring-springs-matador-ranch-rolling-plains-texas", "motley"],\n'
          if entry not in text:
              anchor = ']);\n\nconst COUNTY_SLUGS = new Set(LEGACY_ARTICLE_TO_COUNTY.values());'
              if anchor not in text:
                  raise SystemExit('completion-map anchor not found')
              text = text.replace(anchor, entry + anchor, 1)
              path.write_text(text)
          PY
          if ! git diff --quiet -- "$map"; then
            git add "$map"
            git commit -m 'Mark Motley County guide complete'
            git push origin HEAD:main
          fi
          target="$(git rev-parse HEAD)"

          grep -Fq '["motley-county-matador-roaring-springs-matador-ranch-rolling-plains-texas", "motley"]' "$map" || { record fail source 'Motley completion mapping missing'; exit 1; }
          if grep -n 'www\.texasdefined\.com' "$fixture" "$profile" "$map" >/tmp/motley-www.txt; then
            record fail canonical-host "$(cat /tmp/motley-www.txt)"; exit 1
          fi

          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          hcode="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$work/hh" -o "$work/hb" -w '%{http_code}' "$hero" || true)"
          hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/hh" | cut -d';' -f1)"
          hbytes="$(wc -c < "$work/hb" 2>/dev/null || echo 0)"
          if [ "$hcode" != 200 ] || ! [[ "$hmime" =~ ^image/(jpeg|png|webp)$ ]] || [ "$hbytes" -le 50000 ]; then
            record fail hero-source "HTTP=$hcode MIME=$hmime bytes=$hbytes"; exit 1
          fi

          if ! npm run validate >"$work/validate.log" 2>&1; then
            record fail validation "$(tail -200 "$work/validate.log")"; exit 1
          fi

          git fetch origin main
          latest="$(git rev-parse origin/main)"
          current="$(git rev-parse HEAD)"
          [ "$latest" = "$current" ] || { record fail main-moved-after-validation "main moved $current -> $latest"; exit 1; }

          if ! npm run deploy >"$work/deploy.log" 2>&1; then
            record fail deployment "$(tail -200 "$work/deploy.log")"; exit 1
          fi

          page=''; code=''
          for attempt in $(seq 1 12); do
            code="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$work/page" -w '%{http_code}' "https://texasdefined.com/county/motley?verify=${target}-${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$code" = 200 ] \
              && grep -Fq 'Motley County: Matador, Roaring Springs and the Ranch Country Below the Caprock' "$work/page" \
              && grep -Fq 'The county in numbers' "$work/page" \
              && grep -Fq 'County seat' "$work/page" \
              && grep -Fq '2020 population' "$work/page" \
              && grep -Fq 'County feature' "$work/page" \
              && grep -Fq 'Matador' "$work/page" \
              && grep -Fq 'Roaring Springs' "$work/page" \
              && grep -Fq 'https://texasdefined.com/county/motley' "$work/page"; then page=pass; break; fi
            sleep 5
          done
          [ "$page" = pass ] || { record fail live-page "HTTP=$code expected structured/editorial markers missing"; exit 1; }

          legacy_headers="$work/legacy-h"
          legacy_code="$(curl --max-time 60 -sS -D "$legacy_headers" -o /dev/null -w '%{http_code}' "https://texasdefined.com/article/${legacy_slug}?verify=${target}-${GITHUB_RUN_ID}" || true)"
          legacy_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$legacy_headers")"
          if [ "$legacy_code" != 301 ] || [[ "$legacy_location" != https://texasdefined.com/county/motley* ]]; then
            record fail legacy-redirect "HTTP=$legacy_code location=$legacy_location"; exit 1
          fi

          live_hcode="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$work/lhh" -o "$work/lhb" -w '%{http_code}' "$hero" || true)"
          live_hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/lhh" | cut -d';' -f1)"
          live_hbytes="$(wc -c < "$work/lhb" 2>/dev/null || echo 0)"
          if [ "$live_hcode" != 200 ] || ! [[ "$live_hmime" =~ ^image/(jpeg|png|webp)$ ]] || [ "$live_hbytes" -le 50000 ]; then
            record fail live-hero "HTTP=$live_hcode MIME=$live_hmime bytes=$live_hbytes"; exit 1
          fi

          record pass complete "validate=PASS deploy=PASS page=200 structured=yes editorial=yes legacy=301 hero=$live_hcode mime=$live_hmime bytes=$live_hbytes"
