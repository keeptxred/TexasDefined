name: Verify District 9 evergreen authority in production
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy TexasDefined production']
    types: [completed]
  pull_request:
    paths:
      - 'scripts/ci/verify-district9-production.mjs'
      - '.github/workflows/verify-district9-production.yml'
      - 'src/components/sports/District9Guide.tsx'
permissions:
  contents: read
jobs:
  verify-district9:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check verifier syntax
        run: node --check scripts/ci/verify-district9-production.mjs
      - name: Verify canonical + Worker District 9 SSR after deploy
        if: github.event_name != 'pull_request'
        run: node scripts/ci/verify-district9-production.mjs
