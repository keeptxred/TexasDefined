# retrigger after workflow entered default branch
name: Certify Ochiltree County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-ochiltree-county-once.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: certify-ochiltree-county-once
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate deploy and certify Ochiltree County
        shell: bash
        run: |
          set -u -o pipefail
          target='233a5e53279745fc01c581eac17de6c8165458a7'
          fixture='src/data/fixtures/ochiltree-county-perryton-wolf-creek-wheat-high-plains-texas.ts'
          registry='src/data/county-series-profiles-panhandle.ts'
          hero='https://commons.wikimedia.org/wiki/Special:Redirect/file/Ochiltree_County%2C_TX%2C_Courthouse_IMG_6008.JPG?width=1600'
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          publish() {
            local state="$1" detail="$2"
            detail="$(printf '%s' "$detail" | tr '\n\r' ' ' | cut -c1-135)"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data "{\"state\":\"$state\",\"context\":\"ochiltree-county-certification\",\"description\":\"$detail\"}" >/dev/null
          }
          fail() { publish failure "$1"; echo "$1" >&2; exit 1; }
          publish pending 'Checking Ochiltree County source, validation, deploy and live page'

          git merge-base --is-ancestor "$target" HEAD || fail 'Ochiltree county commit is not in current main ancestry'
          test -f "$fixture" || fail 'Ochiltree editorial fixture missing'
          grep -Fq 'countySlug: "ochiltree"' "$registry" || fail 'Ochiltree profile registration missing'
          grep -Fq 'Ochiltree County: Perryton, Wolf Creek and the Wheat Country of the Northern Panhandle' "$fixture" || fail 'Ochiltree title missing from fixture'
          if grep -n 'www\.texasdefined\.com' "$fixture" "$registry" src/data/county-series.server.ts >"$work/www.txt"; then
            fail "Canonical host violation: $(head -1 "$work/www.txt")"
          fi

          hcode="$(curl -A 'TexasDefinedCountyVerifier/1.0' -L --retry 6 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$work/hh" -o "$work/hb" -w '%{http_code}' "$hero" || true)"
          hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/hh" | cut -d';' -f1)"
          hbytes="$(wc -c < "$work/hb" 2>/dev/null || echo 0)"
          if [ "$hcode" != 200 ] || ! [[ "$hmime" =~ ^image/(jpeg|png|webp)$ ]] || [ "$hbytes" -le 50000 ]; then
            fail "Hero source failed HTTP=$hcode MIME=$hmime bytes=$hbytes"
          fi

          if ! npm run validate >"$work/validate.log" 2>&1; then
            fail "Validation failed: $(tail -30 "$work/validate.log" | tr '\n' ' ')"
          fi

          git fetch origin main
          latest="$(git rev-parse origin/main)"
          current="$(git rev-parse HEAD)"
          [ "$latest" = "$current" ] || fail "main moved during validation $current -> $latest"

          if ! npm run deploy >"$work/deploy.log" 2>&1; then
            fail "Deployment failed: $(tail -30 "$work/deploy.log" | tr '\n' ' ')"
          fi

          page=''; code=''
          for attempt in $(seq 1 12); do
            code="$(curl -A 'TexasDefinedCountyVerifier/1.0' --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$work/page" -w '%{http_code}' "https://texasdefined.com/county/ochiltree?verify=${target}-${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$code" = 200 ] \
              && grep -Fq 'Ochiltree County: Perryton, Wolf Creek and the Wheat Country of the Northern Panhandle' "$work/page" \
              && grep -Fq 'The county in numbers' "$work/page" \
              && grep -Fq 'County seat' "$work/page" \
              && grep -Fq '2020 population' "$work/page" \
              && grep -Fq 'County feature' "$work/page" \
              && grep -Fq 'Perryton' "$work/page" \
              && grep -Fq 'Wolf Creek' "$work/page" \
              && grep -Fq 'https://texasdefined.com/county/ochiltree' "$work/page"; then
              page=pass
              break
            fi
            sleep 5
          done
          [ "$page" = pass ] || fail "Live page failed HTTP=$code or structured/editorial/canonical markers missing"

          live_hcode="$(curl -A 'TexasDefinedCountyVerifier/1.0' -L --retry 6 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$work/lhh" -o "$work/lhb" -w '%{http_code}' "$hero" || true)"
          live_hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/lhh" | cut -d';' -f1)"
          live_hbytes="$(wc -c < "$work/lhb" 2>/dev/null || echo 0)"
          if [ "$live_hcode" != 200 ] || ! [[ "$live_hmime" =~ ^image/(jpeg|png|webp)$ ]] || [ "$live_hbytes" -le 50000 ]; then
            fail "Live hero failed HTTP=$live_hcode MIME=$live_hmime bytes=$live_hbytes"
          fi

          publish success "PASS page=200 structured=yes editorial=yes hero=$live_hcode/$live_hmime bytes=$live_hbytes legacy=not-applicable"
