name: Diagnose event ticket positive path

on:
  push:
    branches: [hotfix-event-ticket-positive-path]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Diagnose canonical GrapeFest ticket CTA
        run: node scripts/data/diagnose-event-ticket-positive-path.mjs
