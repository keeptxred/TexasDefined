name: Apply RV wave 3 expansion

on:
  push:
    branches:
      - agent/rv-wave3-state-park-expansion
    paths:
      - '.github/workflows/rv-wave3-patch.yml'
      - 'scripts/tmp/apply-rv-wave3.mjs'

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/rv-wave3-state-park-expansion
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source-backed RV wave 3
        run: node scripts/tmp/apply-rv-wave3.mjs
      - name: Validate RV authority
        run: node scripts/data/validate-rv-parks-authority.mjs
      - name: Validate curated RV wave 2 regression
        run: node scripts/data/validate-rv-curated-public-wave2.mjs
      - name: Validate curated RV wave 3
        run: node scripts/data/validate-rv-curated-public-wave3.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Enforce protected client bundle ceiling
        run: node scripts/data/validate-client-bundle-budget.mjs
      - name: Export exact validated file blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for path in \
            src/data/rv-parks/registry.server.ts \
            scripts/ci/verify-rv-production.mjs \
            scripts/data/validate-rv-curated-public-wave3.mjs \
            .github/workflows/validate-rv-parks-authority.yml
          do
            sha=$(jq -Rs '{content: ., encoding: "utf-8"}' "$path" | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq '.sha')
            echo "BLOB $path $sha"
          done
