name: Temporary GSC CTR Wave 8 rebase

on:
  push:
    branches:
      - agent/gsc-ctr-wave8-rebase-20260910

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gsc-ctr-wave8-rebase-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded Wave 8 patch
        run: python scripts/data/apply-gsc-ctr-wave8-rebase-temp.py
      - name: Run focused CTR regression validator
        run: node scripts/data/validate-gsc-page-one-ctr.mjs
      - name: Commit Wave 8 patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/seo.ts scripts/data/validate-gsc-page-one-ctr.mjs
          git commit -m "Rebase eighth GSC CTR opportunity wave"
          git push origin HEAD:agent/gsc-ctr-wave8-rebase-20260910
