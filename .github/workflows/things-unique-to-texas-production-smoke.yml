name: Things That Define Texas production smoke

on:
  workflow_run:
    workflows: ['Deploy TexasDefined production']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: things-that-define-texas-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify magazine authority routes
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          cache_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          check_page() {
            local path="$1"
            local needle="$2"
            local out
            out="$(mktemp)"
            for attempt in 1 2 3 4 5 6; do
              if curl --fail-with-body --silent --show-error --location --max-time 30 \
                "${origin}${path}?verify=${cache_key}-${attempt}" -o "$out"; then
                if grep -Fqi "$needle" "$out" && ! grep -Eqi '<meta[^>]+name=["'"']robots["'"'][^>]+content=["'"'][^"'"']*noindex' "$out"; then
                  echo "PASS ${path}"
                  rm -f "$out"
                  return 0
                fi
              fi
              sleep 5
            done
            echo "FAIL ${path}: expected indexable page containing '${needle}'" >&2
            sed -n '1,80p' "$out" >&2 || true
            rm -f "$out"
            return 1
          }

          check_page '/things-unique-to-texas' 'Things That Define Texas'
          check_page '/things-unique-to-texas/methodology' 'How we decide what defines Texas'
          check_page '/things-unique-to-texas/food-drink' 'Iconic Texas Foods & Drinks'
          check_page '/things-unique-to-texas/texas-brands' 'Legendary Texas Brands & Retail Institutions'
          check_page '/things-unique-to-texas/natural-wonders' 'Natural Wonders & Parks'
          check_page '/things-unique-to-texas/landmarks' 'Historic Landmarks & Texas Architecture'
          check_page '/things-unique-to-texas/roadside-small-towns' 'Quirky Roadside Texas & Small-Town Icons'
          check_page '/things-unique-to-texas/culture-music' 'Texas Cultural Traditions & Music'
          check_page '/things-unique-to-texas/wildlife-landscape' 'Texas Wildlife, Plants & Geography'
          check_page '/things-unique-to-texas/slang-folklore' 'Texas Slang, Symbols & Folklore'

          check_page '/texas-food-trail' 'The Texas Food Trail'
          check_page '/texas-roadside-oddities' 'Texas Roadside Oddities'
          check_page '/texas-slang-explained' 'Texas Slang Explained'
          check_page '/texas-dance-halls-honky-tonks' 'Texas Dance Halls & Honky-Tonks'
          check_page '/texas-homecoming-mums' 'Texas Homecoming Mums Explained'
          check_page '/texas-natural-wonders-bucket-list' 'Texas Natural Wonders Bucket List'
          check_page '/german-czech-texas-towns' 'German & Czech Texas Towns'
          check_page '/texas-brand-origin-stories' 'Texas Brand Origin Stories'

      - name: Verify machine-readable reference distributions
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          json_body="$(mktemp)"
          json_headers="$(mktemp)"
          csv_body="$(mktemp)"
          csv_headers="$(mktemp)"
          trap 'rm -f "$json_body" "$json_headers" "$csv_body" "$csv_headers"' EXIT

          curl --fail-with-body --silent --show-error --location --max-time 30 \
            -D "$json_headers" "${origin}/things-that-define-texas.json?verify=${GITHUB_RUN_ID}" -o "$json_body"
          grep -Eqi '^x-robots-tag:[[:space:]]*noindex,[[:space:]]*follow' "$json_headers"
          jq -e '.schemaVersion == 1 and .count == 250 and (.items | length) == 250 and .methodology == "https://texasdefined.com/things-unique-to-texas/methodology"' "$json_body" >/dev/null

          curl --fail-with-body --silent --show-error --location --max-time 30 \
            -D "$csv_headers" "${origin}/things-that-define-texas.csv?verify=${GITHUB_RUN_ID}" -o "$csv_body"
          grep -Eqi '^x-robots-tag:[[:space:]]*noindex,[[:space:]]*follow' "$csv_headers"
          test "$(wc -l < "$csv_body" | tr -d ' ')" -eq 251
          head -n 1 "$csv_body" | grep -Fq 'deeper_guide'
          head -n 1 "$csv_body" | grep -Fq 'methodology'
          echo 'PASS machine-readable distributions: 250 JSON items and 250 CSV records.'

      - name: Publish smoke summary
        if: always()
        run: |
          {
            echo '## Things That Define Texas production smoke'
            echo
            echo '- Canonical collection: https://texasdefined.com/things-unique-to-texas'
            echo '- Methodology: https://texasdefined.com/things-unique-to-texas/methodology'
            echo '- Chapter routes checked: 8'
            echo '- Evergreen deep-dive routes checked: 8'
            echo '- Machine distributions: 250-row JSON and CSV packages'
            echo '- HTML routes must be indexable; data downloads must return X-Robots-Tag: noindex, follow.'
          } >> "$GITHUB_STEP_SUMMARY"
