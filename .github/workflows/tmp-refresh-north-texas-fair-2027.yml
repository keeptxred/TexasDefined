name: Temporary North Texas Fair 2027 refresh

on:
  push:
    branches:
      - agent/north-texas-fair-2027-rebase-20260911

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/north-texas-fair-2027-rebase-20260911
          fetch-depth: 0
      - name: Apply refresh
        run: node scripts/tmp-refresh-north-texas-fair-2027.mjs
      - name: Validate events
        run: node scripts/data/validate-events-seo.mjs
      - name: Build
        run: npm run build
      - name: Commit production changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/major-event-expanded-authority-tranche13.server.ts src/data/major-event-schema-enrichment-batch3.server.ts
          git diff --cached --check
          git commit -m "Refresh North Texas Fair for 2027"
          git push origin HEAD:agent/north-texas-fair-2027-rebase-20260911
