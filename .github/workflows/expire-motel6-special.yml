name: Expire Motel 6 Halloween special

on:
  # 06:17 UTC after conservative November 1, 2026 05:00 UTC display cutoff.
  # Retry Nov 1-14 if a GitHub schedule is delayed or protected CI needs repair.
  schedule:
    - cron: '17 6 1-14 11 *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: expire-motel6-halloween-2026
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test expiry boundary and evergreen protection
        run: node --test scripts/ci/expire-motel6-special.test.mjs
      - name: Remove expired offer only after UTC cutoff
        run: node scripts/ci/expire-motel6-special.mjs --write
      - name: Verify only two authorized files changed
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/stay-affiliate-options.js src/components/sports/FootballFanOffers.tsx; then
            echo 'changed=no' >> "$GITHUB_OUTPUT"
            echo 'Not yet due or already fully retired.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while IFS= read -r file; do
            case "$file" in
              public/stay-affiliate-options.js|src/components/sports/FootballFanOffers.tsx) ;;
              *) echo "::error::Unexpected expiration edit $file"; exit 1 ;;
            esac
          done < <(git diff --name-only)
          echo 'changed=yes' >> "$GITHUB_OUTPUT"
      - name: Confirm evergreen links and cleanup tests
        if: steps.changes.outputs.changed == 'yes'
        run: |
          set -euo pipefail
          node --check public/stay-affiliate-options.js
          node scripts/data/validate-motel6-affiliate.mjs
          node scripts/data/validate-stay-affiliate-options.mjs
          node --test scripts/ci/expire-motel6-special.test.mjs
      - name: Commit isolated campaign-removal branch
        if: steps.changes.outputs.changed == 'yes'
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/motel6-halloween-expired-$GITHUB_RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add -- public/stay-affiliate-options.js src/components/sports/FootballFanOffers.tsx
          git commit -m 'Retire expired Motel 6 Halloween special and keep evergreen offers'
          git push origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: Open protected cleanup PR
        if: steps.changes.outputs.changed == 'yes'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'Retire expired Motel 6 Halloween offer' \
            --body 'Scheduled removal after the conservative 2026-11-01 05:00 UTC cutoff. Removes the expired Halloween creative, discounts and timers but preserves TexasDefined Motel 6 standard affiliate links, disclosures and click attribution. The trusted owner-side finisher checks the exact protected PR head and enables auto-merge; this runner never pushes to main.'
          echo 'Protected Motel 6 campaign removal PR opened.' >> "$GITHUB_STEP_SUMMARY"
