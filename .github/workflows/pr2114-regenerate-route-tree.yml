name: PR 2114 regenerate route tree

on:
  push:
    branches:
      - phase4-relocation-tools

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-relocation-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated route tree if changed
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "routeTree.gen.ts already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "Regenerate TanStack route tree"
          git push origin HEAD:phase4-relocation-tools
