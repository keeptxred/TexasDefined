name: Fishing verified source inventory review

on:
  pull_request:
    paths:
      - 'src/data/fishing/curated-access-sites.json'
      - 'src/components/fishing/FishingAccessDirectory.tsx'
      - 'scripts/ci/verify-fishing-live-content.mjs'
      - 'src/data/fishing/curated-fishing-guide-businesses.json'
      - 'src/data/fishing/curated-inventory.ts'
      - 'src/data/fishing/curated-historical-reports.ts'
      - 'src/data/fishing/index.ts'
      - 'src/data/fishing/statewide-lake-network.ts'
      - 'src/data/fishing/reused-statewide-access.ts'
      - 'src/data/fishing/access-kind.ts'
      - 'src/data/fishing/showcase-lakes-prototype.ts'
      - 'scripts/data/fishing-access-kind.test.mjs'
      - 'scripts/data/validate-fishing-inventory-expansion.mjs'
      - 'scripts/ci/audit-fishing-inventory-sources.mjs'
      - 'scripts/ci/fishing-operator-source-witnesses.mjs'
      - 'scripts/ci/fishing-operator-source-witnesses.test.mjs'
      - 'scripts/ci/fishing-access-source-witnesses.json'
      - 'scripts/ci/run-bounded-source-checks.mjs'
      - 'scripts/ci/test-run-bounded-source-checks.mjs'
      - '.github/workflows/fishing-source-inventory.yml'
  schedule:
    - cron: '23 14 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify sources, catalog relationships and index protections
        run: node scripts/data/validate-fishing-inventory-expansion.mjs
      - name: Regress real access types and TPWD-backed corrections
        run: node --experimental-strip-types --test scripts/data/fishing-access-kind.test.mjs
      - name: Verify source-review concurrency, coverage and fail-closed behavior
        run: node scripts/ci/test-run-bounded-source-checks.mjs
      - name: Require exact first-party fishing guide identity witnesses
        run: node --test scripts/ci/fishing-operator-source-witnesses.test.mjs

  source-review:
    # Alternate no-cost public GitHub network vantage for operator sites that
    # time out from x64 runners; keep full 58-source identity checks intact.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check official TPWD facilities and first-party guide websites
        id: audit
        continue-on-error: true
        run: node --experimental-strip-types scripts/ci/audit-fishing-inventory-sources.mjs
      - name: Diagnose first-party operator HTTP transport without overriding source failures
        if: github.event_name == 'pull_request' && steps.audit.outcome == 'failure'
        run: |
          for url in \
            https://txfishingguide.com/trips-and-charters/lake-texoma-striper-trips/ \
            https://www.rayburncountry.com/prices/; do
            echo "::group::Official operator IPv4 diagnostic: $url"
            body="$(mktemp)"
            curl --ipv4 --http1.1 --location --max-redirs 2 \
              --proto '=https' --proto-redir '=https' \
              --connect-timeout 6 --max-time 16 \
              --user-agent 'TexasDefinedSourceIntegrity/1.0 (+https://texasdefined.com/fishing)' \
              --silent --show-error --output "$body" \
              --write-out 'http=%{http_code} effective=%{url_effective} bytes=%{size_download} remote_ip=%{remote_ip} ssl_verify=%{ssl_verify_result}\\n' \
              "$url" || echo 'Official-operator IPv4 request failed; source remains unverified'
            echo 'Response preview (never treated as verified):'
            head -c 400 "$body" | tr '\\n' ' ' || true
            rm -f "$body"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishing-inventory-source-review
          path: .artifacts/fishing-inventory-sources.json
          if-no-files-found: warn
          retention-days: 14
      - name: File an actionable source drift checkpoint
        if: steps.audit.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue=$(gh issue list --state open --search 'Fishing source inventory drift in:title' --json number --jq '.[0].number // empty')
          url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The official-source inventory check found an unreachable provider or a TPWD source/facility-name mismatch. Inspect the downloadable fishing-inventory-source-review artifact. No unverified records have been silently promoted or altered. Run: $url"
          if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body";
          else gh issue create --title 'Fishing source inventory drift' --body "$body" --label documentation || gh issue create --title 'Fishing source inventory drift' --body "$body";
          fi
      - name: Preserve failure state when sources change
        if: steps.audit.outcome == 'failure'
        run: exit 1
