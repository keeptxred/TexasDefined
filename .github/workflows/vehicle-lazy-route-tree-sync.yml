name: Temporary vehicle lazy route-tree sync

on:
  push:
    branches:
      - fix/vehicle-authority-tanstack-lazy-2026-09-16
    paths:
      - .github/workflows/vehicle-lazy-route-tree-sync.yml

permissions:
  contents: write

jobs:
  sync-route-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/vehicle-authority-tanstack-lazy-2026-09-16
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate route tree through production build
        run: npm run build

      - name: Verify specialist lazy wiring
        run: |
          grep -F "import('./routes/texas-vehicle-registration-renewal.lazy')" src/routeTree.gen.ts
          grep -F "import('./routes/texas-vehicle-registration-fees-taxes.lazy')" src/routeTree.gen.ts

      - name: Commit generated tree and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git rm .github/workflows/vehicle-lazy-route-tree-sync.yml
          git diff --cached --exit-code && { echo "Expected generated route-tree changes were not produced"; exit 1; } || true
          git commit -m "Commit generated vehicle lazy routes"
          git push origin HEAD:fix/vehicle-authority-tanstack-lazy-2026-09-16
