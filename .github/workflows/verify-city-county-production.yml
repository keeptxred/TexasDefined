name: Verify city/county live CSV and responsive Chrome
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/verify-city-county-live.mjs'
      - '.github/workflows/verify-city-county-production.yml'
  workflow_run:
    workflows: ['Deploy TexasDefined production']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: city-county-live-${{ github.event.workflow_run.head_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Check that completed deployment changed this scoped feature
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]] || git diff --name-only HEAD^ HEAD -- \
            src/data/city-county-relationships.ts src/data/texas-places.ts \
            src/routes/texas-data.city-county-relationships.tsx \
            'src/routes/texas-data.city-county-relationships[.]csv.ts' \
            scripts/ci/verify-city-county-live.mjs .github/workflows/verify-city-county-production.yml | grep -q .; then
            echo 'changed=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=no' >> "$GITHUB_OUTPUT"
            echo 'No city/county changes in this production deploy; no unrelated audit.'
          fi
      - name: Set up Node.js
        if: steps.scope.outputs.changed == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check verifier syntax
        if: steps.scope.outputs.changed == 'yes'
        run: node --check scripts/ci/verify-city-county-live.mjs
      - name: Install isolated Chrome driver at no added service cost
        if: steps.scope.outputs.changed == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/td-county-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify live CSV, JSON-LD, county links and three Chrome viewports
        if: steps.scope.outputs.changed == 'yes'
        env:
          TARGET_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: node scripts/ci/verify-city-county-live.mjs
      - name: Preserve CSV, responsive screenshots and structured report
        if: always() && steps.scope.outputs.changed == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: city-county-live-${{ github.run_id }}
          path: artifacts/city-county-production/
          if-no-files-found: warn
          retention-days: 14
