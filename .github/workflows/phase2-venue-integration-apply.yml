          '''
          guide = re.sub(r'^          ', '', guide, flags=re.M)
          Path('src/data/sports-venue-guide-pilots.ts').write_text(guide)

          registry_path = Path('public/stay-nearby-hotels.json')
          registry = json.loads(registry_path.read_text())
          registry['reviewedAt'] = '2026-09-11'
          additions = [
            {
              'id': 'w-dallas', 'name': 'W Dallas', 'city': 'Dallas', 'area': 'Victory Park',
              'neighborhoods': ['victory-park'], 'status': 'active', 'coordinates': None, 'image': None,
              'bookingTargets': [{'provider': 'expedia', 'affiliateUrl': None, 'verified': False}],
              'contexts': [{'kind': 'venue', 'key': 'american-airlines-center', 'rank': 1,
                'geographicContext': 'Victory Park',
                'proximity': 'Marriott says American Airlines Center is across the street from the hotel’s front door.',
                'differentiator': 'A full-service Victory Park stay immediately beside the arena and its dining and entertainment district.',
