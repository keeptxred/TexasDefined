          };

          const SPORTS_VENUE_GUIDE_PILOTS: Record<string, SportsVenueGuidePilot> = {
            "amon-g-carter-stadium": {
              canonicalPath: "/sports-venue/amon-g-carter-stadium",
              city: "Fort Worth",
