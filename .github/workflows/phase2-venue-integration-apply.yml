              'neighborhoods': ['downtown-dallas'], 'status': 'active', 'coordinates': None, 'image': None,
              'bookingTargets': [{'provider': 'expedia', 'affiliateUrl': None, 'verified': False}],
              'contexts': [{'kind': 'venue', 'key': 'american-airlines-center', 'rank': 2,
                'geographicContext': 'Downtown Dallas',
                'proximity': 'Hilton describes the hotel as under a mile from American Airlines Center.',
                'differentiator': 'An all-suite downtown option with in-room kitchens and free breakfast for longer event stays.',
                'source': {'url': 'https://www.hilton.com/en/hotels/dalelhw-homewood-suites-dallas-downtown-tx/', 'verifiedAt': '2026-09-11'}}],
            },
            {
              'id': 'hilton-anatole', 'name': 'Hilton Anatole', 'city': 'Dallas', 'area': 'Market Center',
              'neighborhoods': ['market-center'], 'status': 'active', 'coordinates': None, 'image': None,
              'bookingTargets': [{'provider': 'expedia', 'affiliateUrl': None, 'verified': False}],
              'contexts': [{'kind': 'venue', 'key': 'american-airlines-center', 'rank': 3,
                'geographicContext': 'Market Center / Stemmons Corridor',
                'proximity': 'Hilton’s location page lists American Airlines Center one mile from the hotel.',
                'differentiator': 'A larger resort-style Dallas base with indoor and outdoor pools north of the arena district.',
                'source': {'url': 'https://www.hilton.com/en/hotels/dfwanhh-hilton-anatole/hotel-location/', 'verifiedAt': '2026-09-11'}}],
            },
            {
              'id': 'tru-northlake-fort-worth', 'name': 'Tru by Hilton Northlake Fort Worth', 'city': 'Northlake', 'area': 'Speedway / Northlake',
              'neighborhoods': ['northlake', 'speedway'], 'status': 'active', 'coordinates': None, 'image': None,
              'bookingTargets': [{'provider': 'expedia', 'affiliateUrl': None, 'verified': False}],
              'contexts': [{'kind': 'venue', 'key': 'texas-motor-speedway', 'rank': 1,
                'geographicContext': 'Northlake / Speedway corridor',
                'proximity': 'Hilton says the hotel is across I-35W from Texas Motor Speedway and within a mile drive.',
                'differentiator': 'A race-weekend-focused option with free hot breakfast and free parking near the track.',
                'source': {'url': 'https://www.hilton.com/en/hotels/ftwnlru-tru-northlake-fort-worth/', 'verifiedAt': '2026-09-11'}}],
            },
            {
              'id': 'home2-suites-fort-worth-northlake', 'name': 'Home2 Suites by Hilton Fort Worth Northlake', 'city': 'Northlake', 'area': 'Speedway / Northlake',
              'neighborhoods': ['northlake', 'speedway'], 'status': 'active', 'coordinates': None, 'image': None,
              'bookingTargets': [{'provider': 'expedia', 'affiliateUrl': None, 'verified': False}],
              'contexts': [{'kind': 'venue', 'key': 'texas-motor-speedway', 'rank': 2,
                'geographicContext': 'Northlake / Raceway Drive',
                'proximity': 'Hilton describes Texas Motor Speedway as across the street and lists it one mile away.',
                'differentiator': 'An extended-stay option with in-room kitchens, free breakfast and free parking.',
                'source': {'url': 'https://www.hilton.com/en/hotels/dfwnlht-home2-suites-fort-worth-northlake/hotel-location/', 'verifiedAt': '2026-09-11'}}],
            },
            {
              'id': 'holiday-inn-express-fort-worth-north-northlake', 'name': 'Holiday Inn Express & Suites Fort Worth North - Northlake', 'city': 'Northlake', 'area': 'Speedway / Northlake',
              'neighborhoods': ['northlake', 'speedway'], 'status': 'active', 'coordinates': None, 'image': None,
              'bookingTargets': [{'provider': 'expedia', 'affiliateUrl': None, 'verified': False}],
              'contexts': [{'kind': 'venue', 'key': 'texas-motor-speedway', 'rank': 3,
                'geographicContext': 'Northlake / Raceway Drive',
                'proximity': 'IHG says Texas Motor Speedway is about one mile from the hotel.',
                'differentiator': 'A practical race-weekend stay with complimentary hot breakfast, free parking and an outdoor pool.',
                'source': {'url': 'https://www.ihg.com/holidayinnexpress/hotels/us/en/northlake/dfwnl/hoteldetail', 'verifiedAt': '2026-09-11'}}],
            },
          ]
          existing_ids = {item['id'] for item in registry['properties']}
          for item in additions:
              if item['id'] not in existing_ids:
                  registry['properties'].append(item)
          registry_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n')

          expedia_path = Path('scripts/data/validate-expedia-affiliate.mjs')
          expedia = expedia_path.read_text()
          expedia = expedia.replace(
              "    ['globe-life-field', 3],\n  ]);",
              "    ['globe-life-field', 3],\n    ['american-airlines-center', 3],\n    ['texas-motor-speedway', 3],\n  ]);",
              1,
          )
          expedia = expedia.replace(
              'three-card venue pilots are complete',
              'five three-card venue pilots are complete',
              1,
          )
          expedia_path.write_text(expedia)

          smoke_path = Path('scripts/ci/verify-stay-nearby-production.mjs')
          smoke = smoke_path.read_text()
          pilots = '''const pilots = [
            {
              key: 'amon-g-carter-stadium',
              route: '/sports-venue/amon-g-carter-stadium',
              pageMarker: 'Amon G. Carter Stadium',
              guideIntegrated: true,
              hotels: [
                'Courtyard Fort Worth University Drive',
                'Hilton Garden Inn Fort Worth Medical Center',
                'Homewood Suites by Hilton Fort Worth Medical Center, TX',
              ],
            },
            {
              key: 'gerald-j-ford-stadium',
              route: '/sports-venue/gerald-j-ford-stadium',
              pageMarker: 'Gerald J. Ford Stadium',
              guideIntegrated: true,
              hotels: [
                'Graduate by Hilton Dallas',
                'The Highland Dallas, Curio Collection by Hilton',
                'Hotel Mockingbird, Dallas, a Tribute Portfolio Hotel',
              ],
            },
            {
              key: 'globe-life-field',
              route: '/sports-venue/globe-life-field',
              pageMarker: 'Globe Life Field',
              guideIntegrated: true,
              hotels: [
                'Live! by Loews – Arlington, TX',
                'Loews Arlington Hotel',
                'Drury Plaza Hotel Dallas Arlington',
              ],
            },
            {
              key: 'american-airlines-center',
              route: '/sports-venue/american-airlines-center',
              pageMarker: 'American Airlines Center',
              guideIntegrated: true,
              hotels: [
                'W Dallas',
                'Homewood Suites by Hilton Dallas Downtown, TX',
                'Hilton Anatole',
              ],
            },
            {
              key: 'texas-motor-speedway',
              route: '/sports-venue/texas-motor-speedway',
              pageMarker: 'Texas Motor Speedway',
              guideIntegrated: true,
              hotels: [
                'Tru by Hilton Northlake Fort Worth',
                'Home2 Suites by Hilton Fort Worth Northlake',
                'Holiday Inn Express & Suites Fort Worth North - Northlake',
              ],
            },
          ];'''
          pilots = re.sub(r'^          ', '', pilots, flags=re.M)
          smoke, count = re.subn(r'const pilots = \[.*?\n\];', pilots, smoke, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Failed to replace Stay Nearby production pilot registry')

          old_fallback = '''    const fallback = fallbackById.get(property.id);
              requireCondition(Boolean(fallback), `${property.name} is missing its production AI area-illustration fallback.`);
              requireCondition(fallback?.name === property.name, `${property.name} AI fallback record does not match the canonical property name.`);
              requireCondition(fallback?.kind === 'ai-area-illustration', `${property.name} AI fallback kind drifted.`);
              requireCondition(fallback?.depictsProperty === false, `${property.name} AI fallback must declare depictsProperty=false.`);
              requireCondition(fallback?.label === fallbackDisclosure, `${property.name} AI fallback disclosure drifted.`);
              requireCondition(/^\\/images\\/stay-nearby\\/ai\\/[a-z0-9-]+\\.svg$/.test(fallback?.url || ''), `${property.name} AI fallback is not a first-party SVG path.`);
              requireCondition(String(fallback?.alt || '').startsWith('AI-generated illustration'), `${property.name} AI fallback alt text does not disclose AI generation.`);
              requireCondition(!String(fallback?.alt || '').toLowerCase().includes(property.name.toLowerCase()), `${property.name} AI fallback alt text implies an exact property depiction.`);

              const svg = await fetchLive(fallback.url);
              requireCondition(svg.trimStart().startsWith('<svg'), `${property.name} AI fallback asset is not an SVG document.`);
              requireCondition(svg.includes('AI-generated area illustration, not a depiction of the hotel property.'), `${property.name} AI fallback SVG lacks its non-property description.`);
              requireCondition(!svg.toLowerCase().includes(property.name.toLowerCase()), `${property.name} AI fallback SVG contains the hotel name.`);
              requireCondition(!/<script\\b/i.test(svg) && !/<foreignObject\\b/i.test(svg) && !/<image\\b/i.test(svg) && !/\\bhref\\s*=/i.test(svg), `${property.name} AI fallback SVG contains disallowed markup.`);'''
          old_fallback = re.sub(r'^              ', '', old_fallback, flags=re.M)
          new_fallback = '''    const fallback = fallbackById.get(property.id);
              if (fallback) {
                requireCondition(fallback.name === property.name, `${property.name} AI fallback record does not match the canonical property name.`);
                requireCondition(fallback.kind === 'ai-area-illustration', `${property.name} AI fallback kind drifted.`);
                requireCondition(fallback.depictsProperty === false, `${property.name} AI fallback must declare depictsProperty=false.`);
                requireCondition(fallback.label === fallbackDisclosure, `${property.name} AI fallback disclosure drifted.`);
                requireCondition(/^\\/images\\/stay-nearby\\/ai\\/[a-z0-9-]+\\.svg$/.test(fallback.url || ''), `${property.name} AI fallback is not a first-party SVG path.`);
                requireCondition(String(fallback.alt || '').startsWith('AI-generated illustration'), `${property.name} AI fallback alt text does not disclose AI generation.`);
                requireCondition(!String(fallback.alt || '').toLowerCase().includes(property.name.toLowerCase()), `${property.name} AI fallback alt text implies an exact property depiction.`);

                const svg = await fetchLive(fallback.url);
                requireCondition(svg.trimStart().startsWith('<svg'), `${property.name} AI fallback asset is not an SVG document.`);
                requireCondition(svg.includes('AI-generated area illustration, not a depiction of the hotel property.'), `${property.name} AI fallback SVG lacks its non-property description.`);
                requireCondition(!svg.toLowerCase().includes(property.name.toLowerCase()), `${property.name} AI fallback SVG contains the hotel name.`);
                requireCondition(!/<script\\b/i.test(svg) && !/<foreignObject\\b/i.test(svg) && !/<image\\b/i.test(svg) && !/\\bhref\\s*=/i.test(svg), `${property.name} AI fallback SVG contains disallowed markup.`);
              } else {
                requireCondition(!property.image, `${property.name} has neither the approved AI fallback nor a safe text-only fallback path.`);
              }'''
          new_fallback = re.sub(r'^              ', '', new_fallback, flags=re.M)
          if old_fallback not in smoke:
              raise SystemExit('Expected AI fallback block not found in production verifier')
          smoke = smoke.replace(old_fallback, new_fallback, 1)
          smoke = smoke.replace(
              "    requireCondition(page.includes('href=\"/events\"'), `${pilot.route} did not expose the statewide event calendar link.`);",
              "    requireCondition(page.includes('View all events'), `${pilot.route} did not render the venue-scoped all-events action.`);\n    requireCondition(page.includes('View Calendar'), `${pilot.route} did not render the venue-scoped calendar action.`);\n    requireCondition(page.includes(`/events?venue=sports-venue%3A${pilot.key}`), `${pilot.route} did not expose its venue-prefiltered calendar deep link.`);",
              1,
          )
          smoke = smoke.replace(
              '`Stay Nearby production verification passed for ${pilots.length} pilot venue pages, including ${integratedGuidePilots} integrated venue guides, 9 visibly disclosed first-party AI area-illustration fallbacks, the live hotel registry, and the deferred affiliate bootstrap.`',
              '`Stay Nearby production verification passed for ${pilots.length} Phase 2 venue pages, including ${integratedGuidePilots} integrated venue guides, 9 optional visibly disclosed first-party AI area-illustration fallbacks, safe text-only fallback support for additional curated hotels, the live hotel registry, and the deferred affiliate bootstrap.`',
              1,
          )
          smoke_path.write_text(smoke)

          phase2_validator = '''import fs from 'node:fs';

          const read = (path) => fs.readFileSync(path, 'utf8');
          const route = read('src/routes/sports-venue.$slug.tsx');
          const guides = read('src/data/sports-venue-guide-pilots.ts');
          const guidePage = read('src/components/sports/SportsVenueGuidePage.tsx');
          const carousel = read('src/components/editorial/TexasEventCarousel.tsx');
          const carouselCss = read('src/components/editorial/texas-event-carousel.css');
          const eventFn = read('src/data/sports-venue-events.functions.ts');
          const eventRecords = read('src/data/events/texas-event-records.server.ts');
          const images = read('src/data/sports-venue-images.ts');
          const expedia = read('public/expedia-travel.js');
          const registry = JSON.parse(read('public/stay-nearby-hotels.json'));
          const failures = [];
          const requireText = (source, needle, label) => { if (!source.includes(needle)) failures.push(`${label}: missing ${needle}`); };

          const slugs = [
            'amon-g-carter-stadium',
            'gerald-j-ford-stadium',
            'globe-life-field',
            'american-airlines-center',
            'texas-motor-speedway',
          ];

          for (const slug of slugs) {
            requireText(route, `'${slug}'`, `${slug} route integration`);
            requireText(guides, `\"${slug}\"`, `${slug} guide facts`);
            requireText(guides, `canonicalPath: \"/sports-venue/${slug}\"`, `${slug} canonical path`);
            requireText(images, `'${slug}'`, `${slug} licensed hero image`);
            const hotelContexts = registry.properties.flatMap((property) =>
              (property.contexts || []).filter((context) => context.kind === 'venue' && context.key === slug)
                .map((context) => ({ property, context }))
            ).sort((a, b) => a.context.rank - b.context.rank);
            if (hotelContexts.length !== 3) failures.push(`${slug}: expected exactly 3 curated Stay Nearby cards, found ${hotelContexts.length}`);
            if (hotelContexts.map(({ context }) => context.rank).join(',') !== '1,2,3') failures.push(`${slug}: hotel ranks must be 1,2,3`);
          }

          for (const marker of [
            'Get Directions',
            'Official Venue Site',
            'TexasEventCarousel',
            'data-stay-nearby-slot',
            'Know before you go',
            'Venue story',
            'Nearby attractions',
            'Sources',
            'Last reviewed',
            'StadiumOrArena',
          ]) requireText(guidePage, marker, 'shared venue guide');

          for (const marker of ['EventTicketCta', 'ArrowLeft', 'ArrowRight', 'Home', 'End', 'aria-roledescription=\"carousel\"', 'View all events', 'View Calendar']) requireText(carousel, marker, 'event carousel accessibility/CTA');
          for (const marker of ['overflow-x: auto', 'scroll-snap-type: x mandatory', 'min-width: 84%', '@media (min-width: 640px)', '@media (min-width: 1024px)', 'calc(33.333% - .7rem)']) requireText(carouselCss, marker, 'event carousel responsive behavior');
          for (const marker of ['`sports-venue:${data.slug}`', 'encodeURIComponent(venueId)', '#calendar', 'limit: 9']) requireText(eventFn, marker, 'venue event query');
          for (const marker of ['timeZone: \"America/Chicago\"', 'startsOnOrAfter', '[\"scheduled\", \"postponed\"]']) requireText(eventRecords, marker, 'event expiration');
          for (const marker of ['Affiliate disclosure: TexasDefined may earn a commission from qualifying Expedia bookings', 'rel = \"sponsored noopener noreferrer\"', 'td-stay-media', 'displayComputedDistance']) requireText(expedia, marker, 'Stay Nearby disclosure/fallback');
          requireText(route, 'canonicalLink(texasDefinedBrand, canonicalPath)', 'venue canonical');
          requireText(guidePage, 'canonicalEntityPath(item)', 'nearby internal links');

          if (guides.includes('homeTeam: \"N/A\"') || guides.includes('homeTeam: \"None\"')) failures.push('Guide facts must omit nonexistent home teams instead of adding filler.');
          const tmsBlock = guides.split('"texas-motor-speedway": {')[1]?.split('\n  },\n};')[0] ?? '';
          if (tmsBlock.includes('homeTeam:')) failures.push('Texas Motor Speedway must not invent a home team.');

          if (failures.length) {
            console.error('Sports venue Phase 2 integration validation failed:');
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }

          console.log('Sports venue Phase 2 integration validation passed for five production candidates: shared responsive event/calendar/ticketing, real licensed venue imagery, verified quick facts, safe lodging fallbacks, internal linking, sources, canonicals and expiration behavior are wired without template filler.');
          '''
          phase2_validator = re.sub(r'^          ', '', phase2_validator, flags=re.M)
          Path('scripts/data/validate-sports-venue-phase2.mjs').write_text(phase2_validator)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          phase2_cmd = 'node scripts/data/validate-sports-venue-phase2.mjs'
          major = package['scripts']['major-events:validate']
          if phase2_cmd not in major:
              package['scripts']['major-events:validate'] = major + ' && ' + phase2_cmd
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          Path('.github/workflows/phase2-venue-integration-apply.yml').unlink()
          PY

      - name: Run focused integration validation
        run: |
          node scripts/data/validate-expedia-affiliate.mjs
          node scripts/data/validate-global-event-calendar.mjs
          node scripts/data/validate-sports-venue-phase2.mjs

