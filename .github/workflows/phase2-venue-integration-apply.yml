              city: "Fort Worth",
              subtitle: "North Fort Worth · Major NASCAR and motorsports venue",
              venueType: "1.5-mile motorsports speedway",
              playingSurface: "Asphalt oval · 1.5 miles · 58-foot minimum width",
              opened: "1997",
