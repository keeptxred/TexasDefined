name: Phase 2 venue integration apply

on:
  push:
    branches:
      - phase2/venue-system-integration-20260911

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2/venue-system-integration-20260911
          fetch-depth: 0

      - name: Apply Phase 2 integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]}")
              p.write_text(text.replace(old, new, 1))

          route_path = 'src/routes/sports-venue.$slug.tsx'
          replace_once(
              route_path,
              "const sportsVenueGuidePilotSlugs = new Set(['amon-g-carter-stadium', 'gerald-j-ford-stadium']);",
              """const sportsVenueGuidePilotSlugs = new Set([\n  'amon-g-carter-stadium',\n  'gerald-j-ford-stadium',\n  'globe-life-field',\n  'american-airlines-center',\n  'texas-motor-speedway',\n]);""",
          )

          guide = '''export type SportsVenueGuideSource = {
