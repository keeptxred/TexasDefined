name: Certify Hutchinson County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-hutchinson-county-once.yml'

permissions:
  contents: write

concurrency:
  group: certify-hutchinson-county-production
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HERO_URL: https://commons.wikimedia.org/wiki/Special:Redirect/file/Hutchinson_County_Texas_Courthouse.jpg?width=1600
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Certify current Hutchinson County source and production
        id: certify
        shell: bash
        run: |
          set +e
          git fetch origin main
          git reset --hard origin/main
          target='59d9d58a1c7e589b331bb101e89502d37eed8376'
          head="$(git rev-parse HEAD)"
          echo "target_sha=$target" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head" >> "$GITHUB_OUTPUT"
          : > /tmp/hutchinson-cert.log
          fail_stage=''
          hero_status=''; hero_mime=''; hero_bytes=''; page_status=''; legacy_status=''; legacy_location=''

          echo '=== source checks ===' | tee -a /tmp/hutchinson-cert.log
          git merge-base --is-ancestor "$target" HEAD || fail_stage='target-not-in-main'
          fixture='src/data/fixtures/hutchinson-county-borger-stinnett-adobe-walls-lake-meredith-panhandle-texas.ts'
          registry='src/data/county-series-profiles-panhandle.ts'
          test -f "$fixture" || fail_stage='source-fixture'
          grep -Fq 'countySlug: "hutchinson"' "$registry" || fail_stage='source-registry'
          grep -Fq 'Hutchinson County: Borger, Stinnett, Adobe Walls and Lake Meredith' "$fixture" || fail_stage='source-title'
          grep -Fq 'Hutchinson_County_Texas_Courthouse.jpg?width=1600' "$fixture" || fail_stage='source-hero'
          if grep -n 'www\.texasdefined\.com' "$fixture" "$registry" src/data/county-series.ts src/data/county-series.server.ts >> /tmp/hutchinson-cert.log; then fail_stage='canonical-host'; fi
          git diff --check >> /tmp/hutchinson-cert.log 2>&1 || fail_stage='git-diff-check'

          echo '=== hero source ===' | tee -a /tmp/hutchinson-cert.log
          hero_status="$(curl -A 'TexasDefined/1.0 (+https://texasdefined.com)' -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 -sS -D /tmp/hero-headers -o /tmp/hero-body -w '%{http_code}' "$HERO_URL" || true)"
          hero_mime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' /tmp/hero-headers | cut -d';' -f1)"
          hero_bytes="$(wc -c < /tmp/hero-body 2>/dev/null || echo 0)"
          echo "hero source: HTTP=$hero_status MIME=$hero_mime bytes=$hero_bytes" | tee -a /tmp/hutchinson-cert.log
          if [ "$hero_status" != '200' ] || ! [[ "$hero_mime" =~ ^image/(jpeg|png|webp)$ ]] || [ "$hero_bytes" -le 50000 ]; then fail_stage='hero-source'; fi

          if [ -z "$fail_stage" ]; then
            echo '=== npm run validate ===' | tee -a /tmp/hutchinson-cert.log
            npm run validate >> /tmp/hutchinson-cert.log 2>&1
            validate_code=$?
            echo "validate exit=$validate_code" | tee -a /tmp/hutchinson-cert.log
            [ "$validate_code" -eq 0 ] || fail_stage='validation'
          fi

          if [ -z "$fail_stage" ]; then
            git fetch origin main
            latest="$(git rev-parse origin/main)"
            current="$(git rev-parse HEAD)"
            if [ "$latest" != "$current" ]; then
              echo "main moved after validation: $current -> $latest" | tee -a /tmp/hutchinson-cert.log
              fail_stage='main-moved-after-validation'
            fi
          fi

          if [ -z "$fail_stage" ]; then
            echo '=== npm run deploy ===' | tee -a /tmp/hutchinson-cert.log
            npm run deploy >> /tmp/hutchinson-cert.log 2>&1
            deploy_code=$?
            echo "deploy exit=$deploy_code" | tee -a /tmp/hutchinson-cert.log
            [ "$deploy_code" -eq 0 ] || fail_stage='deployment'
          fi

          if [ -z "$fail_stage" ]; then
            echo '=== live county verification ===' | tee -a /tmp/hutchinson-cert.log
            origin='https://texasdefined.com'
            county='/county/hutchinson'
            expected_title='Hutchinson County: Borger, Stinnett, Adobe Walls and Lake Meredith'
            ok=0
            for attempt in $(seq 1 12); do
              page_status="$(curl -A 'TexasDefined/1.0 (+https://texasdefined.com)' --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o /tmp/hutchinson-page -w '%{http_code}' "$origin$county?verify=${head}-${GITHUB_RUN_ID}-$attempt" || true)"
              if [ "$page_status" = '200' ] \
                && grep -Fq "$expected_title" /tmp/hutchinson-page \
                && grep -Fq 'The county in numbers' /tmp/hutchinson-page \
                && grep -Fq 'County seat' /tmp/hutchinson-page \
                && grep -Fq '2020 population' /tmp/hutchinson-page \
                && grep -Fq 'County feature' /tmp/hutchinson-page \
                && grep -Fq 'Borger' /tmp/hutchinson-page \
                && grep -Fq 'Stinnett' /tmp/hutchinson-page \
                && grep -Fq 'https://texasdefined.com/county/hutchinson' /tmp/hutchinson-page; then ok=1; break; fi
              sleep 5
            done
            echo "county HTTP=$page_status structured_editorial=$ok" | tee -a /tmp/hutchinson-cert.log
            [ "$ok" -eq 1 ] || fail_stage='live-county'

            if [ -z "$fail_stage" ]; then
              legacy="$origin/article/hutchinson-county-borger-stinnett-adobe-walls-lake-meredith-panhandle-texas"
              legacy_status="$(curl -A 'TexasDefined/1.0 (+https://texasdefined.com)' --max-redirs 0 -sS -D /tmp/legacy-headers -o /dev/null -w '%{http_code}' "$legacy" || true)"
              legacy_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' /tmp/legacy-headers)"
              echo "legacy HTTP=$legacy_status location=$legacy_location" | tee -a /tmp/hutchinson-cert.log
              if ! [[ "$legacy_status" =~ ^30(1|8)$ ]] || [[ "$legacy_location" != *'/county/hutchinson'* ]]; then fail_stage='legacy-redirect'; fi
            fi
          fi

          if [ -z "$fail_stage" ]; then overall='pass'; else overall='fail'; fi
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          echo "fail_stage=$fail_stage" >> "$GITHUB_OUTPUT"
          echo "hero_status=$hero_status" >> "$GITHUB_OUTPUT"
          echo "hero_mime=$hero_mime" >> "$GITHUB_OUTPUT"
          echo "hero_bytes=$hero_bytes" >> "$GITHUB_OUTPUT"
          echo "page_status=$page_status" >> "$GITHUB_OUTPUT"
          echo "legacy_status=$legacy_status" >> "$GITHUB_OUTPUT"
          echo "legacy_location=$legacy_location" >> "$GITHUB_OUTPUT"
          echo "RESULT overall=$overall stage=${fail_stage:-none} target=$target head=$head" | tee -a /tmp/hutchinson-cert.log
          exit 0

      - name: Record certification diagnostics
        if: always()
        shell: bash
        env:
          OVERALL: ${{ steps.certify.outputs.overall }}
          FAIL_STAGE: ${{ steps.certify.outputs.fail_stage }}
          TARGET_SHA: ${{ steps.certify.outputs.target_sha }}
          HEAD_SHA: ${{ steps.certify.outputs.head_sha }}
          HERO_STATUS: ${{ steps.certify.outputs.hero_status }}
          HERO_MIME: ${{ steps.certify.outputs.hero_mime }}
          HERO_BYTES: ${{ steps.certify.outputs.hero_bytes }}
          PAGE_STATUS: ${{ steps.certify.outputs.page_status }}
          LEGACY_STATUS: ${{ steps.certify.outputs.legacy_status }}
          LEGACY_LOCATION: ${{ steps.certify.outputs.legacy_location }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p ops/certifications
          cp /tmp/hutchinson-cert.log ops/certifications/hutchinson-county-production.log
          cat > ops/certifications/hutchinson-county-production.json <<EOF
          {
            "county": "Hutchinson",
            "canonical": "https://texasdefined.com/county/hutchinson",
            "target_sha": "$TARGET_SHA",
            "head_sha": "$HEAD_SHA",
            "overall": "$OVERALL",
            "fail_stage": "$FAIL_STAGE",
            "hero_http": "$HERO_STATUS",
            "hero_mime": "$HERO_MIME",
            "hero_bytes": "$HERO_BYTES",
            "page_http": "$PAGE_STATUS",
            "legacy_http": "$LEGACY_STATUS",
            "legacy_location": "$LEGACY_LOCATION",
            "run_id": "$GITHUB_RUN_ID",
            "certified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          sed -i 's/^          //' ops/certifications/hutchinson-county-production.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ops/certifications/hutchinson-county-production.json ops/certifications/hutchinson-county-production.log
          git commit -m 'Record Hutchinson County production certification'
          git push origin HEAD:main
