name: Verify fishing photo governance

on:
  pull_request:
    paths:
      - "src/data/fishing/image-library.ts"
      - "src/data/fishing/lake-photo-governance.ts"
      - "src/components/fishing/FishingPhoto.tsx"
      - "scripts/data/validate-fishing-photo-governance.mjs"
      - ".github/workflows/verify-fishing-photo-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/data/validate-fishing-photo-governance.mjs
