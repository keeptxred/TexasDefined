name: Verify Texas industries evidence live

on:
  push:
    branches: [verify/texas-industries-labor-authority-20261110]
    paths:
      - '.github/workflows/verify-texas-industries-evidence-live.yml'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check fresh live HTML, self canonical, source values and indexing signals
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';

          const canonical = 'https://texasdefined.com/texas-industries';
          const hosts = ['https://texasdefined.com','https://texasdefined-site.freddy-coppola.workers.dev'];
          const expected = [
            'Is the Texas job market growing?',
            '14,461,300','154,300','1.1%','654,260','653,018','1,242',
            '6,880','6,459','14,366','November 10, 2026',
            'Business Employment Dynamics','The industries that power Texas'
          ];

          async function get(url) {
            let error;
            for (let attempt=1;attempt<=3;attempt++) {
              try {
                const response=await fetch(url, {
                  headers:{'User-Agent':'TexasDefined-GitHub-Live-Labor-Research-Verification/1.0','Cache-Control':'no-cache'},
                  redirect:'manual', signal:AbortSignal.timeout(22000)
                });
                if ([429,502,503,504].includes(response.status) && attempt<3) {
                  await new Promise(resolve=>setTimeout(resolve,attempt*650));
                  continue;
                }
                return {response,body:await response.text()};
              } catch(e) { error=e; if(attempt<3) await new Promise(resolve=>setTimeout(resolve,attempt*650)); }
            }
            throw error;
          }
          const evidence=[];
          for(const host of hosts) {
            const url=host+'/texas-industries';
            const {response,body}=await get(url);
            assert.equal(response.status,200,url+' must be 200');
            assert.match(response.headers.get('content-type')||'',/text\/html/,url+' must be HTML');
            const canonicalTags=[...body.matchAll(/<link\b[^>]*>/gi)].map(x=>x[0]).filter(x=>/\brel=["']canonical["']/i.test(x));
            assert.equal(canonicalTags.length,1,url+' must have exactly one canonical');
            assert(canonicalTags[0].includes('href="'+canonical+'"')||canonicalTags[0].includes("href='"+canonical+"'"),url+' canonical mismatch');
            assert(!/<meta\b[^>]*name=["']robots["'][^>]*content=["'][^"']*noindex/i.test(body),url+' has noindex');
            const visible=body.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,' ')
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,' ')
              .replace(/<[^>]*>/g,' ').replace(/&(?:nbsp|amp);/g,' ')
              .replace(/\s+/g,' ');
            for(const marker of expected) assert(visible.includes(marker),url+' missing visible official-source research marker: '+marker);
            assert(body.includes('https://lmi.twc.texas.gov/explore/LMI/LMI_emp.asp'),url+' lost TWC source link');
            assert(body.includes('https://www.bls.gov/regions/southwest/news-release/2026/businessemploymentdynamics_texas_20261030.htm'),url+' lost BLS source link');
            assert(/<h1\b/i.test(body),url+' lacks SSR H1');
            evidence.push('PASS '+url+' HTTP 200 / single self-canonical / no noindex / SSR H1 / all 14 visible research markers / TWC+BLS source URLs');
          }
          const {response:sresp,body:xml}=await get('https://texasdefined.com/sitemap.xml');
          assert.equal(sresp.status,200,'Primary sitemap status');
          assert(xml.includes('<loc>'+canonical+'</loc>'),'Primary sitemap omits retained industries URL');
          evidence.push('PASS primary XML sitemap lists existing /texas-industries canonical');
          const {response:rresp,body:robots}=await get('https://texasdefined.com/robots.txt');
          assert.equal(rresp.status,200,'robots HTTP 200');
          assert(!robots.includes('Disallow: /texas-industries'),'Explicit industries route block');
          evidence.push('PASS robots.txt contains no route-specific disallow');
          const summary='### Texas industries original labor-market analysis — live acceptance\n'+evidence.map(x=>'- '+x).join('\n')+'\n';
          console.log(summary);
          if(process.env.GITHUB_STEP_SUMMARY)appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          JS
