name: Merge Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: texasdefined-merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Required merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pull-request reruns are snapshots: GitHub can rerun an old merge commit even
      # after main has moved forward. Reconcile the latest protected base into the
      # workspace so validation always uses current shared CI/runtime fixes instead
      # of repeatedly exercising an obsolete harness. A real conflict fails here
      # immediately instead of surfacing later as a misleading validation failure.
      - name: Reconcile latest main into PR workspace
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit --no-commit origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Single source of truth: developers and CI run the same deterministic
      # pre-merge contract. Add future required checks to the runner, not here.
      - name: Run canonical pre-merge validation
        run: |
          set -o pipefail
          node scripts/ci/run-premerge-validation.mjs 2>&1 | tee canonical-premerge-output.txt

      - name: Publish required protected-branch status
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VALIDATED_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$REPOSITORY/statuses/$VALIDATED_SHA" \
            -f state='success' \
            -f context='Required merge gate' \
            -f description='Canonical Required merge gate passed' \
            -f target_url="$RUN_URL" >/dev/null
          echo "Published Required merge gate status for validated PR head $VALIDATED_SHA."
          # Branch protection may evaluate GitHub's synthetic PR merge commit rather
          # than the head commit. The canonical validation above runs against the
          # reconciled PR merge workspace; mark that checked-out merge SHA as well.
          if [ "$MERGE_SHA" != "$VALIDATED_SHA" ]; then
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPOSITORY/statuses/$MERGE_SHA" \
              -f state='success' \
              -f context='Required merge gate' \
              -f description='Canonical Required merge gate passed on PR merge ref' \
              -f target_url="$RUN_URL" >/dev/null
            echo "Published Required merge gate status for validated PR merge $MERGE_SHA."
          fi
          # GitHub may regenerate the synthetic PR merge SHA without changing its
          # content tree. Publish the required status for the CURRENT merge ref
          # only when its tree exactly matches the workspace that passed validation.
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/merge"
          CURRENT_MERGE_SHA="$(git rev-parse FETCH_HEAD)"
          CURRENT_MERGE_TREE="$(git rev-parse "$CURRENT_MERGE_SHA^{tree}")"
          VALIDATED_TREE="$(git write-tree)"
          if [ "$CURRENT_MERGE_TREE" = "$VALIDATED_TREE" ]; then
            if [ "$CURRENT_MERGE_SHA" != "$MERGE_SHA" ]; then
              gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                "repos/$REPOSITORY/statuses/$CURRENT_MERGE_SHA" \
                -f state='success' \
                -f context='Required merge gate' \
                -f description='Validated identical current PR merge tree' \
                -f target_url="$RUN_URL" >/dev/null
              echo "Published status for current identical-tree PR merge $CURRENT_MERGE_SHA."
            fi
          else
            echo "Current PR merge tree differs from validated workspace; refusing to publish an unvalidated status."
          fi

      # The pull-request REST read endpoint can return 404 to Actions' limited
      # GITHUB_TOKEN. Do not fail an otherwise successful canonical gate merely
      # because the optional merge-ref refresh API lookup is unavailable.
      - name: Check merge-ref refresh availability
        if: github.event_name == 'pull_request'
        shell: bash
        run: echo "Required merge gate already published status on validated PR head and checked-out synthetic merge ref."

      - name: Capture performance-budget failure details
        if: failure()
        run: npm run performance:validate > performance-budget-report.txt 2>&1 || true

      - name: Capture full-suite failure details
        if: failure()
        run: node scripts/ci/run-validation-suite.mjs full --collect-all > full-validation-report.txt 2>&1 || true

      - name: Upload canonical pre-merge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premerge-validation-report
          path: |
            premerge-validation-report.json
            canonical-premerge-output.txt
            performance-budget-report.txt
            full-validation-report.txt
            .artifacts/built-worker-ssr-smoke.log
          if-no-files-found: warn
          retention-days: 7

  protected-context:
    name: Required Merge Gate
    needs: required
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm canonical merge gate passed
        run: echo "Canonical Required merge gate completed successfully."
