name: Merge Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: texasdefined-merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Required merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Single source of truth: developers and CI run the same deterministic
      # pre-merge contract. Add future required checks to the runner, not here.
      - name: Run canonical pre-merge validation
        run: |
          set -o pipefail
          node scripts/ci/run-premerge-validation.mjs 2>&1 | tee canonical-premerge-output.txt

      - name: Capture performance-budget failure details
        if: failure()
        run: npm run performance:validate > performance-budget-report.txt 2>&1 || true

      - name: Capture full-suite failure details
        if: failure()
        run: node scripts/ci/run-validation-suite.mjs full --collect-all > full-validation-report.txt 2>&1 || true

      - name: Upload canonical pre-merge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premerge-validation-report
          path: |
            premerge-validation-report.json
            canonical-premerge-output.txt
            performance-budget-report.txt
            full-validation-report.txt
            .artifacts/built-worker-ssr-smoke.log
          if-no-files-found: warn
          retention-days: 7

  protected-context:
    name: Required Merge Gate
    needs: required
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm canonical merge gate passed
        run: echo "Canonical Required merge gate completed successfully."

      - name: Publish protected merge status
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/statuses/${VALIDATED_SHA}" \
            -f state='success' \
            -f context='Required merge gate' \
            -f description='Canonical pre-merge validation passed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
