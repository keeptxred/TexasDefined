name: Merge Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texasdefined-merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Required merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Single source of truth: developers and CI run the same deterministic
      # pre-merge contract. Add future required checks to the runner, not here.
      - name: Run canonical pre-merge validation
        run: node scripts/ci/run-premerge-validation.mjs

      - name: Capture performance budget diagnostic
        if: always()
        run: npm run performance:validate > performance-budget.log 2>&1 || true

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premerge-validation-diagnostics
          path: |
            premerge-validation-report.json
            performance-budget.log
          if-no-files-found: ignore
          retention-days: 1

  protected-context:
    name: Required Merge Gate
    needs: required
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm canonical merge gate passed
        run: echo "Canonical Required merge gate completed successfully."
