name: Merge Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texasdefined-merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Required merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Diagnostic-only wrapper: preserve the canonical runner and its exit
      # status while retaining stdout/stderr as a downloadable artifact.
      - name: Run canonical pre-merge validation
        id: canonical
        shell: bash
        run: |
          set +e
          node scripts/ci/run-premerge-validation.mjs 2>&1 | tee canonical-premerge.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload canonical validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-premerge-log
          path: canonical-premerge.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce canonical validation result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.canonical.outputs.exit_code }}" != "0" ]; then
            echo "Canonical pre-merge validation failed; see canonical-premerge-log artifact."
            exit 1
          fi
