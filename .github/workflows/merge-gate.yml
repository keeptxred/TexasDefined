name: Merge Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texasdefined-merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Required merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # The first Worker SSR render can legitimately be much slower than warm
      # route checks. Give only the readiness probe extra room; the actual
      # route assertions keep their normal strict request timeout and retries.
      BUILT_WORKER_SMOKE_STARTUP_TIMEOUT_MS: '120000'
      BUILT_WORKER_SMOKE_READINESS_REQUEST_TIMEOUT_MS: '60000'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Single source of truth: developers and CI run the same deterministic
      # pre-merge contract. Add future required checks to the runner, not here.
      - name: Run canonical pre-merge validation
        run: |
          set -o pipefail
          node scripts/ci/run-premerge-validation.mjs 2>&1 | tee canonical-premerge-output.txt

      # Do not rerun expensive suites after a failure. The canonical runner
      # already executes the full suite, build, SSR smoke, and performance
      # budget and records the complete failure set in this report.
      - name: Surface canonical failure summary
        if: failure()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'premerge-validation-report.json';
          if (!fs.existsSync(path)) process.exit(0);
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const lines = ['## Merge gate failures', ''];
          for (const failure of report.failures || []) {
            lines.push(`- **${failure.classification}** — ${failure.label}: \`${failure.command}\` (${failure.detail})`);
          }
          lines.push('', `Passed ${report.summary?.passed ?? 0}/${report.summary?.total ?? 0} canonical checks.`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Upload canonical pre-merge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premerge-validation-report
          path: |
            premerge-validation-report.json
            canonical-premerge-output.txt
            .artifacts/built-worker-ssr-smoke.log
          if-no-files-found: warn
          retention-days: 7

  protected-context:
    name: Required Merge Gate
    needs: required
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm canonical merge gate passed
        run: echo "Canonical Required merge gate completed successfully."
