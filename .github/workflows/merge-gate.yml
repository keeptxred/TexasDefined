name: Merge Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texasdefined-merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Required merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate retired integration traces
        run: node scripts/ci/validate-retired-integration-traces.mjs

      - name: Validate direct-main writer inventory
        run: node scripts/ci/validate-direct-main-writer-inventory.mjs

      - name: Validate consolidated county certifiers
        run: node scripts/ci/validate-county-certifier-consolidation.mjs

      - name: Validate automation main-write policy
        run: node scripts/ci/validate-automation-main-write-policy.mjs

      - name: Validate retired one-time certifications
        run: node scripts/ci/validate-retired-one-time-certifications.mjs

      - name: Run authoritative validation suite
        run: node scripts/ci/run-validation-suite.mjs full

      - name: Validate AdSense-facing finance content depth
        run: node scripts/data/validate-adsense-content-depth.mjs

      - name: Validate Texas Talent content depth
        run: node scripts/data/validate-texas-talent-content-depth.mjs

      - name: Validate Texas Talent launch-depth gate
        run: node scripts/data/validate-texas-talent-launch-depth-gate.mjs

      - name: Validate Texas Talent flagship depth wave
        run: node scripts/data/validate-texas-talent-flagship-depth.mjs

      - name: Validate Texas Talent flagship depth wave 2
        run: node scripts/data/validate-texas-talent-flagship-depth-wave2.mjs

      - name: Validate Texas Talent launch metadata
        run: node scripts/data/validate-texas-talent-launch-metadata.mjs

      - name: Validate Texas Talent reverse-link audit
        run: node scripts/data/validate-texas-talent-reverse-links.mjs

      - name: Validate Texas Talent public-style preview
        run: node scripts/data/validate-texas-talent-public-preview.mjs

      - name: Validate production predeploy gates
        run: node scripts/ci/run-validation-suite.mjs predeploy

      - name: Build production application
        run: npm run build

      - name: Diagnose main bundle at 1825000
        continue-on-error: true
        run: node -e "const fs=require('fs'),p='dist/client/assets';const f=fs.readdirSync(p).find(x=>/^main-.*\\.js$/.test(x));process.exit(fs.statSync(p+'/'+f).size<=1825000?0:1)"

      - name: Diagnose main bundle at 1830000
        continue-on-error: true
        run: node -e "const fs=require('fs'),p='dist/client/assets';const f=fs.readdirSync(p).find(x=>/^main-.*\\.js$/.test(x));process.exit(fs.statSync(p+'/'+f).size<=1830000?0:1)"

      - name: Diagnose main bundle at 1840000
        continue-on-error: true
        run: node -e "const fs=require('fs'),p='dist/client/assets';const f=fs.readdirSync(p).find(x=>/^main-.*\\.js$/.test(x));process.exit(fs.statSync(p+'/'+f).size<=1840000?0:1)"

      - name: Diagnose main bundle at 1850000
        continue-on-error: true
        run: node -e "const fs=require('fs'),p='dist/client/assets';const f=fs.readdirSync(p).find(x=>/^main-.*\\.js$/.test(x));process.exit(fs.statSync(p+'/'+f).size<=1850000?0:1)"

      - name: Diagnose stylesheet ceiling
        continue-on-error: true
        run: node -e "const fs=require('fs'),p='dist/client/assets';const a=fs.readdirSync(p).filter(x=>/^styles-.*\\.css$/.test(x));process.exit(a.every(f=>fs.statSync(p+'/'+f).size<=140000)?0:1)"

      - name: Validate client performance budget
        run: npm run performance:validate
