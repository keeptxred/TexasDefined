name: Merge Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: texasdefined-merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Required merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Commit generated partner route tree
        shell: bash
        run: |
          npm run build
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "Generated route tree already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "Commit generated partner route tree"
          git push origin "HEAD:${{ github.head_ref }}"

      # Single source of truth: developers and CI run the same deterministic
      # pre-merge contract. Add future required checks to the runner, not here.
      - name: Run canonical pre-merge validation
        shell: bash
        run: |
          mkdir -p tmp
          set -o pipefail
          node scripts/ci/run-premerge-validation.mjs 2>&1 | tee tmp/premerge-validation.log

      - name: Upload pre-merge diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-premerge-diagnostic
          path: tmp/premerge-validation.log
          if-no-files-found: error
          retention-days: 1
