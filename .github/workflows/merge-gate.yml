name: Merge Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texasdefined-merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Required merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Single source of truth: developers and CI run the same deterministic
      # pre-merge contract. Add future required checks to the runner, not here.
      - name: Run canonical pre-merge validation
        run: node scripts/ci/run-premerge-validation.mjs

      - name: Capture built client asset sizes
        if: always()
        run: |
          if [ -d dist/client/assets ]; then
            find dist/client/assets -maxdepth 1 -type f -printf '%f %s\n' | sort > client-asset-sizes.txt
          elif [ -d .output/public/assets ]; then
            find .output/public/assets -maxdepth 1 -type f -printf '%f %s\n' | sort > client-asset-sizes.txt
          else
            printf 'Client assets directory not found.\n' > client-asset-sizes.txt
          fi

      - name: Upload pre-merge diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premerge-validation-diagnostics
          path: |
            premerge-validation-report.json
            client-asset-sizes.txt
          if-no-files-found: warn

  protected-context:
    name: Required Merge Gate
    needs: required
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm canonical merge gate passed
        run: echo "Canonical Required merge gate completed successfully."
