name: Apply base event lifecycle on current main

on:
  push:
    branches:
      - agent/gsc-base-event-lifecycle-20260913

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gsc-base-event-lifecycle-20260913
          fetch-depth: 0
      - name: Apply lifecycle gate and regression guard
        run: |
          python - <<'PY'
          from pathlib import Path

          deps = Path('src/data/sitemap-dependencies.server.ts')
          d = deps.read_text()
          export_line = 'export { hasCurrentOrFutureConfirmedEventOccurrence } from "@/data/event-occurrence-lifecycle";\n'
          export_anchor = 'export { loadTemporalEventSitemapEntriesServer } from "@/data/event-temporal-sitemap.server";\n'
          if export_line not in d:
              if export_anchor not in d:
                  raise SystemExit('sitemap dependency export anchor missing')
              d = d.replace(export_anchor, export_line + export_anchor)
          deps.write_text(d)

          sitemap = Path('src/routes/sitemap[.]xml.ts')
          s = sitemap.read_text()
          destructure_line = '          hasCurrentOrFutureConfirmedEventOccurrence,\n'
          destructure_anchor = '          loadTemporalEventSitemapEntriesServer,\n'
          if destructure_line not in s:
              if destructure_anchor not in s:
                  raise SystemExit('sitemap dependency destructure anchor missing')
              s = s.replace(destructure_anchor, destructure_line + destructure_anchor)
          filter_line = '          .filter((event) => hasCurrentOrFutureConfirmedEventOccurrence(event))\n'
          chain_anchor = '        const majorEventSitemapEntries = majorEventIndexRecords\n'
          if filter_line not in s:
              if chain_anchor not in s:
                  raise SystemExit('major event sitemap chain anchor missing')
              s = s.replace(chain_anchor, chain_anchor + filter_line)
          sitemap.write_text(s)

          validator = Path('scripts/data/validate-event-occurrence-lifecycle.mjs')
          v = validator.read_text()
          if "const sitemap = read('src/routes/sitemap[.]xml.ts');" not in v:
              route_line = "const route = read('src/routes/event.$slug.tsx');\n"
              if route_line not in v:
                  raise SystemExit('validator route anchor missing')
              v = v.replace(route_line, route_line + "const sitemap = read('src/routes/sitemap[.]xml.ts');\n")
          if "const sitemapDeps = read('src/data/sitemap-dependencies.server.ts');" not in v:
              sitemap_line = "const sitemap = read('src/routes/sitemap[.]xml.ts');\n"
              v = v.replace(sitemap_line, sitemap_line + "const sitemapDeps = read('src/data/sitemap-dependencies.server.ts');\n")
          guard = '''if (!sitemapDeps.includes('export { hasCurrentOrFutureConfirmedEventOccurrence } from "@/data/event-occurrence-lifecycle";')) {\n  failures.push('Sitemap dependency barrel must export the event occurrence lifecycle gate.');\n}\n\nfor (const marker of [\n  'hasCurrentOrFutureConfirmedEventOccurrence',\n  '.filter((event) => hasCurrentOrFutureConfirmedEventOccurrence(event))',\n  '.filter((event) => hasCompliantMajorEventImageServer(event.slug))',\n]) {\n  if (!sitemap.includes(marker)) failures.push(`Base major-event sitemap lifecycle missing ${marker}.`);\n}\n\n'''
          if 'Base major-event sitemap lifecycle missing' not in v:
              marker = '// Behavioral guard for the calendar comparison used by the lifecycle helper.'
              if marker not in v:
                  raise SystemExit('validator behavior anchor missing')
              v = v.replace(marker, guard + marker)
          validator.write_text(v)
          PY
      - name: Run targeted lifecycle validation
        run: node scripts/data/validate-event-occurrence-lifecycle.mjs
      - name: Remove temporary workflow and commit final patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-base-event-lifecycle-current-main.yml
          git add src/data/sitemap-dependencies.server.ts src/routes/sitemap[.]xml.ts scripts/data/validate-event-occurrence-lifecycle.mjs
          git commit -m "Gate base event sitemap entries by lifecycle"
          git push origin HEAD:agent/gsc-base-event-lifecycle-20260913
