name: Apply base event lifecycle on current main

on:
  push:
    branches:
      - agent/gsc-base-event-lifecycle-20260913

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gsc-base-event-lifecycle-20260913
          fetch-depth: 0
      - name: Apply lifecycle gate and regression guard
        run: |
          python - <<'PY'
          from pathlib import Path

          sitemap = Path('src/routes/sitemap[.]xml.ts')
          s = sitemap.read_text()
          import_line = 'import { hasCurrentOrFutureConfirmedEventOccurrence } from "@/data/event-occurrence-lifecycle";\n'
          anchor = 'import { isEvergreenEventCollectionPath, loadEvergreenEventSitemapEntriesServer } from "@/data/event-evergreen-sitemap.server";\n'
          if import_line not in s:
              if anchor not in s:
                  raise SystemExit('sitemap import anchor missing')
              s = s.replace(anchor, anchor + import_line)
          filter_line = '          .filter((event) => hasCurrentOrFutureConfirmedEventOccurrence(event))\n'
          chain_anchor = '        const majorEventSitemapEntries = majorEventIndexRecords\n'
          if filter_line not in s:
              if chain_anchor not in s:
                  raise SystemExit('major event sitemap chain anchor missing')
              s = s.replace(chain_anchor, chain_anchor + filter_line)
          sitemap.write_text(s)

          validator = Path('scripts/data/validate-event-occurrence-lifecycle.mjs')
          v = validator.read_text()
          if "const sitemap = read('src/routes/sitemap[.]xml.ts');" not in v:
              route_line = "const route = read('src/routes/event.$slug.tsx');\n"
              if route_line not in v:
                  raise SystemExit('validator route anchor missing')
              v = v.replace(route_line, route_line + "const sitemap = read('src/routes/sitemap[.]xml.ts');\n")
          guard = '''for (const marker of [\n  'hasCurrentOrFutureConfirmedEventOccurrence',\n  '.filter((event) => hasCurrentOrFutureConfirmedEventOccurrence(event))',\n  '.filter((event) => hasCompliantMajorEventImageServer(event.slug))',\n]) {\n  if (!sitemap.includes(marker)) failures.push(`Base major-event sitemap lifecycle missing ${marker}.`);\n}\n\n'''
          if 'Base major-event sitemap lifecycle missing' not in v:
              marker = '// Behavioral guard for the calendar comparison used by the lifecycle helper.'
              if marker not in v:
                  raise SystemExit('validator behavior anchor missing')
              v = v.replace(marker, guard + marker)
          validator.write_text(v)
          PY
      - name: Run targeted lifecycle validation
        run: node scripts/data/validate-event-occurrence-lifecycle.mjs
      - name: Remove temporary workflow and commit final patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-base-event-lifecycle-current-main.yml
          git add src/routes/sitemap[.]xml.ts scripts/data/validate-event-occurrence-lifecycle.mjs
          git commit -m "Gate base event sitemap entries by lifecycle"
          git push origin HEAD:agent/gsc-base-event-lifecycle-20260913
