name: Validate TexasDefined

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!src/data/destination-curation-batch*.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texasdefined-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Post-merge/manual verification uses the exact same deterministic
      # contract as the protected PR Merge Gate. There is no second CI spec.
      - name: Run canonical validation contract
        run: node scripts/ci/run-premerge-validation.mjs
