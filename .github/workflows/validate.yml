name: Validate TexasDefined

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!src/data/destination-curation-batch*.ts"
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!src/data/destination-curation-batch*.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texasdefined-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate generated page quality
        run: node scripts/data/validate-generated-page-quality.mjs

      - name: Validate county property enrichment
        run: node scripts/data/validate-county-property-enrichment.mjs

      - name: Validate destination indexing policy
        run: node scripts/data/validate-destination-indexing-policy.mjs

      - name: Validate public route governance
        run: node scripts/data/validate-public-route-governance.mjs

      - name: Validate Made in Texas evidence
        run: node scripts/data/validate-made-in-texas-evidence.mjs

      - name: Validate Painted Churches search-intent coverage
        run: node scripts/data/validate-painted-church-search-intents.mjs

      - name: Validate indexation quality
        run: node scripts/data/validate-indexation-quality.mjs

      - name: Validate crawl demand
        run: node scripts/data/validate-crawl-demand.mjs

      - name: Validate freshness signals
        run: node scripts/data/validate-freshness-signals.mjs

      - name: Validate machine indexing
        run: node scripts/data/validate-machine-indexing.mjs

      - name: Validate Bing configuration
        run: node scripts/seo/validate-bing.mjs

      - name: Validate AEO answer layers
        run: node scripts/data/validate-aeo-answer-layers.mjs

      - name: Validate homepage SEO
        run: node scripts/data/validate-homepage-seo.mjs

      - name: Validate Texas Explained SEO
        run: node scripts/data/validate-texas-explained-seo.mjs

      - name: Validate Texas Explained depth
        run: node scripts/data/validate-texas-explained-depth.mjs

      - name: Validate Texas Explained river profiles
        run: node scripts/data/validate-texas-explained-river-profiles.mjs

      - name: Validate Texas Explained reservoir profiles
        run: node scripts/data/validate-texas-explained-reservoir-profiles.mjs

      - name: Validate Texas Explained road systems
        run: node scripts/data/validate-texas-explained-road-systems.mjs

      - name: Validate Explore category SEO
        run: node scripts/data/validate-explore-category-seo.mjs

      - name: Validate Explore region SEO
        run: node scripts/data/validate-explore-region-seo.mjs

      - name: Validate Explore topical authority
        run: node scripts/data/validate-explore-topical-authority.mjs

      - name: Validate statewide historic sites
        run: node scripts/data/validate-historic-sites.mjs

      - name: Validate historic-site evergreen guides
        run: node scripts/data/validate-historic-site-evergreen.mjs

      - name: Validate historic supporting guides
        run: node scripts/data/validate-historic-supporting-guides.mjs

      - name: Validate military history expansion
        run: node scripts/data/validate-military-history-expansion.mjs

      - name: Validate Things That Define Texas authority
        run: node scripts/data/validate-things-unique-to-texas.mjs

      - name: Validate Things That Define Texas deep-link coverage
        run: node scripts/data/validate-texas-icon-link-depth.mjs

      - name: Validate Texas food history authority
        run: node scripts/data/validate-texas-food-history.mjs

      - name: Validate Texas culture citation index and human guidance
        run: node scripts/data/validate-texas-culture-citation-index.mjs

      - name: Validate Texas weather authority
        run: node scripts/data/validate-texas-weather-authority.mjs

      - name: Validate Top 25 attraction authority
        run: node scripts/data/validate-top-attraction-authority.mjs

      - name: Validate Top 25 review freshness
        run: node scripts/data/validate-top-attraction-review-freshness.mjs

      - name: Validate article discovery SEO
        run: node scripts/data/validate-article-discover-seo.mjs

      - name: Validate author EEAT
        run: node scripts/data/validate-author-eeat.mjs

      - name: Validate entity template quality
        run: node scripts/data/validate-entity-template-quality.mjs

      - name: Validate image SEO
        run: node scripts/data/validate-image-seo.mjs

      - name: Validate editorial hero uniqueness site-wide
        run: node scripts/data/validate-editorial-image-duplicates.mjs --all

      - name: Validate search rendering performance
        run: node scripts/data/validate-search-rendering-performance.mjs

      - name: Validate content duplication
        run: node scripts/data/validate-content-duplication.mjs

      - name: Validate sitemap routes
        run: node scripts/data/validate-sitemap-routes.mjs

      - name: Validate internal-link discovery
        run: node scripts/data/validate-internal-link-discovery.mjs

      - name: Validate search-intent CTR
        run: node scripts/data/validate-search-intent-ctr.mjs

      - name: Validate citation magnets
        run: node scripts/data/validate-citation-magnets.mjs

      - name: Validate citation downloads
        run: node scripts/data/validate-citation-downloads.mjs

      - name: Validate SEO CI contract
        run: node scripts/data/validate-seo-ci-contract.mjs

      - name: Validate production data and migrated features
        run: npm run data:validate

      - name: Validate complete Trip Planner mapped coverage
        run: node scripts/data/audit-trip-planner-destinations.mjs --strict

      - name: Validate Phase 3 entity maintenance
        run: node scripts/data/validate-entity-maintenance.mjs

      - name: Validate sports venue, imagery, traffic, event links, editorial authority, discovery, partner and sponsorship operations
        run: |
          node scripts/data/validate-sports-venue-coverage.mjs
          node scripts/data/validate-sports-venue-deep-completeness.mjs
          node scripts/data/validate-sports-venue-images.mjs
          node scripts/data/validate-sports-traffic-readiness.mjs
          node scripts/data/validate-event-sports-venue-links.mjs
          node scripts/data/validate-sports-editorial-authority.mjs
          node scripts/data/validate-sports-venue-landings.mjs
          node scripts/data/validate-sports-venue-comparison.mjs
          node scripts/data/validate-sports-partner-operations.mjs
          node scripts/data/validate-sports-sponsorship.mjs

      - name: Validate shared platform core integration
        run: node scripts/data/validate-shared-platform-core.mjs

      - name: Build production application
        run: npm run build

      - name: Validate client performance budget
        run: npm run performance:validate