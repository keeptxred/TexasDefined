name: Validate TexasDefined

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texasdefined-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate production data and migrated features
        run: npm run data:validate

      - name: Validate Phase 3 entity maintenance
        run: node scripts/data/validate-entity-maintenance.mjs

      - name: Validate shared platform core integration
        run: node scripts/data/validate-shared-platform-core.mjs

      - name: Build production application
        run: npm run build
