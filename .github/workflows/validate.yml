name: Validate TexasDefined

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!src/data/destination-curation-batch*.ts"
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!src/data/destination-curation-batch*.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texasdefined-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate retired integration traces
        id: retired_integration
        run: node scripts/ci/validate-retired-integration-traces.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate direct-main writer inventory
        id: direct_writer_policy
        run: node scripts/ci/validate-direct-main-writer-inventory.mjs

      - name: Validate consolidated county certifiers
        id: county_certifier_policy
        run: node scripts/ci/validate-county-certifier-consolidation.mjs

      - name: Validate automation main-write policy
        id: automation_policy
        run: node scripts/ci/validate-automation-main-write-policy.mjs

      - name: Validate retired one-time certifications
        id: retirement_policy
        run: node scripts/ci/validate-retired-one-time-certifications.mjs

      - name: Validate permanent SEO content quality governance
        run: node scripts/data/validate-content-quality-governance.mjs

      - name: Validate Texas-vs state promotions
        id: texas_vs_promotion
        run: node scripts/data/validate-texas-vs-state-promotions.mjs

      - name: Run authoritative validation suite
        id: validation
        run: node scripts/ci/run-validation-suite.mjs full

      - name: Validate production predeploy gates
        id: predeploy
        run: node scripts/ci/run-validation-suite.mjs predeploy

      - name: Build production application
        id: build
        run: npm run build

      - name: Validate client performance budget
        id: budget
        run: npm run performance:validate

      - name: Summarize CI outcome
        if: always()
        shell: bash
        env:
          RETIRED_INTEGRATION_OUTCOME: ${{ steps.retired_integration.outcome }}
          DIRECT_WRITER_POLICY_OUTCOME: ${{ steps.direct_writer_policy.outcome }}
          COUNTY_CERTIFIER_POLICY_OUTCOME: ${{ steps.county_certifier_policy.outcome }}
          AUTOMATION_POLICY_OUTCOME: ${{ steps.automation_policy.outcome }}
          RETIREMENT_POLICY_OUTCOME: ${{ steps.retirement_policy.outcome }}
          TEXAS_VS_PROMOTION_OUTCOME: ${{ steps.texas_vs_promotion.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          PREDEPLOY_OUTCOME: ${{ steps.predeploy.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUDGET_OUTCOME: ${{ steps.budget.outcome }}
        run: |
          {
            echo '## TexasDefined CI result'
            echo
            echo '| Stage | Failure class | Outcome |'
            echo '|---|---|---|'
            echo "| Retired integration trace guard | RETIRED INTEGRATION | ${RETIRED_INTEGRATION_OUTCOME:-not-run} |"
            echo "| Direct-main writer inventory | CI / DEFAULT-BRANCH SAFETY | ${DIRECT_WRITER_POLICY_OUTCOME:-not-run} |"
            echo "| Consolidated county certifiers | CI / COUNTY CERTIFIER SAFETY | ${COUNTY_CERTIFIER_POLICY_OUTCOME:-not-run} |"
            echo "| Automation main-write policy | CI / AUTOMATION SAFETY | ${AUTOMATION_POLICY_OUTCOME:-not-run} |"
            echo "| Retired one-time certification policy | CI / RETIREMENT SAFETY | ${RETIREMENT_POLICY_OUTCOME:-not-run} |"
            echo "| Texas-vs state promotion gate | SEO / STATE EVIDENCE | ${TEXAS_VS_PROMOTION_OUTCOME:-not-run} |"
            echo "| Authoritative validation suite | CODE / CONTENT / SEO / DATA | ${VALIDATION_OUTCOME:-not-run} |"
            echo "| Production predeploy authority suite | PREDEPLOY AUTHORITY | ${PREDEPLOY_OUTCOME:-not-run} |"
            echo "| Production build | BUILD | ${BUILD_OUTCOME:-not-run} |"
            echo "| Client performance budget | BUNDLE BUDGET | ${BUDGET_OUTCOME:-not-run} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$RETIRED_INTEGRATION_OUTCOME" == 'failure' ]]; then
            echo '::error title=CI failure class: retired integration::A retired external integration trace was reintroduced into tracked current source.'
          elif [[ "$DIRECT_WRITER_POLICY_OUTCOME" == 'failure' ]]; then
            echo '::error title=CI failure class: default-branch safety::A workflow writes directly to main. TexasDefined workflow repository changes must go through validated branches/PRs.'
          elif [[ "$COUNTY_CERTIFIER_POLICY_OUTCOME" == 'failure' ]]; then
            echo '::error title=CI failure class: county certifier safety::The consolidated county-certification wrappers, source-read-only engine, evidence publisher, or county-specific contracts regressed.'
          elif [[ "$AUTOMATION_POLICY_OUTCOME" == 'failure' ]]; then
            echo '::error title=CI failure class: automation safety::An active automation workflow violated the protected main-write or image-review policy.'
          elif [[ "$RETIREMENT_POLICY_OUTCOME" == 'failure' ]]; then
            echo '::error title=CI failure class: retirement safety::A completed one-time county certification lost PASS evidence or regained write/deploy behavior.'
          elif [[ "$TEXAS_VS_PROMOTION_OUTCOME" == 'failure' ]]; then
            echo '::error title=CI failure class: Texas-vs promotion::A promoted Texas-vs state lost its evidence, source, freshness, audit-history, route-rendering, or sitemap-readiness contract.'
          elif [[ "$VALIDATION_OUTCOME" == 'failure' ]]; then
            echo '::error title=CI failure class: validation::A code/content/SEO/data validator failed. The exact validator and command are listed in the validation-suite summary above.'
          elif [[ "$PREDEPLOY_OUTCOME" == 'failure' ]]; then
            echo '::error title=CI failure class: predeploy authority::A production predeploy authority validator failed. The exact validator and command are listed in the validation-suite summary above.'
          elif [[ "$BUILD_OUTCOME" == 'failure' ]]; then
            echo '::error title=CI failure class: build::Application and predeploy validation passed; the production build failed.'
          elif [[ "$BUDGET_OUTCOME" == 'failure' ]]; then
            echo '::error title=CI failure class: bundle budget::Validation and build passed, but the protected client performance budget failed.'
          fi
