name: Deploy moving-to-Texas pillar once

on:
  push:
    branches:
      - ops/deploy-moving-pillar
    paths:
      - '.github/workflows/deploy-moving-pillar-once.yml'

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production bundle
        run: npm run build
      - name: Enforce existing client bundle budget
        run: npm run performance:validate
      - name: Deploy TexasDefined Worker
        run: npx wrangler deploy
      - name: Verify moving-to-Texas pillar is live
        shell: bash
        run: |
          set -euo pipefail
          url='https://texasdefined.com/article/moving-to-texas-what-nobody-tells-you'
          out="$(mktemp)"
          for attempt in 1 2 3 4 5 6; do
            echo "Fetch attempt $attempt"
            if curl --fail-with-body --silent --show-error --location --max-time 30 \
              "${url}?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" -o "$out"; then
              if grep -Fq 'The Texas relocation budget: what to price before you move' "$out" \
                && grep -Fq 'Your first 30 days in Texas' "$out" \
                && grep -Fq 'Frequently asked questions about moving to Texas' "$out"; then
                echo 'Moving-to-Texas pillar verified live in production.'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'New moving-to-Texas pillar content was not visible after deployment.' >&2
          head -c 2000 "$out" || true
          exit 1
