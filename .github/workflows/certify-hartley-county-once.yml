name: Certify Hartley County once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/certify-hartley-county-once.yml']

permissions:
  contents: read
  statuses: write

concurrency:
  group: certify-hartley-county-once
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      HERO_URL: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hartley_County_Courthouse_%28Built_1906%29_Channing%2C_Texas.jpg?width=1600'
      COUNTY_URL: 'https://texasdefined.com/county/hartley'
      LEGACY_URL: 'https://texasdefined.com/article/hartley-county-channing-xit-ranch-high-plains-texas'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Source gate
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -f src/data/fixtures/hartley-county-channing-xit-ranch-high-plains-texas.ts
          grep -Fq 'countySlug: "hartley"' src/data/county-series-profiles-panhandle.ts
          grep -Fq 'Hartley County: Channing, XIT Ranch Country and the Northwest Panhandle' src/data/fixtures/hartley-county-channing-xit-ranch-high-plains-texas.ts
          ! grep -R -n 'www\.texasdefined\.com' src/data/fixtures/hartley-county-channing-xit-ranch-high-plains-texas.ts src/data/county-series-profiles-panhandle.ts
      - name: Publish source result
        if: always()
        shell: bash
        run: |
          state='${{ steps.source.outcome }}'; [ "$state" = success ] || state=failure
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "{\"state\":\"$state\",\"context\":\"hartley-source\",\"description\":\"Hartley source/canonical-host gate: $state\"}" >/dev/null

      - name: Hero gate
        id: hero
        if: ${{ steps.source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"; headers="$(mktemp)"; trap 'rm -f "$tmp" "$headers"' EXIT
          ok=0
          for attempt in 1 2 3 4 5 6; do
            : > "$headers"
            if curl --fail-with-body --silent --show-error --location --retry 2 --retry-all-errors --max-time 45 -A 'TexasDefined county certification/1.0 (+https://texasdefined.com)' -D "$headers" "$HERO_URL" -o "$tmp"; then
              ctype="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); value=$0} END{sub(/^[^:]+:[[:space:]]*/,"",value); print value}' "$headers")"
              case "$ctype" in image/jpeg*|image/png*|image/webp*) ok=1; break;; esac
            fi
            sleep 4
          done
          test "$ok" = 1
          test "$(wc -c < "$tmp")" -gt 50000
      - name: Publish hero result
        if: always()
        shell: bash
        run: |
          state='${{ steps.hero.outcome }}'; [ "$state" = success ] || state=failure
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "{\"state\":\"$state\",\"context\":\"hartley-hero\",\"description\":\"Hartley hero HTTP/MIME gate: $state\"}" >/dev/null

      - name: Normal validation
        id: validation
        if: ${{ steps.hero.outcome == 'success' }}
        run: npm run validate
      - name: Publish validation result
        if: always()
        shell: bash
        run: |
          state='${{ steps.validation.outcome }}'; [ "$state" = success ] || state=failure
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "{\"state\":\"$state\",\"context\":\"hartley-validation\",\"description\":\"Hartley normal repository validation: $state\"}" >/dev/null

      - name: Current deployment
        id: deploy
        if: ${{ steps.validation.outcome == 'success' }}
        run: npm run deploy
      - name: Publish deployment result
        if: always()
        shell: bash
        run: |
          state='${{ steps.deploy.outcome }}'; [ "$state" = success ] || state=failure
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "{\"state\":\"$state\",\"context\":\"hartley-deploy\",\"description\":\"Hartley Wrangler deployment: $state\"}" >/dev/null

      - name: Live county page gate
        id: live
        if: ${{ steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"; trap 'rm -f "$page"' EXIT; ok=0
          for attempt in 1 2 3 4 5 6; do
            code="$(curl --silent --show-error --location --max-time 35 -o "$page" -w '%{http_code}' "${COUNTY_URL}?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$code" = 200 ] && grep -Fq 'Hartley County: Channing, XIT Ranch Country and the Northwest Panhandle' "$page" && grep -Fq 'County property-tax resources' "$page" && grep -Fq 'The county in numbers' "$page"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
      - name: Publish live result
        if: always()
        shell: bash
        run: |
          state='${{ steps.live.outcome }}'; [ "$state" = success ] || state=failure
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "{\"state\":\"$state\",\"context\":\"hartley-live\",\"description\":\"Hartley live structured/editorial page: $state\"}" >/dev/null

      - name: Legacy redirect gate
        id: redirect
        if: ${{ steps.live.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"; trap 'rm -f "$headers"' EXIT
          code="$(curl --silent --show-error --max-time 30 --output /dev/null --dump-header "$headers" --write-out '%{http_code}' "$LEGACY_URL")"
          test "$code" = 301
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$headers")"
          case "$location" in https://texasdefined.com/county/hartley*|/county/hartley*) ;; *) exit 1;; esac
      - name: Publish redirect result
        if: always()
        shell: bash
        run: |
          state='${{ steps.redirect.outcome }}'; [ "$state" = success ] || state=failure
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "{\"state\":\"$state\",\"context\":\"hartley-redirect\",\"description\":\"Hartley legacy 301 gate: $state\"}" >/dev/null

      - name: Publish overall success
        if: ${{ steps.redirect.outcome == 'success' }}
        shell: bash
        run: curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data '{"state":"success","context":"hartley-county-certification","description":"Hartley County fully certified"}' >/dev/null
      - name: Publish overall failure
        if: ${{ failure() }}
        shell: bash
        run: curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data '{"state":"failure","context":"hartley-county-certification","description":"Hartley County certification failed; see stage statuses"}' >/dev/null
