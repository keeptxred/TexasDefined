name: District 6-6A source freshness (no scores automation)

on:
  schedule:
    # Monthly editorial-source maintenance, not an automated scoreboard feed.
    - cron: '23 14 1 * *'
    # Weekly link/staleness checks during football season; no game scraping.
    - cron: '23 14 * 8-11 2'
  workflow_dispatch:
  push:
    paths:
      - 'src/components/sports/District6Guide.tsx'
      - 'src/data/high-school-football/district6-calendar-2026.ts'
      - 'src/routes/texas-high-school-football-districts_.$slug.tsx'
      - 'src/routes/texas-high-school-football-districts_.$slug.lazy.tsx'
      - 'scripts/ci/verify-district6-authority.mjs'
      - 'scripts/ci/verify-district6-production.mjs'
      - 'scripts/ci/verify-district6-responsive-browser.mjs'
      - '.github/workflows/check-district6-sources.yml'
  pull_request:
    paths:
      - 'src/components/sports/District6Guide.tsx'
      - 'src/data/high-school-football/district6-calendar-2026.ts'
      - 'src/routes/texas-high-school-football-districts_.$slug.tsx'
      - 'src/routes/texas-high-school-football-districts_.$slug.lazy.tsx'
      - 'scripts/ci/verify-district6-authority.mjs'
      - 'scripts/ci/verify-district6-production.mjs'
      - 'scripts/ci/verify-district6-responsive-browser.mjs'
      - '.github/workflows/check-district6-sources.yml'

permissions:
  contents: read
  issues: write

jobs:
  district-6-policy-and-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check district content policy and official sources
        id: verify
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node scripts/ci/verify-district6-authority.mjs --check-links
          else
            node scripts/ci/verify-district6-authority.mjs
          fi
        shell: bash
      - name: Create one review issue if official sources need attention
        if: steps.verify.outputs.review_needed == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          count="$(gh issue list --state open --search 'District 6-6A source review in:title' --json number --jq 'length')"
          if [[ "$count" == "0" ]]; then
            gh issue create --title 'District 6-6A source review' --body-file district6-source-review.md
          else
            echo "An open District 6 source-review issue already exists; no duplicate."
          fi

      # This bounded acceptance runs independently of the global production
      # deployment queue. It checks the already-published guide on both origins
      # and two actual mobile Chrome viewports, without importing sports data.
      - name: Verify District 6 public and direct Worker HTML
        run: node scripts/ci/verify-district6-production.mjs

      - name: Prepare one District 6 mobile Chrome cohort
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-wp-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1

      - name: Verify District 6 live 390px and 320px Chrome layout
        run: node scripts/ci/verify-district6-responsive-browser.mjs
