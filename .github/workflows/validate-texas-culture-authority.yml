name: Texas culture eleven-page authority validation

on:
  pull_request:
    paths:
      - 'src/routes/texas-capital-designations.tsx'
      - 'src/routes/texas-symbols*.tsx'
      - 'src/routes/texas-facts*.tsx'
      - 'src/routes/everything-bigger-in-texas.tsx'
      - 'src/routes/dallas-fort-worth-music-history*.tsx'
      - 'src/routes/things-unique-to-texas*.tsx'
      - 'src/data/texas-capital-designations-official.ts'
      - 'src/data/texas-icon-chapter-evidence.ts'
      - 'src/data/things-unique-to-texas*.ts'
      - 'src/data/priority-search-pages-public-services.ts'
      - 'src/data/texas-music-city-guides.ts'
      - 'src/components/editorial/TexasMusicCityGuide.tsx'
      - 'scripts/data/validate-texas-culture-authority.mjs'
      - 'scripts/data/validate-texas-icon-link-depth.mjs'
      - 'scripts/data/validate-things-unique-to-texas.mjs'
      - '.github/workflows/validate-texas-culture-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texas-culture-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Validate 11-page authority invariants
        run: |
          node scripts/data/validate-texas-culture-authority.mjs
          node scripts/data/validate-things-unique-to-texas.mjs
          node scripts/data/validate-texas-icon-link-depth.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build SSR route output and check client imports
        run: npm run build
      - name: Report validated content
        if: success()
        run: |
          {
            echo '### Texas culture authority validation passed'
            echo '- 94 official capital place designations: source, legal status and searchable registry'
            echo '- 250 editorial records: unique IDs and accurate category reassignment'
            echo '- Original evidence sections for food, brands, natural wonders and landmarks'
            echo '- Dallas–Fort Worth sourced history, Texas facts and symbols additions'
            echo '- Exact internal links, category data, source-level guards and SSR build'
            echo '- Google Search ranking and actual indexation are not guaranteed by passing this gate'
          } >> "$GITHUB_STEP_SUMMARY"
