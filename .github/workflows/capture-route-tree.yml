name: Capture generated route tree

on:
  pull_request:
    paths:
      - 'src/routes/**'
      - '.github/workflows/capture-route-tree.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: generated-route-tree
          path: src/routeTree.gen.ts
          if-no-files-found: error
