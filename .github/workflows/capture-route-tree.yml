name: Capture generated route tree

on:
  pull_request:
    paths:
      - 'src/routes/**'
      - '.github/workflows/capture-route-tree.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated route tree and remove capture workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routeTree.gen.ts
          git rm .github/workflows/capture-route-tree.yml
          git commit -m "Commit generated route tree for Devil's Sinkhole redirect"
          git push origin HEAD:${{ github.head_ref }}
