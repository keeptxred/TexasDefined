name: Site quality watchdog

on:
  schedule:
    - cron: '37 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write

concurrency:
  group: site-quality-watchdog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit editorial and data quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Validate homepage editorial diversity and concision
        run: |
          node --experimental-strip-types --test scripts/data/homepage-editorial.test.mjs
          node --experimental-strip-types --test scripts/data/homepage-reading-time.test.mjs
          node scripts/data/validate-homepage-seo.mjs
          node --test scripts/ci/verify-homepage-fresh-production.test.mjs
          node --test scripts/ci/audit-homepage-vitals.test.mjs

      - name: Verify fresh homepage SSR parity on both public origins
        id: homepage_live
        continue-on-error: true
        run: node scripts/ci/verify-homepage-fresh-production.mjs

      - name: Observe Google homepage field Core Web Vitals
        id: homepage_vitals
        continue-on-error: true
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/ci/audit-homepage-vitals.mjs

      - name: Run recurring site quality audit
        id: quality
        continue-on-error: true
        env:
          SITE_QUALITY_LIVE: '1'
        run: node scripts/data/run-site-quality-watch.mjs

      - name: Preserve quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-quality-report-${{ github.run_number }}
          path: |
            site-quality-report.md
            site-quality-report.json
            .artifacts/42-page-pair-production.json
            .artifacts/homepage-live-parity.json
            .artifacts/homepage-vitals-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Open or update watchdog issue
        if: github.event_name != 'pull_request' && (steps.quality.outcome == 'failure' || steps.homepage_live.outcome == 'failure' || steps.homepage_vitals.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[Site Quality] TexasDefined watchdog failures';
            const report = fs.readFileSync('site-quality-report.md', 'utf8').slice(0, 35000);
            const evidencePaths = ['.artifacts/homepage-live-parity.json', '.artifacts/homepage-vitals-evidence.json'];
            const evidence = evidencePaths.map(path => fs.existsSync(path) ? path + ':\n' + fs.readFileSync(path, 'utf8').slice(0, 6000) : path + ': not written').join('\n\n');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              'The recurring TexasDefined site-quality watchdog found one or more failures.',
              '',
              `Latest run: ${runUrl}`,
              '',
              report,
              '',
              'Homepage live SSR and official field-vitals evidence:',
              '```json',
              evidence,
              '```',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `The watchdog failed again. Latest run: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Close recovered watchdog issue
        if: github.event_name != 'pull_request' && steps.quality.outcome == 'success' && steps.homepage_live.outcome == 'success' && steps.homepage_vitals.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Site Quality] TexasDefined watchdog failures';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `The recurring quality audit is green again. Passing run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }

      - name: Fail workflow when any quality check fails
        if: steps.quality.outcome == 'failure' || steps.homepage_live.outcome == 'failure' || steps.homepage_vitals.outcome == 'failure'
        run: |
          echo "::error title=Site quality watchdog failed::Review quality, homepage live and field-vitals evidence in the report artifact and the linked issue."
          exit 1
      - name: Audit Dallas Black History live pages and sitemap links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/ci/check-dallas-black-history-production.mjs
