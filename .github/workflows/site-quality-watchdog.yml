name: Site quality watchdog

on:
  schedule:
    - cron: '37 12 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/site-quality-watchdog.yml'
      - 'scripts/data/run-site-quality-watch.mjs'
      - 'scripts/data/validate-*.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/site-quality-watchdog.yml'
      - 'scripts/data/run-site-quality-watch.mjs'
      - 'scripts/data/validate-*.mjs'

permissions:
  contents: read
  issues: write

concurrency:
  group: site-quality-watchdog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit editorial and data quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run recurring site quality audit
        id: quality
        continue-on-error: true
        run: node scripts/data/run-site-quality-watch.mjs

      - name: Preserve quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-quality-report-${{ github.run_number }}
          path: |
            site-quality-report.md
            site-quality-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Open or update watchdog issue
        if: github.event_name != 'pull_request' && steps.quality.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[Site Quality] TexasDefined watchdog failures';
            const report = fs.readFileSync('site-quality-report.md', 'utf8').slice(0, 50000);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              'The recurring TexasDefined site-quality watchdog found one or more failures.',
              '',
              `Latest run: ${runUrl}`,
              '',
              report,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `The watchdog failed again. Latest run: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Close recovered watchdog issue
        if: github.event_name != 'pull_request' && steps.quality.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Site Quality] TexasDefined watchdog failures';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `The recurring quality audit is green again. Passing run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }

      - name: Fail workflow when quality checks fail
        if: steps.quality.outcome == 'failure'
        run: exit 1
