name: Refresh food-truck route tree

on:
  push:
    branches:
      - feature/texas-food-trucks-300

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/texas-food-trucks-300
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate TanStack route tree
        run: npm run build

      - name: Commit generated route tree
        shell: bash
        run: |
          git add src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo "Route tree already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate TanStack route tree for food-truck routes"
          git push origin HEAD:feature/texas-food-trucks-300
