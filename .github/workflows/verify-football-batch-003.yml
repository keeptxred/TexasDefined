name: Football Batch 003 structural acceptance
on:
  pull_request:
    paths:
      - "docs/football-authority/**"
      - "src/data/high-school-football/program-editorial.ts"
      - "scripts/ci/verify-football-batch-003.mjs"
      - ".github/workflows/verify-football-batch-003.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Batch 003 registry, dossiers and editorial inventory
        run: node scripts/ci/verify-football-batch-003.mjs
      - name: Check Batch 003 browser test syntax without network or paid services
        run: node --check scripts/ci/verify-football-batch-003-browser.mjs
