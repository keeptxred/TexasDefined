name: Generate Phase 3 route tree

on:
  push:
    branches:
      - feat/phase3-canonical-regions-final

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase3-canonical-regions-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Commit generated route tree
        shell: bash
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "Route tree is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "Generate Phase 3 TanStack route tree"
          git push origin HEAD:feat/phase3-canonical-regions-final
