name: Dallas and routed news production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dallas-news-production-smoke.yml'
      - 'scripts/ci/verify-texasdefined-publication-production.mjs'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: dallas-news-production-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify Dallas and fishing guides in production
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            local path="$1"
            local output="$2"
            local separator='?'
            [[ "$path" == *'?'* ]] && separator='&'
            echo "Checking https://texasdefined.com${path}"
            curl --retry 3 --retry-connrefused --retry-delay 2 --max-time 45 -fsSL \
              "https://texasdefined.com${path}${separator}verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o "$output"
            test -s "$output" || { echo "Empty response for $path" >&2; exit 1; }
          }

          fetch /county/dallas /tmp/dallas.html
          grep -Fq 'Dallas County' /tmp/dallas.html
          grep -Fq 'https://texasdefined.com/county/dallas' /tmp/dallas.html
          grep -Fq 'Old Red Courthouse' /tmp/dallas.html
          grep -Fq 'The county in numbers' /tmp/dallas.html

          fetch /fishing/guides /tmp/fishing-guides.html
          grep -Eiq '(Fishing Guides|fishing guides|guide directory)' /tmp/fishing-guides.html
      - name: Verify a currently published routed-news article
        run: node scripts/ci/verify-texasdefined-publication-production.mjs
