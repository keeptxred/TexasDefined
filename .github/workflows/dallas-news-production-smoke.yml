name: Dallas and routed news production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dallas-news-production-smoke.yml'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: dallas-news-production-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Dallas, fishing guides and routed news in production
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            local path="$1"
            local output="$2"
            echo "Checking https://texasdefined.com${path}"
            curl --retry 3 --retry-connrefused --retry-delay 2 --max-time 45 -fsSL \
              "https://texasdefined.com${path}" -o "$output"
            test -s "$output" || { echo "Empty response for $path" >&2; exit 1; }
          }

          fetch /county/dallas /tmp/dallas.html
          grep -Fq 'Dallas County' /tmp/dallas.html || {
            echo 'Dallas County production route does not render Dallas County content.' >&2
            exit 1
          }
          grep -Fq 'https://texasdefined.com/county/dallas' /tmp/dallas.html || {
            echo 'Dallas County production route is missing its canonical URL.' >&2
            exit 1
          }

          fetch /fishing/guides /tmp/fishing-guides.html
          grep -Eiq '(Fishing Guides|fishing guides|guide directory)' /tmp/fishing-guides.html || {
            echo 'Fishing guide directory did not render recognizable guide content.' >&2
            exit 1
          }

          story='/news/2026-08-10-canyon-lake-full-capacity-recovery'
          expected='https://texasdefined.com/news/2026-08-10-canyon-lake-full-capacity-recovery'
          story_ready=false
          for attempt in $(seq 1 30); do
            if curl --max-time 45 -fsSL "https://texasdefined.com${story}" -o /tmp/story.html; then
              if grep -Fq 'Canyon Lake' /tmp/story.html && EXPECTED="$expected" python3 <<'PY'
          import os, re, sys
          html=open('/tmp/story.html', encoding='utf-8', errors='replace').read()
          canonicals=re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)', html, re.I)
          expected=os.environ['EXPECTED']
          if canonicals == [expected]:
              print(f'Routed Canyon Lake canonical verified: {canonicals[0]}')
              sys.exit(0)
          print(f'Production has not reached the single-canonical revision yet; got {canonicals!r}')
          sys.exit(1)
          PY
              then
                story_ready=true
                break
              fi
            fi
            echo "Routed-news deployment has not caught up yet (attempt $attempt/30); retrying."
            sleep 10
          done

          test "$story_ready" = true || {
            echo 'Production did not expose the corrected single canonical for the Canyon Lake story within the deployment-aware retry window.' >&2
            exit 1
          }

          fetch /news /tmp/news.html
          python3 <<'PY'
          import re
          html=open('/tmp/news.html', encoding='utf-8', errors='replace').read()
          canonicals=re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)', html, re.I)
          expected='https://texasdefined.com/news'
          assert canonicals == [expected], f'Expected exactly one news-index canonical {expected!r}; got {canonicals!r}'
          print('News index canonical verified.')
          PY

          echo 'Focused Dallas/news production smoke passed.'
