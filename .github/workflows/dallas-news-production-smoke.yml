name: Dallas and routed news production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dallas-news-production-smoke.yml'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: dallas-news-production-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Dallas, fishing guides and routed news in production
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            local path="$1"
            local output="$2"
            echo "Checking https://texasdefined.com${path}"
            curl --retry 3 --retry-connrefused --retry-delay 2 --max-time 45 -fsSL \
              "https://texasdefined.com${path}" -o "$output"
            test -s "$output" || { echo "Empty response for $path" >&2; exit 1; }
          }

          fetch /county/dallas /tmp/dallas.html
          grep -Fq 'Dallas County' /tmp/dallas.html || {
            echo 'Dallas County production route does not render Dallas County content.' >&2
            exit 1
          }
          grep -Fq 'https://texasdefined.com/county/dallas' /tmp/dallas.html || {
            echo 'Dallas County production route is missing its canonical URL.' >&2
            exit 1
          }

          fetch /fishing/guides /tmp/fishing-guides.html
          grep -Eiq '(Fishing Guides|fishing guides|guide directory)' /tmp/fishing-guides.html || {
            echo 'Fishing guide directory did not render recognizable guide content.' >&2
            exit 1
          }

          story='/news/2026-08-10-canyon-lake-full-capacity-recovery'
          routed_news_ready=false
          for attempt in $(seq 1 30); do
            story_status="$(curl --max-time 45 -sS -o /tmp/story.html -w '%{http_code}' "https://texasdefined.com${story}" || true)"
            news_status="$(curl --max-time 45 -sS -o /tmp/news.html -w '%{http_code}' 'https://texasdefined.com/news' || true)"
            if [ "$story_status" = "200" ] && [ "$news_status" = "200" ] && grep -Fq 'Canyon Lake' /tmp/story.html; then
              if python3 <<'PY'
          import re, sys

          def canonicals(path):
              html=open(path, encoding='utf-8', errors='replace').read()
              return re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)', html, re.I)

          story_expected='https://texasdefined.com/news/2026-08-10-canyon-lake-full-capacity-recovery'
          news_expected='https://texasdefined.com/news'
          story=canonicals('/tmp/story.html')
          news=canonicals('/tmp/news.html')
          if story == [story_expected] and news == [news_expected]:
              print(f'Routed story canonical verified: {story[0]}')
              print(f'News index canonical verified: {news[0]}')
              sys.exit(0)
          print(f'Production deployment incomplete: story canonicals={story!r}; news canonicals={news!r}')
          sys.exit(1)
          PY
              then
                routed_news_ready=true
                break
              fi
            else
              echo "Production route status/content not ready: story=$story_status news=$news_status"
            fi
            echo "Routed-news deployment has not fully caught up yet (attempt $attempt/30); retrying."
            sleep 10
          done

          test "$routed_news_ready" = true || {
            echo 'Production did not expose both corrected routed-news canonicals within the deployment-aware retry window.' >&2
            exit 1
          }

          echo 'Focused Dallas/news production smoke passed.'
