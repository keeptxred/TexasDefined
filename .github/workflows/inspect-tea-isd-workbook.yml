name: Inspect official TEA school tax workbook source
on:
  pull_request:
    paths:
      - 'scripts/data/inspect-tea-isd-workbook.py'
      - 'scripts/data/reconcile-tea-school-tax-history.py'
      - 'src/data/property/tea-isd-history.generated.json'
      - '.github/workflows/inspect-tea-isd-workbook.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  official-source-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Inspect source SHA, headers and Tolar identity, no mutations
        run: python scripts/data/inspect-tea-isd-workbook.py
      - name: Compare TEA fiscal-year data with existing Comptroller tax-year records
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ftkznprjljkhymknvhye.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/data/reconcile-tea-school-tax-history.py
      - name: Commit source-checked school tax allowlist to this PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add src/data/property/tea-isd-history.generated.json
          if ! git diff --cached --quiet; then
            git commit -m "data(tax): regenerate TEA exact/precision-qualified 2021-23 ISD rates"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "TEA generated matches unchanged"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-tea-isd-reconciliation
          path: /tmp/texasdefined/tea-isd-matches.json
          if-no-files-found: warn
          retention-days: 14
