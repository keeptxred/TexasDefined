name: Monitor Martin Creek RV primary sources and fire status

on:
  # Bootstrap the first source check when its monitor is released. Routine
  # destination copy edits must not retrigger external source checks.
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor-martin-creek-rv.yml'
      - 'scripts/data/check-martin-creek-rv-source-drift.mjs'
  schedule:
    - cron: "33 14 * * *"
    # February, May, August and November: slow-changing history, ecology, fisheries and licence checks.
    - cron: "17 15 15 2,5,8,11 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-martin-creek-rv
  cancel-in-progress: false

jobs:
  verify-primary-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Check both park guides: trails, lodging, campground, fire status, alerts and arrival rules"
        id: verify
        shell: bash
        env:
          MARTIN_CREEK_QUARTERLY: ${{ github.event.schedule == '17 15 15 2,5,8,11 *' || github.event_name == 'workflow_dispatch' }}
        run: |
          set +e
          node scripts/data/check-martin-creek-rv-source-drift.mjs
          result=$?
          if [ -s /tmp/martin-creek-rv-drift.txt ]; then
            echo "source_drift=true" >> "$GITHUB_OUTPUT"
            cat /tmp/martin-creek-rv-drift.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - name: Open one source-drift issue, without overwriting published facts
        if: always() && steps.verify.outputs.source_drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Martin Creek RV: official campsite facts or alerts need re-verification"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Martin Creek RV: official campsite facts or alerts need re-verification" in:title' --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/martin-creek-rv-drift.txt
          else
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/martin-creek-rv-drift.txt
            echo "Updated existing source-drift issue #$existing with current page/source pairs."
          fi
