name: Fishing live content acceptance

on:
  pull_request:
    paths:
      - 'scripts/ci/verify-fishing-live-content.mjs'
      - '.github/workflows/fishing-live-content-acceptance.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy TexasDefined production']
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify independently rendered live fishing pages
        run: node scripts/ci/verify-fishing-live-content.mjs
