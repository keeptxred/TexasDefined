name: Audit indexable static orphan links

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/data/audit-indexable-static-orphans.mjs'
      - '.github/workflows/audit-static-orphans.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce inbound-link graph coverage
        run: node scripts/data/audit-indexable-static-orphans.mjs --strict
