name: Certify Chambers County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-chambers-county-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Publish certification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"texasdefined-chambers-certification","description":"Checking Chambers County live page, redirect and hero"}' >/dev/null

      - name: Verify live Chambers County page, structured layer, redirect and hero
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          county='/county/chambers'
          legacy='/article/chambers-county-anahuac-trinity-bay-wallisville-gulf-coast-texas'
          expected_title='Chambers County: Anahuac, Trinity Bay and the Upper Texas Coast'
          hero='https://upload.wikimedia.org/wikipedia/commons/8/86/Anahuac_TX_Chambers_County_Courthouse_DSC_6313_ad.JPG'
          workdir="$(mktemp -d)"; trap 'rm -rf "$workdir"' EXIT

          ok=0
          for attempt in $(seq 1 20); do
            status="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$workdir/page" -w '%{http_code}' "$origin$county?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-$attempt")"
            if [ "$status" = '200' ] \
              && grep -Fq "$expected_title" "$workdir/page" \
              && grep -Fq 'The county in numbers' "$workdir/page" \
              && grep -Fq 'County seat' "$workdir/page" \
              && grep -Fq '2020 population' "$workdir/page" \
              && grep -Fq 'Anahuac' "$workdir/page"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = '1' || { echo 'Live Chambers County structured/editorial layers did not appear.' >&2; exit 1; }

          legacy_status="$(curl --max-redirs 0 -sS -D "$workdir/legacy-headers" -o /dev/null -w '%{http_code}' "$origin$legacy")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$workdir/legacy-headers")"
          test "$legacy_status" = '301'
          [[ "$location" == *'/county/chambers'* ]]

          hero_status="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$workdir/hero-headers" -o "$workdir/hero" -w '%{http_code}' "$hero")"
          hero_mime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$workdir/hero-headers" | cut -d';' -f1)"
          test "$hero_status" = '200'
          case "$hero_mime" in image/jpeg|image/png|image/webp) ;; *) echo "Live hero MIME invalid: $hero_mime" >&2; exit 1;; esac
          test "$(wc -c < "$workdir/hero")" -gt 50000
          echo "PASS county=$county structured=yes editorial=yes legacy=$legacy_status hero=$hero_status mime=$hero_mime"

      - name: Publish certification success
        if: ${{ steps.verify.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"texasdefined-chambers-certification","description":"Chambers page, structured layer, redirect and hero passed"}' >/dev/null

      - name: Publish certification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"texasdefined-chambers-certification","description":"Chambers live certification failed"}' >/dev/null
