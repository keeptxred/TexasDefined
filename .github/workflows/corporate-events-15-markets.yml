name: Corporate Events 15-Market Expansion Contracts
on:
  pull_request:
    paths:
      - 'src/data/corporate-events.ts'
      - 'src/data/corporate-event-market-search.ts'
      - 'src/components/events/CorporateEventMetroGuides.tsx'
      - 'src/routes/corporate-events.lazy.tsx'
      - 'src/routes/corporate-events.tsx'
      - 'scripts/data/validate-corporate-events.mjs'
      - 'scripts/data/validate-corporate-events-15-markets.mjs'
      - '.github/workflows/corporate-events-15-markets.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/corporate-events.ts'
      - 'src/data/corporate-event-market-search.ts'
      - 'src/components/events/CorporateEventMetroGuides.tsx'
      - 'src/routes/corporate-events.lazy.tsx'
      - 'src/routes/corporate-events.tsx'
      - 'scripts/data/validate-corporate-events.mjs'
      - 'scripts/data/validate-corporate-events-15-markets.mjs'
      - '.github/workflows/corporate-events-15-markets.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types scripts/data/validate-corporate-events.mjs
      - run: node --experimental-strip-types scripts/data/validate-corporate-events-15-markets.mjs
