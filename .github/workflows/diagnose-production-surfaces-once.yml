name: Diagnose TexasDefined production surfaces once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-production-surfaces-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check production surfaces independently
        shell: bash
        run: |
          set -u
          origin='https://texasdefined.com'
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          failed=0

          post_status() {
            local context="$1" state="$2" description="$3"
            python3 - "$state" "$context" "$description" > "$workdir/status.json" <<'PY'
          import json, sys
          print(json.dumps({"state": sys.argv[1], "context": sys.argv[2], "description": sys.argv[3]}))
          PY
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data-binary @"$workdir/status.json" >/dev/null
          }

          check() {
            local context="$1" path="$2" needle="$3"
            local out="$workdir/${context}.html"
            post_status "$context" pending "Checking ${path}"
            local ok=0
            for attempt in 1 2 3 4; do
              if curl --fail-with-body --silent --show-error --location --max-time 30 \
                "${origin}${path}?diag=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" -o "$out" \
                && grep -Fq "$needle" "$out"; then
                ok=1
                break
              fi
              sleep 3
            done
            if [[ "$ok" -eq 1 ]]; then
              post_status "$context" success "Production surface verified: ${path}"
            else
              post_status "$context" failure "Production surface failed: ${path}"
              failed=1
            fi
          }

          check td-live-home '/' 'Texas Defined'
          check td-live-moving '/article/moving-to-texas-what-nobody-tells-you' 'The quick answer: what should you know before moving to Texas?'
          check td-live-flag-history '/article/history-of-the-texas-flag' 'The Texas Flag: A History of the Lone Star'
          check td-live-flag-etiquette '/article/texas-flag-etiquette-display-guide' 'Texas Flag Etiquette: How to Display the Lone Star Flag Correctly'
          check td-live-symbols '/texas-symbols' "Texas's best-known symbol has a Republic-era story of its own."
          check td-live-painted '/explore/painted-churches' 'Painted Churches of Texas'
          check td-live-then-now '/explore/painted-churches/then-and-now' 'Texas Painted Churches, then and now.'
          check td-live-media '/explore/painted-churches/media' 'Watch the documentary. Follow the voices behind it.'
          check td-live-guides '/guides' 'Painted Churches of Texas'
          check td-live-historic '/explore/historic-sites' 'Painted Churches of Texas'
          check td-live-roadtrips '/explore/road-trips' 'Painted Churches routes'
          check td-live-smalltowns '/explore/small-towns' 'Painted Churches'

          exit "$failed"
