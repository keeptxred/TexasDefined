name: Research statewide Texas football finals and standings
on:
  workflow_dispatch:
  # Bootstrap actual public research immediately on merge; ongoing lookups use cron.
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-football-scores-brackets.yml'
      - 'scripts/data/inventory-statewide-football-scores.mjs'
      - 'scripts/data/research-statewide-football-scores.mjs'
  schedule:
    # 17:37 UTC is midday Central; check the day AFTER a game, not live.
    # Saturday year-round + Sunday-Friday August through December.
    - cron: '37 17 * * 6'
    - cron: '37 17 * 8-12 0-5'
  pull_request:
    paths:
      - 'scripts/data/inventory-statewide-football-scores.mjs'
      - 'scripts/data/inventory-statewide-football-scores.test.mjs'
      - 'scripts/data/validate-football-research-publication.test.mjs'
      - 'scripts/data/research-statewide-football-scores.mjs'
      - 'scripts/data/research-statewide-football-scores.test.mjs'
      - 'scripts/ci/validate-football-refresh-scheduling.test.mjs'
      - 'src/data/high-school-football/football-matchups.snapshot.json'
      - 'src/data/high-school-football/football-district*.ts'
      - 'src/data/high-school-football/program-editorial*.ts'
      - 'src/data/high-school-football/aubrey-*.snapshot.json'
      - '.github/workflows/refresh-football-scores-brackets.yml'
      - '.github/workflows/aubrey-verified-score-sync.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: statewide-football-public-results-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate statewide inventory and bounded public-source research
        run: |
          set -euo pipefail
          node --check scripts/data/inventory-statewide-football-scores.mjs
          node --check scripts/data/research-statewide-football-scores.mjs
          node --test scripts/data/inventory-statewide-football-scores.test.mjs
          node --test scripts/data/research-statewide-football-scores.test.mjs
          node --test scripts/data/validate-football-research-publication.test.mjs
          node --test scripts/ci/validate-football-refresh-scheduling.test.mjs
          node scripts/data/research-statewide-football-scores.mjs --validate
          node scripts/data/inventory-statewide-football-scores.mjs --inventory
      - name: Inventory all materially stale results and district standings
        if: github.event_name != 'pull_request'
        run: node scripts/data/inventory-statewide-football-scores.mjs --inventory
      - name: Search public reporting for unconfirmed completed games
        id: lookup
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/data/research-statewide-football-scores.mjs --research
      - name: Save evidence including every enrolled football page
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: statewide-football-public-score-research-${{ github.run_id }}
          path: artifacts/football-score-research/
          retention-days: 30
          if-no-files-found: warn
      - name: Update one source-backed statewide football review issue
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          issue_title='TexasDefined statewide football: day-after-game score research'
          body='artifacts/football-score-research/issue.md'
          if [[ ! -s "$body" ]]; then
            body='/tmp/football-research-failed.md'
            printf '# Statewide public football research could not finish\n\nInspect the job failure. No game result is inferred or published.\n' > "$body"
          fi
          printf '\n[Source workflow run](https://github.com/%s/actions/runs/%s) — full dated research JSON/Markdown artifact, including every eligible page.\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$body"
          prior="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$issue_title in:title" --json number,title --limit 100 --jq '.[] | select(.title=="TexasDefined statewide football: day-after-game score research") | .number' | head -n 1)"
          if [[ -n "$prior" ]]; then
            gh issue edit "$prior" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$issue_title" --body-file "$body"
          fi
      - name: Surface genuine lookup failure after saving diagnostics
        if: github.event_name != 'pull_request' && steps.lookup.outcome == 'failure'
        run: |
          echo '::error::Public-source research failed; inspect the artifact and GitHub issue.'
          exit 1
