name: Research Texas high-school football final scores and standings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-football-scores-brackets.yml'
      - 'scripts/data/audit-football-sitewide-public-scores.mjs'
      - 'scripts/data/audit-football-sitewide-public-scores.test.mjs'
  schedule:
    # 17:37 UTC = late morning / midday Central after the previous game day.
    # In-season: every day; off-season: Saturdays for historical corrections.
    - cron: '37 17 * 8-12 *'
    - cron: '37 17 * 1-7 6'
  pull_request:
    paths:
      - '.github/workflows/refresh-football-scores-brackets.yml'
      - 'scripts/data/audit-football-sitewide-public-scores.mjs'
      - 'scripts/data/audit-football-sitewide-public-scores.test.mjs'
      - 'scripts/ci/validate-football-refresh-scheduling.test.mjs'

permissions:
  contents: read
  issues: write

concurrency:
  group: football-public-score-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate 1268 teams, 192 districts and non-publishing contracts
        run: |
          node --check scripts/data/audit-football-sitewide-public-scores.mjs
          node --experimental-strip-types --test scripts/data/audit-football-sitewide-public-scores.test.mjs scripts/ci/validate-football-refresh-scheduling.test.mjs
      - name: Record full local stale-page inventory
        run: node --experimental-strip-types scripts/data/audit-football-sitewide-public-scores.mjs --audit
      - name: Preserve all affected URLs and overdue sources
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: football-public-score-inventory-${{ github.run_id }}
          path: artifacts/football-next-day-research/inventory.json
          retention-days: 30

  research:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Search bounded postgame public reporting for shard
        run: node --experimental-strip-types scripts/data/audit-football-sitewide-public-scores.mjs --research ${{ matrix.shard }} 8
      - name: Preserve dated public-source leads for each affected page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-score-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/football-next-day-research/shard-${{ matrix.shard }}/
          retention-days: 30
          if-no-files-found: error

  review:
    if: github.event_name != 'pull_request'
    needs: [validate,research]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: public-score-shard-*-${{ github.run_id }}
          path: artifacts/football-next-day-research/collected/
      - name: Aggregate complete source research and every affected canonical
        run: node --experimental-strip-types scripts/data/audit-football-sitewide-public-scores.mjs --summarize
      - name: Maintain one statewide football editorial verification issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='TexasDefined football: overdue finals and dated district standings public-source review'
          body='artifacts/football-next-day-research/summary.md'
          current="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json title,number --limit 100 --jq '.[] | select(.title=="TexasDefined football: overdue finals and dated district standings public-source review") | .number' | head -n 1)"
          if [[ -z "$current" ]]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
          else
            gh issue edit "$current" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          fi
      - name: Preserve merged research and source-linked review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-public-review-${{ github.run_id }}
          path: |
            artifacts/football-next-day-research/summary.json
            artifacts/football-next-day-research/summary.md
          retention-days: 30
          if-no-files-found: warn
