name: Refresh Texas football scores and brackets

on:
  workflow_dispatch:
  schedule:
    # During the season, run after Friday nights and again the next morning.
    # UTC; fall daylight transitions do not affect date-only final verification.
    - cron: '13 11 * 8-12 *'
    - cron: '17 5 * 8-12 *'
  pull_request:
    paths:
      - 'scripts/data/refresh-football-matchups.mjs'
      - 'src/data/high-school-football/football-matchups*'
      - '.github/workflows/refresh-football-scores-brackets.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: football-scores-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    # Do not silently skip when no authorized feed is configured: report the
    # deployment blocker to the owner and fail visibly instead.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax-check limited score adapter
        run: node --check scripts/data/refresh-football-matchups.mjs
      - name: Require an authorized football score feed and record setup blocker
        if: ${{ github.event_name != 'pull_request' && vars.FOOTBALL_RESULTS_FEED_URL == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='BLOCKED: TexasDefined football scores are not automatically updating'
          if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body 'The season score-refresh workflow is running, but FOOTBALL_RESULTS_FEED_URL is not set. District hubs (including 6A-5, 6A-21 and 6A-22) will remain on dated editorial scores until a permitted machine-readable source is configured. Set the repository variable FOOTBALL_RESULTS_FEED_URL and optional secret FOOTBALL_RESULTS_FEED_TOKEN with an explicitly authorized provider. This failure must remain visible; do not scrape an unlicensed source or invent finals. See docs/football-authority/MATCHUPS_BRACKETS_FEED.md.'
          fi
          echo "::error::Football updates are NOT automatic: FOOTBALL_RESULTS_FEED_URL is missing; blocker issue recorded."
          exit 1
      - name: Fetch only authorized verified score feed
        if: ${{ github.event_name != 'pull_request' && vars.FOOTBALL_RESULTS_FEED_URL != '' }}
        env:
          FOOTBALL_RESULTS_FEED_URL: ${{ vars.FOOTBALL_RESULTS_FEED_URL }}
          FOOTBALL_RESULTS_FEED_TOKEN: ${{ secrets.FOOTBALL_RESULTS_FEED_TOKEN }}
        run: node scripts/data/refresh-football-matchups.mjs
      - name: Propose and auto-merge validated score updates after required checks
        if: ${{ github.event_name != 'pull_request' && vars.FOOTBALL_RESULTS_FEED_URL != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/high-school-football/football-matchups.snapshot.json; then
            echo 'No source-backed score changes.'
            exit 0
          fi
          if gh pr list --base main --state open --json title --jq '.[].title' | grep -Fxq 'Update verified 2026 Texas football scores and brackets'; then
            echo 'An earlier score update PR awaits review; no duplicate.'
            exit 0
          fi
          branch="data/football-scores-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add src/data/high-school-football/football-matchups.snapshot.json
          git commit -m 'Refresh sourced 2026 football scores and brackets'
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title 'Update verified 2026 Texas football scores and brackets' --body 'Bounded, source-attributed authorized football snapshot change. Protected CI and automated merge approval required; no bypass of branch protection or direct production changes.'
          gh pr merge "$branch" --repo "$GITHUB_REPOSITORY" --auto --squash
