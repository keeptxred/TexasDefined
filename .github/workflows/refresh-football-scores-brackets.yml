name: Research Texas football scores and standings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-football-scores-brackets.yml'
      - 'scripts/data/research-football-pages-statewide.mjs'
      - 'scripts/data/research-football-pages-statewide.test.mjs'
  schedule:
    # Daily next-day public score lookups during the Aug-Dec season.
    # UTC 17:37 = 11:37 a.m. CST / 12:37 p.m. CDT. Saturday year-round.
    - cron: '37 17 * * 6'
    - cron: '37 17 * 8-12 0-5'
  pull_request:
    paths:
      - '.github/workflows/refresh-football-scores-brackets.yml'
      - 'scripts/data/research-football-pages-statewide.mjs'
      - 'scripts/data/research-football-pages-statewide.test.mjs'
      - 'src/data/high-school-football/football-matchups.snapshot.json'
      - 'src/data/high-school-football/football-district*2026.ts'
      - 'src/data/high-school-football/football-district-game-week.ts'
      - 'src/data/high-school-football/program-editorial*'
      - 'src/routes/texas-high-school-football-teams_.$slug.lazy.tsx'
      - 'src/routes/texas-high-school-football-districts_.$slug.lazy.tsx'

permissions:
  contents: read
  issues: write

concurrency:
  group: statewide-football-public-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate complete UIL football page enrollment and dated source inventories
        run: |
          node --check scripts/data/research-football-pages-statewide.mjs
          node --test scripts/data/research-football-pages-statewide.test.mjs
          node scripts/data/research-football-pages-statewide.mjs --validate
          node --test scripts/data/validate-football-district-coverage.test.mjs
      - name: Look up next-day finals and standings via public reporting
        if: github.event_name != 'pull_request'
        run: node scripts/data/research-football-pages-statewide.mjs --research
      - name: Preserve full page inventory, discovered reporting and source provenance
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: statewide-football-public-scores-${{ github.run_id }}
          path: artifacts/football-statewide-research/
          retention-days: 30
          if-no-files-found: warn
      - name: Maintain one prioritized football final and standings research issue
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='TexasDefined football: statewide next-day finals and district standings review'
          bodyfile='artifacts/football-statewide-research/research.md'
          if [[ ! -s "$bodyfile" ]]; then
            bodyfile='/tmp/statewide-football-research-failure.md'
            printf 'The statewide football inventory or public-score research failed. Inspect the job at https://github.com/%s/actions/runs/%s. No unverified result was published.\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$bodyfile"
          fi
          printf '\nGitHub source run: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$bodyfile"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number,title --limit 100 --jq '.[] | select(.title=="TexasDefined football: statewide next-day finals and district standings review") | .number' | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$bodyfile"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$bodyfile"
          fi
