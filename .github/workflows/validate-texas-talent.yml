name: Validate Texas Talent launch contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate hidden Texas Talent launch contract
        run: node scripts/data/validate-texas-talent.mjs

      - name: Validate Texas Talent launch-depth gate
        run: node scripts/data/validate-texas-talent-launch-depth-gate.mjs

      - name: Validate Texas Talent flagship depth wave
        run: node scripts/data/validate-texas-talent-flagship-depth.mjs

      - name: Validate Texas Talent flagship depth wave 2
        run: node scripts/data/validate-texas-talent-flagship-depth-wave2.mjs

      - name: Validate Texas Talent flagship depth wave 3
        run: node scripts/data/validate-texas-talent-flagship-depth-wave3.mjs

      - name: Validate Texas Talent flagship depth wave 4
        run: node scripts/data/validate-texas-talent-flagship-depth-wave4.mjs

      - name: Validate Texas Talent flagship depth wave 5
        run: node scripts/data/validate-texas-talent-flagship-depth-wave5.mjs

      - name: Validate Texas Talent source provenance
        run: node scripts/data/validate-texas-talent-source-provenance.mjs

      - name: Validate Texas Talent editorial status separation
        run: node scripts/data/validate-texas-talent-editorial-status.mjs

      - name: Validate Texas Talent content depth
        run: node scripts/data/validate-texas-talent-content-depth.mjs

      - name: Validate Texas Talent launch metadata
        run: node scripts/data/validate-texas-talent-launch-metadata.mjs

      - name: Validate Texas Talent reverse-link audit
        run: node scripts/data/validate-texas-talent-reverse-links.mjs

      - name: Validate Texas Talent public-style preview
        run: node scripts/data/validate-texas-talent-public-preview.mjs