name: Hurst WhirlyBall production smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hurst-whirlyball-production-smoke.yml'
      - 'scripts/ci/verify-hurst-whirlyball-production.mjs'
      - 'scripts/data/validate-place-directory-seo.mjs'
  workflow_run:
    workflows: ["Deploy TexasDefined production"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: texasdefined-hurst-whirlyball-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish Hurst / WhirlyBall smoke pending
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/ci/publish-github-status.mjs texasdefined-hurst-whirlyball pending "Verifying cache-busted Hurst and WhirlyBall production HTML"

      - name: Verify Hurst and WhirlyBall production cluster
        id: hurst_whirlyball_smoke
        env:
          HURST_WHIRLYBALL_PRODUCTION_ORIGIN: https://texasdefined.com
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/ci/verify-hurst-whirlyball-production.mjs

      - name: Publish Hurst / WhirlyBall smoke result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          STAGE_OUTCOME: ${{ steps.hurst_whirlyball_smoke.outcome }}
        run: node scripts/ci/publish-github-status.mjs texasdefined-hurst-whirlyball "$STAGE_OUTCOME" "Cache-busted Hurst and WhirlyBall production HTML passed" "Hurst and WhirlyBall production HTML verification failed"
