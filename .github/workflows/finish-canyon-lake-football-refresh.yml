name: Finish Canyon Lake verified score refresh

on:
  workflow_run:
    workflows:
      - Refresh Canyon Lake Hawks football data
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

concurrency:
  group: canyon-lake-verified-score-protected-finisher
  cancel-in-progress: false

jobs:
  finish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify bot-owned score-only PR, validate exact SHA and finish protected merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/canyon-lake-scores-$SOURCE_RUN_ID"
          result="$(gh pr list --repo "$REPOSITORY" --base main --head "$branch" --state open --json number,title,url,headRefOid --limit 2)"
          count="$(jq 'length' <<< "$result")"
          if [[ "$count" == '0' ]]; then
            echo 'No new Canyon Lake final was independently verified; no PR to publish.'
            exit 0
          fi
          [[ "$count" == '1' ]] || { echo 'Ambiguous Canyon Lake score refresh PR'; exit 1; }
          pr="$(jq -r '.[0].number' <<< "$result")"
          url="$(jq -r '.[0].url' <<< "$result")"
          title="$(jq -r '.[0].title' <<< "$result")"
          [[ "$title" == 'Refresh independently verified Canyon Lake Hawks final' ]] || exit 1
          author="$(gh api "repos/$REPOSITORY/pulls/$pr" --jq '.user.login')"
          [[ "$author" == 'github-actions[bot]' ]] || { echo 'Untrusted generated PR author'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main "$branch"
          git checkout -B "$branch" "origin/$branch"
          base="$(git merge-base origin/main HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"
          [[ "$changed" == 'src/data/high-school-football/program-editorial-comal-canyon-lake.ts' ]] || {
            echo 'Generated score PR must change only the Canyon Lake sourced editorial object.'
            exit 1
          }
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            changed="$(git diff --name-only origin/main HEAD)"
            [[ "$changed" == 'src/data/high-school-football/program-editorial-comal-canyon-lake.ts' ]] || exit 1
            git push origin "HEAD:$branch"
          fi
          sha="$(git rev-parse HEAD)"
          node --check scripts/data/refresh-canyon-lake-results.mjs
          node --test scripts/data/refresh-canyon-lake-results.test.mjs
          node scripts/ci/validate-comal-canyon-lake-authority.mjs
          # PRs created with GITHUB_TOKEN do not trigger pull_request CI.
          # Run both canonical validators explicitly against this exact head.
          bash scripts/ci/dispatch-validate-branch.sh "$branch" validate.yml
          bash scripts/ci/dispatch-validate-branch.sh "$branch" merge-gate.yml
          git fetch --no-tags origin main "$branch"
          [[ "$(git rev-parse "origin/$branch")" == "$sha" ]] || { echo 'Generated PR changed after validation'; exit 1; }
          git merge-base --is-ancestor origin/main "origin/$branch" || {
            echo 'Main advanced during validation; leave PR open rather than bypassing protected merge.'
            exit 1
          }
          gh api --method POST "repos/$REPOSITORY/statuses/$sha" \
            -f state='success' -f context='Required merge gate' \
            -f description='Exact verified Canyon Lake editorial passed both canonical dispatch validations' \
            -f target_url="$url" >/dev/null
          gh pr merge "$url" --auto --squash --match-head-commit "$sha"
          echo "Validated Canyon Lake score PR queued for protected merge: $url"
