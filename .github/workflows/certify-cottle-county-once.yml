name: Certify Cottle County production once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/certify-cottle-county-once.yml'

permissions:
  contents: write

concurrency:
  group: certify-cottle-county-pr
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Certify Cottle County from current main
        shell: bash
        run: |
          set -euo pipefail
          target='c9d7197654cbc9d9578aa37ff42dd9edfea2c291'
          fixture='src/data/fixtures/cottle-county-paducah-pease-river-ranching-railroads-rolling-plains-texas.ts'
          hero='https://commons.wikimedia.org/wiki/Special:Redirect/file/North_Pease_River%2C_Cottle_County%2C_Texas.jpg?width=1600'
          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT

          git merge-base --is-ancestor "$target" HEAD
          test -f "$fixture"
          grep -Fq 'countySlug: "cottle"' src/data/county-series-profiles-rolling-plains.ts
          ! grep -n 'www\.texasdefined\.com' "$fixture" src/data/county-series-profiles-rolling-plains.ts src/data/county-series.server.ts

          hcode="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$work/hh" -o "$work/hb" -w '%{http_code}' "$hero")"
          hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/hh" | cut -d';' -f1)"
          hbytes="$(wc -c < "$work/hb")"
          test "$hcode" = 200
          [[ "$hmime" =~ ^image/(jpeg|png|webp)$ ]]
          test "$hbytes" -gt 50000

          npm run validate
          validated="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$validated"

          npm run deploy

          page_ok=0
          for attempt in $(seq 1 12); do
            code="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$work/page" -w '%{http_code}' "https://texasdefined.com/county/cottle?verify=${validated}-${GITHUB_RUN_ID}-${attempt}")"
            if [ "$code" = 200 ] \
              && grep -Fq 'Cottle County: Paducah, the Pease River and Rolling Plains Ranch Country' "$work/page" \
              && grep -Fq 'The county in numbers' "$work/page" \
              && grep -Fq 'County seat' "$work/page" \
              && grep -Fq '2020 population' "$work/page" \
              && grep -Fq 'County feature' "$work/page" \
              && grep -Fq 'Paducah' "$work/page" \
              && grep -Fq 'North Pease River' "$work/page" \
              && grep -Fq 'https://texasdefined.com/county/cottle' "$work/page"; then page_ok=1; break; fi
            sleep 5
          done
          test "$page_ok" -eq 1

          live_hcode="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$work/lhh" -o "$work/lhb" -w '%{http_code}' "$hero")"
          live_hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/lhh" | cut -d';' -f1)"
          live_hbytes="$(wc -c < "$work/lhb")"
          test "$live_hcode" = 200
          [[ "$live_hmime" =~ ^image/(jpeg|png|webp)$ ]]
          test "$live_hbytes" -gt 50000

          printf 'Cottle certification PASS: target=%s page=%s hero=%s mime=%s bytes=%s\n' "$validated" "$code" "$live_hcode" "$live_hmime" "$live_hbytes"
