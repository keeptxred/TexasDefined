name: Certify Caldwell County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-caldwell-county-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: d360cb5c8bc6f1b0d2fadc4912cdeb46ec186ef5
      HERO_URL: https://commons.wikimedia.org/wiki/Special:Redirect/file/Caldwell_County_Courthouse%2C_Lockhart.jpg?width=1600
      CANONICAL_URL: https://texasdefined.com/county/caldwell
      LEGACY_URL: https://texasdefined.com/article/caldwell-county-lockhart-luling-plum-creek-san-marcos-river-texas
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Certify Caldwell source, validation and production
        id: cert
        shell: bash
        run: |
          set +e
          log=/tmp/caldwell-cert.log
          : > "$log"
          fail=''
          fixture='src/data/fixtures/caldwell-county-lockhart-luling-plum-creek-san-marcos-river-texas.ts'
          registry='src/data/county-series-profiles-central.ts'
          test -f "$fixture" || fail='source-fixture'
          grep -Fq 'countySlug: "caldwell"' "$registry" || fail='source-registry'
          grep -Fq 'Caldwell County: Lockhart, Luling, Plum Creek and the San Marcos River' "$fixture" || fail='source-title'
          grep -Fq 'Caldwell_County_Courthouse%2C_Lockhart.jpg?width=1600' "$fixture" || fail='source-hero'
          if grep -n 'www\.texasdefined\.com' "$fixture" "$registry" >> "$log"; then fail='canonical-host'; fi
          if [ -z "$fail" ]; then
            npm run data:validate:editorial-images >> "$log" 2>&1 || fail='editorial-image-uniqueness'
          fi
          if [ -z "$fail" ]; then
            npm run validate >> "$log" 2>&1 || fail='repository-validation'
          fi
          hero_status=''; hero_mime=''; hero_bytes='0'
          if [ -z "$fail" ]; then
            hero_status="$(curl -A 'TexasDefined/1.0 (+https://texasdefined.com)' -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 -sS -D /tmp/hero-h -o /tmp/hero-b -w '%{http_code}' "$HERO_URL" || true)"
            hero_mime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' /tmp/hero-h | cut -d';' -f1)"
            hero_bytes="$(wc -c < /tmp/hero-b 2>/dev/null || echo 0)"
            echo "hero HTTP=$hero_status MIME=$hero_mime bytes=$hero_bytes" >> "$log"
            if [ "$hero_status" != '200' ] || ! [[ "$hero_mime" =~ ^image/(jpeg|png|webp)$ ]] || [ "$hero_bytes" -le 50000 ]; then fail='hero-http'; fi
          fi
          page_status=''; page_ok=0
          if [ -z "$fail" ]; then
            for attempt in $(seq 1 12); do
              page_status="$(curl -A 'TexasDefined/1.0 (+https://texasdefined.com)' --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o /tmp/page -w '%{http_code}' "${CANONICAL_URL}?verify=${TARGET_SHA}-${GITHUB_RUN_ID}-$attempt" || true)"
              if [ "$page_status" = '200' ] \
                && grep -Fq 'Caldwell County: Lockhart, Luling, Plum Creek and the San Marcos River' /tmp/page \
                && grep -Fq 'The county in numbers' /tmp/page \
                && grep -Fq 'County seat' /tmp/page \
                && grep -Fq '2020 population' /tmp/page \
                && grep -Fq 'Lockhart' /tmp/page \
                && grep -Fq 'https://texasdefined.com/county/caldwell' /tmp/page; then page_ok=1; break; fi
              sleep 5
            done
            echo "page HTTP=$page_status data_layers=$page_ok" >> "$log"
            [ "$page_ok" -eq 1 ] || fail='live-county'
          fi
          legacy_status=''; legacy_location=''
          if [ -z "$fail" ]; then
            legacy_status="$(curl -A 'TexasDefined/1.0 (+https://texasdefined.com)' --max-redirs 0 -sS -D /tmp/legacy-h -o /dev/null -w '%{http_code}' "$LEGACY_URL" || true)"
            legacy_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' /tmp/legacy-h)"
            echo "legacy HTTP=$legacy_status location=$legacy_location" >> "$log"
            if [ "$legacy_status" != '301' ] || [ "$legacy_location" != 'https://texasdefined.com/county/caldwell' ]; then fail='legacy-redirect'; fi
          fi
          if [ -z "$fail" ]; then state='success'; desc='Caldwell county validation and live certification passed'; else state='failure'; desc="Caldwell certification failed: $fail"; fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          echo "hero_status=$hero_status" >> "$GITHUB_OUTPUT"
          echo "hero_mime=$hero_mime" >> "$GITHUB_OUTPUT"
          echo "page_status=$page_status" >> "$GITHUB_OUTPUT"
          echo "legacy_status=$legacy_status" >> "$GITHUB_OUTPUT"
          echo "legacy_location=$legacy_location" >> "$GITHUB_OUTPUT"
          cat "$log"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${{ github.token }}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"$state\",\"context\":\"caldwell-county-live-cert\",\"description\":\"$desc\"}" >/dev/null
          [ "$state" = 'success' ]
