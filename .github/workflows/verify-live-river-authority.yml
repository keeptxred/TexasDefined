name: Verify all river authority pages in production

on:
  workflow_dispatch:
  schedule:
    - cron: '19 9 * * *'
  push:
    branches: [main]
    paths:
      - 'src/data/river-authority-relations.ts'
      - 'src/data/fixtures/texas-river-authority-remaining.ts'
      - 'src/data/fixtures/texas-river-authority-extensions.ts'
      - 'src/data/fixtures/texas-river-recreation-guides.ts'
      - 'src/components/content/TexasRiversAuthorityHub.tsx'
      - 'src/components/content/CountyGuideSections.tsx'
      - 'src/components/editorial/TexasRiverValleysLandscapePage.tsx'
      - 'src/components/fishing/FishingHub.tsx'
      - 'src/routes/article.$slug.tsx'
      - 'scripts/ci/verify-live-river-authority.mjs'
      - '.github/workflows/verify-live-river-authority.yml'

permissions:
  contents: read
  statuses: read

jobs:
  public-acceptance:
    name: Verify all published river guides and reciprocal links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for exact protected deployment on main push
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/ci/wait-for-protected-production.mjs
      - name: Test every published river and curated backlink
        run: node scripts/ci/verify-live-river-authority.mjs
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: river-authority-production-acceptance
          path: .artifacts/river-authority-production-acceptance.json
          if-no-files-found: warn
          retention-days: 30
