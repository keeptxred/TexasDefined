name: Destination indexing smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/destination-indexing-smoke.yml'
      - 'src/routes/destination.$slug.tsx'
      - 'src/routes/sitemap-explore[.]xml.ts'
      - 'src/data/destination-audit.ts'
      - 'src/data/destination-availability.ts'
      - 'src/data/destination-curation*.ts'
      - 'src/data/explore-*.ts'
      - 'src/data/fixtures/**'

permissions:
  contents: read

concurrency:
  group: destination-indexing-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify primary and non-primary destination index behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          ORIGIN='https://texasdefined.com'
          PRIMARY='/destination/enchanted-rock-state-natural-area'
          NON_PRIMARY='/destination/world-birding-center-bentsen-rio-grande-valley-state-park'

          def get(path):
              req=urllib.request.Request(ORIGIN+path, headers={'User-Agent':'TexasDefinedDestinationSmoke/1.0'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  return response.read().decode('utf-8', errors='replace')

          def robots_values(html):
              return [m.group(1).lower() for m in re.finditer(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\']([^"\']+)', html, re.I)]

          primary=get(PRIMARY)
          non_primary=get(NON_PRIMARY)
          assert 'Enchanted Rock' in primary, 'Primary destination content missing from production HTML'
          assert not any('noindex' in value for value in robots_values(primary)), 'Primary Enchanted Rock destination unexpectedly noindex'
          assert 'Bentsen' in non_primary or 'Rio Grande' in non_primary, 'Non-primary destination compatibility route content missing'
          assert any('noindex' in value for value in robots_values(non_primary)), 'Non-primary unit destination must remain noindex'

          seen=set()
          queue=[ORIGIN+'/sitemap.xml']
          visited=set()
          while queue and len(visited) < 50:
              url=queue.pop(0)
              if url in visited:
                  continue
              visited.add(url)
              req=urllib.request.Request(url, headers={'User-Agent':'TexasDefinedDestinationSmoke/1.0'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  payload=response.read()
              root=ET.fromstring(payload)
              local=root.tag.rsplit('}',1)[-1]
              locs=[el.text.strip() for el in root.iter() if el.tag.rsplit('}',1)[-1]=='loc' and el.text]
              if local=='sitemapindex':
                  queue.extend(locs)
              else:
                  seen.update(locs)

          primary_url=ORIGIN+PRIMARY
          non_primary_url=ORIGIN+NON_PRIMARY
          assert primary_url in seen, f'Primary destination missing from production sitemap graph: {primary_url}'
          assert non_primary_url not in seen, f'Non-primary unit destination leaked into production sitemap graph: {non_primary_url}'
          print(f'Destination indexing smoke passed across {len(visited)} sitemap document(s).')
          PY
