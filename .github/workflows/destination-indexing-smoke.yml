name: Destination indexing smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify destination indexing behavior
        run: |
          set -euo pipefail
          origin="https://texasdefined.com"
          non_primary="/destination/world-birding-center-bentsen-rio-grande-valley-state-park"
          primary_url=""

          for attempt in $(seq 1 24); do
            curl --retry 3 --retry-all-errors --max-time 45 -fsSL "$origin/sitemap-explore.xml" -o /tmp/explore-sitemap.xml
            primary_url="$(grep -o -m1 'https://texasdefined.com/destination/[^<]*' /tmp/explore-sitemap.xml || true)"
            if [ -n "$primary_url" ]; then
              break
            fi
            echo "Explore sitemap has not exposed a destination yet; retrying after deployment catches up (attempt $attempt)."
            sleep 10
          done

          test -n "$primary_url" || {
            echo "Explore sitemap contains no indexable destination URLs after deployment-aware retries." >&2
            exit 1
          }

          curl --retry 5 --retry-all-errors --max-time 45 -fsSL "$primary_url" -o /tmp/primary.html
          if grep -Fq "noindex, follow" /tmp/primary.html; then
            echo "A destination published in the Explore sitemap is simultaneously noindex: $primary_url" >&2
            exit 1
          fi

          non_primary_status="$(curl --retry 3 --retry-all-errors --max-time 45 -sS -o /tmp/non-primary.html -w '%{http_code}' "$origin$non_primary")"
          if [ "$non_primary_status" = "200" ]; then
            grep -Fq "noindex, follow" /tmp/non-primary.html || {
              echo "Non-primary Bentsen destination rendered 200 without noindex." >&2
              exit 1
            }
          elif [ "$non_primary_status" != "404" ]; then
            echo "Unexpected status for non-primary Bentsen destination: $non_primary_status" >&2
            exit 1
          fi

          if grep -Fq "$origin$non_primary" /tmp/explore-sitemap.xml; then
            echo "Non-primary Bentsen destination leaked into the Explore sitemap." >&2
            exit 1
          fi

          echo "Destination indexing smoke passed with primary control $primary_url and non-primary status $non_primary_status."
