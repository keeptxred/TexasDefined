name: Destination indexing smoke

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/destination-indexing-smoke.yml'
      - 'src/routes/destination.*'
      - 'src/routes/explore.top-attractions*'
      - 'src/routes/top-25-texas-attractions*'
      - 'src/routes/sitemap-explore*'
      - 'src/components/editorial/DestinationRelationships.tsx'
      - 'src/components/editorial/DestinationAuthorityGuide.tsx'
      - 'src/components/editorial/TopAttractionCollectionLinks.tsx'
      - 'src/components/explore/TopAttractionsMethodologyContent.tsx'
      - 'src/components/explore/TopAttractionRoadTripsContent.tsx'
      - 'src/components/authority/CitationCollectionTrustRouter.tsx'
      - 'src/data/top-texas-attractions.ts'
      - 'src/data/top-attraction-road-trips.ts'
      - 'src/data/top-attraction-authority-sources.ts'
      - 'src/data/top-attraction-authority-resolver.ts'
      - 'src/data/top-attraction-reference-data.ts'
      - 'src/data/destination-authority-top-attractions.ts'
      - 'src/data/destination-relationships.functions.ts'
      - 'src/data/destination-timelines-top-attractions.ts'
      - 'src/data/destination-audit.ts'
      - 'src/data/destination-availability.ts'
      - 'src/data/destination-curation-all.ts'
      - 'src/data/destination-curation-top-attractions*.ts'
      - 'src/data/destination-quality.ts'
      - 'src/data/explore-core-remote.ts'
      - 'src/data/explore-remote.ts'
      - 'src/data/explore-hero-reconciliation.ts'
      - 'src/data/explore-heroes.ts'
      - 'src/data/state-park-heroes.ts'
      - 'src/data/fixtures/texas.ts'
      - 'src/routes/explore.$category.tsx'
      - 'src/routes/explore.region.$region.tsx'
      - 'src/lib/public-routes.ts'
      - 'public/citation-magnets.json'
      - 'src/routes/llms*txt.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: destination-indexing-smoke-main
  cancel-in-progress: true

jobs:
  hydration-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Houston Zoo destination hydration stability
        run: |
          set -euo pipefail
          origin="https://texasdefined.com"
          hydration_control="/destination/houston-zoo"

          for hydration_attempt in 1 2 3; do
            target="/tmp/hydration-control-$hydration_attempt.html"
            curl --retry 3 --retry-connrefused --max-time 45 -fsSL "$origin$hydration_control" -o "$target"

            grep -Fq "<title>Houston Zoo" "$target" || {
              echo "Houston Zoo hydration control did not render the expected destination document." >&2
              exit 1
            }

            hydration_destination_links="$(grep -ao '/destination/[a-z0-9-]*' "$target" | sort -u | wc -l | tr -d ' ')"
            hydration_bytes="$(wc -c < "$target" | tr -d ' ')"
            echo "Houston Zoo hydration attempt $hydration_attempt: $hydration_destination_links unique destination slugs; $hydration_bytes HTML bytes."

            if [ "$hydration_destination_links" -gt 150 ]; then
              echo "Houston Zoo hydration control exposed $hydration_destination_links unique destination slugs; expected no more than 150. The full destination catalog may have leaked into browser hydration." >&2
              exit 1
            fi
            if [ "$hydration_bytes" -gt 2000000 ]; then
              echo "Houston Zoo hydration control returned $hydration_bytes HTML bytes; expected no more than 2,000,000. The public hydration payload may have regressed." >&2
              exit 1
            fi
            grep -Fq "Arrive early" "$target" || {
              echo "Houston Zoo itinerary control is missing the expected first step." >&2
              exit 1
            }
            for step_number in 1 2 3; do
              if grep -Eq ">$step_number</span><span>$step_number([.]|[[:space:]])" "$target"; then
                echo "Houston Zoo itinerary control rendered duplicated step numbering for step $step_number." >&2
                exit 1
              fi
            done
          done

          echo "Houston Zoo destination hydration stability and itinerary numbering passed across three production fetches."

  browser-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Render destination controls in headless Chromium
        run: |
          set -euo pipefail
          origin="https://texasdefined.com"
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser" || {
            echo "No Chromium-family browser is available on the hosted runner." >&2
            exit 1
          }
          "$browser" --version

          for path in \
            "/destination/houston-zoo" \
            "/destination/fort-worth-zoo" \
            "/destination/choke-canyon-state-park"; do
            slug="$(basename "$path")"
            for attempt in 1 2 3; do
              dom="/tmp/${slug}-${attempt}.html"
              metrics="/tmp/${slug}-${attempt}.time"
              /usr/bin/time -v "$browser" \
                --headless=new \
                --no-sandbox \
                --disable-gpu \
                --disable-dev-shm-usage \
                --virtual-time-budget=8000 \
                --dump-dom "$origin$path" \
                > "$dom" 2> "$metrics"

              grep -Fq "<title>" "$dom" || {
                echo "Headless Chromium did not render a document title for $path (attempt $attempt)." >&2
                exit 1
              }
              dom_bytes="$(wc -c < "$dom" | tr -d ' ')"
              max_rss_kb="$(awk -F: '/Maximum resident set size/ { gsub(/[^0-9]/, "", $2); print $2 }' "$metrics" | tail -1)"
              max_rss_kb="${max_rss_kb:-0}"
              echo "Chromium $path attempt $attempt: ${dom_bytes} DOM bytes; ${max_rss_kb} KB max RSS."

              if [ "$dom_bytes" -gt 2500000 ]; then
                echo "Chromium-rendered DOM for $path exceeded 2,500,000 bytes." >&2
                exit 1
              fi
              if [ "$max_rss_kb" -gt 900000 ]; then
                echo "Chromium rendering $path exceeded 900,000 KB max RSS." >&2
                exit 1
              fi
              if [ "$path" = "/destination/houston-zoo" ]; then
                grep -Fq ">Arrive early</li>" "$dom" || {
                  echo "Houston Zoo browser DOM is missing the semantic itinerary step." >&2
                  exit 1
                }
                if grep -Fq ">1</span><span>Arrive early</span>" "$dom"; then
                  echo "Houston Zoo browser DOM still contains the former manually duplicated itinerary number." >&2
                  exit 1
                fi
              fi
            done
          done

          echo "Headless Chromium destination stability passed across Houston Zoo and two comparison destinations."

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify destination indexing behavior
        run: |
          set -euo pipefail
          origin="https://texasdefined.com"
          non_primary="/destination/world-birding-center-bentsen-rio-grande-valley-state-park"
          canonical_bentsen="/destination/bentsen-rio-grande-valley-state-park"
          top_attractions="/explore/top-attractions"
          methodology="/explore/top-attractions/methodology"
          road_trips="/explore/top-attractions/road-trips"
          authority_control="/destination/the-alamo"
          checklist="/top-25-texas-attractions-checklist.txt"
          comparison_csv="/top-25-texas-attractions.csv"
          comparison_json="/top-25-texas-attractions.json"
          primary_url=""

          for attempt in $(seq 1 30); do
            status="$(curl --max-time 45 -sS -o /tmp/explore-sitemap.xml -w '%{http_code}' "$origin/sitemap-explore.xml" || true)"
            if [ "$status" = "200" ]; then
              primary_url="$(grep -o -m1 'https://texasdefined.com/destination/[^<]*' /tmp/explore-sitemap.xml || true)"
              if [ -n "$primary_url" ] \
                && grep -Fq "$origin$top_attractions" /tmp/explore-sitemap.xml \
                && grep -Fq "$origin$methodology" /tmp/explore-sitemap.xml \
                && grep -Fq "$origin$road_trips" /tmp/explore-sitemap.xml; then
                echo "Explore sitemap is healthy and includes the full Top 25 authority cluster on attempt $attempt."
                break
              fi
              echo "Explore sitemap returned 200 but the Top 25 authority release is not fully visible yet (attempt $attempt/30)."
            else
              echo "Explore sitemap returned HTTP ${status:-000}; deployment has not reached the healthy revision yet (attempt $attempt/30)."
            fi
            sleep 10
          done

          test -n "$primary_url" || {
            echo "Explore sitemap did not expose an indexable destination within the deployment-aware retry window." >&2
            exit 1
          }
          for path in "$top_attractions" "$methodology" "$road_trips"; do
            grep -Fq "$origin$path" /tmp/explore-sitemap.xml || {
              echo "Top 25 authority path missing from Explore sitemap: $path" >&2
              exit 1
            }
          done

          curl --retry 3 --retry-connrefused --max-time 45 -fsSL "$primary_url" -o /tmp/primary.html
          if grep -Fq "noindex, follow" /tmp/primary.html; then
            echo "A destination published in the Explore sitemap is simultaneously noindex: $primary_url" >&2
            exit 1
          fi

          curl --retry 3 --retry-connrefused --max-time 45 -fsSL "$origin$top_attractions" -o /tmp/top-attractions.html
          if grep -Fq "noindex" /tmp/top-attractions.html; then
            echo "Top 25 attractions collection rendered with a noindex directive." >&2
            exit 1
          fi
          for marker in "/destination/the-alamo" "/destination/gruene-historic-district" "How this list is researched" "Source hierarchy" "Download comparison CSV" "Download JSON data" "Top-25 road trips" "Methodology"; do
            grep -Fq "$marker" /tmp/top-attractions.html || {
              echo "Top 25 collection is missing required rendered marker: $marker" >&2
              exit 1
            }
          done
          unique_top_links="$(grep -ao '/destination/[a-z0-9-]*' /tmp/top-attractions.html | sort -u | wc -l | tr -d ' ')"
          if [ "$unique_top_links" -lt 25 ]; then
            echo "Top 25 collection exposed only $unique_top_links unique destination links; expected at least 25." >&2
            exit 1
          fi

          curl --retry 3 --retry-connrefused --max-time 45 -fsSL "$origin$methodology" -o /tmp/top25-methodology.html
          for marker in "What qualifies for the collection" "Official sources control changing visitor facts" "Controlling visitor source" "Supporting public or institutional sources" "Review sites are not primary evidence" "No invented experience" "Shared comparison scale" "Download JSON"; do
            grep -Fq "$marker" /tmp/top25-methodology.html || {
              echo "Top 25 methodology is missing required rendered marker: $marker" >&2
              exit 1
            }
          done

          curl --retry 3 --retry-connrefused --max-time 45 -fsSL "$origin$road_trips" -o /tmp/top25-road-trips.html
          for marker in "Seven road trips" "San Antonio & Hill Country essentials" "West Texas national-park expedition" "South Texas coast extension"; do
            grep -Fq "$marker" /tmp/top25-road-trips.html || {
              echo "Top 25 road-trip collection is missing required rendered marker: $marker" >&2
              exit 1
            }
          done

          curl --retry 3 --retry-connrefused --max-time 45 -fsSL "$origin$authority_control" -o /tmp/authority-control.html
          for marker in "Plan your day" "What the visit involves" "Walking &amp; exertion" "Time outdoors" "Planning needed" "Families" "Good for first-time visitors" "Texas context" "Plan by time" "Three ways to visit" "Key dates" "Common visitor questions" "Sources &amp; updates" "Sources used for this guide" "Primary visitor source" "Additional source" "Update history"; do
            grep -Fq "$marker" /tmp/authority-control.html || {
              echo "Top 25 authority control is missing required rendered marker: $marker" >&2
              exit 1
            }
          done
          grep -Fq "The Alamo — Mission Valero history" /tmp/authority-control.html || {
            echo "Top 25 authority control is missing its supplemental Alamo history source." >&2
            exit 1
          }
          grep -Fq "The Alamo — archaeology and preservation updates" /tmp/authority-control.html || {
            echo "Top 25 authority control is missing its preservation source." >&2
            exit 1
          }

          curl --retry 3 --retry-connrefused --max-time 45 -fsSL "$origin$comparison_csv" -o /tmp/top25.csv
          for marker in "rank,attraction_name,canonical_url" "authority_source_count" "authority_source_urls" "road_trip_names" "methodology_url" "The Alamo" "Gruene Historic District" "https://www.thealamo.org/remember/mission-valero"; do
            grep -Fq "$marker" /tmp/top25.csv || {
              echo "Top 25 CSV is missing required provenance marker: $marker" >&2
              exit 1
            }
          done
          csv_lines="$(wc -l < /tmp/top25.csv | tr -d ' ')"
          if [ "$csv_lines" -ne 26 ]; then
            echo "Top 25 CSV has $csv_lines lines; expected 26 including the header." >&2
            exit 1
          fi

          curl --retry 3 --retry-connrefused --max-time 45 -fsSL "$origin$comparison_json" -o /tmp/top25.json
          for marker in '"schemaVersion": 1' '"count": 25' '"authoritySources"' '"roadTrips"' '"methodology"' '"name": "The Alamo"' '"name": "Gruene Historic District"' 'https://www.thealamo.org/remember/mission-valero'; do
            grep -Fq "$marker" /tmp/top25.json || {
              echo "Top 25 JSON is missing required provenance marker: $marker" >&2
              exit 1
            }
          done

          curl --retry 3 --retry-connrefused --max-time 45 -fsSL "$origin$checklist" -o /tmp/top25-checklist.txt
          grep -Fq "01. The Alamo" /tmp/top25-checklist.txt || {
            echo "Top 25 checklist is missing The Alamo." >&2
            exit 1
          }
          grep -Fq "25. Gruene Historic District" /tmp/top25-checklist.txt || {
            echo "Top 25 checklist is missing Gruene Historic District." >&2
            exit 1
          }

          non_primary_status="$(curl --max-time 45 -sS -D /tmp/non-primary.headers -o /tmp/non-primary.html -w '%{http_code}' "$origin$non_primary" || true)"
          if [ "$non_primary_status" != "301" ]; then
            echo "Legacy Bentsen alias must return HTTP 301; got $non_primary_status." >&2
            exit 1
          fi
          non_primary_location="$(tr -d '\r' < /tmp/non-primary.headers | awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/^[^:]*:[[:space:]]*/, ""); print; exit }')"
          if [ "$non_primary_location" != "$canonical_bentsen" ] && [ "$non_primary_location" != "$origin$canonical_bentsen" ]; then
            echo "Legacy Bentsen alias redirected to unexpected location: ${non_primary_location:-<missing>}." >&2
            exit 1
          fi

          canonical_bentsen_status="$(curl --max-time 45 -sS -o /tmp/canonical-bentsen.html -w '%{http_code}' "$origin$canonical_bentsen" || true)"
          if [ "$canonical_bentsen_status" != "200" ]; then
            echo "Canonical Bentsen destination returned HTTP $canonical_bentsen_status; expected 200." >&2
            exit 1
          fi
          if grep -Fq "noindex" /tmp/canonical-bentsen.html; then
            echo "Canonical Bentsen destination rendered with a noindex directive." >&2
            exit 1
          fi
          if ! grep -Fq "$origin$canonical_bentsen" /tmp/explore-sitemap.xml; then
            echo "Canonical Bentsen destination is missing from the Explore sitemap." >&2
            exit 1
          fi
          if grep -Fq "$origin$non_primary" /tmp/explore-sitemap.xml; then
            echo "Legacy Bentsen alias leaked into the Explore sitemap." >&2
            exit 1
          fi

          echo "Destination indexing smoke passed with the Top 25 collection, methodology, road trips, multi-source authority layer, CSV, JSON, checklist, primary control $primary_url and verified Bentsen 301 canonicalization."
