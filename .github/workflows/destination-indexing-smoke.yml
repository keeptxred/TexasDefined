name: Destination indexing smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/destination-indexing-smoke.yml'
      - 'src/routes/destination.$slug.tsx'
      - 'src/routes/sitemap-explore[.]xml.ts'
      - 'src/data/destination-audit.ts'
      - 'src/data/destination-availability.ts'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify destination indexing behavior
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          primary='/destination/enchanted-rock-state-natural-area'
          non_primary='/destination/world-birding-center-bentsen-rio-grande-valley-state-park'

          curl --retry 5 --retry-all-errors --max-time 45 -fsSL "$origin$primary" -o /tmp/primary.html
          curl --retry 5 --retry-all-errors --max-time 45 -fsSL "$origin$non_primary" -o /tmp/non-primary.html
          curl --retry 5 --retry-all-errors --max-time 45 -fsSL "$origin/sitemap-explore.xml" -o /tmp/explore-sitemap.xml

          grep -Fq 'Enchanted Rock' /tmp/primary.html
          if grep -Eiq '<meta[^>]+name=["'"']robots["'"'][^>]+content=["'"'][^"'"']*noindex' /tmp/primary.html; then
            echo 'Primary Enchanted Rock destination unexpectedly noindex.' >&2
            exit 1
          fi

          grep -Eiq 'Bentsen|Rio Grande' /tmp/non-primary.html
          grep -Eiq '<meta[^>]+name=["'"']robots["'"'][^>]+content=["'"'][^"'"']*noindex' /tmp/non-primary.html || {
            echo 'Non-primary Bentsen destination must remain noindex.' >&2
            exit 1
          }

          grep -Fq "$origin$primary" /tmp/explore-sitemap.xml || {
            echo 'Primary Enchanted Rock destination is missing from the Explore sitemap.' >&2
            exit 1
          }
          if grep -Fq "$origin$non_primary" /tmp/explore-sitemap.xml; then
            echo 'Non-primary Bentsen destination leaked into the Explore sitemap.' >&2
            exit 1
          fi

          echo 'Destination indexing smoke passed.'
