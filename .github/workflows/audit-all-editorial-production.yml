name: All 254 county source and local verification

on:
  pull_request:
    paths:
      - '.github/workflows/audit-all-editorial-production.yml'
      - 'scripts/data/inventory-county-series.mjs'
      - 'scripts/data/sync-county-property-data.mjs'
      - 'scripts/data/audit-county-history-references.mjs'
      - 'src/data/types.ts'
      - 'src/components/content/CountyGuideSections.tsx'
      - 'src/components/content/CountyIdentitySection.tsx'
      - 'src/data/county-profile.ts'
      - 'src/data/county-series.ts'
      - 'src/data/county-series.server.ts'
      - 'src/data/county-series-profiles*.ts'
      - 'src/data/knowledge-graph/relationships.ts'
      - 'src/data/knowledge-graph/index.ts'
      - 'src/data/texas-places.ts'
      - 'src/routes/$kind.$slug.tsx'
      - 'src/routes/$kind.$slug.lazy.tsx'
      - 'src/data/fixtures/*county*.ts'
      - 'src/data/fixtures/repositories.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-254-county-local-${{ github.ref }}
  cancel-in-progress: true

env:
  AUDIT_REF: ${{ github.sha }}

jobs:
  validate-county-source:
    name: Audit all 254 county editorial profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AUDIT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Inventory every effective county profile across every active registry
        run: |
          node scripts/data/inventory-county-series.mjs /tmp/county-profiles.tsv
          test "$(wc -l < /tmp/county-profiles.tsv)" -eq 254
      - name: Upload county quality inventory
        uses: actions/upload-artifact@v4
        with:
          name: county-quality-inventory
          path: |
            /tmp/county-profiles.tsv
            /tmp/county-profiles.json
            /tmp/county-profiles-authority-backlog.tsv
          if-no-files-found: error

  audit-county-government-links:
    name: Recheck official appraisal and tax-office records for all 254 counties
    needs: validate-county-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AUDIT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only crawl of all 254 official Comptroller county directories
        run: node scripts/data/sync-county-property-data.mjs --audit-only
      - name: Upload dated source-freshness and office URL audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: county-government-source-audit
          path: |
            /tmp/county-government-links-audit.json
            /tmp/county-government-links-audit.tsv
          if-no-files-found: warn

  audit-county-historical-references:
    name: Verify all 254 Handbook county history references
    needs: validate-county-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AUDIT_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe independently published Texas county histories
        run: node scripts/data/audit-county-history-references.mjs
      - name: Upload 254-county history reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: county-history-reference-audit
          path: |
            /tmp/county-history-reference-audit.json
            /tmp/county-history-reference-audit.tsv
          if-no-files-found: warn

  verify-county-local:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/audit-site-quality-local.yml
    with:
      audit: counties
