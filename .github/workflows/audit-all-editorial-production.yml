name: County production verification

on:
  pull_request:
    paths:
      - '.github/workflows/audit-all-editorial-production.yml'
      - 'src/data/county-series.ts'
      - 'src/data/index.ts'
      - 'src/data/fixtures/*county*.ts'
      - 'src/data/fixtures/repositories.ts'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-all-editorial-production.yml'
      - 'src/data/county-series.ts'
      - 'src/data/index.ts'
      - 'src/data/fixtures/*county*.ts'
      - 'src/data/fixtures/repositories.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: county-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-county-source:
    name: Validate county series registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Inventory registered county profiles
        shell: bash
        run: |
          set -euo pipefail
          cat > .audit-county-inventory.mjs <<'EOF'
          import { createServer } from 'vite';
          import fs from 'node:fs';

          const vite = await createServer({
            server: { middlewareMode: true },
            appType: 'custom',
            logLevel: 'error',
            optimizeDeps: { noDiscovery: true },
          });

          try {
            const mod = await vite.ssrLoadModule('/src/data/county-series.ts');
            const profiles = [...mod.COUNTY_SERIES_PROFILES]
              .sort((a, b) => a.countySlug.localeCompare(b.countySlug));

            if (!profiles.length) throw new Error('County series registry returned zero profiles');

            const countySlugs = profiles.map((profile) => profile.countySlug);
            if (new Set(countySlugs).size !== countySlugs.length) {
              throw new Error('Duplicate canonical countySlug detected in COUNTY_SERIES_PROFILES');
            }

            const articleSlugs = profiles.map((profile) => profile.articleSlug);
            if (new Set(articleSlugs).size !== articleSlugs.length) {
              throw new Error('Duplicate legacy county article slug detected in COUNTY_SERIES_PROFILES');
            }

            const rows = await Promise.all(profiles.map(async (profile) => ({
              profile,
              article: await profile.loadArticle(),
            })));

            for (const { profile, article: row } of rows) {
              if (!profile.countySlug || !profile.articleSlug || !row?.slug || !row?.title || !row?.hero?.src) {
                throw new Error(`County profile is missing required publication metadata: ${profile.countySlug || row?.id || 'unknown'}`);
              }
              if (profile.articleSlug !== row.slug) {
                throw new Error(`County registry articleSlug does not match loaded article: ${profile.countySlug} (${profile.articleSlug} != ${row.slug})`);
              }
              if (!row.id?.startsWith('county-')) {
                throw new Error(`County article id must start with county-: ${row.id ?? 'missing'} (${profile.countySlug})`);
              }
            }

            fs.writeFileSync(
              '/tmp/county-profiles.tsv',
              rows.map(({ profile, article }) => `${profile.countySlug}\t${article.slug}\t${article.title}`).join('\n') + '\n',
            );
            console.log(`Registered county profiles: ${rows.length}`);
            for (const { profile, article } of rows) {
              console.log(`${profile.countySlug}\t/county/${profile.countySlug}\t${article.slug}\t${article.title}`);
            }
          } finally {
            await vite.close();
          }
          EOF
          node .audit-county-inventory.mjs
          rm .audit-county-inventory.mjs

  verify-county-production:
    name: Verify canonical county pages on texasdefined.com
    if: github.event_name != 'pull_request'
    needs: validate-county-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build canonical county production inventory
        shell: bash
        run: |
          set -euo pipefail
          cat > .audit-county-inventory.mjs <<'EOF'
          import { createServer } from 'vite';
          import fs from 'node:fs';

          const vite = await createServer({
            server: { middlewareMode: true },
            appType: 'custom',
            logLevel: 'error',
            optimizeDeps: { noDiscovery: true },
          });

          try {
            const mod = await vite.ssrLoadModule('/src/data/county-series.ts');
            const profiles = [...mod.COUNTY_SERIES_PROFILES]
              .sort((a, b) => a.countySlug.localeCompare(b.countySlug));
            if (!profiles.length) throw new Error('County series registry returned zero profiles');
            const rows = await Promise.all(profiles.map(async (profile) => ({
              profile,
              article: await profile.loadArticle(),
            })));
            fs.writeFileSync(
              '/tmp/county-profiles.tsv',
              rows.map(({ profile, article }) => `${profile.countySlug}\t${article.slug}\t${article.title}`).join('\n') + '\n',
            );
          } finally {
            await vite.close();
          }
          EOF
          node .audit-county-inventory.mjs
          rm .audit-county-inventory.mjs

      - name: Require every canonical county page, structured layer, hero image, and legacy redirect to be live
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/county-profiles.tsv /tmp/pending.tsv
          : > /tmp/results.txt

          verify_profile() {
            local county_slug="$1"
            local legacy_slug="$2"
            local title="$3"
            local url="https://texasdefined.com/county/$county_slug"
            local legacy_url="https://texasdefined.com/article/$legacy_slug"
            local html="/tmp/county-${county_slug}.html"
            local code image image_result image_code image_type redirect_result redirect_code redirect_url

            code=$(curl -L -sS -o "$html" -w '%{http_code}' --max-time 25 "$url" || echo 000)
            if [[ "$code" != "200" ]]; then
              echo "WAIT page=$code $url"
              return 1
            fi

            if grep -Eqi 'Story unavailable|This story is no longer available|page not found|404[^0-9].*not found|County unavailable' "$html"; then
              echo "WAIT fallback-page $url"
              return 1
            fi

            if ! grep -Fqi "$title" "$html"; then
              echo "WAIT editorial-layer title=$title $url"
              return 1
            fi

            if ! grep -Fqi 'The county in numbers' "$html"; then
              echo "WAIT structured-layer $url"
              return 1
            fi

            image=$(python3 - "$html" <<'PY'
          import re
          import sys
          from pathlib import Path

          html = Path(sys.argv[1]).read_text(errors='ignore')
          patterns = [
              r'<meta[^>]+property=["\x27]og:image["\x27][^>]+content=["\x27]([^"\x27]+)',
              r'<meta[^>]+content=["\x27]([^"\x27]+)["\x27][^>]+property=["\x27]og:image["\x27]',
          ]
          for pattern in patterns:
              match = re.search(pattern, html, re.I)
              if match:
                  print(match.group(1))
                  break
          PY
          )

            if [[ -z "$image" ]]; then
              echo "WAIT image-metadata $url"
              return 1
            fi

            if [[ "$image" == /* ]]; then
              image="https://texasdefined.com$image"
            fi

            image_result=$(curl -L -sS -o /dev/null -w '%{http_code}\t%{content_type}' --max-time 25 "$image" || printf '000\t')
            IFS=$'\t' read -r image_code image_type <<< "$image_result"
            if [[ "$image_code" != "200" ]]; then
              echo "WAIT image=$image_code $image ($url)"
              return 1
            fi
            if [[ ! "$image_type" =~ ^image/(jpeg|png|webp)(\;.*)?$ ]]; then
              echo "WAIT image-mime=$image_type $image ($url)"
              return 1
            fi

            redirect_result=$(curl -sS -o /dev/null -w '%{http_code}\t%{redirect_url}' --max-time 25 "$legacy_url" || printf '000\t')
            IFS=$'\t' read -r redirect_code redirect_url <<< "$redirect_result"
            if [[ "$redirect_code" != "301" || "$redirect_url" != "$url" ]]; then
              echo "WAIT legacy-redirect=$redirect_code target=$redirect_url expected=$url ($legacy_url)"
              return 1
            fi

            echo "PASS page=200 structured=present editorial=present image=200 mime=$image_type redirect=301 $url" | tee -a /tmp/results.txt
            return 0
          }

          for attempt in $(seq 1 12); do
            : > /tmp/next-pending.tsv
            while IFS=$'\t' read -r county_slug legacy_slug title; do
              [[ -z "$county_slug" ]] && continue
              if ! verify_profile "$county_slug" "$legacy_slug" "$title"; then
                printf '%s\t%s\t%s\n' "$county_slug" "$legacy_slug" "$title" >> /tmp/next-pending.tsv
              fi
            done < /tmp/pending.tsv

            if [[ ! -s /tmp/next-pending.tsv ]]; then
              echo "All registered canonical county pages are live in production with both data layers, raster hero MIME, and 301 legacy redirects."
              cat /tmp/results.txt
              exit 0
            fi

            mv /tmp/next-pending.tsv /tmp/pending.tsv
            echo "Production is not ready for $(wc -l < /tmp/pending.tsv) county profile(s); attempt $attempt/12."
            cut -f1 /tmp/pending.tsv
            if [[ "$attempt" -lt 12 ]]; then sleep 30; fi
          done

          echo "County production verification failed. These canonical county pages are not live with all required publication gates:"
          cut -f1 /tmp/pending.tsv
          exit 1
