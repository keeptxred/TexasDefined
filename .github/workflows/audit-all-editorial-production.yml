name: County production verification

on:
  pull_request:
    paths:
      - '.github/workflows/audit-all-editorial-production.yml'
      - 'src/data/fixtures/*county*.ts'
      - 'src/data/fixtures/repositories.ts'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-all-editorial-production.yml'
      - 'src/data/fixtures/*county*.ts'
      - 'src/data/fixtures/repositories.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: county-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-county-source:
    name: Validate county article source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Inventory registered county articles
        shell: bash
        run: |
          set -euo pipefail
          cat > .audit-county-inventory.mjs <<'EOF'
          import { createServer } from 'vite';
          import fs from 'node:fs';

          const vite = await createServer({
            server: { middlewareMode: true },
            appType: 'custom',
            logLevel: 'error',
          });

          try {
            const mod = await vite.ssrLoadModule('/src/data/index.ts');
            const rows = await mod.platform.articles.list(mod.scope);
            const counties = rows
              .filter((row) => row.id?.startsWith('county-') || row.tags?.includes('Texas counties'))
              .sort((a, b) => a.slug.localeCompare(b.slug));

            if (!counties.length) throw new Error('County article inventory returned zero articles');

            const slugs = counties.map((row) => row.slug);
            if (new Set(slugs).size !== slugs.length) throw new Error('Duplicate county article slug detected');

            for (const row of counties) {
              if (!row.slug || !row.title || !row.hero?.src) {
                throw new Error(`County article is missing required publication metadata: ${row.id ?? 'unknown'}`);
              }
              if (!row.slug.includes('-county-') && !row.slug.startsWith('county-')) {
                throw new Error(`County article slug does not identify a county: ${row.slug}`);
              }
            }

            fs.writeFileSync('/tmp/county-slugs.txt', slugs.join('\n') + '\n');
            console.log(`Registered county articles: ${counties.length}`);
            for (const row of counties) console.log(`${row.slug}\t${row.title}`);
          } finally {
            await vite.close();
          }
          EOF
          node .audit-county-inventory.mjs
          rm .audit-county-inventory.mjs

  verify-county-production:
    name: Verify county articles on texasdefined.com
    if: github.event_name != 'pull_request'
    needs: validate-county-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build county production inventory
        shell: bash
        run: |
          set -euo pipefail
          cat > .audit-county-inventory.mjs <<'EOF'
          import { createServer } from 'vite';
          import fs from 'node:fs';

          const vite = await createServer({
            server: { middlewareMode: true },
            appType: 'custom',
            logLevel: 'error',
          });

          try {
            const mod = await vite.ssrLoadModule('/src/data/index.ts');
            const rows = await mod.platform.articles.list(mod.scope);
            const counties = rows
              .filter((row) => row.id?.startsWith('county-') || row.tags?.includes('Texas counties'))
              .sort((a, b) => a.slug.localeCompare(b.slug));
            if (!counties.length) throw new Error('County article inventory returned zero articles');
            fs.writeFileSync('/tmp/county-slugs.txt', counties.map((row) => row.slug).join('\n') + '\n');
          } finally {
            await vite.close();
          }
          EOF
          node .audit-county-inventory.mjs
          rm .audit-county-inventory.mjs

      - name: Require every county article and hero image to be live in production
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/county-slugs.txt /tmp/pending.txt
          : > /tmp/results.txt

          verify_slug() {
            local slug="$1"
            local url="https://texasdefined.com/article/$slug"
            local html="/tmp/article-${slug}.html"
            local code image image_code

            code=$(curl -L -sS -o "$html" -w '%{http_code}' --max-time 25 "$url" || echo 000)
            if [[ "$code" != "200" ]]; then
              echo "WAIT page=$code $url"
              return 1
            fi

            if grep -Eqi 'Story unavailable|This story is no longer available|page not found|404[^0-9].*not found' "$html"; then
              echo "WAIT fallback-page $url"
              return 1
            fi

            image=$(python3 - "$html" <<'PY'
          import re
          import sys
          from pathlib import Path

          html = Path(sys.argv[1]).read_text(errors='ignore')
          patterns = [
              r'<meta[^>]+property=["\x27]og:image["\x27][^>]+content=["\x27]([^"\x27]+)',
              r'<meta[^>]+content=["\x27]([^"\x27]+)["\x27][^>]+property=["\x27]og:image["\x27]',
          ]
          for pattern in patterns:
              match = re.search(pattern, html, re.I)
              if match:
                  print(match.group(1))
                  break
          PY
          )

            if [[ -z "$image" ]]; then
              echo "WAIT image-metadata $url"
              return 1
            fi

            if [[ "$image" == /* ]]; then
              image="https://texasdefined.com$image"
            fi

            image_code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 25 "$image" || echo 000)
            if [[ "$image_code" != "200" ]]; then
              echo "WAIT image=$image_code $image ($url)"
              return 1
            fi

            echo "PASS page=200 image=200 $url" | tee -a /tmp/results.txt
            return 0
          }

          for attempt in $(seq 1 12); do
            : > /tmp/next-pending.txt
            while IFS= read -r slug; do
              [[ -z "$slug" ]] && continue
              if ! verify_slug "$slug"; then
                echo "$slug" >> /tmp/next-pending.txt
              fi
            done < /tmp/pending.txt

            if [[ ! -s /tmp/next-pending.txt ]]; then
              echo "All registered county articles are live in production."
              cat /tmp/results.txt
              exit 0
            fi

            mv /tmp/next-pending.txt /tmp/pending.txt
            echo "Production is not ready for $(wc -l < /tmp/pending.txt) county article(s); attempt $attempt/12."
            cat /tmp/pending.txt
            if [[ "$attempt" -lt 12 ]]; then sleep 30; fi
          done

          echo "County production verification failed. These registered county articles are not live with working hero images:"
          cat /tmp/pending.txt
          exit 1
