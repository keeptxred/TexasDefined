name: Audit all TexasDefined editorial production routes

on:
  pull_request:
    paths:
      - '.github/workflows/audit-all-editorial-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Inventory every current editorial article from the actual repository
        shell: bash
        run: |
          set -euo pipefail
          cat > .audit-inventory-editorial.mjs <<'EOF'
          import { createServer } from 'vite';
          import fs from 'node:fs';
          const vite = await createServer({ server: { middlewareMode: true }, appType: 'custom', logLevel: 'error' });
          try {
            const mod = await vite.ssrLoadModule('/src/data/index.ts');
            const rows = await mod.platform.articles.list(mod.scope);
            const unique = [...new Map(rows.map((row) => [row.slug, row])).values()]
              .sort((a, b) => a.slug.localeCompare(b.slug));
            if (!unique.length) throw new Error('Editorial repository returned zero articles');
            fs.writeFileSync('/tmp/articles.json', JSON.stringify(unique.map((row) => ({ slug: row.slug, title: row.title, hero: row.hero?.src ?? '' })), null, 2));
            fs.writeFileSync('/tmp/slugs.txt', unique.map((row) => row.slug).join('\n') + '\n');
            console.log(`TexasDefined editorial inventory: ${unique.length} unique articles`);
            for (const row of unique) console.log(`${row.slug}\t${row.title}`);
          } finally {
            await vite.close();
          }
          EOF
          node .audit-inventory-editorial.mjs
          rm .audit-inventory-editorial.mjs
      - name: Verify every editorial page and hero image in production
        shell: bash
        run: |
          set -euo pipefail
          passed=0
          failed=0
          : > /tmp/results.txt
          node -e 'const fs=require("fs"); const a=JSON.parse(fs.readFileSync("/tmp/articles.json","utf8")); for (const x of a) console.log([x.slug,x.hero].join("\t"));' > /tmp/article-heroes.tsv
          while IFS=$'\t' read -r slug hero; do
            url="https://texasdefined.com/article/$slug"
            code=$(curl -L -sS -o /tmp/article.html -w '%{http_code}' --max-time 25 "$url" || echo 000)
            if [[ "$code" != "200" ]] || grep -Eqi 'Story unavailable|This story is no longer available|page not found' /tmp/article.html; then
              echo "FAIL page $code $url" | tee -a /tmp/results.txt
              failed=$((failed+1))
              continue
            fi
            image="$hero"
            if [[ -z "$image" ]]; then
              echo "FAIL missing-hero $url" | tee -a /tmp/results.txt
              failed=$((failed+1))
              continue
            fi
            if [[ "$image" == /* ]]; then image="https://texasdefined.com$image"; fi
            image_code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 25 "$image" || echo 000)
            if [[ "$image_code" != "200" ]]; then
              echo "FAIL image $image_code $image ($url)" | tee -a /tmp/results.txt
              failed=$((failed+1))
              continue
            fi
            echo "PASS page=200 image=200 $url" | tee -a /tmp/results.txt
            passed=$((passed+1))
          done < /tmp/article-heroes.tsv
          echo "Passed: $passed"
          echo "Failed: $failed"
          cat /tmp/results.txt
          [[ "$failed" -eq 0 ]]
