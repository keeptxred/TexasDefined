name: Verify Rockwall County production

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HERO_URL: https://commons.wikimedia.org/wiki/Special:Redirect/file/Rockwall%20county%20tx%20courthouse%202014.jpg?width=1600
      EXPECTED_TITLE: 'Rockwall County: The Rock Wall, Lake Ray Hubbard and a Small County in a Fast-Growing Metro'
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate, deploy and verify newest stable main
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          fixture='src/data/fixtures/rockwall-county-rockwall-heath-lake-ray-hubbard-blackland-prairie-texas.ts'
          for pass in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            target="$(git rev-parse HEAD)"
            test -f "$fixture"
            grep -Fq 'countySlug: "rockwall"' src/data/county-series-profiles-northeast.ts
            grep -Fq '["rockwall-county-rockwall-heath-lake-ray-hubbard-blackland-prairie-texas", "rockwall"]' src/data/county-series.ts
            grep -Fq "$EXPECTED_TITLE" "$fixture"
            if grep -n 'www\.texasdefined\.com' "$fixture" src/data/county-series-profiles-northeast.ts src/data/county-series.ts; then exit 1; fi

            workdir="$(mktemp -d)"
            hero_status="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$workdir/hero-headers" -o "$workdir/hero" -w '%{http_code}' "$HERO_URL")"
            hero_mime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$workdir/hero-headers" | cut -d';' -f1)"
            test "$hero_status" = '200'
            case "$hero_mime" in image/jpeg|image/png|image/webp) ;; *) exit 1;; esac
            test "$(wc -c < "$workdir/hero")" -gt 50000

            npm run validate
            git fetch origin main
            latest="$(git rev-parse origin/main)"
            if [ "$latest" != "$target" ]; then rm -rf "$workdir"; continue; fi

            npm run deploy
            git fetch origin main
            latest="$(git rev-parse origin/main)"
            if [ "$latest" != "$target" ]; then rm -rf "$workdir"; continue; fi

            origin='https://texasdefined.com'
            county='/county/rockwall'
            legacy='/article/rockwall-county-rockwall-heath-lake-ray-hubbard-blackland-prairie-texas'
            ok=0
            for attempt in $(seq 1 12); do
              status="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$workdir/page" -w '%{http_code}' "$origin$county?verify=${target}-${GITHUB_RUN_ID}-$attempt")"
              if [ "$status" = '200' ] && grep -Fq "$EXPECTED_TITLE" "$workdir/page" && grep -Fq 'The county in numbers' "$workdir/page" && grep -Fq 'County seat' "$workdir/page" && grep -Fq '2020 population' "$workdir/page" && grep -Fq 'County feature' "$workdir/page" && grep -Fq 'Rockwall' "$workdir/page" && grep -Fq 'https://texasdefined.com/county/rockwall' "$workdir/page"; then ok=1; break; fi
              sleep 5
            done
            test "$ok" = '1'

            legacy_status="$(curl --max-redirs 0 -sS -D "$workdir/legacy-headers" -o /dev/null -w '%{http_code}' "$origin$legacy")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$workdir/legacy-headers")"
            test "$legacy_status" = '301'
            [[ "$location" == *'/county/rockwall'* ]]

            live_hero_status="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$workdir/live-hero-headers" -o "$workdir/live-hero" -w '%{http_code}' "$HERO_URL")"
            live_hero_mime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$workdir/live-hero-headers" | cut -d';' -f1)"
            test "$live_hero_status" = '200'
            case "$live_hero_mime" in image/jpeg|image/png|image/webp) ;; *) exit 1;; esac
            live_hero_bytes="$(wc -c < "$workdir/live-hero")"
            test "$live_hero_bytes" -gt 50000

            echo "PASS target=$target county_status=200 structured=yes editorial=yes legacy_status=$legacy_status location=$location hero_status=$live_hero_status hero_mime=$live_hero_mime hero_bytes=$live_hero_bytes"
            rm -rf "$workdir"
            exit 0
          done
          echo 'Could not obtain stable main after five passes.' >&2
          exit 1
