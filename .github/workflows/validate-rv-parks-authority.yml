name: Validate RV camping authority

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/validate-rv-parks-authority.yml'
      - '.github/workflows/rv-park-hero-assets.yml'
      - 'scripts/data/sync-rv-park-hero-assets.mjs'
      - 'scripts/data/enforce-rv-park-hero-location-policy.mjs'
      - 'scripts/data/enforce-rv-hero-subject-quality.mjs'
      - 'scripts/data/validate-rv-hero-resolver-safety.mjs'
      - 'scripts/data/validate-rv-parks-authority.mjs'
      - 'scripts/data/audit-rv-inventory-classification.mjs'
      - 'scripts/data/validate-rv-county-server-function-isolation.mjs'
      - 'scripts/data/validate-rv-curated-public-wave2.mjs'
      - 'scripts/data/validate-rv-curated-public-wave3.mjs'
      - 'scripts/data/validate-rv-curated-public-wave4.mjs'
      - 'scripts/data/validate-rv-curated-public-wave5.mjs'
      - 'scripts/data/validate-rv-curated-public-wave6.mjs'
      - 'scripts/data/validate-rv-curated-public-wave7.mjs'
      - 'scripts/data/validate-rv-curated-public-wave8.mjs'
      - 'scripts/data/validate-rv-curated-public-wave9.mjs'
      - 'scripts/data/validate-rv-curated-public-wave10.mjs'
      - 'scripts/data/validate-rv-curated-public-wave11.mjs'
      - 'scripts/data/validate-rv-curated-public-wave12.mjs'
      - 'scripts/ci/verify-rv-parks-production.mjs'
      - 'scripts/ci/verify-rv-wave5-production.mjs'
      - 'scripts/ci/verify-rv-wave6-production.mjs'
      - 'scripts/ci/verify-rv-wave7-production.mjs'
      - 'scripts/ci/verify-rv-wave8-production.mjs'
      - 'scripts/ci/verify-rv-wave9-production.mjs'
      - 'scripts/ci/verify-rv-wave10-production.mjs'
      - 'scripts/ci/verify-rv-wave11-production.mjs'
      - 'scripts/ci/verify-rv-wave12-production.mjs'
      - 'src/data/rv-parks/**'
      - 'src/data/county-major-events.ts'
      - 'src/data/county-major-events.server.ts'
      - 'src/data/destination-audit.ts'
      - 'src/data/destination-availability.ts'
      - 'src/data/destination-query-runtime.ts'
      - 'src/data/search-documents-runtime.ts'
      - 'src/data/explore-categories.ts'
      - 'src/data/explore-category-indexability.ts'
      - 'src/data/queries.ts'
      - 'src/data/types.ts'
      - 'src/lib/editorial-image-delivery.ts'
      - 'src/components/explore/CountyRvParks.tsx'
      - 'src/components/sports/CountySportsDestinations.tsx'
      - 'src/routes/$kind.$slug.tsx'
      - 'src/routes/explore.index.tsx'
      - 'src/routes/explore.$category.tsx'
      - 'src/routes/destination.$slug.tsx'
      - 'src/routes/sitemap-explore*xml.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-rv-parks-authority.yml'
      - '.github/workflows/rv-park-hero-assets.yml'
      - 'scripts/data/sync-rv-park-hero-assets.mjs'
      - 'scripts/data/enforce-rv-park-hero-location-policy.mjs'
      - 'scripts/data/enforce-rv-hero-subject-quality.mjs'
      - 'scripts/data/validate-rv-hero-resolver-safety.mjs'
      - 'scripts/data/validate-rv-parks-authority.mjs'
      - 'scripts/data/audit-rv-inventory-classification.mjs'
      - 'scripts/data/validate-rv-county-server-function-isolation.mjs'
      - 'scripts/data/validate-rv-curated-public-wave2.mjs'
      - 'scripts/data/validate-rv-curated-public-wave3.mjs'
      - 'scripts/data/validate-rv-curated-public-wave4.mjs'
      - 'scripts/data/validate-rv-curated-public-wave5.mjs'
      - 'scripts/data/validate-rv-curated-public-wave6.mjs'
      - 'scripts/data/validate-rv-curated-public-wave7.mjs'
      - 'scripts/data/validate-rv-curated-public-wave8.mjs'
      - 'scripts/data/validate-rv-curated-public-wave9.mjs'
      - 'scripts/data/validate-rv-curated-public-wave10.mjs'
      - 'scripts/data/validate-rv-curated-public-wave11.mjs'
      - 'scripts/data/validate-rv-curated-public-wave12.mjs'
      - 'scripts/ci/verify-rv-parks-production.mjs'
      - 'scripts/ci/verify-rv-wave5-production.mjs'
      - 'scripts/ci/verify-rv-wave6-production.mjs'
      - 'scripts/ci/verify-rv-wave7-production.mjs'
      - 'scripts/ci/verify-rv-wave8-production.mjs'
      - 'scripts/ci/verify-rv-wave9-production.mjs'
      - 'scripts/ci/verify-rv-wave10-production.mjs'
      - 'scripts/ci/verify-rv-wave11-production.mjs'
      - 'scripts/ci/verify-rv-wave12-production.mjs'
      - 'src/data/rv-parks/**'
      - 'src/data/county-major-events.ts'
      - 'src/data/county-major-events.server.ts'
      - 'src/data/destination-audit.ts'
      - 'src/data/destination-availability.ts'
      - 'src/data/destination-query-runtime.ts'
      - 'src/data/search-documents-runtime.ts'
      - 'src/data/explore-categories.ts'
      - 'src/data/explore-category-indexability.ts'
      - 'src/data/queries.ts'
      - 'src/data/types.ts'
      - 'src/lib/editorial-image-delivery.ts'
      - 'src/components/explore/CountyRvParks.tsx'
      - 'src/components/sports/CountySportsDestinations.tsx'
      - 'src/routes/$kind.$slug.tsx'
      - 'src/routes/explore.index.tsx'
      - 'src/routes/explore.$category.tsx'
      - 'src/routes/destination.$slug.tsx'
      - 'src/routes/sitemap-explore*xml.ts'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check RV hero resolver syntax
        run: node --check scripts/data/sync-rv-park-hero-assets.mjs
      - name: Check strict RV hero location enforcement syntax
        run: node --check scripts/data/enforce-rv-park-hero-location-policy.mjs
      - name: Check RV hero subject-quality enforcement syntax
        run: node --check scripts/data/enforce-rv-hero-subject-quality.mjs
      - name: Validate RV hero resolver safety contract
        run: node scripts/data/validate-rv-hero-resolver-safety.mjs
      - name: Validate RV camping authority contract
        run: node scripts/data/validate-rv-parks-authority.mjs
      - name: Audit RV inventory classification
        run: node scripts/data/audit-rv-inventory-classification.mjs --summary
      - name: Validate unified county discovery boundary
        run: node scripts/data/validate-rv-county-server-function-isolation.mjs
      - name: Validate curated public RV wave two
        run: node scripts/data/validate-rv-curated-public-wave2.mjs
      - name: Validate curated public RV wave three
        run: node scripts/data/validate-rv-curated-public-wave3.mjs
      - name: Validate curated public RV wave four
        run: node scripts/data/validate-rv-curated-public-wave4.mjs
      - name: Validate curated public RV wave five
        run: node scripts/data/validate-rv-curated-public-wave5.mjs
      - name: Validate curated public RV wave six
        run: node scripts/data/validate-rv-curated-public-wave6.mjs
      - name: Validate curated public RV wave seven
        run: node scripts/data/validate-rv-curated-public-wave7.mjs
      - name: Validate curated public RV wave eight
        run: node scripts/data/validate-rv-curated-public-wave8.mjs
      - name: Validate curated public RV wave nine
        run: node scripts/data/validate-rv-curated-public-wave9.mjs
      - name: Validate curated public RV wave ten
        run: node scripts/data/validate-rv-curated-public-wave10.mjs
      - name: Validate curated public RV wave eleven
        run: node scripts/data/validate-rv-curated-public-wave11.mjs
      - name: Validate curated public RV wave twelve
        run: node scripts/data/validate-rv-curated-public-wave12.mjs

  production:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify RV collection, profile, county, sitemap and hero on production
        run: node scripts/ci/verify-rv-parks-production.mjs
      - name: Verify RV Wave 5 production publication
        run: node scripts/ci/verify-rv-wave5-production.mjs
      - name: Verify RV Wave 6 production publication
        run: node scripts/ci/verify-rv-wave6-production.mjs
      - name: Verify RV Wave 7 production publication
        run: node scripts/ci/verify-rv-wave7-production.mjs
      - name: Verify RV Wave 8 production content and image gate
        run: node scripts/ci/verify-rv-wave8-production.mjs
      - name: Verify RV Wave 9 production content and image gate
        run: node scripts/ci/verify-rv-wave9-production.mjs
      - name: Verify RV Wave 10 production content and image gate
        run: node scripts/ci/verify-rv-wave10-production.mjs
      - name: Verify RV Wave 11 production content and image gate
        run: node scripts/ci/verify-rv-wave11-production.mjs
      - name: Verify RV Wave 12 production content and image gate
        run: node scripts/ci/verify-rv-wave12-production.mjs
