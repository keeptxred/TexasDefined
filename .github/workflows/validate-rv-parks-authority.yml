name: Validate RV camping authority

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/validate-rv-parks-authority.yml'
      - 'scripts/data/validate-rv-parks-authority.mjs'
      - 'scripts/data/audit-rv-inventory-classification.mjs'
      - 'scripts/data/validate-rv-county-server-function-isolation.mjs'
      - 'scripts/data/validate-rv-curated-public-wave2.mjs'
      - 'scripts/ci/verify-rv-parks-production.mjs'
      - 'src/data/rv-parks/**'
      - 'src/data/county-major-events.ts'
      - 'src/data/county-major-events.server.ts'
      - 'src/data/destination-audit.ts'
      - 'src/data/destination-availability.ts'
      - 'src/data/destination-query-runtime.ts'
      - 'src/data/search-documents-runtime.ts'
      - 'src/data/explore-categories.ts'
      - 'src/data/explore-category-indexability.ts'
      - 'src/data/queries.ts'
      - 'src/data/types.ts'
      - 'src/lib/editorial-image-delivery.ts'
      - 'src/components/explore/CountyRvParks.tsx'
      - 'src/components/sports/CountySportsDestinations.tsx'
      - 'src/routes/$kind.$slug.tsx'
      - 'src/routes/explore.index.tsx'
      - 'src/routes/explore.$category.tsx'
      - 'src/routes/destination.$slug.tsx'
      - 'src/routes/sitemap-explore*xml.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-rv-parks-authority.yml'
      - 'scripts/data/validate-rv-parks-authority.mjs'
      - 'scripts/data/audit-rv-inventory-classification.mjs'
      - 'scripts/data/validate-rv-county-server-function-isolation.mjs'
      - 'scripts/data/validate-rv-curated-public-wave2.mjs'
      - 'scripts/ci/verify-rv-parks-production.mjs'
      - 'src/data/rv-parks/**'
      - 'src/data/county-major-events.ts'
      - 'src/data/county-major-events.server.ts'
      - 'src/data/destination-audit.ts'
      - 'src/data/destination-availability.ts'
      - 'src/data/destination-query-runtime.ts'
      - 'src/data/search-documents-runtime.ts'
      - 'src/data/explore-categories.ts'
      - 'src/data/explore-category-indexability.ts'
      - 'src/data/queries.ts'
      - 'src/data/types.ts'
      - 'src/lib/editorial-image-delivery.ts'
      - 'src/components/explore/CountyRvParks.tsx'
      - 'src/components/sports/CountySportsDestinations.tsx'
      - 'src/routes/$kind.$slug.tsx'
      - 'src/routes/explore.index.tsx'
      - 'src/routes/explore.$category.tsx'
      - 'src/routes/destination.$slug.tsx'
      - 'src/routes/sitemap-explore*xml.ts'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate RV camping authority contract
        run: node scripts/data/validate-rv-parks-authority.mjs
      - name: Audit RV inventory classification
        run: node scripts/data/audit-rv-inventory-classification.mjs --summary
      - name: Validate unified county discovery boundary
        run: node scripts/data/validate-rv-county-server-function-isolation.mjs
      - name: Validate curated public RV wave two
        run: node scripts/data/validate-rv-curated-public-wave2.mjs

  production:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify RV collection, profile, county, sitemap and hero on production
        run: node scripts/ci/verify-rv-parks-production.mjs
