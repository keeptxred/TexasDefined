name: Dispatch TexasDefined Facebook Live Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-facebook-live-test.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch production Facebook workflow with live publishing
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main","inputs":{"slot":"morning","dry_run":"false"}}'
          status=$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/auto-facebook-engagement.yml/dispatches")
          cat /tmp/dispatch-response.txt || true
          if [[ "$status" != "204" ]]; then
            echo "Workflow dispatch failed with HTTP ${status}." >&2
            exit 1
          fi
          echo 'Live TexasDefined Facebook workflow dispatched successfully.'
