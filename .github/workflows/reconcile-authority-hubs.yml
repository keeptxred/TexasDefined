name: Reconcile Authority Hubs

on:
  push:
    branches: [seo/authority-search-250-20260914]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out reconciled feature branch
        uses: actions/checkout@v4
        with:
          ref: seo/authority-search-250-20260914
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply final authority discovery contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          validator_path = Path('scripts/data/validate-texas-resources-seo.mjs')
          validator = validator_path.read_text()
          old = 'if (!searchDocuments.includes(`href: "${pathValue}"`)) errors.push(`Site search discovery missing ${pathValue}.`);'
          new = 'if (!searchDocuments.includes(`["${pathValue.slice(1)}",`)) errors.push(`Site search discovery missing ${pathValue}.`);'
          if old in validator:
              validator = validator.replace(old, new)
          elif new not in validator:
              raise SystemExit('Expected site-search validator assertion not found')
          validator_path.write_text(validator)

          public_routes_path = Path('src/lib/public-routes.ts')
          public_routes = public_routes_path.read_text()
          needed = ['texas-weather', 'texas-colleges-universities', 'texas-economy']
          if not all(f'"/{slug}"' in public_routes for slug in needed):
              marker = '  "/texas-data",\n'
              if marker not in public_routes:
                  raise SystemExit('Expected public-routes insertion point not found')
              additions = ''.join(f'  "/{slug}",\n' for slug in needed if f'"/{slug}"' not in public_routes)
              public_routes = public_routes.replace(marker, marker + additions, 1)
              public_routes_path.write_text(public_routes)

          resources_path = Path('src/routes/texas-resources.lazy.tsx')
          resources = resources_path.read_text()
          if "title: 'High-demand Texas reference hubs'" not in resources:
              marker = "  {\n    title: 'Moving and settling in',"
              if marker not in resources:
                  raise SystemExit('Expected Texas Resources insertion point not found')
              block = """  {
    title: 'High-demand Texas reference hubs',
    links: [
      ['Texas weather & current conditions', '/texas-weather'],
      ['Texas colleges & universities', '/texas-colleges-universities'],
      ['Texas economy & data', '/texas-economy'],
      ['Texas facts and figures', '/texas-data'],
      ['Texas sports', '/sports'],
      ['Texas events', '/events'],
    ],
  },
"""
              resources = resources.replace(marker, block + marker, 1)
              resources_path.write_text(resources)
          PY

      - name: Regenerate TanStack route tree
        run: npm run build

      - name: Validate authority resources contract
        run: node scripts/data/validate-texas-resources-seo.mjs

      - name: Commit clean reconciled authority state and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-authority-hubs.yml
          git add scripts/data/validate-texas-resources-seo.mjs src/lib/public-routes.ts src/routes/texas-resources.lazy.tsx src/routeTree.gen.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize reconciled Texas authority hubs"
          git push origin HEAD:seo/authority-search-250-20260914
