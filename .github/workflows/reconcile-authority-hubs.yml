name: Reconcile Authority Hubs

on:
  push:
    branches: [seo/authority-search-250-20260914]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out reconciled feature branch
        uses: actions/checkout@v4
        with:
          ref: seo/authority-search-250-20260914
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply final authority discovery contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const validatorPath = 'scripts/data/validate-texas-resources-seo.mjs';
          let validator = fs.readFileSync(validatorPath, 'utf8');
          const oldAssertion = 'if (!searchDocuments.includes(`href: "${pathValue}"`)) errors.push(`Site search discovery missing ${pathValue}.`);';
          const newAssertion = 'if (!searchDocuments.includes(`["${pathValue.slice(1)}",`)) errors.push(`Site search discovery missing ${pathValue}.`);';
          if (validator.includes(oldAssertion)) validator = validator.replace(oldAssertion, newAssertion);
          else if (!validator.includes(newAssertion)) throw new Error('Expected site-search validator assertion not found');
          fs.writeFileSync(validatorPath, validator);

          const publicRoutesPath = 'src/lib/public-routes.ts';
          let publicRoutes = fs.readFileSync(publicRoutesPath, 'utf8');
          const needed = ['texas-weather', 'texas-colleges-universities', 'texas-economy'];
          const publicMarker = '  "/texas-data",\n';
          if (!needed.every((slug) => publicRoutes.includes(`"/${slug}"`))) {
            if (!publicRoutes.includes(publicMarker)) throw new Error('Expected public-routes insertion point not found');
            const additions = needed.filter((slug) => !publicRoutes.includes(`"/${slug}"`)).map((slug) => `  "/${slug}",\n`).join('');
            publicRoutes = publicRoutes.replace(publicMarker, publicMarker + additions);
            fs.writeFileSync(publicRoutesPath, publicRoutes);
          }

          const resourcesPath = 'src/routes/texas-resources.lazy.tsx';
          let resources = fs.readFileSync(resourcesPath, 'utf8');
          if (!resources.includes("title: 'High-demand Texas reference hubs'")) {
            const resourcesMarker = "  {\n    title: 'Moving and settling in',";
            if (!resources.includes(resourcesMarker)) throw new Error('Expected Texas Resources insertion point not found');
            const block = "  {\n    title: 'High-demand Texas reference hubs',\n    links: [\n      ['Texas weather & current conditions', '/texas-weather'],\n      ['Texas colleges & universities', '/texas-colleges-universities'],\n      ['Texas economy & data', '/texas-economy'],\n      ['Texas facts and figures', '/texas-data'],\n      ['Texas sports', '/sports'],\n      ['Texas events', '/events'],\n    ],\n  },\n";
            resources = resources.replace(resourcesMarker, block + resourcesMarker);
            fs.writeFileSync(resourcesPath, resources);
          }
          NODE

      - name: Regenerate TanStack route tree
        run: npm run build

      - name: Validate authority resources contract
        run: node scripts/data/validate-texas-resources-seo.mjs

      - name: Commit clean reconciled authority state and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-authority-hubs.yml
          git add scripts/data/validate-texas-resources-seo.mjs src/lib/public-routes.ts src/routes/texas-resources.lazy.tsx src/routeTree.gen.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize reconciled Texas authority hubs"
          git push origin HEAD:seo/authority-search-250-20260914
