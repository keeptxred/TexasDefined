name: One-time TexasDefined weird-town Facebook publish
# Retry nonce: verified-image-2026-09-13b

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-weird-town-facebook.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: texasdefined-one-time-weird-town-facebook
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLISHER_URL: https://keeptxred-site.freddy-coppola.workers.dev/api/public/hooks/publish-texasdefined-weird-town-once
    steps:
      - name: Publish approved weird-town article image
        shell: bash
        run: |
          set -euo pipefail

          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=keeptxred-facebook"
          oidc_token=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" | jq -r '.value // empty')
          if [[ -z "$oidc_token" ]]; then
            echo 'GitHub Actions did not issue the one-time TexasDefined Facebook OIDC token.' >&2
            exit 1
          fi

          status=$(curl -sS -o /tmp/facebook-response.json -w '%{http_code}' \
            --max-time 420 \
            -X POST \
            -H 'accept: application/json' \
            -H "Authorization: Bearer ${oidc_token}" \
            "$PUBLISHER_URL" || echo 000)

          cat /tmp/facebook-response.json 2>/dev/null || true
          echo

          if [[ "$status" != "200" ]] || ! jq -e '.ok == true' /tmp/facebook-response.json >/dev/null 2>&1; then
            echo "One-time TexasDefined Facebook publish failed with HTTP ${status}." >&2
            exit 1
          fi

          if jq -e '.posted == true' /tmp/facebook-response.json >/dev/null 2>&1; then
            post_url=$(jq -r '.post_url // empty' /tmp/facebook-response.json)
            external_id=$(jq -r '.external_id // empty' /tmp/facebook-response.json)
            echo "Published approved weird-town article image to Facebook: ${post_url:-$external_id}"
            {
              echo '### TexasDefined weird-town Facebook publish'
              echo
              echo "Published: yes"
              echo "Facebook post: ${post_url:-$external_id}"
            } >> "$GITHUB_STEP_SUMMARY"
          elif jq -e '.duplicate == true' /tmp/facebook-response.json >/dev/null 2>&1; then
            post_url=$(jq -r '.post_url // empty' /tmp/facebook-response.json)
            echo "Exact weird-town article post is already present on the Page: ${post_url:-permalink unavailable}"
            {
              echo '### TexasDefined weird-town Facebook publish'
              echo
              echo 'Published: already present (duplicate-safe no-op)'
              echo "Facebook post: ${post_url:-permalink unavailable}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Publisher returned success without a post or duplicate confirmation; failing closed.' >&2
            exit 1
          fi
