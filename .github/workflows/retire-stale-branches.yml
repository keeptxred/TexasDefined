name: Retire stale repository branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-stale-branches.yml'
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retire:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Archive unique tips and retire stale branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            "cleanup-cloudflare-migration-workflows"
            "cleanup-redundant-cloudflare-deploy"
            "cleanup-live-lake-verification"
            "cleanup-placeholder-backfill-trigger"
            "fix/ci-smokes-20260824"
            "fix/remaining-production-smokes-20260824"
            "fix/final-production-smokes-20260824"
            "cleanup/final-retired-housekeeping-20260825"
            "retire-completed-county-certifiers"
            "cleanup/retire-completed-county-certifiers-20260822"
            "cleanup/retire-completed-county-certifiers-20260822-v2"
            "retire-live-lake-diagnostic"
            "cleanup/final-housekeeping-deploy-proof-20260825"
            "agent/rv-wave3-state-park-delivery"
            "cleanup/retire-rv-wave3-delivery-20260912"
            "cleanup/remove-one-time-stale-ref-workflow-20260913"
            "maintenance/retire-final-weird-town-cleanup-20260913"
            "agent/texas-dogs-current-main-20260912"
            "backup/texas-dogs-pr1844-827b27a"
            "chore/dogs-generated-route-tree-20260912"
            "chore/texas-dogs-representative-production-smoke-20260922"
            "codex/texas-dogs-directory-current-main-20260910"
            "codex/texas-dogs-directory-reconcile-20260909"
            "codex/texas-dogs-merge-test-20260909"
            "content/texas-dogs-evergreen-wave2-20260913"
            "content/texas-dogs-practical-authority-wave3-20260919"
            "content/texas-dogs-utility-wave2-20260913"
            "feature/texas-dogs-breed-wave3-20260919"
            "feature/texas-dogs-coast-patios-20260922"
            "feature/texas-dogs-current-main"
            "feature/texas-dogs-defined-current-main"
            "feature/texas-dogs-defined-current-main-20260909"
            "feature/texas-dogs-defined-current-main-20260910"
            "feature/texas-dogs-defined-current-main-20260912"
            "feature/texas-dogs-defined-editorial-wave-1"
            "feature/texas-dogs-defined-foundation"
            "feature/texas-dogs-defined-fresh-main"
            "feature/texas-dogs-defined-reconciled"
            "feature/texas-dogs-defined-replay-2026-09-08"
            "feature/texas-dogs-evergreen-articles"
            "feature/texas-dogs-evergreen-articles-20260913"
            "feature/texas-dogs-practical-authority-20260919"
            "fix/dogs-clean-replay-20260910"
            "fix/dogs-wave2-smoke-current-main-20260919"
            "fix/texas-dogs-current-main-20260912"
            "fix/texas-dogs-discovery-20260913"
            "fix/texas-dogs-render-20260912"
            "fix/texas-dogs-route-ownership-20260912"
            "fix/texas-dogs-route-ownership-v2-20260912"
            "fix/texas-dogs-visible-lazy-fallback-20260922"
            "reconcile/texas-dogs-20260912-v2"
            "reconcile/texas-dogs-20260912"
            "seo/texas-dogs-meta-current-main-20260912"
            "seo/texas-dogs-meta-descriptions-20260912"
            "verify/dogs-live-20260912"
            "verify/dogs-production-closure-20260912-v2"
            "verify/dogs-production-closure-20260912"
            "verify/texas-dogs-browser-production-20260922"
            "verify/texas-dogs-four-breed-production-20260922"
            "verify/texas-dogs-wave2-production-20260919"
            "feat/county-industry-authority-20260924"
            "feat/industry-authority-complete-20260924-v2"
            "feat/industry-relocation-discovery-20260924"
            "feat/industry-search-discovery-20260924"
            "feat/industry-search-discovery-current-20260924"
            "feat/industry-workforce-pathways-20260924"
            "work/science-space-industry-authority"
            "fix/stale-branch-nested-archive-lookup-20260924"
          )

          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          archived=0
          retired=0
          missing=0
          preserved=0

          for branch in "${branches[@]}"; do
            if ! ref_json="$(gh api "repos/$REPOSITORY/git/ref/heads/$branch" 2>/dev/null)"; then
              echo "Already absent: $branch"
              missing=$((missing + 1))
              continue
            fi

            sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])' <<<"$ref_json")"
            ahead="$(gh api "repos/$REPOSITORY/compare/$main_sha...$sha" --jq '.ahead_by')"

            if (( ahead > 0 )); then
              short="${sha:0:12}"
              tag="archive/stale-branch/$short"
              archive_ref="archive/stale-branch/$short"
              archive_branch="archive/stale-branch/$short"
              archived_tip=0

              if gh api "repos/$REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
                archived_tip=1
                echo "Unique tip for $branch already archived as tag $tag."
              elif gh api "repos/$REPOSITORY/git/ref/$archive_ref" >/dev/null 2>&1; then
                archived_tip=1
                echo "Unique tip for $branch already archived as custom ref refs/$archive_ref."
              else
                encoded_archive_branch="$(
                  python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$archive_branch"
                )"
                archive_branch_sha="$(
                  gh api "repos/$REPOSITORY/branches/$encoded_archive_branch" \
                    --jq '.commit.sha // empty' 2>/dev/null || true
                )"
                if [[ "$archive_branch_sha" == "$sha" ]]; then
                  archived_tip=1
                  echo "Unique tip for $branch already archived as branch $archive_branch."
                fi
              fi

              if (( archived_tip == 0 )); then
                if gh api --method POST "repos/$REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null 2>&1; then
                  archived_tip=1
                  archived=$((archived + 1))
                  echo "Archived unique tip for $branch as tag $tag ($ahead unique commit(s))."
                elif gh api --method POST "repos/$REPOSITORY/git/refs" -f ref="refs/$archive_ref" -f sha="$sha" >/dev/null 2>&1; then
                  archived_tip=1
                  archived=$((archived + 1))
                  echo "Archived unique tip for $branch as custom ref refs/$archive_ref ($ahead unique commit(s))."
                fi
              fi

              if (( archived_tip == 0 )); then
                owner="${REPOSITORY%%/*}"
                closed_pr_number="$(
                  gh api --method GET "repos/$REPOSITORY/pulls" \
                    -f state=closed \
                    -f head="$owner:$branch" \
                    -f per_page=1 \
                    --jq '.[0].number // empty' 2>/dev/null || true
                )"
                if [[ -n "$closed_pr_number" ]]; then
                  archived_tip=1
                  echo "Unique tip for $branch remains recoverable through closed PR #$closed_pr_number."
                fi
              fi

              if (( archived_tip == 0 )); then
                preserved=$((preserved + 1))
                echo "Unable to verify an archive or closed PR for $branch; preserving branch and continuing."
                continue
              fi
            else
              echo "No unique commits versus current main: $branch"
            fi

            gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$branch"
            retired=$((retired + 1))
            echo "Retired stale branch: $branch"
          done

          echo "Retirement complete: retired=$retired archived_unique_tips=$archived preserved_unarchived=$preserved already_absent=$missing"

  delete-merged-head:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete merged same-repository PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$REPOSITORY/git/ref/heads/$HEAD_BRANCH" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$HEAD_BRANCH"
            echo "Deleted merged PR branch: $HEAD_BRANCH"
          else
            echo "Merged PR branch already absent: $HEAD_BRANCH"
          fi
