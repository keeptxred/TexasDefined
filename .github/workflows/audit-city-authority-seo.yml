name: Audit city authority live SEO and sitemap evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/audit-city-authority-seo.mjs'
      - '.github/workflows/audit-city-authority-seo.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/audit-city-authority-seo.mjs'
      - '.github/workflows/audit-city-authority-seo.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/ci/audit-city-authority-seo.mjs
  research:
    name: Independently collect live 11-city schema, canonical and sitemap signals
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for protected deployment at exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/ci/wait-for-protected-production.mjs
      - name: Install isolated no-cost browser tooling
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-city-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify all city schema, indexability and live sitemap inclusion
        env:
          PRODUCTION_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/ci/audit-city-authority-seo.mjs
      - name: Retain machine-readable SEO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-authority-seo-and-sitemap
          path: artifacts/city-authority-seo/
          if-no-files-found: warn
          retention-days: 30
