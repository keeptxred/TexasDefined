name: Corporate event offer outbound attribution privacy
on:
  pull_request:
    paths:
      - 'src/data/corporate-events-offers.server.ts'
      - 'src/data/corporate-event-offer-clicks.*.ts'
      - 'src/data/corporate-events.admin.server.ts'
      - 'src/components/events/ApprovedCorporateEventOffers.tsx'
      - 'src/components/events/CorporateEventOpsPanel.tsx'
      - 'src/routes/privacy.lazy.tsx'
      - 'supabase/migrations/20261023205500_group_event_offer_click_aggregates.sql'
      - 'scripts/data/validate-corporate-offer-attribution.mjs'
      - '.github/workflows/validate-corporate-offer-attribution.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/corporate-events-offers.server.ts'
      - 'src/data/corporate-event-offer-clicks.*.ts'
      - 'src/data/corporate-events.admin.server.ts'
      - 'src/components/events/ApprovedCorporateEventOffers.tsx'
      - 'src/components/events/CorporateEventOpsPanel.tsx'
      - 'src/routes/privacy.lazy.tsx'
      - 'supabase/migrations/20261023205500_group_event_offer_click_aggregates.sql'
      - 'scripts/data/validate-corporate-offer-attribution.mjs'
      - '.github/workflows/validate-corporate-offer-attribution.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/data/validate-corporate-offer-attribution.mjs
