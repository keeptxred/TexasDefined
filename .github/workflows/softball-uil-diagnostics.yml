name: Softball UIL PDF parser diagnostic (temporary)
on:
  push:
    branches: [feature/softball-uil-2026-district-directory]
    paths: ['.github/workflows/softball-uil-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check pymupdf==1.26.3
      - name: Inspect UIL original PDF structure
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,fitz
          u='https://www.uiltexas.org/files/alignments/2ASB_Rvsd6-15.pdf'
          req=urllib.request.Request(u,headers={'User-Agent':'TexasDefined research uil softball district audit (editorial)'})
          data=urllib.request.urlopen(req,timeout=25).read()
          print('download-bytes',len(data))
          doc=fitz.open(stream=data,filetype='pdf')
          pg=doc[0]
          print('page',pg.rect)
          for i,b in enumerate(pg.get_text('blocks')[:22]):
            print('BLOCK',i,'bbox',tuple(round(v,1) for v in b[:4]),'TEXT',repr(b[4][:240]))
          print('DICTIONARY FIRST 38 LINES:')
          ii=0
          for block in pg.get_text('dict')['blocks']:
            for ln in block.get('lines',[]):
              spans=ln['spans']
              text=''.join(s['text'] for s in spans)
              if text.strip() and (ii<38 or text.strip().startswith('District')):
                print('LINE',ii,'bbox',tuple(round(v,1) for v in ln['bbox']),repr(text))
              ii+=1
          PY