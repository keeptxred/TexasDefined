name: One-time Texas flag public authority verification

on:
  push:
    branches:
      - validation/texas-flag-live-20261119

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Texas flag authority and crosslinks
        run: node scripts/data/validate-texas-flag-authority.mjs
      - name: Verify actual public page, articles, indexability, sitemap and original sources
        run: node scripts/ci/verify-texas-flag-live.mjs --sources
