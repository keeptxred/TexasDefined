name: TEMP Diagnose premerge wrapper

on:
  push:
    branches:
      - fix/partner-referral-reporting-replay-20260917d

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/partner-referral-reporting-replay-20260917d
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capture canonical wrapper result
        shell: bash
        run: |
          set +e
          node scripts/ci/run-premerge-validation.mjs > /tmp/premerge-wrapper.log 2>&1
          status=$?
          set -e
          {
            echo "wrapper_exit=$status"
            echo "--- wrapper errors ---"
            grep -E '^::error|Canonical pre-merge validation failed|failed \(exit code|failed \(' /tmp/premerge-wrapper.log || true
            echo "--- final 120 lines ---"
            tail -n 120 /tmp/premerge-wrapper.log
          } > premerge-diagnostic.txt
      - name: Commit diagnostic excerpt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add premerge-diagnostic.txt
          git commit -m "TEMP capture premerge wrapper output"
          git push origin HEAD:fix/partner-referral-reporting-replay-20260917d
