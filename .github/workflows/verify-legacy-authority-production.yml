name: Verify legacy authority production

on:
  pull_request:
    paths:
      - '.github/workflows/verify-legacy-authority-production.yml'
      - 'src/data/fixtures/authority-legacy-*.ts'
      - 'src/data/fixtures/lazy-authority-legacy.ts'
      - 'src/data/queries.ts'
      - 'src/routes/article.$slug.tsx'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-legacy-authority-production.yml'
      - 'src/data/fixtures/authority-legacy-*.ts'
      - 'src/data/fixtures/lazy-authority-legacy.ts'
      - 'src/data/queries.ts'
      - 'src/routes/article.$slug.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-authority-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify 10 legacy authority articles live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe direct Worker and custom domain
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origins = [
            ['direct-worker', 'https://texasdefined-site.freddy-coppola.workers.dev'],
            ['custom-domain', 'https://texasdefined.com'],
          ];

          const articles = [
            ['texas-food-beyond-brisket-guide', 'Barbecue is essential, but Texas food only comes into focus when you follow tortillas, sausage, kolaches, Gulf seafood, border cooking, East Texas traditions and the dishes that belong to particular towns.'],
            ['moving-to-houston-address-checklist', 'Moving to Houston is an address-level decision. Flood history, drainage, taxing units, schools, utilities, insurance and the real commute can change within a few miles—and sometimes across a street.'],
            ['live-2026-06-29-the-history-behind-the-texas-stock-tank-name-bxkvg7', 'A stock tank is more than a Texas synonym for a pond. The phrase comes from ranch infrastructure, water scarcity and a working-land vocabulary that later escaped the pasture.'],
            ['bluebonnet-season-field-guide', 'Bluebonnet season is a moving Texas weather event, not one magic weekend. Follow bloom timing, soils, rain, safe roads and responsible photography instead of chasing one promised field.'],
            ['texas-dance-hall-survival', 'Texas dance halls survive when history remains useful: roofs stay dry, floors stay sound, bands keep playing and communities keep finding reasons to gather under the same old rafters.'],
            ['big-bend-in-winter', 'Big Bend becomes more approachable in winter, not easy. Mild desert afternoons, freezing nights, long distances, scarce services and elevation-driven weather make preparation part of the experience.'],
            ['friday-night-and-the-texas-town', 'Texas high-school football is only partly about football. The stadium is also a bandstand, reunion, civic stage, student workplace and weekly map of how a community sees itself.'],
            ['palo-duro-lighthouse-walk', 'The Lighthouse Trail is Palo Duro Canyon’s signature hike, but the real story is exposure: distance, canyon-floor heat, scarce shade and a final climb that arrives after the easy miles.'],
            ['hill-country-two-lane-loop', 'A Hill Country road trip works best as a loose loop through granite, rivers, ranch roads and small towns—planned enough to stay safe, flexible enough to follow the road that looks better than the itinerary.'],
            ['texas-native-garden-that-survives-august', 'A Texas garden survives August because it was designed months earlier for the right soil, roots, shade, irrigation and region—not because somebody watered harder after the leaves started burning.'],
          ];

          function visibleText(html) {
            return html
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ')
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&nbsp;/gi, ' ')
              .replace(/&amp;/gi, '&')
              .replace(/&quot;/gi, '"')
              .replace(/&#39;|&#x27;|&apos;/gi, "'")
              .replace(/&lt;/gi, '<')
              .replace(/&gt;/gi, '>')
              .replace(/\s+/g, ' ')
              .trim();
          }

          async function probe(label, origin, slug, marker, mode) {
            const suffix = mode === 'revision'
              ? `?authority-live=${encodeURIComponent(`${process.env.GITHUB_SHA ?? 'local'}-${Date.now()}-${slug}`)}`
              : '';
            const url = `${origin}/article/${slug}${suffix}`;
            let last = '';
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                const response = await fetch(url, {
                  redirect: 'follow',
                  cache: 'no-store',
                  signal: AbortSignal.timeout(30_000),
                  headers: { 'user-agent': 'TexasDefined-CI-Legacy-Authority/1.0' },
                });
                const html = await response.text();
                const text = visibleText(html);
                const reading = text.match(/About\s+(\d+)\s+min\b/i);
                const minutes = reading ? Number(reading[1]) : null;
                const markerLive = text.includes(marker);
                const readingLive = minutes !== null && minutes >= 5;
                const status = `status=${response.status} marker=${markerLive} reading=${minutes ?? 'missing'} cf-cache=${response.headers.get('cf-cache-status') ?? 'none'}`;
                console.log(`[${label}:${slug}:${mode}] attempt ${attempt} ${status}`);
                if (response.ok && markerLive && readingLive) return { label, slug, mode, minutes };
                last = `${status}; expected enriched marker and reading time >= 5 minutes`;
              } catch (error) {
                last = error instanceof Error ? error.message : String(error);
                console.log(`[${label}:${slug}:${mode}] attempt ${attempt} error=${last}`);
              }
              if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, 3000));
            }
            throw new Error(`${label}:${slug}:${mode} failed: ${last}`);
          }

          const checks = [];
          for (const [label, origin] of origins) {
            for (const [slug, marker] of articles) {
              for (const mode of ['canonical', 'revision']) checks.push([label, origin, slug, marker, mode]);
            }
          }

          const results = await Promise.allSettled(
            checks.map(([label, origin, slug, marker, mode]) => probe(label, origin, slug, marker, mode)),
          );
          const failures = results
            .filter((result) => result.status === 'rejected')
            .map((result) => result.reason instanceof Error ? result.reason.message : String(result.reason));

          if (failures.length) {
            for (const failure of failures) console.error(`::error title=Legacy authority production mismatch::${failure}`);
            process.exit(1);
          }

          console.log(`Verified ${articles.length} upgraded legacy authority articles on direct Worker and custom domain, canonical and cache-busted, with enriched copy and reading time >= 5 minutes.`);
          NODE
