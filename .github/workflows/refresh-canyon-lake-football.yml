name: Research Canyon Lake Hawks next-day football finals
on:
  workflow_dispatch:
  # Run updated source research once after merge, plus scheduled next-day checks.
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-canyon-lake-football.yml'
      - 'scripts/data/research-canyon-lake-weekly.mjs'
      - 'scripts/data/research-canyon-lake-weekly.test.mjs'
  schedule:
    # 17:37 UTC = late morning/noon Central. Daily during Aug-Dec for
    # next-day public final checks, including Saturday after Friday games.
    # Saturday remains a year-round historical correction pass.
    - cron: '37 17 * * 6'
    - cron: '37 17 * 8-12 0-5'
  pull_request:
    paths:
      - '.github/workflows/refresh-canyon-lake-football.yml'
      - 'scripts/data/refresh-canyon-lake-results.mjs'
      - 'scripts/data/refresh-canyon-lake-results.test.mjs'
      - 'scripts/data/research-canyon-lake-weekly.mjs'
      - 'scripts/data/research-canyon-lake-weekly.test.mjs'
      - 'scripts/ci/validate-comal-canyon-lake-authority.mjs'
      - 'src/data/high-school-football/program-editorial-comal-canyon-lake.ts'
permissions:
  contents: read
  issues: write
concurrency:
  group: canyon-lake-football-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate published results and public-source research
        run: |
          node --check scripts/data/research-canyon-lake-weekly.mjs
          node scripts/data/research-canyon-lake-weekly.mjs --validate
          node --test scripts/data/research-canyon-lake-weekly.test.mjs
          node scripts/ci/validate-comal-canyon-lake-authority.mjs
      - name: Research yesterday's game finals and District 13 from public reporting
        if: github.event_name != 'pull_request'
        id: research
        continue-on-error: true
        run: node scripts/data/research-canyon-lake-weekly.mjs --research
      - name: Maintain one postgame score and standings research issue
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='Canyon Lake football: weekly scores and District 13 standings research'
          bodyfile='artifacts/canyon-lake-refresh/research.md'
          if [[ ! -s "$bodyfile" ]]; then
            mkdir -p artifacts/canyon-lake-refresh
            bodyfile='/tmp/canyon-lake-research-error.md'
            printf 'Postgame research failed before writing evidence. Inspect the job logs: https://github.com/%s/actions/runs/%s\nNo score or official standings were inferred from this failure.\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$bodyfile"
          fi
          printf '\nGitHub research run: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$bodyfile"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number,title --limit 100 --jq '.[] | select(.title=="Canyon Lake football: weekly scores and District 13 standings research") | .number' | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$bodyfile"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$bodyfile"
          fi
      - name: Save public score and standings research evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: canyon-lake-research-${{ github.run_id }}
          path: artifacts/canyon-lake-refresh/
          retention-days: 30
          if-no-files-found: warn
