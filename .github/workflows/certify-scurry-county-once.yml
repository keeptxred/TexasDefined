name: Certify Scurry County production once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/certify-scurry-county-once.yml'

permissions:
  contents: write

concurrency:
  group: certify-scurry-county-once
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate deploy and certify Scurry County
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          marker='.github/certification/scurry-county.json'
          target='fd5fbef1aef738c60db22cdcad1c29e4aafe1cc3'
          hero='https://commons.wikimedia.org/wiki/Special:Redirect/file/Scurry_County_Courthouse%2C_Snyder%2C_TX_IMG_4574.JPG?width=1600'

          record() {
            status="$1"; stage="$2"; detail="$3"
            mkdir -p "$(dirname "$marker")"
            python3 - "$marker" "$status" "$stage" "$target" "$detail" <<'PY'
          import datetime, json, pathlib, sys
          path, status, stage, target, detail = sys.argv[1:]
          pathlib.Path(path).write_text(json.dumps({
            'county': 'scurry', 'status': status, 'stage': stage,
            'county_commit': target, 'tested_main': '', 'detail': detail[-12000:],
            'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }, indent=2) + '\n', encoding='utf-8')
          PY
            current="$(git rev-parse HEAD)"
            python3 - "$marker" "$current" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); d['tested_main']=sys.argv[2]; p.write_text(json.dumps(d,indent=2)+'\n')
          PY
            git add "$marker"
            git commit -m "Record Scurry County production ${status}" >/dev/null || true
            git pull --rebase origin main
            git push origin HEAD:main
          }

          git merge-base --is-ancestor "$target" HEAD || { record fail source 'Scurry county commit is not in current main ancestry'; exit 1; }
          fixture='src/data/fixtures/scurry-county-snyder-buffalo-oil-colorado-river-west-texas.ts'
          registry='src/data/county-series-profiles-rolling-plains.ts'
          test -f "$fixture" || { record fail source 'Scurry fixture missing'; exit 1; }
          grep -Fq 'countySlug: "scurry"' "$registry" || { record fail source 'Scurry profile registration missing'; exit 1; }
          grep -Fq 'Scurry County: Snyder, Buffalo Country, Oil and the Upper Colorado River' "$fixture" || { record fail source 'Scurry editorial title missing'; exit 1; }
          if grep -n 'www\.texasdefined\.com' "$fixture" "$registry" src/data/county-series.server.ts >/tmp/scurry-www.txt; then
            record fail canonical-host "$(cat /tmp/scurry-www.txt)"; exit 1
          fi
          git diff --check

          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          hcode="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$work/hh" -o "$work/hb" -w '%{http_code}' "$hero" || true)"
          hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/hh" | cut -d';' -f1)"
          hbytes="$(wc -c < "$work/hb" 2>/dev/null || echo 0)"
          if [ "$hcode" != 200 ] || ! [[ "$hmime" =~ ^image/(jpeg|png|webp)$ ]] || [ "$hbytes" -le 50000 ]; then
            record fail hero-source "HTTP=$hcode MIME=$hmime bytes=$hbytes"; exit 1
          fi

          if ! npm run validate >"$work/validate.log" 2>&1; then
            record fail validation "$(tail -240 "$work/validate.log")"; exit 1
          fi

          git fetch origin main
          latest="$(git rev-parse origin/main)"
          current="$(git rev-parse HEAD)"
          [ "$latest" = "$current" ] || { record fail main-moved-after-validation "main moved $current -> $latest"; exit 1; }

          if ! npm run deploy >"$work/deploy.log" 2>&1; then
            record fail deployment "$(tail -240 "$work/deploy.log")"; exit 1
          fi

          page=''; code=''
          for attempt in $(seq 1 12); do
            code="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$work/page" -w '%{http_code}' "https://texasdefined.com/county/scurry?verify=${target}-${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$code" = 200 ] \
              && grep -Fq 'Scurry County: Snyder, Buffalo Country, Oil and the Upper Colorado River' "$work/page" \
              && grep -Fq 'The county in numbers' "$work/page" \
              && grep -Fq 'County seat' "$work/page" \
              && grep -Fq '2020 population' "$work/page" \
              && grep -Fq 'County feature' "$work/page" \
              && grep -Fq 'Snyder' "$work/page" \
              && grep -Fq 'Canyon Reef' "$work/page" \
              && grep -Fq 'https://texasdefined.com/county/scurry' "$work/page"; then page=pass; break; fi
            sleep 5
          done
          [ "$page" = pass ] || { record fail live-page "HTTP=$code expected structured/editorial markers missing"; exit 1; }

          live_hcode="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$work/lhh" -o "$work/lhb" -w '%{http_code}' "$hero" || true)"
          live_hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/lhh" | cut -d';' -f1)"
          live_hbytes="$(wc -c < "$work/lhb" 2>/dev/null || echo 0)"
          if [ "$live_hcode" != 200 ] || ! [[ "$live_hmime" =~ ^image/(jpeg|png|webp)$ ]] || [ "$live_hbytes" -le 50000 ]; then
            record fail live-hero "HTTP=$live_hcode MIME=$live_hmime bytes=$live_hbytes"; exit 1
          fi

          legacy_code="$(curl -L --max-redirs 0 -sS -o /dev/null -w '%{http_code}' 'https://texasdefined.com/article/scurry-county-snyder-buffalo-oil-colorado-river-west-texas' || true)"
          [ "$legacy_code" != 200 ] || { record fail legacy 'Unexpected new county-series article page exists'; exit 1; }

          record pass complete "validate=PASS deploy=PASS page=200 structured=yes editorial=yes legacy=not-applicable hero=$live_hcode mime=$live_hmime bytes=$live_hbytes"
