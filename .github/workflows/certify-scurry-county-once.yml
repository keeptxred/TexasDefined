name: Certify Scurry County production once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/certify-scurry-county-once.yml'

permissions:
  contents: read

concurrency:
  group: certify-scurry-county-once
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate deploy and certify Scurry County
        shell: bash
        run: |
          set -euo pipefail
          target='fd5fbef1aef738c60db22cdcad1c29e4aafe1cc3'
          fixture='src/data/fixtures/scurry-county-snyder-buffalo-oil-colorado-river-west-texas.ts'
          registry='src/data/county-series-profiles-rolling-plains.ts'
          hero='https://commons.wikimedia.org/wiki/Special:Redirect/file/Scurry_County_Courthouse%2C_Snyder%2C_TX_IMG_4574.JPG?width=1600'

          git merge-base --is-ancestor "$target" HEAD
          test -f "$fixture"
          grep -Fq 'countySlug: "scurry"' "$registry"
          grep -Fq 'Scurry County: Snyder, Buffalo Country, Oil and the Upper Colorado River' "$fixture"
          ! grep -n 'www\.texasdefined\.com' "$fixture" "$registry" src/data/county-series.server.ts
          git diff --check

          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          hcode="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$work/hh" -o "$work/hb" -w '%{http_code}' "$hero")"
          hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/hh" | cut -d';' -f1)"
          hbytes="$(wc -c < "$work/hb")"
          [ "$hcode" = 200 ]
          [[ "$hmime" =~ ^image/(jpeg|png|webp)$ ]]
          [ "$hbytes" -gt 50000 ]
          echo "SCURRY_HERO_SOURCE HTTP=$hcode MIME=$hmime bytes=$hbytes"

          npm run validate

          git fetch origin main
          latest="$(git rev-parse origin/main)"
          current="$(git rev-parse HEAD)"
          [ "$latest" = "$current" ] || { echo "SCURRY_CERT_FAIL stage=main-moved-after-validation current=$current latest=$latest"; exit 1; }
          echo "SCURRY_VALIDATED_MAIN=$current"

          npm run deploy

          page=''; code=''
          for attempt in $(seq 1 12); do
            code="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$work/page" -w '%{http_code}' "https://texasdefined.com/county/scurry?verify=${target}-${GITHUB_RUN_ID}-${attempt}")"
            if [ "$code" = 200 ] \
              && grep -Fq 'Scurry County: Snyder, Buffalo Country, Oil and the Upper Colorado River' "$work/page" \
              && grep -Fq 'The county in numbers' "$work/page" \
              && grep -Fq 'County seat' "$work/page" \
              && grep -Fq '2020 population' "$work/page" \
              && grep -Fq 'County feature' "$work/page" \
              && grep -Fq 'Snyder' "$work/page" \
              && grep -Fq 'Canyon Reef' "$work/page" \
              && grep -Fq 'https://texasdefined.com/county/scurry' "$work/page"; then page=pass; break; fi
            sleep 5
          done
          [ "$page" = pass ]
          echo "SCURRY_LIVE_PAGE HTTP=$code structured=yes editorial=yes canonical=yes"

          live_hcode="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$work/lhh" -o "$work/lhb" -w '%{http_code}' "$hero")"
          live_hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/lhh" | cut -d';' -f1)"
          live_hbytes="$(wc -c < "$work/lhb")"
          [ "$live_hcode" = 200 ]
          [[ "$live_hmime" =~ ^image/(jpeg|png|webp)$ ]]
          [ "$live_hbytes" -gt 50000 ]
          echo "SCURRY_LIVE_HERO HTTP=$live_hcode MIME=$live_hmime bytes=$live_hbytes"

          legacy_code="$(curl -L --max-redirs 0 -sS -o /dev/null -w '%{http_code}' 'https://texasdefined.com/article/scurry-county-snyder-buffalo-oil-colorado-river-west-texas' || true)"
          [ "$legacy_code" != 200 ]
          echo "SCURRY_LEGACY status=not-applicable HTTP=$legacy_code"
          echo "SCURRY_CERT_PASS county=scurry commit=$target validated_main=$current deploy=PASS"
