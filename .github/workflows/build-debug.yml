name: Production Build Debug

# Diagnostic workflow only. The main Validate TexasDefined workflow already
# installs dependencies, validates the repository, and performs a production
# build on pushes and pull requests. Keep this workflow available for manual
# troubleshooting without doubling Actions usage on every commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Environment
        run: |
          bun --version
          node --version
          echo "Branch: $GITHUB_REF_NAME"
      - name: Clean install
        run: bun install --ignore-scripts
      - name: Installed TanStack versions
        run: |
          bun pm ls | grep -E '@tanstack|@lovable.dev|vite' || true
      - name: Route inventory
        run: |
          find src/routes -maxdepth 1 -type f -print | sort
          test -f src/routeTree.gen.ts
      - name: Production build
        run: bun run build
