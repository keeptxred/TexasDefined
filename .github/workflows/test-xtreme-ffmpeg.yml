name: Test governed Xtreme JPEG recovery

on:
  push:
    branches:
      - chat8/image-discover-final-current3-20261002
    paths:
      - .github/workflows/test-xtreme-ffmpeg.yml

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chat8/image-discover-final-current3-20261002
          fetch-depth: 0
      - name: Verify current main ancestry
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Probe governed JPEG
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt -of default=noprint_wrappers=1 public/images/sports-venues/xtreme-raceway-park.jpg
      - name: Decode governed JPEG
        run: |
          ffmpeg -hide_banner -loglevel warning -err_detect ignore_err -i public/images/sports-venues/xtreme-raceway-park.jpg -frames:v 1 -y /tmp/xtreme-source.png
          test -s /tmp/xtreme-source.png
      - name: Scale recovered frame
        run: |
          ffmpeg -hide_banner -loglevel warning -i /tmp/xtreme-source.png -frames:v 1 -vf scale=1600:900:flags=lanczos -q:v 2 -y /tmp/xtreme-raceway-park.jpg
          test -s /tmp/xtreme-raceway-park.jpg
      - name: Validate output dimensions
        run: |
          dims="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 /tmp/xtreme-raceway-park.jpg)"
          echo "Xtreme dimensions=${dims}"
          test "$dims" = '1600x900'
