name: Temporary GSC CTR Wave 9

on:
  push:
    branches:
      - agent/gsc-ctr-wave9-20260910

permissions:
  contents: write

jobs:
  apply-wave9:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'Apply GSC CTR Wave 9')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gsc-ctr-wave9-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded Wave 9 patch
        run: python3 scripts/data/apply-gsc-ctr-wave9-temp.py
      - name: Validate focused GSC contract
        run: node scripts/data/validate-gsc-page-one-ctr.mjs
      - name: Commit Wave 9 changes
        run: |
          if git diff --quiet -- src/lib/seo.ts scripts/data/validate-gsc-page-one-ctr.mjs; then
            echo "No Wave 9 changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/seo.ts scripts/data/validate-gsc-page-one-ctr.mjs
          git commit -m "Apply GSC CTR Wave 9"
          git push origin HEAD:agent/gsc-ctr-wave9-20260910
