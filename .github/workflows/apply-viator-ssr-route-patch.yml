name: Apply one-time Viator SSR route patch

on:
  push:
    branches:
      - fix/viator-barton-ssr-certification

permissions:
  contents: write

jobs:
  patch-route:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/viator-barton-ssr-certification
          fetch-depth: 0

      - name: Patch destination route and remove this helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('src/routes/destination.$slug.tsx')
          text = route.read_text()

          replacements = [
              (
                  'import { lazy, Suspense } from "react";\n',
                  '',
              ),
              (
                  'import { DestinationRelationships } from "@/components/editorial/DestinationRelationships";\n',
                  'import { DestinationRelationships } from "@/components/editorial/DestinationRelationships";\nimport { DestinationViatorBooking } from "@/components/editorial/DestinationViatorBooking";\n',
              ),
              (
                  'const DestinationViatorBooking = lazy(() =>\n  import("@/components/editorial/DestinationViatorBooking").then((module) => ({\n    default: module.DestinationViatorBooking,\n  })),\n);\n\n',
                  '',
              ),
              (
                  '    const relationshipGroups = buildDestinationRelationshipGroups(destination, catalog);\n    return { destination, graph, categories, regions, relatedArticles, relationshipGroups };\n',
                  '    const relationshipGroups = buildDestinationRelationshipGroups(destination, catalog);\n    const { resolveDestinationViatorBooking } = await import("@/data/viator-destination-booking");\n    const viatorBooking = resolveDestinationViatorBooking(destination);\n    return { destination, graph, categories, regions, relatedArticles, relationshipGroups, viatorBooking };\n',
              ),
              (
                  '  const { destination, graph, categories, regions, relatedArticles, relationshipGroups } = Route.useLoaderData();\n',
                  '  const { destination, graph, categories, regions, relatedArticles, relationshipGroups, viatorBooking } = Route.useLoaderData();\n',
              ),
              (
                  '        <Suspense fallback={null}><DestinationViatorBooking destination={destination} /></Suspense>\n',
                  '        <DestinationViatorBooking destination={destination} booking={viatorBooking} />\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one route match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          if 'lazy(' in text or '<Suspense fallback={null}><DestinationViatorBooking' in text:
              raise SystemExit('Viator lazy/null-fallback boundary remains after patch')
          if 'await import("@/data/viator-destination-booking")' not in text:
              raise SystemExit('Dynamic Viator resolver import missing after patch')

          route.write_text(text)
          Path('.github/workflows/apply-viator-ssr-route-patch.yml').unlink()
          PY

      - name: Commit route patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/destination.'$slug'.tsx .github/workflows/apply-viator-ssr-route-patch.yml
          git commit -m "Restore SSR Viator booking without eager resolver data"
          git push origin HEAD:fix/viator-barton-ssr-certification
