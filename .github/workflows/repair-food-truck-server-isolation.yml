name: Measure food-truck bundle delta

on:
  push:
    branches:
      - feature/texas-food-trucks-300

permissions:
  contents: write

jobs:
  measure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/texas-food-trucks-300
          fetch-depth: 0

      - name: Reconcile current main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Measure feature bundle
        id: feature
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build
          file=$(find dist/client/assets -maxdepth 1 -type f -name 'main-*.js' -print -quit)
          bytes=$(stat -c %s "$file")
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "Feature main bundle: $bytes bytes ($file)"

      - name: Measure current-main bundle
        id: main
        shell: bash
        run: |
          git worktree add /tmp/td-current-main origin/main
          cd /tmp/td-current-main
          npm ci --no-audit --no-fund
          npm run build
          file=$(find dist/client/assets -maxdepth 1 -type f -name 'main-*.js' -print -quit)
          bytes=$(stat -c %s "$file")
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "Current-main bundle: $bytes bytes ($file)"

      - name: Record exact delta in commit message
        shell: bash
        env:
          FEATURE_BYTES: ${{ steps.feature.outputs.bytes }}
          MAIN_BYTES: ${{ steps.main.outputs.bytes }}
        run: |
          delta=$((FEATURE_BYTES - MAIN_BYTES))
          budget=1825000
          over=$((FEATURE_BYTES - budget))
          git commit --allow-empty -m "Measure food-truck bundle: main=${MAIN_BYTES} feature=${FEATURE_BYTES} delta=${delta} over_budget=${over}"
          git push origin HEAD:feature/texas-food-trucks-300
