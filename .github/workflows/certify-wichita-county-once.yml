name: Certify Wichita County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-wichita-county-once.yml'

permissions:
  contents: write

concurrency:
  group: certify-wichita-county-once
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Verify Wichita County production and record result
        shell: bash
        env:
          HERO_URL: https://upload.wikimedia.org/wikipedia/commons/5/58/Wichita_County%2C_TX%2C_Courthouse_IMG_6884.JPG
          MARKER: .github/certification/wichita-county.json
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          target="$(git rev-parse HEAD^)"
          w="$(mktemp -d)"
          trap 'rm -rf "$w"' EXIT

          ok=0
          for attempt in $(seq 1 12); do
            ps="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$w/page" -w '%{http_code}' "https://texasdefined.com/county/wichita?verify=${target}-${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$ps" = 200 ] \
              && grep -Fq 'Wichita County: Wichita Falls, Sheppard, Oil Boom Country and the Red River' "$w/page" \
              && grep -Fq 'The county in numbers' "$w/page" \
              && grep -Fq 'County seat' "$w/page" \
              && grep -Fq '2020 population' "$w/page" \
              && grep -Fq 'County feature' "$w/page" \
              && grep -Fq 'Wichita Falls' "$w/page"; then
              ok=1; break
            fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "Wichita live page verification failed: HTTP=$ps"; exit 1; }

          legacy='https://texasdefined.com/article/wichita-county-wichita-falls-sheppard-oil-red-river-texas'
          ls="$(curl --max-redirs 0 -sS -D "$w/lh" -o /dev/null -w '%{http_code}' "$legacy" || true)"
          loc="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$w/lh")"
          [ "$ls" = 301 ] && [[ "$loc" == *'/county/wichita'* ]] || { echo "Legacy redirect failed: HTTP=$ls location=$loc"; exit 1; }

          hs="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$w/hh" -o "$w/hb" -w '%{http_code}' "$HERO_URL" || true)"
          hm="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$w/hh" | cut -d';' -f1)"
          hb="$(wc -c < "$w/hb" 2>/dev/null || echo 0)"
          [ "$hs" = 200 ] && [[ "$hm" =~ ^image/(jpeg|png|webp)$ ]] && [ "$hb" -gt 50000 ] || { echo "Hero failed: HTTP=$hs MIME=$hm bytes=$hb"; exit 1; }

          mkdir -p "$(dirname "$MARKER")"
          cat > "$MARKER" <<EOF
          {
            "county": "wichita",
            "status": "pass",
            "target_sha": "$target",
            "live_page_http": 200,
            "structured_data_visible": true,
            "editorial_visible": true,
            "legacy_http": 301,
            "legacy_location": "$loc",
            "hero_http": 200,
            "hero_mime": "$hm",
            "hero_bytes": $hb
          }
          EOF
          git add "$MARKER"
          git commit -m 'Record Wichita County production certification'
          git push origin HEAD:main
