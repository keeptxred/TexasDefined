name: Refresh Texas brewery & brewpub permits (TABC)

on:
  workflow_dispatch:
  schedule:
    - cron: '41 10 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: texas-breweries-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read TABC active BW and subordinate BP licenses (two bounded requests)
        run: node scripts/data/refresh-texas-breweries.mjs
      - name: Validate roster
        run: node scripts/data/validate-texas-breweries.mjs
      - name: Commit changed snapshot (no change means no deployment)
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add src/data/breweries/texas-breweries.generated.json
          if git diff --cached --quiet; then
            echo "Roster unchanged; no redeploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh active Texas brewing license locations"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Run protected production deployment only for changed data
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-production.yml --ref main
