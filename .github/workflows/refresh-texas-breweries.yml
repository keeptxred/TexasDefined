name: Refresh Texas brewery & brewpub permits (TABC)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/refresh-texas-breweries.yml'
      - 'scripts/data/refresh-texas-breweries.mjs'
  schedule:
    - cron: '41 10 * * *'
  push:
    branches:
      - main
      - feat/texas-breweries-directory-20261017
    paths:
      - '.github/workflows/refresh-texas-breweries.yml'
      - 'scripts/data/refresh-texas-breweries.mjs'

permissions:
  contents: write

concurrency:
  group: texas-breweries-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read TABC active BW and subordinate BP licenses (two bounded requests)
        run: node scripts/data/refresh-texas-breweries.mjs
      - name: Validate roster
        run: node scripts/data/validate-texas-breweries.mjs
      - name: Generate brewery routes for this PR only
        if: github.event_name == 'pull_request'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "import { Generator, getConfig } from '@tanstack/router-generator'; const generator = new Generator({ config: getConfig(), root: process.cwd() }); await generator.run();"
      - name: Commit changed snapshot (no commit on unchanged data)
        run: |
          git add src/data/breweries/texas-breweries.generated.json src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo "Roster and generated routes unchanged; no redeploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh active Texas brewer license locations"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
