name: Verify Benjamin football production authority
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football-benjamin-production-acceptance
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Chrome browser driver
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-benjamin-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify Benjamin desktop/mobile and Knox County reciprocal links
        env:
          ACCEPTANCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/ci/verify-football-benjamin-production.mjs
      - name: Preserve acceptance report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benjamin-football-production-acceptance
          path: artifacts/football-benjamin/
          if-no-files-found: warn
          retention-days: 14
