
name: Verify regional scope and swim indexability on production

on:
  workflow_dispatch:
  schedule:
    - cron: '43 14 * * *'

permissions:
  contents: read

concurrency:
  group: region-swimming-live-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert source-level publication contracts
        run: node scripts/ci/verify-region-scope-and-swim-indexability.mjs
      - name: Check all seven region hubs and swim category on public origin
        run: node scripts/ci/verify-region-scope-and-swim-indexability.mjs --live
