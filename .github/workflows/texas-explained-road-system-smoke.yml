name: Texas Explained road-system smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/data/fixtures/texas-explained-road-system-stubs.ts'
      - 'src/data/fixtures/texas-explained-road-systems.ts'
      - 'src/data/fixtures/lazy-evergreen.ts'
      - 'src/data/fixtures/newest-evergreen.ts'
      - 'src/routes/texas-explained.tsx'
      - '.github/workflows/texas-explained-road-system-smoke.yml'

permissions:
  contents: read

concurrency:
  group: texas-explained-road-system-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify road-system articles after deployment
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          paths=(
            '/article/texas-ranch-to-market-roads-explained'
            '/article/texas-loops-spurs-explained'
            '/article/texas-business-routes-explained'
            '/article/texas-park-recreational-roads-explained'
            '/article/texas-historic-memorial-highways-explained'
          )

          deployed='false'
          for attempt in $(seq 1 30); do
            status="$(curl --max-time 45 -sS -o /tmp/rm.html -w '%{http_code}' "$origin${paths[0]}" || true)"
            if [ "$status" = '200' ] && grep -Fq 'Ranch-to-Market Roads Explained' /tmp/rm.html; then
              deployed='true'
              echo "Road-system deployment detected on attempt $attempt."
              break
            fi
            echo "Road-system articles not deployed yet (attempt $attempt/30; status ${status:-000})."
            sleep 10
          done
          test "$deployed" = 'true' || { echo 'Road-system articles did not deploy within retry window.' >&2; exit 1; }

          python3 <<'PY'
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          origin='https://texasdefined.com'
          paths=[
              '/article/texas-ranch-to-market-roads-explained',
              '/article/texas-loops-spurs-explained',
              '/article/texas-business-routes-explained',
              '/article/texas-park-recreational-roads-explained',
              '/article/texas-historic-memorial-highways-explained',
          ]
          titles={
              paths[0]:'Ranch-to-Market Roads Explained',
              paths[1]:'Texas Loops and Spurs Explained',
              paths[2]:'Texas Business Routes Explained',
              paths[3]:'Texas Park Roads and Recreational Roads Explained',
              paths[4]:'Historic Routes vs. Memorial Highways',
          }

          def get(path):
              req=urllib.request.Request(origin+path, headers={'User-Agent':'TexasDefinedRoadSystemSmoke/1.0'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  assert response.status == 200, (path, response.status)
                  return response.read().decode('utf-8', errors='replace')

          def robots(html):
              return [m.group(1).lower() for m in re.finditer(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\']([^"\']+)', html, re.I)]

          def canonicals(html):
              return re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)', html, re.I)

          for path in paths:
              html=get(path)
              assert titles[path] in html, f'Expected title missing: {path}'
              assert not any('noindex' in value for value in robots(html)), f'Road-system article unexpectedly noindex: {path}'
              expected=origin+path
              assert canonicals(html) == [expected], f'Canonical mismatch for {path}: {canonicals(html)}'
              assert '/article/texas-highway-designations-explained' in html, f'Designations backlink missing: {path}'
              assert '/texas-explained' in html, f'Collection backlink missing: {path}'

          hub=get('/texas-explained')
          assert 'Texas road systems' in hub, 'Texas road-system section missing from Texas Explained hub'
          for path in paths:
              assert path in hub, f'Road-system article missing from Texas Explained hub: {path}'

          parent=get('/article/texas-farm-to-market-roads-explained')
          for path in paths:
              assert path in parent, f'FM-road pillar reciprocal link missing: {path}'

          seen=set(); queue=[origin+'/sitemap.xml']; visited=set()
          while queue and len(visited) < 50:
              url=queue.pop(0)
              if url in visited: continue
              visited.add(url)
              req=urllib.request.Request(url, headers={'User-Agent':'TexasDefinedRoadSystemSmoke/1.0'})
              with urllib.request.urlopen(req, timeout=45) as response: payload=response.read()
              root=ET.fromstring(payload)
              local=root.tag.rsplit('}',1)[-1]
              locs=[el.text.strip() for el in root.iter() if el.tag.rsplit('}',1)[-1]=='loc' and el.text]
              if local == 'sitemapindex': queue.extend(locs)
              else: seen.update(locs)
          missing=[origin+path for path in paths if origin+path not in seen]
          assert not missing, f'Road-system articles missing from sitemap graph: {missing}'
          print(f'Five Texas Explained road-system articles verified live across routes, canonicals, hub/parent discovery and {len(visited)} sitemap document(s).')
          PY
