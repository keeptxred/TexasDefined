name: Report Texas gateway promotion candidates

on:
  pull_request:
    paths:
      - "src/data/fixtures/texas-gateway-*.ts"
      - "scripts/data/texas-gateway-*.mjs"
      - "scripts/data/repair-texas-gateway-production-readiness.mjs"
      - "scripts/data/report-texas-gateway-promotion-candidates.mjs"
      - ".github/workflows/report-texas-gateway-promotion-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Report gateway candidates
        run: node scripts/data/report-texas-gateway-promotion-candidates.mjs
