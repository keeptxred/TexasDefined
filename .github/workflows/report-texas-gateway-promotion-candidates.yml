name: Report Texas gateway promotion candidates

on:
  pull_request:
    paths:
      - "src/data/fixtures/texas-gateway-*.ts"
      - "src/data/fixtures/lazy-texas-gateway.ts"
      - "scripts/data/texas-gateway-*.mjs"
      - "scripts/data/texas-gateway-*.json"
      - "scripts/data/report-texas-gateway-promotion-candidates.mjs"
      - ".github/workflows/report-texas-gateway-promotion-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Report editorial-status-only gateway candidates
        run: node scripts/data/report-texas-gateway-promotion-candidates.mjs
