name: Finish Texas Events Refresh

on:
  workflow_run:
    workflows:
      - Sync Texas Events
    types: [completed]
  workflow_dispatch:
    inputs:
      sync_run_id:
        description: "Successful Sync Texas Events workflow run ID to finish"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: texas-events-refresh-finisher
  cancel-in-progress: false

jobs:
  finish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve exact generated refresh PR
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.sync_run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            sync_run_id="$WORKFLOW_RUN_ID"
          else
            sync_run_id="$MANUAL_RUN_ID"
          fi
          if [[ ! "$sync_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid sync run ID::Expected a numeric Sync Texas Events run ID."
            exit 1
          fi

          branch="automation/texas-events-sync-${sync_run_id}"
          pr_json="$(gh pr list             --repo "$REPOSITORY"             --state open             --base main             --head "$branch"             --limit 2             --json number,url,title,headRefName,headRefOid)"

          count="$(jq 'length' <<<"$pr_json")"
          if [[ "$count" == "0" ]]; then
            echo "No open generated event-refresh PR exists for $branch; nothing to finish."
            echo "has_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$count" != "1" ]]; then
            echo "::error title=Ambiguous event-refresh PR::Expected exactly one open PR for $branch, found $count."
            exit 1
          fi

          pr_number="$(jq -r '.[0].number' <<<"$pr_json")"
          pr_url="$(jq -r '.[0].url' <<<"$pr_json")"
          title="$(jq -r '.[0].title' <<<"$pr_json")"
          head_ref="$(jq -r '.[0].headRefName' <<<"$pr_json")"
          head_sha="$(jq -r '.[0].headRefOid' <<<"$pr_json")"
          author="$(gh api "repos/$REPOSITORY/pulls/$pr_number" --jq '.user.login')"

          [[ "$title" == "Refresh authoritative Texas events catalog" ]] || {
            echo "::error title=Unexpected PR title::$pr_url has title '$title'."
            exit 1
          }
          [[ "$head_ref" == "$branch" ]] || {
            echo "::error title=Unexpected PR branch::$pr_url points to '$head_ref', expected '$branch'."
            exit 1
          }
          [[ "$author" == "github-actions[bot]" ]] || {
            echo "::error title=Unexpected PR author::$pr_url was opened by '$author', expected github-actions[bot]."
            exit 1
          }

          echo "has_pr=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved $pr_url at $head_sha."

      - name: Reconcile, validate, and merge exact event refresh
        if: steps.target.outputs.has_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ steps.target.outputs.branch }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          PR_URL: ${{ steps.target.outputs.pr_url }}
        shell: bash
        run: |
          set -euo pipefail

          allowed_path() {
            case "$1" in
              src/data/generated/texas-events.ts|src/data/generated/ticketmaster-events.json) return 0 ;;
              *) return 1 ;;
            esac
          }

          validate_generated_diff() {
            local base="$1"
            local head="$2"
            local found=0
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              found=1
              if ! allowed_path "$path"; then
                echo "::error title=Unexpected generated refresh path::$path is outside the two governed event catalogs."
                return 1
              fi
            done < <(git diff --name-only "$base" "$head")
            if [[ "$found" == "0" ]]; then
              echo "::error title=Empty generated refresh::The event-refresh PR contains no governed catalog changes."
              return 1
            fi
          }

          git config user.name "Texas Defined Event Refresh Finisher"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Finisher attempt $attempt/3 for $PR_URL"
            git fetch --no-tags origin main "$BRANCH"

            remote_head="$(git rev-parse "origin/$BRANCH")"
            api_head="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
            [[ "$remote_head" == "$api_head" ]] || {
              echo "::error title=PR head mismatch::Remote branch is $remote_head but PR API reports $api_head."
              exit 1
            }

            merge_base="$(git merge-base origin/main "origin/$BRANCH")"
            validate_generated_diff "$merge_base" "origin/$BRANCH"

            git checkout -B "$BRANCH" "origin/$BRANCH"

            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "Current main advanced; merging it into the generated refresh branch without rewriting history."
              if ! git merge --no-edit origin/main; then
                git merge --abort || true
                echo "::error title=Event refresh reconciliation conflict::Current main overlaps the generated event catalogs. No merge was attempted."
                exit 1
              fi
              validate_generated_diff origin/main HEAD
              git push origin "HEAD:$BRANCH"
            fi

            validated_sha="$(git rev-parse HEAD)"
            echo "Running canonical validation for reconciled event-refresh head $validated_sha."
            bash scripts/ci/dispatch-validate-branch.sh "$BRANCH" validate.yml
            bash scripts/ci/dispatch-validate-branch.sh "$BRANCH" merge-gate.yml

            git fetch --no-tags origin main "$BRANCH"
            current_branch_sha="$(git rev-parse "origin/$BRANCH")"
            if [[ "$current_branch_sha" != "$validated_sha" ]]; then
              echo "::notice title=Event refresh head changed::Expected $validated_sha, found $current_branch_sha. Revalidating."
              continue
            fi
            if ! git merge-base --is-ancestor origin/main "origin/$BRANCH"; then
              echo "::notice title=Main advanced during validation::Reconcile and validation will run again."
              continue
            fi

            gh pr merge "$PR_URL"               --repo "$REPOSITORY"               --merge               --match-head-commit "$validated_sha"

            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$validated_sha" origin/main; then
              echo "::error title=Merge verification failed::$validated_sha is not an ancestor of current main after gh pr merge."
              exit 1
            fi

            echo "Event refresh merged through the protected PR path at validated head $validated_sha."
            exit 0
          done

          echo "::error title=Event refresh could not stabilize::Main advanced during all three validation attempts; leaving $PR_URL open without merging."
          exit 1
