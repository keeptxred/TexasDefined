name: Purge authority cache after production deploy

on:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed

permissions:
  contents: read

jobs:
  purge:
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_CACHE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ZONE_NAME: texasdefined.com

    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Purge governed authority URLs
        if: ${{ env.CLOUDFLARE_CACHE_API_TOKEN != '' }}
        run: node scripts/ci/purge-cloudflare-cache.mjs

      - name: Report unavailable purge credential
        if: ${{ env.CLOUDFLARE_CACHE_API_TOKEN == '' }}
        shell: bash
        run: |
          echo '::warning title=Cloudflare cache purge unavailable::No dedicated, general, or deploy Cloudflare token is available to this workflow.'
