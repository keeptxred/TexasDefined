name: Purge authority cache after production deploy

on:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed

permissions:
  contents: read

jobs:
  purge:
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: texasdefined-publication
    env:
      CLOUDFLARE_CACHE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ZONE_NAME: texasdefined.com

    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Purge governed authority URLs
        id: purge_authority_cache
        if: ${{ env.CLOUDFLARE_CACHE_API_TOKEN != '' }}
        continue-on-error: true
        run: node scripts/ci/purge-cloudflare-cache.mjs

      - name: Report unavailable purge credential
        if: ${{ env.CLOUDFLARE_CACHE_API_TOKEN == '' }}
        shell: bash
        run: |
          echo '::warning title=Cloudflare cache purge unavailable::No dedicated, general, or deploy Cloudflare token is available. Canonical freshness verification will still run.'

      - name: Report rejected purge credential
        if: ${{ steps.purge_authority_cache.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::warning title=Cloudflare cache purge rejected::The available Cloudflare credential could not purge zone cache. Canonical freshness verification will determine whether production is actually stale.'

      - name: Verify governed authority canonical freshness
        if: ${{ always() }}
        run: |
          node --input-type=module <<'NODE'
          const authorities = [
            {
              name: 'Six-man',
              url: 'https://texasdefined.com/article/texas-six-man-football-rules-explained',
              required: [
                'Texas Six-Man Football: Rules, Scoring',
                'How It Works',
                'Six-man at a glance',
                'How the exchange rule works',
              ],
            },
            {
              name: 'Battle of Medina',
              url: 'https://texasdefined.com/article/spanish-texas-military-battle-medina',
              required: [
                'Battle of Medina: The Bloodiest Battle Fought on Texas Soil',
                'Battle of Medina at a glance',
                'Rosillo changed everything',
                "Arredondo's victory brought repression to San Antonio",
                'Joaquín de Arredondo',
              ],
            },
          ];

          const failures = [];
          for (const authority of authorities) {
            let lastMissing = authority.required;
            let lastStatus = null;
            for (let attempt = 1; attempt <= 4; attempt += 1) {
              const response = await fetch(authority.url, {
                redirect: 'follow',
                cache: 'no-store',
                signal: AbortSignal.timeout(15_000),
                headers: {
                  'cache-control': 'no-cache',
                  pragma: 'no-cache',
                  'user-agent': 'TexasDefined-CI-Authority-Freshness/1.0',
                },
              });
              lastStatus = response.status;
              if (!response.ok) {
                lastMissing = [`HTTP ${response.status}`];
              } else {
                const html = await response.text();
                lastMissing = authority.required.filter((marker) => !html.includes(marker));
                if (lastMissing.length === 0) {
                  console.log(`${authority.name} canonical page is fresh on attempt ${attempt}.`);
                  break;
                }
              }
              if (attempt < 4) await new Promise((resolve) => setTimeout(resolve, 2_000));
            }

            if (lastMissing.length > 0) {
              failures.push(`${authority.name} (${lastStatus ?? 'no response'}) missing: ${lastMissing.join(', ')}`);
            }
          }

          if (failures.length > 0) {
            throw new Error(`Authority canonical freshness failed: ${failures.join(' | ')}`);
          }
          NODE
