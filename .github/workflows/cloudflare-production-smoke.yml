# Permanent production verification for Cloudflare, indexing policy, legacy URL consolidation, and the complete Texas Explained collection.
name: Cloudflare production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-production-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify Cloudflare account, Workers, DNS and AI access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          api='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          curl --fail-with-body --silent --show-error -H "$auth" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" -o "$workdir/workers.json"
          python3 - "$workdir/workers.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          names={str(x.get('id') or x.get('name') or '') for x in (data.get('result') or [])}
          assert data.get('success') is True and 'texasdefined-site' in names, 'texasdefined-site Worker not found'
          print('Workers Scripts access verified.')
          PY

          curl --fail-with-body --silent --show-error -H "$auth" --get \
            --data-urlencode 'name=texasdefined.com' \
            --data-urlencode "account.id=$CLOUDFLARE_ACCOUNT_ID" \
            "$api/zones" -o "$workdir/zones.json"
          zone_id="$(python3 - "$workdir/zones.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          zones=[z for z in (data.get('result') or []) if z.get('name')=='texasdefined.com' and z.get('status')=='active']
          assert data.get('success') is True and len(zones)==1, f'Expected one active texasdefined.com zone, got {len(zones)}'
          print(zones[0]['id'])
          PY
          )"

          curl --fail-with-body --silent --show-error -H "$auth" --get \
            --data-urlencode 'per_page=100' \
            "$api/zones/$zone_id/dns_records" -o "$workdir/dns.json"
          python3 - "$workdir/dns.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('success') is True, 'DNS records lookup failed'
          print(f"DNS access verified; {len(data.get('result') or [])} records visible.")
          PY

          curl --fail-with-body --silent --show-error -H "$auth" --get \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" -o "$workdir/domains.json"
          python3 - "$workdir/domains.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          domains={str(x.get('hostname') or '').lower(): str(x.get('service') or '') for x in (data.get('result') or [])}
          assert data.get('success') is True
          assert domains.get('texasdefined.com')=='texasdefined-site', domains
          assert domains.get('www.texasdefined.com')=='texasdefined-site', domains
          print('Both TexasDefined Worker custom domains are attached to texasdefined-site.')
          PY

          curl --fail-with-body --silent --show-error \
            -H "$auth" -H 'Content-Type: application/json' \
            --data '{"prompt":"A simple documentary-style Texas landscape, no text"}' \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/black-forest-labs/flux-1-schnell" \
            -o "$workdir/ai.json"
          python3 - "$workdir/ai.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1], encoding='utf-8'))
          image=(data.get('result') or {}).get('image') or data.get('image')
          assert data.get('success') is True and isinstance(image, str) and len(image)>100, 'Workers AI image response missing image data'
          print('Workers AI image generation access verified.')
          PY

      - name: Verify TexasDefined live indexing and complete Texas Explained collection
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 -fsSL \
            "$origin/robots.txt" -o /tmp/robots.txt
          grep -Fq 'Sitemap: https://texasdefined.com/sitemap.xml' /tmp/robots.txt || {
            echo 'robots.txt does not advertise the canonical sitemap.xml' >&2
            exit 1
          }

          declare -A redirects=(
            ['/tools']='/decide/financial-tools'
            ['/mortgage-calculator']='/texas-mortgage-calculator'
            ['/calculators/texas-home-affordability']='/texas-home-affordability-calculator'
            ['/calculators/texas-property-tax']='/property-tax-calculators'
          )
          for path in "${!redirects[@]}"; do
            headers="$(mktemp)"
            status="$(curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 --silent --show-error --max-redirs 0 -D "$headers" -o /dev/null -w '%{http_code}' "$origin${path}?from=production-smoke")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$headers")"
            rm -f "$headers"
            expected="${redirects[$path]}?from=production-smoke"
            test "$status" = '301' || { echo "$path expected 301, got $status" >&2; exit 1; }
            [[ "$location" == *"$expected"* ]] || { echo "$path redirect mismatch: $location (expected $expected)" >&2; exit 1; }
          done
          echo 'Legacy tools and calculator redirects verified.'

          python3 <<'PY'
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          origin='https://texasdefined.com'
          core=[
              'texas-rivers-explained',
              'texas-lakes-reservoirs-explained',
              'texas-farm-to-market-roads-explained',
              'texas-courthouses-town-square',
              'texas-wildflowers-guide',
              'texas-trees-guide',
              'texas-home-architecture-regions',
              'buying-land-in-texas-guide',
              'texas-wildlife-guide',
              'texas-cultural-regions-explained',
          ]
          support=[
              'texas-river-basins-guide',
              'texas-highway-designations-explained',
              'texas-courthouse-architecture-guide',
              'texas-ecoregions-habitats-guide',
              'texas-settlement-patterns-explained',
              'texas-aquifers-springs-explained',
              'texas-prairies-grasslands-guide',
              'texas-main-street-downtowns-guide',
              'texas-railroads-town-growth-explained',
              'texas-rural-wells-water-guide',
              'texas-brazos-river-guide',
              'texas-colorado-river-guide',
              'texas-guadalupe-river-guide',
              'texas-trinity-river-guide',
              'texas-rio-grande-river-guide',
              'lake-buchanan-water-system-guide',
              'lake-travis-water-system-guide',
              'lake-whitney-water-system-guide',
              'possum-kingdom-water-system-guide',
              'toledo-bend-water-system-guide',
              'texas-ranch-to-market-roads-explained',
              'texas-loops-spurs-explained',
              'texas-business-routes-explained',
              'texas-park-recreational-roads-explained',
              'texas-historic-memorial-highways-explained',
          ]
          all_slugs=core+support
          assert len(all_slugs)==35 and len(set(all_slugs))==35
          canonical_financial=[
              '/decide/financial-tools',
              '/texas-mortgage-calculator',
              '/texas-home-affordability-calculator',
              '/property-tax-calculators',
              '/texas-closing-cost-calculator',
          ]
          legacy=[
              '/tools',
              '/mortgage-calculator',
              '/calculators/texas-home-affordability',
              '/calculators/texas-property-tax',
          ]

          def get(path):
              req=urllib.request.Request(origin+path, headers={'User-Agent':'TexasDefinedProductionSmoke/2.2'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  assert response.status == 200, (path, response.status)
                  return response.read().decode('utf-8', errors='replace')

          def robots_values(html):
              return [m.group(1).lower() for m in re.finditer(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\']([^"\']+)', html, re.I)]

          def canonical_values(html):
              return re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)', html, re.I)

          pages={path:get(path) for path in ['/', '/fishing', '/guides', '/county/travis', '/texas-symbols', '/texas-explained', '/texas-resources', '/property-tax/counties']}
          for path, html in pages.items():
              assert html.strip(), f'Empty production HTML: {path}'

          resources=pages['/texas-resources']
          assert 'Good answers for everyday Texas life' in resources, 'Start Here production content missing'
          assert not any('noindex' in value for value in robots_values(resources)), 'Start Here unexpectedly noindex'
          assert canonical_values(resources)==[origin+'/texas-resources'], f'Start Here canonical mismatch: {canonical_values(resources)}'
          assert '/texas-resources' in pages['/'], 'Homepage does not directly link to Start Here'
          print('Production Start Here homepage discovery, canonical and indexability verified.')

          regions=get('/article/texas-regions-explained')
          assert 'Texas Regions Explained' in regions, 'Texas regions article content missing'
          assert not any('noindex' in value for value in robots_values(regions)), 'Texas regions article unexpectedly noindex'
          assert canonical_values(regions)==[origin+'/article/texas-regions-explained'], f'Texas regions canonical mismatch: {canonical_values(regions)}'
          assert '/article/texas-regions-explained' in pages['/texas-explained'], 'Texas regions article missing Texas Explained inbound discovery'
          print('Texas regions evergreen indexing signals verified.')

          for path in canonical_financial:
              html=get(path)
              assert not any('noindex' in value for value in robots_values(html)), f'Canonical financial target unexpectedly noindex: {path}'
              assert canonical_values(html)==[origin+path], f'Canonical financial target mismatch for {path}: {canonical_values(html)}'
          print('Canonical financial tools indexability and canonicals verified.')

          directory=pages['/property-tax/counties']
          lubbock=get('/property-tax/county/lubbock')
          harris=get('/property-tax/county/harris')
          lubbock_appraisal=get('/appraisal-district/lubbock-appraisal-district')
          lubbock_tax=get('/tax-office/lubbock-tax-office')
          harris_appraisal=get('/appraisal-district/harris-appraisal-district')
          harris_tax=get('/tax-office/harris-tax-office')
          assert 'Texas property tax by county' in directory and not any('noindex' in value for value in robots_values(directory))
          assert 'Lubbock County' in lubbock and not any('noindex' in value for value in robots_values(lubbock))
          assert 'Harris County' in harris and any('noindex' in value for value in robots_values(harris))
          assert 'Lubbock' in lubbock_appraisal and not any('noindex' in value for value in robots_values(lubbock_appraisal))
          assert 'Lubbock' in lubbock_tax and not any('noindex' in value for value in robots_values(lubbock_tax))
          assert 'Harris' in harris_appraisal and any('noindex' in value for value in robots_values(harris_appraisal))
          assert 'Harris' in harris_tax and any('noindex' in value for value in robots_values(harris_tax))
          print('Production property-tax and local-office index/noindex behavior verified for Lubbock and Harris.')

          hub=pages['/texas-explained']
          assert '10 core guides · 25 deeper explainers' in hub, 'Texas Explained 35-article collection summary missing'
          assert 'Twenty-five focused explainers behind the core guides' in hub, 'Texas Explained depth heading missing'
          for slug in all_slugs:
              path=f'/article/{slug}'
              assert path in hub, f'Texas Explained hub missing direct discovery link: {path}'
              html=get(path)
              assert not any('noindex' in value for value in robots_values(html)), f'{path} unexpectedly noindex'
              assert canonical_values(html)==[origin+path], f'{path} canonical mismatch: {canonical_values(html)}'
              assert '/texas-explained' in html, f'{path} missing collection backlink'

          river_parent=get('/article/texas-rivers-explained')
          reservoir_parent=get('/article/texas-lakes-reservoirs-explained')
          road_parent=get('/article/texas-farm-to-market-roads-explained')
          for slug in support[10:15]:
              assert f'/article/{slug}' in river_parent, f'River pillar missing profile link: {slug}'
          for slug in support[15:20]:
              assert f'/article/{slug}' in reservoir_parent, f'Reservoir pillar missing profile link: {slug}'
          for slug in support[20:25]:
              assert f'/article/{slug}' in road_parent, f'FM-road pillar missing road-system link: {slug}'
          print('Production Texas Explained 35-article hub, canonical/indexability and reciprocal topology verified.')

          required={origin+'/texas-explained', origin+'/texas-resources', origin+'/article/texas-regions-explained', origin+'/property-tax/county/lubbock', origin+'/appraisal-district/lubbock-appraisal-district', origin+'/tax-office/lubbock-tax-office'}
          required.update(origin+path for path in canonical_financial)
          required.update(origin+f'/article/{slug}' for slug in all_slugs)
          forbidden={origin+'/property-tax/county/harris', origin+'/appraisal-district/harris-appraisal-district', origin+'/tax-office/harris-tax-office'}
          forbidden.update(origin+path for path in legacy)
          seen=set(); queue=[origin+'/sitemap.xml']; visited=set()
          while queue and len(visited)<50:
              url=queue.pop(0)
              if url in visited: continue
              visited.add(url)
              req=urllib.request.Request(url, headers={'User-Agent':'TexasDefinedProductionSmoke/2.2'})
              with urllib.request.urlopen(req, timeout=45) as response: payload=response.read()
              root=ET.fromstring(payload)
              local=root.tag.rsplit('}',1)[-1]
              locs=[el.text.strip() for el in root.iter() if el.tag.rsplit('}',1)[-1]=='loc' and el.text]
              if local=='sitemapindex': queue.extend(locs)
              else: seen.update(locs)
          missing=sorted(required-seen); leaked=sorted(forbidden & seen)
          assert not missing, f'Missing required URLs from production sitemap graph: {missing}'
          assert not leaked, f'Excluded/noindex/redirect-only URLs leaked into production sitemap graph: {leaked}'
          print(f'Production sitemap verified for {len(required)} required URLs and {len(forbidden)} intentional exclusions across {len(visited)} sitemap document(s).')
          PY

          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          curl --connect-timeout 10 --max-time 30 --silent --show-error --max-redirs 0 -D "$headers" -o /dev/null https://www.texasdefined.com/
          python3 - "$headers" <<'PY'
          import sys
          text=open(sys.argv[1], encoding='utf-8', errors='replace').read().replace('\r','')
          blocks=[b for b in text.split('\n\n') if b.strip()]
          block=blocks[-1] if blocks else text
          lines=block.splitlines()
          status=int(lines[0].split()[1]) if lines and len(lines[0].split())>1 and lines[0].split()[1].isdigit() else 0
          location=''
          for line in lines[1:]:
              if line.lower().startswith('location:'):
                  location=line.split(':',1)[1].strip(); break
          assert status in (301,308) and location.startswith('https://texasdefined.com/'), (status, location)
          print(f'www redirect verified: {status} -> {location}')
          PY
          echo 'Cloudflare production smoke test passed.'