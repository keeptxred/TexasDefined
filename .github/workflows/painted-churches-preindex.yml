name: Painted Churches pre-index authority

on:
  push:
    branches:
      - painted-churches-authority-preindex
    paths:
      - 'src/data/painted-church*'
      - 'src/components/editorial/PaintedChurch*'
      - 'src/routes/explore.painted-churches*'
      - 'src/lib/seo.ts'
      - 'src/lib/painted-church-publication.ts'
      - 'scripts/data/validate-painted-church*.mjs'
      - '.github/workflows/painted-churches-preindex.yml'
  pull_request:
    paths:
      - 'src/data/painted-church*'
      - 'src/components/editorial/PaintedChurch*'
      - 'src/routes/explore.painted-churches*'
      - 'src/lib/seo.ts'
      - 'src/lib/painted-church-publication.ts'
      - 'scripts/data/validate-painted-church*.mjs'
      - '.github/workflows/painted-churches-preindex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Existing Painted Churches regression contracts
        run: |
          node scripts/data/validate-painted-churches-seo.mjs
          node scripts/data/validate-painted-church-search-intents.mjs
          node scripts/data/validate-painted-church-search-guide-quality.mjs
          node scripts/data/validate-painted-church-map.mjs
          node scripts/data/validate-painted-church-completion.mjs
      - name: Strict pre-index authority gate
        run: |
          node scripts/data/validate-painted-church-preindex.mjs
          node scripts/data/validate-painted-church-release-review.mjs
      - name: Build production bundle
        run: npm run build
      - name: Preserve existing client bundle budget
        run: npm run performance:validate
      - name: Release-base freshness check
        shell: bash
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo 'Painted Churches authority work does not yet contain current main.' >&2
            echo 'Reconcile the authority branch with current main before any publication/indexing release.' >&2
            exit 1
          fi
          echo 'Authority branch contains current main and is eligible for final release review.'
