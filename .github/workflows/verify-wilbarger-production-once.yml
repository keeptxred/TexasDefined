name: Verify Wilbarger County production once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-wilbarger-production-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish pending status
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"wilbarger-production-certification","description":"Verifying Wilbarger county production page, redirect and hero"}' >/dev/null

      - name: Verify Wilbarger production
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          county='/county/wilbarger'
          legacy='/article/wilbarger-county-vernon-doans-crossing-red-river-rolling-plains-texas'
          hero='https://upload.wikimedia.org/wikipedia/commons/c/c0/Wilbarger_County_Courthouse%2C_Vernon%2C_TX_Picture_2206.jpg'
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          success=0
          for attempt in $(seq 1 12); do
            echo "Wilbarger verification attempt $attempt"
            if curl --fail-with-body --silent --show-error --location --max-time 30 \
              "${origin}${county}?verify=${GITHUB_SHA}-${attempt}" -o "$workdir/county.html"; then
              if grep -Fq "Wilbarger County: Vernon, Doan's Crossing and the Red River Rolling Plains" "$workdir/county.html" \
                && grep -Fq 'County seat' "$workdir/county.html" \
                && grep -Fq 'Vernon' "$workdir/county.html"; then
                success=1
                break
              fi
            fi
            sleep 10
          done
          test "$success" -eq 1

          status="$(curl --silent --show-error --max-time 30 -o /dev/null -D "$workdir/legacy.headers" -w '%{http_code}' "${origin}${legacy}")"
          case "$status" in
            301|308) ;;
            *) echo "Expected permanent redirect, got $status" >&2; cat "$workdir/legacy.headers" >&2; exit 1 ;;
          esac
          tr -d '\r' < "$workdir/legacy.headers" | grep -Eiq '^location: https://texasdefined\.com/county/wilbarger/?$|^location: /county/wilbarger/?$'

          hero_status="$(curl --silent --show-error --location --max-time 30 -o "$workdir/hero.jpg" -D "$workdir/hero.headers" -w '%{http_code}' "$hero")"
          test "$hero_status" = '200'
          tr -d '\r' < "$workdir/hero.headers" | grep -Eiq '^content-type: image/(jpeg|png|webp)'
          test "$(wc -c < "$workdir/hero.jpg")" -gt 10000

          echo "Wilbarger production page, structured county layer, editorial feature, permanent legacy redirect and raster hero all verified."

      - name: Publish success status
        if: ${{ steps.verify.outcome == 'success' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"wilbarger-production-certification","description":"Wilbarger production page, redirect and hero verified"}' >/dev/null

      - name: Publish failure status
        if: ${{ failure() }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"wilbarger-production-certification","description":"Wilbarger production verification failed"}' >/dev/null
