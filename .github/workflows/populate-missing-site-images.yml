name: Populate missing site images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/data/populate-missing-site-images.mjs"
      - ".github/workflows/populate-missing-site-images.yml"

permissions:
  contents: write

concurrency:
  group: populate-missing-site-images
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure JPEG conversion support
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi

      - name: Populate missing editorial JPEGs
        run: node scripts/data/populate-missing-site-images.mjs

      - name: Commit populated images
        run: |
          git config user.name "Texas Defined Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src scripts/data/missing-site-image-report.json
          if git diff --cached --quiet; then
            echo "No missing site image changes to commit."
            exit 0
          fi
          git commit -m "fix: populate missing Texas Defined editorial images [skip ci]"
          git pull --rebase origin main
          git push
