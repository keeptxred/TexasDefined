name: Sync partner referral analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
    - cron: '23 18 * * *' # Once-daily CJ reconciliation, same protected workflow
  push:
    branches: [main]
    paths:
      - 'scripts/monetization/sync-partner-referral-analytics.mjs'
      - 'supabase/migrations/20260916032000_create_partner_referral_daily.sql'
      - '.github/workflows/sync-partner-referral-analytics.yml'

permissions:
  contents: read
  id-token: write # No stored shared signing secret; short-lived GitHub OIDC JWT

concurrency:
  group: partner-referral-analytics-sync
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: texasdefined-publication
    steps:
      - name: Authorize private referral sync
        run: echo "Protected texasdefined-publication environment gate passed."

  sync:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync private referral aggregates
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ftkznprjljkhymknvhye.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY }}
          PARTNER_REFERRAL_SYNC_IF_STALE_MINUTES: ${{ github.event_name == 'workflow_run' && '70' || (github.event_name == 'schedule' && github.event.schedule == '47 * * * *' && '70' || '') }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node scripts/monetization/sync-partner-referral-analytics.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Partner referral analytics sync failed after $attempt attempts." >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Transient analytics sync failure; retrying in ${delay}s (attempt $((attempt + 1))/4)." >&2
            sleep "$delay"
          done

      - name: Reconcile private CJ transactions and program terms once daily
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '23 18 * * *' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC URL missing}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token missing}"
          # GitHub issues this token only to the job on protected main;
          # the Worker independently verifies JWT signature, audience,
          # exact workflow/ref, and short lifetime before contacting CJ.
          token_json="$(curl --fail --silent --show-error --retry 2 --max-time 15 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=texasdefined-cj-reconciliation-v1")"
          oidc="$(TOKEN_JSON="$token_json" node -e \
            'const t=JSON.parse(process.env.TOKEN_JSON || "{}"); if(!t.value || t.value.length>12000) process.exit(1); process.stdout.write(t.value)')"
          unset token_json
          report_json="$(curl --fail --silent --show-error --max-time 55 \
            -X POST \
            -H "Authorization: Bearer $oidc" \
            -H "Content-Type: application/json" \
            https://texasdefined.com/api/internal/cj-account-sync)"
          unset oidc
          REPORT_JSON="$report_json" node -e \
            'const r=JSON.parse(process.env.REPORT_JSON || "{}"); if(r.status!=="ok" || r.source!=="cj-provider") process.exit(1); console.log("PASS private CJ API synchronization: "+(r.updated?"fresh":"no-op")+"; provider totals remain private.")'
          # Do not print the JSON itself: financial amounts stay in Supabase
          # service-role-only table, never GitHub logs/artifacts.
