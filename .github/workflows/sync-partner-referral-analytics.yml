name: Sync partner referral analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_run:
    workflows:
      - 'Deploy TexasDefined production'
    types:
      - completed
    branches:
      - main
  push:
    branches: [main]
    paths:
      - 'scripts/monetization/sync-partner-referral-analytics.mjs'
      - 'supabase/migrations/20260916032000_create_partner_referral_daily.sql'
      - '.github/workflows/sync-partner-referral-analytics.yml'

permissions:
  contents: read

concurrency:
  group: partner-referral-analytics-sync
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: texasdefined-publication
    steps:
      - name: Authorize private referral sync
        run: echo "Protected texasdefined-publication environment gate passed."

  sync:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync private referral aggregates
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ftkznprjljkhymknvhye.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY }}
          PARTNER_REFERRAL_SYNC_IF_STALE_MINUTES: ${{ github.event_name == 'workflow_run' && '70' || (github.event_name == 'schedule' && github.event.schedule == '47 * * * *' && '70' || '') }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if node scripts/monetization/sync-partner-referral-analytics.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Partner referral analytics sync failed after $attempt attempts." >&2
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Transient analytics sync failure; retrying in ${delay}s (attempt $((attempt + 1))/4)." >&2
            sleep "$delay"
          done
