name: Verify demand signal routes

on:
  workflow_run:
    workflows: ['Deploy TexasDefined production']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demand-signal-route-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Westcave and motorsports production routes
        env:
          PRODUCTION_ORIGIN: https://texasdefined.com
        run: node scripts/ci/verify-demand-signal-routes.mjs
