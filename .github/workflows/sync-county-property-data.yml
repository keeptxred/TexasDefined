name: Refresh county property data

on:
  # Refresh after a substantive change to the official-directory parser,
  # instead of waiting for the next weekly schedule.
  push:
    branches:
      - main
    paths:
      - 'scripts/data/sync-county-property-data.mjs'
      - '.github/workflows/sync-county-property-data.yml'
  workflow_dispatch:
    inputs:
      county:
        description: Optional single county slug to refresh; leave blank for all 254 counties
        required: false
        type: string
  schedule:
    - cron: '37 11 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: texasdefined-county-property-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh verified Comptroller snapshot
        shell: bash
        env:
          REQUESTED_COUNTY: ${{ inputs.county }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_COUNTY:-}" ]; then
            node scripts/data/sync-county-property-data.mjs --county="$REQUESTED_COUNTY"
          else
            node scripts/data/sync-county-property-data.mjs
          fi

      - name: Validate generated snapshot and crawl policy
        run: |
          node --test scripts/data/county-property-snapshot-codec.test.mjs scripts/data/county-office-link-normalization.test.mjs
          node scripts/data/validate-county-property-enrichment.mjs
          node scripts/data/validate-generated-page-quality.mjs
          node scripts/data/validate-entity-template-quality.mjs
          node scripts/data/validate-indexation-quality.mjs
          node scripts/data/validate-crawl-demand.mjs
          node scripts/data/validate-freshness-signals.mjs
          node scripts/data/validate-sitemap-routes.mjs

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/property/county-property-enrichment.generated.ts src/data/property/county-property-supplement.server.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "County property snapshot is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "County property snapshot changed."
          fi

      - name: Create refresh branch
        if: steps.changes.outputs.changed == 'true'
        id: branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/county-property-refresh-${GITHUB_RUN_ID}"
          base_sha="$(git rev-parse main)"
          # GitHub's token can update source data but cannot introduce
          # workflow changes in an initial remote branch push. Create
          # the branch at existing trusted main via the git-refs API first;
          # push only the new source-data commit on top of that known SHA.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/$branch" -f sha="$base_sha" >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add src/data/property/county-property-enrichment.generated.ts src/data/property/county-property-supplement.server.ts
          git commit -m 'Refresh verified county property data'
          git push origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Open reviewable pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'Refresh verified Texas county property-tax data' \
            --body $'Automated refresh from the Texas Comptroller Local Property Appraisal and Tax Information county directory.\n\nThe generated snapshot is source-backed and remains behind the existing freshness, unique-source, sitemap, crawl-demand, and noindex quality gates. Full repository validation will run on this pull request before merge.'
