name: Temporary legacy calculator redirect smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-legacy-calculator-redirect-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-legacy-calculator-redirect-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify legacy redirect consolidation
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          declare -A targets=(
            ['/tools']='/decide/financial-tools'
            ['/mortgage-calculator']='/texas-mortgage-calculator'
            ['/calculators/texas-home-affordability']='/texas-home-affordability-calculator'
            ['/calculators/texas-property-tax']='/property-tax-calculators'
          )

          deployed='false'
          for attempt in $(seq 1 30); do
            all_ok='true'
            for path in "${!targets[@]}"; do
              headers="$(mktemp)"
              status="$(curl --max-time 45 --silent --show-error --max-redirs 0 -D "$headers" -o /dev/null -w '%{http_code}' "$origin${path}?from=gsc" || true)"
              location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$headers")"
              rm -f "$headers"
              expected="${targets[$path]}?from=gsc"
              if [ "$status" != '301' ] || [[ "$location" != *"$expected"* ]]; then
                all_ok='false'
                echo "Not ready: $path -> status ${status:-000}; location ${location:-none}; expected $expected"
              fi
            done
            if [ "$all_ok" = 'true' ]; then
              deployed='true'
              echo "All legacy redirects detected on attempt $attempt."
              break
            fi
            sleep 10
          done
          test "$deployed" = 'true' || { echo 'Legacy redirect set did not deploy within retry window.' >&2; exit 1; }

          python3 <<'PY'
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          origin='https://texasdefined.com'
          canonical_targets=[
              '/decide/financial-tools',
              '/texas-mortgage-calculator',
              '/texas-home-affordability-calculator',
              '/property-tax-calculators',
          ]
          legacy=[
              '/tools',
              '/mortgage-calculator',
              '/calculators/texas-home-affordability',
              '/calculators/texas-property-tax',
          ]

          def get(path):
              req=urllib.request.Request(origin+path, headers={'User-Agent':'TexasDefinedLegacyRedirectSmoke/1.0'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  assert response.status == 200, (path, response.status)
                  return response.read().decode('utf-8', errors='replace')

          def robots(html):
              return [m.group(1).lower() for m in re.finditer(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\']([^"\']+)', html, re.I)]

          def canonicals(html):
              return re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)', html, re.I)

          for path in canonical_targets:
              html=get(path)
              assert not any('noindex' in value for value in robots(html)), f'Canonical target unexpectedly noindex: {path}'
              assert canonicals(html)==[origin+path], f'Canonical mismatch for {path}: {canonicals(html)}'

          seen=set(); queue=[origin+'/sitemap.xml']; visited=set()
          while queue and len(visited)<50:
              url=queue.pop(0)
              if url in visited: continue
              visited.add(url)
              req=urllib.request.Request(url, headers={'User-Agent':'TexasDefinedLegacyRedirectSmoke/1.0'})
              with urllib.request.urlopen(req, timeout=45) as response: payload=response.read()
              root=ET.fromstring(payload)
              local=root.tag.rsplit('}',1)[-1]
              locs=[el.text.strip() for el in root.iter() if el.tag.rsplit('}',1)[-1]=='loc' and el.text]
              if local=='sitemapindex': queue.extend(locs)
              else: seen.update(locs)

          for path in canonical_targets:
              assert origin+path in seen, f'Canonical target missing from sitemap: {path}'
          for path in legacy:
              assert origin+path not in seen, f'Legacy redirect leaked into sitemap: {path}'
          print(f'Legacy calculator redirect consolidation verified across {len(visited)} sitemap document(s).')
          PY
