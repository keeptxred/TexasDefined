name: Validate stay monetization policy

on:
  pull_request:
    paths:
      - 'public/expedia-travel.js'
      - 'public/stay-nearby-destination-hotels.json'
      - 'public/stay-nearby-painted-churches-hotels.json'
      - 'public/stay-nearby-context-images.js'
      - 'public/stay-nearby-ai-property-images.json'
      - 'public/images/stay-nearby/properties/**'
      - 'public/stay-affiliate-options.js'
      - 'public/stay-nearby-hotels.json'
      - 'public/stay-nearby-hotelscom-verification.json'
      - 'scripts/data/validate-expedia-affiliate.mjs'
      - 'scripts/data/validate-stay-monetization-policy.mjs'
      - 'scripts/data/validate-stay-destination-cohort.mjs'
      - 'scripts/data/validate-stay-affiliate-options.mjs'
      - 'scripts/ci/verify-stay-affiliate-production.mjs'
      - 'src/routes/__root.tsx'
      - 'src/routes/sports-venue.$slug.tsx'
      - 'src/routes/event.$slug.lazy.tsx'
      - 'src/components/editorial/DestinationVisitPlanner.tsx'
      - 'src/platform/analytics.ts'
      - 'src/data/small-town-destinations-wave1.ts'
      - 'src/data/viator-destination-expansion-wave9.ts'
      - 'src/data/museum-expansion-waco.ts'
      - '.github/workflows/verify-stay-affiliate-production.yml'
      - 'src/components/admin/StayMonetizationReadiness.tsx'
      - 'src/routes/admin.platform-health.lazy.tsx'
      - 'src/routes/admin.stay-monetization.lazy.tsx'
      - 'src/routes/admin.tsx'
      - '.github/workflows/validate-stay-monetization-policy.yml'
  push:
    branches:
      - main
    paths:
      - 'public/expedia-travel.js'
      - 'public/stay-nearby-destination-hotels.json'
      - 'public/stay-nearby-painted-churches-hotels.json'
      - 'public/stay-nearby-context-images.js'
      - 'public/stay-nearby-ai-property-images.json'
      - 'public/images/stay-nearby/properties/**'
      - 'public/stay-affiliate-options.js'
      - 'public/stay-nearby-hotels.json'
      - 'public/stay-nearby-hotelscom-verification.json'
      - 'scripts/data/validate-expedia-affiliate.mjs'
      - 'scripts/data/validate-stay-monetization-policy.mjs'
      - 'scripts/data/validate-stay-destination-cohort.mjs'
      - 'scripts/data/validate-stay-affiliate-options.mjs'
      - 'scripts/ci/verify-stay-affiliate-production.mjs'
      - 'src/routes/__root.tsx'
      - 'src/routes/sports-venue.$slug.tsx'
      - 'src/routes/event.$slug.lazy.tsx'
      - 'src/components/editorial/DestinationVisitPlanner.tsx'
      - 'src/platform/analytics.ts'
      - 'src/data/small-town-destinations-wave1.ts'
      - 'src/data/viator-destination-expansion-wave9.ts'
      - 'src/data/museum-expansion-waco.ts'
      - '.github/workflows/verify-stay-affiliate-production.yml'
      - 'src/components/admin/StayMonetizationReadiness.tsx'
      - 'src/routes/admin.platform-health.lazy.tsx'
      - 'src/routes/admin.stay-monetization.lazy.tsx'
      - 'src/routes/admin.tsx'
      - '.github/workflows/validate-stay-monetization-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate eligibility and telemetry policy
        run: node scripts/data/validate-stay-monetization-policy.mjs
      - name: Validate controlled destination cohort
        run: node scripts/data/validate-stay-destination-cohort.mjs
      - name: Preserve existing Expedia contract
        run: node scripts/data/validate-expedia-affiliate.mjs
      - name: Preserve Hotels.com and Vrbo contract
        run: node scripts/data/validate-stay-affiliate-options.mjs
