name: Finish Camping Authority Refresh

on:
  workflow_run:
    workflows: ['Texas camping daily TPWD and NPS official park advisory refresh']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful scheduled camping advisory refresh run ID
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

concurrency:
  group: camping-authority-source-pr-finisher
  cancel-in-progress: false

jobs:
  finish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out trusted current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Finish strictly bounded official-source PR after exact-branch protected validation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_run' ]]; then
            run_id="$SOURCE_RUN_ID"
          else
            run_id="$MANUAL_RUN_ID"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo '::error::Invalid camping source run ID'; exit 1; }
          source_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
          [[ "$(jq -r '.name' <<< "$source_json")" == 'Texas camping daily TPWD and NPS official park advisory refresh' &&
             "$(jq -r '.conclusion' <<< "$source_json")" == 'success' &&
             "$(jq -r '.head_branch' <<< "$source_json")" == 'main' ]] || {
            echo '::error::Refusing unsuccessful or foreign camping source run'
            exit 1
          }
          branch="automation/camping-official-alert-refresh-$run_id"
          pr_json="$(gh pr list --repo "$REPOSITORY" --base main --state open --head "$branch" --limit 2 --json number,url,title,headRefName,headRefOid)"
          count="$(jq 'length' <<< "$pr_json")"
          if [[ "$count" == '0' ]]; then
            echo 'No verified source change generated by this run; nothing to merge.'
            exit 0
          fi
          [[ "$count" == '1' ]] || { echo "::error::Ambiguous camping refresh PR count $count"; exit 1; }
          number="$(jq -r '.[0].number' <<< "$pr_json")"
          url="$(jq -r '.[0].url' <<< "$pr_json")"
          head="$(jq -r '.[0].headRefOid' <<< "$pr_json")"
          author="$(gh api "repos/$REPOSITORY/pulls/$number" --jq '.user.login')"
          [[ "$(jq -r '.[0].title' <<< "$pr_json")" == 'Camping: refresh official park operational notices' &&
             "$(jq -r '.[0].headRefName' <<< "$pr_json")" == "$branch" &&
             "$author" == 'github-actions[bot]' ]] || {
            echo '::error::Camping source PR identity is not trusted'
            exit 1
          }

          git config user.name 'Texas Defined Camping Source Finisher'
          git config user.email 'actions@users.noreply.github.com'
          git fetch --no-tags origin main "$branch"
          [[ "$(git rev-parse "origin/$branch")" == "$head" ]] || {
            echo '::error::Source PR head changed before validation'
            exit 1
          }
          base="$(git merge-base origin/main "origin/$branch")"
          changed="$(git diff --name-only "$base" "origin/$branch")"
          [[ "$changed" == 'src/data/camping/official-alerts.generated.ts' ]] || {
            echo "::error::Camping source bot can change exactly the generated advisory snapshot, got: $changed"
            exit 1
          }
          git checkout -B "$branch" "origin/$branch"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            if ! git merge --no-edit origin/main; then
              git merge --abort || true
              echo '::error::Camping authority source changed on main; refusing unsafe automatic reconciliation'
              exit 1
            fi
            git push origin "HEAD:$branch"
          fi

          # Offline regression tests use fixtures and do not touch external sources.
          node scripts/data/refresh-camping-alerts.mjs --self-test
          node scripts/data/validate-camping-guide-decision-ux.mjs
          node scripts/data/validate-camping-authority-upgrade.mjs
          validated_sha="$(git rev-parse HEAD)"
          # GITHUB_TOKEN-created PR checks need explicit workflow_dispatch.
          # Both exact-head canonical workflows must succeed before publication.
          bash scripts/ci/dispatch-validate-branch.sh "$branch" validate.yml
          bash scripts/ci/dispatch-validate-branch.sh "$branch" merge-gate.yml
          git fetch --no-tags origin main "$branch"
          [[ "$(git rev-parse "origin/$branch")" == "$validated_sha" ]] || {
            echo '::error::Camping PR moved during exact-SHA validation'
            exit 1
          }
          if ! git merge-base --is-ancestor origin/main "origin/$branch"; then
            common="$(git merge-base origin/main "origin/$branch")"
            if git diff --name-only "$common" origin/main -- src/data/camping/official-alerts.generated.ts | grep -q .; then
              echo '::error::Protected main camping advisories advanced during validation; review conflicting data'
              exit 1
            fi
            echo 'Unrelated main changes occurred; exact generated snapshot is still valid. Protected GitHub auto-merge enforces branch policy.'
          fi
          gh api -X POST "repos/$REPOSITORY/statuses/$validated_sha" \
            -f state=success -f context='Required merge gate' \
            -f description='Canonical camping source branch validation passed' \
            -f target_url="$url" >/dev/null
          gh pr merge "$url" --repo "$REPOSITORY" --merge --auto --match-head-commit "$validated_sha"
          echo "Camping source refresh passed exact-head CI and is queued for protected merge: $url" >> "$GITHUB_STEP_SUMMARY"
