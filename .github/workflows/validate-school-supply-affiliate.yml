name: Validate affiliate governance

on:
  pull_request:
    paths:
      - 'src/lib/affiliate-click.ts'
      - 'src/components/monetization/SchoolSupplyPartners.tsx'
      - 'src/data/cj-governed-links.server.ts'
      - 'docs/affiliate-portfolio-economics.md'
      - 'docs/travel-affiliate-economics.md'
      - 'scripts/data/validate-school-supply-affiliate.mjs'
      - 'scripts/data/validate-cj-governed-links.mjs'
      - '.github/workflows/validate-school-supply-affiliate.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/affiliate-click.ts'
      - 'src/components/monetization/SchoolSupplyPartners.tsx'
      - 'src/data/cj-governed-links.server.ts'
      - 'docs/affiliate-portfolio-economics.md'
      - 'docs/travel-affiliate-economics.md'
      - 'scripts/data/validate-school-supply-affiliate.mjs'
      - 'scripts/data/validate-cj-governed-links.mjs'
      - '.github/workflows/validate-school-supply-affiliate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate school-supply affiliate attribution
        run: node scripts/data/validate-school-supply-affiliate.mjs
      - name: Validate governed CJ catalogs and current terms
        run: node scripts/data/validate-cj-governed-links.mjs
