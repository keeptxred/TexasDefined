name: Measure client bundle once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/measure-client-bundle-once.yml'

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Record exact bundle size
        shell: bash
        run: |
          set -euo pipefail
          file="$(find dist/client/assets -maxdepth 1 -type f -name 'main-*.js' -print -quit)"
          bytes="$(wc -c < "$file")"
          mkdir -p .github/certifications
          printf 'sha=%s\nfile=%s\nbytes=%s\nbudget=1825000\n' "$(git rev-parse HEAD)" "$(basename "$file")" "$bytes" > .github/certifications/client-bundle-measurement.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/certifications/client-bundle-measurement.txt
          git commit -m 'Record client bundle measurement'
          git push origin HEAD:main
