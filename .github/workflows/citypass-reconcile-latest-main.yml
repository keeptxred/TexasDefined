name: CityPASS reconcile latest main

on:
  push:
    branches:
      - feature/citypass-texas-evergreen

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/citypass-texas-evergreen
          fetch-depth: 0

      - name: Merge latest main and preserve combined sitemap behavior
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/sitemap-explore[.]xml.ts')
          text = p.read_text()
          required = [
              'await import("@/data/citypass-destination-expansion")',
              'rawDestinations.push(...cityPassDestinationExpansion.filter',
              '"Cache-Control": "no-store"',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Combined sitemap contract missing after main merge: ' + ', '.join(missing))
          PY
          rm .github/workflows/citypass-reconcile-latest-main.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci: remove temporary CityPASS reconciliation helper"
          fi
          git push origin HEAD:feature/citypass-texas-evergreen
