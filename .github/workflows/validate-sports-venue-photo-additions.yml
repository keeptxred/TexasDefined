name: Validate sports venue governed hero coverage

on:
  pull_request:
    paths:
      - 'src/data/sports-venue-images.ts'
      - 'src/data/sports-venue-images-curated-overrides.ts'
      - 'src/data/sports-venue-images-additions.ts'
      - 'src/data/sports-venue-images-additions-wave2.ts'
      - 'src/data/sports-venue-images-additions-wave3.ts'
      - 'src/data/sports-venue-images-additions-wave4.ts'
      - 'src/data/sports-venue-images-additions-wave5.ts'
      - 'src/data/sports-venue-images-additions-wave6.ts'
      - 'src/data/sports-venue-images-additions-wave7.ts'
      - 'src/data/sports-venue-images-all.ts'
      - 'public/images/sports-venues/**'
      - 'src/components/sports/SportsVenueQuickAnswers.tsx'
      - 'src/components/sports/SportsVenueGuidePilotContent.tsx'
      - 'src/components/sports/SportsVenueGuidePage.tsx'
      - 'src/routes/api.sports-venue-hero.ts'
      - 'src/routes/sports-venue.$slug.tsx'
      - 'src/routes/sports-venue.jones-att-stadium.tsx'
      - 'scripts/data/validate-sports-venue-images.mjs'
      - 'scripts/data/validate-curated-sports-venue-image-layer.mjs'
      - 'scripts/data/validate-curated-sports-venue-image-sources.mjs'
      - 'scripts/data/validate-governed-sports-venue-image-sources.mjs'
      - 'scripts/data/validate-sports-venue-photo-additions.mjs'
      - 'scripts/data/validate-sports-venue-photo-additions-wave2.mjs'
      - 'scripts/data/validate-sports-venue-photo-additions-wave5.mjs'
      - 'scripts/data/validate-sports-venue-photo-additions-final.mjs'
      - '.github/workflows/validate-sports-venue-photo-additions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/data/validate-sports-venue-images.mjs
      - run: node scripts/data/validate-curated-sports-venue-image-layer.mjs
      - run: node scripts/data/validate-curated-sports-venue-image-sources.mjs
      - run: node scripts/data/validate-governed-sports-venue-image-sources.mjs
      - run: node scripts/data/validate-sports-venue-photo-additions.mjs
      - run: node scripts/data/validate-sports-venue-photo-additions-wave2.mjs
      - run: node scripts/data/validate-sports-venue-photo-additions-wave5.mjs
      - run: node scripts/data/validate-sports-venue-photo-additions-final.mjs
      - run: node scripts/data/validate-sports-venue-phase3-galaxy.mjs
      - run: node scripts/data/validate-sports-venue-deep-completeness.mjs
      - run: npm run build
      - run: npm run performance:validate
