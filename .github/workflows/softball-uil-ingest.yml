name: One-time UIL 2026-27 softball school registry
on:
  push:
    branches: [feature/softball-uil-2026-district-directory]
    paths: ['.github/workflows/softball-uil-ingest.yml']
permissions:
  contents: write
jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/softball-uil-2026-district-directory
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check pymupdf==1.26.3
      - run: python scripts/softball/extract-uil-2026.py
      - name: Commit reviewed-source registry
        run: |
          git add src/data/softball/uil-2026-27-registry.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data(softball): 2026–27 official UIL district listings"
            git push origin HEAD:feature/softball-uil-2026-district-directory
          fi