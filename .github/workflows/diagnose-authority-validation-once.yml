name: Diagnose authority validation once
on:
  push:
    paths:
      - '.github/workflows/diagnose-authority-validation-once.yml'
permissions:
  contents: read
  statuses: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run validators and publish per-validator statuses
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          validators=(
            scripts/data/validate-machine-indexing.mjs
            scripts/data/validate-things-unique-to-texas.mjs
            scripts/data/validate-texas-icon-link-depth.mjs
            scripts/data/validate-texas-weather-authority.mjs
            scripts/data/validate-texas-food-history.mjs
            scripts/data/validate-texas-culture-citation-index.mjs
            scripts/data/validate-texas-flag-authority.mjs
            scripts/data/validate-painted-churches-seo.mjs
            scripts/data/validate-painted-church-search-intents.mjs
            scripts/data/validate-painted-church-map.mjs
            scripts/data/validate-painted-church-completion.mjs
            scripts/data/validate-military-history-expansion.mjs
          )
          failed=0
          for validator in "${validators[@]}"; do
            name="$(basename "$validator" .mjs | sed 's/^validate-//')"
            node "$validator"
            rc=$?
            if [ $rc -eq 0 ]; then state=success; else state=failure; failed=1; fi
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data "{\"state\":\"$state\",\"context\":\"diag-$name\",\"description\":\"$validator exit $rc\"}" >/dev/null
          done
          exit $failed
