name: Validate experience affiliate analytics

on:
  pull_request:
    paths:
      - 'public/city-experience-affiliate.js'
      - 'src/routes/__root.tsx'
      - 'src/lib/affiliate-click.ts'
      - 'src/components/monetization/CityPassCalloutContent.tsx'
      - 'src/components/editorial/DestinationViatorBooking.tsx'
      - 'src/components/editorial/TexasExperienceMarkets.tsx'
      - 'scripts/data/validate-experience-affiliate-analytics.mjs'
      - 'scripts/ci/verify-viator-production.mjs'
      - '.github/workflows/validate-experience-affiliate-analytics.yml'
  push:
    branches: [main]
    paths:
      - 'public/city-experience-affiliate.js'
      - 'src/routes/__root.tsx'
      - 'src/lib/affiliate-click.ts'
      - 'src/components/monetization/CityPassCalloutContent.tsx'
      - 'src/components/editorial/DestinationViatorBooking.tsx'
      - 'src/components/editorial/TexasExperienceMarkets.tsx'
      - 'scripts/data/validate-experience-affiliate-analytics.mjs'
      - 'scripts/ci/verify-viator-production.mjs'
      - '.github/workflows/validate-experience-affiliate-analytics.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate CityPASS and Viator affiliate analytics
        run: node scripts/data/validate-experience-affiliate-analytics.mjs
