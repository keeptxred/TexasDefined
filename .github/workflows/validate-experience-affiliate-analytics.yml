name: Validate experience affiliate analytics

on:
  pull_request:
    paths:
      - 'public/city-experience-affiliate.js'
      - 'src/routes/__root.tsx'
      - 'src/lib/affiliate-click.ts'
      - 'src/components/monetization/CityPassCalloutContent.tsx'
      - 'src/components/editorial/DestinationViatorBooking.tsx'
      - 'src/components/editorial/TexasExperienceMarkets.tsx'
      - 'src/components/editorial/ViatorLiveProducts.tsx'
      - 'src/lib/viator-market-feed.ts'
      - 'src/data/discovery/entity-registry.ts'
      - 'src/data/discovery/canonical-links.ts'
      - 'src/data/discovery/attraction-triage.ts'
      - 'src/data/discovery/market-event-cities.ts'
      - 'src/data/discovery/explore-attraction-guides.ts'
      - 'src/data/discovery/__tests__/entity-registry.test.ts'
      - 'src/data/discovery/__tests__/canonical-links.test.ts'
      - 'src/data/discovery/__tests__/attraction-triage.test.ts'
      - 'src/lib/viator-attraction-discovery.ts'
      - 'src/lib/viator-seasonal-discovery.ts'
      - 'src/lib/__tests__/viator-attraction-discovery.test.ts'
      - 'src/components/events/CalendarBookingDiscovery.tsx'
      - 'src/components/events/EventsLandingPage.tsx'
      - 'src/routes/events.$collection.lazy.tsx'
      - 'src/data/event-collection-page.server.ts'
      - 'public/robots.txt'
      - 'scripts/data/validate-unified-discovery-governance.mjs'
      - 'scripts/data/validate-viator-new-destination-approvals.mjs'
      - 'ops/editorial/viator-new-destination-approval-ledger.json'
      - 'src/data/viator-destination-expansion-*.ts'
      - 'scripts/data/weekly-viator-attraction-discovery.mjs'
      - '.github/workflows/weekly-viator-attraction-discovery.yml'
      - 'src/lib/__tests__/viator-market-feed.test.ts'
      - 'src/server.ts'
      - 'scripts/data/validate-experience-affiliate-analytics.mjs'
      - 'scripts/ci/verify-viator-production.mjs'
      - '.github/workflows/validate-experience-affiliate-analytics.yml'
  push:
    branches: [main]
    paths:
      - 'public/city-experience-affiliate.js'
      - 'src/routes/__root.tsx'
      - 'src/lib/affiliate-click.ts'
      - 'src/components/monetization/CityPassCalloutContent.tsx'
      - 'src/components/editorial/DestinationViatorBooking.tsx'
      - 'src/components/editorial/TexasExperienceMarkets.tsx'
      - 'src/components/editorial/ViatorLiveProducts.tsx'
      - 'src/lib/viator-market-feed.ts'
      - 'src/data/discovery/entity-registry.ts'
      - 'src/data/discovery/canonical-links.ts'
      - 'src/data/discovery/attraction-triage.ts'
      - 'src/data/discovery/market-event-cities.ts'
      - 'src/data/discovery/explore-attraction-guides.ts'
      - 'src/data/discovery/__tests__/entity-registry.test.ts'
      - 'src/data/discovery/__tests__/canonical-links.test.ts'
      - 'src/data/discovery/__tests__/attraction-triage.test.ts'
      - 'src/lib/viator-attraction-discovery.ts'
      - 'src/lib/viator-seasonal-discovery.ts'
      - 'src/lib/__tests__/viator-attraction-discovery.test.ts'
      - 'src/components/events/CalendarBookingDiscovery.tsx'
      - 'src/components/events/EventsLandingPage.tsx'
      - 'src/routes/events.$collection.lazy.tsx'
      - 'src/data/event-collection-page.server.ts'
      - 'public/robots.txt'
      - 'scripts/data/validate-unified-discovery-governance.mjs'
      - 'scripts/data/validate-viator-new-destination-approvals.mjs'
      - 'ops/editorial/viator-new-destination-approval-ledger.json'
      - 'src/data/viator-destination-expansion-*.ts'
      - 'scripts/data/weekly-viator-attraction-discovery.mjs'
      - '.github/workflows/weekly-viator-attraction-discovery.yml'
      - 'src/lib/__tests__/viator-market-feed.test.ts'
      - 'src/server.ts'
      - 'scripts/data/validate-experience-affiliate-analytics.mjs'
      - 'scripts/ci/verify-viator-production.mjs'
      - '.github/workflows/validate-experience-affiliate-analytics.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate CityPASS and Viator affiliate analytics
        run: |
          node scripts/data/validate-experience-affiliate-analytics.mjs
          node --experimental-strip-types --test src/lib/__tests__/viator-market-feed.test.ts
          node scripts/data/validate-unified-discovery-governance.mjs
          node scripts/data/validate-viator-new-destination-approvals.mjs --self-test
          node --experimental-strip-types --test src/data/discovery/__tests__/entity-registry.test.ts src/data/discovery/__tests__/canonical-links.test.ts src/data/discovery/__tests__/attraction-triage.test.ts src/lib/__tests__/viator-attraction-discovery.test.ts
