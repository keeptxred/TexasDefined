name: Certify Hansford County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-hansford-county-once.yml'

permissions:
  contents: write

concurrency:
  group: certify-hansford-county-production
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HERO_URL: https://commons.wikimedia.org/wiki/Special:Redirect/file/Hansford_County_courthouse_May_2020.jpg?width=1600
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Certify current main
        id: certify
        shell: bash
        run: |
          set +e
          git fetch origin main
          git reset --hard origin/main
          target="$(git rev-parse HEAD)"
          echo "target_sha=$target" >> "$GITHUB_OUTPUT"
          : > /tmp/hansford-cert.log
          fail_stage=''
          hero_status='not-run'
          hero_mime='not-run'
          hero_bytes='0'
          live_status='not-run'

          echo '=== source checks ===' | tee -a /tmp/hansford-cert.log
          test -f src/data/fixtures/hansford-county-spearman-gruver-palo-duro-high-plains-texas.ts || fail_stage='source-fixture'
          grep -Fq 'countySlug: "hansford"' src/data/county-series-profiles-panhandle.ts || fail_stage='source-registry'
          if grep -n 'www\.texasdefined\.com' src/data/fixtures/hansford-county-spearman-gruver-palo-duro-high-plains-texas.ts src/data/county-series-profiles-panhandle.ts >> /tmp/hansford-cert.log; then fail_stage='canonical-host'; fi

          echo '=== hero source ===' | tee -a /tmp/hansford-cert.log
          hero_status="$(curl -A 'TexasDefinedCountyVerifier/1.0' -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D /tmp/hero-headers -o /tmp/hero-body -w '%{http_code}' "$HERO_URL")"
          hero_mime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' /tmp/hero-headers | cut -d';' -f1)"
          hero_bytes="$(wc -c < /tmp/hero-body)"
          echo "hero source: HTTP $hero_status $hero_mime $hero_bytes bytes" | tee -a /tmp/hansford-cert.log
          if [ "$hero_status" != '200' ] || ! [[ "$hero_mime" =~ ^image/(jpeg|png|webp)$ ]] || [ "$hero_bytes" -le 50000 ]; then fail_stage='hero-source'; fi

          if [ -z "$fail_stage" ]; then
            echo '=== npm run validate ===' | tee -a /tmp/hansford-cert.log
            npm run validate >> /tmp/hansford-cert.log 2>&1
            validate_code=$?
            echo "validate exit=$validate_code" | tee -a /tmp/hansford-cert.log
            [ "$validate_code" -eq 0 ] || fail_stage='validation'
          fi

          if [ -z "$fail_stage" ]; then
            git fetch origin main
            latest="$(git rev-parse origin/main)"
            if [ "$latest" != "$target" ]; then
              echo "main moved after validation: $target -> $latest" | tee -a /tmp/hansford-cert.log
              fail_stage='main-moved-after-validation'
            fi
          fi

          if [ -z "$fail_stage" ]; then
            echo '=== npm run deploy ===' | tee -a /tmp/hansford-cert.log
            npm run deploy >> /tmp/hansford-cert.log 2>&1
            deploy_code=$?
            echo "deploy exit=$deploy_code" | tee -a /tmp/hansford-cert.log
            [ "$deploy_code" -eq 0 ] || fail_stage='deployment'
          fi

          if [ -z "$fail_stage" ]; then
            echo '=== live verification ===' | tee -a /tmp/hansford-cert.log
            origin='https://texasdefined.com'
            county='/county/hansford'
            expected_title='Hansford County: Spearman, Gruver and the High Plains of the Northern Panhandle'
            ok=0
            for attempt in $(seq 1 12); do
              live_status="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o /tmp/hansford-page -w '%{http_code}' "$origin$county?verify=${target}-${GITHUB_RUN_ID}-$attempt")"
              if [ "$live_status" = '200' ] && grep -Fq "$expected_title" /tmp/hansford-page && grep -Fq 'The county in numbers' /tmp/hansford-page && grep -Fq 'County seat' /tmp/hansford-page && grep -Fq '2020 population' /tmp/hansford-page && grep -Fq 'County feature' /tmp/hansford-page && grep -Fq 'Spearman' /tmp/hansford-page && grep -Fq 'https://texasdefined.com/county/hansford' /tmp/hansford-page; then ok=1; break; fi
              sleep 5
            done
            echo "county HTTP=$live_status editorial_structured=$ok" | tee -a /tmp/hansford-cert.log
            [ "$ok" -eq 1 ] || fail_stage='live-county'
          fi

          if [ -z "$fail_stage" ]; then overall='pass'; else overall='fail'; fi
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          echo "fail_stage=$fail_stage" >> "$GITHUB_OUTPUT"
          echo "hero_status=$hero_status" >> "$GITHUB_OUTPUT"
          echo "hero_mime=$hero_mime" >> "$GITHUB_OUTPUT"
          echo "hero_bytes=$hero_bytes" >> "$GITHUB_OUTPUT"
          echo "live_status=$live_status" >> "$GITHUB_OUTPUT"
          echo "RESULT overall=$overall stage=${fail_stage:-none} target=$target" | tee -a /tmp/hansford-cert.log
          exit 0

      - name: Record certification diagnostics
        if: always()
        shell: bash
        env:
          OVERALL: ${{ steps.certify.outputs.overall }}
          FAIL_STAGE: ${{ steps.certify.outputs.fail_stage }}
          TARGET_SHA: ${{ steps.certify.outputs.target_sha }}
          HERO_STATUS: ${{ steps.certify.outputs.hero_status }}
          HERO_MIME: ${{ steps.certify.outputs.hero_mime }}
          HERO_BYTES: ${{ steps.certify.outputs.hero_bytes }}
          LIVE_STATUS: ${{ steps.certify.outputs.live_status }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p ops/certifications
          cp /tmp/hansford-cert.log ops/certifications/hansford-county-production.log
          cat > ops/certifications/hansford-county-production.json <<EOF
          {
            "county": "Hansford",
            "canonical": "https://texasdefined.com/county/hansford",
            "target_sha": "$TARGET_SHA",
            "overall": "$OVERALL",
            "fail_stage": "$FAIL_STAGE",
            "hero_http": "$HERO_STATUS",
            "hero_mime": "$HERO_MIME",
            "hero_bytes": "$HERO_BYTES",
            "live_http": "$LIVE_STATUS",
            "legacy_redirect": "not-applicable-no-preexisting-legacy-article",
            "run_id": "$GITHUB_RUN_ID",
            "certified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ops/certifications/hansford-county-production.json ops/certifications/hansford-county-production.log
          git commit -m 'Record Hansford County production certification'
          git push origin HEAD:main
