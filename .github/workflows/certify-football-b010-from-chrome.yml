name: Certify Batch010 only from real Chrome evidence
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Football Batch 010 fifth-five live production acceptance']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '41 14 * 8-12 *'
    - cron: '41 14 * 1-7 3'
permissions:
  actions: write
  contents: write
  pull-requests: write
concurrency:
  group: football-b010-evidence-certification
  cancel-in-progress: false
jobs:
  certification:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: texasdefined-publication
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check fail-closed evidence collector and fixtures
        run: |
          node --check scripts/ci/prepare-football-b010-certification.mjs
          node --test scripts/ci/prepare-football-b010-certification.test.mjs
      - name: Collect non-skipped Chrome reports, real PNGs, release and Cloudflare identity
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: node scripts/ci/prepare-football-b010-certification.mjs
      - name: Create a protected evidence-only registry certification PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/football-authority/REGISTRY.json docs/football-authority/MASTER.md docs/football-authority/PROGRESS.md; then
            echo 'No verified five-cohort package yet; registry is unchanged.'
            exit 0
          fi
          title='Certify Batch 010 from five real Chrome artifacts'
          if gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo 'Certification PR already open; no duplicate.'
            exit 0
          fi
          branch="automation/football-b010-cert-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add docs/football-authority/REGISTRY.json docs/football-authority/MASTER.md docs/football-authority/PROGRESS.md
          git commit -m 'Certify 25 Batch010 schools from real Chrome and Cloudflare evidence'
          git push origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "$title" --body 'Five real successful non-skipped Chrome cohorts, five retained report.json and screenshot artifacts, one current Cloudflare Worker, and exact successful GitHub production deployment. Strict technical scope; no score/feed, editorial, marks, photography, ADA or manual WCAG claims. Branch protection applies. Issue #6209.'
          gh workflow run merge-gate.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh pr merge "$branch" --repo "$GITHUB_REPOSITORY" --auto --squash
