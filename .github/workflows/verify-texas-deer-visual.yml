name: Verify Texas deer desktop mobile visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/verify-texas-deer-live-visual.mjs'
      - '.github/workflows/verify-texas-deer-visual.yml'
  workflow_run:
    workflows: ['Deploy TexasDefined production', 'Verify Texas deer regulations']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: texas-deer-live-visual-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  scenario:
    if: github.event_name == 'pull_request'
    name: Verify fixed two-viewport browser scenario
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check scripts/ci/verify-texas-deer-live-visual.mjs
          node scripts/ci/verify-texas-deer-live-visual.mjs --self-test

  live:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: Check real deer photo and document in desktop/mobile Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 15
      - name: Run weekly or change-scoped visual QA
        id: scope
        shell: bash
        env:
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' || "$SOURCE_WORKFLOW" == 'Verify Texas deer regulations' ]] ||
             git diff --name-only HEAD~10 HEAD -- \
                src/data/hunting/authority-deer.ts src/data/hunting/deer-season-dates.json \
                src/components/hunting/HuntingAuthority.tsx \
                scripts/data/verify-texas-deer-production.mjs scripts/ci/verify-texas-deer-live-visual.mjs \
                .github/workflows/verify-texas-deer-visual.yml |
               grep -q .; then
            echo 'changed=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=no' >> "$GITHUB_OUTPUT"
            echo 'No deer-page changes in the bounded deployment; no extra Chrome run.'
          fi
      - name: Node 22
        if: steps.scope.outputs.changed == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use GitHub runner Chrome and isolated browser driver
        if: steps.scope.outputs.changed == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-deer-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Validate exact browser scenario
        if: steps.scope.outputs.changed == 'yes'
        run: node scripts/ci/verify-texas-deer-live-visual.mjs --self-test
      - name: Verify live deer image, dates, mobile overflow and source attribution
        if: steps.scope.outputs.changed == 'yes'
        env:
          TARGET_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/ci/verify-texas-deer-live-visual.mjs
      - name: Upload desktop/mobile screenshots and structured report
        if: always() && steps.scope.outputs.changed == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: texas-deer-live-visual-${{ github.run_id }}
          path: artifacts/texas-deer-live-visual/
          if-no-files-found: warn
          retention-days: 14
      - name: Open one targeted deer visual issue on failure
        if: failure() && steps.scope.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title='Texas deer live browser/photo QA failed'
          existing="$(gh issue list --state open --search "$title in:title" --json title,number --jq '.[] | select(.title == "Texas deer live browser/photo QA failed") | .number' | head -1)"
          if [[ -z "$existing" ]]; then
            gh issue create --title "$title" --body "The deer guide failed its exact desktop/mobile Chrome check (image pixels, legal season table, navigation or horizontal overflow). Screenshot artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} . Read the report and correct only the demonstrated defect."
          fi
      - name: Automatically close recovered browser QA issue
        if: success() && steps.scope.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue list --state open --search 'Texas deer live browser/photo QA failed in:title' \
            --json title,number --jq '.[] | select(.title == "Texas deer live browser/photo QA failed") | .number' |
            while read -r number; do
              gh issue close "$number" --comment "Verified deer Chrome image/layout checks recovered: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}."
            done
