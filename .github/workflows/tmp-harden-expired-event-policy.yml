name: Temporary expired event schema policy

on:
  push:
    branches:
      - agent/expired-event-schema-policy-20260911

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expired-event-schema-policy-20260911
          fetch-depth: 0
      - name: Apply expired event policy
        run: node scripts/tmp-harden-expired-event-policy.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate event contracts
        run: node scripts/data/validate-events-seo.mjs
      - name: Build
        run: npm run build
      - name: Commit production changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/major-event-page.server.ts src/data/major-event-authority.ts scripts/ci/verify-event-structured-data-production.mjs
          git diff --cached --check
          git commit -m "Suppress stale expired event schema"
          git push origin HEAD:agent/expired-event-schema-policy-20260911
