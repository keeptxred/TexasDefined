name: Diagnose Lubbock bundle once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-lubbock-performance-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and record performance result
        shell: bash
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p .github/certification
          npm run build >/tmp/lubbock-build.log 2>&1
          build_rc=$?
          if [ "$build_rc" -eq 0 ]; then
            npm run performance:validate >/tmp/lubbock-performance.log 2>&1
            perf_rc=$?
          else
            perf_rc=99
            cp /tmp/lubbock-build.log /tmp/lubbock-performance.log
          fi
          python3 - "$build_rc" "$perf_rc" <<'PY'
          import json, pathlib, sys
          build_rc, perf_rc = map(int, sys.argv[1:3])
          text = pathlib.Path('/tmp/lubbock-performance.log').read_text(errors='replace')
          roots = [pathlib.Path('dist/client/assets'), pathlib.Path('.output/public/assets')]
          root = next((p for p in roots if p.is_dir()), None)
          mains = []
          css = []
          if root:
              mains = [{'name': p.name, 'bytes': p.stat().st_size} for p in root.iterdir() if p.is_file() and p.name.startswith('main-') and p.suffix == '.js']
              css = [{'name': p.name, 'bytes': p.stat().st_size} for p in root.iterdir() if p.is_file() and p.name.startswith('styles-') and p.suffix == '.css']
          payload = {'source_sha': __import__('subprocess').check_output(['git','rev-parse','HEAD'], text=True).strip(), 'build_rc': build_rc, 'performance_rc': perf_rc, 'main': mains, 'css': css, 'output': text[-4000:]}
          pathlib.Path('.github/certification/lubbock-performance.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
          git add -- .github/certification/lubbock-performance.json
          git commit -m 'Record Lubbock bundle diagnostic' || true
          git pull --rebase origin main
          git push origin HEAD:main
