name: Diagnose Lubbock performance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and run protected performance validator
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run performance:validate | tee /tmp/performance.log
          {
            echo '## Lubbock performance diagnostic'
            echo
            echo 'The protected production build and client performance budget passed.'
            echo
            echo '```text'
            tail -80 /tmp/performance.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
