name: One-time licensed Texas Hill Country Olive Co. exterior image import
'on':
  push:
    branches:
      - feat/olive-company-licensed-editorial-photos-20261027
    paths:
      - .github/workflows/import-olive-company-editorial-photos.yml
permissions:
  contents: write
jobs:
  import-licensed-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download the two owner-supplied originals and verify exact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/td-licensed-olive
          curl -fsSL --retry 1 --max-time 90 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-f5d0-81f5-b787-211b51c6a377/raw?se=2026-10-27T20%3A30%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=f9bdbb22-3ca0-565c-92e5-940f287d5802&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T12%3A05%3A28Z&ske=2026-10-28T12%3A05%3A28Z&sks=b&skv=2026-02-06&sig=43BavwmaX2Y5JgODcaQ5w5/4UBs2iaXXs7NJDfuXAC0%3D' -o /tmp/td-licensed-olive/bistro.png
          curl -fsSL --retry 1 --max-time 90 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-1678-81f5-bea1-d0dd740bcede/raw?se=2026-10-27T20%3A30%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=00ab42f8-8876-57db-b196-b2282032f865&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T12%3A24%3A00Z&ske=2026-10-28T12%3A24%3A00Z&sks=b&skv=2026-02-06&sig=W14WT4xEs%2BYBofvF%2Bsube00LcTeAN1SV8RBaZ40lpSo%3D' -o /tmp/td-licensed-olive/exterior.jpg
          echo '86cbb45f608385207a31692aaac2762e4c880b339ec45f934f593c2deaffe42d  /tmp/td-licensed-olive/bistro.png' | sha256sum -c -
          echo 'db6f9c1cd6cec78507ac7c3afb23ffa60085c2d71656ebfaa25fe9c0d6145a1f  /tmp/td-licensed-olive/exterior.jpg' | sha256sum -c -
      - name: Resize only; export non-AI editorial WebP derivatives
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          pairs = [
            ("/tmp/td-licensed-olive/bistro.png", "public/images/destinations/texas-hill-country-olive-co-bistro.webp"),
            ("/tmp/td-licensed-olive/exterior.jpg", "public/images/destinations/texas-hill-country-olive-co-exterior.webp")
          ]
          for original, output in pairs:
              im=Image.open(original).convert("RGB")
              if im.width > 1600:
                  im=im.resize((1600,round(im.height * 1600/im.width)),Image.Resampling.LANCZOS)
              if im.width < 1200:
                  raise SystemExit("Owner image below minimum readiness resolution: "+original)
              Path(output).parent.mkdir(parents=True,exist_ok=True)
              im.save(output,format="WEBP",quality=84,method=6)
              print(output,im.size,Path(output).stat().st_size)
          PY
      - name: Commit only the two rights-cleared images back to this PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TexasDefined Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add public/images/destinations/texas-hill-country-olive-co-bistro.webp public/images/destinations/texas-hill-country-olive-co-exterior.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Import owner-licensed exact-location olive-company exterior photography'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
