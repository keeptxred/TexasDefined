name: Network draft preview browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/routes/network.*'
      - 'src/routes/business.dashboard*'
      - 'src/routes/admin.network-applications*'
      - 'src/data/network-*'
      - 'src/network.css'
      - 'scripts/ci/verify-network-preview-browser.mjs'
      - '.github/workflows/network-preview-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify unpublished Network in real Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install current locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build exact PR Worker
        run: npm run build
      - name: Prepare free runner Chrome and isolated browser driver
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          # Wrangler 4.114+ has an upstream local Miniflare network-drop regression.
          # Pin ONLY the disposable local QA server to the proven pre-regression build;
          # normal npm ci, app build, and production dependencies remain unchanged.
          npm install --prefix /tmp/texasdefined-network-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1 wrangler@4.113.0
      - name: Verify Chrome hydration, accessibility, preview controls and responsive layouts
        env:
          NETWORK_QA_WRANGLER_BIN: /tmp/texasdefined-network-qa/node_modules/.bin/wrangler
        run: node scripts/ci/verify-network-preview-browser.mjs
      - name: Retain preview screenshots and QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-preview-browser-evidence
          path: artifacts/network-preview-browser/
          if-no-files-found: warn
          retention-days: 14
