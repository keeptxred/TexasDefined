name: Monthly attraction operator-source verification
on:
  schedule:
    - cron: '0 14 1 * *'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check approved attraction official sources
        run: node scripts/data/verify-approved-attraction-sources.mjs
