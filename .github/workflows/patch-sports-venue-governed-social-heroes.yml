name: Patch sports venue governed social heroes

on:
  push:
    branches:
      - fix/sports-venue-governed-social-heroes
    paths:
      - '.github/workflows/patch-sports-venue-governed-social-heroes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sports-venue-governed-social-heroes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch route metadata and production verifier
        run: |
          python - <<'PY'
          from pathlib import Path

          route_path = Path('src/routes/sports-venue.$slug.tsx')
          route = route_path.read_text()
          replacements = [
              (
                  "      { sportsVenueLandingLinksForVenue },\n    ] = await Promise.all([\n      import('@/data/knowledge-graph'),\n      import('@/data/sports-venue-enrichment-all'),\n      import('@/data/sports-venue-landings'),\n    ]);",
                  "      { sportsVenueLandingLinksForVenue },\n      { getSportsVenuePhoto },\n    ] = await Promise.all([\n      import('@/data/knowledge-graph'),\n      import('@/data/sports-venue-enrichment-all'),\n      import('@/data/sports-venue-landings'),\n      import('@/data/sports-venue-images-all'),\n    ]);",
              ),
              (
                  "    const enrichment = getSportsVenueEnrichmentAll(entity.slug);\n    const mapUrl = entity.coordinates",
                  "    const enrichment = getSportsVenueEnrichmentAll(entity.slug);\n    const photo = getSportsVenuePhoto(entity.slug);\n    const mapUrl = entity.coordinates",
              ),
              (
                  "      enrichment,\n      landingLinks:",
                  "      enrichment,\n      photo,\n      landingLinks:",
              ),
              (
                  "    const { entity, enrichment } = loaderData;",
                  "    const { entity, enrichment, photo } = loaderData;",
              ),
              (
                  "        description: sportsVenueSearchDescription(entity, enrichment),\n        robots: indexable ? undefined : 'noindex, follow, max-image-preview:large',",
                  "        description: sportsVenueSearchDescription(entity, enrichment),\n        image: photo?.imageUrl,\n        imageAlt: photo?.alt,\n        imageWidth: photo?.width,\n        imageHeight: photo?.height,\n        robots: indexable && photo ? undefined : 'noindex, follow, max-image-preview:large',",
              ),
          ]
          for old, new in replacements:
              count = route.count(old)
              if count != 1:
                  raise SystemExit(f'route patch expected one match, found {count}: {old[:80]!r}')
              route = route.replace(old, new, 1)
          route_path.write_text(route)

          verifier_path = Path('scripts/ci/verify-sports-venue-heroes-production.mjs')
          verifier = verifier_path.read_text()
          old_required = "  required: [`/images/sports-venues/${slug}.jpg`, alt],"
          new_required = "  required: [`/images/sports-venues/${slug}.jpg`, `content=\\\"${origin}/images/sports-venues/${slug}.jpg\\\"`, alt],"
          if verifier.count(old_required) != 1:
              raise SystemExit('wave7 required marker patch target missing or duplicated')
          verifier = verifier.replace(old_required, new_required, 1)

          marker = "async function verifyVenue({ label, path, required, assetPath }) {"
          decoder = r'''function decodeHtmlText(value) {
            return value
              .replace(/&#x([0-9a-f]+);/gi, (_, hex) => String.fromCodePoint(Number.parseInt(hex, 16)))
              .replace(/&#([0-9]+);/g, (_, decimal) => String.fromCodePoint(Number.parseInt(decimal, 10)))
              .replace(/&quot;/g, '"')
              .replace(/&apos;/g, "'")
              .replace(/&amp;/g, '&')
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>');
          }

          '''
          if verifier.count(marker) != 1:
              raise SystemExit('verifyVenue marker missing or duplicated')
          verifier = verifier.replace(marker, decoder + marker, 1)

          old_missing = "      missing = required.filter((needle) => !lastBody.includes(needle));"
          new_missing = "      const decodedBody = decodeHtmlText(lastBody);\n      missing = required.filter((needle) => !lastBody.includes(needle) && !decodedBody.includes(needle));"
          if verifier.count(old_missing) != 1:
              raise SystemExit('missing-marker comparison patch target missing or duplicated')
          verifier = verifier.replace(old_missing, new_missing, 1)
          verifier_path.write_text(verifier)
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate focused image and route contracts
        run: |
          npm run typecheck --if-present
          node scripts/data/validate-sports-venue-photo-additions-final.mjs
          node scripts/data/validate-sports-venue-ssr-heroes.mjs
          node scripts/data/validate-image-seo.mjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/routes/sports-venue.$slug.tsx' scripts/ci/verify-sports-venue-heroes-production.mjs
          git commit -m 'Use governed sports venue heroes in social metadata'
          git push origin HEAD:fix/sports-venue-governed-social-heroes
