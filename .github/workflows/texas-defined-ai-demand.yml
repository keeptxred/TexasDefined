name: Texas Defined AI demand intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/texas-defined-ai-demand.yml'
      - 'scripts/ai/build-ai-demand-report.mjs'
      - 'scripts/ai/build-ai-editorial-queue.mjs'
      - 'scripts/ai/validate-ai-demand-report.mjs'
      - 'scripts/ai/validate-ai-editorial-queue.mjs'
      - 'scripts/ai/official-source-registry.mjs'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: texasdefined-ai-demand-intelligence
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build private demand intelligence
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_DEMAND_STATUS_PATH: ${{ runner.temp }}/ask-texas-demand-base-status.json
        run: node scripts/ai/build-ai-demand-report.mjs

      - name: Build review-only editorial action queue
        run: node scripts/ai/build-ai-editorial-queue.mjs

      - name: Validate privacy and publication boundaries
        run: |
          node scripts/ai/validate-ai-demand-report.mjs
          node scripts/ai/validate-ai-editorial-queue.mjs

      - name: Detect reviewable demand changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- ops/ai/texas-defined-ai-demand.generated.json ops/ai/texas-defined-ai-editorial-queue.generated.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generalized AI demand or editorial action changed enough to create a review PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Generalized AI demand intelligence changed; preparing a review-only PR with ranked editorial actions."
          fi

      - name: Build privacy-safe run status and summary
        if: always()
        env:
          REVIEW_PR_NEEDED: ${{ steps.changes.outputs.changed || 'not-reached' }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const basePath = path.join(process.env.RUNNER_TEMP, 'ask-texas-demand-base-status.json');
          const reportPath = 'ops/ai/texas-defined-ai-demand.generated.json';
          const queuePath = 'ops/ai/texas-defined-ai-editorial-queue.generated.json';
          const base = fs.existsSync(basePath) ? JSON.parse(fs.readFileSync(basePath, 'utf8')) : null;
          const queue = fs.existsSync(queuePath) ? JSON.parse(fs.readFileSync(queuePath, 'utf8')) : null;
          const status = {
            schemaVersion: 1,
            generatedAt: new Date().toISOString(),
            telemetryReadCompleted: Boolean(base),
            telemetryRowsAnalyzed: base?.telemetryRowsAnalyzed ?? null,
            telemetryEventsRepresented: base?.telemetryEventsRepresented ?? null,
            coverage: base?.coverage ?? { strong: null, partial: null, gap: null },
            actionableOpportunities: base?.actionableOpportunities ?? null,
            reportPresent: fs.existsSync(reportPath),
            editorialQueueItems: Array.isArray(queue?.items) ? queue.items.length : 0,
            reviewPrNeeded: process.env.REVIEW_PR_NEEDED || 'not-reached',
            privacy: 'Aggregate counts only. No raw or sanitized user question text is retained in this artifact.',
            publicationBoundary: 'Status-only artifact; it cannot publish content or auto-merge demand-generated work.',
          };
          const output = path.join(process.env.RUNNER_TEMP, 'ask-texas-demand-status.json');
          fs.writeFileSync(output, `${JSON.stringify(status, null, 2)}\n`, 'utf8');

          const value = (input) => input === null || input === undefined ? 'not available' : input;
          const summary = [
            '## Ask Texas demand intelligence',
            '',
            `- Telemetry read completed: ${status.telemetryReadCompleted ? 'yes' : 'no'}`,
            `- Private telemetry rows analyzed: ${value(status.telemetryRowsAnalyzed)}`,
            `- Telemetry events represented: ${value(status.telemetryEventsRepresented)}`,
            `- Strong coverage: ${value(status.coverage.strong)}`,
            `- Partial coverage: ${value(status.coverage.partial)}`,
            `- Gap coverage: ${value(status.coverage.gap)}`,
            `- Actionable opportunities: ${value(status.actionableOpportunities)}`,
            `- Editorial queue items: ${status.editorialQueueItems}`,
            `- Review PR needed: ${status.reviewPrNeeded}`,
            '- Privacy boundary: only aggregate generalized signals are summarized; user question text is never printed or retained here.',
            '- Publication boundary: this workflow cannot publish or auto-merge demand-generated content.',
            '',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary, 'utf8');
          console.log(`Wrote privacy-safe demand status artifact: ${output}`);
          NODE

      - name: Retain privacy-safe demand status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ask-texas-demand-status-${{ github.run_id }}
          path: ${{ runner.temp }}/ask-texas-demand-status.json
          if-no-files-found: error
          retention-days: 14

      - name: Create or refresh review branch
        if: steps.changes.outputs.changed == 'true'
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/texas-defined-ai-demand"
          remote_sha="$(git ls-remote --heads origin "$branch" | awk '{print $1}')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add ops/ai/texas-defined-ai-demand.generated.json ops/ai/texas-defined-ai-editorial-queue.generated.json
          git commit -m 'Refresh generalized Texas Defined AI demand intelligence'
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "$branch"
          else
            git push origin "$branch"
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or retain review-only pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          pr_url="$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$pr_url" ]; then
            echo "Updated existing AI demand review PR."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'Review Texas Defined AI demand and content gaps' \
            --body $'Automated privacy-safe demand intelligence from Texas Defined AI.\n\nThis PR contains only generalized topic/category signals, aggregate demand/coverage counts, ranked editorial actions, existing-page targets when available, recommended asset types, and authoritative research-source targets. Raw or sanitized user questions are intentionally excluded from the public repository and workflow output.\n\nThe editorial queue distinguishes between improving an existing surface, reviewing an already-strong surface, and researching a possible new surface. These are recommendations for human review only.\n\nThis is a review queue, not a publication action. It does not create or publish articles, does not auto-merge, and does not bypass TexasDefined quality, indexing, source, image-rights, or publication gates. Any resulting content/data work must be researched against the listed authoritative sources and pass normal repository validation before a separate merge decision.'
