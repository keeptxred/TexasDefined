name: Reconcile Dogs generated files

on:
  push:
    branches:
      - feature/texas-dogs-defined-replay-2026-09-08

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/texas-dogs-defined-replay-2026-09-08
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile Dogs registries
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const publicRoutesPath = 'src/lib/public-routes.ts';
          let publicRoutes = fs.readFileSync(publicRoutesPath, 'utf8');
          if (!publicRoutes.includes('  "/dogs",')) {
            const marker = '  "/hunting",\n';
            if (!publicRoutes.includes(marker)) throw new Error('public-routes hunting marker not found');
            publicRoutes = publicRoutes.replace(marker, `${marker}  "/dogs",\n`);
            fs.writeFileSync(publicRoutesPath, publicRoutes);
          }

          const sitemapPath = 'src/routes/sitemap[.]xml.ts';
          let sitemap = fs.readFileSync(sitemapPath, 'utf8');
          if (!sitemap.includes('loadTexasDogSitemapEntriesServer')) {
            const importMarker = 'import { TEXAS_DATASETS } from "@/data/texas-data-center";\n';
            if (!sitemap.includes(importMarker)) throw new Error('sitemap import marker not found');
            sitemap = sitemap.replace(importMarker, `${importMarker}import { loadTexasDogSitemapEntriesServer } from "@/data/texas-dogs-sitemap.server";\n`);
          }
          if (!sitemap.includes('const texasDogSitemapEntries = loadTexasDogSitemapEntriesServer();')) {
            const dataMarker = '        const temporalEventSitemapEntries = loadTemporalEventSitemapEntriesServer();\n';
            if (!sitemap.includes(dataMarker)) throw new Error('sitemap data marker not found');
            sitemap = sitemap.replace(dataMarker, `${dataMarker}        const texasDogSitemapEntries = loadTexasDogSitemapEntriesServer();\n`);
          }
          if (!sitemap.includes('          ...texasDogSitemapEntries,')) {
            const entriesMarker = '          ...AUTHORITY_STATIC_PATHS.map((path) => ({ path, lastmod: AUTHORITY_LASTMOD })),\n';
            if (!sitemap.includes(entriesMarker)) throw new Error('sitemap entries marker not found');
            sitemap = sitemap.replace(entriesMarker, `${entriesMarker}          ...texasDogSitemapEntries,\n`);
          }
          fs.writeFileSync(sitemapPath, sitemap);
          EOF
      - name: Generate current route tree
        run: npm run build
      - name: Commit reconciled generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/public-routes.ts 'src/routes/sitemap[.]xml.ts' src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Reconcile Texas Dogs shared routes on current main"
            git push origin HEAD:feature/texas-dogs-defined-replay-2026-09-08
          fi
