name: Food truck bundle diagnostic

on:
  push:
    branches:
      - feature/texas-food-trucks-300

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Report exact client asset sizes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE' > /tmp/bundle-report.txt
          import { readdir, stat } from 'node:fs/promises';
          import path from 'node:path';
          const dirs = ['dist/client/assets', '.output/public/assets'];
          let dir;
          for (const candidate of dirs) { try { await stat(candidate); dir = candidate; break; } catch {} }
          if (!dir) throw new Error('assets directory not found');
          const names = await readdir(dir);
          const rows = [];
          for (const name of names.filter((n) => /^main-.*\.js$/.test(n) || /^styles-.*\.css$/.test(n))) {
            rows.push(`${name}: ${(await stat(path.join(dir, name))).size} bytes`);
          }
          console.log(`Bundle diagnostic for ${process.env.GITHUB_SHA}`);
          console.log(rows.join('\n'));
          NODE
          gh pr comment 1595 --repo keeptxred/TexasDefined --body-file /tmp/bundle-report.txt
