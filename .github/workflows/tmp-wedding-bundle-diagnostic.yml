name: Temporary Wedding Bundle Diagnostic

on:
  push:
    branches: [feature/texas-wedding-venues]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/texas-wedding-venues
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and capture protected bundle size
        shell: bash
        run: |
          set -o pipefail
          npm run build
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "--- validator ---"
            npm run performance:validate 2>&1 || true
            echo "--- main assets ---"
            find dist/client/assets -maxdepth 1 -type f -name 'main-*.js' -printf '%f %s bytes\n' | sort
            echo "--- wedding strings in main ---"
            main_file=$(find dist/client/assets -maxdepth 1 -type f -name 'main-*.js' | head -n 1)
            if [[ -n "$main_file" ]]; then
              grep -o -E '.{0,80}wedding.{0,120}' "$main_file" | head -n 80 || true
            fi
          } > tmp-wedding-bundle-report.txt
      - name: Commit report and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-wedding-bundle-diagnostic.yml
          git add tmp-wedding-bundle-report.txt
          git commit -m "Capture wedding bundle diagnostic"
          git push origin HEAD:feature/texas-wedding-venues
