name: Certify Archer County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-archer-county-once.yml'

permissions:
  contents: write

concurrency:
  group: certify-archer-county-once
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Certify Archer County live production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          marker='.github/certification/archer-county.json'
          target='9dce924140eafaa0aa969711d9552bbc415d3cb0'
          hero='https://commons.wikimedia.org/wiki/Special:Redirect/file/Archer%20courthouse.jpg?width=1600'
          legacy='https://texasdefined.com/article/archer-county-archer-city-ranching-oil-cross-timbers-north-texas'
          canonical='https://texasdefined.com/county/archer'

          record() {
            status="$1"; stage="$2"; detail="$3"
            mkdir -p "$(dirname "$marker")"
            python3 - "$marker" "$status" "$stage" "$target" "$detail" <<'PY'
          import datetime, json, pathlib, sys
          path, status, stage, target, detail = sys.argv[1:]
          pathlib.Path(path).write_text(json.dumps({
            'county': 'archer', 'status': status, 'stage': stage,
            'county_commit': target, 'tested_main': '', 'detail': detail[-12000:],
            'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }, indent=2) + '\n', encoding='utf-8')
          PY
            current="$(git rev-parse HEAD)"
            python3 - "$marker" "$current" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); d['tested_main']=sys.argv[2]; p.write_text(json.dumps(d,indent=2)+'\n')
          PY
            git add "$marker"
            git commit -m "Record Archer County production ${status}" >/dev/null || true
            git push origin HEAD:main
          }

          git merge-base --is-ancestor "$target" HEAD || { record fail source 'Archer county commit is not in current main ancestry'; exit 1; }
          fixture='src/data/fixtures/archer-county-archer-city-ranching-oil-cross-timbers-north-texas.ts'
          test -f "$fixture" || { record fail source 'Archer fixture missing'; exit 1; }
          grep -Fq 'countySlug: "archer"' src/data/county-series-profiles-rolling-plains.ts || { record fail source 'Archer profile registration missing'; exit 1; }
          grep -Fq '["archer-county-archer-city-ranching-oil-cross-timbers-north-texas", "archer"]' src/data/county-series.ts || { record fail source 'Archer completion/legacy map missing'; exit 1; }
          if grep -n 'www\.texasdefined\.com' "$fixture" src/data/county-series-profiles-rolling-plains.ts src/data/county-series.ts >/tmp/archer-www.txt; then
            record fail canonical-host "$(cat /tmp/archer-www.txt)"; exit 1
          fi

          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          hcode="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$work/hh" -o "$work/hb" -w '%{http_code}' "$hero" || true)"
          hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/hh" | cut -d';' -f1)"
          hbytes="$(wc -c < "$work/hb" 2>/dev/null || echo 0)"
          if [ "$hcode" != 200 ] || ! [[ "$hmime" =~ ^image/(jpeg|png|webp)$ ]] || [ "$hbytes" -le 50000 ]; then
            record fail hero "HTTP=$hcode MIME=$hmime bytes=$hbytes"; exit 1
          fi

          page=''; code=''
          for attempt in $(seq 1 12); do
            code="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$work/page" -w '%{http_code}' "${canonical}?verify=${target}-${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$code" = 200 ] \
              && grep -Fq 'Archer County: Archer City, Ranch Country, Oil and the Cross Timbers Edge' "$work/page" \
              && grep -Fq 'The county in numbers' "$work/page" \
              && grep -Fq 'County seat' "$work/page" \
              && grep -Fq '2020 population' "$work/page" \
              && grep -Fq 'County feature' "$work/page" \
              && grep -Fq 'Archer City' "$work/page" \
              && grep -Fq 'https://texasdefined.com/county/archer' "$work/page"; then page=pass; break; fi
            sleep 5
          done
          [ "$page" = pass ] || { record fail live-page "HTTP=$code expected structured/editorial/canonical markers missing"; exit 1; }

          lcode="$(curl --max-time 60 -sS -D "$work/lh" -o /dev/null -w '%{http_code}' "$legacy" || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$work/lh")"
          if ! [[ "$lcode" =~ ^30(1|8)$ ]] || [[ "$location" != *'/county/archer'* ]]; then
            record fail legacy-redirect "HTTP=$lcode Location=$location"; exit 1
          fi

          record pass complete "page=200 structured=yes editorial=yes canonical=yes legacy=$lcode location=$location hero=$hcode mime=$hmime bytes=$hbytes"
