name: Certify Andrews County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-andrews-county-once.yml'

permissions:
  contents: write

concurrency:
  group: certify-andrews-county-once
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate deploy and certify Andrews County
        shell: bash
        run: |
          set +e
          target='21d0a6c612c271a4fc5333aee1e8974289bc3b6b'
          hero='https://commons.wikimedia.org/wiki/Special:Redirect/file/Andrews_County_Courthouse%2C_Andrews%2C_Texas.jpg?width=1600'
          fixture='src/data/fixtures/andrews-county-andrews-oil-ranching-high-plains-west-texas.ts'
          registry='src/data/county-series-profiles-south-plains.ts'
          marker='.github/certification/andrews-county.json'
          agent='TexasDefined/1.0 (+https://texasdefined.com)'
          stage='preflight'; validate='NOT_RUN'; deploy='NOT_RUN'; page='NOT_RUN'; legacy='NOT_RUN'; hero_status='NOT_RUN'; mime=''; issue=''
          work="$(mktemp -d)"

          git merge-base --is-ancestor "$target" HEAD || issue='target commit not in current main ancestry'
          test -f "$fixture" || issue='fixture missing'
          grep -Fq 'countySlug: "andrews"' "$registry" || issue='registry missing Andrews'
          if grep -n 'www\.texasdefined\.com' "$fixture" "$registry"; then issue='noncanonical www TexasDefined hostname found'; fi

          if [ -z "$issue" ]; then
            stage='hero-source'
            hs="$(curl -A "$agent" -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 -sS -D "$work/hh" -o "$work/hb" -w '%{http_code}' "$hero" || true)"
            hm="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/hh" | cut -d';' -f1)"
            hb="$(wc -c < "$work/hb" 2>/dev/null || echo 0)"
            hero_status="$hs"; mime="$hm"
            if [ "$hs" != 200 ] || ! [[ "$hm" =~ ^image/(jpeg|png|webp)$ ]] || [ "$hb" -le 50000 ]; then issue="hero source failed HTTP=$hs MIME=$hm bytes=$hb"; fi
          fi

          if [ -z "$issue" ]; then
            stage='validation'
            npm run validate
            rc=$?
            if [ $rc -eq 0 ]; then validate='PASS'; else validate='FAIL'; issue="npm run validate failed rc=$rc"; fi
          fi

          if [ -z "$issue" ]; then
            git fetch origin main
            latest="$(git rev-parse origin/main)"; current="$(git rev-parse HEAD)"
            if [ "$latest" != "$current" ]; then issue="main moved after validation: $current -> $latest"; stage='stale-main'; fi
          fi

          if [ -z "$issue" ]; then
            stage='deployment'
            npm run deploy
            rc=$?
            if [ $rc -eq 0 ]; then deploy='PASS'; else deploy='FAIL'; issue="npm run deploy failed rc=$rc"; fi
          fi

          if [ -z "$issue" ]; then
            stage='live-page'
            page='FAIL'
            for attempt in $(seq 1 12); do
              code="$(curl -A "$agent" --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$work/page" -w '%{http_code}' "https://texasdefined.com/county/andrews?verify=${target}-${GITHUB_RUN_ID}-${attempt}" || true)"
              if [ "$code" = 200 ] && grep -Fq 'Andrews County: Oil Country on the Western Edge of the Texas High Plains' "$work/page" && grep -Fq 'The county in numbers' "$work/page" && grep -Fq 'County seat' "$work/page" && grep -Fq '2020 population' "$work/page" && grep -Fq 'https://texasdefined.com/county/andrews' "$work/page"; then page='PASS'; break; fi
              sleep 5
            done
            if [ "$page" != PASS ]; then issue="live county page failed HTTP=$code or expected structured/editorial markers missing"; fi
          fi

          if [ -z "$issue" ]; then
            stage='legacy-redirect'
            lc="$(curl -A "$agent" --max-redirs 0 -sS -D "$work/lh" -o /dev/null -w '%{http_code}' 'https://texasdefined.com/article/andrews-county-andrews-oil-ranching-high-plains-west-texas' || true)"
            loc="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$work/lh")"
            if [[ "$lc" =~ ^30(1|8)$ ]] && [[ "$loc" == *'/county/andrews'* ]]; then legacy='PASS'; else legacy='FAIL'; issue="legacy redirect failed HTTP=$lc location=$loc"; fi
          fi

          status='FAIL'; [ -z "$issue" ] && status='PASS' && stage='complete'
          mkdir -p "$(dirname "$marker")"
          python3 - "$marker" "$status" "$stage" "$target" "$validate" "$deploy" "$page" "$legacy" "$hero_status" "$mime" "$issue" <<'PY'
          import json,sys,datetime,pathlib
          path,status,stage,target,validate,deploy,page,legacy,hero,mime,issue=sys.argv[1:]
          pathlib.Path(path).write_text(json.dumps({
            'county':'andrews','status':status,'stage':stage,'target_sha':target,
            'validate':validate,'deploy':deploy,'live_page':page,'legacy_redirect':legacy,
            'hero_http':hero,'hero_mime':mime,'visual_subject':'Andrews County Courthouse in Andrews, Texas; Wikimedia metadata and coordinates verified','issue':issue,
            'recorded_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          },indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$marker"
          git commit -m "Record Andrews County production $status"
          git push origin HEAD:main
          exit 0
