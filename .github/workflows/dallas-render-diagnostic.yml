name: Dallas render diagnostic

on:
  push:
    branches: [diag/dallas-live-render-20260910]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start SSR runtime
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/td.log 2>&1 &
          echo $! > /tmp/td.pid
      - name: Wait for runtime
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/td.log
          exit 1
      - name: Compare local and live Dallas response
        run: |
          set -euo pipefail
          curl -sS -D /tmp/local.headers -o /tmp/local.html "http://127.0.0.1:4173/county/dallas?diag=${GITHUB_RUN_ID}"
          curl --retry 3 --retry-delay 2 --max-time 45 -sS -D /tmp/live.headers -o /tmp/live.html "https://texasdefined.com/county/dallas?diag=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          for source in local live; do
            echo "=== ${source} Dallas: bytes $(wc -c < /tmp/${source}.html) ==="
            sed -n '1,80p' "/tmp/${source}.headers"
            for marker in 'Dallas County' 'The story of' 'The story of Dallas County' 'Old Red Courthouse' 'The county in numbers' 'Official local-government cross-check'; do
              if grep -Fq "$marker" "/tmp/${source}.html"; then echo "marker yes: $marker"; else echo "marker no: $marker"; fi
            done
            echo "county feature heading fragments:"
            grep -o -E '.{0,80}The story of.{0,140}' "/tmp/${source}.html" | head -5 || true
            echo "Old Red fragments:"
            grep -o -E '.{0,80}Old Red Courthouse.{0,140}' "/tmp/${source}.html" | head -5 || true
          done

          echo '=== local runtime log ==='
          cat /tmp/td.log

          grep -Fq 'Old Red Courthouse' /tmp/local.html
          grep -Fq 'The county in numbers' /tmp/local.html
      - name: Stop runtime
        if: always()
        run: test ! -f /tmp/td.pid || kill "$(cat /tmp/td.pid)" || true
