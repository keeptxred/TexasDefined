name: Verify live lake levels in production

on:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-live-lake-levels.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-lakes:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Publish live-lake verification pending
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --data '{"state":"pending","context":"texasdefined-live-lakes","description":"Checking all live lake-level surfaces"}' >/dev/null

      - name: Verify every published lake returns a current numeric reading
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          lakes=(
            lake-conroe
            lake-fork
            sam-rayburn-reservoir
            lake-livingston
            lake-texoma
            toledo-bend-reservoir
            possum-kingdom-reservoir
            canyon-lake
            choke-canyon-reservoir
            amistad-reservoir
          )

          publish_status() {
            local state="$1" context="$2" description="$3"
            local payload
            payload="$(python3 - "$state" "$context" "$description" <<'PY'
          import json, sys
          print(json.dumps({"state": sys.argv[1], "context": sys.argv[2], "description": sys.argv[3]}))
          PY
          )"
            curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
              --data "$payload" >/dev/null
          }

          failures=0
          numeric=0
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          for slug in "${lakes[@]}"; do
            out="$workdir/${slug}.html"
            ok=0
            for attempt in 1 2 3; do
              url="${origin}/fishing/lakes/${slug}?verify-live-lake=${GITHUB_RUN_ID}-${attempt}"
              echo "[$slug] attempt $attempt: $url"
              if curl --fail-with-body --silent --show-error --location --max-time 30 "$url" -o "$out"; then
                if grep -Fq 'Live lake level:' "$out" && grep -Fq 'Water Data for Texas' "$out"; then
                  ok=1
                  break
                fi
              fi
              sleep 5
            done

            context="texasdefined-live-lake-${slug}"
            if [[ "$ok" -ne 1 ]]; then
              echo "::error title=Lake live-level UI missing::${slug} did not render the live lake-level strip in production"
              publish_status failure "$context" "Live lake-level UI missing"
              failures=$((failures + 1))
              continue
            fi

            if grep -Eq '[0-9]+\.[0-9]% full' "$out" && grep -Fq 'measured' "$out"; then
              echo "[$slug] live numeric reading rendered"
              publish_status success "$context" "Current numeric lake reading rendered"
              numeric=$((numeric + 1))
            else
              echo "::error title=Lake live reading unavailable::${slug} rendered the live-level UI but no current numeric reading"
              publish_status failure "$context" "Live UI rendered but numeric reading missing"
              failures=$((failures + 1))
            fi
          done

          if [[ "$failures" -gt 0 ]]; then
            echo "${failures} of ${#lakes[@]} published lake page(s) failed current lake-level verification; ${numeric} returned numeric readings." >&2
            exit 1
          fi

          echo "All ${#lakes[@]} published lake pages render a current numeric Water Data for Texas reading."

      - name: Verify lake section route also carries current numeric reading
        shell: bash
        run: |
          set -euo pipefail
          url="https://texasdefined.com/fishing/lakes/lake-conroe/boating?verify-live-lake-section=${GITHUB_RUN_ID}"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          curl --fail-with-body --silent --show-error --location --max-time 30 "$url" -o "$body"
          grep -Fq 'Live lake level:' "$body"
          grep -Fq 'Water Data for Texas' "$body"
          grep -Eq '[0-9]+\.[0-9]% full' "$body"
          grep -Fq 'measured' "$body"
          echo 'Lake section route current numeric lake-level surface verified.'

      - name: Publish live-lake verification success
        if: success()
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --data '{"state":"success","context":"texasdefined-live-lakes","description":"All production lake-level surfaces passed"}' >/dev/null

      - name: Publish live-lake verification failure
        if: failure()
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --data '{"state":"failure","context":"texasdefined-live-lakes","description":"Production lake-level verification failed"}' >/dev/null
