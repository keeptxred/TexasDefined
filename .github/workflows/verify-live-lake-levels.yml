name: Verify live lake levels in production

on:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-live-lakes:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Publish live-lake verification pending
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --data '{"state":"pending","context":"texasdefined-live-lakes","description":"Checking current data and all live lake UI surfaces"}' >/dev/null

      - name: Verify current numeric data for all ten lakes
        shell: bash
        run: |
          set -euo pipefail
          url="https://texasdefined.com/api/public/live-lake-diagnostic?verify=${GITHUB_RUN_ID}"
          body="$(mktemp)"
          headers="$(mktemp)"
          results="$(mktemp)"
          trap 'rm -f "$body" "$headers" "$results"' EXIT

          publish_status() {
            local state="$1" context="$2" description="$3"
            local payload
            payload="$(python3 - "$state" "$context" "$description" <<'PY'
          import json, sys
          print(json.dumps({"state": sys.argv[1], "context": sys.argv[2], "description": sys.argv[3][:140]}))
          PY
          )"
            curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
              --data "$payload" >/dev/null
          }

          http_code="$(curl --silent --show-error --location --max-time 45 \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
            --header 'Accept: application/json,text/plain;q=0.9,*/*;q=0.1' \
            --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"

          if grep -iq '^cf-mitigated: *challenge' "$headers"; then
            publish_status failure texasdefined-waterdata-diagnostic "Cloudflare challenged production lake diagnostic"
            exit 1
          fi
          if [[ "$http_code" != "200" ]]; then
            publish_status failure texasdefined-waterdata-diagnostic "Production lake diagnostic returned HTTP ${http_code:-unknown}"
            exit 1
          fi

          python3 - "$body" "$results" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          probes = payload.get('probes') or {}
          lakes = {
              'lake-conroe': payload.get('conroePageDataSnapshot'),
              **(payload.get('showcasePageDataSnapshots') or {}),
          }
          expected = [
              'lake-conroe', 'lake-fork', 'sam-rayburn-reservoir', 'lake-livingston', 'lake-texoma',
              'toledo-bend-reservoir', 'possum-kingdom-reservoir', 'canyon-lake',
              'choke-canyon-reservoir', 'amistad-reservoir',
          ]
          with open(sys.argv[2], 'w', encoding='utf-8') as out:
              for source in ('recent', 'csv', 'html'):
                  probe = probes.get(source) or {}
                  out.write(f"probe|{source}|{'success' if probe.get('ok') else 'failure'}|HTTP {probe.get('status') if probe.get('status') is not None else 'none'}; {probe.get('contentLength') or 0} bytes; {probe.get('elapsedMs') or 0}ms\n")
              out.write(f"diagnostic|snapshot|{'success' if payload.get('conroeSnapshot') else 'failure'}|{'Production Worker parsed current Lake Conroe snapshot' if payload.get('conroeSnapshot') else 'Production Worker returned no Lake Conroe snapshot'}\n")
              out.write(f"diagnostic|serverfn|{'success' if payload.get('conroeServerFnSnapshot') else 'failure'}|{'createServerFn returned current Lake Conroe snapshot' if payload.get('conroeServerFnSnapshot') else 'createServerFn returned no Lake Conroe snapshot'}\n")
              for slug in expected:
                  snapshot = lakes.get(slug)
                  valid = isinstance(snapshot, dict) and isinstance(snapshot.get('percentFull'), (int, float)) and snapshot.get('measuredAt')
                  if valid:
                      desc = f"{snapshot['percentFull']:.1f}% full; measured {snapshot['measuredAt']}"
                      out.write(f"lake|{slug}|success|{desc}\n")
                  else:
                      out.write(f"lake|{slug}|failure|Current numeric page-data snapshot missing\n")
          print(json.dumps({
              'conroePageDataSnapshot': payload.get('conroePageDataSnapshot'),
              'showcasePageDataSnapshots': payload.get('showcasePageDataSnapshots'),
          }, indent=2))
          PY

          failures=0
          while IFS='|' read -r kind name state description; do
            if [[ "$kind" == "probe" ]]; then
              publish_status "$state" "texasdefined-waterdata-${name}" "$description"
              continue
            fi
            if [[ "$kind" == "diagnostic" && "$name" == "snapshot" ]]; then
              publish_status "$state" texasdefined-waterdata-snapshot "$description"
              [[ "$state" == "success" ]] || failures=$((failures + 1))
              continue
            fi
            if [[ "$kind" == "diagnostic" && "$name" == "serverfn" ]]; then
              publish_status "$state" texasdefined-waterdata-serverfn "$description"
              [[ "$state" == "success" ]] || failures=$((failures + 1))
              continue
            fi
            if [[ "$kind" == "lake" ]]; then
              publish_status "$state" "texasdefined-live-lake-${name}" "$description"
              [[ "$state" == "success" ]] || failures=$((failures + 1))
            fi
          done < "$results"

          if [[ "$failures" -gt 0 ]]; then
            publish_status failure texasdefined-waterdata-diagnostic "Current lake data failed one or more protected checks"
            exit 1
          fi
          publish_status success texasdefined-waterdata-diagnostic "All ten page-data snapshots and server paths are current"

      - name: Verify every published lake exposes the live-level UI
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          lakes=(
            lake-conroe
            lake-fork
            sam-rayburn-reservoir
            lake-livingston
            lake-texoma
            toledo-bend-reservoir
            possum-kingdom-reservoir
            canyon-lake
            choke-canyon-reservoir
            amistad-reservoir
          )

          publish_status() {
            local state="$1" context="$2" description="$3"
            local payload
            payload="$(python3 - "$state" "$context" "$description" <<'PY'
          import json, sys
          print(json.dumps({"state": sys.argv[1], "context": sys.argv[2], "description": sys.argv[3][:140]}))
          PY
          )"
            curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
              --data "$payload" >/dev/null
          }

          failures=0
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          for slug in "${lakes[@]}"; do
            out="$workdir/${slug}.html"
            headers="$workdir/${slug}.headers"
            ok=0
            for attempt in 1 2 3; do
              url="${origin}/fishing/lakes/${slug}?verify-live-lake=${GITHUB_RUN_ID}-${attempt}"
              echo "[$slug] attempt $attempt: $url"
              code="$(curl --silent --show-error --location --max-time 30 \
                --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
                --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
                --dump-header "$headers" --output "$out" --write-out '%{http_code}' "$url" || true)"
              if grep -iq '^cf-mitigated: *challenge' "$headers"; then
                echo "[$slug] Cloudflare challenge on attempt $attempt"
              elif [[ "$code" == "200" ]] && grep -Fq 'Live lake level:' "$out" && grep -Fq 'Water Data for Texas' "$out"; then
                ok=1
                break
              fi
              sleep 5
            done

            context="texasdefined-live-lake-ui-${slug}"
            if [[ "$ok" -eq 1 ]]; then
              publish_status success "$context" "Live lake-level UI and official source rendered"
            else
              publish_status failure "$context" "Live lake-level UI/source missing or edge challenged"
              failures=$((failures + 1))
            fi
          done

          if [[ "$failures" -gt 0 ]]; then
            echo "${failures} of ${#lakes[@]} lake UI surfaces failed production verification." >&2
            exit 1
          fi
          echo "All ${#lakes[@]} lake pages expose the live-level UI; numeric freshness is verified separately through production page-data snapshots."

      - name: Verify lake section route exposes live-level UI
        shell: bash
        run: |
          set -euo pipefail
          url="https://texasdefined.com/fishing/lakes/lake-conroe/boating?verify-live-lake-section=${GITHUB_RUN_ID}"
          body="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$body" "$headers"' EXIT
          code="$(curl --silent --show-error --location --max-time 30 \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
            --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"
          if grep -iq '^cf-mitigated: *challenge' "$headers"; then
            echo 'Lake section route was challenged by Cloudflare.' >&2
            exit 1
          fi
          [[ "$code" == "200" ]]
          grep -Fq 'Live lake level:' "$body"
          grep -Fq 'Water Data for Texas' "$body"
          echo 'Lake section route live-level surface verified; the client component refreshes its current reading on open.'

      - name: Publish live-lake verification success
        if: success()
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --data '{"state":"success","context":"texasdefined-live-lakes","description":"All ten current snapshots and live UI surfaces passed"}' >/dev/null

      - name: Publish live-lake verification failure
        if: failure()
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --data '{"state":"failure","context":"texasdefined-live-lakes","description":"Production lake-level verification failed"}' >/dev/null
