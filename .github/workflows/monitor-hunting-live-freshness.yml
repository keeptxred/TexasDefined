name: Verify hunting live freshness (bounded)

on:
  schedule:
    - cron: '13 15 * * 2,5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor-hunting-live-freshness.yml'
      - 'scripts/data/monitor-hunting-live-freshness.mjs'
  pull_request:
    paths:
      - '.github/workflows/monitor-hunting-live-freshness.yml'
      - 'scripts/data/monitor-hunting-live-freshness.mjs'
      - 'src/components/hunting/HuntingAuthority.tsx'
      - 'src/data/hunting/species-season-calendar.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: bounded-hunting-live-freshness-${ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${ github.event_name == 'pull_request' }}

jobs:
  hunting-live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${ github.event_name == 'pull_request' && github.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate bounded live checker syntax
        run: node --check scripts/data/monitor-hunting-live-freshness.mjs
      - name: Verify 4 canonical + cache-bypassed live hunting pages
        id: live
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/data/monitor-hunting-live-freshness.mjs
      - name: Open one stale-page issue when scheduled check fails
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='Hunting pages stale or inconsistent between canonical and cache-bypass'
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh issue create --title "$title" --body "The bounded scheduled 4-page hunting source/freshness check failed. Compare canonical and no-cache pages, Cloudflare Worker version, TPWD source and source snapshot before targeted invalidation. Do not blindly purge entire site. Run: https://github.com/${ github.repository }}/actions/runs/${ github.run_id }}"
          fi
      - name: Fail closed on stale hunting HTML
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.live.outcome == 'failure'
        run: exit 1
