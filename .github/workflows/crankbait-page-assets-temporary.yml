name: Integrate crankbait page visuals

on:
  push:
    branches:
      - feat/crankbait-page-images-20260927
    paths:
      - .github/workflows/crankbait-page-assets-temporary.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Integrate crankbait page visuals workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/crankbait-page-images-20260927
          fetch-depth: 0

      - name: Wire generated visuals into the crankbait page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          materializer_path = Path('scripts/assets/materialize-generated-images.mjs')
          materializer = materializer_path.read_text(encoding='utf-8')
          if 'crankbaits-hero.webp' not in materializer:
              needle = '''  },\n];\n\nfor (const asset of assets) {'''
              replacement = '''  },\n  {\n    sourceDir: path.join(root, "assets/generated/crankbait-page"),\n    prefix: "hero.webp.b64.",\n    expectedParts: 12,\n    expectedSha256: "2d119cc470803d2f761486b53de047447931af6581369e78f77bce1068573d8e",\n    outputPaths: [\n      path.join(root, "public/images/fishing/techniques/crankbaits-hero.webp"),\n    ],\n  },\n  {\n    sourceDir: path.join(root, "assets/generated/crankbait-page"),\n    prefix: "depth-guide.webp.b64.",\n    expectedParts: 6,\n    expectedSha256: "09890ac0a0d992aa7ee2cb86d634bd790a39089ac827066b127f3e39b814f00e",\n    outputPaths: [\n      path.join(root, "public/images/fishing/techniques/crankbaits-depth-guide.webp"),\n    ],\n  },\n];\n\nfor (const asset of assets) {'''
              if needle not in materializer:
                  raise SystemExit('Could not find generated-image asset insertion point')
              materializer = materializer.replace(needle, replacement, 1)
              materializer_path.write_text(materializer, encoding='utf-8')

          component_path = Path('src/components/fishing/FishingTechniqueProfile.tsx')
          component = component_path.read_text(encoding='utf-8')
          if '/images/fishing/techniques/crankbaits-hero.webp' not in component:
              hero_needle = '''    </header>\n\n    <Container className="py-12 sm:py-16">'''
              hero_replacement = '''    </header>\n\n    {technique.slug === "crankbaits" ? <Container className="pt-8 sm:pt-10">\n      <figure className="overflow-hidden border border-border bg-muted/20">\n        <img\n          src="/images/fishing/techniques/crankbaits-hero.webp"\n          alt="Crankbait diving beside submerged timber and rock in a Texas reservoir"\n          width={1200}\n          height={675}\n          loading="eager"\n          fetchPriority="high"\n          decoding="async"\n          className="aspect-[16/9] w-full object-cover"\n        />\n        <figcaption className="border-t border-border px-5 py-3 text-xs leading-5 text-muted-foreground">Crankbaits are moving lures built to cover water at a chosen depth while deflecting off or passing close to fish-holding cover.</figcaption>\n      </figure>\n    </Container> : null}\n\n    <Container className="py-12 sm:py-16">'''
              if hero_needle not in component:
                  raise SystemExit('Could not find crankbait hero insertion point')
              component = component.replace(hero_needle, hero_replacement, 1)

          if '/images/fishing/techniques/crankbaits-depth-guide.webp' not in component:
              depth_needle = '''          <p className="mt-4 max-w-3xl text-sm leading-7 text-muted-foreground">For crankbaits, running depth is the first decision. Pick the lure that can actually reach the zone you are trying to fish; color and finish come after depth, cover and retrieve speed.</p>\n          <div className="mt-8 overflow-hidden border border-border">'''
              depth_replacement = '''          <p className="mt-4 max-w-3xl text-sm leading-7 text-muted-foreground">For crankbaits, running depth is the first decision. Pick the lure that can actually reach the zone you are trying to fish; color and finish come after depth, cover and retrieve speed.</p>\n          <figure className="mt-8 overflow-hidden border border-border bg-muted/20">\n            <img\n              src="/images/fishing/techniques/crankbaits-depth-guide.webp"\n              alt="Crankbait styles shown at progressively deeper running zones from shallow cover to deep structure"\n              width={1200}\n              height={675}\n              loading="lazy"\n              decoding="async"\n              className="aspect-[16/9] w-full object-cover"\n            />\n            <figcaption className="border-t border-border px-5 py-3 text-xs leading-5 text-muted-foreground">Use this as a visual guide, not an exact depth chart. Actual running depth changes with lure design, line diameter, cast length and retrieve speed; manufacturer depth ranges are the better reference for a specific lure.</figcaption>\n          </figure>\n          <div className="mt-8 overflow-hidden border border-border">'''
              if depth_needle not in component:
                  raise SystemExit('Could not find crankbait depth-guide insertion point')
              component = component.replace(depth_needle, depth_replacement, 1)
          component_path.write_text(component, encoding='utf-8')

          validator_path = Path('scripts/data/validate-fishing-techniques.mjs')
          validator = validator_path.read_text(encoding='utf-8')
          if 'imageMaterializer:' not in validator:
              validator = validator.replace(
                  '  guideContent: "src/data/fishing/technique-guide-content.ts",\n',
                  '  guideContent: "src/data/fishing/technique-guide-content.ts",\n  imageMaterializer: "scripts/assets/materialize-generated-images.mjs",\n',
                  1,
              )
          old_profile_tokens = 'for (const token of ["How to Fish","When to Use","Crankbait Types by Depth and Cover","Where to Fish","Basic Tackle and Rigging Setup","Season-by-Season Guide","Common Mistakes to Avoid","Texas Lakes Covered in This Guide","Check Current Conditions Before You Fish","Sources and Verification","does not claim",\'target="_blank"\',\'rel="noopener noreferrer"\']) requireText(files.profileComponent, token, "profile UI contract missing " + token);'
          new_profile_tokens = 'for (const token of ["How to Fish","When to Use","Crankbait Types by Depth and Cover","Where to Fish","Basic Tackle and Rigging Setup","Season-by-Season Guide","Common Mistakes to Avoid","Texas Lakes Covered in This Guide","Check Current Conditions Before You Fish","Sources and Verification","does not claim","/images/fishing/techniques/crankbaits-hero.webp","/images/fishing/techniques/crankbaits-depth-guide.webp",\'target="_blank"\',\'rel="noopener noreferrer"\']) requireText(files.profileComponent, token, "profile UI contract missing " + token);'
          if old_profile_tokens in validator:
              validator = validator.replace(old_profile_tokens, new_profile_tokens, 1)
          elif '/images/fishing/techniques/crankbaits-hero.webp' not in validator:
              raise SystemExit('Could not update crankbait image UI validation tokens')
          materializer_guard = 'for (const token of ["assets/generated/crankbait-page","hero.webp.b64.","depth-guide.webp.b64.","crankbaits-hero.webp","crankbaits-depth-guide.webp"]) requireText(files.imageMaterializer, token, "crankbait generated-image materialization missing " + token);\n'
          authority_line = 'for (const token of ["Squarebill","Deep diver","Lipless crankbait","running depth","contact or narrowly clear"]) requireText(files.guideContent, token, "crankbait authority content missing " + token);\n'
          if 'crankbait generated-image materialization missing' not in validator:
              if authority_line not in validator:
                  raise SystemExit('Could not find crankbait validator insertion point')
              validator = validator.replace(authority_line, authority_line + materializer_guard, 1)
          validator_path.write_text(validator, encoding='utf-8')
          PY

      - name: Validate materialization and fishing contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assets/materialize-generated-images.mjs
          test -s public/images/fishing/techniques/crankbaits-hero.webp
          test -s public/images/fishing/techniques/crankbaits-depth-guide.webp
          node scripts/data/validate-fishing-techniques.mjs

      - name: Commit page integration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/crankbait-page-assets-temporary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add crankbait hero and depth visuals'
          git push origin HEAD:feat/crankbait-page-images-20260927
