name: Corporate event manual quote draft controls
on:
  pull_request:
    paths:
      - 'src/data/corporate-event-quote.*.ts'
      - 'src/components/events/CorporateEventQuotePrepPanel.tsx'
      - 'src/routes/admin.sports-partners.lazy.tsx'
      - 'scripts/data/validate-corporate-event-quote-prep.mjs'
      - '.github/workflows/validate-corporate-event-quote-prep.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/corporate-event-quote.*.ts'
      - 'src/components/events/CorporateEventQuotePrepPanel.tsx'
      - 'src/routes/admin.sports-partners.lazy.tsx'
      - 'scripts/data/validate-corporate-event-quote-prep.mjs'
      - '.github/workflows/validate-corporate-event-quote-prep.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/data/validate-corporate-event-quote-prep.mjs
