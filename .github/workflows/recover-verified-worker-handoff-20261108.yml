# One-time, fail-closed recovery of an unverified active Worker after a
# successful publish but failed site-wide Chrome acceptance. Do not weaken
# the normal verified-asset predecessor requirement.
name: Recover verified TexasDefined Worker handoff (Nov 8)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-verified-worker-handoff-20261108.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: texasdefined-production
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve the genuine latest successful Worker from GitHub ledger
        id: verified_target
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/verified-worker-ledger.mjs resolve
      - name: Guard exact unverified active Worker and exact verified recovery target
        id: guard
        shell: bash
        env:
          RESOLVED_VERSION: ${{ steps.verified_target.outputs.version_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx wrangler deployments status --json > artifacts/verified-worker-before-recovery.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const state = JSON.parse(fs.readFileSync('artifacts/verified-worker-before-recovery.json','utf8'));
          const versions = state.versions;
          if (!Array.isArray(versions) || versions.length !== 1 || Number(versions[0].percentage) !== 100) {
            throw new Error('Ambiguous active Worker traffic: no rollback is authorized');
          }
          const current = versions[0].version_id;
          const expectedUnverified = '52598dbe-237d-4cdc-83b9-5a7617abb416';
          const expectedVerified = '503219ec-f996-4fc9-aa62-b6027ac647aa';
          const ledgerVersion = process.env.RESOLVED_VERSION;
          if (ledgerVersion !== expectedVerified) throw new Error('GitHub verified ledger changed; no rollback is authorized');
          let shouldRestore;
          if (current === expectedVerified) shouldRestore = false;
          else if (current === expectedUnverified) shouldRestore = true;
          else throw new Error('Active Worker differs from both pinned versions ('+current+'); refusing rollback');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'should_restore='+shouldRestore+'\n');
          console.log('Recovery preconditions established: current='+current+', verified target='+ledgerVersion+', restore='+shouldRestore);
          NODE
      - name: Restore the exact ledger-verified Worker (no invented or failed-run assets)
        if: steps.guard.outputs.should_restore == 'true'
        run: npx wrangler rollback "${{ steps.verified_target.outputs.version_id }}" --message "Recover GitHub-verified Worker 503219ec after postdeploy MSR mobile QA failure"
      - name: Verify the single 100 percent active Worker is the ledger-verified version
        shell: bash
        env:
          RESOLVED_VERSION: ${{ steps.verified_target.outputs.version_id }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --json > artifacts/verified-worker-after-recovery.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const versions = JSON.parse(fs.readFileSync('artifacts/verified-worker-after-recovery.json','utf8')).versions;
          if (!Array.isArray(versions) || versions.length !== 1 ||
              Number(versions[0].percentage) !== 100 ||
              versions[0].version_id !== process.env.RESOLVED_VERSION)
            throw new Error('Current 100%-traffic Worker is not the ledger-verified target');
          console.log('PASS verified Worker recovered at 100%: '+versions[0].version_id);
          NODE
      - name: Verify restored direct Worker
        env:
          PRODUCTION_HEALTH_ORIGIN: https://texasdefined-site.freddy-coppola.workers.dev
          PRODUCTION_HEALTH_LABEL: recovered-verified-worker
        run: node scripts/ci/verify-production-health.mjs
      - name: Verify restored canonical domain
        env:
          PRODUCTION_HEALTH_ORIGIN: https://texasdefined.com
          PRODUCTION_HEALTH_LABEL: recovered-verified-canonical
        run: node scripts/ci/verify-production-health.mjs
      - name: Verify restored production surfaces
        run: node scripts/ci/verify-production-surfaces.mjs
      - name: Preserve Worker identity evidence for next protected main deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-worker-recovery-${{ github.run_id }}
          path: artifacts/verified-worker-*-recovery.json
          if-no-files-found: warn
          retention-days: 14
