name: Certify Knox County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-knox-county-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Knox County source and live production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HERO_URL: https://commons.wikimedia.org/wiki/Special:Redirect/file/Knox%20County%20Courthouse%2C%20Benjamin%2C%20Texas.jpg?width=1600
        run: |
          set -euo pipefail
          publish() {
            state="$1"; description="$2"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data "{\"state\":\"${state}\",\"context\":\"knox-county-live\",\"description\":\"${description}\"}" >/dev/null
          }
          trap 'publish failure "Knox County production certification failed"' ERR
          publish pending "Checking Knox County production page and hero"

          fixture='src/data/fixtures/knox-county-benjamin-munday-brazos-ranching-rolling-plains-texas.ts'
          registry='src/data/county-series-profiles-rolling-plains.ts'
          test -f "$fixture"
          grep -Fq 'countySlug: "knox"' "$registry"
          grep -Fq 'Knox County: Benjamin, Munday, the Brazos Country and Rolling Plains Ranching' "$fixture"
          ! grep -n 'www\.texasdefined\.com' "$fixture" "$registry"

          tmp="$(mktemp -d)"
          ok=0
          for attempt in $(seq 1 12); do
            status="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$tmp/page" -w '%{http_code}' "https://texasdefined.com/county/knox?verify=${GITHUB_SHA}-${attempt}" || true)"
            if [ "$status" = 200 ] \
              && grep -Fq 'Knox County: Benjamin, Munday, the Brazos Country and Rolling Plains Ranching' "$tmp/page" \
              && grep -Fq 'The county in numbers' "$tmp/page" \
              && grep -Fq 'County seat' "$tmp/page" \
              && grep -Fq 'County feature' "$tmp/page" \
              && grep -Fq 'https://texasdefined.com/county/knox' "$tmp/page"; then
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" = 1 ]

          hs="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$tmp/hero-headers" -o "$tmp/hero" -w '%{http_code}' "$HERO_URL")"
          hm="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$tmp/hero-headers" | cut -d';' -f1)"
          hb="$(wc -c < "$tmp/hero")"
          [ "$hs" = 200 ]
          [[ "$hm" =~ ^image/(jpeg|png|webp)$ ]]
          [ "$hb" -gt 50000 ]

          publish success "Knox County page, structured/editorial layers and hero passed"
