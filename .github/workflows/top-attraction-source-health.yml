name: Top 25 authority source health

on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: top-25-authority-source-health
  cancel-in-progress: true

jobs:
  source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Top 25 review freshness
        id: freshness
        continue-on-error: true
        run: node scripts/data/validate-top-attraction-review-freshness.mjs 2>&1 | tee /tmp/top25-freshness.log

      - name: Check Top 25 official and supporting sources
        id: sources
        continue-on-error: true
        run: node scripts/data/check-top-attraction-source-health.mjs 2>&1 | tee /tmp/top25-sources.log

      - name: Publish authority health summary
        if: always()
        run: |
          {
            echo '## Top 25 authority health'
            echo
            echo "- Review freshness: ${{ steps.freshness.outcome }}"
            echo "- Source reachability: ${{ steps.sources.outcome }}"
            echo
            echo '### Freshness audit'
            echo '```text'
            cat /tmp/top25-freshness.log 2>/dev/null || true
            echo '```'
            echo
            echo '### Source audit'
            echo '```text'
            cat /tmp/top25-sources.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update authority-health issue
        if: steps.freshness.outcome == 'failure' || steps.sources.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Top 25 authority source health needs attention';
            const freshness = fs.existsSync('/tmp/top25-freshness.log') ? fs.readFileSync('/tmp/top25-freshness.log', 'utf8').slice(-12000) : 'No freshness log captured.';
            const sources = fs.existsSync('/tmp/top25-sources.log') ? fs.readFileSync('/tmp/top25-sources.log', 'utf8').slice(-12000) : 'No source-health log captured.';
            const body = [
              'The scheduled TexasDefined Top 25 authority audit found a freshness or source-health problem.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '### Review freshness',
              '```text',
              freshness,
              '```',
              '',
              '### Source reachability',
              '```text',
              sources,
              '```',
              '',
              'Fix the underlying source/review record; do not suppress the authority check merely to make the workflow green.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: [] });
            }

      - name: Close recovered authority-health issue
        if: steps.freshness.outcome == 'success' && steps.sources.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Top 25 authority source health needs attention';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Recovered in workflow run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. Both review freshness and source reachability passed.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' });
            }

      - name: Fail workflow when authority health is degraded
        if: steps.freshness.outcome == 'failure' || steps.sources.outcome == 'failure'
        run: exit 1
