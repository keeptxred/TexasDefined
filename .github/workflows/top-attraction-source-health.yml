name: Top 25 authority source health

on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: top-25-authority-source-health
  cancel-in-progress: true

jobs:
  source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Top 25 review freshness
        run: node scripts/data/validate-top-attraction-review-freshness.mjs

      - name: Check Top 25 official and supporting sources
        run: node scripts/data/check-top-attraction-source-health.mjs
