name: Temporary appraisal validator sed fix

on:
  push:
    branches:
      - agent/appraisal-canonical-priority-20260910

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/appraisal-canonical-priority-20260910
      - name: Update validator priority list
        run: |
          sed -i "s/'leon', 'terrell', 'lubbock', 'hidalgo', 'sabine'/'polk', 'leon', 'mason', 'terrell', 'lubbock', 'hidalgo', 'sabine'/" scripts/data/validate-internal-link-discovery.mjs
          grep -F "const priorityCountySlugs = ['polk', 'leon', 'mason', 'terrell', 'lubbock', 'hidalgo', 'sabine'];" scripts/data/validate-internal-link-discovery.mjs
      - name: Validate internal-link discovery
        run: node scripts/data/validate-internal-link-discovery.mjs
      - name: Commit validator update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/data/validate-internal-link-discovery.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Protect appraisal canonical priority targets"
          git push
