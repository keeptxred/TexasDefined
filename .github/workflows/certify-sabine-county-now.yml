name: Certify Sabine County now

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/certify-sabine-county-now.yml

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  certify-sabine:
    uses: ./.github/workflows/certify-county-production-reusable.yml
    with:
      county: sabine
    secrets: inherit
