name: Verify State Fair production browser
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/verify-state-fair-browser.mjs'
      - '.github/workflows/verify-state-fair-browser.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/verify-state-fair-browser.mjs'
      - '.github/workflows/verify-state-fair-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  statuses: read
concurrency:
  group: state-fair-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  syntax:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/ci/verify-state-fair-browser.mjs
  verify:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for exact protected production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/ci/wait-for-protected-production.mjs
      - name: Install browser runner
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-state-fair-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify State Fair in Chrome on three viewports
        env:
          PRODUCTION_ORIGIN: https://texasdefined.com
        run: node scripts/ci/verify-state-fair-browser.mjs
      - name: Save browser screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-fair-production-browser-qa
          path: artifacts/state-fair-browser/
          if-no-files-found: warn
          retention-days: 30
