name: Verify playoff guide mobile browser

# Verify live affiliate links and browser behavior on review, and again after
# relevant changes land on main. No affiliate outbound redirects or tracked
# production clicks are generated by the browser acceptance.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/ci/verify-football-playoffs-browser.mjs
      - .github/workflows/verify-football-playoffs-browser.yml
      - src/components/sports/FootballFanOffers.tsx
      - src/data/fixtures/texas-high-school-football-playoffs.ts
  pull_request:
    paths:
      - scripts/ci/verify-football-playoffs-browser.mjs
      - .github/workflows/verify-football-playoffs-browser.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Chrome without changing project dependencies
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-playoffs-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Check the live article at mobile and desktop widths
        run: node scripts/ci/verify-football-playoffs-browser.mjs
      - name: Retain screenshots and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-playoffs-browser-acceptance
          path: artifacts/football-playoffs-qa/
          if-no-files-found: warn
          retention-days: 14
