name: Verify consolidated home-insurance production

on:
  pull_request:
    paths:
      - '.github/workflows/verify-local-home-insurance-production.yml'
      - 'scripts/ci/verify-local-home-insurance-pages.mjs'
      - 'scripts/data/validate-local-home-insurance-seo.mjs'
      - 'src/components/calculators/CalculatorPage.tsx'
      - 'src/components/calculators/ConsolidatedLocationSelector.tsx'
      - 'src/data/local-home-affordability.ts'
      - 'src/data/local-home-insurance.ts'
      - 'src/data/sitemap-dependencies.server.ts'
      - 'src/routes/texas-home-insurance-calculator*.tsx'
      - 'src/routes/sitemap*.ts'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-local-home-insurance-production.yml'
      - 'scripts/ci/verify-local-home-insurance-pages.mjs'
      - 'scripts/data/validate-local-home-insurance-seo.mjs'
      - 'src/components/calculators/CalculatorPage.tsx'
      - 'src/components/calculators/ConsolidatedLocationSelector.tsx'
      - 'src/data/local-home-affordability.ts'
      - 'src/data/local-home-insurance.ts'
      - 'src/data/sitemap-dependencies.server.ts'
      - 'src/routes/texas-home-insurance-calculator*.tsx'
      - 'src/routes/sitemap*.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-home-insurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contract:
    name: Validate consolidated home-insurance authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate preserved local context and redirect contract
        run: node scripts/data/validate-local-home-insurance-seo.mjs

  verify-production:
    name: Verify canonical insurance page and 19 legacy redirects
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical page, permanent redirects and sitemap retirement
        run: node scripts/ci/verify-local-home-insurance-pages.mjs
