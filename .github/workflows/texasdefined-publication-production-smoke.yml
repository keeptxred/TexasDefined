name: TexasDefined publication production smoke

on:
  workflow_dispatch:
  # A cheap, bounded source-vintage catch-up check survives superseded
  # production deploy runs during periods of rapid main-branch updates.
  # It never rewrites data or invokes a full site audit.
  schedule:
    - cron: '47 14 * * *'
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types: [completed]
    branches: [main]
permissions:
  contents: read

concurrency:
  group: texasdefined-publication-production-smoke
  cancel-in-progress: true

jobs:
  verify-publication-surfaces:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify auto-publication activation remains unset
        env:
          TEXASDEFINED_AUTO_PUBLISH_ENABLED: ${{ vars.TEXASDEFINED_AUTO_PUBLISH_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$TEXASDEFINED_AUTO_PUBLISH_ENABLED" ]; then
            echo "TEXASDEFINED_AUTO_PUBLISH_ENABLED_PRESENT=true"
            echo "::error::TexasDefined automatic publication must remain unset until explicit activation is approved."
            exit 1
          fi
          echo "TEXASDEFINED_AUTO_PUBLISH_ENABLED_PRESENT=false"
      - name: Verify live news, published article canonicals and sitemap XML
        if: github.event_name != 'schedule'
        run: node scripts/ci/verify-texasdefined-publication-production.mjs
      - name: Detect scoped Texas Data publication changes
        id: texas_data_scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' || "$GITHUB_EVENT_NAME" == 'schedule' ]]; then
            # A deliberate manual or daily audit always checks the latest source,
            # even when an unrelated push superseded the data-release deploy.
            echo 'changed=yes' >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD -- \
            'src/routes/texas-data*' \
            'src/routes/sports-venues.compare*' \
            src/data/texas-data-center.ts src/data/texas-data-center.server.ts \
            src/data/acs-county-housing-costs.snapshot.json \
            src/data/census-county-growth.ts \
            src/data/generated/texas-metro-payrolls-current.json \
            src/data/generated/tdi-homeowners-current.json \
            src/data/generated/texas-state-population-current.json \
            src/data/generated/texas-reference-facts-current.json \
            src/data/generated/texas-county-growth-current.json \
            src/data/sports-venue-comparison.ts \
            scripts/ci/verify-texas-data-production.mjs \
            scripts/ci/verify-changed-production-pages.mjs \
            .github/workflows/texasdefined-publication-production-smoke.yml | grep -q .; then
            echo 'changed=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=no' >> "$GITHUB_OUTPUT"
            echo 'Texas Data unaffected by this deployment; scoped download audit skipped.'
          fi
      - name: Check scoped Texas Data acceptance syntax
        if: steps.texas_data_scope.outputs.changed == 'yes'
        run: node --check scripts/ci/verify-texas-data-production.mjs
      - name: Validate published Texas Data hub and all four CSV exports
        if: steps.texas_data_scope.outputs.changed == 'yes'
        run: node scripts/ci/verify-texas-data-production.mjs

      - name: Verify Zapata museum live authority after every successful production release
        if: github.event_name != 'schedule'
        run: node scripts/ci/verify-zapata-museum-production.mjs
      - name: Verify Motel 6 production tracking and football stay CTA
        if: github.event_name != 'schedule'
        run: node scripts/ci/verify-motel6-production.mjs

