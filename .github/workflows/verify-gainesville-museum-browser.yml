name: Verify Gainesville museum in real Chrome

on:
  pull_request:
    paths:
      - "scripts/ci/verify-gainesville-museum-browser.mjs"
      - ".github/workflows/verify-gainesville-museum-browser.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy TexasDefined production"]
    types: [completed]
  schedule:
    # Weekly targeted visual acceptance, not a site-wide Chrome sweep.
    - cron: "11 16 * * 1"

permissions:
  contents: read

concurrency:
  group: gainesville-museum-real-chrome
  cancel-in-progress: false

jobs:
  lint:
    if: github.event_name == 'pull_request'
    name: Validate museum Chrome verifier syntax
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scripts/ci/verify-gainesville-museum-browser.mjs

  verify:
    # PRs have no live preview: testing stale production images on a PR is a false blocker.
    # Run full Chrome only AFTER successful production deploy, or scheduled/manual review.
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    name: Museum responsive + accessible-page acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install bounded Chrome driver
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "::error title=Chrome unavailable::This job requires actual Chrome; no source-only pass"
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-gainesville-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify museum in one Chrome browser at mobile and desktop widths
        run: |
          node --check scripts/ci/verify-gainesville-museum-browser.mjs
          node scripts/ci/verify-gainesville-museum-browser.mjs
        env:
          PRODUCTION_ORIGIN: https://texasdefined.com
      - name: Preserve real-browser screenshots and structured findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gainesville-museum-mobile-desktop-${{ github.run_id }}
          path: artifacts/gainesville-museum-browser/
          if-no-files-found: warn
          retention-days: 30
