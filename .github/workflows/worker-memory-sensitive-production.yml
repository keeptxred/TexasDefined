name: Worker memory-sensitive production acceptance
on:
  workflow_run:
    workflows: ["Deploy TexasDefined production"]
    types: [completed]
  pull_request:
    paths:
      - 'scripts/ci/verify-worker-memory-sensitive-production.mjs'
      - 'scripts/ci/worker-memory-identity.mjs'
      - 'scripts/ci/worker-memory-identity.test.mjs'
      - 'scripts/ci/verify-fishing-section-loader-fanout.test.mjs'
      - 'src/routes/fishing.lakes.$slug.$section.tsx'
      - 'src/routes/fishing.lakes.lake-conroe.camping.tsx'
      - '.github/workflows/worker-memory-sensitive-production.yml'
  schedule:
    - cron: '23 11,23 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-memory-sensitive-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  memory-sensitive-routes:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm single-version memory probe safety contract
        run: node --test scripts/ci/worker-memory-identity.test.mjs scripts/ci/verify-fishing-section-loader-fanout.test.mjs
      # Premerge tests validate the proposed fix. The current deployed Worker may
      # still fail on the exact route this PR is repairing; testing the old
      # version cannot certify the candidate source or block its deployment.
      # Keep the full uncached 36/36 live check mandatory after a successful
      # protected deployment, on schedules and manual runs.
      - name: Explain premerge versus deployed-Worker acceptance
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "PR source-contract tests passed; production 36/36 is NOT certified until deployment."
      - name: Verify incident routes on both live origins without CDN cache masking
        if: ${{ github.event_name != 'pull_request' }}
        run: node scripts/ci/verify-worker-memory-sensitive-production.mjs
      - name: Preserve route-by-route HTTP and latency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-memory-sensitive-${{ github.run_id }}
          path: artifacts/worker-memory/production.json
          if-no-files-found: warn
          retention-days: 14
