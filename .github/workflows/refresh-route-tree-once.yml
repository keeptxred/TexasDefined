name: Refresh TanStack route tree once

on:
  push:
    branches:
      - fix/discovery-route-tree-production-20260902
    paths:
      - '.github/workflows/refresh-route-tree-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/discovery-route-tree-production-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate route tree through the production build
        run: npm run build
      - name: Commit generated route tree
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo 'routeTree.gen.ts already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routeTree.gen.ts
          git commit -m 'fix: refresh generated TanStack route tree'
          git push origin HEAD:fix/discovery-route-tree-production-20260902
