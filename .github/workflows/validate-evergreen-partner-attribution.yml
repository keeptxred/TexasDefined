name: Validate evergreen partner attribution

on:
  pull_request:
    paths:
      - 'src/components/monetization/EvergreenNextSteps.tsx'
      - 'src/lib/affiliate-click.ts'
      - 'scripts/data/validate-evergreen-partner-attribution.mjs'
      - '.github/workflows/validate-evergreen-partner-attribution.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/monetization/EvergreenNextSteps.tsx'
      - 'src/lib/affiliate-click.ts'
      - 'scripts/data/validate-evergreen-partner-attribution.mjs'
      - '.github/workflows/validate-evergreen-partner-attribution.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate evergreen partner attribution
        run: node scripts/data/validate-evergreen-partner-attribution.mjs
