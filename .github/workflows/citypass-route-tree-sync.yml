name: CityPASS route tree sync

on:
  push:
    branches:
      - feature/citypass-texas-evergreen

permissions:
  contents: write

jobs:
  sync-route-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/citypass-texas-evergreen

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate route tree via production build
        run: npm run build

      - name: Commit generated route tree
        shell: bash
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "Route tree already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore: commit generated CityPASS route tree"
          git push origin HEAD:feature/citypass-texas-evergreen
