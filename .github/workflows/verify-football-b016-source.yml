name: Football Batch016 source contract (no graduation)
on:
  pull_request:
    paths:
      - 'src/data/high-school-football/program-editorial-b016-*.ts'
      - 'src/data/high-school-football/football-program-profile.server.ts'
      - 'scripts/ci/verify-football-b016-source.mjs'
      - '.github/workflows/verify-football-b016-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all 25 Batch016 source guides without premature graduation
        run: node scripts/ci/verify-football-b016-source.mjs
