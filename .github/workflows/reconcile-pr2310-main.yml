name: Reconcile PR 2310 with main

on:
  push:
    branches:
      - growth/find-my-texas-county
    paths:
      - .github/workflows/reconcile-pr2310-main.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'Add one-time PR2310 reconcile workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Check out county finder branch
        uses: actions/checkout@v4
        with:
          ref: growth/find-my-texas-county
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Merge current main and regenerate route tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge origin/main --no-commit --no-ff
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(src/lib/public-routes\.ts|src/routeTree\.gen\.ts)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          if printf '%s\n' "$conflicts" | grep -qx 'src/lib/public-routes.ts'; then
            county_line="$(git show HEAD:src/lib/public-routes.ts | grep '/find-my-county' | head -n 1)"
            if [ -z "$county_line" ]; then
              echo "County finder public route was not present on the PR head."
              exit 1
            fi
            git checkout --theirs src/lib/public-routes.ts
            COUNTY_LINE="$county_line" python - <<'PY'
          import os
          from pathlib import Path

          path = Path('src/lib/public-routes.ts')
          text = path.read_text()
          if '/find-my-county' not in text:
              lines = text.splitlines()
              try:
                  index = next(i for i, line in enumerate(lines) if '/find-my-dmv' in line)
              except StopIteration as exc:
                  raise SystemExit('Could not locate /find-my-dmv insertion anchor on current main') from exc
              lines.insert(index, os.environ['COUNTY_LINE'])
              path.write_text('\n'.join(lines) + '\n')
          PY
            git add src/lib/public-routes.ts
          fi

          if printf '%s\n' "$conflicts" | grep -qx 'src/routeTree.gen.ts'; then
            git checkout --theirs src/routeTree.gen.ts
            git add src/routeTree.gen.ts
          fi

          if git ls-files -u | grep -q .; then
            echo "Unresolved merge conflicts remain."
            git ls-files -u
            exit 1
          fi

          if [ "$merge_status" -ne 0 ] && [ -z "$conflicts" ]; then
            echo "Merge failed without a resolvable conflict set."
            exit "$merge_status"
          fi

          npm ci
          npm run build
          git add src/routeTree.gen.ts

          if git diff --cached --quiet && git diff --quiet; then
            echo "No reconciliation changes were necessary."
            exit 0
          fi

          git status --short
          git commit -m "Merge current main into county finder"
          git push origin HEAD:growth/find-my-texas-county
