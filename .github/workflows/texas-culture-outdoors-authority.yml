name: TexasDefined five cultural and outdoor guide authority reviews
on:
  pull_request:
    paths:
      - 'src/data/texas-evergreen-guides-batch2.ts'
      - 'src/data/texas-evergreen-guides-batch7.ts'
      - 'src/components/editorial/TexasEvergreenGuide.tsx'
      - 'src/components/editorial/TexasCultureGuideFieldwork.tsx'
      - 'src/components/editorial/TexasNaturalWondersAuthority.tsx'
      - 'src/routes/texas-rock-climbing-bouldering-guide.lazy.tsx'
      - 'src/routes/texas-rock-climbing-bouldering-guide.tsx'
      - 'ops/editorial/texas-culture-outdoors-review-groups.json'
      - 'scripts/ci/check-five-texas-guide-authority.mjs'
      - 'scripts/ci/verify-five-texas-culture-browser.mjs'
      - 'scripts/ci/audit-five-culture-guide-vitals.mjs'
      - 'scripts/ci/audit-five-culture-lighthouse-local.mjs'
      - 'scripts/ci/five-culture-guide-roster.mjs'
      - '.github/workflows/texas-culture-outdoors-authority.yml'
  schedule:
    - cron: '23 14 * * 3'       # Weekly: rock-climbing safety, access and official alerts
    - cron: '17 14 5 * *'      # Monthly: dance halls, mum seller prices, natural wonders access
    - cron: '41 14 7 1,4,7,10 *' # Quarterly: stable folklore
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  # Unrelated issue comments must never replace a pending owner verification.
  # Separate the two authorized commands so browser and vitals runs can coexist.
  group: >-
    five-texas-guide-authority-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      github.event_name == 'schedule' && github.event.schedule ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 7368 &&
       github.event.comment.user.login == 'keeptxred' && github.event.comment.body == '/verify-five-culture-live') && 'manual-browser' ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 7754 &&
       github.event.comment.user.login == 'keeptxred' && github.event.comment.body == '/audit-five-culture-vitals') && 'manual-vitals' ||
      github.event_name == 'issue_comment' && format('ignored-{0}', github.run_id) ||
      'manual-dispatch' }}
  cancel-in-progress: false
jobs:
  static-authority-check:
    name: Validate five page source contracts and TSX syntax
    if: ${{ github.event_name != 'issue_comment' || (github.event.issue.number == 7368 && github.event.comment.user.login == 'keeptxred' && github.event.comment.body == '/verify-five-culture-live') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate exact canonical pages, facts, sources and review inventory
        run: node scripts/ci/check-five-texas-guide-authority.mjs --static
      - name: Install dependencies without repository lifecycle hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Assert 15-case Chrome contract is deterministic
        run: node scripts/ci/verify-five-texas-culture-browser.mjs --self-test
      - name: Verify five-guide exact URL field-vitals interpretation
        run: |
          node --check scripts/ci/audit-five-culture-guide-vitals.mjs
          node scripts/ci/audit-five-culture-guide-vitals.mjs --self-test
          node --check scripts/ci/five-culture-guide-roster.mjs
          node --check scripts/ci/audit-five-culture-lighthouse-local.mjs
          node scripts/ci/audit-five-culture-lighthouse-local.mjs --self-test
      - name: Parse modified TypeScript and TSX modules
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { transformSync } from 'esbuild';
          const files = [
            'src/data/texas-evergreen-guides-batch2.ts',
            'src/data/texas-evergreen-guides-batch7.ts',
            'src/components/editorial/TexasEvergreenGuide.tsx',
            'src/components/editorial/TexasCultureGuideFieldwork.tsx',
            'src/components/editorial/TexasNaturalWondersAuthority.tsx',
            'src/routes/texas-rock-climbing-bouldering-guide.lazy.tsx',
            'src/routes/texas-rock-climbing-bouldering-guide.tsx'
          ];
          for (const path of files) {
            transformSync(fs.readFileSync(path, 'utf8'), { loader: path.endsWith('tsx') ? 'tsx' : 'ts', target: 'es2022' });
            console.log('TSX_PARSE_PASS ' + path);
          }
          JS
  primary-source-watch:
    name: Recheck official sources and live page contract
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 7368 && github.event.comment.user.login == 'keeptxred' && github.event.comment.body == '/verify-five-culture-live') }}
    needs: static-authority-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCOPE: ${{ github.event.schedule == '23 14 * * 3' && 'weekly' || github.event.schedule == '17 14 5 * *' && 'monthly' || github.event.schedule == '41 14 7 1,4,7,10 *' && 'quarterly' || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - name: Bounded live and source checks; never update dates automatically
        id: sourcewatch
        continue-on-error: true
        shell: bash
        env:
          # Only trusted main runs may consult the existing private source ledger.
          # The script makes fixed-origin, exact-source read-only requests.
          TD_SOURCE_LEDGER_READ_KEY: ${{ github.ref == 'refs/heads/main' && (secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY) || '' }}
        run: |
          set -o pipefail
          node scripts/ci/check-five-texas-guide-authority.mjs --watch --scope="$SCOPE" 2>&1 | tee /tmp/texas-five-guide-review.log
      - name: Record or update one actionable GitHub issue when source review fails
        if: ${{ steps.sourcewatch.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue_title='TexasDefined five-guide authority: source or review needs attention'
          existing=$(gh issue list --state open --search "$issue_title in:title" --json number,title --jq '.[] | select(.title == "TexasDefined five-guide authority: source or review needs attention") | .number' | head -1)
          {
            echo 'Scheduled verification found an overdue factual review, inaccessible official primary source or changed public copy. This issue is actionable by the existing sitewide-source-backed-rewrite.yml source-researched PR pipeline, but MUST NOT be treated as authorization for a speculative rewrite. Verify the facts, correct pages and only then update source review dates.'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            tail -100 /tmp/texas-five-guide-review.log
            echo '```'
          } > /tmp/texas-five-guide-review-issue.md
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/texas-five-guide-review-issue.md
          else
            gh issue create --title "$issue_title" --body-file /tmp/texas-five-guide-review-issue.md
          fi
      - name: Install browser driver for owner-triggered production proof
        id: browser_setup
        if: ${{ !cancelled() && github.event_name == 'issue_comment' }}
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-five-culture-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify five pages in 15 genuine browser viewports on one Worker
        id: browser
        if: ${{ !cancelled() && github.event_name == 'issue_comment' && steps.browser_setup.outcome == 'success' }}
        run: node scripts/ci/verify-five-texas-culture-browser.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'issue_comment' }}
        with:
          name: five-texas-culture-browser-${{ github.run_id }}
          path: artifacts/five-culture-responsive/
          if-no-files-found: warn
          retention-days: 14
      - name: Record non-skipped source-specific live acceptance in authority checkpoint
        if: ${{ !cancelled() && github.event_name == 'issue_comment' && steps.browser.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 7368 --body "Five-guide source-specific indexable HTML, and 15 actual 320/390/1366 Chrome viewports passed on a single identified Worker (screenshots and report preserved) in [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}), checked from commit \`${{ github.sha }}\`. Independent primary-source watch outcome: ${{ steps.sourcewatch.outcome }}. Browser success does not clear a failed source watch. This validates the bounded public checks, not independent image rights, manual accessibility or Google indexing."
      - name: Fail scheduled assurance on unresolved source changes
        if: ${{ steps.sourcewatch.outcome == 'failure' }}
        run: exit 1

  page-vitals:
    name: Measure five canonical guide URLs on mobile and desktop
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '17 14 5 * *') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 7754 &&
       github.event.comment.user.login == 'keeptxred' &&
       github.event.comment.body == '/audit-five-culture-vitals')
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove no URL-origin CrUX fallback can become a false pass
        run: node scripts/ci/audit-five-culture-guide-vitals.mjs --self-test
      - name: Query independent PageSpeed mobile and desktop evidence
        id: vitals
        continue-on-error: true
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: node scripts/ci/audit-five-culture-guide-vitals.mjs
      - name: Install pinned, no-cost local Lighthouse (independent of PSI quota)
        run: |
          set -euo pipefail
          npm install --prefix /tmp/texasdefined-five-culture-lighthouse --no-save --no-package-lock --ignore-scripts lighthouse@13.6.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Measure five guides locally with real Chrome and Lighthouse accessibility/performance audits
        id: local_lighthouse
        continue-on-error: true
        run: node scripts/ci/audit-five-culture-lighthouse-local.mjs
      - name: Preserve all measurements, including missing field-data reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-culture-guide-vitals-${{ github.run_id }}
          path: |
            .artifacts/five-culture-guide-vitals.json
            .artifacts/five-culture-lighthouse/
          retention-days: 30
          if-no-files-found: warn
      - name: Open or update one issue on confirmed measured performance regression
        if: ${{ steps.vitals.outcome == 'failure' || steps.local_lighthouse.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='Five culture and outdoor guides: measured page-speed regression'
          issue="$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "Five culture and outdoor guides: measured page-speed regression") | .number' | head -1)"
          message="Official URL-level PageSpeed or independent local Chrome Lighthouse performance/accessibility observations require correction. Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Separate exact-page CrUX from origin fallback, lab timing and missing API data. Fix actual code and retest; do not change page facts or dates only for a new test."
          if [ -n "$issue" ]; then gh issue comment "$issue" --body "$message"; else gh issue create --title "$title" --body "$message"; fi
      - name: Enforce genuine measured regressions from PSI OR local Chrome Lighthouse
        if: ${{ steps.vitals.outcome == 'failure' || steps.local_lighthouse.outcome == 'failure' }}
        run: exit 1
