name: CityPASS final self-test

on:
  push:
    branches:
      - feature/citypass-texas-evergreen

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/citypass-texas-evergreen
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Repair contract and run protected-equivalent checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/data/destination-query-runtime.ts')
          text = p.read_text()
          old = '  const preservedSearchCatalog = mergeDestinations(enriched, core, preservedExploreDestinations);\n'
          new = '  const preservedSearchCatalog = reconcileExploreCatalog(mergeDestinations(enriched, core, preservedExploreDestinations));\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one search-catalog contract marker, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY

          rm -f .citypass-validation-diagnostic.txt
          rm .github/workflows/citypass-final-selftest.yml

          : > /tmp/citypass-selftest.log
          status=0

          echo '=== full validation ===' >> /tmp/citypass-selftest.log
          node scripts/ci/run-validation-suite.mjs full >> /tmp/citypass-selftest.log 2>&1 || status=$?

          if [ "$status" -eq 0 ]; then
            echo '=== predeploy validation ===' >> /tmp/citypass-selftest.log
            node scripts/ci/run-validation-suite.mjs predeploy >> /tmp/citypass-selftest.log 2>&1 || status=$?
          fi

          if [ "$status" -eq 0 ]; then
            echo '=== production build ===' >> /tmp/citypass-selftest.log
            npm run build >> /tmp/citypass-selftest.log 2>&1 || status=$?
          fi

          if [ "$status" -eq 0 ]; then
            echo '=== generated route tree ===' >> /tmp/citypass-selftest.log
            git diff --exit-code -- src/routeTree.gen.ts >> /tmp/citypass-selftest.log 2>&1 || status=$?
          fi

          if [ "$status" -eq 0 ]; then
            echo '=== client performance budget ===' >> /tmp/citypass-selftest.log
            node scripts/data/validate-client-bundle-budget.mjs >> /tmp/citypass-selftest.log 2>&1 || status=$?
          fi

          if [ "$status" -ne 0 ]; then
            cp /tmp/citypass-selftest.log .citypass-validation-diagnostic.txt
          fi

          git checkout -- src/routeTree.gen.ts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: preserve indexing contract with async CityPASS expansion"
          git push origin HEAD:feature/citypass-texas-evergreen

          if [ "$status" -ne 0 ]; then
            echo "Self-test found a remaining blocker; diagnostic committed."
          else
            echo "All protected-equivalent CityPASS self-tests passed."
          fi
