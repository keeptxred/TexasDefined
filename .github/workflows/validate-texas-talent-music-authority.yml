name: Validate Texas Talent music authority links

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/texas-talent*'
      - 'src/data/texas-talent/**'
      - 'src/routes/texas-talent*'
      - 'scripts/data/validate-texas-talent-music-authority.mjs'
      - '.github/workflows/validate-texas-talent-music-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Texas Talent music authority links
        run: node scripts/data/validate-texas-talent-music-authority.mjs
