name: Test Ticketmaster Partner API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-ticketmaster-partner-api.yml"
      - "scripts/events/ticketmaster-partner-probe.mjs"

permissions:
  contents: read

concurrency:
  group: ticketmaster-partner-api-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe Partner API availability
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: node scripts/events/ticketmaster-partner-probe.mjs
