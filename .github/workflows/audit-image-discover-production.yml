name: Image and Discover production audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 2,5'
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: image-discover-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Crawl priority public pages for image and Discover readiness
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Audit priority production pages
        env:
          IMAGE_AUDIT_STRICT: '1'
          IMAGE_AUDIT_CONCURRENCY: '8'
          IMAGE_AUDIT_TIMEOUT_MS: '30000'
        run: node scripts/ci/verify-image-discover-production.mjs

      - name: Upload image and Discover audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-discover-production-report
          path: image-discover-production-report.json
          if-no-files-found: warn
