name: Verify military museum production

on:
  workflow_dispatch:
permissions:
  contents: read
  statuses: write

jobs:
  verify-military-museum-production:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Publish pending status
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" \
            --data '{"state":"pending","context":"texasdefined-military-visitor-live","description":"Verifying military museum visitor routes"}' >/dev/null

      - name: Check out exact deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js for naval page verification
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify military visitor routes
        id: live
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          fetch_assert() {
            local label="$1" path="$2" needle="$3"
            local out="$workdir/${label}.html"
            local attempt
            for attempt in 1 2 3 4 5 6; do
              echo "[$label] attempt $attempt: ${origin}${path}"
              if curl --fail-with-body --silent --show-error --location --max-time 30 \
                "${origin}${path}?verify=${DEPLOY_SHA}-${GITHUB_RUN_ID}-${attempt}" -o "$out"; then
                if grep -Fq "$needle" "$out"; then
                  echo "[$label] production content verified: $needle"
                  return 0
                fi
                echo "[$label] fetched but expected content is not live yet: $needle"
              fi
              sleep 5
            done
            echo "[$label] production verification failed for ${origin}${path}" >&2
            head -c 1200 "$out" 2>/dev/null || true
            echo >&2
            return 1
          }
          fetch_assert visitor-guide '/article/texas-military-museums-historic-sites-guide' 'Texas Military Museums & Historic Sites'
          fetch_assert uss-lexington '/destination/uss-lexington-museum-corpus-christi' 'USS Lexington Museum'
          fetch_assert wasp-museum '/destination/national-wasp-wwii-museum-sweetwater' 'National WASP WWII Museum'
          fetch_assert silent-wings '/destination/silent-wings-museum-lubbock' 'Silent Wings Museum'
          fetch_assert texas-history '/texas-history' 'Texas Military Museums'
          PRODUCTION_COMMIT_SHA="$DEPLOY_SHA" node scripts/ci/verify-naval-heritage-production.mjs

      # workflow_run loads default-branch workflow YAML even if its successful
      # deployed SHA predates the browser checker. Keep the original checkout
      # pinned to deployed source, and retrieve a fixed, previously protected
      # merge commit containing the browser verifier (never floating main).
      # Update the immutable verifier pin only through another protected PR.
      - name: Check out immutable protected browser acceptance verifier
        uses: actions/checkout@v4
        with:
          ref: dba2d118d62eda1e5c07efaa6b475956ef062ba8
          path: .naval-browser-verifier
          sparse-checkout: scripts/ci/verify-battleship-texas-browser.mjs
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Prepare Chrome for Battleship Texas responsive acceptance
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-naval-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1

      - name: Inspect Battleship Texas mobile and desktop, all images, and legacy HTTP 301
        run: |
          set -euo pipefail
          verifier_sha="$(git -C .naval-browser-verifier rev-parse HEAD)"
          echo "Checking live deployed revision ${DEPLOY_SHA} using protected browser-verifier revision ${verifier_sha}"
          PRODUCTION_COMMIT_SHA="$DEPLOY_SHA" VERIFIER_COMMIT_SHA="$verifier_sha" node .naval-browser-verifier/scripts/ci/verify-battleship-texas-browser.mjs

      - name: Preserve checker and deployed revision provenance
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/battleship-texas-browser
          verifier_sha="$(git -C .naval-browser-verifier rev-parse HEAD 2>/dev/null || echo unavailable)"
          printf '{"deployed_sha":"%s","verifier_sha":"%s"}\\n' "$DEPLOY_SHA" "$verifier_sha" > artifacts/battleship-texas-browser/revisions.json

      - name: Retain Battleship Texas screenshots and browser acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battleship-texas-browser-${{ github.run_id }}
          path: artifacts/battleship-texas-browser/
          if-no-files-found: warn
          retention-days: 45

      - name: Preserve naval history production acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naval-heritage-live-${{ github.run_id }}
          path: .artifacts/naval-heritage-production.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish success status
        if: ${{ steps.live.outcome == 'success' }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" \
            --data '{"state":"success","context":"texasdefined-military-visitor-live","description":"Military museum visitor routes are live"}' >/dev/null

      - name: Publish failure status
        if: ${{ failure() }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" \
            --data '{"state":"failure","context":"texasdefined-military-visitor-live","description":"Military museum visitor route verification failed"}' >/dev/null
