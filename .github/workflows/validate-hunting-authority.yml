name: Validate hunting authority

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/hunting*'
      - 'src/data/hunting/**'
      - 'src/routes/hunting*'
      - 'src/components/hunting/**'
      - 'scripts/data/check-turkey-regulations.mjs'
      - 'scripts/data/refresh-turkey-season-calendar.mjs'
      - 'scripts/data/refresh-turkey-season-calendar.test.mjs'
      - 'src/brand/texasdefined.ts'
      - 'scripts/data/refresh-hunting-official-facts.mjs'
      - 'scripts/data/refresh-hunting-official-facts.test.mjs'
      - '.github/workflows/monitor-hunting-tpwd-sources.yml'
      - 'scripts/data/validate-hunting-authority.mjs'
      - '.github/workflows/validate-hunting-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate hunting authority contract
        run: |
          node scripts/data/validate-hunting-authority.mjs
          node --test scripts/data/refresh-turkey-season-calendar.test.mjs
          node --check scripts/data/refresh-turkey-season-calendar.mjs
