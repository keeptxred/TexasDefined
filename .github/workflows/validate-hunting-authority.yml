name: Validate hunting authority

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/hunting*'
      - 'src/data/hunting/**'
      - 'src/routes/hunting*'
      - 'src/components/hunting/**'
      - 'scripts/data/check-turkey-regulations.mjs'
      - 'scripts/data/refresh-turkey-season-calendar.mjs'
      - 'scripts/data/refresh-turkey-season-calendar.test.mjs'
      - 'src/brand/texasdefined.ts'
      - 'scripts/data/refresh-hunting-official-facts.mjs'
      - 'scripts/data/refresh-hunting-official-facts.test.mjs'
      - '.github/workflows/monitor-hunting-tpwd-sources.yml'
      - 'scripts/data/refresh-hunting-species-seasons.mjs'
      - 'scripts/data/refresh-hunting-species-seasons.test.mjs'
      - 'scripts/data/monitor-hunting-live-freshness.mjs'
      - '.github/workflows/refresh-hunting-species-calendar.yml'
      - '.github/workflows/finish-hunting-species-calendar.yml'
      - '.github/workflows/monitor-hunting-live-freshness.yml'
      - 'scripts/data/hunting-season-window-status.test.mjs'
      - 'scripts/data/validate-hunting-final-access.mjs'
      - 'scripts/data/validate-hunting-guide-audit.mjs'
      - 'scripts/data/check-hunting-season-rollover.mjs'
      - 'scripts/data/check-hunting-season-rollover.test.mjs'
      - 'scripts/ci/verify-hunting-hub-responsive-browser.mjs'
      - '.github/workflows/deploy-production.yml'
      - 'scripts/ci/hunting-hub-planner-production.test.mjs'
      - 'scripts/ci/verify-changed-production-pages.mjs'
      - 'scripts/data/monitor-hunting-live-freshness.mjs'
      - 'scripts/data/validate-hunting-authority.mjs'
      - '.github/workflows/validate-hunting-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate hunting authority contract
        run: |
          node scripts/data/validate-hunting-authority.mjs
          node scripts/data/validate-hunting-guide-audit.mjs
          node scripts/data/validate-hunting-final-access.mjs
          node --test scripts/data/check-hunting-season-rollover.test.mjs
          node --check scripts/ci/verify-hunting-hub-responsive-browser.mjs
          node --test scripts/data/hunting-season-window-status.test.mjs
          node --test scripts/ci/hunting-hub-planner-production.test.mjs
          node --check scripts/data/monitor-hunting-live-freshness.mjs
          node --test scripts/data/refresh-hunting-species-seasons.test.mjs
          node scripts/data/refresh-hunting-species-seasons.mjs
          node --check scripts/data/monitor-hunting-live-freshness.mjs
          node --test scripts/data/refresh-turkey-season-calendar.test.mjs
          node --check scripts/data/refresh-turkey-season-calendar.mjs
