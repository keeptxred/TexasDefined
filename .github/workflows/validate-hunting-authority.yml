name: Validate hunting authority

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/hunting*'
      - 'src/data/hunting/**'
      - 'src/routes/hunting*'
      - 'scripts/data/validate-hunting-authority.mjs'
      - '.github/workflows/validate-hunting-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate hunting authority contract
        run: node scripts/data/validate-hunting-authority.mjs
