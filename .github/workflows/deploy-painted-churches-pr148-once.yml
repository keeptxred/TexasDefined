name: Deploy Painted Churches PR 148 once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy-and-verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Trigger production deploy for Painted Churches PR #148')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production bundle
        run: npm run build
      - name: Enforce existing client bundle budget
        run: npm run performance:validate
      - name: Deploy TexasDefined Worker
        run: npx wrangler deploy
      - name: Verify Painted Churches production routes
        shell: bash
        run: |
          set -euo pipefail
          atlas='https://texasdefined.com/explore/painted-churches/guides'
          sample='https://texasdefined.com/explore/painted-churches/guides/st-michael-weimar'
          sitemap='https://texasdefined.com/sitemap-explore.xml'

          fetch_with_retry() {
            local url="$1" out="$2"
            for attempt in 1 2 3 4 5 6; do
              if curl --fail-with-body --silent --show-error --location --max-time 30 "$url" -o "$out"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          fetch_with_retry "$atlas" "$workdir/atlas.html"
          fetch_with_retry "$sample" "$workdir/sample.html"
          fetch_with_retry "$sitemap" "$workdir/sitemap.xml"

          grep -Fq 'Every major Painted Churches question has somewhere useful to land.' "$workdir/atlas.html"
          grep -Fq '/explore/painted-churches/guides/st-michael-weimar' "$workdir/sitemap.xml"
          grep -Fq 'St. Michael' "$workdir/sample.html"
          echo 'Painted Churches atlas, representative guide, and Explore sitemap are live in production.'
      - name: Report result on PR 148
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY' > /tmp/comment.json
          import json, os
          body = (
            f"Production deployment verification for PR #148: **{os.environ['JOB_STATUS']}** "
            f"on commit `{os.environ['GITHUB_SHA']}`. The one-time deploy workflow built the current main branch, "
            "enforced the existing client bundle budget, deployed `texasdefined-site` with Wrangler, and checked "
            "the Painted Churches search atlas, the St. Michael Weimar guide, and the Explore sitemap."
          )
          print(json.dumps({'body': body}))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/148/comments" \
            --data-binary @/tmp/comment.json
