name: CityPASS dynamic isolation

on:
  push:
    branches:
      - feature/citypass-texas-evergreen

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/citypass-texas-evergreen
          fetch-depth: 0

      - name: Move CityPASS expansion behind async runtime boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s) of {old!r}, found {actual}")
              p.write_text(text.replace(old, new, count))

          preserved = 'src/data/destination-preserved-catalog.ts'
          replace_exact(preserved, 'import { cityPassDestinationExpansion } from "./citypass-destination-expansion";\n', '')
          replace_exact(preserved, '  cityPassDestinationExpansion,\n', '')

          runtime = 'src/data/destination-query-runtime.ts'
          replace_exact(
              runtime,
              'function preservedFor(query: Omit<DestinationQuery, "brandId">): Destination[] {\n  let rows = preservedExploreDestinations;\n',
              'async function loadPreservedExploreDestinations(): Promise<Destination[]> {\n  const { cityPassDestinationExpansion } = await import("./citypass-destination-expansion");\n  return mergeDestinations(preservedExploreDestinations, cityPassDestinationExpansion);\n}\n\nasync function preservedFor(query: Omit<DestinationQuery, "brandId">): Promise<Destination[]> {\n  let rows = await loadPreservedExploreDestinations();\n',
          )
          replace_exact(runtime, '  const preserved = preservedFor(params);\n', '  const preserved = await preservedFor(params);\n')
          replace_exact(
              runtime,
              '  const preserved = preservedExploreDestinations.find((destination) => destination.slug === slug);\n  if (preserved) return applyResolvedHero(preserved);\n',
              '  const preserved = preservedExploreDestinations.find((destination) => destination.slug === slug);\n  if (preserved) return applyResolvedHero(preserved);\n  const cityPassPreserved = (await loadPreservedExploreDestinations()).find((destination) => destination.slug === slug);\n  if (cityPassPreserved) return applyResolvedHero(cityPassPreserved);\n',
          )
          replace_exact(
              runtime,
              '  return reconcileExploreCatalog(mergeDestinations(enriched, core, preservedExploreDestinations));\n',
              '  return reconcileExploreCatalog(mergeDestinations(enriched, core, await loadPreservedExploreDestinations()));\n',
          )

          sitemap = 'src/routes/sitemap-explore[.]xml.ts'
          replace_exact(
              sitemap,
              '        const { landscapeGuideSlugs, landscapeSlugs } = await import("@/data/texas-landscape-slugs");\n',
              '        const { landscapeGuideSlugs, landscapeSlugs } = await import("@/data/texas-landscape-slugs");\n        const { cityPassDestinationExpansion } = await import("@/data/citypass-destination-expansion");\n',
          )
          replace_exact(
              sitemap,
              '        const remoteDestinations = mergeDestinationSources(coreDestinations, enrichedDestinations);\n        const usePreservedFallback = (enrichedFailed && coreFailed) || remoteDestinations.length === 0;\n        const rawDestinations = usePreservedFallback ? preservedExploreDestinations : remoteDestinations;\n        if (!usePreservedFallback) {\n          const remoteSlugs = new Set(rawDestinations.map((destination) => destination.slug));\n          rawDestinations.push(...preservedExploreDestinations.filter((destination) => destination.slug && !remoteSlugs.has(destination.slug)));\n        }\n',
              '        const remoteDestinations = mergeDestinationSources(coreDestinations, enrichedDestinations);\n        const preservedDestinations = mergeDestinationSources(preservedExploreDestinations, cityPassDestinationExpansion);\n        const usePreservedFallback = (enrichedFailed && coreFailed) || remoteDestinations.length === 0;\n        const rawDestinations = usePreservedFallback ? preservedDestinations : remoteDestinations;\n        if (!usePreservedFallback) {\n          const remoteSlugs = new Set(rawDestinations.map((destination) => destination.slug));\n          rawDestinations.push(...preservedDestinations.filter((destination) => destination.slug && !remoteSlugs.has(destination.slug)));\n        }\n',
          )

          validator = 'scripts/data/validate-citypass-affiliate.mjs'
          replace_exact(
              validator,
              "const preserved = read('src/data/destination-preserved-catalog.ts');\n",
              "const preserved = read('src/data/destination-preserved-catalog.ts');\nconst destinationRuntime = read('src/data/destination-query-runtime.ts');\nconst exploreSitemap = read('src/routes/sitemap-explore[.]xml.ts');\n",
          )
          replace_exact(
              validator,
              "requireText(preserved, 'import { cityPassDestinationExpansion } from \"./citypass-destination-expansion\";', 'Preserved catalog import');\nrequireText(preserved, 'cityPassDestinationExpansion,', 'Preserved catalog registration');\n",
              "if (preserved.includes('citypass-destination-expansion')) errors.push('CityPASS destination expansion must not be statically imported by the global preserved catalog.');\nrequireText(destinationRuntime, 'await import(\"./citypass-destination-expansion\")', 'Async CityPASS destination runtime load');\nrequireText(destinationRuntime, 'await loadPreservedExploreDestinations()', 'Async CityPASS preserved catalog merge');\nrequireText(exploreSitemap, 'await import(\"@/data/citypass-destination-expansion\")', 'Async CityPASS sitemap load');\nrequireText(exploreSitemap, 'mergeDestinationSources(preservedExploreDestinations, cityPassDestinationExpansion)', 'CityPASS sitemap preserved merge');\n",
          )
          replace_exact(
              validator,
              'eight previously missing destination guides are published through the preserved catalog;',
              'eight previously missing destination guides are published through the async preserved runtime;',
          )
          PY

          rm .github/workflows/citypass-dynamic-isolation.yml

      - name: Commit isolation fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/data/validate-citypass-affiliate.mjs src/data/destination-preserved-catalog.ts src/data/destination-query-runtime.ts 'src/routes/sitemap-explore[.]xml.ts' .github/workflows/citypass-dynamic-isolation.yml
          git commit -m "perf: isolate CityPASS expansion from main client bundle"
          git push origin HEAD:feature/citypass-texas-evergreen
