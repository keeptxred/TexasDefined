name: Verify temporal event production

on:
  pull_request:
    paths:
      - 'scripts/ci/verify-event-temporal-production.mjs'
      - '.github/workflows/verify-event-temporal-production.yml'
      - 'src/data/event-temporal-collections.server.ts'
      - 'src/data/texas-this-weekend.server.ts'
      - 'src/data/event-collection-page.server.ts'
      - 'src/routes/events.$collection.tsx'
  workflow_run:
    workflows:
      - 'Deploy TexasDefined production'
    types:
      - completed
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-event-temporal-production
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check temporal Event verifier
        run: node --check scripts/ci/verify-event-temporal-production.mjs

      - name: Verify temporal Event production surfaces
        env:
          PRODUCTION_ORIGIN: https://texasdefined.com
        run: node scripts/ci/verify-event-temporal-production.mjs
