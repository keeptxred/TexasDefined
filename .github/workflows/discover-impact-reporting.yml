name: Discover read-only Impact reporting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-impact-reporting.yml'
      - 'scripts/monetization/impact-reporting-discovery.mjs'
      - 'scripts/monetization/impact-reporting-discovery.test.mjs'
  schedule:
    - cron: '41 12 * * *'

permissions:
  contents: read

concurrency:
  group: impact-reporting-discovery
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Impact discovery read-only and sanitization rules
        run: node --test scripts/monetization/impact-reporting-discovery.test.mjs
      - name: Discover available reporting schemas (never log transactions)
        env:
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
        run: node scripts/monetization/impact-reporting-discovery.mjs
