name: Validate Texas gateway consolidation

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/data/fixtures/texas-gateway-*.ts"
      - "src/data/fixtures/lazy-texas-gateway.ts"
      - "src/data/fixtures/lazy-texas-core-articles.ts"
      - "src/data/fixtures/repositories.ts"
      - "src/components/editorial/ExploreIntentPaths.tsx"
      - "src/routes/article.$slug.tsx"
      - "src/routes/sitemap[.]xml.ts"
      - "src/routes/texas-facts.tsx"
      - "src/routes/texas-vs-every-state.tsx"
      - "src/routes/texas-vs.$state.tsx"
      - "scripts/data/validate-indexation-quality.mjs"
      - "scripts/data/validate-texas-gateway-consolidation.mjs"
      - "scripts/data/validate-texas-gateway-index-readiness.mjs"
      - "scripts/data/audit-texas-gateway-depth.mjs"
      - ".github/workflows/validate-texas-gateway-consolidation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate gateway integrity and lazy discovery
        run: node scripts/data/validate-texas-gateway-consolidation.mjs

      - name: Validate gateway index-readiness staging
        run: node scripts/data/validate-texas-gateway-index-readiness.mjs

      - name: Validate shared indexation contract
        run: node scripts/data/validate-indexation-quality.mjs

      - name: Audit gateway article depth
        run: node scripts/data/audit-texas-gateway-depth.mjs

      - name: Build production application
        run: npm run build
