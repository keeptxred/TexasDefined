name: Validate Texas gateway consolidation

on:
  pull_request:
    paths:
      - "src/data/fixtures/texas-gateway-*.ts"
      - "src/data/fixtures/lazy-texas-gateway.ts"
      - "src/data/fixtures/lazy-texas-core-articles.ts"
      - "src/data/fixtures/repositories.ts"
      - "scripts/data/validate-texas-gateway-consolidation.mjs"
      - ".github/workflows/validate-texas-gateway-consolidation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate gateway integrity and lazy discovery
        run: node scripts/data/validate-texas-gateway-consolidation.mjs
