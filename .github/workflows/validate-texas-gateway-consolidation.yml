name: Validate Texas gateway consolidation

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate gateway integrity and lazy discovery
        run: node scripts/data/validate-texas-gateway-consolidation.mjs

      - name: Validate gateway index-readiness staging
        run: node scripts/data/validate-texas-gateway-index-readiness.mjs

      - name: Validate shared indexation contract
        run: node scripts/data/validate-indexation-quality.mjs

      - name: Audit gateway article depth
        run: node scripts/data/audit-texas-gateway-depth.mjs

      - name: Build production application
        run: npm run build
