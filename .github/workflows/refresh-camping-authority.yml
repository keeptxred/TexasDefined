name: Texas camping TPWD and NPS official park advisory refresh
on:
  schedule:
    - cron: '19 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: texasdefined-camping-official-source-refresh
  cancel-in-progress: false

jobs:
  official-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh only supported official TPWD and NPS notices
        id: refresh
        continue-on-error: true
        run: node scripts/data/refresh-camping-alerts.mjs --write
      - name: Validate camping guide contract
        run: |
          node --check scripts/data/refresh-camping-alerts.mjs
          node scripts/data/validate-camping-guide-decision-ux.mjs
          node scripts/data/validate-camping-authority-upgrade.mjs
      - name: Create guarded generated-data update PR
        id: update-pr
        if: steps.refresh.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/camping-official-alert-refresh
          delete-branch: true
          commit-message: 'data(camping): refresh verified TPWD operational notices'
          title: 'Camping: refresh official park operational notices'
          body: |
            Generated from official TPWD and NPS park advisories. Confirmed statements must match source text; changed statements become needs-review and are never automatically declared resolved.
            This PR changes only the bounded camping alert snapshot on substantive source-verified changes. The verification date is not restamped on no-op checks.
          add-paths: src/data/camping/official-alerts.generated.ts
      - name: Enable protected automatic merge of fully verified notices
        if: steps.refresh.outcome == 'success' && steps.update-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.update-pr.outputs.pull-request-number }}" --auto --squash
      - name: Close resolved advisory review issue
        if: steps.refresh.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Camping authority: official park advisory needs verification';
            const {data: issues} = await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const issue = issues.find(x => x.title === title && !x.pull_request);
            if (issue) {
              await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,body:'All monitored advisory statements confirmed by official park sources in this run; automated issue reconciliation only, not a blanket campground research refresh.'});
              await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,state:'closed'});
            }
      - name: Flag ambiguous source changes or unreachable source
        if: steps.refresh.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Camping authority: official park advisory needs verification';
            const body = 'Weekly TPWD/NPS park-advisory refresh failed or found an advisory it could not confirm verbatim. Review the workflow logs and the official TPWD pages. Never infer an alert was lifted. Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const {data: issues} = await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'open',per_page:100});
            const issue = issues.find(x => x.title === title && !x.pull_request);
            if (issue) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:issue.number,body});
            else await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
      - name: Report degraded source confidence
        if: steps.refresh.outcome != 'success'
        run: exit 1
