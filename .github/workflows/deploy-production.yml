name: Deploy TexasDefined production

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'scripts/data/validate-painted-church*.mjs'
      - 'scripts/data/validate-texas-flag-authority.mjs'
      - 'scripts/seo/submit-indexnow.mjs'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: texasdefined-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish pending production status
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"texasdefined-production","description":"Validating, building and deploying TexasDefined"}' >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish validation pending
        if: success()
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"texasdefined-validation","description":"Running pre-deploy authority validators"}' >/dev/null
      - name: Validate production authority
        id: validation
        run: |
          node scripts/data/validate-machine-indexing.mjs
          node scripts/data/validate-things-unique-to-texas.mjs
          node scripts/data/validate-texas-icon-link-depth.mjs
          node scripts/data/validate-texas-weather-authority.mjs
          node scripts/data/validate-texas-food-history.mjs
          node scripts/data/validate-texas-culture-citation-index.mjs
          node scripts/data/validate-texas-flag-authority.mjs
          node scripts/data/validate-painted-churches-seo.mjs
          node scripts/data/validate-painted-church-search-intents.mjs
          node scripts/data/validate-painted-church-map.mjs
          node scripts/data/validate-painted-church-completion.mjs
      - name: Publish validation success
        if: ${{ steps.validation.outcome == 'success' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"texasdefined-validation","description":"Pre-deploy authority validation passed"}' >/dev/null
      - name: Publish validation failure
        if: ${{ failure() && steps.validation.outcome == 'failure' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"texasdefined-validation","description":"Pre-deploy authority validation failed"}' >/dev/null

      - name: Publish build pending
        if: success()
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"texasdefined-build","description":"Building the production bundle"}' >/dev/null
      - name: Build production bundle
        id: build
        run: npm run build
      - name: Publish build success
        if: ${{ steps.build.outcome == 'success' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"texasdefined-build","description":"Production bundle build passed"}' >/dev/null
      - name: Publish build failure
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"texasdefined-build","description":"Production bundle build failed"}' >/dev/null

      - name: Publish bundle budget pending
        if: success()
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"texasdefined-bundle-budget","description":"Checking client bundle size budget"}' >/dev/null
      - name: Enforce client bundle budget
        id: budget
        run: npm run performance:validate
      - name: Publish bundle budget success
        if: ${{ steps.budget.outcome == 'success' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"texasdefined-bundle-budget","description":"Client bundle budget passed"}' >/dev/null
      - name: Publish bundle budget failure
        if: ${{ failure() && steps.budget.outcome == 'failure' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"texasdefined-bundle-budget","description":"Client bundle budget failed"}' >/dev/null

      - name: Publish Cloudflare deploy pending
        if: success()
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"texasdefined-cloudflare","description":"Deploying TexasDefined Worker"}' >/dev/null
      - name: Deploy TexasDefined Worker
        id: cloudflare
        run: npx wrangler deploy
      - name: Publish Cloudflare deploy success
        if: ${{ steps.cloudflare.outcome == 'success' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"texasdefined-cloudflare","description":"Cloudflare Worker deployment passed"}' >/dev/null
      - name: Publish Cloudflare deploy failure
        if: ${{ failure() && steps.cloudflare.outcome == 'failure' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"texasdefined-cloudflare","description":"Cloudflare Worker deployment failed"}' >/dev/null

      - name: Publish live verification pending
        if: success()
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"texasdefined-live","description":"Verifying production surfaces"}' >/dev/null
      - name: Verify production surfaces
        id: live
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          fetch_assert() {
            local label="$1" path="$2" needle="$3"
            local out="$workdir/${label}.html"
            local attempt
            for attempt in 1 2 3 4 5 6; do
              echo "[$label] attempt $attempt: ${origin}${path}"
              if curl --fail-with-body --silent --show-error --location --max-time 30 \
                "${origin}${path}?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" -o "$out"; then
                if grep -Fq "$needle" "$out"; then
                  echo "[$label] production content verified: $needle"
                  return 0
                fi
                echo "[$label] fetched successfully but expected content is not live yet: $needle"
              fi
              sleep 5
            done
            echo "[$label] production verification failed for ${origin}${path}" >&2
            head -c 1200 "$out" 2>/dev/null || true
            echo >&2
            return 1
          }

          fetch_assert homepage '/' 'Texas Defined'
          fetch_assert moving-pillar '/article/moving-to-texas-what-nobody-tells-you' 'The quick answer: what should you know before moving to Texas?'
          fetch_assert flag-history '/article/history-of-the-texas-flag' 'The Texas Flag: A History of the Lone Star'
          fetch_assert flag-etiquette '/article/texas-flag-etiquette-display-guide' 'Texas Flag Etiquette: How to Display the Lone Star Flag Correctly'
          fetch_assert texas-symbols '/texas-symbols' "Texas's best-known symbol has a Republic-era story of its own."
          fetch_assert painted-churches '/explore/painted-churches' 'Painted Churches of Texas'
          fetch_assert then-and-now '/explore/painted-churches/then-and-now' 'Texas Painted Churches, then and now.'
          fetch_assert media '/explore/painted-churches/media' 'Watch the documentary. Follow the voices behind it.'
          fetch_assert guidebook '/guides' 'Painted Churches of Texas'
          fetch_assert historic-sites '/explore/historic-sites' 'Painted Churches of Texas'
          fetch_assert road-trips '/explore/road-trips' 'Painted Churches routes'
          fetch_assert small-towns '/explore/small-towns' 'Painted Churches'

          echo 'TexasDefined production, moving-to-Texas pillar, Texas flag cluster and Painted Churches authority/discovery surfaces are live.'
      - name: Publish live verification success
        if: ${{ steps.live.outcome == 'success' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"texasdefined-live","description":"Production surface verification passed"}' >/dev/null
      - name: Publish live verification failure
        if: ${{ failure() && steps.live.outcome == 'failure' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"texasdefined-live","description":"Production surface verification failed"}' >/dev/null

      - name: Publish IndexNow pending
        if: success()
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"texasdefined-indexnow","description":"Submitting verified canonical URLs to IndexNow"}' >/dev/null
      - name: Notify IndexNow after verified deployment
        id: indexnow
        run: node scripts/seo/submit-indexnow.mjs
      - name: Publish IndexNow success
        if: ${{ steps.indexnow.outcome == 'success' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"texasdefined-indexnow","description":"IndexNow submission passed"}' >/dev/null
      - name: Publish IndexNow failure
        if: ${{ failure() && steps.indexnow.outcome == 'failure' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"texasdefined-indexnow","description":"IndexNow submission failed"}' >/dev/null

      - name: Publish successful production status
        if: success()
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"texasdefined-production","description":"Production deploy and live verification passed"}' >/dev/null
      - name: Publish failed production status
        if: failure()
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"texasdefined-production","description":"Production deploy or live verification failed"}' >/dev/null
