name: Deploy TexasDefined production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: write
  statuses: write

concurrency:
  group: texasdefined-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEPLOY_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN != '' }}
      CLOUDFLARE_CACHE_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_CACHE_API_TOKEN != '' }}
      GH_TOKEN: ${{ github.token }}
      PUBLIC_INDEXING_ENABLED: ${{ vars.PUBLIC_INDEXING_ENABLED }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Publish pending production status
        run: node scripts/ci/publish-github-status.mjs texasdefined-production pending "Validating, building and deploying TexasDefined"

      - name: Validate retired integration traces
        run: node scripts/ci/validate-retired-integration-traces.mjs

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Plan change-scoped production verification
        id: change_scope
        run: node scripts/ci/production-change-scope.mjs

      - name: Preserve production change plan
        uses: actions/upload-artifact@v4
        with:
          name: production-change-plan-${{ github.run_id }}
          path: .artifacts/production-change-plan.json
          if-no-files-found: error
          retention-days: 7

      - name: Install governed image build dependency
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # Discover materialization handles governed local SVG editorial assets as well
          # as raster images. ImageMagick's SVG delegate uses rsvg-convert; a runner
          # with convert already installed is not necessarily SVG-capable.
          if (command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1) && command -v rsvg-convert >/dev/null 2>&1; then
            exit 0
          fi
          # Ubuntu 24.04 GitHub runner images can ship a broken third-party
          # Microsoft apt source. This job only needs Ubuntu-packaged ImageMagick
          # and librsvg: update from the runner's signed official Ubuntu sources,
          # not unrelated vendor repositories that can return HTTP 404.
          # Fail closed when the Ubuntu official source is absent; never skip
          # image materialization, attribution or dimension checks.
          if [[ ! -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            echo "::error title=Official Ubuntu apt source missing::Cannot safely install governed image dependencies."
            exit 1
          fi
          timeout 180s sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          timeout 180s sudo apt-get install -y --no-install-recommends imagemagick librsvg2-bin
          (command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1)
          command -v rsvg-convert >/dev/null 2>&1

      - name: Report Cloudflare deployment credential source
        shell: bash
        run: |
          if [[ "$CLOUDFLARE_DEPLOY_TOKEN_PRESENT" == 'true' ]]; then
            echo 'Production deployment will use CLOUDFLARE_DEPLOY_API_TOKEN.'
          else
            echo '::warning title=Dedicated Cloudflare deploy token unavailable::Production deployment is falling back to CLOUDFLARE_API_TOKEN. If that token lacks Workers Scripts write access, deployment will fail closed.'
          fi

      - name: Publish validation pending
        if: success()
        run: node scripts/ci/publish-github-status.mjs texasdefined-validation pending "Running pre-deploy authority validators"

      - name: Validate authority before deploy
        id: validation
        run: |
          node scripts/ci/run-validation-suite.mjs predeploy
          node scripts/data/validate-national-cemetery-authority.mjs

      - name: Publish validation result
        if: always()
        env:
          STAGE_OUTCOME: ${{ steps.validation.outcome }}
        run: node scripts/ci/publish-github-status.mjs texasdefined-validation "$STAGE_OUTCOME" "Pre-deploy authority validation passed" "Pre-deploy authority validation failed"

      - name: Publish build pending
        if: success()
        run: node scripts/ci/publish-github-status.mjs texasdefined-build pending "Building the production bundle"

      - name: Fingerprint governed Discover source registry
        id: discover_fingerprint
        run: echo "sha=$(node scripts/assets/materialize-discover-overrides.mjs --fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore previously materialized governed Discover derivatives
        if: success()
        shell: bash
        run: |
          # GitHub's repository-wide artifact response can be very large and has
          # failed with truncated JSON. Search recent production runs instead.
          # Only reuse artifacts with the exact source-URL/slug and WebP transform contract checksum.
          set -uo pipefail
          mkdir -p public/images/discover
          source_fingerprint="$(node scripts/assets/materialize-discover-overrides.mjs --fingerprint)"
          artifact_prefix="governed-discover-derivatives-${source_fingerprint}-"
          cache_dir="$(mktemp -d)"
          trap 'rm -rf "$cache_dir"' EXIT

          runs_json=""
          for attempt in 1 2 3; do
            if runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-production.yml/runs?per_page=12" 2>"$cache_dir/runs.err")" &&
               jq -e '.workflow_runs | type == "array"' >/dev/null 2>&1 <<<"$runs_json"; then
              break
            fi
            runs_json=""
            sleep "$attempt"
          done

          if [[ -z "$runs_json" ]]; then
            echo "::warning title=Discover cache lookup unavailable::Could not list recent production runs; governed source materialization still fails closed."
            head -c 400 "$cache_dir/runs.err" >&2 || true
            exit 0
          fi

          restored_artifacts=0
          # Recent first: preserve the freshest verified artifact's copy of each
          # filename; older matching artifacts can supply additional files.
          while IFS= read -r prior_run; do
            [[ "$prior_run" =~ ^[0-9]+$ ]] || continue
            [[ "$prior_run" == "$GITHUB_RUN_ID" ]] && continue

            artifact_json=""
            for attempt in 1 2; do
              if artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$prior_run/artifacts?per_page=10" 2>"$cache_dir/artifacts.err")" &&
                 jq -e '.artifacts | type == "array"' >/dev/null 2>&1 <<<"$artifact_json"; then
                break
              fi
              artifact_json=""
              sleep "$attempt"
            done
            [[ -n "$artifact_json" ]] || continue

            while IFS= read -r artifact_id; do
              [[ "$artifact_id" =~ ^[0-9]+$ ]] || continue
              archive="$cache_dir/$artifact_id.zip"
              if ! curl --fail --silent --show-error --location --retry 2 --retry-all-errors --connect-timeout 15 --max-time 100 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
                -o "$archive"; then
                echo "::warning title=Discover cache artifact unavailable::Could not download matching prior artifact $artifact_id."
                continue
              fi
              if ! unzip -tqq "$archive" >/dev/null 2>&1; then
                echo "::warning title=Discover cache artifact invalid::Matching artifact $artifact_id is not a valid ZIP."
                continue
              fi
              # The governed materializer validates each restored 1600x900
              # derivative and refuses missing/invalid assets, unchanged.
              unzip -j -n "$archive" '*.webp' -d public/images/discover >/dev/null || true
              restored_artifacts=$((restored_artifacts + 1))
            done < <(jq -r --arg prefix "$artifact_prefix"               '.artifacts[] | select(.expired == false and (.name | startswith($prefix))) | .id' <<<"$artifact_json")
            [[ "$restored_artifacts" -ge 8 ]] && break
          done < <(jq -r '.workflow_runs[].id' <<<"$runs_json")

          restored_count="$(find public/images/discover -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')"
          echo "Restored $restored_count governed Discover derivatives from $restored_artifacts matching prior production artifact(s)."
      - name: Build production bundle
        id: build
        shell: bash
        run: |
          # Some governed local image sources are generated by npm prebuild.
          # Generate them before Discover materialization so a cold cache can
          # rebuild every derivative without depending on a prior artifact.
          npm run prebuild
          node scripts/assets/materialize-discover-overrides.mjs
          npm run build
          mkdir -p dist/client/images/discover
          cp -f public/images/discover/*.webp dist/client/images/discover/
          discover_asset_count="$(find dist/client/images/discover -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')"
          if [[ "$discover_asset_count" -lt 42 ]]; then
            echo "::error title=Governed Discover assets missing from client bundle::Expected at least 42 governed Discover derivatives in dist/client/images/discover; found $discover_asset_count."
            exit 1
          fi
          # Counting images is insufficient: a missing required slug can be hidden
          # by an unrelated extra WebP. Verify every governed source and output.
          while IFS= read -r slug; do
            file="dist/client/images/discover/${slug}.webp"
            if [[ ! -f "$file" ]]; then
              echo "::error title=Required Discover asset absent::Missing $file from deployment bundle."
              exit 1
            fi
            FILE_TO_VERIFY="$file" node --input-type=module -e '
              import { openSync, readSync, closeSync } from "node:fs";
              const fd = openSync(process.env.FILE_TO_VERIFY, "r");
              const header = Buffer.alloc(12);
              try { if (readSync(fd, header, 0, 12, 0) !== 12 || header.toString("ascii",0,4) !== "RIFF" || header.toString("ascii",8,12) !== "WEBP") process.exit(1); }
              finally { closeSync(fd); }
            ' || { echo "::error title=Invalid Discover image::Not a WebP binary: $file"; exit 1; }
          done < <(node scripts/assets/materialize-discover-overrides.mjs --list-slugs)
          echo "Verified $discover_asset_count governed Discover derivatives in dist/client static assets."
          if ! git diff --exit-code -- src/routeTree.gen.ts; then
            echo '::error title=Generated route tree is stale::The production build changed src/routeTree.gen.ts. Commit the TanStack-generated route tree before deployment.'
            exit 1
          fi

      - name: Publish build result
        if: always()
        env:
          STAGE_OUTCOME: ${{ steps.build.outcome }}
        run: node scripts/ci/publish-github-status.mjs texasdefined-build "$STAGE_OUTCOME" "Production bundle build passed" "Production bundle build failed"

      - name: Capture governed Discover derivatives after failed build
        if: ${{ always() && steps.build.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: governed-discover-derivatives-${{ steps.discover_fingerprint.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/images/discover/*.webp
          if-no-files-found: error
          retention-days: 1

      - name: Preserve verified governed Discover derivatives for the next build
        if: ${{ success() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: governed-discover-derivatives-${{ steps.discover_fingerprint.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/images/discover/*.webp
          if-no-files-found: error
          retention-days: 1

      - name: Publish bundle budget pending
        if: success()
        run: node scripts/ci/publish-github-status.mjs texasdefined-bundle-budget pending "Checking client bundle size budget"

      - name: Check client bundle budget
        id: budget
        run: npm run performance:validate

      - name: Publish bundle budget result
        if: always()
        env:
          STAGE_OUTCOME: ${{ steps.budget.outcome }}
        run: node scripts/ci/publish-github-status.mjs texasdefined-bundle-budget "$STAGE_OUTCOME" "Client bundle budget passed" "Client bundle budget exceeded"

      - name: Publish built Worker SSR smoke pending
        if: success()
        run: node scripts/ci/publish-github-status.mjs texasdefined-runtime-smoke pending "Smoke-testing built Worker SSR before deploy"

      - name: Smoke-test built Worker SSR locally
        id: runtime_smoke
        if: success()
        run: node scripts/ci/verify-built-worker-ssr.mjs

      - name: Publish built Worker SSR smoke result
        if: always()
        env:
          STAGE_OUTCOME: ${{ steps.runtime_smoke.outcome }}
        run: node scripts/ci/publish-github-status.mjs texasdefined-runtime-smoke "$STAGE_OUTCOME" "Built Worker SSR smoke passed" "Built Worker SSR smoke failed before deploy"

      - name: Publish current production health pending
        if: success()
        run: node scripts/ci/publish-github-status.mjs texasdefined-predeploy-health pending "Verifying current production before replacement"

      - name: Verify current direct Worker before deploy
        id: predeploy_direct_health
        if: success()
        continue-on-error: true
        env:
          PRODUCTION_HEALTH_ORIGIN: https://texasdefined-site.freddy-coppola.workers.dev
          PRODUCTION_HEALTH_LABEL: predeploy-current-direct-worker
        run: node scripts/ci/verify-production-health.mjs

      - name: Verify current canonical domain before deploy
        id: predeploy_canonical_health
        if: ${{ always() && steps.runtime_smoke.outcome == 'success' }}
        continue-on-error: true
        env:
          PRODUCTION_HEALTH_ORIGIN: https://texasdefined.com
          PRODUCTION_HEALTH_LABEL: predeploy-current-canonical-domain
        run: node scripts/ci/verify-production-health.mjs

      - name: Capture unhealthy current-production diagnostics
        id: predeploy_diagnostics
        if: ${{ always() && steps.runtime_smoke.outcome == 'success' && (steps.predeploy_direct_health.outcome == 'failure' || steps.predeploy_canonical_health.outcome == 'failure') }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts
          npx wrangler deployments status --json > artifacts/predeploy-current-deployment-status.json 2> artifacts/predeploy-current-deployment-status.stderr || true
          npx wrangler versions list --json > artifacts/predeploy-current-versions.json 2> artifacts/predeploy-current-versions.stderr || true
          timeout 25s npx wrangler tail texasdefined-site --format json --status error > artifacts/predeploy-current-worker-tail.jsonl 2> artifacts/predeploy-current-worker-tail.stderr &
          TAIL_PID=$!
          sleep 4
          curl -sS --max-time 15 -D artifacts/predeploy-current-direct.headers -o artifacts/predeploy-current-direct.html "https://texasdefined-site.freddy-coppola.workers.dev/?predeploy_probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" || true
          curl -sS --max-time 15 -D artifacts/predeploy-current-canonical.headers -o artifacts/predeploy-current-canonical.html "https://texasdefined.com/?predeploy_probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" || true
          wait "${TAIL_PID}" || true

      - name: Upload unhealthy current-production diagnostics
        if: ${{ always() && (steps.predeploy_direct_health.outcome == 'failure' || steps.predeploy_canonical_health.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: predeploy-current-production-${{ github.run_id }}
          path: artifacts/predeploy-current-*
          if-no-files-found: error
          retention-days: 14

      - name: Enforce current-production health gate
        id: predeploy_health
        if: ${{ always() && steps.runtime_smoke.outcome == 'success' }}
        shell: bash
        env:
          DIRECT_OUTCOME: ${{ steps.predeploy_direct_health.outcome }}
          CANONICAL_OUTCOME: ${{ steps.predeploy_canonical_health.outcome }}
        run: |
          if [[ "${DIRECT_OUTCOME}" != 'success' || "${CANONICAL_OUTCOME}" != 'success' ]]; then
            echo "::error title=Current production is unhealthy; deploy blocked::direct=${DIRECT_OUTCOME:-not-run}, canonical=${CANONICAL_OUTCOME:-not-run}. No Worker replacement was attempted."
            exit 1
          fi
          echo 'Current direct Worker and canonical domain are healthy; replacement may proceed.'

      - name: Publish current production health result
        if: always()
        env:
          STAGE_OUTCOME: ${{ steps.predeploy_health.outcome }}
        run: node scripts/ci/publish-github-status.mjs texasdefined-predeploy-health "$STAGE_OUTCOME" "Current production is healthy; deploy may proceed" "Current production health failed; deploy blocked"

      - name: Wait for Cloudflare Git build to settle
        id: cloudflare_git_build
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/wait-for-cloudflare-git-build.mjs

      - name: Capture active Worker rollback target
        id: rollback_target
        if: success()
        run: node scripts/ci/capture-active-worker-version.mjs

      - name: Publish Cloudflare deploy pending
        if: success()
        run: node scripts/ci/publish-github-status.mjs texasdefined-cloudflare pending "Deploying TexasDefined Worker"

      - name: Deploy TexasDefined Worker
        id: cloudflare
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ftkznprjljkhymknvhye.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo '::error title=Missing Supabase Worker credentials::SUPABASE_URL and a service-role repository secret are required for protected server-side intelligence writes.'
            exit 1
          fi
          mkdir -p .artifacts
          trap 'rm -f .artifacts/texasdefined-worker-secrets.json' EXIT
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const payload = {
            SUPABASE_URL: process.env.SUPABASE_URL,
            SUPABASE_SERVICE_ROLE_KEY: process.env.SUPABASE_SERVICE_ROLE_KEY,
          };
          writeFileSync('.artifacts/texasdefined-worker-secrets.json', JSON.stringify(payload), { mode: 0o600 });
          NODE
          npx wrangler deploy --secrets-file .artifacts/texasdefined-worker-secrets.json

      - name: Publish Cloudflare deploy result
        if: always()
        env:
          STAGE_OUTCOME: ${{ steps.cloudflare.outcome }}
        run: node scripts/ci/publish-github-status.mjs texasdefined-cloudflare "$STAGE_OUTCOME" "Cloudflare Worker deployment passed" "Cloudflare Worker deployment failed"

      - name: Capture deployed Worker version
        id: deployed_worker_version
        if: ${{ always() && steps.cloudflare.outcome == 'success' }}
        run: node scripts/ci/capture-active-worker-version.mjs

      - name: Report targeted cache-purge capability
        if: ${{ always() && steps.cloudflare.outcome == 'success' }}
        shell: bash
        run: |
          if [[ "$CLOUDFLARE_CACHE_TOKEN_PRESENT" == 'true' ]]; then
            echo 'Dedicated CLOUDFLARE_CACHE_API_TOKEN is available; targeted authority cache purge will run.'
          else
            echo '::warning title=Dedicated Cloudflare cache-purge token unavailable::Targeted cache purge is skipped because deploy/general tokens are not assumed to have Cache Purge permission. Cache-busted live verification will still enforce production freshness.'
          fi

      - name: Purge updated authority HTML from Cloudflare cache
        id: cache_purge
        if: ${{ always() && steps.cloudflare.outcome == 'success' && env.CLOUDFLARE_CACHE_TOKEN_PRESENT == 'true' }}
        continue-on-error: true
        env:
          CLOUDFLARE_CACHE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_API_TOKEN }}
          CLOUDFLARE_ZONE_NAME: texasdefined.com
          CLOUDFLARE_PURGE_METRO_PROXIMITY: 'true'
          CLOUDFLARE_PURGE_URLS: |
            https://texasdefined.com/destination/moody-gardens
            https://texasdefined.com/sports-venue/msr-houston
            https://texasdefined.com/sports-venues/motorsports
            https://texasdefined.com/texas-state-fair
            https://texasdefined.com/event/crossroads-of-texas-country-festival
            https://texasdefined.com/county/ellis
            https://texasdefined.com/article/ellis-county-waxahachie-ennis-blackland-prairie-texas
            https://texasdefined.com/explore/painted-churches
            https://texasdefined.com/destination/young-county-museum-of-history-and-culture
            https://texasdefined.com/destination/old-post-office-museum-art-center-graham
            https://texasdefined.com/explore/museums
            https://texasdefined.com/county/young
            https://texasdefined.com/destination/graham
            https://texasdefined.com/destination/ysleta-del-sur-pueblo-cultural-center-museum-el-paso
            https://texasdefined.com/city/el-paso
            https://texasdefined.com/county/el-paso
            https://texasdefined.com/article/el-paso-county-missions-rio-grande-texas
            https://texasdefined.com/article/texas-borderlands-historic-sites-guide
            https://texasdefined.com/texas-sacred-places
            https://texasdefined.com/moving-to-texas
            https://texasdefined.com/moving-to-texas-checklist
            https://texasdefined.com/article/best-houston-suburbs-for-commuters
            https://texasdefined.com/article/best-dallas-suburbs-for-commuters
            https://texasdefined.com/article/east-texas-fall-colors
            https://texasdefined.com/article/texas-property-taxes-for-new-residents
            https://texasdefined.com/article/corporate-relocation-to-texas
            https://texasdefined.com/article/employee-relocation-guide-to-texas
            https://texasdefined.com/sitemap.xml
        run: node scripts/ci/purge-cloudflare-cache.mjs

      - name: Publish live verification pending
        if: ${{ always() && steps.cloudflare.outcome == 'success' }}
        run: node scripts/ci/publish-github-status.mjs texasdefined-live pending "Verifying blocking production runtime health and advisory quality checks"

      - name: Verify direct Worker health
        id: live_direct_health
        if: ${{ always() && steps.cloudflare.outcome == 'success' }}
        env:
          PRODUCTION_HEALTH_ORIGIN: https://texasdefined-site.freddy-coppola.workers.dev
          PRODUCTION_HEALTH_LABEL: direct-worker
          PRODUCTION_HEALTH_DISCOVER_ASSETS: ${{ steps.change_scope.outputs.images }}
        run: node scripts/ci/verify-production-health.mjs

      - name: Capture unhealthy Worker runtime diagnostics
        id: live_direct_diagnostics
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts
          npx wrangler deployments status --json > artifacts/unhealthy-worker-deployment-status.json 2> artifacts/unhealthy-worker-deployment-status.stderr || true
          npx wrangler versions list --json > artifacts/unhealthy-worker-versions.json 2> artifacts/unhealthy-worker-versions.stderr || true
          timeout 25s npx wrangler tail texasdefined-site --format json --status error > artifacts/unhealthy-worker-tail.jsonl 2> artifacts/unhealthy-worker-tail.stderr &
          TAIL_PID=$!
          sleep 4
          curl -sS --max-time 15 -D artifacts/unhealthy-worker-homepage.headers -o artifacts/unhealthy-worker-homepage.html "https://texasdefined-site.freddy-coppola.workers.dev/?incident_probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" || true
          wait "${TAIL_PID}" || true

      - name: Upload unhealthy Worker runtime diagnostics
        if: ${{ always() && steps.live_direct_health.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: unhealthy-worker-${{ github.run_id }}
          path: artifacts/unhealthy-worker-*
          if-no-files-found: error
          retention-days: 14

      - name: Roll back unhealthy Worker deployment
        id: rollback
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'failure' }}
        shell: bash
        run: |
          npx wrangler rollback "${{ steps.rollback_target.outputs.version_id }}" --message "Automatic rollback: direct Worker health failed after deploy ${GITHUB_SHA}"

      - name: Verify rollback restored direct Worker health
        id: rollback_health
        if: ${{ always() && steps.rollback.outcome == 'success' }}
        continue-on-error: true
        env:
          PRODUCTION_HEALTH_ORIGIN: https://texasdefined-site.freddy-coppola.workers.dev
          PRODUCTION_HEALTH_LABEL: rollback-direct-worker
        run: node scripts/ci/verify-production-health.mjs

      - name: Verify canonical production health
        id: live_canonical_health
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'success' }}
        env:
          PRODUCTION_HEALTH_ORIGIN: https://texasdefined.com
          PRODUCTION_HEALTH_LABEL: canonical-domain
          PRODUCTION_HEALTH_DISCOVER_ASSETS: ${{ steps.change_scope.outputs.images }}
        run: node scripts/ci/verify-production-health.mjs

      # The homepage health probe does not certify Chamizal, the complete federal
      # directory, or the Palo Alto photograph. Every production deploy must run
      # exact page checks; otherwise unrelated commits can silently serve stale HTML.
      - name: Verify NPS directory, Chamizal and Palo Alto production authority
        id: live_nps_authority
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'success' && steps.live_canonical_health.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production/verify-nps-park-production.mjs

      - name: Preserve NPS live acceptance evidence
        if: ${{ always() && steps.live_nps_authority.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: nps-park-live-acceptance-${{ github.run_id }}
          path: .artifacts/nps-park-live-acceptance.json
          if-no-files-found: ignore
          retention-days: 14

      # Six selected TPWD pages, never an unbounded 84-site scan.
      - name: Verify changed state park visitor facts on production
        id: live_park_six
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'success' && steps.live_canonical_health.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(scripts/production/verify-six-park-authority-production\.mjs|src/data/(state-park-authority\.ts|.*park.*authorit.*\.ts)|\.github/workflows/deploy-production\.yml)$'; then
            node scripts/production/verify-six-park-authority-production.mjs
          else
            echo "Six TPWD canary pages unchanged; scoped probe skipped."
          fi

      - name: Save six park authority live evidence
        if: ${{ always() && steps.live_park_six.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: six-park-authority-live-${{ github.run_id }}
          path: .artifacts/six-park-authority-production.json
          if-no-files-found: ignore
          retention-days: 14

      # Six specifically updated public state-park guides, not a sitewide crawl.
      - name: Verify six TPWD park detail pages and image bytes
        id: live_six_tpwd
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'success' && steps.live_canonical_health.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(scripts/production/verify-tpwd-six-park-details\.mjs|src/data/tpwd-six-later-park-authorities\.ts|src/data/state-park-authority\.ts|src/data/destination-curation-all\.ts|\.github/workflows/deploy-production\.yml)$'; then
            node scripts/production/verify-tpwd-six-park-details.mjs
          else
            echo "Unchanged six TPWD park detail guides; skip focused verification."
          fi

      - name: Preserve six TPWD park acceptance evidence
        if: ${{ always() && steps.live_six_tpwd.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: six-tpwd-detail-acceptance-${{ github.run_id }}
          path: .artifacts/tpwd-six-detail-live-acceptance.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Detect scoped six-state-park browser acceptance
        id: six_park_browser_scope
        if: ${{ always() && steps.cloudflare.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(scripts/ci/verify-six-state-park-visual\.mjs|src/data/tpwd-six-later-park-authorities\.ts|src/data/state-park-hero-map\.ts|src/data/explore-hero-map\.ts|\.github/workflows/deploy-production\.yml)$'; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare bounded state-park mobile visual acceptance
        id: six_park_browser_deps
        if: ${{ always() && steps.live_six_tpwd.outcome == 'success' && steps.six_park_browser_scope.outputs.needed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-park-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1

      - name: Capture and verify six park mobile and desktop pages
        id: live_six_tpwd_visual
        if: ${{ always() && steps.six_park_browser_deps.outcome == 'success' }}
        shell: bash
        run: node scripts/ci/verify-six-state-park-visual.mjs

      - name: Preserve mobile and desktop park screenshots
        if: ${{ always() && steps.live_six_tpwd_visual.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: six-tpwd-mobile-visual-${{ github.run_id }}
          path: artifacts/tpwd-six-mobile-visual/
          if-no-files-found: warn
          retention-days: 14

      # Exact-place image guard: verify both public origins and the
      # source-licensed JPEG bytes whenever this subject/hero changes.
      - name: Verify Devils River photograph and exact destination production
        id: live_devils_river_photo
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'success' && steps.live_canonical_health.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(src/data/(verified-devils-river-landscape\.ts|state-park-heroes\.ts|explore-heroes\.ts)|src/routes/destination\.\$slug\.tsx|scripts/production/verify-devils-river-hero\.mjs)$'; then
            node scripts/production/verify-devils-river-hero.mjs
          else
            echo "Devils River landscape hero unchanged; skip scoped acceptance."
          fi

      - name: Preserve Devils River photograph acceptance evidence
        if: ${{ always() && steps.live_devils_river_photo.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: devils-river-hero-acceptance-${{ github.run_id }}
          path: .artifacts/devils-river-hero-acceptance.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify changed Texas horse-racing authority pages
        id: live_horse_racing
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'success' && steps.live_canonical_health.outcome == 'success' && steps.change_scope.outputs.horse_racing == 'true' }}
        env:
          TEXASDEFINED_BASE_URL: https://texasdefined.com
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          node scripts/production/verify-horse-racing-production.mjs 2>&1 | tee .artifacts/horse-racing-production.log

      - name: Prepare bounded horse-racing browser acceptance
        if: ${{ always() && steps.live_horse_racing.outcome == 'success' && steps.change_scope.outputs.horse_racing == 'true' }}
        id: horse_racing_browser_deps
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-wp-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1

      - name: Verify horse-racing hotel cards and visual layouts in deployed production
        id: live_horse_racing_browser
        if: ${{ always() && steps.horse_racing_browser_deps.outcome == 'success' && steps.live_horse_racing.outcome == 'success' }}
        env:
          EXPECT_CURATED_HOTELS: '1'
        shell: bash
        run: node scripts/ci/verify-horse-racing-browser.mjs

      - name: Preserve horse-racing desktop/mobile visual evidence
        if: ${{ always() && steps.live_horse_racing_browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: horse-racing-visual-affiliate-${{ github.run_id }}
          path: artifacts/horse-racing-browser/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve failed horse-racing production evidence
        if: ${{ always() && steps.live_horse_racing.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: horse-racing-production-${{ github.run_id }}
          path: .artifacts/horse-racing-production.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify sports venue editorial production
        id: live_sports_venue_editorial
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'success' && steps.live_canonical_health.outcome == 'success' && steps.change_scope.outputs.sports == 'true' }}
        env:
          TEXASDEFINED_BASE_URL: https://texasdefined.com
        run: node scripts/production/verify-sports-venue-editorial-production.mjs

      - name: Verify District 21 hub and eight team scorecards on production
        id: live_district21
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'success' && steps.live_canonical_health.outcome == 'success' }}
        env:
          PRODUCTION_ORIGIN: https://texasdefined.com
        run: node scripts/ci/verify-district21-football-production.mjs

      - name: Verify District 5-6A scorecard on direct Worker and canonical domain
        id: live_district5
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'success' && steps.live_canonical_health.outcome == 'success' }}
        run: node scripts/ci/verify-district-5-production.mjs

      # The district's HTML is checked on every deploy; its responsive browser check
      # must also run on every deploy, not only when the broad sports change group fires.
      # The previous change-scope condition skipped the visual gate on the exact
      # deployment that introduced it (2026-10-18, run 39132892906).
      - name: Prepare District 5 responsive Chrome verification
        id: district5_browser_deps
        if: ${{ always() && steps.live_district5.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-wp-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1

      - name: Verify District 5 desktop and mobile screenshots in Chrome
        id: live_district5_browser
        if: ${{ always() && steps.district5_browser_deps.outcome == 'success' }}
        run: node scripts/ci/verify-district-5-responsive-browser.mjs

      - name: Preserve District 5 responsive acceptance evidence
        if: ${{ always() && steps.live_district5_browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: district5-responsive-browser-${{ github.run_id }}
          path: artifacts/district5-responsive-browser/
          if-no-files-found: error
          retention-days: 14

      - name: Verify East Texas foliage article freshness on direct Worker and canonical domain
        id: live_east_texas_foliage
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'success' && steps.live_canonical_health.outcome == 'success' && steps.change_scope.outputs.foliage == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          marker='Quick answer: when and where to go'
          for origin in 'https://texasdefined-site.freddy-coppola.workers.dev' 'https://texasdefined.com'; do
            label='direct-worker'
            if [[ "$origin" == 'https://texasdefined.com' ]]; then label='canonical-domain'; fi
            output=".artifacts/east-texas-foliage-${label}.html"
            passed=0
            for attempt in 1 2 3 4; do
              curl --fail-with-body --silent --show-error --location --max-time 30 \
                "$origin/article/east-texas-fall-colors?deploy_verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" -o "$output" || true
              if grep -Fq "$marker" "$output" 2>/dev/null; then passed=1; break; fi
              sleep 5
            done
            if [[ "$passed" != 1 ]]; then
              echo "::error title=East Texas foliage stale on ${label}::Deployed article lacks the new seasonal planning content at ${origin}. Check Worker route, stale edge cache or an old deployment. Do not certify this deployment."
              exit 1
            fi
            echo "East Texas foliage authority content verified on ${label}."
          done

      - name: Upload East Texas foliage freshness diagnostics
        if: ${{ always() && steps.live_east_texas_foliage.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: east-texas-foliage-freshness-${{ github.run_id }}
          path: .artifacts/east-texas-foliage-*.html
          if-no-files-found: warn
          retention-days: 7

      - name: Verify direct Worker discovery
        id: live_direct_worker
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'success' && steps.live_canonical_health.outcome == 'success' && steps.change_scope.outputs.discovery == 'true' }}
        env:
          DIRECT_WORKER_ORIGIN: https://texasdefined-site.freddy-coppola.workers.dev
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          node scripts/ci/verify-direct-worker-discovery.mjs 2>&1 | tee .artifacts/direct-worker-discovery.log

      - name: Upload direct Worker discovery diagnostics
        if: ${{ always() && steps.live_direct_worker.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: direct-worker-discovery-${{ github.run_id }}
          path: .artifacts/direct-worker-discovery.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify base production surfaces
        id: live_base
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'success' && steps.live_canonical_health.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          node scripts/ci/verify-changed-production-pages.mjs 2>&1 | tee .artifacts/city-sitemap-live-evidence.log

      - name: Preserve live city sitemap verification evidence
        if: ${{ always() && steps.live_base.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: city-sitemap-live-evidence-${{ github.run_id }}
          path: .artifacts/city-sitemap-live-evidence.log
          if-no-files-found: error
          retention-days: 90

      - name: Preserve changed-page smoke details
        if: ${{ always() && steps.live_base.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: changed-production-pages-${{ github.run_id }}
          path: .artifacts/changed-production-pages.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify Event structured-data production
        id: live_events
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'success' && steps.live_canonical_health.outcome == 'success' && steps.change_scope.outputs.events == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          node scripts/ci/verify-event-structured-data-production.mjs 2>&1 | tee .artifacts/live-events.log

      - name: Upload Event structured-data diagnostics
        if: ${{ always() && steps.live_events.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: event-structured-data-${{ github.run_id }}
          path: .artifacts/live-events.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify local financial production
        id: live_local_financial
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'success' && steps.live_canonical_health.outcome == 'success' && steps.change_scope.outputs.financial == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          node scripts/ci/verify-local-financial-production.mjs 2>&1 | tee .artifacts/live-local-financial.log

      - name: Upload local financial diagnostics
        if: ${{ always() && steps.live_local_financial.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: local-financial-${{ github.run_id }}
          path: .artifacts/live-local-financial.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify statewide financial discovery
        id: live_statewide_financial
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'success' && steps.live_canonical_health.outcome == 'success' && steps.change_scope.outputs.financial == 'true' }}
        run: node scripts/ci/verify-statewide-financial-discovery.mjs

      - name: Upload statewide financial discovery diagnostics
        if: always()
        # Preserve diagnostics without treating GitHub artifact-service outages
        # as live production failures; the verifier above remains a hard gate.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: statewide-financial-discovery-${{ github.run_id }}
          path: .artifacts/statewide-financial-discovery.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify advertiser production
        id: live_advertiser
        if: ${{ always() && steps.cloudflare.outcome == 'success' && steps.live_direct_health.outcome == 'success' && steps.live_canonical_health.outcome == 'success' && steps.change_scope.outputs.advertiser == 'true' }}
        env:
          ORIGIN: https://texasdefined.com
          REVISION: ${{ github.sha }}
        run: node scripts/ci/verify-advertiser-production.mjs

      - name: Mark live production verification complete
        id: live
        # Require completed, passing District 5 desktop/mobile Chrome acceptance.
        if: ${{ success() && steps.cloudflare.outcome == 'success' && steps.live_district5_browser.outcome == 'success' && steps.live_district21.outcome == 'success' }}
        run: echo 'All blocking production verifiers passed natively.'
      - name: Publish live verification result
        if: always()
        env:
          STAGE_OUTCOME: ${{ steps.live.outcome == 'success' && 'success' || 'failure' }}
        run: node scripts/ci/publish-github-status.mjs texasdefined-live "$STAGE_OUTCOME" "Production surface verification passed" "Production surface verification failed"

      - name: Publish IndexNow gate pending
        if: success()
        run: node scripts/ci/publish-github-status.mjs texasdefined-indexnow pending "Checking IndexNow approval gate"

      - name: Run guarded IndexNow step
        id: indexnow
        run: node scripts/seo/submit-indexnow.mjs

      - name: Publish IndexNow advisory result
        if: always()
        env:
          STAGE_OUTCOME: ${{ steps.indexnow.outcome }}
        run: node scripts/ci/publish-github-status.mjs texasdefined-indexnow "$STAGE_OUTCOME" "IndexNow gate completed" "IndexNow gate or submission failed"

      - name: Capture fully verified Worker version
        id: verified_worker_version
        if: success()
        run: node scripts/ci/capture-active-worker-version.mjs

      - name: Confirm verified Worker is the version this run deployed
        id: verified_worker_identity
        if: success()
        shell: bash
        env:
          DEPLOYED_WORKER_VERSION: ${{ steps.deployed_worker_version.outputs.version_id }}
          VERIFIED_ACTIVE_WORKER_VERSION: ${{ steps.verified_worker_version.outputs.version_id }}
        run: |
          if [[ -z "${DEPLOYED_WORKER_VERSION:-}" || -z "${VERIFIED_ACTIVE_WORKER_VERSION:-}" || "${VERIFIED_ACTIVE_WORKER_VERSION}" != "${DEPLOYED_WORKER_VERSION}" ]]; then
            echo "::error title=Verified Worker changed during production verification::deployed=${DEPLOYED_WORKER_VERSION:-missing}, active=${VERIFIED_ACTIVE_WORKER_VERSION:-missing}. Refusing to advance the verified recovery ledger."
            exit 1
          fi
          echo "Verified Worker identity is stable: ${DEPLOYED_WORKER_VERSION}."

      - name: Record verified Worker recovery target
        id: verified_worker_ledger
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIED_WORKER_VERSION: ${{ steps.deployed_worker_version.outputs.version_id }}
        run: node scripts/ci/verified-worker-ledger.mjs record "${VERIFIED_WORKER_VERSION}"

      - name: Summarize production pipeline
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUDGET_OUTCOME: ${{ steps.budget.outcome }}
          RUNTIME_SMOKE_OUTCOME: ${{ steps.runtime_smoke.outcome }}
          PREDEPLOY_HEALTH_OUTCOME: ${{ steps.predeploy_health.outcome }}
          CLOUDFLARE_GIT_BUILD_OUTCOME: ${{ steps.cloudflare_git_build.outcome }}
          CLOUDFLARE_OUTCOME: ${{ steps.cloudflare.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          INDEXNOW_OUTCOME: ${{ steps.indexnow.outcome }}
          RECOVERY_LEDGER_OUTCOME: ${{ steps.verified_worker_ledger.outcome }}
        run: |
          {
            echo '## TexasDefined production pipeline'
            echo
            echo '| Stage | Failure class | Outcome |'
            echo '|---|---|---|'
            echo "| Dependency install | DEPENDENCY / INSTALL | ${INSTALL_OUTCOME:-not-run} |"
            echo "| Pre-deploy validation | CODE / CONTENT / SEO / DATA | ${VALIDATION_OUTCOME:-not-run} |"
            echo "| Production build | BUILD | ${BUILD_OUTCOME:-not-run} |"
            echo "| Client bundle budget | BUNDLE BUDGET | ${BUDGET_OUTCOME:-not-run} |"
            echo "| Built Worker SSR smoke | RUNTIME / SSR | ${RUNTIME_SMOKE_OUTCOME:-not-run} |"
            echo "| Current production health | PREDEPLOY / RECOVERY | ${PREDEPLOY_HEALTH_OUTCOME:-not-run} |"
            echo "| Cloudflare Git-build serialization | DEPLOYMENT / CONCURRENCY | ${CLOUDFLARE_GIT_BUILD_OUTCOME:-not-run} |"
            echo "| Cloudflare Worker deploy | CLOUDFLARE / DEPLOYMENT | ${CLOUDFLARE_OUTCOME:-not-run} |"
            echo "| Live production verification | LIVE PRODUCTION | ${LIVE_OUTCOME:-not-run} |"
            echo "| IndexNow approval gate | INDEXING / EXTERNAL | ${INDEXNOW_OUTCOME:-not-run} |"
            echo "| Verified Worker recovery ledger | RECOVERY / STATE | ${RECOVERY_LEDGER_OUTCOME:-not-run} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$INSTALL_OUTCOME" == 'failure' ]]; then
            echo '::error title=Pipeline failure class: DEPENDENCY / INSTALL::npm ci failed before application validation.'
          elif [[ "$VALIDATION_OUTCOME" == 'failure' ]]; then
            echo '::error title=Pipeline failure class: VALIDATION::A code/content/SEO/data validator failed; the exact check is in the validation-suite summary.'
          elif [[ "$BUILD_OUTCOME" == 'failure' ]]; then
            echo '::error title=Pipeline failure class: BUILD::Validation passed; the production build failed or regenerated an uncommitted route tree.'
          elif [[ "$BUDGET_OUTCOME" == 'failure' ]]; then
            echo '::error title=Pipeline failure class: BUNDLE BUDGET::Validation and build passed, but the protected client bundle budget was exceeded.'
          elif [[ "$RUNTIME_SMOKE_OUTCOME" == 'failure' ]]; then
            echo '::error title=Pipeline failure class: RUNTIME / SSR::The production bundle built, but the generated Worker failed local SSR smoke before Cloudflare deployment.'
          elif [[ "$PREDEPLOY_HEALTH_OUTCOME" == 'failure' ]]; then
            echo '::error title=Pipeline failure class: PREDEPLOY / RECOVERY::Current production was unhealthy, so the workflow failed closed before replacing the Worker.'
          elif [[ "$CLOUDFLARE_GIT_BUILD_OUTCOME" == 'failure' ]]; then
            echo '::error title=Pipeline failure class: DEPLOYMENT / CONCURRENCY::The Cloudflare Git integration did not settle before the protected deployment deadline; no verified replacement was attempted.'
          elif [[ "$CLOUDFLARE_OUTCOME" == 'failure' ]]; then
            echo '::error title=Pipeline failure class: CLOUDFLARE / DEPLOYMENT::Code validation, build and bundle budget passed; Cloudflare deployment failed.'
          elif [[ "$LIVE_OUTCOME" != 'success' ]]; then
            echo '::error title=Pipeline failure class: LIVE PRODUCTION::Cloudflare deployment passed; a raw production verifier failed. The exact child outcome is listed above.'
          elif [[ "$RECOVERY_LEDGER_OUTCOME" == 'failure' ]]; then
            echo '::error title=Pipeline failure class: RECOVERY / STATE::Production passed blocking runtime verification, but the immutable verified-Worker recovery ledger could not be advanced.'
          elif [[ "$INDEXNOW_OUTCOME" == 'failure' ]]; then
            echo '::error title=Pipeline failure class: INDEXING / EXTERNAL::Production verification passed; the guarded IndexNow stage failed.'
          fi

      - name: Publish final production status
        if: always()
        env:
          PIPELINE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/publish-github-status.mjs texasdefined-production "$PIPELINE_OUTCOME" "Production deploy and blocking runtime verification passed" "Production pipeline failed; see the GitHub job summary"

  verify-gsc-manual-next-production:
    name: Verify GSC manual-next production after deploy
    needs: deploy
    # Gate on full protected main deployment and verified Worker recovery ledger.
    if: ${{ needs.deploy.result == 'success' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/verify-gsc-manual-next-production.yml
    permissions:
      contents: read
