name: Deploy TexasDefined production

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'scripts/data/validate-painted-church*.mjs'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texasdefined-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Texas culture authority before deploy
        run: |
          node scripts/data/validate-machine-indexing.mjs
          node scripts/data/validate-things-unique-to-texas.mjs
          node scripts/data/validate-texas-icon-link-depth.mjs
          node scripts/data/validate-texas-weather-authority.mjs
          node scripts/data/validate-texas-food-history.mjs
          node scripts/data/validate-texas-culture-citation-index.mjs
      - name: Validate Painted Churches authority before deploy
        run: |
          node scripts/data/validate-painted-churches-seo.mjs
          node scripts/data/validate-painted-church-search-intents.mjs
          node scripts/data/validate-painted-church-map.mjs
          node scripts/data/validate-painted-church-completion.mjs
      - name: Build production bundle
        run: npm run build
      - name: Enforce existing client bundle budget
        run: npm run performance:validate
      - name: Deploy TexasDefined Worker
        run: npx wrangler deploy
      - name: Verify production surfaces
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          fetch_assert() {
            local label="$1" path="$2" needle="$3"
            local out="$workdir/${label}.html"
            local attempt
            for attempt in 1 2 3 4 5 6; do
              echo "[$label] attempt $attempt: ${origin}${path}"
              if curl --fail-with-body --silent --show-error --location --max-time 30 \
                "${origin}${path}?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" -o "$out"; then
                if grep -Fq "$needle" "$out"; then
                  echo "[$label] production content verified: $needle"
                  return 0
                fi
                echo "[$label] fetched successfully but expected content is not live yet: $needle"
              fi
              sleep 5
            done
            echo "[$label] production verification failed for ${origin}${path}" >&2
            head -c 1200 "$out" 2>/dev/null || true
            echo >&2
            return 1
          }

          fetch_assert homepage '/' 'Texas Defined'
          fetch_assert moving-pillar '/article/moving-to-texas-what-nobody-tells-you' 'The quick answer: what should you know before moving to Texas?'
          fetch_assert painted-churches '/explore/painted-churches' 'Painted Churches of Texas'
          fetch_assert then-and-now '/explore/painted-churches/then-and-now' 'Texas Painted Churches, then and now.'
          fetch_assert media '/explore/painted-churches/media' 'Watch the documentary. Follow the voices behind it.'
          fetch_assert guidebook '/guides' 'Painted Churches of Texas'

          echo 'TexasDefined production, moving-to-Texas pillar and Painted Churches authority surfaces are live.'