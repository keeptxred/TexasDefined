name: Six TPWD park desktop and mobile visual QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/six-tpwd-park-visual-qa.yml
      - scripts/ci/verify-six-state-park-visual.mjs
      - scripts/production/__tests__/verify-six-park-authority-production.test.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read

# Runs independently of the frequently superseded sitewide production deploy
# queue. Keep each real browser QA run; do not cancel a pending run on new pushes.
concurrency:
  group: six-tpwd-park-visual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  visual-acceptance:
    name: Six real state park guides on desktop and mobile Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact verifier commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run fail-closed park verifier regression
        run: node --test scripts/production/__tests__/verify-six-park-authority-production.test.mjs

      - name: Pin the live Worker to a signed successful production source release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/pin-football-b010-production-release.mjs
          grep -qx 'ready=true' "$GITHUB_OUTPUT" || {
            echo 'No signed source/Worker proof; refuse park production certification.' >&2
            exit 1
          }
          echo "PARK_QA_SOURCE_SHA=$(grep '^sha=' "$GITHUB_OUTPUT" | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "PARK_QA_WORKER_VERSION=$(grep '^worker=' "$GITHUB_OUTPUT" | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Require exact deployed source for park acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$PARK_QA_SOURCE_SHA" = "$GITHUB_SHA" || {
            echo "Verifier SHA $GITHUB_SHA differs from signed active source $PARK_QA_SOURCE_SHA; no release-matched acceptance." >&2
            exit 1
          }

      - name: Prepare free Chrome and Playwright Core
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-park-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1

      - name: Verify all six parks in desktop and mobile Chrome
        run: node scripts/ci/verify-six-state-park-visual.mjs

      - name: Reject mixed Worker or source during Chrome capture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/pin-football-b010-production-release.mjs
          grep -qx 'ready=true' "$GITHUB_OUTPUT"
          test "$(grep '^sha=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)" = "$PARK_QA_SOURCE_SHA"
          test "$(grep '^worker=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)" = "$PARK_QA_WORKER_VERSION"

      - name: Preserve executed 12-viewport browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: six-tpwd-independent-visual-${{ github.run_id }}
          path: artifacts/tpwd-six-mobile-visual/
          if-no-files-found: error
          retention-days: 14
