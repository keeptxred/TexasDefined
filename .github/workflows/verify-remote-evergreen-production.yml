name: Verify remote evergreen production

on:
  pull_request:
    paths:
      - '.github/workflows/verify-remote-evergreen-production.yml'
      - 'scripts/data/verify-remote-evergreen-production.mjs'
      - 'src/data/remote-evergreen-authority-sources.ts'
      - 'src/data/remote-evergreen-authority-sources.test.ts'
      - 'src/data/articles-remote.ts'
      - 'src/routes/article.$slug.tsx'
      - 'src/routes/sitemap[.]xml.ts'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-remote-evergreen-production.yml'
      - 'scripts/data/verify-remote-evergreen-production.mjs'
      - 'src/data/remote-evergreen-authority-sources.ts'
      - 'src/data/remote-evergreen-authority-sources.test.ts'
      - 'src/data/articles-remote.ts'
      - 'src/routes/article.$slug.tsx'
      - 'src/routes/sitemap[.]xml.ts'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: remote-evergreen-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cohort:
    name: Validate remote evergreen cohort
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run authority-source coverage test
        run: npx vitest run src/data/remote-evergreen-authority-sources.test.ts

  verify-production:
    name: Verify 19 canonical evergreen pages on texasdefined.com
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - validate-cohort
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical evergreen cohort in production
        run: node scripts/data/verify-remote-evergreen-production.mjs
