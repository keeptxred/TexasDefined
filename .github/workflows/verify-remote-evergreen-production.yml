name: Verify remote evergreen production

on:
  schedule:
    # Quarterly evidence and live-page review; detect drift without rewriting facts.
    - cron: '17 14 1 1,4,7,10 *'
  pull_request:
    paths:
      - '.github/workflows/verify-remote-evergreen-production.yml'
      - 'scripts/ci/validate-remote-evergreen-authority-sources.mjs'
      - 'scripts/ci/verify-remote-evergreen-production.mjs'
      - 'src/data/remote-evergreen-authority-sources.ts'
      - 'src/data/remote-evergreen-authority-sources.test.ts'
      - 'src/data/remote-evergreen-source-fallbacks.ts'
      - 'src/data/articles-remote.ts'
      - 'src/data/queries.ts'
      - 'src/domain/utils/format.ts'
      - 'src/lib/editorial-image-delivery.ts'
      - 'src/lib/remote-image-fetch-policy.ts'
      - 'src/lib/remote-image-fetch-policy.test.ts'
      - 'src/server.ts'
      - 'src/routes/article.$slug.tsx'
      - 'src/routes/authors.$author.tsx'
      - 'src/components/editorial/ArticleBody.tsx'
      - 'src/data/heritage-photo-license-links.ts'
      - 'scripts/ci/verify-blue-bell-history-authority.mjs'
      - 'src/routes/sitemap*.ts'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-remote-evergreen-production.yml'
      - 'scripts/ci/validate-remote-evergreen-authority-sources.mjs'
      - 'scripts/ci/verify-remote-evergreen-production.mjs'
      - 'src/data/remote-evergreen-authority-sources.ts'
      - 'src/data/remote-evergreen-authority-sources.test.ts'
      - 'src/data/remote-evergreen-source-fallbacks.ts'
      - 'src/data/articles-remote.ts'
      - 'src/data/queries.ts'
      - 'src/domain/utils/format.ts'
      - 'src/lib/editorial-image-delivery.ts'
      - 'src/lib/remote-image-fetch-policy.ts'
      - 'src/lib/remote-image-fetch-policy.test.ts'
      - 'src/server.ts'
      - 'src/routes/article.$slug.tsx'
      - 'src/routes/sitemap*.ts'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: remote-evergreen-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cohort:
    name: Validate remote evergreen cohort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate authority-source coverage
        run: node scripts/ci/validate-remote-evergreen-authority-sources.mjs
      - name: Validate Blue Bell historical evidence, sources and author attribution
        run: node scripts/ci/verify-blue-bell-history-authority.mjs

  verify-production:
    name: Verify 19 canonical evergreen pages on texasdefined.com
    if: ${{ github.event_name != 'pull_request' }}
    needs: validate-cohort
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for this commit's protected production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/ci/wait-for-protected-production.mjs
      - name: Require canonical, indexable, sourced, image-backed production pages and sitemap discovery
        run: node scripts/ci/verify-remote-evergreen-production.mjs
      - name: Recheck Blue Bell history, image license, author archive and live source links
        run: node scripts/ci/verify-blue-bell-history-authority.mjs --live
