name: Fix route governance once

on:
  push:
    branches:
      - fix/discovery-route-tree-production-20260902
    paths:
      - '.github/workflows/fix-route-governance-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/discovery-route-tree-production-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Repair governance classification inputs
        shell: python
        run: |
          from pathlib import Path

          registry_path = Path('src/lib/public-routes.ts')
          registry = registry_path.read_text()
          planner_line = '  "/explore/trip-planner",\n'
          if planner_line not in registry:
              raise SystemExit('Trip Planner indexable registry entry not found')
          registry = registry.replace(planner_line, '', 1)
          conditional_marker = 'export const CONDITIONAL_INDEXABLE_PUBLIC_PATHS = [\n'
          if conditional_marker not in registry:
              raise SystemExit('Conditional registry marker not found')
          registry = registry.replace(conditional_marker, conditional_marker + planner_line, 1)
          registry_path.write_text(registry)

          governance_path = Path('scripts/data/validate-public-route-governance.mjs')
          governance = governance_path.read_text()
          governance = governance.replace("const routeTree = fs.readFileSync('src/routeTree.gen.ts', 'utf8');\n", '', 1)
          old = "const registeredStaticPublicPaths = new Set([...routeTree.matchAll(/\\bpath:\\s*'([^']+)'/g)].map((match) => normalize(match[1])).filter(shouldCountPublicRoute));"
          new = "const registeredStaticPublicPaths = new Set(sourceRouteEntries.map((entry) => entry.path).filter(shouldCountPublicRoute));"
          if old not in governance:
              raise SystemExit('Generated-path registry parser not found')
          governance = governance.replace(old, new, 1)
          governance_path.write_text(governance)

          explore_validator_path = Path('scripts/data/validate-explore-route-registration.mjs')
          explore_validator = explore_validator_path.read_text()
          old_trip_contract = '''for (const feature of [
            'createFileRoute("/explore/trip-planner")',
            'canonicalPath: "/explore/trip-planner"',
            'robots: "noindex, follow"',
            'links: [canonicalLink(texasDefinedBrand, "/explore/trip-planner")]',
          ]) {
            if (!tripPlanner.includes(feature)) failures.push(`Trip Planner shell contract missing: ${feature}.`);
          }
          '''
          new_trip_contract = '''for (const feature of [
            'createFileRoute("/explore/trip-planner")',
            'head: ({ match })',
            'const hasQueryState = Boolean(match.search.destination || match.search.trip)',
            'canonicalPath: "/explore/trip-planner"',
            'robots: hasQueryState ? "noindex, follow" : undefined',
            'links: [canonicalLink(texasDefinedBrand, "/explore/trip-planner")]',
          ]) {
            if (!tripPlanner.includes(feature)) failures.push(`Trip Planner shell contract missing: ${feature}.`);
          }
          if (/robots:\s*["']noindex, follow["']/.test(tripPlanner)) {
            failures.push('Trip Planner clean route must remain indexable; only destination/trip query states may emit noindex, follow.');
          }
          '''
          if old_trip_contract not in explore_validator:
              raise SystemExit('Trip Planner validator contract block not found')
          explore_validator = explore_validator.replace(old_trip_contract, new_trip_contract, 1)
          explore_validator_path.write_text(explore_validator)
      - name: Validate governance repair
        run: |
          node scripts/data/validate-public-route-governance.mjs
          node scripts/data/validate-explore-route-registration.mjs
      - name: Commit governance repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/public-routes.ts scripts/data/validate-public-route-governance.mjs scripts/data/validate-explore-route-registration.mjs
          git commit -m 'fix: classify full route ids and protect planner query indexing'
          git push origin HEAD:fix/discovery-route-tree-production-20260902
