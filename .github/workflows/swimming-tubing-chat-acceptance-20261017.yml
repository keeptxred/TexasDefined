name: Swimming Tubing One-Time Acceptance
on:
  push:
    branches: [agent/swimming-tubing-live-acceptance-20261017]
permissions:
  contents: read
jobs:
  smoke-and-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check actual live HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          origin='https://texasdefined.com'
          curl --fail-with-body --silent --show-error --location --max-time 80 --http1.1 --user-agent 'Mozilla/5.0 Chrome/132' "$origin/explore/swimming-holes-river-tubing?qa=$GITHUB_RUN_ID" -o evidence/live.html
          grep -qi '</html>' evidence/live.html
          grep -Fq 'id="texas-swimming-holes-river-tubing-guide"' evidence/live.html
          grep -Fq 'Known restrictions checked October 17, 2026' evidence/live.html
          grep -Fq 'Official sources' evidence/live.html
          grep -Fq 'class="mt-6 grid gap-5 md:hidden"' evidence/live.html
          grep -Fq 'href="/texas-paddling-guide"' evidence/live.html
          grep -Fq 'href="/explore/small-towns"' evidence/live.html
          grep -Fq 'rel="canonical" href="https://texasdefined.com/explore/swimming-holes-river-tubing"' evidence/live.html
          ! grep -Eiq 'name="robots" content="noindex' evidence/live.html
          echo 'PASS complete server-rendered guide, safety review, canonical, navigation'
      - name: Verify redirects, sitemap and reciprocal links
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          origin='https://texasdefined.com'
          check_redirect() {
            code="$(curl -sS -o /dev/null -D evidence/headers.tmp -w '%{http_code}' --max-time 25 "$origin$1")"
            location="$(grep -i '^location:' evidence/headers.tmp | head -1 | tr -d '\r' | sed -E 's/^[Ll]ocation:[[:space:]]*//')"
            [[ "$code" == 301 ]] && { [[ "$location" == "$2" ]] || [[ "$location" == "$origin$2" ]]; }
            echo "PASS redirect $1 $code $location"
          }
          check_redirect /explore/river-tubing /explore/swimming-holes-river-tubing
          check_redirect /explore/swimming-holes /explore/swimming-holes-river-tubing
          check_redirect /explore/spring-fed-swimming /explore/lakes-rivers
          curl --fail-with-body -sSL --max-time 45 "$origin/sitemap-explore.xml" -o evidence/sitemap.xml
          grep -Fq '<loc>https://texasdefined.com/explore/swimming-holes-river-tubing</loc>' evidence/sitemap.xml
          for path in /destination/bandera /destination/garner-state-park /destination/san-marcos /article/best-texas-swimming-holes-for-a-summer-trip; do
            curl --fail-with-body -sSL --max-time 45 "$origin$path" -o evidence/page.tmp
            grep -Fq 'href="/explore/swimming-holes-river-tubing"' evidence/page.tmp
            echo "PASS reciprocal $path"
          done
      - name: Render desktop and mobile using Chrome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          chrome="$(command -v google-chrome || command -v chromium)"
          url='https://texasdefined.com/explore/swimming-holes-river-tubing'
          timeout 95 "$chrome" --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=12000 --window-size=1440,6500 --screenshot="$PWD/evidence/desktop.png" "$url" >/dev/null 2>evidence/desktop.log
          timeout 95 "$chrome" --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=12000 --window-size=400,6500 --screenshot="$PWD/evidence/mobile.png" "$url" >/dev/null 2>evidence/mobile.log
          timeout 95 "$chrome" --headless --no-sandbox --disable-dev-shm-usage --virtual-time-budget=12000 --window-size=1440,1400 --dump-dom "$url" >evidence/dom.html 2>evidence/dom.log
          grep -Fq 'texas-swimming-holes-river-tubing-guide' evidence/dom.html
          grep -Fq 'Known restrictions checked October 17, 2026' evidence/dom.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('evidence/dom.html').read_text(errors='replace')
          guide = html.find('id="texas-swimming-holes-river-tubing-guide"')
          cards = html.find('class="mt-6 grid gap-5 md:hidden"')
          stay = html.find('id="expedia-travel-surface"')
          assert guide > 0, 'Authority guide is not rendered'
          assert cards > guide, 'Responsive mobile cards are missing'
          assert stay > cards, 'Stay/affiliate surface is wrongly inserted ahead of the guide'
          for slug in ('texas-comal-river-guide','texas-guadalupe-river-guide','texas-san-marcos-river-guide','texas-frio-river-guide'):
              assert html.count('href="/article/'+slug+'"') >= 2, 'Missing mobile river card: '+slug
          print('PASS responsive mobile cards and end-of-guide affiliate placement')
          PY
          test "$(stat -c%s evidence/desktop.png)" -gt 25000
          test "$(stat -c%s evidence/mobile.png)" -gt 25000
          echo 'PASS headless Chrome desktop/mobile screenshot and guide DOM'
      - name: Cover full desktop and mobile pages with Playwright
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/texasdefined-wp-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { mkdirSync,writeFileSync } from 'node:fs';
          const { chromium }=createRequire(import.meta.url)('/tmp/texasdefined-wp-qa/node_modules/playwright-core');
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
          const results=[];
          mkdirSync('evidence/full-page',{recursive:true});
          for(const [name,width,height,mobile] of [['desktop',1440,900,false],['mobile',390,844,true]]){
            const ctx=await browser.newContext({viewport:{width,height},deviceScaleFactor:1,isMobile:mobile,hasTouch:mobile});
            await ctx.route(/google-analytics|googletagmanager|facebook\.com\/tr|connect\.facebook\.net|analytics\.google|\/api\/analytics|\/api\/track/i,r=>r.abort());
            const page=await ctx.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e).slice(0,200)));
            const res=await page.goto('https://texasdefined.com/explore/swimming-holes-river-tubing',{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('#texas-swimming-holes-river-tubing-guide').waitFor({state:'attached',timeout:30000});
            await page.waitForTimeout(1250);
            let total=await page.evaluate(()=>document.documentElement.scrollHeight);
            for(let y=0;y<total;y+=1200){await page.evaluate(y=>window.scrollTo(0,y),y);await page.waitForTimeout(60);}
            await page.waitForTimeout(1600);
            total=await page.evaluate(()=>document.documentElement.scrollHeight);
            const m=await page.evaluate(()=>{
              const figs=[...document.querySelectorAll('section[aria-label="Photographs from Texas rivers"] figure')];
              const guide=document.querySelector('#texas-swimming-holes-river-tubing-guide'),stay=document.querySelector('#expedia-travel-surface');
              return {width:document.documentElement.scrollWidth,viewport:window.innerWidth,height:document.documentElement.scrollHeight,
                photos:figs.map(f=>({loaded:!!f.querySelector('img')?.naturalWidth,src:f.querySelector('img')?.currentSrc,caption:f.querySelector('figcaption')?.innerText})),
                stayAfterGuide:!!(guide && stay && (stay.compareDocumentPosition(guide)&Node.DOCUMENT_POSITION_PRECEDING)),
                brokenImages:[...document.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.src).slice(0,10)};
            });
            for(let y=0,k=0;y<total;y+=4500,k++){
              await page.screenshot({path:'evidence/full-page/'+name+'-'+String(k).padStart(2,'0')+'.png',clip:{x:0,y,width,height:Math.min(4500,total-y)},timeout:60000,animations:'disabled'});
            }
            const problems=[];
            if(res?.status()!==200) problems.push('bad HTTP');
            if(m.width>width+10) problems.push('horizontal overflow');
            if(m.photos.length!==3 || m.photos.some(p=>!p.loaded)) problems.push('river photos unavailable');
            if(!m.photos[2]?.caption?.includes('Larry D. Moore')) problems.push('missing Garner attribution');
            if(!m.stayAfterGuide) problems.push('lodging before guide');
            if(m.brokenImages.length) problems.push('broken image');
            if(errors.length) problems.push('JS error');
            results.push({name,status:res?.status(),...m,errors,problems});
            console.log(name,JSON.stringify({height:total,overflow:m.width-width,photos:m.photos,problems}));
            await ctx.close();
          }
          await browser.close();
          writeFileSync('evidence/full-page/results.json',JSON.stringify(results,null,2));
          if(results.some(r=>r.problems.length)) process.exitCode=1;
          NODE
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swimming-tubing-acceptance
          path: evidence/
          retention-days: 7
