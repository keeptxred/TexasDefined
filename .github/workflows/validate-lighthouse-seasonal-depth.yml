name: Validate lighthouse seasonal depth

on:
  pull_request:
    paths:
      - 'src/data/fixtures/lighthouse-seasonal-authority-articles.ts'
      - 'src/data/fixtures/lazy-seasonal-authority.ts'
      - 'scripts/data/validate-lighthouse-seasonal-depth.mjs'
      - '.github/workflows/validate-lighthouse-seasonal-depth.yml'
  push:
    branches:
      - main
    paths:
      - 'src/data/fixtures/lighthouse-seasonal-authority-articles.ts'
      - 'src/data/fixtures/lazy-seasonal-authority.ts'
      - 'scripts/data/validate-lighthouse-seasonal-depth.mjs'
      - '.github/workflows/validate-lighthouse-seasonal-depth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lighthouse seasonal depth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate expanded lighthouse authority
        run: node scripts/data/validate-lighthouse-seasonal-depth.mjs
