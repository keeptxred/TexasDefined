name: Verify Batch 003 football production browser
on:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football-batch-003-production-browser
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository evidence and browser runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Chrome browser driver at no project cost
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-wp-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Independently validate 25 school routes, county and city links, sitemap, mobile and desktop
        env:
          ACCEPTANCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/ci/verify-football-batch-003-browser.mjs
      - name: Preserve screenshots and per-school browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-batch-003-browser-acceptance
          path: artifacts/football-batch-003/
          if-no-files-found: warn
          retention-days: 14
