name: Close unusual-business cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-unusual-business-cleanup.yml'
      - 'src/components/authority/CitationTrustPanel.tsx'
      - 'src/components/authority/UnusualBusinessAuthorityPanel.tsx'
      - 'src/components/editorial/ArticleBody.tsx'
      - 'src/components/editorial/DestinationRelationships.tsx'
      - 'src/data/unusual-business-authority.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: close-unusual-business-cleanup
  cancel-in-progress: true

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify six live authority panels
        env:
          VERIFY_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://texasdefined.com';
          const paths = [
            '/article/unusual-texas-businesses-services',
            '/article/bluebonnet-animal-preservation-athens',
            '/article/phenix-knives-bellville',
            '/article/horses-on-the-beach-corpus-christi',
            '/article/mum-queen-spring-texas-homecoming-mums',
            '/destination/whirlyball-hurst',
          ];
          const markers = [
            'Quick reference',
            'At a glance',
            'Sources and verification',
            'Methodology',
            'Last verified',
            'Reviewed by',
            'Stable URL',
            'Recommended citation',
          ];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          function renderedText(html) {
            return html
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&nbsp;/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();
          }

          async function fetchPage(path) {
            let lastError;
            for (let attempt = 1; attempt <= 4; attempt += 1) {
              const url = new URL(path, origin);
              url.searchParams.set('authority_verify', `${process.env.VERIFY_REVISION || 'unknown'}-${attempt}`);
              try {
                const response = await fetch(url, {
                  redirect: 'follow',
                  cache: 'no-store',
                  signal: AbortSignal.timeout(15_000),
                  headers: {
                    'cache-control': 'no-cache',
                    pragma: 'no-cache',
                    'user-agent': 'TexasDefined-CI-Unusual-Business-Authority/2.0',
                  },
                });
                const challenged = response.headers.get('cf-mitigated')?.toLowerCase() === 'challenge';
                const html = await response.text();
                if (!challenged && response.ok && html.length > 0) return html;
                lastError = new Error(challenged
                  ? `${path} returned a Cloudflare challenge.`
                  : `${path} returned HTTP ${response.status}.`);
              } catch (error) {
                lastError = error instanceof Error ? error : new Error(String(error));
              }
              if (attempt < 4) await sleep(2_000);
            }
            throw lastError || new Error(`${path} returned no usable HTML.`);
          }

          const results = await Promise.all(paths.map(async (path) => {
            const html = await fetchPage(path);
            const text = renderedText(html);
            const missing = markers.filter((marker) => !text.includes(marker));
            if (missing.length) throw new Error(`${path} missing authority markers: ${missing.join(', ')}`);
            return path;
          }));

          for (const path of results) console.log(`verified ${path}`);
          console.log('All six unusual-business authority pages expose the complete live citation layer.');
          NODE

      - name: Confirm scratch branches are gone
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            'feature/unusual-business-authority-upgrade-final'
            'feature/unusual-business-authority-upgrade-final2'
            'feature/unusual-business-authority-upgrade-final3'
            'feature/unusual-business-authority-upgrade-final4'
            'feature/unusual-business-authority-upgrade-final5'
            'feature/unusual-business-authority-upgrade-final6'
            'feature/unusual-business-authority-upgrade-final7'
            'feature/unusual-business-authority-upgrade-final8'
            'feature/unusual-business-authority-upgrade-v2'
            'feature/unusual-business-authority-upgrade-v3'
            'feature/unusual-business-authority-upgrade-v4'
            'feature/close-unusual-business-cleanup'
            'feature/authority-live-diagnostic'
            'fix/whirlyball-authority-closeout'
            'fix/whirlyball-authority-closeout-v2'
          )

          failed=0
          for branch in "${branches[@]}"; do
            encoded_branch="${branch//\//%2F}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded_branch}" >/dev/null 2>&1; then
              echo "still present: ${branch}"
              failed=1
            else
              echo "absent: ${branch}"
            fi
          done

          if [[ "$failed" == '1' ]]; then
            echo '::error title=Scratch branch cleanup incomplete::One or more unusual-business scratch branches still exists.'
            exit 1
          fi
          echo 'No unusual-business authority-upgrade, diagnostic or closeout scratch branches remain.'
