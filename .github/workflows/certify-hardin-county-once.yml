name: Certify Hardin County once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-hardin-county-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Hardin changed-file canonical host gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -nF 'www.texasdefined.com' src/data/fixtures/hardin-county-kountze-big-thicket-sour-lake-piney-woods-texas.ts src/data/county-series-profiles-east-texas.ts; then
            echo 'Non-canonical www TexasDefined URL found in Hardin files.' >&2
            exit 1
          fi
      - name: Verify editorial hero uniqueness
        run: node scripts/data/validate-editorial-image-duplicates.mjs --all
      - name: Run normal repository validation
        run: npm run validate
      - name: Verify Hardin production page redirect and hero
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          page="$(mktemp)"
          headers="$(mktemp)"
          image="$(mktemp)"
          trap 'rm -f "$page" "$headers" "$image"' EXIT

          for attempt in 1 2 3 4 5 6; do
            if curl --fail-with-body --silent --show-error --location --max-time 30 \
              "${origin}/county/hardin?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" -o "$page"; then
              if grep -Fq 'Hardin County: Big Thicket, Oil Springs and Piney Woods Texas' "$page" \
                && grep -Fq '56,231' "$page" \
                && grep -Fq 'Kountze' "$page"; then
                break
              fi
            fi
            if [ "$attempt" = 6 ]; then
              echo 'Hardin live county page did not expose both editorial and structured layers.' >&2
              exit 1
            fi
            sleep 5
          done

          legacy_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 \
            "${origin}/article/hardin-county-kountze-big-thicket-sour-lake-piney-woods-texas")"
          [ "$legacy_status" = '301' ] || { echo "Expected legacy 301, got $legacy_status" >&2; exit 1; }
          legacy_location="$(curl --silent --show-error --head --max-time 30 \
            "${origin}/article/hardin-county-kountze-big-thicket-sour-lake-piney-woods-texas" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^location:[[:space:]]*/, ""); print; exit}')"
          [ "$legacy_location" = 'https://texasdefined.com/county/hardin' ] || { echo "Unexpected legacy location: $legacy_location" >&2; exit 1; }

          hero='https://upload.wikimedia.org/wikipedia/commons/2/24/Hardin_county_tx_courthouse_2014.jpg'
          hero_status="$(curl --silent --show-error --location --max-time 30 --dump-header "$headers" --output "$image" --write-out '%{http_code}' "$hero")"
          [ "$hero_status" = '200' ] || { echo "Hero HTTP $hero_status" >&2; exit 1; }
          hero_type="$(tr -d '\r' < "$headers" | awk 'BEGIN{IGNORECASE=1} /^content-type:/{print tolower($2); exit}')"
          case "$hero_type" in image/jpeg|image/png|image/webp) ;; *) echo "Unexpected hero MIME: $hero_type" >&2; exit 1 ;; esac
          [ "$(wc -c < "$image")" -gt 10000 ] || { echo 'Hero payload is too small.' >&2; exit 1; }
      - name: Publish Hardin certification success
        if: success()
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"hardin-county-certification","description":"Hardin validation and live verification passed"}' >/dev/null
      - name: Publish Hardin certification failure
        if: failure()
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"hardin-county-certification","description":"Hardin validation or live verification failed"}' >/dev/null
