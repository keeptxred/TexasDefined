name: Certify Clay County full validation once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-clay-full-validate-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish pending status
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"clay-county-full-validate","description":"Running full TexasDefined validation for Clay County source"}' >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run normal repository validation
        id: validate
        run: npm run validate
      - name: Publish success status
        if: ${{ steps.validate.outcome == 'success' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"clay-county-full-validate","description":"Full TexasDefined validation passed for Clay County source"}' >/dev/null
      - name: Publish failure status
        if: ${{ failure() && steps.validate.outcome == 'failure' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"clay-county-full-validate","description":"Full TexasDefined validation failed for Clay County source"}' >/dev/null
