name: Verify Fort Davis football production browser
on:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-authority-fort-davis-browser-production
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare real Chrome browser without changing project dependencies
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-wp-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Audit Fort Davis and reciprocal Jeff Davis County link at mobile and desktop sizes
        run: node scripts/ci/verify-fort-davis-browser.mjs
      - name: Retain real-browser screenshots and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fort-davis-browser-acceptance
          path: artifacts/fort-davis-qa/
          if-no-files-found: warn
          retention-days: 14
