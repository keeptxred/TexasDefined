name: Diagnose PR 2310 CSS delta once

on:
  push:
    branches:
      - growth/find-my-texas-county
    paths:
      - .github/workflows/diagnose-pr2310-css-delta.yml

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build branch and main, then print CSS delta
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          BRANCH_CSS="$(find dist/client/assets .output/public/assets -maxdepth 1 -type f -name 'styles-*.css' 2>/dev/null | head -n 1)"
          test -n "$BRANCH_CSS"
          cp "$BRANCH_CSS" /tmp/branch.css

          git fetch origin main
          git worktree add /tmp/td-main origin/main
          cd /tmp/td-main
          npm ci --no-audit --no-fund
          npm run build
          MAIN_CSS="$(find dist/client/assets .output/public/assets -maxdepth 1 -type f -name 'styles-*.css' 2>/dev/null | head -n 1)"
          test -n "$MAIN_CSS"
          cp "$MAIN_CSS" /tmp/main.css

          python3 - <<'PY'
          from pathlib import Path
          branch = Path('/tmp/branch.css').read_text()
          main = Path('/tmp/main.css').read_text()
          def rules(css):
              return {chunk.strip() + '}' for chunk in css.split('}') if chunk.strip()}
          added = sorted(rules(branch) - rules(main), key=lambda x: (len(x), x))
          removed = sorted(rules(main) - rules(branch), key=lambda x: (len(x), x))
          print(f'BRANCH_BYTES={len(branch.encode())}')
          print(f'MAIN_BYTES={len(main.encode())}')
          print(f'DELTA_BYTES={len(branch.encode()) - len(main.encode())}')
          print('=== ADDED RULES ===')
          for rule in added:
              print(rule)
          print('=== REMOVED RULES ===')
          for rule in removed:
              print(rule)
          PY
