name: Texas flag history production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flag-history-production-smoke.yml'
  workflow_run:
    workflows: ["Deploy TexasDefined production"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: texas-flag-history-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify live Texas flag cluster
        shell: bash
        run: |
          set -u
          origin='https://texasdefined.com'
          history='/article/history-of-the-texas-flag'
          etiquette='/article/texas-flag-etiquette-display-guide'
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          failed=0

          post_status() {
            local context="$1" state="$2" description="$3"
            python3 - "$state" "$context" "$description" > "$workdir/status.json" <<'PY'
          import json, sys
          print(json.dumps({"state": sys.argv[1], "context": sys.argv[2], "description": sys.argv[3]}))
          PY
            curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${VERIFY_SHA}" \
              --data-binary @"$workdir/status.json" >/dev/null
          }

          fetch_page() {
            local path="$1" output="$2"
            curl --retry 2 --retry-all-errors --retry-delay 1 --max-time 30 \
              --fail-with-body --silent --show-error --location \
              "$origin${path}?production-smoke=${VERIFY_SHA}-${GITHUB_RUN_ID}" -o "$output"
          }

          post_status texas-flag-history-page pending 'Checking live Texas flag history article'
          if fetch_page "$history" "$workdir/history.html" \
            && grep -Fq 'The Texas Flag: A History of the Lone Star' "$workdir/history.html" \
            && grep -Fq 'Who designed the Texas flag?' "$workdir/history.html" \
            && grep -Fq 'The strange legal gap from 1879 to 1933' "$workdir/history.html" \
            && grep -Fq 'Can the Texas flag fly at the same height as the U.S. flag?' "$workdir/history.html" \
            && grep -Fq 'Flag_of_the_Republic_of_Texas_' "$workdir/history.html" \
            && grep -Fq 'Flag_of_Texas_' "$workdir/history.html" \
            && grep -Fq 'FAQPage' "$workdir/history.html" \
            && grep -Fq 'Primary source:' "$workdir/history.html" \
            && grep -Fq 'https://www.tsl.texas.gov/treasures/flagsandmaps/flag-design.html' "$workdir/history.html" \
            && grep -Fq "$etiquette" "$workdir/history.html"; then
            post_status texas-flag-history-page success 'Live history article, figures, source and FAQ schema verified'
          else
            post_status texas-flag-history-page failure 'Live Texas flag history article verification failed'
            failed=1
          fi

          post_status texas-flag-etiquette-page pending 'Checking live Texas flag etiquette article'
          if fetch_page "$etiquette" "$workdir/etiquette.html" \
            && grep -Fq 'Texas Flag Etiquette: How to Display the Lone Star Flag Correctly' "$workdir/etiquette.html" \
            && grep -Fq 'Texas flag and U.S. flag on separate poles' "$workdir/etiquette.html" \
            && grep -Fq 'How to hang the Texas flag vertically' "$workdir/etiquette.html" \
            && grep -Fq 'When should the Texas flag be at half-staff?' "$workdir/etiquette.html" \
            && grep -Fq 'Is Texas the only state that can fly its flag as high as the U.S. flag?' "$workdir/etiquette.html" \
            && grep -Fq 'FAQPage' "$workdir/etiquette.html" \
            && grep -Fq 'Primary source:' "$workdir/etiquette.html" \
            && grep -Fq 'https://www.tsl.texas.gov/ref/abouttx/flagcode.html' "$workdir/etiquette.html" \
            && grep -Fq "$history" "$workdir/etiquette.html"; then
            post_status texas-flag-etiquette-page success 'Live flag etiquette article, source and FAQ schema verified'
          else
            post_status texas-flag-etiquette-page failure 'Live Texas flag etiquette verification failed'
            failed=1
          fi

          post_status texas-flag-symbols-discovery pending 'Checking live Texas Symbols route identity'
          if fetch_page '/texas-symbols' "$workdir/symbols.html" \
            && grep -Fq 'Official Texas Symbols' "$workdir/symbols.html"; then
            post_status texas-flag-symbols-discovery success 'Texas Symbols route verified; source validator covers both flag links'
          else
            post_status texas-flag-symbols-discovery failure 'Texas Symbols route verification failed'
            failed=1
          fi

          post_status texas-flag-history-hub pending 'Checking live Texas History route identity'
          if fetch_page '/texas-history' "$workdir/history-hub.html" \
            && grep -Fq 'Texas History' "$workdir/history-hub.html"; then
            post_status texas-flag-history-hub success 'Texas History route verified; source validator covers curated flag link'
          else
            post_status texas-flag-history-hub failure 'Texas History route verification failed'
            failed=1
          fi

          post_status texas-flag-indexing-signals pending 'Checking robots, canonicals, sitemap freshness and RSS discovery'
          indexing_ok=1
          if ! fetch_page '/robots.txt' "$workdir/robots.txt" || ! grep -Fq 'Sitemap: https://texasdefined.com/sitemap.xml' "$workdir/robots.txt"; then indexing_ok=0; fi
          if ! fetch_page '/sitemap.xml' "$workdir/sitemap.xml"; then
            indexing_ok=0
          else
            grep -Fq "<loc>${origin}${history}</loc><lastmod>2026-08-20</lastmod>" "$workdir/sitemap.xml" || indexing_ok=0
            grep -Fq "<loc>${origin}${etiquette}</loc><lastmod>2026-08-20</lastmod>" "$workdir/sitemap.xml" || indexing_ok=0
            grep -Fq "<loc>${origin}/texas-history</loc><lastmod>2026-08-20</lastmod>" "$workdir/sitemap.xml" || indexing_ok=0
            grep -Fq "<loc>${origin}/texas-symbols</loc><lastmod>2026-08-20</lastmod>" "$workdir/sitemap.xml" || indexing_ok=0
          fi
          if ! fetch_page '/rss.xml' "$workdir/rss.xml" \
            || ! grep -Fq '<rss version="2.0"' "$workdir/rss.xml" \
            || ! grep -Fq "$origin$history" "$workdir/rss.xml" \
            || ! grep -Fq "$origin$etiquette" "$workdir/rss.xml"; then indexing_ok=0; fi
          if [[ -f "$workdir/history.html" ]] \
            && { ! grep -Fq 'https://texasdefined.com/article/history-of-the-texas-flag' "$workdir/history.html" \
              || ! grep -Fq 'application/rss+xml' "$workdir/history.html" \
              || ! grep -Fq '/rss.xml' "$workdir/history.html"; }; then indexing_ok=0; fi
          if [[ -f "$workdir/etiquette.html" ]] && ! grep -Fq 'https://texasdefined.com/article/texas-flag-etiquette-display-guide' "$workdir/etiquette.html"; then indexing_ok=0; fi
          if [[ "$indexing_ok" -eq 1 ]]; then
            post_status texas-flag-indexing-signals success 'Robots, canonicals, fresh sitemap dates and RSS discovery verified'
          else
            post_status texas-flag-indexing-signals failure 'Texas flag indexing-signal verification failed'
            failed=1
          fi

          if [[ "$failed" -eq 0 ]]; then
            post_status texas-flag-history-production success 'Live Texas flag content cluster verified'
            exit 0
          fi
          post_status texas-flag-history-production failure 'One or more Texas flag live checks failed'
          exit 1
