name: Texas flag history production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flag-history-production-smoke.yml'
  workflow_run:
    workflows: ["Deploy TexasDefined production"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: texas-flag-history-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify live Texas flag cluster
        shell: bash
        run: |
          set -u
          origin='https://texasdefined.com'
          history='/article/history-of-the-texas-flag'
          etiquette='/article/texas-flag-etiquette-display-guide'
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          failed=0

          post_status() {
            local context="$1" state="$2" description="$3"
            python3 - "$state" "$context" "$description" > "$workdir/status.json" <<'PY'
          import json, sys
          print(json.dumps({"state": sys.argv[1], "context": sys.argv[2], "description": sys.argv[3]}))
          PY
            curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${VERIFY_SHA}" \
              --data-binary @"$workdir/status.json" >/dev/null
          }

          fetch_page() {
            local path="$1" output="$2"
            curl --retry 2 --retry-all-errors --retry-delay 1 --max-time 30 \
              --fail-with-body --silent --show-error --location \
              "$origin${path}?production-smoke=${VERIFY_SHA}-${GITHUB_RUN_ID}" -o "$output"
          }

          html_to_text() {
            local input="$1" output="$2"
            python3 - "$input" "$output" <<'PY'
          from html.parser import HTMLParser
          import re, sys

          class VisibleText(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.parts = []
                  self.suppressed = 0
              def handle_starttag(self, tag, attrs):
                  if tag in {"script", "style", "noscript"}:
                      self.suppressed += 1
              def handle_endtag(self, tag):
                  if tag in {"script", "style", "noscript"} and self.suppressed:
                      self.suppressed -= 1
              def handle_data(self, data):
                  if not self.suppressed and data.strip():
                      self.parts.append(data)

          parser = VisibleText()
          with open(sys.argv[1], encoding="utf-8") as handle:
              parser.feed(handle.read())
          text = re.sub(r"\s+", " ", " ".join(parser.parts)).strip()
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              handle.write(text)
          PY
          }

          require_text() {
            local label="$1" needle="$2" file="$3"
            if grep -Fq "$needle" "$file"; then return 0; fi
            echo "::error title=${label} visible-text check failed::Missing rendered text: ${needle}"
            return 1
          }

          require_raw() {
            local label="$1" needle="$2" file="$3"
            if grep -Fq "$needle" "$file"; then return 0; fi
            echo "::error title=${label} markup check failed::Missing raw marker: ${needle}"
            return 1
          }

          post_status texas-flag-history-page pending 'Checking live Texas flag history article'
          if fetch_page "$history" "$workdir/history.html" \
            && html_to_text "$workdir/history.html" "$workdir/history.txt" \
            && require_text history 'The Texas Flag: A History of the Lone Star' "$workdir/history.txt" \
            && require_text history 'Who designed the Texas flag?' "$workdir/history.txt" \
            && require_text history 'The strange legal gap from 1879 to 1933' "$workdir/history.txt" \
            && require_text history 'Can the Texas flag fly at the same height as the U.S. flag?' "$workdir/history.txt" \
            && require_raw history 'Flag_of_the_Republic_of_Texas_' "$workdir/history.html" \
            && require_raw history 'Flag_of_Texas_' "$workdir/history.html" \
            && require_raw history 'FAQPage' "$workdir/history.html" \
            && require_text history 'Primary source:' "$workdir/history.txt" \
            && require_raw history 'https://www.tsl.texas.gov/treasures/flagsandmaps/flag-design.html' "$workdir/history.html" \
            && require_raw history "$etiquette" "$workdir/history.html"; then
            post_status texas-flag-history-page success 'Live history article, figures, source and FAQ schema verified'
          else
            post_status texas-flag-history-page failure 'Live Texas flag history article verification failed'
            failed=1
          fi

          post_status texas-flag-etiquette-page pending 'Checking live Texas flag etiquette article'
          if fetch_page "$etiquette" "$workdir/etiquette.html" \
            && html_to_text "$workdir/etiquette.html" "$workdir/etiquette.txt" \
            && require_text etiquette 'Texas Flag Etiquette: How to Display the Lone Star Flag Correctly' "$workdir/etiquette.txt" \
            && require_text etiquette 'Texas flag and U.S. flag on separate poles' "$workdir/etiquette.txt" \
            && require_text etiquette 'How to hang the Texas flag vertically' "$workdir/etiquette.txt" \
            && require_text etiquette 'When should the Texas flag be at half-staff?' "$workdir/etiquette.txt" \
            && require_text etiquette 'Is Texas the only state that can fly its flag as high as the U.S. flag?' "$workdir/etiquette.txt" \
            && require_raw etiquette 'FAQPage' "$workdir/etiquette.html" \
            && require_text etiquette 'Primary source:' "$workdir/etiquette.txt" \
            && require_raw etiquette 'https://www.tsl.texas.gov/ref/abouttx/flagcode.html' "$workdir/etiquette.html" \
            && require_raw etiquette "$history" "$workdir/etiquette.html"; then
            post_status texas-flag-etiquette-page success 'Live flag etiquette article, source and FAQ schema verified'
          else
            post_status texas-flag-etiquette-page failure 'Live Texas flag etiquette verification failed'
            failed=1
          fi

          post_status texas-flag-symbols-discovery pending 'Checking live Texas Symbols route identity'
          if fetch_page '/texas-symbols' "$workdir/symbols.html" \
            && grep -Fq 'Official Texas Symbols' "$workdir/symbols.html"; then
            post_status texas-flag-symbols-discovery success 'Texas Symbols route verified; source validator covers both flag links'
          else
            post_status texas-flag-symbols-discovery failure 'Texas Symbols route verification failed'
            failed=1
          fi

          post_status texas-flag-history-hub pending 'Checking live Texas History route identity'
          if fetch_page '/texas-history' "$workdir/history-hub.html" \
            && grep -Fq 'Texas History' "$workdir/history-hub.html"; then
            post_status texas-flag-history-hub success 'Texas History route verified; source validator covers curated flag link'
          else
            post_status texas-flag-history-hub failure 'Texas History route verification failed'
            failed=1
          fi

          post_status texas-flag-indexing-signals pending 'Checking robots, canonicals, sitemap freshness and RSS discovery'
          indexing_ok=1
          if ! fetch_page '/robots.txt' "$workdir/robots.txt" || ! grep -Fq 'Sitemap: https://texasdefined.com/sitemap.xml' "$workdir/robots.txt"; then
            echo '::error title=Flag indexing check failed::robots.txt sitemap discovery marker missing'
            indexing_ok=0
          fi
          if ! fetch_page '/sitemap.xml' "$workdir/sitemap.xml"; then
            echo '::error title=Flag indexing check failed::sitemap.xml could not be fetched'
            indexing_ok=0
          else
            grep -Fq "<loc>${origin}${history}</loc><lastmod>2026-08-20</lastmod>" "$workdir/sitemap.xml" || { echo '::error title=Flag indexing check failed::history article sitemap lastmod marker missing'; indexing_ok=0; }
            grep -Fq "<loc>${origin}${etiquette}</loc><lastmod>2026-08-20</lastmod>" "$workdir/sitemap.xml" || { echo '::error title=Flag indexing check failed::etiquette article sitemap lastmod marker missing'; indexing_ok=0; }
            grep -Fq "<loc>${origin}/texas-history</loc><lastmod>2026-08-20</lastmod>" "$workdir/sitemap.xml" || { echo '::error title=Flag indexing check failed::Texas History hub sitemap lastmod marker missing'; indexing_ok=0; }
            grep -Fq "<loc>${origin}/texas-symbols</loc><lastmod>2026-08-20</lastmod>" "$workdir/sitemap.xml" || { echo '::error title=Flag indexing check failed::Texas Symbols sitemap lastmod marker missing'; indexing_ok=0; }
          fi
          if ! fetch_page '/rss.xml' "$workdir/rss.xml"; then
            echo '::error title=Flag indexing check failed::rss.xml could not be fetched'
            indexing_ok=0
          else
            grep -Fq '<rss version="2.0"' "$workdir/rss.xml" || { echo '::error title=Flag indexing check failed::RSS 2.0 root marker missing'; indexing_ok=0; }
            grep -Fq "$origin$history" "$workdir/rss.xml" || { echo '::error title=Flag indexing check failed::history article is missing from RSS'; indexing_ok=0; }
            grep -Fq "$origin$etiquette" "$workdir/rss.xml" || { echo '::error title=Flag indexing check failed::etiquette article is missing from RSS'; indexing_ok=0; }
          fi
          if [[ -f "$workdir/history.html" ]] \
            && { ! grep -Fq 'https://texasdefined.com/article/history-of-the-texas-flag' "$workdir/history.html" \
              || ! grep -Fq 'application/rss+xml' "$workdir/history.html" \
              || ! grep -Fq '/rss.xml' "$workdir/history.html"; }; then
            echo '::error title=Flag indexing check failed::history article canonical or RSS alternate marker missing'
            indexing_ok=0
          fi
          if [[ -f "$workdir/etiquette.html" ]] && ! grep -Fq 'https://texasdefined.com/article/texas-flag-etiquette-display-guide' "$workdir/etiquette.html"; then
            echo '::error title=Flag indexing check failed::etiquette article canonical marker missing'
            indexing_ok=0
          fi
          if [[ "$indexing_ok" -eq 1 ]]; then
            post_status texas-flag-indexing-signals success 'Robots, canonicals, fresh sitemap dates and RSS discovery verified'
          else
            post_status texas-flag-indexing-signals failure 'Texas flag indexing-signal verification failed'
            failed=1
          fi

          if [[ "$failed" -eq 0 ]]; then
            post_status texas-flag-history-production success 'Live Texas flag content cluster verified'
            exit 0
          fi
          post_status texas-flag-history-production failure 'One or more Texas flag live checks failed'
          exit 1
