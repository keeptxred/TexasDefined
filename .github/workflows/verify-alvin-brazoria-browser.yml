name: Alvin Brazoria desktop and mobile production acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/ci/verify-alvin-brazoria-browser.mjs'
      - '.github/workflows/verify-alvin-brazoria-browser.yml'
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: alvin-brazoria-browser-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser verifier syntax
        run: node --check scripts/ci/verify-alvin-brazoria-browser.mjs
      - name: Download exact deployment change plan
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: production-change-plan-${{ github.event.workflow_run.id }}
          path: .artifacts/deployed-change-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Scope live verification to relevant successful deployments
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            EXPECTED_HEAD="$(git rev-parse HEAD)" node --input-type=module -e '
              import {readFileSync, appendFileSync} from "node:fs";
              const plan = JSON.parse(readFileSync(".artifacts/deployed-change-plan/production-change-plan.json", "utf8"));
              if (plan.head !== process.env.EXPECTED_HEAD || !Array.isArray(plan.changedFiles) || !plan.changedFiles.every(file => typeof file === "string")) throw new Error("Deployment plan missing or does not match verified source SHA");
              const relevant = /alvin-brazoria|brazoria-county|city-authority-profiles|county-profile|local-government-profile|CountyGuideSections|CountyTaxRateSection|EntityDepthSections|texas-icons-research-sports-1|galveston-county-island-port-juneteenth|AlvinHistoricalPhotographs|MuseumAuthorityNetworkSection|museum-authority-new-destinations|museum-authority-network|museum-visitor-faqs|museum-verification-manifest/;
              const run = plan.changedFiles.some(file => relevant.test(file));
              appendFileSync(process.env.GITHUB_OUTPUT, `run=${run}\n`);
              console.log(`Browser acceptance ${run ? "required" : "not in deployment scope"}; baseline ${plan.baseline ?? "unknown"}, head ${plan.head}`);
            '
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install isolated Chrome dependency
        if: steps.scope.outputs.run == 'true'
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/td-alvin-browser --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify all three published guides in JS-disabled and hydrated desktop/mobile Chrome
        if: steps.scope.outputs.run == 'true'
        run: node scripts/ci/verify-alvin-brazoria-browser.mjs
      - name: Verify full civic sources and deployed content after production release
        if: always() && steps.scope.outputs.run == 'true' && github.event_name != 'pull_request'
        run: node scripts/data/verify-alvin-brazoria-authority.mjs
      - name: Preserve complete dated source verification evidence
        if: always() && steps.scope.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: alvin-brazoria-authority-${{ github.run_id }}
          path: artifacts/alvin-brazoria-authority/latest.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve full report and browser evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: alvin-brazoria-browser-${{ github.run_id }}
          path: artifacts/alvin-brazoria-browser/
          if-no-files-found: error
          retention-days: 30
