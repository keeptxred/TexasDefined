name: Football Batch 003 Apple Springs production retest
on:
  pull_request:
    paths:
      - "scripts/ci/verify-football-batch-003-apple-springs.mjs"
      - ".github/workflows/verify-football-batch-003-apple-springs.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football-batch-003-apple-springs-final-retest
  cancel-in-progress: false
jobs:
  apple-springs-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare isolated Chrome browser
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-wp-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Retest corrected Apple Springs production title, metadata and browser
        run: node scripts/ci/verify-football-batch-003-apple-springs.mjs
      - name: Upload independent desktop/mobile screenshots and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-003-apple-springs-final-acceptance
          path: artifacts/football-batch-003-apple-springs/
          if-no-files-found: warn
          retention-days: 14
