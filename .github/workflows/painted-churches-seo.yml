name: Painted Churches SEO Authority

on:
  push:
    branches: [main, painted-churches-authority-preindex]
    paths:
      - "src/routes/explore.painted-churches*"
      - "src/routes/painted-churches*"
      - "src/routes/explore.trip-planner.tsx"
      - "src/routes/guides.tsx"
      - "src/data/painted-church*"
      - "src/components/editorial/PaintedChurch*"
      - "src/components/editorial/ExploreTopicPaths.tsx"
      - "src/components/content/CountyGuideSections.tsx"
      - "src/components/authority/CitationCollectionTrustRouter.tsx"
      - "src/lib/public-routes.ts"
      - "src/lib/painted-church-publication.ts"
      - "src/lib/seo.ts"
      - "src/routes/sitemap-explore[.]xml.ts"
      - "src/routes/citation-guide.tsx"
      - "src/routes/llms[.]txt.ts"
      - "public/citation-magnets.json"
      - "scripts/data/validate-painted-churches-seo.mjs"
      - "scripts/data/validate-painted-church-map.mjs"
      - "scripts/data/validate-painted-church-search-intents.mjs"
      - "scripts/data/validate-painted-church-completion.mjs"
      - "scripts/data/validate-painted-church-preindex.mjs"
      - "scripts/data/validate-painted-church-preindex-readiness.mjs"
      - ".github/workflows/painted-churches-seo.yml"
  pull_request:
    paths:
      - "src/routes/explore.painted-churches*"
      - "src/routes/painted-churches*"
      - "src/routes/explore.trip-planner.tsx"
      - "src/routes/guides.tsx"
      - "src/data/painted-church*"
      - "src/components/editorial/PaintedChurch*"
      - "src/components/editorial/ExploreTopicPaths.tsx"
      - "src/components/content/CountyGuideSections.tsx"
      - "src/components/authority/CitationCollectionTrustRouter.tsx"
      - "src/lib/public-routes.ts"
      - "src/lib/painted-church-publication.ts"
      - "src/lib/seo.ts"
      - "src/routes/sitemap-explore[.]xml.ts"
      - "src/routes/citation-guide.tsx"
      - "src/routes/llms[.]txt.ts"
      - "public/citation-magnets.json"
      - "scripts/data/validate-painted-churches-seo.mjs"
      - "scripts/data/validate-painted-church-map.mjs"
      - "scripts/data/validate-painted-church-search-intents.mjs"
      - "scripts/data/validate-painted-church-completion.mjs"
      - "scripts/data/validate-painted-church-preindex.mjs"
      - "scripts/data/validate-painted-church-preindex-readiness.mjs"
      - ".github/workflows/painted-churches-seo.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Painted Churches SEO/AEO/authority contract
        run: node scripts/data/validate-painted-churches-seo.mjs
      - name: Validate Painted Churches search-intent coverage
        run: node scripts/data/validate-painted-church-search-intents.mjs
      - name: Validate Painted Churches interactive map and 32-church authority contract
        run: node scripts/data/validate-painted-church-map.mjs
      - name: Validate Painted Churches completion surfaces
        run: node scripts/data/validate-painted-church-completion.mjs
      - name: Validate Painted Churches pre-index authority readiness
        run: node scripts/data/validate-painted-church-preindex-readiness.mjs
