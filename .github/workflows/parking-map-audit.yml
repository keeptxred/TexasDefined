name: Parking map coverage

on:
  pull_request:
    paths:
      - 'src/data/parking-map-model.ts'
      - 'src/data/parking-maps.ts'
      - 'src/data/parking-maps-batch*.ts'
      - 'src/data/parking-maps-event-batch*.ts'
      - 'src/data/parking-maps.functions.ts'
      - 'src/components/parking/**'
      - 'src/components/sports/**'
      - 'src/routes/event.$slug*'
      - 'public/images/parking-maps/**'
      - 'scripts/data/audit-parking-map-coverage.mjs'
      - 'scripts/data/audit-event-parking-map-overrides.mjs'
      - '.github/workflows/parking-map-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit parking map coverage
        run: node scripts/data/audit-parking-map-coverage.mjs
      - name: Audit event parking overrides
        run: node scripts/data/audit-event-parking-map-overrides.mjs
      - name: Production build
        run: npm run build
