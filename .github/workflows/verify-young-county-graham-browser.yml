name: Verify Young County Graham production browser
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/verify-young-county-graham-browser.mjs'
      - '.github/workflows/verify-young-county-graham-browser.yml'
  workflow_run:
    workflows: ['Deploy TexasDefined production']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Skip live Chromium QA on unrelated deployments
        id: qa_scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^ HEAD > /tmp/td-qa-changed-files.txt
          if grep -Eiq '^(src/(routes/(\$kind|destination|explore|texas-old-west|county)|components/(content|authority)|data/(county|destination|knowledge-graph))|scripts/ci/verify-young-county-graham-browser[.]mjs|[.]github/workflows/verify-young-county-graham-browser[.]yml)' /tmp/td-qa-changed-files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Relevant deployed source changed: run focused browser QA."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Unrelated deploy: skip specialized production Chromium QA."
          fi
      - name: Guard historical deployments before QA script existed
        id: scope
        run: |
          if test -f scripts/ci/verify-young-county-graham-browser.mjs && [[ "${{ steps.qa_scope.outputs.run }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: steps.scope.outputs.run == 'true'
        run: node --check scripts/ci/verify-young-county-graham-browser.mjs
      - name: Install isolated browser driver
        if: steps.scope.outputs.run == 'true'
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-young-county-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify Graham museum photos and seven connected live pages
        if: steps.scope.outputs.run == 'true'
        env:
          # The legacy Young County article has been retired in production.
          # Every current PR/deploy acceptance must require the canonical county
          # guide and reject the redirected legacy article link.
          REQUIRE_CANONICAL_HISTORY: '1'
        run: node scripts/ci/verify-young-county-graham-browser.mjs
      - name: Retain desktop and mobile screenshots and acceptance results
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: young-county-graham-live-acceptance
          path: artifacts/young-county-graham-browser/
          if-no-files-found: warn
          retention-days: 30
