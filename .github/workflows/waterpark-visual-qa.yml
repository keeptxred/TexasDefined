name: Waterpark post-release visual QA

on:
  workflow_run:
    workflows: ["Deploy TexasDefined production"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waterparks-postdeploy-qa-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  bounded-browser:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Exact waterpark SSR, images and mobile Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exactly released main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Detect related waterpark code changes
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] ||
            git diff --name-only HEAD^ HEAD -- src/data/texas-water-parks.ts src/routes/explore.water-parks.\$slug.lazy.tsx scripts/ci/verify-waterpark-live-visual.mjs .github/workflows/waterpark-visual-qa.yml |
              grep -q .; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "No new waterpark code/photo changes in this successful production deploy; bounded browser QA not required."
          fi
      - name: Node.js 22
        if: steps.scope.outputs.changed == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated free GitHub-runner browser driver
        if: steps.scope.outputs.changed == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-waterpark-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify QA scenario contract
        if: steps.scope.outputs.changed == 'yes'
        run: node scripts/ci/verify-waterpark-live-visual.mjs --self-test
      - name: Verify five exact waterpark pages in two Chrome viewports
        if: steps.scope.outputs.changed == 'yes'
        env:
          TARGET_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/ci/verify-waterpark-live-visual.mjs
      - name: Retain screenshots and machine-readable evidence
        if: always() && steps.scope.outputs.changed == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: waterpark-live-visual-${{ github.run_id }}
          path: artifacts/waterpark-live-visual/
          if-no-files-found: warn
          retention-days: 14
