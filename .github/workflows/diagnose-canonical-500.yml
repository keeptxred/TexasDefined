name: Diagnose canonical 500

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-canonical-500.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture canonical-domain failures
        shell: bash
        run: |
          mkdir -p artifacts
          npx wrangler deployments status --json > artifacts/deployment-status.json 2> artifacts/deployment-status.stderr || true
          npx wrangler versions list --json > artifacts/versions.json 2> artifacts/versions.stderr || true

          timeout 45s npx wrangler tail texasdefined-site --format json --status error > artifacts/worker-tail-errors.jsonl 2> artifacts/worker-tail.stderr &
          TAIL_PID=$!
          sleep 4

          : > artifacts/probes.tsv
          for i in 1 2 3 4 5 6; do
            for origin in "https://texasdefined.com" "https://texasdefined-site.freddy-coppola.workers.dev"; do
              safe_name=$(echo "$origin" | sed -E 's#https?://##; s#[^A-Za-z0-9.-]+#-#g')
              url="${origin}/?canonical_diag=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${i}"
              status=$(curl -sS --max-time 15 -D "artifacts/${safe_name}-${i}.headers" -o "artifacts/${safe_name}-${i}.html" -w '%{http_code}' "$url" || echo curl-error)
              printf '%s\t%s\t%s\n' "$origin" "$i" "$status" >> artifacts/probes.tsv
            done
            sleep 2
          done

          wait "$TAIL_PID" || true
          echo 'Probe results:'
          cat artifacts/probes.tsv

      - name: Upload canonical diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-500-diagnostics-${{ github.run_id }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14
