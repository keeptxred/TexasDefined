name: Verify lighthouse seasonal production

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: lighthouse-seasonal-production
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Verify expanded lighthouse guides live
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Probe direct Worker and custom domain
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origins = [
            ['direct-worker', 'https://texasdefined-site.freddy-coppola.workers.dev'],
            ['custom-domain', 'https://texasdefined.com'],
          ];

          const articles = [
            {
              slug: 'port-isabel-lighthouse-guide',
              required: [
                'Why Point Isabel needed a lighthouse',
                'The Fresnel lens brought light back in 2022',
                'What the climb actually involves',
                'The reason to climb is bigger than the panorama',
              ],
              forbidden: ['Why the light went dark'],
            },
            {
              slug: 'lost-lighthouses-of-texas',
              required: [
                'Brazos Santiago: a lighthouse lost to war and a changing harbor',
                'Matagorda Bay lost lights to war and hurricanes',
                'What \'lost\' actually means on the Texas coast',
                'The missing towers tell the larger Texas story',
              ],
              forbidden: ['The names worth knowing'],
            },
          ];

          function visibleText(html) {
            return html
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ')
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&nbsp;/gi, ' ')
              .replace(/&amp;/gi, '&')
              .replace(/&quot;/gi, '"')
              .replace(/&#39;|&#x27;|&apos;/gi, "'")
              .replace(/&lt;/gi, '<')
              .replace(/&gt;/gi, '>')
              .replace(/\s+/g, ' ')
              .trim();
          }

          async function probe(originLabel, origin, article, mode) {
            const revision = mode === 'revision'
              ? `?lighthouse-authority=${encodeURIComponent(`${process.env.DEPLOY_SHA ?? 'local'}-${Date.now()}-${article.slug}`)}`
              : '';
            const url = `${origin}/article/${article.slug}${revision}`;
            let last = '';

            for (let attempt = 1; attempt <= 6; attempt += 1) {
              try {
                const response = await fetch(url, {
                  redirect: 'follow',
                  cache: 'no-store',
                  signal: AbortSignal.timeout(30_000),
                  headers: { 'user-agent': 'TexasDefined-CI-Lighthouse-Seasonal-Authority/1.0' },
                });
                const html = await response.text();
                const text = visibleText(html);
                const reading = text.match(/About\s+(\d+)\s+minutes?\b/i);
                const minutes = reading ? Number(reading[1]) : null;
                const missing = article.required.filter((needle) => !text.includes(needle));
                const stale = article.forbidden.filter((needle) => text.includes(needle));
                const status = `status=${response.status} reading=${minutes ?? 'missing'} missing=${missing.length} stale=${stale.length} cf-cache=${response.headers.get('cf-cache-status') ?? 'none'}`;
                console.log(`[${originLabel}:${article.slug}:${mode}] attempt ${attempt} ${status}`);
                if (response.ok && minutes !== null && minutes >= 5 && missing.length === 0 && stale.length === 0) return;
                last = `${status}; missing=${missing.join(' | ') || 'none'}; stale=${stale.join(' | ') || 'none'}`;
              } catch (error) {
                last = error instanceof Error ? error.message : String(error);
                console.log(`[${originLabel}:${article.slug}:${mode}] attempt ${attempt} error=${last}`);
              }
              if (attempt < 6) await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            throw new Error(`${originLabel}:${article.slug}:${mode} failed: ${last}`);
          }

          const checks = [];
          for (const [originLabel, origin] of origins) {
            for (const article of articles) {
              for (const mode of ['canonical', 'revision']) checks.push(probe(originLabel, origin, article, mode));
            }
          }

          const results = await Promise.allSettled(checks);
          const failures = results
            .filter((result) => result.status === 'rejected')
            .map((result) => result.reason instanceof Error ? result.reason.message : String(result.reason));

          if (failures.length) {
            for (const failure of failures) console.error(`::error title=Lighthouse authority production mismatch::${failure}`);
            process.exit(1);
          }

          console.log('Verified Port Isabel and Lost Lighthouses on direct Worker and custom domain, canonical and cache-busted, with expanded authority content and rendered reading time >= 5 minutes.');
          NODE
