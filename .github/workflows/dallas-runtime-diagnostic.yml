name: Dallas county runtime diagnostic

on:
  push:
    branches:
      - fix/dallas-county-production-runtime-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start local TexasDefined runtime
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/texasdefined-vite.log 2>&1 &
          echo $! > /tmp/texasdefined-vite.pid
      - name: Wait for runtime
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/texasdefined-vite.log
          exit 1
      - name: Capture Dallas and controls
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for county in dallas harris travis; do
            html="/tmp/${county}.html"
            status=$(curl --silent --show-error --output "$html" --write-out '%{http_code}' "http://127.0.0.1:4173/county/${county}" || true)
            words=$(python3 -c 'import re,sys,pathlib; p=pathlib.Path(sys.argv[1]); text=p.read_text(errors="ignore") if p.exists() else ""; text=re.sub(r"<script\\b[^>]*>[\\s\\S]*?</script>|<style\\b[^>]*>[\\s\\S]*?</style>|<[^>]+>", " ", text, flags=re.I); print(len(re.findall(r"[A-Za-z0-9]+(?:[’\x27-][A-Za-z0-9]+)*", text)))' "$html")
            feature=no; facts=no; heading=no
            grep -Fqi "The story of" "$html" && feature=yes
            grep -Fqi "The county in numbers" "$html" && facts=yes
            grep -Fqi "<h1" "$html" && heading=yes
            echo "$county status=$status words=$words h1=$heading feature=$feature facts=$facts"
            if [[ "$county" == dallas && ( "$status" != 200 || "$heading" != yes || "$feature" != yes || "$facts" != yes ) ]]; then
              failed=1
            fi
          done
          echo '--- Dallas response markers ---'
          grep -Eio '.{0,120}(error|dallas|county feature|the county in numbers).{0,180}' /tmp/dallas.html | head -80 || true
          echo '--- Runtime log ---'
          cat /tmp/texasdefined-vite.log || true
          exit "$failed"
      - name: Stop runtime
        if: always()
        run: |
          if [ -f /tmp/texasdefined-vite.pid ]; then kill "$(cat /tmp/texasdefined-vite.pid)" || true; fi
