name: Validate event occurrence lifecycle

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate event occurrence lifecycle
        run: node scripts/data/validate-event-occurrence-lifecycle.mjs
      - name: Validate Google Event rich-result contract
        run: node scripts/data/validate-google-event-rich-results.mjs
      - name: Validate State Fair Event lifecycle
        run: node scripts/data/validate-state-fair-event-lifecycle.mjs
