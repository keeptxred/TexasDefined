name: Texas Icons Registry

on:
  pull_request:
    paths:
      - "src/data/texas-icons-types.ts"
      - "src/data/texas-icons-roster.server.ts"
      - "src/data/texas-icons-roster-corrections.server.ts"
      - "src/data/texas-icons-source-*.server.ts"
      - "src/data/texas-icons-research-*.server.ts"
      - "src/data/texas-icons-editorial-holds.server.ts"
      - "src/data/texas-icons.server.ts"
      - "src/data/texas-icons.functions.ts"
      - "src/lib/public-routes.ts"
      - "src/routes/texas-icons.tsx"
      - "src/routes/texas-icons_.$slug.tsx"
      - "scripts/data/validate-texas-icons*.mjs"
      - "scripts/data/audit-texas-icons*.mjs"
      - ".github/workflows/texas-icons-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Texas Icons registry
        run: node scripts/data/validate-texas-icons.mjs
      - name: Validate Texas Icons music reuse and research
        run: node scripts/data/validate-texas-icons-music.mjs
      - name: Validate Texas Icons music ranks 81-90
        run: node scripts/data/validate-texas-icons-music-batch4.mjs
      - name: Validate Texas Icons music ranks 91-100
        run: node scripts/data/validate-texas-icons-music-batch5.mjs
      - name: Validate Texas Icons sports ranks 101-110
        run: node scripts/data/validate-texas-icons-sports-batch1.mjs
      - name: Validate Texas Icons sports ranks 111-120
        run: node scripts/data/validate-texas-icons-sports-batch2.mjs
      - name: Validate Texas Icons sports ranks 121-130
        run: node scripts/data/validate-texas-icons-sports-batch3.mjs
      - name: Validate Texas Icons sports ranks 131-140
        run: node scripts/data/validate-texas-icons-sports-batch4.mjs
      - name: Validate Texas Icons sports ranks 141-150
        run: node scripts/data/validate-texas-icons-sports-batch5.mjs
      - name: Validate Texas Icons business ranks 151-160
        run: node scripts/data/validate-texas-icons-business-batch1.mjs
      - name: Validate Texas Icons business ranks 161-170
        run: node scripts/data/validate-texas-icons-business-batch2.mjs
      - name: Validate Texas Icons business ranks 171-180
        run: node scripts/data/validate-texas-icons-business-batch3.mjs
      - name: Validate Texas Icons business ranks 181-190
        run: node scripts/data/validate-texas-icons-business-batch4.mjs
      - name: Validate Texas Icons media ranks 191-200
        run: node scripts/data/validate-texas-icons-media-batch1.mjs
      - name: Validate Texas Icons media ranks 201-210
        run: node scripts/data/validate-texas-icons-media-batch2.mjs
      - name: Validate Texas Icons media ranks 211-220
        run: node scripts/data/validate-texas-icons-media-batch3.mjs
      - name: Validate Texas Icons media ranks 221-225
        run: node scripts/data/validate-texas-icons-media-batch4.mjs
      - name: Validate Texas Icons symbols ranks 226-235
        run: node scripts/data/validate-texas-icons-symbols-batch1.mjs
      - name: Validate Texas Icons symbols ranks 236-245
        run: node scripts/data/validate-texas-icons-symbols-batch2.mjs
      - name: Validate Texas Icons symbols ranks 246-250
        run: node scripts/data/validate-texas-icons-symbols-batch3.mjs
      - name: Validate Texas Icons explicit roster corrections
        run: node scripts/data/validate-texas-icons-roster-corrections.mjs
      - name: Validate Texas Icons disputed-intake editorial holds
        run: node scripts/data/validate-texas-icons-editorial-holds.mjs
      - name: Validate Texas Icons terminal accounting
        run: node scripts/data/validate-texas-icons-terminal-accounting.mjs
      - name: Validate Texas Icons place cross-links
        run: node scripts/data/validate-texas-icons-place-crosslinks.mjs
      - name: Validate Texas Icons category authority links
        run: node scripts/data/validate-texas-icons-category-authority-links.mjs
      - name: Validate Texas Icons research readiness boundary
        run: node scripts/data/validate-texas-icons-readiness.mjs
      - name: Audit Texas Icons content depth and SEO
        run: node scripts/data/audit-texas-icons-content-seo.mjs
      - name: Validate Texas Icons server isolation
        run: node scripts/data/validate-texas-icons-server-isolation.mjs
      - name: Production build
        run: npm run build
      - name: Protected client bundle budget
        run: npm run performance:validate
