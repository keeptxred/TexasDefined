name: Temporary CSS delta diagnostic

on:
  push:
    branches:
      - feature/advertiser-partnership-platform-finalize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-css:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build PR head
        shell: bash
        run: |
          npm ci
          npm run build
          HEAD_CSS=$(find dist/client/assets -type f -name '*.css' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          cp "$HEAD_CSS" /tmp/head.css
          wc -c /tmp/head.css
      - name: Build current main
        shell: bash
        run: |
          git fetch origin main
          git checkout --detach origin/main
          npm ci
          npm run build
          BASE_CSS=$(find dist/client/assets -type f -name '*.css' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          cp "$BASE_CSS" /tmp/base.css
          wc -c /tmp/base.css
      - name: Write exact CSS delta
        shell: bash
        run: |
          mkdir -p tmp
          python - <<'PY' > tmp/css-delta.txt
          from difflib import SequenceMatcher
          base = open('/tmp/base.css', encoding='utf-8').read()
          head = open('/tmp/head.css', encoding='utf-8').read()
          print(f'BASE_BYTES={len(base.encode())}')
          print(f'HEAD_BYTES={len(head.encode())}')
          print(f'DELTA_BYTES={len(head.encode()) - len(base.encode())}')
          sm = SequenceMatcher(None, base, head, autojunk=False)
          for tag, i1, i2, j1, j2 in sm.get_opcodes():
              if tag == 'equal':
                  continue
              print(f'\nOP={tag} BASE[{i1}:{i2}] HEAD[{j1}:{j2}]')
              print('BASE_CONTEXT=' + repr(base[max(0,i1-180):min(len(base),i2+180)]))
              print('HEAD_CONTEXT=' + repr(head[max(0,j1-180):min(len(head),j2+180)]))
          PY
          cat tmp/css-delta.txt
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-css-delta
          path: tmp/css-delta.txt
          if-no-files-found: error
          retention-days: 1
