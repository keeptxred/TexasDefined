name: Certify Hartley County live v2 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/certify-hartley-live-v2-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      COUNTY_URL: 'https://texasdefined.com/county/hartley'
      LEGACY_URL: 'https://texasdefined.com/article/hartley-county-channing-xit-ranch-high-plains-texas'
      HERO_URL: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Hartley_County_Courthouse_%28Built_1906%29_Channing%2C_Texas.jpg?width=1600'
    steps:
      - name: Publish started
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"hartley-live-v2","description":"Checking live Hartley county surfaces"}' >/dev/null

      - name: Verify county page
        id: page
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"; trap 'rm -f "$page"' EXIT
          ok=0
          for attempt in 1 2 3 4 5 6; do
            code="$(curl --silent --show-error --location --max-time 30 -A 'TexasDefined county certification/1.0' -o "$page" -w '%{http_code}' "${COUNTY_URL}?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$code" = 200 ] \
              && grep -Fq 'Hartley County: Channing, XIT Ranch Country and the Northwest Panhandle' "$page" \
              && grep -Fq 'The county in numbers' "$page" \
              && grep -Fq 'County property-tax resources' "$page"; then
              ok=1; break
            fi
            sleep 5
          done
          test "$ok" = 1
      - name: Publish page result
        if: always()
        shell: bash
        run: |
          state='${{ steps.page.outcome }}'; [ "$state" = success ] || state=failure
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "{\"state\":\"$state\",\"context\":\"hartley-page\",\"description\":\"Hartley county page structured/editorial gate: $state\"}" >/dev/null

      - name: Verify legacy redirect
        id: redirect
        if: ${{ steps.page.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"; trap 'rm -f "$headers"' EXIT
          code="$(curl --silent --show-error --max-time 30 --output /dev/null --dump-header "$headers" --write-out '%{http_code}' "$LEGACY_URL")"
          test "$code" = 301
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$headers")"
          case "$location" in https://texasdefined.com/county/hartley*|/county/hartley*) ;; *) exit 1;; esac
      - name: Publish redirect result
        if: always()
        shell: bash
        run: |
          state='${{ steps.redirect.outcome }}'; [ "$state" = success ] || state=failure
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "{\"state\":\"$state\",\"context\":\"hartley-redirect-v2\",\"description\":\"Hartley legacy 301 gate: $state\"}" >/dev/null

      - name: Verify hero HTTP and MIME
        id: hero
        if: ${{ steps.redirect.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp)"; headers="$(mktemp)"; trap 'rm -f "$out" "$headers"' EXIT
          ok=0
          for attempt in 1 2 3 4 5 6; do
            : > "$headers"
            if curl --fail-with-body --silent --show-error --location --max-time 40 -A 'TexasDefined county certification/1.0 (+https://texasdefined.com)' -D "$headers" "$HERO_URL" -o "$out"; then
              ctype="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); value=$0} END{sub(/^[^:]+:[[:space:]]*/,"",value); print value}' "$headers")"
              case "$ctype" in image/jpeg*|image/png*|image/webp*) ok=1; break;; esac
            fi
            sleep 4
          done
          test "$ok" = 1
          test "$(wc -c < "$out")" -gt 50000
      - name: Publish hero result
        if: always()
        shell: bash
        run: |
          state='${{ steps.hero.outcome }}'; [ "$state" = success ] || state=failure
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "{\"state\":\"$state\",\"context\":\"hartley-hero-v2\",\"description\":\"Hartley hero HTTP/MIME gate: $state\"}" >/dev/null

      - name: Publish overall success
        if: ${{ steps.hero.outcome == 'success' }}
        shell: bash
        run: curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data '{"state":"success","context":"hartley-live-v2","description":"Hartley county-specific live certification passed"}' >/dev/null
      - name: Publish overall failure
        if: ${{ failure() }}
        shell: bash
        run: curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data '{"state":"failure","context":"hartley-live-v2","description":"Hartley county-specific live certification failed"}' >/dev/null

# rerun after workflow exists on default branch
