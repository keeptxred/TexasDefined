name: Texas Dogs browser production verification

on:
  pull_request:
    paths:
      - 'scripts/ci/verify-dogs-browser-production.mjs'
      - '.github/workflows/dogs-browser-production-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texas-dogs-browser-production-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright in isolated temp workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/texas-dogs-browser
          mkdir -p /tmp/texas-dogs-browser
          cp scripts/ci/verify-dogs-browser-production.mjs /tmp/texas-dogs-browser/verify.mjs
          cd /tmp/texas-dogs-browser
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify live Texas Dogs rendering in Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/texas-dogs-browser
          node verify.mjs
