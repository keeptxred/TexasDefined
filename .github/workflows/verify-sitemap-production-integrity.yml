name: Verify production sitemap integrity

on:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-sitemap-integrity
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out deployed verifier source (current SHA for scheduled/manual runs)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production sitemap integrity
        run: node scripts/ci/verify-sitemap-production-integrity.mjs

      - name: Verify all 14 THC landmarks remain discoverable with distinct hotel image
        # Old deployment SHAs predate this verifier: do not falsely fail their
        # production workflow while preserving the exact deployed-SHA checkout.
        if: ${{ hashFiles('scripts/ci/verify-thc-landmark-sitemap-production.mjs') != '' }}
        run: node scripts/ci/verify-thc-landmark-sitemap-production.mjs
