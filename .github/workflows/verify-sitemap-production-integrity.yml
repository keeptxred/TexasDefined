name: Verify production sitemap integrity

on:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/verify-sitemap-production-integrity.yml'
      - 'scripts/ci/verify-sitemap-production-integrity.mjs'
      - 'src/routes/sitemap[.]xml.ts'
      - 'src/routes/sitemap-explore[.]xml.ts'

permissions:
  contents: read

concurrency:
  group: verify-production-sitemap-integrity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out verification source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production sitemap integrity
        run: node scripts/ci/verify-sitemap-production-integrity.mjs
