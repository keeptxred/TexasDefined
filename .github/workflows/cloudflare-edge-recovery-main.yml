name: Cloudflare edge recovery on main trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/recovery/cloudflare-edge-run'

permissions:
  contents: write

jobs:
  recover-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: texasdefined-publication
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_SECURITY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MARKER: .github/certification/cloudflare-edge-recovery.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Diagnose and narrowly recover Cloudflare edge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import datetime, json, os, pathlib, subprocess, urllib.parse
          token=os.environ.get('CF_TOKEN','')
          if not token: raise SystemExit('Missing CLOUDFLARE_SECURITY_API_TOKEN')
          base='https://api.cloudflare.com/client/v4'
          headers=['-H',f'Authorization: Bearer {token}','-H','Content-Type: application/json']
          def req(method,url,body=None):
              cmd=['curl','--silent','--show-error','--max-time','40','-X',method,*headers,'-o','/tmp/cfresp','-w','%{http_code}',url]
              if body is not None: cmd += ['--data-binary',json.dumps(body)]
              p=subprocess.run(cmd,capture_output=True,text=True)
              raw=pathlib.Path('/tmp/cfresp').read_text(errors='replace') if pathlib.Path('/tmp/cfresp').exists() else ''
              try: parsed=json.loads(raw)
              except Exception: parsed={'raw':raw[:12000]}
              return {'http':p.stdout.strip(),'curl_exit':p.returncode,'stderr':p.stderr[-1200:],'body':parsed}
          acct=urllib.parse.quote(os.environ.get('CLOUDFLARE_ACCOUNT_ID',''))
          zone_lookup=req('GET',f'{base}/zones?name=texasdefined.com&account.id={acct}')
          rows=((zone_lookup.get('body') or {}).get('result') or []) if isinstance(zone_lookup.get('body'),dict) else []
          zone=rows[0].get('id','') if rows else ''
          now=datetime.datetime.now(datetime.timezone.utc)
          out={'recorded_at_utc':now.isoformat(),'zone_lookup':zone_lookup,'zone_id':zone,'changed':False}
          if not zone:
              out['blocked']='zone lookup failed'
          else:
              security=req('GET',f'{base}/zones/{zone}/settings/security_level')
              bic=req('GET',f'{base}/zones/{zone}/settings/browser_check')
              bot=req('GET',f'{base}/zones/{zone}/bot_management')
              custom=req('GET',f'{base}/zones/{zone}/rulesets/phases/http_request_firewall_custom/entrypoint')
              config=req('GET',f'{base}/zones/{zone}/rulesets/phases/http_config_settings/entrypoint')
              out.update({'security_level':security,'browser_integrity_check':bic,'bot_management':bot,'custom_firewall_entrypoint':custom,'config_settings_entrypoint':config})
              current=(((security.get('body') or {}).get('result') or {}).get('value')) if isinstance(security.get('body'),dict) else None
              out['security_level_value']=current
              end=now; start=end-datetime.timedelta(hours=6)
              gql='''query Events($zoneTag: string, $start: Time, $end: Time) { viewer { zones(filter: { zoneTag: $zoneTag }) { firewallEventsAdaptive(filter: { datetime_geq: $start, datetime_leq: $end }, limit: 100, orderBy: [datetime_DESC]) { action source description ruleId clientRequestPath clientRequestHTTPHost datetime userAgent rayName } } } }'''
              payload={'query':gql,'variables':{'zoneTag':zone,'start':start.isoformat().replace('+00:00','Z'),'end':end.isoformat().replace('+00:00','Z')}}
              out['security_events']=req('POST',f'{base}/graphql',payload)
              if current=='under_attack':
                  edit=req('PATCH',f'{base}/zones/{zone}/settings/security_level',{'value':'medium'})
                  out['change']={'from':'under_attack','to':'medium','response':edit}
                  out['changed']=edit.get('http')=='200' and bool((edit.get('body') or {}).get('success'))
                  if not out['changed']: out['blocked']='Under Attack Mode detected but recovery failed'
              elif security.get('http')!='200':
                  out['blocked']='Security Level could not be read with dedicated token'
              else:
                  out['blocked']='Security Level is not under_attack; inspect BIC/Bot/WAF/Security Events before changing anything else'
          probes={}
          for path in ['/', '/sitemap.xml', '/article/history-of-the-texas-flag', '/article/texas-bluebonnets-complete-guide', '/article/christmas-in-texas-complete-guide', '/article/fall-in-texas-complete-guide']:
              h=pathlib.Path('/tmp/h'); b=pathlib.Path('/tmp/b')
              p=subprocess.run(['curl','--silent','--show-error','--location','--max-time','35','-A','Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36 TexasDefinedVerifier/1.0','-D',str(h),'-o',str(b),'-w','%{http_code}','https://texasdefined.com'+path],capture_output=True,text=True)
              ht=h.read_text(errors='replace') if h.exists() else ''
              probes[path]={'http':p.stdout.strip(),'curl_exit':p.returncode,'cf_mitigated_challenge':'cf-mitigated: challenge' in ht.lower(),'headers_tail':ht[-3000:],'body_prefix':b.read_text(errors='replace')[:500] if b.exists() else ''}
          out['custom_domain_probes']=probes
          out['custom_domain_healthy']=all(v.get('http')=='200' and not v.get('cf_mitigated_challenge') for v in probes.values())
          marker=pathlib.Path(os.environ['MARKER']); marker.parent.mkdir(parents=True,exist_ok=True); marker.write_text(json.dumps(out,indent=2)+'\n')
          PY
          git add "$MARKER"
          git commit -m 'Record Cloudflare edge recovery result' || true
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            git push origin HEAD:main && break
            sleep 3
          done
          python3 - <<'PY'
          import json, os, sys
          data=json.load(open(os.environ['MARKER']))
          if not data.get('custom_domain_healthy'):
              print(data.get('blocked') or 'custom domain verification failed', file=sys.stderr)
              raise SystemExit(1)
          print('Cloudflare edge recovery verified: custom domain healthy.')
          PY
