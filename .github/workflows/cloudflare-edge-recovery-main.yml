name: Cloudflare edge recovery on main trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/recovery/cloudflare-edge-run'

permissions:
  contents: write
  pull-requests: write

jobs:
  recover-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: texasdefined-publication
    env:
      CF_SECURITY_TOKEN: ${{ secrets.CLOUDFLARE_SECURITY_API_TOKEN }}
      CF_SECURITY_TOKEN_VARIABLE_PRESENT: ${{ vars.CLOUDFLARE_SECURITY_API_TOKEN != '' }}
      CF_GENERAL_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MARKER: .github/certification/cloudflare-edge-recovery.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Diagnose and narrowly recover Cloudflare edge
        shell: bash
        run: |
          set -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 - <<'PY'
          import datetime, json, os, pathlib, subprocess, urllib.parse

          security_token=os.environ.get('CF_SECURITY_TOKEN','')
          general_token=os.environ.get('CF_GENERAL_TOKEN','')
          deploy_token=os.environ.get('CF_DEPLOY_TOKEN','')
          token_variable_present=os.environ.get('CF_SECURITY_TOKEN_VARIABLE_PRESENT','').strip().lower() == 'true'
          account_id=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          now=datetime.datetime.now(datetime.timezone.utc)
          out={
              'recorded_at_utc':now.isoformat(),
              'security_secret_available':bool(security_token),
              'same_name_actions_variable_present':token_variable_present,
              'general_cloudflare_token_available':bool(general_token),
              'deploy_cloudflare_token_available':bool(deploy_token),
              'account_id_secret_available':bool(account_id),
              'security_diagnostic_complete':False,
              'changed':False,
          }

          base='https://api.cloudflare.com/client/v4'

          def req(token,method,url,body=None):
              headers=['-H',f'Authorization: Bearer {token}','-H','Content-Type: application/json']
              cmd=['curl','--silent','--show-error','--max-time','40','-X',method,*headers,'-o','/tmp/cfresp','-w','%{http_code}',url]
              if body is not None:
                  cmd += ['--data-binary',json.dumps(body)]
              p=subprocess.run(cmd,capture_output=True,text=True)
              raw=pathlib.Path('/tmp/cfresp').read_text(errors='replace') if pathlib.Path('/tmp/cfresp').exists() else ''
              try:
                  parsed=json.loads(raw)
              except Exception:
                  parsed={'raw':raw[:12000]}
              return {'http':p.stdout.strip(),'curl_exit':p.returncode,'stderr':p.stderr[-1200:],'body':parsed}

          acct=urllib.parse.quote(account_id)
          candidates=[
              ('dedicated_security_secret',security_token),
              ('general_cloudflare_api_secret_readonly',general_token),
              ('deploy_cloudflare_api_secret_readonly',deploy_token),
          ]
          diagnostic_token=''
          diagnostic_source=''
          zone=''
          attempts=[]
          for source,candidate in candidates:
              if not candidate:
                  attempts.append({'source':source,'available':False})
                  continue
              zone_lookup=req(candidate,'GET',f'{base}/zones?name=texasdefined.com&account.id={acct}')
              rows=((zone_lookup.get('body') or {}).get('result') or []) if isinstance(zone_lookup.get('body'),dict) else []
              candidate_zone=rows[0].get('id','') if rows else ''
              errors=((zone_lookup.get('body') or {}).get('errors') or []) if isinstance(zone_lookup.get('body'),dict) else []
              attempts.append({
                  'source':source,
                  'available':True,
                  'http':zone_lookup.get('http'),
                  'success':bool(candidate_zone),
                  'errors':errors[:5],
              })
              if candidate_zone:
                  diagnostic_token=candidate
                  diagnostic_source=source
                  zone=candidate_zone
                  break
          out['diagnostic_token_attempts']=attempts
          out['diagnostic_token_source']=diagnostic_source or None
          out['zone_id']=zone or None

          if not diagnostic_token:
              out['blocked']='No available Cloudflare token can read the texasdefined.com zone; dedicated security token remains unavailable or unusable'
          else:
              security=req(diagnostic_token,'GET',f'{base}/zones/{zone}/settings/security_level')
              bic=req(diagnostic_token,'GET',f'{base}/zones/{zone}/settings/browser_check')
              bot=req(diagnostic_token,'GET',f'{base}/zones/{zone}/bot_management')
              custom=req(diagnostic_token,'GET',f'{base}/zones/{zone}/rulesets/phases/http_request_firewall_custom/entrypoint')
              config=req(diagnostic_token,'GET',f'{base}/zones/{zone}/rulesets/phases/http_config_settings/entrypoint')
              out.update({
                  'security_level':security,
                  'browser_integrity_check':bic,
                  'bot_management':bot,
                  'custom_firewall_entrypoint':custom,
                  'config_settings_entrypoint':config,
              })
              current=(((security.get('body') or {}).get('result') or {}).get('value')) if isinstance(security.get('body'),dict) else None
              out['security_level_value']=current
              out['security_diagnostic_complete']=security.get('http') == '200'
              end=now
              start=end-datetime.timedelta(hours=6)
              gql='''query Events($zoneTag: string, $start: Time, $end: Time) { viewer { zones(filter: { zoneTag: $zoneTag }) { firewallEventsAdaptive(filter: { datetime_geq: $start, datetime_leq: $end }, limit: 100, orderBy: [datetime_DESC]) { action source description ruleId clientRequestPath clientRequestHTTPHost datetime userAgent rayName } } } }'''
              payload={'query':gql,'variables':{'zoneTag':zone,'start':start.isoformat().replace('+00:00','Z'),'end':end.isoformat().replace('+00:00','Z')}}
              out['security_events']=req(diagnostic_token,'POST',f'{base}/graphql',payload)

              if current=='under_attack':
                  if diagnostic_source=='dedicated_security_secret':
                      edit=req(security_token,'PATCH',f'{base}/zones/{zone}/settings/security_level',{'value':'medium'})
                      out['change']={'from':'under_attack','to':'medium','response':edit}
                      out['changed']=edit.get('http')=='200' and bool((edit.get('body') or {}).get('success'))
                      if not out['changed']:
                          out['blocked']='Under Attack Mode detected but dedicated-token recovery failed'
                  else:
                      out['blocked']='Under Attack Mode detected read-only, but dedicated security token is unavailable; no mutation attempted'
              elif security.get('http')!='200':
                  out['blocked']='Security Level could not be read with any available Cloudflare credential'
              else:
                  out['diagnostic_note']='Security Level is not under_attack; inspect BIC/Bot/WAF/Security Events before changing anything else'

          probes={}
          for path in [
              '/',
              '/sitemap.xml',
              '/article/history-of-the-texas-flag',
              '/texas-symbols',
              '/texas-history',
              '/article/texas-bluebonnets-complete-guide',
              '/article/christmas-in-texas-complete-guide',
              '/article/fall-in-texas-complete-guide',
          ]:
              h=pathlib.Path('/tmp/h')
              b=pathlib.Path('/tmp/b')
              p=subprocess.run([
                  'curl','--silent','--show-error','--location','--max-time','35',
                  '-A','Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36 TexasDefinedVerifier/1.0',
                  '-D',str(h),'-o',str(b),'-w','%{http_code}','https://texasdefined.com'+path,
              ],capture_output=True,text=True)
              ht=h.read_text(errors='replace') if h.exists() else ''
              probes[path]={
                  'http':p.stdout.strip(),
                  'curl_exit':p.returncode,
                  'cf_mitigated_challenge':'cf-mitigated: challenge' in ht.lower(),
                  'headers_tail':ht[-3000:],
                  'body_prefix':b.read_text(errors='replace')[:500] if b.exists() else '',
              }
          out['custom_domain_probes']=probes
          out['custom_domain_healthy']=all(v.get('http')=='200' and not v.get('cf_mitigated_challenge') for v in probes.values())

          marker=pathlib.Path(os.environ['MARKER'])
          marker.parent.mkdir(parents=True,exist_ok=True)
          marker.write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Publish recovery evidence branch and review PR when allowed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$MARKER" ]]; then
            mkdir -p "$(dirname "$MARKER")"
            printf '{"blocked":"recovery step ended before writing evidence","security_diagnostic_complete":false,"custom_domain_healthy":false}\n' > "$MARKER"
          fi
          branch="automation/cloudflare-edge-recovery-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add "$MARKER"
          git commit -m 'Record Cloudflare edge recovery result'
          git push origin "$branch"
          if ! gh pr create \
            --base main \
            --head "$branch" \
            --title 'Review Cloudflare edge recovery evidence' \
            --body 'Automated Cloudflare edge recovery evidence. Review credential availability, security settings, Security Events/WAF/Bot evidence, and all representative live-route probes. This PR is intentionally not auto-merged.'; then
            echo "::warning title=Evidence PR creation blocked::GitHub repository policy prevented Actions from opening a PR. Evidence is preserved on branch $branch for manual review."
            {
              echo '## Cloudflare recovery evidence'
              echo
              echo "Evidence branch: \`$branch\`"
              echo 'GitHub Actions is not permitted to create pull requests in this repository; the evidence branch was still pushed successfully.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require complete security diagnosis and healthy custom domain
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys
          data=json.load(open(os.environ['MARKER']))
          if not data.get('security_diagnostic_complete'):
              print(data.get('blocked') or 'Cloudflare security diagnostic incomplete', file=sys.stderr)
              raise SystemExit(1)
          if not data.get('custom_domain_healthy'):
              print(data.get('blocked') or 'custom domain verification failed', file=sys.stderr)
              raise SystemExit(1)
          print('Cloudflare edge recovery verified: security diagnosis complete and custom domain healthy.')
          PY
