name: Apply county density runtime fix

on:
  push:
    branches:
      - fix/county-density-runtime
    paths:
      - '.github/workflows/apply-county-density-runtime-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/county-density-runtime
      - name: Patch formatter export and import
        run: |
          python3 - <<'PY'
          from pathlib import Path

          profile = Path('src/data/county-profile.ts')
          text = profile.read_text()
          old = 'function formatDensity(value: number) {'
          new = 'export function formatDensity(value: number) {'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one private density formatter, found {text.count(old)}')
          profile.write_text(text.replace(old, new, 1))

          guide = Path('src/components/content/CountyGuideSections.tsx')
          text = guide.read_text()
          old = "import type { CountyProfile } from '@/data/county-profile';"
          new = "import { formatDensity, type CountyProfile } from '@/data/county-profile';"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one CountyProfile type-only import, found {text.count(old)}')
          guide.write_text(text.replace(old, new, 1))

          Path('.github/workflows/apply-county-density-runtime-fix.yml').unlink()
          PY
      - name: Verify focused regression
        run: node scripts/data/validate-county-density-runtime.mjs
      - name: Commit bounded fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/county-profile.ts src/components/content/CountyGuideSections.tsx scripts/data/validate-county-density-runtime.mjs .github/workflows/apply-county-density-runtime-fix.yml
          git commit -m 'Fix county density runtime formatter'
          git push origin HEAD:fix/county-density-runtime
