name: Refresh five TexasDefined editorial authority groups

on:
  schedule:
    - cron: '35 13 * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - 'ops/editorial/five-authority-refresh-groups.json'
      - 'scripts/ci/monitor-five-authority-refresh.mjs'
      - '.github/workflows/refresh-five-authority-groups.yml'
      - 'src/routes/sports.lazy.tsx'
      - 'src/data/fixtures/texas-sports-weekend-calendar-guide.ts'
      - 'src/data/fixtures/lazy-standalone-evergreen.ts'
      - 'src/routes/sports.friday-night-lights.lazy.tsx'
      - 'src/routes/texas-tailgating-guide.lazy.tsx'
      - 'src/components/dogs/DogsHubPage.tsx'
      - 'src/components/hunting/HuntingAuthority.tsx'
      - 'src/components/hunting/**'
      - 'src/data/hunting/**'
      - 'src/routes/hunting*'
      - 'src/components/dogs/**'
      - 'src/data/texas-dogs*'
      - 'src/routes/dogs.*'
      - 'src/components/editorial/CategoryPage.tsx'
      - 'src/routes/sports.*'
      - 'src/routes/texas-tailgating-guide.*'
      - 'src/assets/navigation-texas-dogs.svg'
      - 'src/assets/high-school-football-hero.jpg'
permissions:
  contents: read
  issues: write
concurrency:
  group: five-authority-source-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-refresh:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 7170 &&
       github.event.comment.body == '/refresh-five-hubs' &&
       github.event.comment.user.login == 'keeptxred')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove all five source-refresh group contracts
        run: |
          node --check scripts/ci/monitor-five-authority-refresh.mjs
          node scripts/ci/monitor-five-authority-refresh.mjs
      - name: Inspect live five-page HTML and scheduled official sources
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment'
        run: |
          if [[ "${{ github.event_name }}" = issue_comment ]]; then
            node scripts/ci/monitor-five-authority-refresh.mjs --production --all
          else
            node scripts/ci/monitor-five-authority-refresh.mjs --production
          fi
      - name: Keep substantive editorial issues visible when a source check fails
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ACTION_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          issue=7170
          gh issue reopen "$issue" --repo "$GITHUB_REPOSITORY" || true
          # Avoid daily duplicate issue comments; CI is already red until fixed.
          weekday="$(date -u +%u)"
          if [[ "$weekday" = 1 || "${{ github.event_name }}" = workflow_dispatch || "${{ github.event_name }}" = issue_comment ]]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Five-hub authority refresh needs a real source/editorial correction. Inspect grouped official-source and uncached live checks in $ACTION_RUN. Do not re-date articles or rubber-stamp review dates."
          fi
