name: Verify lighthouse production

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  verify-lighthouse-production:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Publish pending status
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" \
            --data '{"state":"pending","context":"texasdefined-lighthouse-live","description":"Verifying Texas lighthouse authority routes"}' >/dev/null

      - name: Verify lighthouse authority routes
        id: live
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          fetch_assert() {
            local label="$1" path="$2" needle="$3"
            local out="$workdir/${label}.html"
            local attempt
            for attempt in 1 2 3 4 5 6; do
              echo "[$label] attempt $attempt: ${origin}${path}"
              if curl --fail-with-body --silent --show-error --location --max-time 30 \
                "${origin}${path}?verify=${DEPLOY_SHA}-${GITHUB_RUN_ID}-${attempt}" -o "$out"; then
                if grep -Fq "$needle" "$out"; then
                  echo "[$label] production content verified: $needle"
                  return 0
                fi
                echo "[$label] fetched but expected content is not live yet: $needle"
              fi
              sleep 5
            done
            echo "[$label] production verification failed for ${origin}${path}" >&2
            head -c 1600 "$out" 2>/dev/null || true
            echo >&2
            return 1
          }

          fetch_assert lighthouse-hub '/explore/lighthouses' 'Texas Lighthouses'
          fetch_assert lighthouse-visitability '/explore/lighthouses' 'Visitability at a glance'
          fetch_assert lighthouse-faq '/explore/lighthouses' 'Which Texas lighthouse can you climb?'
          fetch_assert best-lighthouses-intent '/article/best-lighthouses-to-visit-in-texas' 'Best Lighthouses to Visit in Texas: What You Can Actually See and Climb'
          fetch_assert best-lighthouses-sabine '/article/best-lighthouses-to-visit-in-texas' 'the historic lighthouse tower stands on the Louisiana side of the Sabine'
          fetch_assert port-isabel-go-deeper '/destination/port-isabel-lighthouse-state-park' 'Go deeper'
          fetch_assert port-isabel-ranking-link '/destination/port-isabel-lighthouse-state-park' 'Compare the best Texas lighthouse visits'
          fetch_assert port-isabel-history-link '/destination/port-isabel-lighthouse-state-park' 'Read the full Port Isabel Lighthouse history'
          fetch_assert explore-home-discovery '/explore' 'Texas lighthouses'
          fetch_assert beaches-discovery '/explore/beaches-coast' 'Texas lighthouses'
          fetch_assert historic-discovery '/explore/historic-sites' 'Texas lighthouses'
          fetch_assert roadtrip-discovery '/explore/road-trips' 'Texas lighthouse trail'
          fetch_assert point-bolivar '/article/point-bolivar-lighthouse-history' 'Point Bolivar Lighthouse: The Black Tower at Galveston Bay'
          fetch_assert lydia-ann '/article/lydia-ann-lighthouse-port-aransas' 'Lydia Ann Lighthouse: The Light Across From Port Aransas'
          fetch_assert matagorda '/article/matagorda-island-lighthouse-history' "Matagorda Island Lighthouse: The Black Tower Beyond Port O'Connor"
          fetch_assert halfmoon '/article/halfmoon-reef-lighthouse-port-lavaca' 'Halfmoon Reef Lighthouse: The Texas Light That Came Ashore'
          fetch_assert sabine '/article/sabine-pass-lighthouse-texas-border' 'The most important fact: the tower is in Louisiana'

      - name: Publish success status
        if: ${{ steps.live.outcome == 'success' }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" \
            --data '{"state":"success","context":"texasdefined-lighthouse-live","description":"Texas lighthouse authority routes are live"}' >/dev/null

      - name: Publish failure status
        if: ${{ failure() }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" \
            --data '{"state":"failure","context":"texasdefined-lighthouse-live","description":"Texas lighthouse production verification failed"}' >/dev/null
