name: Generate Events index route tree

on:
  push:
    branches:
      - fix/events-index-layout-ssr
    paths:
      - '.github/workflows/generate-events-index-route-tree.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Align validators with Events layout/index split
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Events SEO validator: the layout owns only Outlet; the index owns landing SEO/UI.
          p = Path('scripts/data/validate-events-seo.mjs')
          s = p.read_text()
          old = """const route = fs.readFileSync(path.join(root, 'src/routes/events.tsx'), 'utf8');\nconst lazyRoute = fs.readFileSync(path.join(root, 'src/routes/events.lazy.tsx'), 'utf8');\nconst visibleRoute = `${route}\\n${lazyRoute}`;\n"""
          new = """const layoutRoute = fs.readFileSync(path.join(root, 'src/routes/events.tsx'), 'utf8');\nconst layoutLazyRoute = fs.readFileSync(path.join(root, 'src/routes/events.lazy.tsx'), 'utf8');\nconst route = fs.readFileSync(path.join(root, 'src/routes/events.index.tsx'), 'utf8');\nconst lazyRoute = fs.readFileSync(path.join(root, 'src/routes/events.index.lazy.tsx'), 'utf8');\nconst visibleRoute = `${route}\\n${lazyRoute}`;\n"""
          if old not in s:
              raise SystemExit('validate-events-seo route block not found')
          s = s.replace(old, new, 1)
          marker = "const errors = [];\n"
          guard = """const errors = [];\n\nif (!layoutRoute.includes('createFileRoute(\"/events\")')) errors.push('Events layout route must remain the /events parent.');\nif (layoutRoute.includes('loader:') || layoutRoute.includes('head:')) errors.push('Events layout route must not own landing loader/head state.');\nif (!layoutLazyRoute.includes('createLazyFileRoute(\"/events\")') || !layoutLazyRoute.includes('<Outlet />')) errors.push('Events layout must unconditionally render its child Outlet.');\nif (layoutLazyRoute.includes('useRouterState') || layoutLazyRoute.includes('What’s happening across Texas')) errors.push('Events layout must not choose landing vs child content from pathname state.');\nif (!route.includes('createFileRoute(\"/events/\")')) errors.push('Events statewide landing must remain an explicit /events/ index child.');\nif (!lazyRoute.includes('createLazyFileRoute(\"/events/\")')) errors.push('Events statewide UI must remain on the explicit /events/ index child.');\n"""
          if marker not in s:
              raise SystemExit('validate-events-seo errors marker not found')
          s = s.replace(marker, guard, 1)
          p.write_text(s)

          # Major-event authority validator: evaluate landing assertions on the index child,
          # and permanently guard the pure layout contract.
          p = Path('scripts/data/validate-major-event-authority.mjs')
          s = p.read_text()
          old = """const eventsRoutePath = path.join(root, \"src\", \"routes\", \"events.tsx\");\nconst eventsLazyRoutePath = path.join(root, \"src\", \"routes\", \"events.lazy.tsx\");\n"""
          new = """const eventsLayoutRoutePath = path.join(root, \"src\", \"routes\", \"events.tsx\");\nconst eventsLayoutLazyRoutePath = path.join(root, \"src\", \"routes\", \"events.lazy.tsx\");\nconst eventsRoutePath = path.join(root, \"src\", \"routes\", \"events.index.tsx\");\nconst eventsLazyRoutePath = path.join(root, \"src\", \"routes\", \"events.index.lazy.tsx\");\n"""
          if old not in s:
              raise SystemExit('major-event path block not found')
          s = s.replace(old, new, 1)
          old = """const eventsRoute = read(eventsRoutePath);\nconst eventsLazyRoute = read(eventsLazyRoutePath);\nconst eventsVisibleRoute = `${eventsRoute}\\n${eventsLazyRoute}`;\n"""
          new = """const eventsLayoutRoute = read(eventsLayoutRoutePath);\nconst eventsLayoutLazyRoute = read(eventsLayoutLazyRoutePath);\nconst eventsRoute = read(eventsRoutePath);\nconst eventsLazyRoute = read(eventsLazyRoutePath);\nconst eventsVisibleRoute = `${eventsRoute}\\n${eventsLazyRoute}`;\nif (!eventsLayoutRoute.includes('createFileRoute(\"/events\")')) fail('Texas Events parent route must remain the /events layout');\nif (!eventsLayoutLazyRoute.includes('<Outlet />') || eventsLayoutLazyRoute.includes('useRouterState')) fail('Texas Events parent layout must unconditionally yield child routes without pathname-dependent rendering');\nif (!eventsRoute.includes('createFileRoute(\"/events/\")') || !eventsLazyRoute.includes('createLazyFileRoute(\"/events/\")')) fail('Texas Events landing must remain an explicit index child under the /events layout');\n"""
          if old not in s:
              raise SystemExit('major-event read block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Sports/event integrity validator consumes the visible landing page, now the index child.
          p = Path('scripts/data/validate-event-sports-venue-links.mjs')
          s = p.read_text()
          s = s.replace("read('src/routes/events.tsx'),\n  read('src/routes/events.lazy.tsx'),", "read('src/routes/events.index.tsx'),\n  read('src/routes/events.index.lazy.tsx'),", 1)
          p.write_text(s)

          # Internal-link coverage likewise follows the visible landing surface, not the layout shell.
          p = Path('scripts/data/validate-internal-linking.mjs')
          s = p.read_text()
          old = "const eventsHub = readRouteSurface('src/routes/events.tsx');"
          new = "const eventsHub = readRouteSurface('src/routes/events.index.tsx');"
          if old not in s:
              raise SystemExit('internal-link eventsHub marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Generate TanStack route tree and production build
        run: npm run build
      - name: Commit validator and generated route-tree changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routeTree.gen.ts scripts/data/validate-events-seo.mjs scripts/data/validate-major-event-authority.mjs scripts/data/validate-event-sports-venue-links.mjs scripts/data/validate-internal-linking.mjs
          if git diff --cached --quiet; then
            echo 'No generated or validator changes to commit.'
            exit 0
          fi
          git commit -m 'Align Events validators and generated route tree'
          git push origin HEAD:${GITHUB_REF_NAME}
