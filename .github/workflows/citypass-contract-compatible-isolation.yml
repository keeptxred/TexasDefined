name: CityPASS contract-compatible isolation

on:
  push:
    branches:
      - feature/citypass-texas-evergreen

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/citypass-texas-evergreen
          fetch-depth: 0

      - name: Preserve existing fallback contracts while keeping CityPASS async
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              p.write_text(text.replace(old, new, count))

          runtime = 'src/data/destination-query-runtime.ts'
          replace_exact(
              runtime,
              '''async function loadPreservedExploreDestinations(): Promise<Destination[]> {\n  const { cityPassDestinationExpansion } = await import("./citypass-destination-expansion");\n  return mergeDestinations(preservedExploreDestinations, cityPassDestinationExpansion);\n}\n\nasync function preservedFor(query: Omit<DestinationQuery, "brandId">): Promise<Destination[]> {\n  let rows = await loadPreservedExploreDestinations();\n  if (query.category) rows = rows.filter((destination) => destination.category === query.category);\n  if (query.featured !== undefined) rows = rows.filter((destination) => Boolean(destination.featured) === query.featured);\n  return query.limit ? rows.slice(0, query.limit) : rows;\n}\n''',
              '''function filterPreservedDestinations(rows: Destination[], query: Omit<DestinationQuery, "brandId">): Destination[] {\n  if (query.category) rows = rows.filter((destination) => destination.category === query.category);\n  if (query.featured !== undefined) rows = rows.filter((destination) => Boolean(destination.featured) === query.featured);\n  return query.limit ? rows.slice(0, query.limit) : rows;\n}\n\nfunction preservedFor(query: Omit<DestinationQuery, "brandId">): Destination[] {\n  return filterPreservedDestinations(preservedExploreDestinations, query);\n}\n\nasync function loadCityPassDestinationExpansion(): Promise<Destination[]> {\n  const { cityPassDestinationExpansion } = await import("./citypass-destination-expansion");\n  return cityPassDestinationExpansion;\n}\n\nasync function cityPassPreservedFor(query: Omit<DestinationQuery, "brandId">): Promise<Destination[]> {\n  return filterPreservedDestinations(await loadCityPassDestinationExpansion(), query);\n}\n'''
          )
          replace_exact(
              runtime,
              '''  const preserved = await preservedFor(params);\n  const merged = reconcileExploreCatalog(mergeDestinations(enriched, core, preserved, local));\n''',
              '''  const preserved = preservedFor(params);\n  const baseMerged = mergeDestinations(enriched, core, preserved, local);\n  const cityPassPreserved = await cityPassPreservedFor(params);\n  const merged = reconcileExploreCatalog(mergeDestinations(baseMerged, cityPassPreserved));\n'''
          )
          replace_exact(
              runtime,
              '''  const cityPassPreserved = (await loadPreservedExploreDestinations()).find((destination) => destination.slug === slug);\n''',
              '''  const cityPassPreserved = (await loadCityPassDestinationExpansion()).find((destination) => destination.slug === slug);\n'''
          )
          replace_exact(
              runtime,
              '''  return reconcileExploreCatalog(mergeDestinations(enriched, core, await loadPreservedExploreDestinations()));\n''',
              '''  const preservedSearchCatalog = mergeDestinations(enriched, core, preservedExploreDestinations);\n  return reconcileExploreCatalog(mergeDestinations(preservedSearchCatalog, await loadCityPassDestinationExpansion()));\n'''
          )

          sitemap = 'src/routes/sitemap-explore[.]xml.ts'
          replace_exact(
              sitemap,
              '''        const remoteDestinations = mergeDestinationSources(coreDestinations, enrichedDestinations);\n        const preservedDestinations = mergeDestinationSources(preservedExploreDestinations, cityPassDestinationExpansion);\n        const usePreservedFallback = (enrichedFailed && coreFailed) || remoteDestinations.length === 0;\n        const rawDestinations = usePreservedFallback ? preservedDestinations : remoteDestinations;\n        if (!usePreservedFallback) {\n          const remoteSlugs = new Set(rawDestinations.map((destination) => destination.slug));\n          rawDestinations.push(...preservedDestinations.filter((destination) => destination.slug && !remoteSlugs.has(destination.slug)));\n        }\n''',
              '''        const remoteDestinations = mergeDestinationSources(coreDestinations, enrichedDestinations);\n        const usePreservedFallback = (enrichedFailed && coreFailed) || remoteDestinations.length === 0;\n        const rawDestinations = usePreservedFallback ? preservedExploreDestinations : remoteDestinations;\n        if (!usePreservedFallback) {\n          const remoteSlugs = new Set(rawDestinations.map((destination) => destination.slug));\n          rawDestinations.push(...preservedExploreDestinations.filter((destination) => destination.slug && !remoteSlugs.has(destination.slug)));\n        }\n        const resolvedSlugs = new Set(rawDestinations.map((destination) => destination.slug));\n        rawDestinations.push(...cityPassDestinationExpansion.filter((destination) => destination.slug && !resolvedSlugs.has(destination.slug)));\n'''
          )

          validator = 'scripts/data/validate-citypass-affiliate.mjs'
          replace_exact(
              validator,
              '''requireText(destinationRuntime, 'await import("./citypass-destination-expansion")', 'Async CityPASS destination runtime load');\nrequireText(destinationRuntime, 'await loadPreservedExploreDestinations()', 'Async CityPASS preserved catalog merge');\nrequireText(exploreSitemap, 'await import("@/data/citypass-destination-expansion")', 'Async CityPASS sitemap load');\nrequireText(exploreSitemap, 'mergeDestinationSources(preservedExploreDestinations, cityPassDestinationExpansion)', 'CityPASS sitemap preserved merge');\n''',
              '''requireText(destinationRuntime, 'await import("./citypass-destination-expansion")', 'Async CityPASS destination runtime load');\nrequireText(destinationRuntime, 'const preserved = preservedFor(params)', 'Preserved fallback contract');\nrequireText(destinationRuntime, 'const cityPassPreserved = await cityPassPreservedFor(params)', 'Async CityPASS list merge');\nrequireText(destinationRuntime, 'await loadCityPassDestinationExpansion()', 'Async CityPASS detail/search merge');\nrequireText(exploreSitemap, 'await import("@/data/citypass-destination-expansion")', 'Async CityPASS sitemap load');\nrequireText(exploreSitemap, 'rawDestinations.push(...cityPassDestinationExpansion.filter', 'CityPASS sitemap preserved merge');\n'''
          )
          PY

          rm .github/workflows/citypass-contract-compatible-isolation.yml

      - name: Commit contract-compatible isolation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/data/validate-citypass-affiliate.mjs src/data/destination-query-runtime.ts 'src/routes/sitemap-explore[.]xml.ts' .github/workflows/citypass-contract-compatible-isolation.yml
          git commit -m "perf: preserve fallback contracts with async CityPASS data"
          git push origin HEAD:feature/citypass-texas-evergreen
