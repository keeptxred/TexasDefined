name: Certify Gaines County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-gaines-county-once.yml'

permissions:
  contents: write

concurrency:
  group: certify-gaines-county-once
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate deploy and certify Gaines County
        shell: bash
        run: |
          set -euo pipefail
          target='862501cf8a340d9f4e9d7517f8a6d04b7bf4d178'
          hero='https://commons.wikimedia.org/wiki/Special:Redirect/file/The_Gaines_County_Courthouse_in_Seminole%2C_Texas_LCCN2014631702.jpg?width=1600'
          agent='TexasDefined/1.0 (+https://texasdefined.com)'
          fixture='src/data/fixtures/gaines-county-seminole-oil-cotton-peanuts-high-plains-texas.ts'
          registry='src/data/county-series-profiles-south-plains.ts'

          git merge-base --is-ancestor "$target" HEAD || { echo 'Gaines county commit is not in current main ancestry'; exit 1; }
          test -f "$fixture"
          grep -Fq 'countySlug: "gaines"' "$registry"
          grep -Fq '["gaines-county-seminole-oil-cotton-peanuts-high-plains-texas", "gaines"]' src/data/county-series.ts
          grep -Fq 'Gaines County: Seminole, Oil, Cotton, Peanuts and the High Plains' "$fixture"
          if grep -n 'www\.texasdefined\.com' "$fixture" "$registry" src/data/county-series.ts src/data/county-series.server.ts; then
            echo 'Noncanonical www TexasDefined hostname found'; exit 1
          fi
          git diff --check

          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          hcode="$(curl -A "$agent" -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 -sS -D "$work/hh" -o "$work/hb" -w '%{http_code}' "$hero" || true)"
          hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/hh" | cut -d';' -f1)"
          hbytes="$(wc -c < "$work/hb" 2>/dev/null || echo 0)"
          echo "Hero source: HTTP=$hcode MIME=$hmime bytes=$hbytes"
          if [ "$hcode" != 200 ] || ! [[ "$hmime" =~ ^image/(jpeg|png|webp)$ ]] || [ "$hbytes" -le 50000 ]; then
            exit 1
          fi

          npm run validate
          validated="$(git rev-parse HEAD)"

          git fetch origin main
          latest="$(git rev-parse origin/main)"
          current="$(git rev-parse HEAD)"
          [ "$latest" = "$current" ] || { echo "main moved after validation: $current -> $latest"; exit 1; }

          npm run deploy

          page=''; code=''
          for attempt in $(seq 1 12); do
            code="$(curl -A "$agent" --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$work/page" -w '%{http_code}' "https://texasdefined.com/county/gaines?verify=${target}-${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$code" = 200 ] \
              && grep -Fq 'Gaines County: Seminole, Oil, Cotton, Peanuts and the High Plains' "$work/page" \
              && grep -Fq 'The county in numbers' "$work/page" \
              && grep -Fq 'County seat' "$work/page" \
              && grep -Fq '2020 population' "$work/page" \
              && grep -Fq 'County feature' "$work/page" \
              && grep -Fq 'Seminole' "$work/page" \
              && grep -Fq 'Seagraves' "$work/page" \
              && grep -Fq 'https://texasdefined.com/county/gaines' "$work/page"; then page=pass; break; fi
            sleep 5
          done
          [ "$page" = pass ] || { echo "Live page failed: HTTP=$code or expected structured/editorial markers missing"; exit 1; }

          live_hcode="$(curl -A "$agent" -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 -sS -D "$work/lhh" -o "$work/lhb" -w '%{http_code}' "$hero" || true)"
          live_hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/lhh" | cut -d';' -f1)"
          live_hbytes="$(wc -c < "$work/lhb" 2>/dev/null || echo 0)"
          echo "Live hero: HTTP=$live_hcode MIME=$live_hmime bytes=$live_hbytes"
          if [ "$live_hcode" != 200 ] || ! [[ "$live_hmime" =~ ^image/(jpeg|png|webp)$ ]] || [ "$live_hbytes" -le 50000 ]; then
            exit 1
          fi

          legacy='https://texasdefined.com/article/gaines-county-seminole-oil-cotton-peanuts-high-plains-texas'
          legacy_code="$(curl -A "$agent" --max-redirs 0 -sS -D "$work/legacy_headers" -o /dev/null -w '%{http_code}' "$legacy" || true)"
          legacy_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$work/legacy_headers")"
          echo "Legacy article: HTTP=$legacy_code location=$legacy_location"
          if ! [[ "$legacy_code" =~ ^30(1|8)$ ]] || [[ "$legacy_location" != *'/county/gaines'* ]]; then
            exit 1
          fi

          mkdir -p .github/certifications
          cat > .github/certifications/gaines-county-production.txt <<EOF
          PASS Gaines County
          target=$target
          validated=$validated
          validate=PASS
          deploy=PASS
          page=200
          structured=yes
          editorial=yes
          canonical=https://texasdefined.com/county/gaines
          legacy=$legacy_code
          legacy_location=$legacy_location
          hero=$live_hcode
          mime=$live_hmime
          bytes=$live_hbytes
          EOF
          sed -i 's/^          //' .github/certifications/gaines-county-production.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/certifications/gaines-county-production.txt
          git commit -m 'Record Gaines County production pass'
          git push origin HEAD:main

          echo "PASS Gaines County validate=PASS deploy=PASS page=200 structured=yes editorial=yes legacy=$legacy_code hero=$live_hcode mime=$live_hmime bytes=$live_hbytes"
