name: Sync Explore hero assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/data/sync-explore-hero-assets.mjs"
      - "scripts/data/cloudflare-workers-ai-shim.mjs"
      - ".github/workflows/explore-hero-assets.yml"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: explore-hero-assets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NODE_OPTIONS: --import=./scripts/data/cloudflare-workers-ai-shim.mjs
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ensure JPEG conversion support
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi

      - name: Resolve free-use images and generate any remaining heroes
        run: node scripts/data/sync-explore-hero-assets.mjs

      - name: Detect generated Explore changes
        if: always()
        id: changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- public/images/explore src/data/explore-hero-map.ts scripts/data/explore-hero-report.json)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Explore hero changes to preserve."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Explore hero changes detected."
          fi

      - name: Create Explore hero review branch
        if: ${{ always() && steps.changes.outputs.changed == 'true' }}
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/explore-hero-assets-${GITHUB_RUN_ID}"
          git config user.name "Texas Defined Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/images/explore src/data/explore-hero-map.ts scripts/data/explore-hero-report.json
          git commit -m "chore: attach destination-specific Explore hero images"
          git push origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Open reviewable Explore hero pull request
        if: ${{ always() && steps.changes.outputs.changed == 'true' }}
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          pr_url="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'Review generated Explore hero assets' \
            --body $'Automated Explore hero reconciliation. This PR is intentionally not auto-merged. Review item-level image rights, source/credit metadata, subject relevance, and visual quality before merge. The official TexasDefined validation workflow is dispatched explicitly against this exact branch commit.')"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Opened $pr_url"

      - name: Run official validation on generated branch
        if: ${{ always() && steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: bash scripts/ci/dispatch-validate-branch.sh "$BRANCH"
