name: Sync Explore hero assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/data/sync-explore-hero-assets.mjs"
      - ".github/workflows/explore-hero-assets.yml"

permissions:
  contents: write

concurrency:
  group: explore-hero-assets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure JPEG conversion support
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi

      - name: Resolve free-use images and generate any remaining heroes
        run: node scripts/data/sync-explore-hero-assets.mjs

      - name: Commit reconciled Explore hero assets
        if: always()
        run: |
          git config user.name "Texas Defined Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/images/explore src/data/explore-hero-map.ts scripts/data/explore-hero-report.json
          if git diff --cached --quiet; then
            echo "No Explore hero changes to commit."
            exit 0
          fi
          git commit -m "chore: attach destination-specific Explore hero images [skip ci]"
          git pull --rebase origin main
          git push
