name: Materialize Discover image derivatives

on:
  push:
    branches:
      - fix/discover-image-readiness-13
    paths:
      - .github/workflows/materialize-discover-image-derivatives.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/discover-image-readiness-13
          fetch-depth: 1

      - name: Install generation-only image tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build 1600x900 Discover derivatives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/discover .tmp/discover

          if command -v magick >/dev/null 2>&1; then
            CONVERT="magick"
            IDENTIFY="magick identify"
          elif command -v convert >/dev/null 2>&1 && command -v identify >/dev/null 2>&1; then
            CONVERT="convert"
            IDENTIFY="identify"
          else
            echo "ImageMagick is not available after installation" >&2
            exit 1
          fi

          make_card() {
            local src="$1"
            local out="$2"
            $CONVERT \
              \( "$src" -auto-orient -resize '1600x900^' -gravity center -extent 1600x900 -blur 0x20 \) \
              \( "$src" -auto-orient -resize '1540x840>' \) \
              -gravity center -compose over -composite -strip -quality 88 "$out"
            local dims
            dims=$($IDENTIFY -format '%wx%h' "$out")
            test "$dims" = "1600x900" || { echo "Unexpected output dimensions for $out: $dims" >&2; exit 1; }
          }

          fetch() {
            local url="$1"
            local out="$2"
            curl --fail --location --retry 3 --retry-delay 2 --user-agent 'TexasDefined-Discover-Image-Materializer/1.0' "$url" --output "$out"
          }

          render_browser_card() {
            local image_url="$1"
            local out="$2"
            local chrome
            chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
            test -n "$chrome" || { echo "No Chromium-compatible browser is available on the runner" >&2; exit 1; }
            cat > .tmp/discover/browser-card.html <<HTML
          <!doctype html>
          <html><head><meta charset="utf-8"><style>
          html,body{width:1600px;height:900px;margin:0;overflow:hidden;background:#111}
          img{position:fixed;display:block}
          .bg{inset:-45px;width:1690px;height:990px;object-fit:cover;filter:blur(28px);opacity:.92}
          .fg{left:50%;top:50%;max-width:1540px;max-height:840px;transform:translate(-50%,-50%);object-fit:contain;box-shadow:0 12px 50px rgba(0,0,0,.35)}
          </style></head><body><img class="bg" src="$image_url"><img class="fg" src="$image_url"></body></html>
          HTML
            "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1600,900 --virtual-time-budget=5000 \
              --screenshot=.tmp/discover/browser-card.png "file://$PWD/.tmp/discover/browser-card.html"
            local screenshot_dims
            screenshot_dims=$($IDENTIFY -format '%wx%h' .tmp/discover/browser-card.png)
            test "$screenshot_dims" = "1600x900" || { echo "Unexpected browser card dimensions: $screenshot_dims" >&2; exit 1; }
            $CONVERT .tmp/discover/browser-card.png -strip -quality 88 "$out"
          }

          render_browser_card 'https://texasdefined.com/images/events/chappell-hill-bluebonnet-festival-20260914.webp' public/images/discover/chappell-hill-bluebonnet-festival.webp

          fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/ImaHogg.jpg' .tmp/discover/ima-hogg
          make_card .tmp/discover/ima-hogg public/images/discover/ima-hogg-texas-legacy.webp

          fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/CSP_tent_camping.jpg' .tmp/discover/camping-dog
          make_card .tmp/discover/camping-dog public/images/discover/camping-in-texas-with-your-dog.webp

          fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Eagle_Stadium.jpg' .tmp/discover/eagle-stadium
          make_card .tmp/discover/eagle-stadium public/images/discover/texas-high-school-football-scores-schedules.webp
          make_card .tmp/discover/eagle-stadium public/images/discover/eagle-stadium-allen.webp

          fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Port_Isabel_Texas_Lighthouse.jpg' .tmp/discover/port-isabel
          make_card .tmp/discover/port-isabel public/images/discover/best-lighthouses-to-visit-in-texas.webp

          fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Audie_Murphy.jpg' .tmp/discover/audie-murphy
          make_card .tmp/discover/audie-murphy public/images/discover/texas-medal-of-honor-heroes.webp

          fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Ledger-sm2.jpg' .tmp/discover/red-river-war
          make_card .tmp/discover/red-river-war public/images/discover/texas-red-river-war-guide.webp

          fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/First_Capitol_of_the_Republic_of_Texas_%283967003172%29.jpg' .tmp/discover/republic-capitol
          make_card .tmp/discover/republic-capitol public/images/discover/republic-of-texas-government-trail.webp

          fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Levi_Jordan_Plantation_State_Historic_Site.jpg' .tmp/discover/levi-jordan
          make_card .tmp/discover/levi-jordan public/images/discover/brazoria-plantations-slavery-emancipation-history.webp

          fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/0011FortGriffinTxAdminBuilding.jpg' .tmp/discover/fort-griffin
          make_card .tmp/discover/fort-griffin public/images/discover/texas-frontier-forts-road-trip.webp

          fetch 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Carnival_scene_outside_the_San_Antonio_Stock_Show_and_Rodeo_on_the_grounds_of_the_Freeman_Coliseum,_San_Antonio,_Texas_LCCN2014631343.tif?width=1920' .tmp/discover/freeman-coliseum
          make_card .tmp/discover/freeman-coliseum public/images/discover/freeman-coliseum.webp

          render_browser_card 'https://texasdefined.com/images/sports-venues/xtreme-raceway-park.jpg' public/images/discover/xtreme-raceway-park.webp

          ls -lh public/images/discover/*.webp

      - name: Point Discover metadata at the durable derivatives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib/seo.ts')
          text = path.read_text()

          anchor = 'const META_DESCRIPTION_MAX_LENGTH = 160;\n'
          overrides = '''\nconst TEXASDEFINED_DISCOVER_IMAGE_OVERRIDES: Record<string, string> = {\n  "/event/chappell-hill-bluebonnet-festival": "/images/discover/chappell-hill-bluebonnet-festival.webp",\n  "/article/ima-hogg-texas-legacy": "/images/discover/ima-hogg-texas-legacy.webp",\n  "/article/camping-in-texas-with-your-dog": "/images/discover/camping-in-texas-with-your-dog.webp",\n  "/article/texas-high-school-football-scores-schedules": "/images/discover/texas-high-school-football-scores-schedules.webp",\n  "/article/best-lighthouses-to-visit-in-texas": "/images/discover/best-lighthouses-to-visit-in-texas.webp",\n  "/article/texas-medal-of-honor-heroes": "/images/discover/texas-medal-of-honor-heroes.webp",\n  "/article/texas-red-river-war-guide": "/images/discover/texas-red-river-war-guide.webp",\n  "/article/republic-of-texas-government-trail": "/images/discover/republic-of-texas-government-trail.webp",\n  "/article/brazoria-plantations-slavery-emancipation-history": "/images/discover/brazoria-plantations-slavery-emancipation-history.webp",\n  "/article/texas-frontier-forts-road-trip": "/images/discover/texas-frontier-forts-road-trip.webp",\n  "/sports-venue/freeman-coliseum": "/images/discover/freeman-coliseum.webp",\n  "/sports-venue/eagle-stadium-allen": "/images/discover/eagle-stadium-allen.webp",\n  "/sports-venue/xtreme-raceway-park": "/images/discover/xtreme-raceway-park.webp",\n};\n'''
          if 'TEXASDEFINED_DISCOVER_IMAGE_OVERRIDES' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('SEO insertion anchor changed')
              text = text.replace(anchor, anchor + overrides, 1)

          old_image = '''  const fallbackImage = SOCIAL_IMAGE_FALLBACKS[brand.identity.id];\n  const image = page.image\n    ? { src: page.image, alt: page.imageAlt, type: page.imageType }\n    : fallbackImage;\n  const imageUrl = image ? absoluteUrl(brand, image.src) : undefined;\n'''
          new_image = '''  const fallbackImage = SOCIAL_IMAGE_FALLBACKS[brand.identity.id];\n  const discoverImage = brand.identity.id === "texasdefined" && page.canonicalPath\n    ? TEXASDEFINED_DISCOVER_IMAGE_OVERRIDES[page.canonicalPath]\n    : undefined;\n  const image = discoverImage\n    ? { src: discoverImage, alt: page.imageAlt, type: "image/webp" }\n    : page.image\n      ? { src: page.image, alt: page.imageAlt, type: page.imageType }\n      : fallbackImage;\n  const imageUrl = image ? absoluteUrl(brand, image.src) : undefined;\n  const imageWidth = discoverImage ? 1600 : page.imageWidth;\n  const imageHeight = discoverImage ? 900 : page.imageHeight;\n'''
          if old_image in text:
              text = text.replace(old_image, new_image, 1)
          elif 'const discoverImage = brand.identity.id === "texasdefined"' not in text:
              raise SystemExit('SEO image-selection contract changed')

          old_dims = '''    if (page.imageWidth) meta.push({ property: "og:image:width", content: String(page.imageWidth) });\n    if (page.imageHeight) meta.push({ property: "og:image:height", content: String(page.imageHeight) });\n'''
          new_dims = '''    if (imageWidth) meta.push({ property: "og:image:width", content: String(imageWidth) });\n    if (imageHeight) meta.push({ property: "og:image:height", content: String(imageHeight) });\n'''
          if old_dims in text:
              text = text.replace(old_dims, new_dims, 1)
          elif new_dims not in text:
              raise SystemExit('SEO image-dimension contract changed')

          path.write_text(text)
          PY

      - name: Commit generated derivatives to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/discover/*.webp src/lib/seo.ts
          if git diff --cached --quiet; then
            echo 'No derivative changes to commit.'
            exit 0
          fi
          git commit -m 'Materialize Discover-safe image derivatives'
          git push origin HEAD:fix/discover-image-readiness-13
