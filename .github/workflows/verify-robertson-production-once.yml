name: Verify Robertson County production once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-robertson-production-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify Robertson County production
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          county='/county/robertson'
          legacy='/article/robertson-county-franklin-hearne-calvert-brazos-railroads-texas'
          hero='https://commons.wikimedia.org/wiki/Special:Redirect/file/Robertson_County_Courthouse_Franklin_Texas_2022.jpg?width=1600'
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          page="$workdir/robertson.html"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -A 'TexasDefined production verifier/1.0' --silent --show-error --location --max-time 30 -o "$page" -w '%{http_code}' "${origin}${county}?verify=${GITHUB_SHA}-${attempt}" || true)
            if [ "$code" = '200' ] && grep -Fq 'The county in numbers' "$page" && grep -Fq 'County property-tax resources' "$page" && grep -Fq 'Robertson County: Franklin, Hearne, Calvert and the Brazos-Railroad Crossroads' "$page"; then
              break
            fi
            if [ "$attempt" = '6' ]; then
              echo "Robertson county page verification failed: HTTP $code" >&2
              head -c 1600 "$page" 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

          legacy_headers="$workdir/legacy.headers"
          legacy_code=$(curl -A 'TexasDefined production verifier/1.0' --silent --show-error --max-time 30 -D "$legacy_headers" -o /dev/null -w '%{http_code}' "${origin}${legacy}" || true)
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$legacy_headers")
          if [ "$legacy_code" != '301' ] || [[ "$location" != "${origin}${county}"* ]]; then
            echo "Legacy redirect verification failed: HTTP $legacy_code location=$location" >&2
            exit 1
          fi

          hero_headers="$workdir/hero.headers"
          hero_body="$workdir/hero.bin"
          for attempt in 1 2 3 4 5; do
            hero_code=$(curl -A 'TexasDefined production verifier/1.0 (county image check)' --silent --show-error --location --max-time 45 -D "$hero_headers" -o "$hero_body" -w '%{http_code}' "$hero" || true)
            hero_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); value=$0} END{print value}' "$hero_headers")
            hero_size=$(wc -c < "$hero_body" 2>/dev/null || echo 0)
            if [ "$hero_code" = '200' ] && [[ "$hero_type" =~ ^image/(jpeg|png|webp) ]] && [ "$hero_size" -gt 50000 ]; then
              echo "Robertson hero verified: HTTP $hero_code · $hero_type · ${hero_size} bytes"
              break
            fi
            if [ "$attempt" = '5' ]; then
              echo "Hero verification failed: HTTP $hero_code · type=$hero_type · size=$hero_size" >&2
              exit 1
            fi
            sleep 8
          done

          echo 'Robertson County production certification passed: live county page, preserved structured layer, editorial feature, legacy 301, and raster hero.'

      - name: Publish certification status
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = 'success' ]; then state='success'; description='Robertson County production certification passed'; else state='failure'; description='Robertson County production certification failed'; fi
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"${state}\",\"context\":\"robertson-county-live\",\"description\":\"${description}\"}" >/dev/null
