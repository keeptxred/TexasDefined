name: Certify Childress County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-childress-county-once.yml'

permissions:
  contents: write

concurrency:
  group: certify-childress-county-once
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate and certify Childress County
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          marker='.github/certification/childress-county.json'
          target='04f7b7690699348d21135c2dd019597465290f5c'
          hero='https://upload.wikimedia.org/wikipedia/commons/7/70/Veterans_Memorial_at_the_Childress_County_Courthouse.jpg'

          record() {
            status="$1"; stage="$2"; detail="$3"
            mkdir -p "$(dirname "$marker")"
            python3 - "$marker" "$status" "$stage" "$target" "$detail" <<'PY'
          import datetime, json, pathlib, sys
          path, status, stage, target, detail = sys.argv[1:]
          pathlib.Path(path).write_text(json.dumps({
            'county': 'childress', 'status': status, 'stage': stage,
            'county_commit': target, 'tested_main': '', 'detail': detail[-12000:],
            'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }, indent=2) + '\n', encoding='utf-8')
          PY
            current="$(git rev-parse HEAD)"
            python3 - "$marker" "$current" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); d['tested_main']=sys.argv[2]; p.write_text(json.dumps(d,indent=2)+'\n')
          PY
            git add "$marker"
            git commit -m "Record Childress County production ${status}" >/dev/null || true
            git push origin HEAD:main
          }

          git merge-base --is-ancestor "$target" HEAD || { record fail source 'Childress county commit is not in current main ancestry'; exit 1; }
          fixture='src/data/fixtures/childress-county-childress-railroads-red-river-rolling-plains-texas.ts'
          test -f "$fixture" || { record fail source 'Childress fixture missing'; exit 1; }
          grep -Fq 'countySlug: "childress"' src/data/county-series-profiles-rolling-plains.ts || { record fail source 'Childress profile registration missing'; exit 1; }
          grep -Fq '["childress-county-childress-railroads-red-river-rolling-plains-texas", "childress"]' src/data/county-series.ts || { record fail source 'Childress completion mapping missing'; exit 1; }
          if grep -n 'www\.texasdefined\.com' "$fixture" src/data/county-series-profiles-rolling-plains.ts src/data/county-series.server.ts src/data/county-series.ts >/tmp/childress-www.txt; then
            record fail canonical-host "$(cat /tmp/childress-www.txt)"; exit 1
          fi

          if ! npm run validate >/tmp/childress-validate.log 2>&1; then
            record fail validation "$(tail -200 /tmp/childress-validate.log)"; exit 1
          fi

          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          page=''; code=''
          for attempt in $(seq 1 12); do
            code="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$work/page" -w '%{http_code}' "https://texasdefined.com/county/childress?verify=${target}-${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$code" = 200 ] \
              && grep -Fq 'Childress County: Railroads, Red River Country and the Rolling Plains' "$work/page" \
              && grep -Fq 'The county in numbers' "$work/page" \
              && grep -Fq 'County seat' "$work/page" \
              && grep -Fq '2020 population' "$work/page" \
              && grep -Fq 'County feature' "$work/page"; then page=pass; break; fi
            sleep 5
          done
          [ "$page" = pass ] || { record fail live-page "HTTP=$code expected structured/editorial markers missing"; exit 1; }

          legacy='https://texasdefined.com/article/childress-county-childress-railroads-red-river-rolling-plains-texas'
          lcode="$(curl --max-redirs 0 -sS -D "$work/lh" -o /dev/null -w '%{http_code}' "$legacy" || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$work/lh")"
          if [ "$lcode" != 301 ] || ! [[ "$location" == *'/county/childress'* ]]; then
            record fail legacy-redirect "HTTP=$lcode location=$location"; exit 1
          fi

          hcode="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$work/hh" -o "$work/hb" -w '%{http_code}' "$hero" || true)"
          hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/hh" | cut -d';' -f1)"
          hbytes="$(wc -c < "$work/hb" 2>/dev/null || echo 0)"
          if [ "$hcode" != 200 ] || ! [[ "$hmime" =~ ^image/(jpeg|png|webp)$ ]] || [ "$hbytes" -le 50000 ]; then
            record fail live-hero "HTTP=$hcode MIME=$hmime bytes=$hbytes"; exit 1
          fi

          record pass complete "validate=PASS page=200 structured=yes editorial=yes legacy=301 location=$location hero=$hcode mime=$hmime bytes=$hbytes"
