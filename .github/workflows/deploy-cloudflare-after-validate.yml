name: Publish TexasDefined

on:
  workflow_run:
    workflows: ["Validate TexasDefined"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texasdefined-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_FALLBACK_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      WORKER_NAME: texasdefined-site
    steps:
      - name: Check out the exact validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Cloudflare deploy credentials and Workers access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          check_token() {
            local label="$1"
            local token="$2"
            local response_file="$workdir/${label}.json"
            local http

            if [ -z "$token" ]; then
              echo "$label is not configured." >&2
              return 1
            fi

            http="$(curl --silent --show-error -o "$response_file" -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" || true)"

            if [ "$http" = "200" ] && python3 - "$response_file" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if data.get('success') is True else 1)
          PY
            then
              echo "::add-mask::$token"
              printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
              echo "Cloudflare Workers access confirmed using $label."
              return 0
            fi

            echo "$label could not access Workers Scripts (HTTP ${http:-unknown})." >&2
            python3 - "$response_file" <<'PY' || true
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding='utf-8'))
              errors = data.get('errors') or []
              if errors:
                  print(f"Cloudflare errors: {errors}", file=sys.stderr)
          except Exception:
              pass
          PY
            return 1
          }

          if check_token "CLOUDFLARE_DEPLOY_API_TOKEN" "$CLOUDFLARE_DEPLOY_API_TOKEN"; then
            exit 0
          fi
          if check_token "CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_FALLBACK_API_TOKEN"; then
            echo "Using CLOUDFLARE_API_TOKEN fallback because the deploy-specific token is unavailable or cannot access this account."
            exit 0
          fi

          echo 'Neither configured Cloudflare token can access Workers Scripts for CLOUDFLARE_ACCOUNT_ID.' >&2
          exit 1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build exact validated revision
        run: |
          npm run build
          npm run performance:validate
      - name: Deploy TexasDefined Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --name "$WORKER_NAME" 2>&1 | tee /tmp/wrangler-deploy.log
          preview_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -1 | sed 's/[[:punct:]]$//' || true)"
          if [ -z "$preview_url" ]; then
            subdomain_json="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" || true)"
            subdomain="$(python3 - "$subdomain_json" <<'PY'
          import json, sys
          try:
              print((json.loads(sys.argv[1]).get('result') or {}).get('subdomain') or '')
          except Exception:
              print('')
          PY
            )"
            if [ -n "$subdomain" ]; then
              preview_url="https://${WORKER_NAME}.${subdomain}.workers.dev"
            fi
          fi
          test -n "$preview_url" || { echo 'Worker uploaded but workers.dev URL could not be resolved.' >&2; exit 1; }
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "TexasDefined Worker URL: $preview_url"
      - name: Verify deployed Worker routes
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for path in / /robots.txt /sitemap.xml /fishing /guides /county/travis /texas-symbols; do
            echo "Checking ${PREVIEW_URL}${path}"
            curl --retry 10 --retry-all-errors --retry-delay 3 --max-time 45 -fsSL "${PREVIEW_URL}${path}" -o /tmp/response
            test -s /tmp/response || { echo "Empty response for $path" >&2; exit 1; }
          done
          echo "TexasDefined deployment for $TARGET_SHA passed all workers.dev smoke tests."
