name: Deploy TexasDefined to Cloudflare after validation

on:
  workflow_run:
    workflows: ["Validate TexasDefined"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texasdefined-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      WORKER_NAME: texasdefined-site
    steps:
      - name: Check out the exact validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Cloudflare deploy credentials and Workers access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare deploy token'; exit 1; }
          workers_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          python3 - "$workers_json" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get('success') is not True:
              raise SystemExit(f"Cloudflare deploy token lacks Workers Scripts access: {data.get('errors')!r}")
          print(f"Cloudflare Workers access confirmed ({len(data.get('result') or [])} script(s) visible).")
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build exact validated revision
        run: |
          npm run build
          npm run performance:validate
      - name: Deploy TexasDefined Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --name "$WORKER_NAME" 2>&1 | tee /tmp/wrangler-deploy.log
          preview_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -1 | sed 's/[[:punct:]]$//' || true)"
          if [ -z "$preview_url" ]; then
            subdomain_json="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" || true)"
            subdomain="$(python3 - "$subdomain_json" <<'PY'
          import json, sys
          try:
              print((json.loads(sys.argv[1]).get('result') or {}).get('subdomain') or '')
          except Exception:
              print('')
          PY
            )"
            if [ -n "$subdomain" ]; then
              preview_url="https://${WORKER_NAME}.${subdomain}.workers.dev"
            fi
          fi
          test -n "$preview_url" || { echo 'Worker uploaded but workers.dev URL could not be resolved.' >&2; exit 1; }
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "TexasDefined Worker URL: $preview_url"
      - name: Verify deployed Worker routes
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for path in / /robots.txt /sitemap.xml /fishing /guides /county/travis; do
            echo "Checking ${PREVIEW_URL}${path}"
            curl --retry 10 --retry-all-errors --retry-delay 3 --max-time 45 -fsSL "${PREVIEW_URL}${path}" -o /tmp/response
            test -s /tmp/response || { echo "Empty response for $path" >&2; exit 1; }
          done
          echo "TexasDefined deployment for $TARGET_SHA passed all workers.dev smoke tests."
