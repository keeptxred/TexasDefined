name: Phase 2 venue integration diagnostic

on:
  push:
    branches:
      - phase2/venue-system-integration-20260911

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2/venue-system-integration-20260911
          fetch-depth: 0

      - name: Reuse Phase 2 apply script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          workflow = Path('.github/workflows/phase2-venue-integration-apply.yml').read_text()
          match = re.search(r"          python - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if not match:
              raise SystemExit('Could not extract Phase 2 apply script')
          lines = []
          for line in match.group(1).splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/phase2-apply.py').write_text('\n'.join(lines) + '\n')
          PY
          python /tmp/phase2-apply.py

      - name: Capture focused validator diagnostics
        shell: bash
        run: |
          set +e
          : > .phase2-validation-diagnostics.txt
          for cmd in \
            "node scripts/data/validate-expedia-affiliate.mjs" \
            "node scripts/data/validate-global-event-calendar.mjs" \
            "node scripts/data/validate-sports-venue-phase2.mjs"
          do
            echo "### $cmd" >> .phase2-validation-diagnostics.txt
            bash -lc "$cmd" >> .phase2-validation-diagnostics.txt 2>&1
            status=$?
            echo "exit=$status" >> .phase2-validation-diagnostics.txt
            echo >> .phase2-validation-diagnostics.txt
          done
          exit 0

      - name: Commit applied integration and diagnostics
        shell: bash
        run: |
          rm -f .github/workflows/phase2-venue-integration-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Phase 2 venue production candidates with diagnostics"
          git push origin HEAD:phase2/venue-system-integration-20260911
