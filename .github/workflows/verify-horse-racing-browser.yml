name: Verify horse racing visual and affiliate production
on:
  pull_request:
    paths:
      - 'scripts/ci/verify-horse-racing-browser.mjs'
      - '.github/workflows/verify-horse-racing-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out targeted horse-racing QA
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use existing Chrome and isolated Playwright dependency
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-wp-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Check desktop/mobile racing visual and affiliate navigation
        run: node scripts/ci/verify-horse-racing-browser.mjs
      - name: Save bounded visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horse-racing-browser-qa
          path: artifacts/horse-racing-browser/
          if-no-files-found: warn
          retention-days: 7
