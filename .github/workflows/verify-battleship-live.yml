name: Verify Battleship Texas live production

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Battleship Texas production routes
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'

          fetch_and_require() {
            local path="$1"
            local needle="$2"
            local out
            out="$(mktemp)"
            curl --fail-with-body --silent --show-error --location --max-time 30 \
              "${origin}${path}?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}" -o "$out"
            grep -Fq "$needle" "$out" || {
              echo "Expected text not found on ${path}: ${needle}" >&2
              sed -n '1,80p' "$out" >&2
              exit 1
            }
            echo "Verified ${path}: ${needle}"
          }

          fetch_and_require '/article/battleship-texas-bb-35-history-restoration' 'Battleship Texas (BB-35)'
          fetch_and_require '/destination/battleship-texas' 'Pier 15'
          fetch_and_require '/texas-history' 'Battleship Texas'
          fetch_and_require '/sitemap.xml' '/article/battleship-texas-bb-35-history-restoration'
