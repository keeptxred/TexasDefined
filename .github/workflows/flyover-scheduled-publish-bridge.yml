name: Flyover scheduled publish bridge

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: flyover-texasdefined-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.issue.user.login == 'keeptxred' &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[Flyover Publish TD] ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: texasdefined-publication
    env:
      KEEP_TX_RED_SUPABASE_URL: https://ftkznprjljkhymknvhye.supabase.co
      KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TEXASDEFINED_AUTO_PUBLISH_ENABLED: "true"
      TEXASDEFINED_PUBLISH_CONFIRMATION: PUBLISH_TEXASDEFINED
    steps:
      - name: Validate owner-authorized exact-feed trigger envelope
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          first_line="$(printf '%s\n' "$ISSUE_BODY" | sed -n '1p')"
          run_line="$(printf '%s\n' "$ISSUE_BODY" | sed -n '2p')"
          site_line="$(printf '%s\n' "$ISSUE_BODY" | sed -n '3p')"
          feed_line="$(printf '%s\n' "$ISSUE_BODY" | sed -n '4p')"
          line_count="$(printf '%s\n' "$ISSUE_BODY" | awk 'END {print NR}')"

          [[ "$line_count" -eq 4 ]]
          [[ "$first_line" == "flyover_publish_request_v2" ]]
          [[ "$run_line" =~ ^run_id=[A-Za-z0-9._:-]{8,160}$ ]]
          [[ "$site_line" == "site=texasdefined" ]]
          [[ "$feed_line" =~ ^feed_id=[1-9][0-9]*$ ]]

          echo "RUN_ID=${run_line#run_id=}" >> "$GITHUB_ENV"
          echo "FEED_ID=${feed_line#feed_id=}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate TexasDefined publication guardrails
        run: node scripts/data/validate-texasdefined-auto-publication.mjs

      - name: Publish exact quality-gated TexasDefined feed item
        shell: bash
        run: |
          set -euo pipefail
          node scripts/news/texasdefined-auto-publisher.mjs --publish --limit=1 --feed-id="$FEED_ID" | tee /tmp/flyover-td-publish.jsonl

          node - "$FEED_ID" <<'NODE'
          const fs = require('node:fs');
          const expectedFeedId = Number(process.argv[2]);
          const rows = fs.readFileSync('/tmp/flyover-td-publish.jsonl', 'utf8')
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const queue = rows.find((row) => row.mode === 'publish');
          const published = rows.find((row) => row.published === true);
          if (!queue) throw new Error('Publisher did not emit a queue summary.');
          if (Number(queue.requestedFeedId) !== expectedFeedId) throw new Error('Publisher did not preserve the requested exact feed id.');
          if (!published || Number(published.feedId) !== expectedFeedId) throw new Error(`Requested TexasDefined feed ${expectedFeedId} was not published.`);
          const summary = {
            eligible: Number(queue.eligible || 0),
            requestedFeedId: expectedFeedId,
            published: true,
            feedId: Number(published.feedId),
            slug: published.slug ?? null,
            liveUrl: published.liveUrl ?? null,
          };
          fs.writeFileSync('/tmp/flyover-td-summary.json', JSON.stringify(summary));
          console.log(JSON.stringify(summary));
          NODE

      - name: Record exact-feed result and close successful request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          summary="$(cat /tmp/flyover-td-summary.json)"
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Flyover exact-feed bridge completed \`$RUN_ID\` for TexasDefined feed \`$FEED_ID\`. Publisher result: \`$summary\`. Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --reason completed

      - name: Record failed exact-feed request
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Flyover exact-feed bridge \`$RUN_ID\` for TexasDefined feed \`$FEED_ID\` did not complete. The issue remains open for reconciliation; inspect Actions run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
