name: Validate newsletter repeat traffic

on:
  pull_request:
    paths:
      - 'src/components/editorial/NewsletterSignup.tsx'
      - 'src/components/layout/Footer.tsx'
      - 'src/lib/newsletter.functions.ts'
      - 'supabase/migrations/**'
      - 'scripts/data/validate-newsletter-repeat-traffic.mjs'
      - '.github/workflows/validate-newsletter-repeat-traffic.yml'
  push:
    branches:
      - main
    paths:
      - 'src/components/editorial/NewsletterSignup.tsx'
      - 'src/components/layout/Footer.tsx'
      - 'src/lib/newsletter.functions.ts'
      - 'supabase/migrations/**'
      - 'scripts/data/validate-newsletter-repeat-traffic.mjs'
      - '.github/workflows/validate-newsletter-repeat-traffic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate newsletter repeat-traffic contract
        run: node scripts/data/validate-newsletter-repeat-traffic.mjs
