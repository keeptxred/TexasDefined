name: Bing crawler hints

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bing-crawler-hints.yml

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: texasdefined-publication
    timeout-minutes: 10
    steps:
      - name: Enable Cloudflare Crawler Hints
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          api='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          zones="$(curl --fail-with-body --silent --show-error -H "$auth" --get --data-urlencode 'name=texasdefined.com' --data-urlencode "account.id=$CLOUDFLARE_ACCOUNT_ID" "$api/zones")"
          zone_id="$(printf '%s' "$zones" | jq -r '.result[] | select(.name == "texasdefined.com" and .status == "active") | .id' | head -n1)"
          test -n "$zone_id"
          settings="$(curl --fail-with-body --silent --show-error -H "$auth" "$api/zones/$zone_id/settings")"
          state="$(printf '%s' "$settings" | jq -r '.result[] | select(.id == "crawler_hints") | .value' | head -n1)"
          editable="$(printf '%s' "$settings" | jq -r '.result[] | select(.id == "crawler_hints") | .editable' | head -n1)"
          test -n "$state" || { echo 'crawler_hints is not exposed by the Cloudflare zone-settings API'; exit 2; }
          if [ "$state" != 'on' ]; then
            test "$editable" != 'false'
            curl --fail-with-body --silent --show-error -X PATCH -H "$auth" -H 'Content-Type: application/json' --data '{"value":"on"}' "$api/zones/$zone_id/settings/crawler_hints" >/dev/null
          fi
          verify="$(curl --fail-with-body --silent --show-error -H "$auth" "$api/zones/$zone_id/settings/crawler_hints")"
          test "$(printf '%s' "$verify" | jq -r '.result.value')" = 'on'
          echo 'Cloudflare Crawler Hints is ON for texasdefined.com.'

      - name: Verify Bingbot and sitemaps
        shell: bash
        run: |
          set -euo pipefail
          robots="$(curl --fail-with-body --silent --show-error --location https://texasdefined.com/robots.txt)"
          printf '%s' "$robots" | grep -Fq 'User-agent: Bingbot'
          printf '%s' "$robots" | grep -Fq 'Sitemap: https://texasdefined.com/sitemap.xml'
          printf '%s' "$robots" | grep -Fq 'Sitemap: https://texasdefined.com/sitemap-explore.xml'
          for sitemap in sitemap.xml sitemap-explore.xml; do
            body="$(curl --fail-with-body --silent --show-error --location "https://texasdefined.com/$sitemap")"
            printf '%s' "$body" | grep -Fq '<urlset'
            printf '%s' "$body" | grep -Fq '<loc>https://texasdefined.com/'
          done
          echo 'Bingbot access and both TexasDefined sitemaps are live.'
