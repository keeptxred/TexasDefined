name: Bing IndexNow

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bing-crawler-hints.yml
      - public/0c2b08423ce5be707dd931f57239acf1.txt
      - src/routes/sitemap[.]xml.ts
      - src/routes/sitemap-explore[.]xml.ts

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: texasdefined-publication
    timeout-minutes: 15
    steps:
      - name: Check out TexasDefined
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TexasDefined
        run: npm run build

      - name: Deploy IndexNow key to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Verify Bing discovery and IndexNow ownership
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          key='0c2b08423ce5be707dd931f57239acf1'
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 -fsSL \
            "$origin/robots.txt" -o "$workdir/robots.txt"
          grep -Fq 'User-agent: Bingbot' "$workdir/robots.txt"
          grep -Fq 'Sitemap: https://texasdefined.com/sitemap.xml' "$workdir/robots.txt"
          grep -Fq 'Sitemap: https://texasdefined.com/sitemap-explore.xml' "$workdir/robots.txt"

          curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 -fsSL \
            "$origin/$key.txt" -o "$workdir/key.txt"
          test "$(tr -d '\r\n' < "$workdir/key.txt")" = "$key"

          for sitemap in sitemap.xml sitemap-explore.xml; do
            curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 -fsSL \
              "$origin/$sitemap" -o "$workdir/$sitemap"
            grep -Fq '<urlset' "$workdir/$sitemap"
            grep -Fq '<loc>https://texasdefined.com/' "$workdir/$sitemap"
          done

          echo 'Bingbot access, both sitemaps, and the IndexNow ownership key are live.'

      - name: Submit current canonical URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          key='0c2b08423ce5be707dd931f57239acf1'
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 -fsSL \
            "$origin/sitemap.xml" -o "$workdir/sitemap.xml"
          curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 -fsSL \
            "$origin/sitemap-explore.xml" -o "$workdir/sitemap-explore.xml"

          python3 - "$workdir" "$origin" "$key" <<'PY'
          import json
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          workdir = pathlib.Path(sys.argv[1])
          origin = sys.argv[2]
          key = sys.argv[3]
          urls = set()
          for filename in ('sitemap.xml', 'sitemap-explore.xml'):
              root = ET.parse(workdir / filename).getroot()
              for element in root.iter():
                  if element.tag.rsplit('}', 1)[-1] == 'loc' and element.text:
                      url = element.text.strip()
                      parsed = urlparse(url)
                      if parsed.scheme == 'https' and parsed.netloc == 'texasdefined.com':
                          urls.add(url)

          if not urls:
              raise SystemExit('No canonical TexasDefined URLs found in the live sitemaps.')
          if len(urls) > 10000:
              raise SystemExit(f'IndexNow batch exceeds 10,000 URLs: {len(urls)}')

          payload = {
              'host': 'texasdefined.com',
              'key': key,
              'keyLocation': f'{origin}/{key}.txt',
              'urlList': sorted(urls),
          }
          (workdir / 'indexnow.json').write_text(json.dumps(payload), encoding='utf-8')
          print(f'Prepared {len(urls)} canonical URLs for IndexNow.')
          PY

          status="$(curl --silent --show-error \
            -o "$workdir/indexnow-response.txt" \
            -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary "@$workdir/indexnow.json" \
            https://api.indexnow.org/indexnow)"

          case "$status" in
            200|202)
              echo "IndexNow accepted the TexasDefined URL batch with HTTP $status."
              ;;
            *)
              echo "IndexNow submission failed with HTTP $status."
              cat "$workdir/indexnow-response.txt"
              exit 1
              ;;
          esac
