name: TexasDefined OpenAI Facebook Engagement

on:
  schedule:
    # Run both UTC variants so the intended 10:30 AM and 6:30 PM America/Chicago
    # slots remain stable across daylight-saving transitions. The slot gate below
    # makes the non-matching UTC run a no-op.
    - cron: "30 15 * * *"
    - cron: "30 16 * * *"
    - cron: "30 23 * * *"
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: TexasDefined engagement slot
        required: true
        default: morning
        type: choice
        options:
          - morning
          - evening
      dry_run:
        description: Generate and store the image without publishing to Facebook
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: texasdefined-openai-facebook-engagement
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PUBLISHER_ORIGIN: https://keeptxred-site.freddy-coppola.workers.dev
      TD_IMAGE_ATTRIBUTION: Brought to you by your friends at TexasDefined.com
    steps:
      - name: Check out TexasDefined
        uses: actions/checkout@v4

      - name: Resolve Central-time slot
        id: slot
        shell: bash
        env:
          MANUAL_SLOT: ${{ inputs.slot }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          date_key=$(TZ=America/Chicago date +%F)
          should_run=false
          dry_run=false
          slot=""

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            slot="$MANUAL_SLOT"
            dry_run="$MANUAL_DRY_RUN"
            should_run=true
          else
            # GitHub scheduled workflows can start hours after their nominal cron
            # time. Resolve the intended slot from the cron expression plus the
            # current Central DST offset instead of the delayed runner wall clock.
            central_offset=$(TZ=America/Chicago date +%z)
            case "$central_offset" in
              -0500)
                case "$SCHEDULE_EXPRESSION" in
                  "30 15 * * *") slot=morning; should_run=true ;;
                  "30 23 * * *") slot=evening; should_run=true ;;
                  "30 16 * * *"|"30 0 * * *") should_run=false ;;
                  *) echo "Unexpected TexasDefined Facebook schedule expression: ${SCHEDULE_EXPRESSION:-missing}" >&2; exit 1 ;;
                esac
                ;;
              -0600)
                case "$SCHEDULE_EXPRESSION" in
                  "30 16 * * *") slot=morning; should_run=true ;;
                  "30 0 * * *") slot=evening; should_run=true ;;
                  "30 15 * * *"|"30 23 * * *") should_run=false ;;
                  *) echo "Unexpected TexasDefined Facebook schedule expression: ${SCHEDULE_EXPRESSION:-missing}" >&2; exit 1 ;;
                esac
                ;;
              *)
                echo "Unexpected America/Chicago UTC offset: ${central_offset}" >&2
                exit 1
                ;;
            esac
          fi

          echo "date_key=$date_key" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "TexasDefined Facebook slot: date=$date_key schedule=${SCHEDULE_EXPRESSION:-manual} slot=${slot:-none} should_run=$should_run dry_run=$dry_run"

      - name: Select exact TexasDefined engagement post
        id: candidate
        if: steps.slot.outputs.should_run == 'true'
        shell: bash
        env:
          TD_SOCIAL_DATE: ${{ steps.slot.outputs.date_key }}
          TD_SOCIAL_SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tdfb
          node scripts/social/select-facebook-engagement.mjs > /tmp/tdfb/candidate.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/tdfb/candidate.json').read_text(encoding='utf-8'))
          message = data.get('message')
          if not isinstance(message, str) or not message:
              raise SystemExit('TexasDefined selector returned no exact post text')
          Path('/tmp/tdfb/post.txt').write_text(message, encoding='utf-8')
          PY

          source_post_id=$(jq -r '.id // empty' /tmp/tdfb/candidate.json)
          category=$(jq -r '.category // empty' /tmp/tdfb/candidate.json)
          if [[ -z "$source_post_id" || -z "$category" || ! -s /tmp/tdfb/post.txt ]]; then
            echo 'TexasDefined candidate is incomplete.' >&2
            exit 1
          fi
          echo "source_post_id=$source_post_id" >> "$GITHUB_OUTPUT"
          echo "category=$category" >> "$GITHUB_OUTPUT"
          echo "Selected TexasDefined engagement post ${source_post_id} (${category})."

      - name: Generate image from exact Facebook post text
        id: image
        if: steps.slot.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo 'OPENAI_API_KEY is missing from the TexasDefined repository secrets.' >&2
            exit 1
          fi
          if [[ ! -s /tmp/tdfb/post.txt ]]; then
            echo 'Exact Facebook post text is missing; image generation is blocked.' >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          post_text = Path('/tmp/tdfb/post.txt').read_text(encoding='utf-8')
          if not post_text:
              raise SystemExit('Exact Facebook post text is empty')
          prompt = 'Generate an image for this Facebook post.\n\n' + post_text
          Path('/tmp/tdfb/openai-request.json').write_text(
              json.dumps({
                  'model': 'gpt-image-2',
                  'prompt': prompt,
                  'size': '1536x1024',
              }, ensure_ascii=False),
              encoding='utf-8',
          )
          Path('/tmp/tdfb/prompt.txt').write_text(prompt, encoding='utf-8')
          PY

          status=$(curl -sS -o /tmp/tdfb/openai-response.json -w '%{http_code}' \
            --max-time 900 \
            -X POST 'https://api.openai.com/v1/images/generations' \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/tdfb/openai-request.json || echo 000)

          if [[ "$status" != "200" ]]; then
            echo "OpenAI image generation failed with HTTP ${status}." >&2
            jq -r '.error.message // "No OpenAI error detail returned"' /tmp/tdfb/openai-response.json 2>/dev/null >&2 || true
            exit 1
          fi

          image_b64=$(jq -r '.data[0].b64_json // empty' /tmp/tdfb/openai-response.json)
          if [[ -z "$image_b64" ]]; then
            echo 'OpenAI returned no image; Facebook publishing is blocked.' >&2
            exit 1
          fi

          printf '%s' "$image_b64" | base64 --decode > /tmp/tdfb/generated-image.png
          if [[ ! -s /tmp/tdfb/generated-image.png ]]; then
            echo 'Generated image is empty; Facebook publishing is blocked.' >&2
            exit 1
          fi

          mime_type=$(file --brief --mime-type /tmp/tdfb/generated-image.png)
          case "$mime_type" in
            image/png|image/jpeg|image/webp) ;;
            *) echo "Generated asset has invalid MIME type: $mime_type" >&2; exit 1 ;;
          esac

          expected_attribution='Brought to you by your friends at TexasDefined.com'
          if [[ "${TD_IMAGE_ATTRIBUTION:-}" != "$expected_attribution" ]]; then
            echo 'TexasDefined image attribution configuration is missing or incorrect; publishing is blocked.' >&2
            exit 1
          fi
          printf '%s\n' "$TD_IMAGE_ATTRIBUTION" > /tmp/tdfb/attribution.txt

          if command -v magick >/dev/null 2>&1; then
            image_convert=(magick)
            image_identify=(magick identify)
          elif command -v convert >/dev/null 2>&1 && command -v identify >/dev/null 2>&1; then
            image_convert=(convert)
            image_identify=(identify)
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
            image_convert=(convert)
            image_identify=(identify)
          fi

          width=$("${image_identify[@]}" -format '%w' /tmp/tdfb/generated-image.png)
          height=$("${image_identify[@]}" -format '%h' /tmp/tdfb/generated-image.png)
          if [[ ! "$width" =~ ^[0-9]+$ || ! "$height" =~ ^[0-9]+$ || "$width" -lt 600 || "$height" -lt 400 ]]; then
            echo "Generated image dimensions are invalid for attribution overlay: ${width}x${height}" >&2
            exit 1
          fi

          footer_height=$(( height / 11 ))
          (( footer_height < 80 )) && footer_height=80
          (( footer_height > 120 )) && footer_height=120
          point_size=$(( width / 46 ))
          (( point_size < 24 )) && point_size=24
          (( point_size > 38 )) && point_size=38

          "${image_convert[@]}" \
            -size "${width}x${footer_height}" \
            xc:'#111111' \
            -font DejaVu-Sans \
            -fill white \
            -gravity center \
            -pointsize "$point_size" \
            -annotate +0+0 "$TD_IMAGE_ATTRIBUTION" \
            /tmp/tdfb/attribution-footer.png

          if [[ ! -s /tmp/tdfb/attribution-footer.png ]]; then
            echo 'TexasDefined attribution footer could not be rendered; publishing is blocked.' >&2
            exit 1
          fi

          "${image_convert[@]}" \
            /tmp/tdfb/generated-image.png \
            /tmp/tdfb/attribution-footer.png \
            -gravity south \
            -composite \
            /tmp/tdfb/generated-image-attributed.png

          if [[ ! -s /tmp/tdfb/generated-image-attributed.png ]]; then
            echo 'TexasDefined attribution could not be applied to the generated image; publishing is blocked.' >&2
            exit 1
          fi
          mv /tmp/tdfb/generated-image-attributed.png /tmp/tdfb/generated-image.png

          attributed_mime_type=$(file --brief --mime-type /tmp/tdfb/generated-image.png)
          if [[ "$attributed_mime_type" != "image/png" ]]; then
            echo "Attributed Facebook asset has invalid MIME type: $attributed_mime_type" >&2
            exit 1
          fi
          mime_type="$attributed_mime_type"

          image_sha256=$(sha256sum /tmp/tdfb/generated-image.png | awk '{print $1}')
          echo "$image_sha256" > /tmp/tdfb/image.sha256
          echo "mime_type=$mime_type" >> "$GITHUB_OUTPUT"
          echo "image_sha256=$image_sha256" >> "$GITHUB_OUTPUT"

          IMAGE_SHA256="$image_sha256" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          candidate = json.loads(Path('/tmp/tdfb/candidate.json').read_text(encoding='utf-8'))
          metadata = {
              'source_post_id': candidate['id'],
              'date': candidate['date'],
              'slot': candidate['slot'],
              'category': candidate['category'],
              'post_text': Path('/tmp/tdfb/post.txt').read_text(encoding='utf-8'),
              'image_prompt': Path('/tmp/tdfb/prompt.txt').read_text(encoding='utf-8'),
              'attribution': Path('/tmp/tdfb/attribution.txt').read_text(encoding='utf-8').strip(),
              'model': 'gpt-image-2',
              'image_sha256': os.environ['IMAGE_SHA256'],
          }
          Path('/tmp/tdfb/metadata.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Store generated Facebook image
        id: store
        if: steps.slot.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: texasdefined-facebook-${{ steps.slot.outputs.date_key }}-${{ steps.slot.outputs.slot }}-${{ steps.candidate.outputs.source_post_id }}
          path: |
            /tmp/tdfb/generated-image.png
            /tmp/tdfb/image.sha256
            /tmp/tdfb/post.txt
            /tmp/tdfb/prompt.txt
            /tmp/tdfb/attribution.txt
            /tmp/tdfb/attribution-footer.png
            /tmp/tdfb/metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Reload exact stored Facebook artifact
        if: steps.slot.outputs.should_run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: texasdefined-facebook-${{ steps.slot.outputs.date_key }}-${{ steps.slot.outputs.slot }}-${{ steps.candidate.outputs.source_post_id }}
          path: /tmp/tdfb-stored

      - name: Verify stored Facebook artifact round trip
        id: stored
        if: steps.slot.outputs.should_run == 'true'
        shell: bash
        env:
          IMAGE_SHA256: ${{ steps.image.outputs.image_sha256 }}
        run: |
          set -euo pipefail
          for required in generated-image.png image.sha256 post.txt prompt.txt attribution.txt attribution-footer.png metadata.json; do
            if [[ ! -s "/tmp/tdfb-stored/${required}" ]]; then
              echo "Stored Facebook artifact is missing ${required}; publishing is blocked." >&2
              exit 1
            fi
          done

          stored_sha=$(sha256sum /tmp/tdfb-stored/generated-image.png | awk '{print $1}')
          stored_manifest_sha=$(tr -d '[:space:]' < /tmp/tdfb-stored/image.sha256)
          if [[ "$stored_sha" != "$IMAGE_SHA256" || "$stored_manifest_sha" != "$IMAGE_SHA256" ]]; then
            echo 'Stored Facebook image SHA-256 does not match the generated image; publishing is blocked.' >&2
            exit 1
          fi
          if ! cmp -s /tmp/tdfb/post.txt /tmp/tdfb-stored/post.txt; then
            echo 'Stored Facebook post text changed after artifact storage; publishing is blocked.' >&2
            exit 1
          fi

          expected_attribution='Brought to you by your friends at TexasDefined.com'
          stored_attribution=$(tr -d '\r\n' < /tmp/tdfb-stored/attribution.txt)
          if [[ "$stored_attribution" != "$expected_attribution" ]]; then
            echo 'Stored Facebook image attribution is missing or incorrect; publishing is blocked.' >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          stored_post = Path('/tmp/tdfb-stored/post.txt').read_text(encoding='utf-8')
          stored_prompt = Path('/tmp/tdfb-stored/prompt.txt').read_text(encoding='utf-8')
          stored_attribution = Path('/tmp/tdfb-stored/attribution.txt').read_text(encoding='utf-8').strip()
          metadata = json.loads(Path('/tmp/tdfb-stored/metadata.json').read_text(encoding='utf-8'))
          expected_prompt = 'Generate an image for this Facebook post.\n\n' + stored_post
          expected_attribution = 'Brought to you by your friends at TexasDefined.com'
          if stored_prompt != expected_prompt:
              raise SystemExit('Stored image prompt no longer equals the required prefix plus exact post text')
          if stored_attribution != expected_attribution:
              raise SystemExit('Stored attribution no longer equals the required TexasDefined.com footer')
          if metadata.get('post_text') != stored_post:
              raise SystemExit('Stored metadata post text does not match the stored exact post text')
          if metadata.get('image_prompt') != stored_prompt:
              raise SystemExit('Stored metadata image prompt does not match the stored prompt')
          if metadata.get('attribution') != expected_attribution:
              raise SystemExit('Stored metadata attribution does not match the required TexasDefined.com footer')
          PY

          stored_mime_type=$(file --brief --mime-type /tmp/tdfb-stored/generated-image.png)
          if [[ "$stored_mime_type" != "image/png" ]]; then
            echo "Stored attributed Facebook asset has invalid MIME type: $stored_mime_type" >&2
            exit 1
          fi

          if command -v magick >/dev/null 2>&1; then
            image_convert=(magick)
            image_identify=(magick identify)
            image_compare=(magick compare)
          elif command -v convert >/dev/null 2>&1 && command -v identify >/dev/null 2>&1 && command -v compare >/dev/null 2>&1; then
            image_convert=(convert)
            image_identify=(identify)
            image_compare=(compare)
          else
            echo 'ImageMagick verification tools are missing after attribution rendering; publishing is blocked.' >&2
            exit 1
          fi

          stored_width=$("${image_identify[@]}" -format '%w' /tmp/tdfb-stored/generated-image.png)
          stored_height=$("${image_identify[@]}" -format '%h' /tmp/tdfb-stored/generated-image.png)
          stored_footer_width=$("${image_identify[@]}" -format '%w' /tmp/tdfb-stored/attribution-footer.png)
          stored_footer_height=$("${image_identify[@]}" -format '%h' /tmp/tdfb-stored/attribution-footer.png)
          if [[ "$stored_footer_width" != "$stored_width" || ! "$stored_footer_height" =~ ^[0-9]+$ || "$stored_footer_height" -lt 80 || "$stored_footer_height" -gt 120 ]]; then
            echo 'Stored TexasDefined attribution footer dimensions are invalid; publishing is blocked.' >&2
            exit 1
          fi

          "${image_convert[@]}" \
            /tmp/tdfb-stored/generated-image.png \
            -gravity south \
            -crop "${stored_width}x${stored_footer_height}+0+0" \
            +repage \
            /tmp/tdfb-stored/rendered-footer-proof.png

          pixel_diff=$("${image_compare[@]}" -metric AE \
            /tmp/tdfb-stored/attribution-footer.png \
            /tmp/tdfb-stored/rendered-footer-proof.png \
            null: 2>&1 || true)
          if [[ "$pixel_diff" != "0" ]]; then
            echo "Stored Facebook image does not contain the exact rendered TexasDefined.com footer; pixel difference=${pixel_diff}; publishing is blocked." >&2
            exit 1
          fi
          rm -f /tmp/tdfb-stored/rendered-footer-proof.png

          echo "mime_type=$stored_mime_type" >> "$GITHUB_OUTPUT"
          echo "image_sha256=$stored_sha" >> "$GITHUB_OUTPUT"

      - name: Publish the exact stored image to Facebook
        if: steps.slot.outputs.should_run == 'true' && steps.slot.outputs.dry_run != 'true'
        shell: bash
        env:
          MIME_TYPE: ${{ steps.stored.outputs.mime_type }}
          IMAGE_SHA256: ${{ steps.stored.outputs.image_sha256 }}
          SOURCE_POST_ID: ${{ steps.candidate.outputs.source_post_id }}
          ARTIFACT_URL: ${{ steps.store.outputs.artifact-url }}
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/tdfb-stored/generated-image.png || ! -s /tmp/tdfb-stored/post.txt || ! -s /tmp/tdfb-stored/attribution.txt || ! -s /tmp/tdfb-stored/attribution-footer.png ]]; then
            echo 'Reloaded stored image, exact post text, or attribution is missing; Facebook publishing is blocked.' >&2
            exit 1
          fi
          if [[ -z "$ARTIFACT_URL" ]]; then
            echo 'GitHub did not return an artifact storage URL; Facebook publishing is blocked.' >&2
            exit 1
          fi

          expected_attribution='Brought to you by your friends at TexasDefined.com'
          stored_attribution=$(tr -d '\r\n' < /tmp/tdfb-stored/attribution.txt)
          if [[ "$stored_attribution" != "$expected_attribution" ]]; then
            echo 'TexasDefined attribution verification failed immediately before publish; publishing is blocked.' >&2
            exit 1
          fi

          current_sha=$(sha256sum /tmp/tdfb-stored/generated-image.png | awk '{print $1}')
          if [[ "$current_sha" != "$IMAGE_SHA256" ]]; then
            echo 'Stored Facebook image changed after verification; publishing is blocked.' >&2
            exit 1
          fi

          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=keeptxred-facebook"
          oidc_token=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" | jq -r '.value // empty')
          if [[ -z "$oidc_token" ]]; then
            echo 'GitHub Actions did not issue the TexasDefined Facebook OIDC token.' >&2
            exit 1
          fi

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          status=$(curl -sS -o /tmp/tdfb/facebook-response.json -w '%{http_code}' \
            --max-time 420 \
            -X POST \
            -H 'accept: application/json' \
            -H "Authorization: Bearer ${oidc_token}" \
            -F "post_text=</tmp/tdfb-stored/post.txt" \
            -F "image=@/tmp/tdfb-stored/generated-image.png;type=${MIME_TYPE}" \
            -F "image_sha256=${IMAGE_SHA256}" \
            -F "source_post_id=${SOURCE_POST_ID}" \
            -F "artifact_url=${ARTIFACT_URL}" \
            -F "github_run_url=${run_url}" \
            "${PUBLISHER_ORIGIN%/}/api/public/hooks/publish-texasdefined-generated-image" || echo 000)

          cat /tmp/tdfb/facebook-response.json 2>/dev/null || true
          echo
          if [[ "$status" != "200" ]] || ! jq -e '.ok == true' /tmp/tdfb/facebook-response.json >/dev/null 2>&1; then
            echo "TexasDefined Facebook publish failed with HTTP ${status}; no fallback will be attempted." >&2
            exit 1
          fi

          if jq -e '.posted == true' /tmp/tdfb/facebook-response.json >/dev/null 2>&1; then
            post_url=$(jq -r '.post_url // empty' /tmp/tdfb/facebook-response.json)
            echo "Published exact stored OpenAI image to Facebook: ${post_url}"
          elif jq -e '.duplicate == true' /tmp/tdfb/facebook-response.json >/dev/null 2>&1; then
            echo 'Exact post is already present on the TexasDefined Facebook Page; duplicate publish skipped.'
          else
            echo 'Publisher returned success without a post or duplicate confirmation; failing closed.' >&2
            exit 1
          fi

      - name: Report dry-run artifact
        if: steps.slot.outputs.should_run == 'true' && steps.slot.outputs.dry_run == 'true'
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.store.outputs.artifact-url }}
          IMAGE_SHA256: ${{ steps.stored.outputs.image_sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "$ARTIFACT_URL" || -z "$IMAGE_SHA256" || ! -s /tmp/tdfb-stored/generated-image.png || ! -s /tmp/tdfb-stored/attribution.txt || ! -s /tmp/tdfb-stored/attribution-footer.png ]]; then
            echo 'Dry-run storage round-trip verification failed.' >&2
            exit 1
          fi
          echo "Dry run complete: generated image was attributed, stored, reloaded, pixel-verified, and SHA-verified at ${ARTIFACT_URL}; sha256=${IMAGE_SHA256}; Facebook was not called."
