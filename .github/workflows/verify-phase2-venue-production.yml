name: Verify Phase 2 venue production

on:
  workflow_run:
    workflows:
      - 'Deploy TexasDefined production'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-venue-production-verification
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify five Phase 2 venue journeys on production
        run: node scripts/ci/verify-phase2-venue-production.mjs
