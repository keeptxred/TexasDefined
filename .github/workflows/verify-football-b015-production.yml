name: Football Batch015 25-school live Chrome evidence (no graduation)
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
  deployments: read
  actions: read
concurrency:
  group: football-b015-25-school-chrome
  cancel-in-progress: false
jobs:
  chrome:
    if: ${{ (github.event_name == 'issue_comment' && github.event.issue.number == 5794 && github.actor == 'keeptxred' && github.event.comment.body == '/run-b015-chrome') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require 25 authored Batch015 guides without premature registry promotion
        id: batch_scope
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const reg=JSON.parse(readFileSync('docs/football-authority/REGISTRY.json','utf8'));
          const source=readFileSync('src/data/high-school-football/program-editorial-b015-loader.server.ts','utf8');
          const slugs=["dell-city","denison","denton","denton-braswell","denton-guyer","denton-ryan","denver-city","detroit","devine","deweyville","dhanis","diana-new-diana","diboll","dickinson","dilley","dimmitt","donna","donna-north","dripping-springs","dublin","dumas","duncanville","eagle-mountain","eagle-pass","eagle-pass-winn"];
          if(slugs.length!==25 || slugs.some(slug=>!source.includes("'"+slug+"'")||reg.schoolRecords.find(s=>s.slug===slug)?.status!=='NOT_REVIEWED'))throw Error('Batch015 source/registry boundary not satisfied');
          appendFileSync(process.env.GITHUB_OUTPUT,'active=true'+String.fromCharCode(10));
          NODE
      - name: Resolve exact live Worker to verified GitHub source SHA
        if: steps.batch_scope.outputs.active == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/pin-football-b010-production-release.mjs
      - name: Require exact signed production release for active Batch015
        if: steps.batch_scope.outputs.active == 'true' && steps.release.outputs.ready != 'true'
        run: |
          echo 'No exact signed Worker/source release: cannot skip 75 Chrome cases.' >&2
          exit 1
      - name: Check out exact published source
        if: steps.batch_scope.outputs.active == 'true' && steps.release.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
      - name: Install isolated real Chrome driver
        if: steps.batch_scope.outputs.active == 'true' && steps.release.outputs.ready == 'true'
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/td-b015-chrome --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify all Batch015 schools and counties in real Chrome
        if: steps.batch_scope.outputs.active == 'true' && steps.release.outputs.ready == 'true'
        env:
          FOOTBALL_CHROME_SOURCE_SHA: ${{ steps.release.outputs.sha }}
          FOOTBALL_EXPECTED_WORKER_VERSION: ${{ steps.release.outputs.worker }}
        run: |
          node --check scripts/ci/verify-football-b015-production.mjs
          node scripts/ci/verify-football-b015-production.mjs
      - name: Upload compact Batch015 machine evidence
        if: always() && steps.batch_scope.outputs.active == 'true' && steps.release.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: football-b015-25-school-live-chrome-evidence
          path: artifacts/b015-chrome-report.json
          retention-days: 7
          if-no-files-found: error