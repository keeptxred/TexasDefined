name: Validate Texas Defined AI official research

on:
  pull_request:
    paths:
      - 'src/lib/texas-defined-ai.server.ts'
      - 'src/lib/texas-defined-official-research.server.ts'
      - 'src/data/texas-data-sources.ts'
      - 'scripts/ai/validate-ai-official-research.mjs'
      - '.github/workflows/validate-ai-official-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate official research contract
        run: node scripts/ai/validate-ai-official-research.mjs
