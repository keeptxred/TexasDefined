name: Verify November 2 oversized image transfers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-november2-image-transfers.yml'
      - 'scripts/ci/november2-oversized-images.mjs'
      - 'scripts/ci/verify-november2-image-transfer-production.mjs'
  workflow_dispatch:
  schedule:
    - cron: '43 12 * * 0'

permissions:
  contents: read
  actions: read

concurrency:
  group: oversized-image-sample-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check exact 50 supplied image URLs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure image audit syntax and report scope are valid
        run: |
          node --check scripts/ci/november2-oversized-images.mjs
          node --check scripts/ci/verify-november2-image-transfer-production.mjs
      # This workflow changes only audit scripts/data and no production Worker
      # assets. A GitHub source-only commit may have its Deploy workflow
      # cancelled by a newer main release; do not wait on that exact SHA.
      # The prior image-delivery fix (#6541) already passed deployment.
      - name: Measure production image delivery in bounded parallel requests
        run: node scripts/ci/verify-november2-image-transfer-production.mjs
      - name: Upload exact per-image payload and exception evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: november2-image-transfer-${{ github.run_id }}
          path: .artifacts/oversized-image-production-audit.json
          if-no-files-found: warn
          retention-days: 14
