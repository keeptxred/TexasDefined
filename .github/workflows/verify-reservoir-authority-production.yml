name: Verify reservoir authority production

on:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-reservoir-authority-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reservoir-authority-production-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    name: Verify five reservoir authority profiles live
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Probe direct Worker and custom domain
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origins = [
            ['direct-worker', 'https://texasdefined-site.freddy-coppola.workers.dev'],
            ['custom-domain', 'https://texasdefined.com'],
          ];

          const articles = [
            ['lake-buchanan-water-system-guide', "The reservoir's role during drought"],
            ['lake-travis-water-system-guide', 'Two pools in one reservoir'],
            ['lake-whitney-water-system-guide', 'The 1950s drought changed how Texans thought about reservoirs'],
            ['possum-kingdom-water-system-guide', 'The first water-supply reservoir in the Brazos basin'],
            ['toledo-bend-water-system-guide', 'Why two states built one reservoir'],
          ];

          function visibleText(html) {
            return html
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ')
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&nbsp;/gi, ' ')
              .replace(/&amp;/gi, '&')
              .replace(/&quot;/gi, '"')
              .replace(/&#39;|&#x27;|&apos;/gi, "'")
              .replace(/&lt;/gi, '<')
              .replace(/&gt;/gi, '>')
              .replace(/\s+/g, ' ')
              .trim();
          }

          async function probe(label, origin, slug, marker, mode) {
            const suffix = mode === 'revision'
              ? `?reservoir-live=${encodeURIComponent(`${process.env.DEPLOY_SHA ?? 'local'}-${Date.now()}-${slug}`)}`
              : '';
            const url = `${origin}/article/${slug}${suffix}`;
            let last = '';

            for (let attempt = 1; attempt <= 4; attempt += 1) {
              try {
                const response = await fetch(url, {
                  redirect: 'follow',
                  cache: 'no-store',
                  signal: AbortSignal.timeout(30_000),
                  headers: { 'user-agent': 'TexasDefined-CI-Reservoir-Authority/1.0' },
                });
                const html = await response.text();
                const text = visibleText(html);
                const reading = text.match(/About\s+(\d+)\s+minutes?\b/i);
                const minutes = reading ? Number(reading[1]) : null;
                const markerLive = text.includes(marker);
                const readingLive = minutes !== null && minutes >= 5;
                const status = `status=${response.status} marker=${markerLive} reading=${minutes ?? 'missing'} cf-cache=${response.headers.get('cf-cache-status') ?? 'none'}`;
                console.log(`[${label}:${slug}:${mode}] attempt ${attempt} ${status}`);
                if (response.ok && markerLive && readingLive) return { label, slug, mode, minutes };
                last = `${status}; expected expanded reservoir marker and reading time >= 5 minutes`;
              } catch (error) {
                last = error instanceof Error ? error.message : String(error);
                console.log(`[${label}:${slug}:${mode}] attempt ${attempt} error=${last}`);
              }

              if (attempt < 4) await new Promise((resolve) => setTimeout(resolve, 3000));
            }

            throw new Error(`${label}:${slug}:${mode} failed: ${last}`);
          }

          const checks = [];
          for (const [label, origin] of origins) {
            for (const [slug, marker] of articles) {
              for (const mode of ['canonical', 'revision']) checks.push([label, origin, slug, marker, mode]);
            }
          }

          const results = await Promise.allSettled(
            checks.map(([label, origin, slug, marker, mode]) => probe(label, origin, slug, marker, mode)),
          );
          const failures = results
            .filter((result) => result.status === 'rejected')
            .map((result) => result.reason instanceof Error ? result.reason.message : String(result.reason));

          if (failures.length) {
            for (const failure of failures) console.error(`::error title=Reservoir authority production mismatch::${failure}`);
            process.exit(1);
          }

          console.log(`Verified ${articles.length} expanded reservoir authority profiles on direct Worker and custom domain, canonical and cache-busted, with deep-content markers and reading time >= 5 minutes.`);
          NODE
