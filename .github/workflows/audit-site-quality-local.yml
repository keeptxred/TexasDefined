name: Full site quality audit on local Worker (disabled by owner)

# Owner hold 2026-10-19: no sitewide crawl may execute, including through workflow_call.

on:
  workflow_dispatch:
    inputs:
      audit:
        description: Complete audit to run on the local built Worker
        type: choice
        options: [all, links, sitemap, images, venues, counties, rv, lakes, whole, football]
        default: all
  workflow_call:
    inputs:
      audit:
        type: string
        default: all

permissions:
  contents: read
  actions: read

concurrency:
  group: local-site-quality-audit
  cancel-in-progress: true

jobs:
  audit:
    # Reusable callers must not bypass the owner hold.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LOCAL_AUDIT_REPORT_DIR: /tmp/local-quality-reports-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test local-only crawl transport and workflow cost contract
        run: node --test scripts/ci/local-audit-fetch.test.mjs
      - name: Install governed image build tools
        shell: bash
        run: |
          set -euo pipefail
          if (command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1) && command -v rsvg-convert >/dev/null 2>&1; then
            exit 0
          fi
          test -f /etc/apt/sources.list.d/ubuntu.sources
          timeout 180s sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          timeout 180s sudo apt-get install -y --no-install-recommends imagemagick librsvg2-bin
      - name: Fingerprint governed Discover registry
        id: discover_fingerprint
        run: echo "sha=$(node scripts/assets/materialize-discover-overrides.mjs --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Restore governed Discover derivatives
        id: discover_cache
        uses: actions/cache@v4
        with:
          path: public/images/discover
          key: local-audit-discover-${{ runner.os }}-${{ steps.discover_fingerprint.outputs.sha }}
      - name: Recover exact-registry Discover derivatives from successful production
        if: steps.discover_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_FINGERPRINT: ${{ steps.discover_fingerprint.outputs.sha }}
        run: |
          set -euo pipefail
          prefix="governed-discover-derivatives-${SOURCE_FINGERPRINT}-"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          if ! recent="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-production.yml/runs?per_page=12" --jq '.workflow_runs[] | select(.conclusion == "success") | .id')"; then
            echo "::warning::Discover production artifact lookup unavailable; governed source materialization remains mandatory."
            exit 0
          fi
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name' || true)"
            artifact="$(printf '%s\n' "$names" | grep -F "$prefix" | head -n 1 || true)"
            [[ "$artifact" == "$prefix"* ]] || continue
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$stage"; then
              mkdir -p public/images/discover
              find "$stage" -type f -name '*.webp' -exec cp -t public/images/discover {} +
              echo "Restored governed Discover derivatives from successful production run $run_id; the materializer will validate every file."
              break
            fi
          done <<< "$recent"
      - name: Build the complete site once on this runner
        run: |
          npm run prebuild
          node scripts/assets/materialize-discover-overrides.mjs
          npm run build
          git diff --exit-code -- src/routeTree.gen.ts
      - name: Run full audits against local built Worker
        env:
          LOCAL_QUALITY_AUDIT: ${{ inputs.audit || 'all' }}
        run: node scripts/ci/run-local-quality-audits.mjs "$LOCAL_QUALITY_AUDIT"
      - name: Upload complete local audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-site-quality-audit-${{ inputs.audit || 'all' }}
          path: ${{ env.LOCAL_AUDIT_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 14
