name: Diagnose PR 2310 bundle once

on:
  push:
    branches:
      - growth/find-my-texas-county
    paths:
      - .github/workflows/diagnose-pr2310-bundle.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: growth/find-my-texas-county
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compare branch and main production stylesheets
        shell: bash
        run: |
          set -euo pipefail
          FEATURE_SHA="$(git rev-parse HEAD)"
          git fetch origin main

          npm run build
          BRANCH_CSS="$(find dist/client/assets .output/public/assets -maxdepth 1 -type f -name 'styles-*.css' 2>/dev/null | head -n 1)"
          test -n "$BRANCH_CSS"
          cp "$BRANCH_CSS" /tmp/pr2310-branch.css
          BRANCH_SIZE="$(wc -c < /tmp/pr2310-branch.css)"

          git reset --hard "$FEATURE_SHA"
          git checkout --detach origin/main
          npm ci --no-audit --no-fund
          npm run build
          MAIN_CSS="$(find dist/client/assets .output/public/assets -maxdepth 1 -type f -name 'styles-*.css' 2>/dev/null | head -n 1)"
          test -n "$MAIN_CSS"
          cp "$MAIN_CSS" /tmp/pr2310-main.css
          MAIN_SIZE="$(wc -c < /tmp/pr2310-main.css)"

          git checkout --detach "$FEATURE_SHA"
          git reset --hard "$FEATURE_SHA"
          mkdir -p ops/diagnostics
          python3 <<'PY' > ops/diagnostics/pr2310-client-bundle.txt
          from pathlib import Path

          branch = Path('/tmp/pr2310-branch.css').read_text()
          main = Path('/tmp/pr2310-main.css').read_text()

          def pieces(css: str):
              return {piece.strip() + '}' for piece in css.split('}') if piece.strip()}

          added = sorted(pieces(branch) - pieces(main), key=lambda value: (len(value), value))
          removed = sorted(pieces(main) - pieces(branch), key=lambda value: (len(value), value))
          print('PR 2310 stylesheet diagnostic')
          print(f'branch_bytes={len(branch.encode())}')
          print(f'main_bytes={len(main.encode())}')
          print(f'delta_bytes={len(branch.encode()) - len(main.encode())}')
          print(f'added_rule_fragments={len(added)}')
          print(f'removed_rule_fragments={len(removed)}')
          print('\nADDED RULE FRAGMENTS')
          for rule in added:
              print(rule)
          print('\nREMOVED RULE FRAGMENTS')
          for rule in removed:
              print(rule)
          PY
          cat ops/diagnostics/pr2310-client-bundle.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/diagnostics/pr2310-client-bundle.txt
          git commit -m 'Record PR 2310 stylesheet diff'
          git push origin HEAD:growth/find-my-texas-county
