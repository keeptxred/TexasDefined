name: Delete merged PR branches

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

jobs:
  delete-merged-head:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Delete merged head branch if it still exists
        shell: bash
        run: |
          set -euo pipefail
          ref="heads/${HEAD_BRANCH}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${ref}"
            echo "Deleted merged branch ${HEAD_BRANCH}."
          else
            echo "Merged branch ${HEAD_BRANCH} is already absent."
          fi
