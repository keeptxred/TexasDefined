name: Dallas road-time guide desktop and mobile Chrome QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/verify-dallas-hour-guides-browser.mjs'
      - '.github/workflows/dallas-hour-guides-browser.yml'
  workflow_run:
    workflows: ["Deploy TexasDefined production"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dallas-visual-\${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  scenario-contract:
    if: github.event_name == 'pull_request'
    name: Protect Dallas browser acceptance scenario
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate bounded test scenario without visiting production
        run: |
          node --check scripts/ci/verify-dallas-hour-guides-browser.mjs
          node scripts/ci/verify-dallas-hour-guides-browser.mjs --self-test

  bounded-production-chrome:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Three Dallas guides, two viewports each
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact successful production commit
        uses: actions/checkout@v4
        with:
          ref: \${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Scope browser visits to Dallas-related releases only
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]] ||
             git diff --name-only HEAD^ HEAD -- \
               'src/data/dallas-small-town-drives.ts' \
               'src/data/metro-proximity.ts' \
               'src/data/metro-proximity-town-references.ts' \
               'src/data/metro-proximity-page-data.server.ts' \
               'src/routes/explore.near.$metro.$collection.tsx' \
               'src/routes/explore.near.$metro.$collection.lazy.tsx' \
               'scripts/ci/verify-dallas-hour-guides-browser.mjs' \
               '.github/workflows/dallas-hour-guides-browser.yml' | grep -q .; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "Unrelated release: no Dallas browser visit."
          fi
      - name: Prepare preinstalled Chrome and temporary standalone Playwright core
        if: steps.scope.outputs.changed == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-dallas-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify six desktop and mobile Dallas page scenarios
        if: steps.scope.outputs.changed == 'yes'
        env:
          TARGET_DEPLOY_SHA: \${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          node --check scripts/ci/verify-dallas-hour-guides-browser.mjs
          node scripts/ci/verify-dallas-hour-guides-browser.mjs --self-test
          node scripts/ci/verify-dallas-hour-guides-browser.mjs
      - name: Preserve six screenshots and inspectable acceptance report
        if: always() && steps.scope.outputs.changed == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: dallas-hour-guides-visual-\${{ github.run_id }}
          path: artifacts/dallas-hour-guides-browser/
          if-no-files-found: warn
          retention-days: 14
