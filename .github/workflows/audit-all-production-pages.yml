name: Audit all TexasDefined production pages

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/audit-all-production-pages.yml'
      - 'scripts/ci/audit-production-page-experience.mjs'
      - 'scripts/data/validate-page-experience.mjs'
      - 'scripts/data/run-site-quality-watch.mjs'
      - 'src/components/editorial/ArticleBody.tsx'
      - 'src/routes/event.$slug.lazy.tsx'
      - 'src/lib/public-routes.ts'
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'

permissions:
  contents: read

concurrency:
  group: audit-all-texasdefined-production-pages
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out audit code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check exhaustive page auditor
        run: node --check scripts/ci/audit-production-page-experience.mjs

      - name: Audit every governed production page
        id: page_audit
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: node scripts/ci/audit-production-page-experience.mjs

      - name: Capture production runtime error for a failed PR audit
        if: ${{ github.event_name == 'pull_request' && steps.page_audit.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p page-audit-diagnostics
          timeout 25s npx --yes wrangler@4.120.1 tail texasdefined-site --format json --status error > page-audit-diagnostics/worker-errors.jsonl 2> page-audit-diagnostics/worker-errors.stderr &
          TAIL_PID=$!
          sleep 5
          curl -sS --max-time 20 -D page-audit-diagnostics/sitemap-explore.headers -o page-audit-diagnostics/sitemap-explore.body "https://texasdefined.com/sitemap-explore.xml?td_runtime_probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
          wait "${TAIL_PID}" || true
          echo '::group::TexasDefined production Worker errors'
          cat page-audit-diagnostics/worker-errors.jsonl 2>/dev/null || true
          cat page-audit-diagnostics/worker-errors.stderr 2>/dev/null || true
          echo '::endgroup::'

      - name: Upload page audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texasdefined-page-experience-audit
          path: |
            page-experience-audit.json
            page-audit-diagnostics/
          if-no-files-found: warn
          retention-days: 14
