name: Audit all TexasDefined production pages

on:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'

permissions:
  contents: read

concurrency:
  group: audit-all-texasdefined-production-pages
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check exhaustive page auditor
        run: node --check scripts/ci/audit-production-page-experience.mjs

      - name: Audit every governed production page
        run: node scripts/ci/audit-production-page-experience.mjs

      - name: Upload page audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texasdefined-page-experience-audit
          path: page-experience-audit.json
          if-no-files-found: warn
          retention-days: 14
