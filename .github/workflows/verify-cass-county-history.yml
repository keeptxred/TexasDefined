name: Cass County history accuracy and sources
on:
  pull_request:
    paths:
      - 'src/data/fixtures/cass-county-linden-atlanta-piney-woods-wright-patman-texas.ts'
      - 'scripts/ci/verify-cass-county-history.mjs'
      - 'scripts/ci/verify-cass-county-production.mjs'
      - 'src/data/county-profile.ts'
      - '.github/workflows/verify-cass-county-history.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/fixtures/cass-county-linden-atlanta-piney-woods-wright-patman-texas.ts'
      - 'scripts/ci/verify-cass-county-history.mjs'
      - 'scripts/ci/verify-cass-county-production.mjs'
      - 'src/data/county-profile.ts'
      - '.github/workflows/verify-cass-county-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/ci/verify-cass-county-history.mjs
      - run: node scripts/ci/verify-cass-county-history.mjs
      - run: node --check scripts/ci/verify-cass-county-production.mjs
