name: TexasDefined article publication readiness

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run inspects the eligible queue; publish also requires repository activation and exact confirmation.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      confirmation:
        description: For publish mode only, enter PUBLISH_TEXASDEFINED.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: texasdefined-article-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate inactive publication controls
        run: node scripts/data/validate-texasdefined-auto-publication.mjs
      - name: Report activation state safely
        env:
          TEXASDEFINED_AUTO_PUBLISH_ENABLED: ${{ vars.TEXASDEFINED_AUTO_PUBLISH_ENABLED }}
        run: |
          if [ -z "$TEXASDEFINED_AUTO_PUBLISH_ENABLED" ]; then
            echo "TEXASDEFINED_AUTO_PUBLISH_ENABLED_PRESENT=false"
          else
            echo "TEXASDEFINED_AUTO_PUBLISH_ENABLED_PRESENT=true"
          fi
          if [ "$TEXASDEFINED_AUTO_PUBLISH_ENABLED" = "true" ]; then
            echo "TEXASDEFINED_AUTO_PUBLISH_ENABLED_TRUE=true"
          else
            echo "TEXASDEFINED_AUTO_PUBLISH_ENABLED_TRUE=false"
          fi

  run:
    needs: validate
    runs-on: ubuntu-latest
    environment: texasdefined-publication
    env:
      KEEP_TX_RED_SUPABASE_URL: https://ftkznprjljkhymknvhye.supabase.co
      KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TEXASDEFINED_AUTO_PUBLISH_ENABLED: ${{ vars.TEXASDEFINED_AUTO_PUBLISH_ENABLED }}
      TEXASDEFINED_PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Inspect eligible queue without publishing
        if: inputs.mode == 'dry-run'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/news/texasdefined-auto-publisher.mjs --limit=3 | tee /tmp/texasdefined-dry-run.jsonl
          node - <<'NODE'
          const fs = require('node:fs');
          const rows = fs.readFileSync('/tmp/texasdefined-dry-run.jsonl', 'utf8')
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const queue = rows.find((row) => row.mode === 'dry-run');
          if (!queue) throw new Error('Dry-run queue summary was not emitted.');
          for (const field of ['rawEligible', 'eligible', 'held', 'selected', 'deferred', 'published', 'skipped', 'failed']) {
            if (!Number.isInteger(queue[field]) || queue[field] < 0) throw new Error(`Dry-run summary has invalid ${field}: ${queue[field]}`);
          }
          if (queue.rawEligible !== queue.eligible + queue.held) {
            throw new Error(`Dry-run ownership mismatch: rawEligible=${queue.rawEligible}, eligible=${queue.eligible}, held=${queue.held}`);
          }
          if (queue.eligible !== queue.selected + queue.deferred) {
            throw new Error(`Dry-run count mismatch: eligible=${queue.eligible}, selected=${queue.selected}, deferred=${queue.deferred}`);
          }
          if (queue.published !== 0 || queue.skipped !== 0 || queue.failed !== 0) {
            throw new Error('Dry-run must not publish, skip, or fail queue items.');
          }
          console.log(JSON.stringify({
            mode: 'dry-run-summary',
            rawEligible: queue.rawEligible,
            eligible: queue.eligible,
            held: queue.held,
            selected: queue.selected,
            deferred: queue.deferred,
            published: queue.published,
            skipped: queue.skipped,
            failed: queue.failed,
            ids: queue.ids,
          }));
          NODE
      - name: Publish one approved eligible article
        if: inputs.mode == 'publish'
        run: node scripts/news/texasdefined-auto-publisher.mjs --publish --limit=1
