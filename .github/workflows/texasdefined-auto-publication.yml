name: TexasDefined article publication readiness

on:
  schedule:
    - cron: '45 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run inspects the eligible queue; manual publish requires repository activation and exact confirmation.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      confirmation:
        description: For manual publish mode only, enter PUBLISH_TEXASDEFINED.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: texasdefined-article-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate guarded publication controls
        run: node scripts/data/validate-texasdefined-auto-publication.mjs
      - name: Report activation state safely
        env:
          TEXASDEFINED_AUTO_PUBLISH_ENABLED: ${{ vars.TEXASDEFINED_AUTO_PUBLISH_ENABLED }}
          TEXASDEFINED_AUTO_PUBLISH_DISABLED: ${{ vars.TEXASDEFINED_AUTO_PUBLISH_DISABLED }}
        run: |
          if [ -z "$TEXASDEFINED_AUTO_PUBLISH_ENABLED" ]; then
            echo "TEXASDEFINED_AUTO_PUBLISH_ENABLED_PRESENT=false"
          else
            echo "TEXASDEFINED_AUTO_PUBLISH_ENABLED_PRESENT=true"
          fi
          if [ "$TEXASDEFINED_AUTO_PUBLISH_ENABLED" = "true" ]; then
            echo "TEXASDEFINED_AUTO_PUBLISH_ENABLED_TRUE=true"
          else
            echo "TEXASDEFINED_AUTO_PUBLISH_ENABLED_TRUE=false"
          fi
          if [ "$TEXASDEFINED_AUTO_PUBLISH_DISABLED" = "true" ]; then
            echo "TEXASDEFINED_AUTO_PUBLISH_SCHEDULE_DISABLED=true"
          else
            echo "TEXASDEFINED_AUTO_PUBLISH_SCHEDULE_DISABLED=false"
          fi

  run:
    needs: validate
    if: github.event_name != 'schedule' || vars.TEXASDEFINED_AUTO_PUBLISH_DISABLED != 'true'
    runs-on: ubuntu-latest
    environment: texasdefined-publication
    env:
      KEEP_TX_RED_SUPABASE_URL: https://ftkznprjljkhymknvhye.supabase.co
      KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TEXASDEFINED_AUTO_PUBLISH_ENABLED: ${{ github.event_name == 'schedule' && 'true' || vars.TEXASDEFINED_AUTO_PUBLISH_ENABLED }}
      TEXASDEFINED_PUBLISH_CONFIRMATION: ${{ github.event_name == 'schedule' && 'PUBLISH_TEXASDEFINED' || inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect eligible queue without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/news/texasdefined-auto-publisher.mjs --limit=3 | tee /tmp/texasdefined-dry-run.jsonl
          node - <<'NODE'
          const fs = require('node:fs');
          const rows = fs.readFileSync('/tmp/texasdefined-dry-run.jsonl', 'utf8')
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const queue = rows.find((row) => row.mode === 'dry-run');
          if (!queue) throw new Error('Dry-run queue summary was not emitted.');
          console.log(JSON.stringify({
            mode: 'dry-run-summary',
            eligible: queue.eligible,
            published: 0,
            skipped: 0,
            failed: 0,
            ids: queue.ids,
          }));
          NODE
      - name: Publish one production-ready article
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
        run: node scripts/news/texasdefined-auto-publisher.mjs --publish --limit=1
