name: Diagnose article SSR local

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-article-ssr-local.yml'
      - 'src/routes/article.$slug.tsx'
      - 'src/router.tsx'
      - 'src/start.ts'
      - 'src/server.ts'
      - 'vite.config.ts'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Start built preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/texasdefined-preview.log 2>&1 &
          echo $! > /tmp/texasdefined-preview.pid
          for attempt in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/texasdefined-preview.log
          exit 1
      - name: Inspect raw route HTML
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' | tee /tmp/ssr-diagnostic.txt
          const cases = [
            ['about', 'http://127.0.0.1:4173/about'],
            ['fixture', 'http://127.0.0.1:4173/article/caddo-lake-cypress-morning'],
            ['remote', 'http://127.0.0.1:4173/article/sam-houston-texas-life-legacy'],
          ];
          for (const [label, url] of cases) {
            const response = await fetch(url, { headers: { 'user-agent': 'TexasDefinedLocalSsrDiagnostic/4.0' } });
            const html = await response.text();
            const mainStart = html.indexOf('<main');
            const mainEnd = mainStart >= 0 ? html.indexOf('</main>', mainStart) : -1;
            const main = mainStart >= 0 && mainEnd >= 0 ? html.slice(mainStart, mainEnd + 7) : '';
            const probes = {
              status: response.status,
              bytes: html.length,
              mainBytes: main.length,
              articleOpen: main.includes('<article'),
              articleClose: main.includes('</article>'),
              primarySource: main.includes('Primary source:'),
              sourceHeading: main.includes('Sources and further reading'),
              caddoText: main.includes('Caddo Lake'),
              samHoustonText: main.includes('Sam Houston'),
              suspenseOpen: (main.match(/<!--\$[^>]*-->/g) ?? []).length,
              suspenseClose: (main.match(/<!--\/\$-->/g) ?? []).length,
              templateCount: (main.match(/<template\b/g) ?? []).length,
              mainIndex: mainStart,
              articleIndex: html.indexOf('<article'),
            };
            console.log(`${label}: ${JSON.stringify(probes)}`);
            console.log(`${label}-main: ${main.slice(0, 12000).replace(/\s+/g, ' ')}`);
          }
          NODE
      - name: Preserve diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-ssr-diagnostic
          path: |
            /tmp/ssr-diagnostic.txt
            /tmp/texasdefined-preview.log
          if-no-files-found: error
      - name: Preview log
        if: always()
        run: cat /tmp/texasdefined-preview.log || true
