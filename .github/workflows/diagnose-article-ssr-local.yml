name: Diagnose article SSR local

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-article-ssr-local.yml'
      - 'src/routes/article.$slug.tsx'
      - 'src/router.tsx'
      - 'src/start.ts'
      - 'src/server.ts'
      - 'vite.config.ts'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Start built preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/texasdefined-preview.log 2>&1 &
          echo $! > /tmp/texasdefined-preview.pid
          for attempt in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/texasdefined-preview.log
          exit 1
      - name: Inspect raw article HTML
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const cases = [
            ['fixture', 'http://127.0.0.1:4173/article/caddo-lake-cypress-morning'],
            ['remote', 'http://127.0.0.1:4173/article/sam-houston-texas-life-legacy'],
          ];
          for (const [label, url] of cases) {
            const response = await fetch(url, { headers: { 'user-agent': 'TexasDefinedLocalSsrDiagnostic/1.0' } });
            const html = await response.text();
            const probes = {
              status: response.status,
              bytes: html.length,
              articleOpen: html.includes('<article'),
              articleClose: html.includes('</article>'),
              primarySource: html.includes('Primary source:'),
              sourceHeading: html.includes('Sources and further reading'),
              caddoTitle: html.includes('Caddo Lake'),
              samHoustonTitle: html.includes('Sam Houston'),
              bodyIndex: html.indexOf('<body'),
              articleIndex: html.indexOf('<article'),
            };
            console.log(`${label}: ${JSON.stringify(probes)}`);
            const bodyIndex = html.indexOf('<body');
            if (bodyIndex >= 0) console.log(`${label}-body-sample: ${html.slice(bodyIndex, bodyIndex + 2500).replace(/\s+/g, ' ')}`);
          }
          NODE
      - name: Preview log
        if: always()
        run: cat /tmp/texasdefined-preview.log || true
