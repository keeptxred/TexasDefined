name: Verify hunting production

on:
  pull_request:
    paths:
      - '.github/workflows/verify-hunting-production.yml'
      - 'scripts/data/verify-hunting-production.mjs'
  workflow_dispatch:
  # The strict live deer/sitemap assertions must run only after the actual Worker
  # release succeeds, never against undeployed PR content.
  workflow_run:
    workflows: ["Deploy TexasDefined production"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  validate-syntax:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate hunting smoke syntax without probing undeployed production
        run: |
          node --check scripts/data/verify-hunting-production.mjs
          node scripts/data/verify-hunting-production.mjs --self-test

  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out deployed verifier contract
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify hunting production
        run: node scripts/data/verify-hunting-production.mjs
