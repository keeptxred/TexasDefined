name: Verify hunting production

on:
  workflow_run:
    workflows: ['Deploy TexasDefined production']
    types: [completed]
  pull_request:
    paths:
      - '.github/workflows/verify-hunting-production.yml'
      - 'scripts/data/verify-hunting-production.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-hunting-production.yml'
      - 'scripts/data/verify-hunting-production.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify hunting production
        run: node scripts/data/verify-hunting-production.mjs
