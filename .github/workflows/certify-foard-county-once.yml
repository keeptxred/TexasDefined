name: Certify Foard County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-foard-county-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_SHA: 10ecaa5d537ac7ebd68e30dfae3814a1cbc3fe00
      GH_TOKEN: ${{ github.token }}
      ORIGIN: https://texasdefined.com
      HERO_URL: https://commons.wikimedia.org/wiki/Special:Redirect/file/Foard%20County%20Texas%20Courthouse%202015.jpg?width=1600
    steps:
      - name: Publish certification pending
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data '{"state":"pending","context":"foard-county-certification","description":"Checking Foard County production page, redirect and hero"}' >/dev/null

      - name: Verify Foard County production
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          page_ok=0
          for attempt in $(seq 1 12); do
            status="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 45 -sS -o "$work/page" -w '%{http_code}' "${ORIGIN}/county/foard?verify=${TARGET_SHA}-${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$status" = 200 ] \
              && grep -Fq 'Foard County: Crowell, the Pease River and the Working Rolling Plains' "$work/page" \
              && grep -Fq 'The county in numbers' "$work/page" \
              && grep -Fq 'County seat' "$work/page" \
              && grep -Fq '2020 population' "$work/page" \
              && grep -Fq 'County feature' "$work/page" \
              && grep -Fq 'Crowell' "$work/page"; then
              page_ok=1
              break
            fi
            sleep 5
          done
          [ "$page_ok" = 1 ] || { echo "Foard page verification failed; last HTTP=$status" >&2; exit 1; }

          legacy="${ORIGIN}/article/foard-county-crowell-pease-river-ranching-oil-rolling-plains-texas"
          legacy_status="$(curl --max-redirs 0 --max-time 45 -sS -D "$work/legacy-headers" -o /dev/null -w '%{http_code}' "$legacy" || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$work/legacy-headers")"
          [ "$legacy_status" = 301 ] || { echo "Legacy redirect HTTP=$legacy_status location=$location" >&2; exit 1; }
          [[ "$location" == *'/county/foard'* ]] || { echo "Legacy redirect destination incorrect: $location" >&2; exit 1; }

          hero_status="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$work/hero-headers" -o "$work/hero" -w '%{http_code}' "$HERO_URL" || true)"
          hero_mime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/hero-headers" | cut -d';' -f1)"
          hero_bytes="$(wc -c < "$work/hero" 2>/dev/null || echo 0)"
          [ "$hero_status" = 200 ] || { echo "Hero HTTP=$hero_status" >&2; exit 1; }
          [[ "$hero_mime" =~ ^image/(jpeg|png|webp)$ ]] || { echo "Hero MIME=$hero_mime" >&2; exit 1; }
          [ "$hero_bytes" -gt 50000 ] || { echo "Hero payload too small: $hero_bytes" >&2; exit 1; }

          echo "page_http=$status" >> "$GITHUB_OUTPUT"
          echo "legacy_http=$legacy_status" >> "$GITHUB_OUTPUT"
          echo "legacy_location=$location" >> "$GITHUB_OUTPUT"
          echo "hero_http=$hero_status" >> "$GITHUB_OUTPUT"
          echo "hero_mime=$hero_mime" >> "$GITHUB_OUTPUT"
          echo "hero_bytes=$hero_bytes" >> "$GITHUB_OUTPUT"

      - name: Publish certification success
        if: success()
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data '{"state":"success","context":"foard-county-certification","description":"Foard page, structured/editorial layers, 301 and raster hero passed"}' >/dev/null
          echo "page=${{ steps.verify.outputs.page_http }} legacy=${{ steps.verify.outputs.legacy_http }} location=${{ steps.verify.outputs.legacy_location }} hero=${{ steps.verify.outputs.hero_http }} mime=${{ steps.verify.outputs.hero_mime }} bytes=${{ steps.verify.outputs.hero_bytes }}"

      - name: Publish certification failure
        if: failure()
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data '{"state":"failure","context":"foard-county-certification","description":"Foard county-specific production verification failed"}' >/dev/null
