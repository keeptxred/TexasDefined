name: Certify Hardeman County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-hardeman-county-once.yml'

permissions:
  contents: write

concurrency:
  group: certify-hardeman-county-once
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HERO_URL: https://commons.wikimedia.org/wiki/Special:Redirect/file/Hardeman_County_Courthouse_(Quanah,_Texas).jpg?width=1600
      MARKER: .github/certification/hardeman-county.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Validate, deploy, verify, and record
        shell: bash
        run: |
          set -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          record() {
            status="$1"; stage="$2"; target="$3"; detail="$4"
            mkdir -p "$(dirname "$MARKER")"
            python3 - "$MARKER" "$status" "$stage" "$target" "$detail" <<'PY'
          import json, pathlib, sys, datetime
          path, status, stage, target, detail = sys.argv[1:]
          pathlib.Path(path).write_text(json.dumps({
            'county':'hardeman','status':status,'stage':stage,'target_sha':target,
            'detail':detail[-12000:],'recorded_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }, indent=2)+'\n', encoding='utf-8')
          PY
            git add -- "$MARKER"
            git commit -m "Record Hardeman County production ${status}" >/dev/null || true
            git push origin HEAD:main
          }

          test -n "$CLOUDFLARE_ACCOUNT_ID" || { record fail credentials "$(git rev-parse HEAD)" 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { record fail credentials "$(git rev-parse HEAD)" 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }

          tmp="$(mktemp -d)"
          hs="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$tmp/h" -o "$tmp/b" -w '%{http_code}' "$HERO_URL" || true)"
          hm="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$tmp/h" | cut -d';' -f1)"
          hb="$(wc -c < "$tmp/b" 2>/dev/null || echo 0)"
          if [ "$hs" != 200 ] || ! [[ "$hm" =~ ^image/(jpeg|png|webp)$ ]] || [ "$hb" -le 50000 ]; then
            record fail hero-source "$(git rev-parse HEAD)" "HTTP=$hs MIME=$hm bytes=$hb"; exit 1
          fi
          rm -rf "$tmp"

          for pass in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            target="$(git rev-parse HEAD)"
            fixture='src/data/fixtures/hardeman-county-quanah-chillicothe-red-river-rolling-plains-texas.ts'
            test -f "$fixture" || { record fail source "$target" 'Hardeman fixture missing'; exit 1; }
            grep -Fq 'countySlug: "hardeman"' src/data/county-series-profiles-continued.ts || { record fail source "$target" 'Hardeman registry missing'; exit 1; }
            grep -Fq '["hardeman-county-quanah-chillicothe-red-river-rolling-plains-texas", "hardeman"]' src/data/county-series.ts || { record fail source "$target" 'Hardeman completion/legacy mapping missing'; exit 1; }
            if grep -n 'www\.texasdefined\.com' "$fixture" src/data/county-series-profiles-continued.ts src/data/county-series.ts >/tmp/hardeman-www.txt; then
              record fail canonical-host "$target" "$(cat /tmp/hardeman-www.txt)"; exit 1
            fi

            if ! npm run validate >/tmp/hardeman-validate.log 2>&1; then
              record fail validation "$target" "$(tail -180 /tmp/hardeman-validate.log)"; exit 1
            fi
            git fetch origin main
            latest="$(git rev-parse origin/main)"
            [ "$latest" = "$target" ] || { echo "main moved during validation; retrying"; continue; }

            if ! npm run deploy >/tmp/hardeman-deploy.log 2>&1; then
              record fail deployment "$target" "$(tail -180 /tmp/hardeman-deploy.log)"; exit 1
            fi
            git fetch origin main
            latest="$(git rev-parse origin/main)"
            [ "$latest" = "$target" ] || { echo "main moved during deployment; retrying"; continue; }

            w="$(mktemp -d)"; ok=0
            for attempt in $(seq 1 12); do
              ps="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$w/page" -w '%{http_code}' "https://texasdefined.com/county/hardeman?verify=${target}-${GITHUB_RUN_ID}-${attempt}" || true)"
              if [ "$ps" = 200 ] \
                && grep -Fq 'Hardeman County: Quanah, Chillicothe and the Red River Rolling Plains' "$w/page" \
                && grep -Fq 'The county in numbers' "$w/page" \
                && grep -Fq 'County seat' "$w/page" \
                && grep -Fq '2020 population' "$w/page" \
                && grep -Fq 'County feature' "$w/page" \
                && grep -Fq 'Quanah' "$w/page" \
                && grep -Fq 'https://texasdefined.com/county/hardeman' "$w/page"; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ] || { record fail live-page "$target" "last_status=$ps"; exit 1; }

            legacy='https://texasdefined.com/article/hardeman-county-quanah-chillicothe-red-river-rolling-plains-texas'
            ls="$(curl --max-redirs 0 -sS -D "$w/lh" -o /dev/null -w '%{http_code}' "$legacy" || true)"
            loc="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$w/lh")"
            if [ "$ls" != 301 ] || ! [[ "$loc" == *'/county/hardeman'* ]]; then record fail legacy-redirect "$target" "HTTP=$ls location=$loc"; exit 1; fi

            his="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$w/hh" -o "$w/hb" -w '%{http_code}' "$HERO_URL" || true)"
            him="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$w/hh" | cut -d';' -f1)"
            hib="$(wc -c < "$w/hb" 2>/dev/null || echo 0)"
            if [ "$his" != 200 ] || ! [[ "$him" =~ ^image/(jpeg|png|webp)$ ]] || [ "$hib" -le 50000 ]; then record fail live-hero "$target" "HTTP=$his MIME=$him bytes=$hib"; exit 1; fi

            git fetch origin main
            latest="$(git rev-parse origin/main)"
            [ "$latest" = "$target" ] || { rm -rf "$w"; echo "main moved during live verification; retrying"; continue; }
            rm -rf "$w"
            record pass complete "$target" "validate=PASS deploy=PASS page=200 structured=yes editorial=yes legacy=301 location=$loc hero=$his mime=$him bytes=$hib"
            exit 0
          done

          record fail concurrency "$(git rev-parse HEAD)" 'Could not obtain stable validated/deployed main after five passes'
          exit 1
