name: Verify Tierra Blanca Creek after TexasDefined production deploy

on:
  workflow_run:
    workflows: ["Deploy TexasDefined production"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-live:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify real deployed page and sitemap
        run: |
          python3 - <<'PY'
          import urllib.request
          base = "https://texasdefined.com"
          headers = {"User-Agent": "TexasDefined-Authority-PostDeploy/1.0", "Cache-Control": "no-cache"}
          def get(path):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=25) as response:
                  assert response.status == 200, (path, response.status)
                  return response.read().decode("utf-8", "replace")
          page = get("/explore/tierra-blanca-creek")
          for needle in (
              "Tierra Blanca Creek", "Prairie Dog Town Fork", "Buffalo Lake",
              "Georgia O", "Tierra Blanca archaeological complex",
              "https://texasdefined.com/explore/tierra-blanca-creek",
              "Cottonwood Canyon Birding Trail", "Prairie Dog Trail",
              "openstreetmap.org/export/embed.html",
              "buffalo-lake-snowscape.jpg",
              "rio_grande_wild_turkey_pair",
              "Travel &amp; Outdoors Desk",
              "Panhandle-Plains Historical Museum",
              "closed to the public since March 2025",
              "pphm-temporary-closure-updates",
          ):
              assert needle.lower() in page.lower(), f"Live article missing {needle}"
          for reciprocal_path in (
              "/explore/near/amarillo/road-trips",
              "/explore/near/amarillo/day-trips",
              "/destination/palo-duro-canyon-state-park",
              "/county/randall",
          ):
              linked = get(reciprocal_path)
              assert 'href="/explore/tierra-blanca-creek"' in linked, f"Missing live reciprocal guide link: {reciprocal_path}"
          sitemap = get("/sitemap-explore.xml")
          assert "<loc>https://texasdefined.com/explore/tierra-blanca-creek</loc>" in sitemap, "Canonical missing in Explore sitemap"
          guide_start = sitemap.index("<loc>https://texasdefined.com/explore/tierra-blanca-creek</loc>")
          guide_end = sitemap.index("</url>", guide_start)
          assert "<lastmod>2026-11-16</lastmod>" in sitemap[guide_start:guide_end], "Tierra Blanca XML lastmod must match substantive editorial revision"
          print("PASS Tierra Blanca guide, source-grounded content, canonical and sitemap on deployed site")
          PY
