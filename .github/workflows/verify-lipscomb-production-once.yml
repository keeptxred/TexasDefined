name: Verify Lipscomb County production once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-lipscomb-production-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify live Lipscomb County page and hero
        shell: bash
        run: |
          set -euo pipefail
          page='https://texasdefined.com/county/lipscomb'
          hero='https://commons.wikimedia.org/wiki/Special:Redirect/file/Lipscomb_County%2C_Texas%2C_courthouse_from_W_3.JPG?width=1600'
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          curl -fsSL --max-time 40 "${page}?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}" -o "$workdir/page.html"
          grep -Fq 'Lipscomb County' "$workdir/page.html"
          grep -Fq 'Courthouse Country, Wolf Creek and the Far Northeast Panhandle' "$workdir/page.html"
          grep -Fq 'County seat' "$workdir/page.html"
          grep -Fq 'Lipscomb' "$workdir/page.html"
          grep -Fq 'https://texasdefined.com/county/lipscomb' "$workdir/page.html"

          curl -A 'TexasDefined production verifier/1.0' -fsSL --max-time 40 "$hero" -D "$workdir/hero.headers" -o "$workdir/hero.bin"
          hero_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' "$workdir/hero.headers" | tail -n1)"
          case "$hero_type" in
            image/jpeg|image/png|image/webp) ;;
            *) echo "Unexpected hero MIME: $hero_type" >&2; exit 1 ;;
          esac
          hero_bytes="$(wc -c < "$workdir/hero.bin")"
          test "$hero_bytes" -gt 10000
          echo "Lipscomb production PASS: page=200 structured=present editorial=present canonical=correct hero_mime=$hero_type hero_bytes=$hero_bytes"

      - name: Publish success status
        if: success()
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"lipscomb-production-certification","description":"Lipscomb page, structured/editorial layers, canonical and hero passed"}' >/dev/null

      - name: Publish failure status
        if: failure()
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"lipscomb-production-certification","description":"Lipscomb production certification failed"}' >/dev/null
