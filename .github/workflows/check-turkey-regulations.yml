name: Monitor Texas turkey regulations

on:
  schedule:
    - cron: '21 13 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/data/check-turkey-regulations.mjs'
      - '.github/workflows/check-turkey-regulations.yml'

permissions:
  contents: read

jobs:
  check-syntax:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/data/check-turkey-regulations.mjs

  monitor:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check TPWD 2026–27 turkey dates and regulations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          node scripts/data/check-turkey-regulations.mjs > "$RUNNER_TEMP/turkey-check.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/turkey-check.log"
          if [[ "$code" == "2" ]]; then
            title="Review changed TPWD turkey regulations (2026–27)"
            existing="$(gh issue list --state open --search 'Review changed TPWD turkey regulations in:title' --json number --jq '.[0].number' 2>/dev/null)"
            if [[ -z "$existing" ]]; then
              {
                echo "An official TPWD page no longer matches the editor-verified 2026–27 turkey guide. Re-check the original TPWD sources and update the guide, any relevant county exceptions and the editorial verification date only after validating the new rules."
                echo
                echo "Source-check results:"
                echo '~~~'
                cat "$RUNNER_TEMP/turkey-check.log"
                echo '~~~'
                echo
                echo "Page: https://texasdefined.com/hunting/turkey-hunting"
                echo "Checker: scripts/data/check-turkey-regulations.mjs"
              } > "$RUNNER_TEMP/turkey-issue.md"
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/turkey-issue.md"
            fi
          fi
          exit "$code"
