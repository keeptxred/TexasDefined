name: Six-man live diagram visual acceptance (one-page)
on:
  pull_request:
    paths:
      - "scripts/ci/verify-six-man-field-visual-once.mjs"
      - ".github/workflows/qa-six-man-visual-once.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: six-man-one-page-visual-acceptance
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser script syntax
        run: node --check scripts/ci/verify-six-man-field-visual-once.mjs
      - name: Install isolated browser driver
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-six-man-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Screenshot live field at desktop and mobile widths
        run: node scripts/ci/verify-six-man-field-visual-once.mjs
