name: Verify Falls County live once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-falls-county-live-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify Falls County production
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          target='a674aefd9caa9a33c0fec704003968d60f0ad603'
          agent='TexasDefined/1.0 (+https://texasdefined.com)'
          origin='https://texasdefined.com'
          hero='https://commons.wikimedia.org/wiki/Special:Redirect/file/Falls_county_courthouse.jpg?width=1600'
          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT

          git merge-base --is-ancestor "$target" HEAD || { echo 'Falls County source is not in current main ancestry'; exit 1; }

          page=''; code=''
          for attempt in $(seq 1 12); do
            code="$(curl -A "$agent" --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$work/page" -w '%{http_code}' "${origin}/county/falls?verify=${target}-${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$code" = 200 ] \
              && grep -Fq 'Falls County: Marlin, the Brazos, Hot Mineral Wells and Railroad Towns' "$work/page" \
              && grep -Fq 'The county in numbers' "$work/page" \
              && grep -Fq 'County seat' "$work/page" \
              && grep -Fq '2020 population' "$work/page" \
              && grep -Fq 'County feature' "$work/page" \
              && grep -Fq 'Marlin' "$work/page" \
              && grep -Fq 'https://texasdefined.com/county/falls' "$work/page"; then page=pass; break; fi
            sleep 5
          done
          [ "$page" = pass ] || { echo "Live page failed: HTTP=$code or expected structured/editorial markers missing"; exit 1; }

          hcode="$(curl -A "$agent" -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 -sS -D "$work/hh" -o "$work/hb" -w '%{http_code}' "$hero" || true)"
          hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/hh" | cut -d';' -f1)"
          hbytes="$(wc -c < "$work/hb" 2>/dev/null || echo 0)"
          echo "Hero: HTTP=$hcode MIME=$hmime bytes=$hbytes"
          if [ "$hcode" != 200 ] || ! [[ "$hmime" =~ ^image/(jpeg|png|webp)$ ]] || [ "$hbytes" -le 50000 ]; then
            exit 1
          fi

          echo "PASS Falls County page=200 structured=yes editorial=yes canonical=yes legacy=n/a hero=$hcode mime=$hmime bytes=$hbytes"
      - name: Publish Falls live success
        if: ${{ steps.verify.outcome == 'success' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"falls-live-certification","description":"Falls County live page and hero checks passed"}' >/dev/null
      - name: Publish Falls live failure
        if: ${{ failure() }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"falls-live-certification","description":"Falls County live page or hero verification failed"}' >/dev/null
