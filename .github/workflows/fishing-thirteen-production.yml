name: Fishing thirteen-page production acceptance
on:
  workflow_run:
    workflows: ["Deploy TexasDefined production"]
    types: [completed]
  schedule:
    - cron: '37 12 * * 2,5'
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
concurrency:
  group: fishing-13-production-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  verify-13-pages:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm matching production release
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$AUDIT_SHA/status" --jq '[.statuses[] | select(.context == "texasdefined-production")][0].state // "missing"')"
          test "$state" = success || { echo "::error::Cannot verify unpublished source $AUDIT_SHA ($state)."; exit 1; }
      - name: Verify all thirteen public HTML routes and editorial content
        run: node scripts/ci/verify-fishing-thirteen-production.mjs
      - name: Verify all 42 live editorial-similarity pairs and canonical links
        run: node scripts/ci/verify-42-page-pairs-production.mjs
      - name: Install isolated Chrome driver
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-fishing-13-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify real mobile rendering and complete lake-list interactions
        run: node scripts/ci/verify-fishing-thirteen-mobile.mjs
      - name: Keep mobile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fishing-thirteen-mobile-${{ github.run_id }}
          path: artifacts/fishing-13-mobile/report.json
          if-no-files-found: warn
          retention-days: 14
