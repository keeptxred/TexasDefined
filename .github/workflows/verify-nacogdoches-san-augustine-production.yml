name: Verify Nacogdoches and San Augustine authority production

on:
  pull_request:
    paths:
      - '.github/workflows/verify-nacogdoches-san-augustine-production.yml'
      - 'scripts/ci/verify-nacogdoches-san-augustine-production.mjs'
      - 'src/data/nacogdoches-san-augustine-*.ts'
      - 'src/data/nacogdoches-downtown-historic-district-destination.ts'
      - 'src/data/zion-hill-nacogdoches-authority-destinations.ts'
      - 'scripts/ci/verify-zion-hill-image-provenance.mjs'
      - 'scripts/ci/verify-nacogdoches-san-augustine-image-uniqueness.mjs'
      - 'scripts/ci/verify-east-texas-forest-facts.mjs'
      - 'supabase/migrations/20261014023500_sfa_forest_current_alerts_source.sql'
      - 'supabase/migrations/20261014023800_angelina_forest_2025_factsheet_sources.sql'
      - 'src/data/fixtures/nacogdoches-san-augustine-historic-road-trip.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-nacogdoches-san-augustine-production.yml'
      - 'scripts/ci/verify-nacogdoches-san-augustine-production.mjs'
      - 'src/data/nacogdoches-san-augustine-*.ts'
      - 'src/data/nacogdoches-downtown-historic-district-destination.ts'
      - 'src/data/zion-hill-nacogdoches-authority-destinations.ts'
      - 'scripts/ci/verify-zion-hill-image-provenance.mjs'
      - 'scripts/ci/verify-nacogdoches-san-augustine-image-uniqueness.mjs'
      - 'scripts/ci/verify-east-texas-forest-facts.mjs'
      - 'supabase/migrations/20261014023500_sfa_forest_current_alerts_source.sql'
      - 'supabase/migrations/20261014023800_angelina_forest_2025_factsheet_sources.sql'
      - 'src/data/fixtures/nacogdoches-san-augustine-historic-road-trip.ts'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: nacogdoches-san-augustine-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify eleven live heritage authority pages
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Check out commit under verification
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require this commit's protected production deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/ci/wait-for-protected-production.mjs
      - name: Verify Zion Hill church photograph filename, creator, license, and uniqueness
        run: node scripts/ci/verify-zion-hill-image-provenance.mjs
      - name: Verify distinct, licensed hero photographs across this authority release
        run: node scripts/ci/verify-nacogdoches-san-augustine-image-uniqueness.mjs
      - name: Validate official East Texas forest facts and monitored sources
        run: node scripts/ci/verify-east-texas-forest-facts.mjs
      - name: Validate production verifier syntax before deployment
        run: node --check scripts/ci/verify-nacogdoches-san-augustine-production.mjs
      - name: Verify canonical URLs, sitemap, sources, reciprocal links, and real images
        if: github.event_name != 'pull_request'
        env:
          PRODUCTION_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/ci/verify-nacogdoches-san-augustine-production.mjs
