name: Attraction authority mobile and desktop browser QA
on:
  pull_request:
    paths:
      - 'src/data/approved-attraction-authority-drafts.ts'
      - 'src/data/museum-expansion-statewide-wave54.ts'
      - 'src/data/museum-authority-heroes.ts'
      - 'src/data/destination-availability.ts'
      - 'src/routes/destination.$slug.tsx'
      - 'scripts/ci/verify-attraction-authority-browser.mjs'
      - '.github/workflows/verify-attraction-authority-browser.yml'
  workflow_dispatch:
concurrency:
  group: attraction-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build exact branch Worker
        run: npm run build
      - name: Prepare Chrome and Playwright
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-wp-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify all three authority pages at desktop and mobile widths
        run: node scripts/ci/verify-attraction-authority-browser.mjs
      - name: Preserve rendered screenshot and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attraction-authority-browser-${{ github.run_id }}
          path: artifacts/attraction-authority-browser/
          if-no-files-found: warn
          retention-days: 14
