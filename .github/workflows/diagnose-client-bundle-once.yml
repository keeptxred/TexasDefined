name: Diagnose client bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and summarize bundle sizes
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run performance:validate
          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          roots=[Path('dist/client/assets'),Path('.output/public/assets')]
          root=next((p for p in roots if p.is_dir()),None)
          if not root: raise SystemExit('assets missing')
          files=[(p.stat().st_size,p.name) for p in root.iterdir() if p.is_file() and p.suffix in {'.js','.css'}]
          print('## Client bundle diagnostic')
          print()
          print('| Bytes | Asset |')
          print('|---:|---|')
          for size,name in sorted(files, reverse=True)[:30]: print(f'| {size} | `{name}` |')
          PY
