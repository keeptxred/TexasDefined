name: Finalize relocation routes
on:
  push:
    branches: [relocation-tools-final]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relocation-tools-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Register relocation routes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='src/lib/public-routes.ts';
          let source=fs.readFileSync(file,'utf8');
          const routes=['/moving-to-texas/tools','/compare-texas-cities','/find-my-emergency-services','/find-my-homestead-exemption','/find-my-property-tax','/find-my-utilities','/find-my-voter-registration','/texas-zip-code-explorer'];
          const anchor='  "/find-my-school-district",';
          const missing=routes.filter(route=>!source.includes(`"${route}"`));
          if(missing.length){source=source.replace(anchor,`${anchor}\n${missing.map(route=>`  "${route}",`).join('\n')}`);fs.writeFileSync(file,source)}
          NODE
      - name: Generate route tree
        run: npm run build
      - name: Run diagnostic premerge contract
        run: |
          set +e
          node scripts/ci/run-premerge-validation.mjs > /tmp/premerge.log 2>&1
          code=$?
          tail -n 400 /tmp/premerge.log > docs/relocation-premerge-diagnostic.txt
          echo "premerge_exit=$code" >> docs/relocation-premerge-diagnostic.txt
          exit 0
      - name: Commit generated governance files and diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/public-routes.ts src/routeTree.gen.ts docs/relocation-premerge-diagnostic.txt
          git diff --cached --quiet && exit 0
          git commit -m "Refresh relocation route validation"
          git push origin HEAD:relocation-tools-final
