name: Diagnose live lake page-data production path

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-live-lake-page-data.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_SHA: ${{ github.sha }}
    steps:
      - name: Probe production diagnostic endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="https://texasdefined.com/api/public/live-lake-diagnostic?verify-page-data=${GITHUB_RUN_ID}"
          body="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$body" "$headers"' EXIT

          publish_status() {
            local state="$1" context="$2" description="$3"
            local payload
            payload="$(python3 - "$state" "$context" "$description" <<'PY'
          import json, sys
          print(json.dumps({"state": sys.argv[1], "context": sys.argv[2], "description": sys.argv[3][:140]}))
          PY
          )"
            curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
              --data "$payload" >/dev/null
          }

          http_code="$(curl --silent --show-error --location --max-time 45 \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
            --header 'Accept: application/json,text/plain;q=0.9,*/*;q=0.1' \
            --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"

          if grep -iq '^cf-mitigated: *challenge' "$headers"; then
            publish_status failure texasdefined-live-lake-edge "Cloudflare challenged the production lake diagnostic"
            echo '::error::Cloudflare challenge blocked the lake diagnostic endpoint.'
            exit 1
          fi

          if [[ "$http_code" != "200" ]]; then
            publish_status failure texasdefined-live-lake-edge "Lake diagnostic returned HTTP ${http_code:-unknown}"
            echo "::error::Lake diagnostic returned HTTP ${http_code:-unknown}."
            head -c 1000 "$body" || true
            exit 1
          fi

          publish_status success texasdefined-live-lake-edge "Production lake diagnostic reachable without challenge"

          python3 - "$body" > parsed.env <<'PY'
          import json, shlex, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          conroe = payload.get('conroePageDataSnapshot')
          showcase = payload.get('showcasePageDataSnapshots')
          expected = [
              'lake-fork', 'sam-rayburn-reservoir', 'lake-livingston', 'lake-texoma',
              'toledo-bend-reservoir', 'possum-kingdom-reservoir', 'canyon-lake',
              'choke-canyon-reservoir', 'amistad-reservoir',
          ]
          present = [slug for slug in expected if isinstance(showcase, dict) and showcase.get(slug)]
          print('CONROE=' + ('true' if conroe else 'false'))
          print('SHOWCASE_COUNT=' + str(len(present)))
          print('SHOWCASE_PRESENT=' + shlex.quote(','.join(present)))
          print('SHOWCASE_MISSING=' + shlex.quote(','.join(slug for slug in expected if slug not in present)))
          print(json.dumps({
              'conroePageDataSnapshot': conroe,
              'showcasePageDataSnapshots': showcase,
          }, indent=2))
          PY

          cat parsed.env
          source <(grep -E '^(CONROE|SHOWCASE_COUNT|SHOWCASE_PRESENT|SHOWCASE_MISSING)=' parsed.env)

          if [[ "$CONROE" == "true" ]]; then
            publish_status success texasdefined-page-data-lake-conroe "Lake Conroe page-data server function carries a numeric snapshot"
          else
            publish_status failure texasdefined-page-data-lake-conroe "Lake Conroe page-data server function lost the snapshot"
          fi

          if [[ "$SHOWCASE_COUNT" == "9" ]]; then
            publish_status success texasdefined-page-data-showcase "All 9 showcase page-data snapshots are present"
          else
            publish_status failure texasdefined-page-data-showcase "${SHOWCASE_COUNT}/9 showcase snapshots present; missing ${SHOWCASE_MISSING}"
          fi

          if [[ "$CONROE" != "true" || "$SHOWCASE_COUNT" != "9" ]]; then
            exit 1
          fi
