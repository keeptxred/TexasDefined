name: Apply county density runtime v3

on:
  push:
    branches:
      - fix/county-density-runtime-v3
    paths:
      - '.github/workflows/apply-county-density-runtime-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/county-density-runtime-v3
      - name: Patch shared county density formatter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          profile = Path('src/data/county-profile.ts')
          text = profile.read_text()
          old = 'function formatDensity(value: number) {'
          new = 'export function formatDensity(value: number) {'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one private density formatter, found {text.count(old)}')
          profile.write_text(text.replace(old, new, 1))

          guide = Path('src/components/content/CountyGuideSections.tsx')
          text = guide.read_text()
          old = "import type { CountyProfile } from '@/data/county-profile';"
          new = "import { formatDensity, type CountyProfile } from '@/data/county-profile';"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one type-only CountyProfile import, found {text.count(old)}')
          guide.write_text(text.replace(old, new, 1))

          Path('.github/workflows/apply-county-density-runtime-v3.yml').unlink()
          PY
      - name: Verify source contract
        run: |
          grep -F "export function formatDensity(value: number)" src/data/county-profile.ts
          grep -F "import { formatDensity, type CountyProfile } from '@/data/county-profile';" src/components/content/CountyGuideSections.tsx
          grep -F "formatDensity(profile.populationDensityPerSquareMile)" src/components/content/CountyGuideSections.tsx
      - name: Commit bounded fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/county-profile.ts src/components/content/CountyGuideSections.tsx .github/workflows/apply-county-density-runtime-v3.yml
          git commit -m 'Fix county density SSR formatter on latest main'
          git push origin HEAD:fix/county-density-runtime-v3
