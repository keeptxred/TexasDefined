name: Certify Hale County live final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-hale-live-final.yml'

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify Hale County
        shell: bash
        run: |
          set -euo pipefail
          agent='TexasDefined/1.0 (+https://texasdefined.com)'
          hero='https://commons.wikimedia.org/wiki/Special:Redirect/file/Hale_county_courthouse_2009.jpg?width=1600'
          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT

          code="$(curl -A "$agent" --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$work/page" -w '%{http_code}' 'https://texasdefined.com/county/hale?verify=final')"
          [ "$code" = 200 ]
          grep -Fq 'Hale County: Plainview, Runningwater Draw, Irrigation and the South Plains' "$work/page"
          grep -Fq 'The county in numbers' "$work/page"
          grep -Fq 'County seat' "$work/page"
          grep -Fq '2020 population' "$work/page"
          grep -Fq 'County feature' "$work/page"
          grep -Fq 'https://texasdefined.com/county/hale' "$work/page"

          hcode="$(curl -A "$agent" -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 90 -sS -D "$work/hh" -o "$work/hb" -w '%{http_code}' "$hero")"
          hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/hh" | cut -d';' -f1)"
          hbytes="$(wc -c < "$work/hb")"
          [ "$hcode" = 200 ] && [[ "$hmime" =~ ^image/(jpeg|png|webp)$ ]] && [ "$hbytes" -gt 50000 ]

          legacy='https://texasdefined.com/article/hale-county-plainview-runningwater-draw-irrigation-south-plains-texas'
          lcode="$(curl -A "$agent" --max-redirs 0 -sS -D "$work/lh" -o /dev/null -w '%{http_code}' "$legacy" || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$work/lh")"
          [[ "$lcode" =~ ^30(1|8)$ ]] && [[ "$location" == *'/county/hale'* ]]

          mkdir -p .github/certifications
          printf 'PASS Hale County\npage=%s\nstructured=yes\neditorial=yes\ncanonical=https://texasdefined.com/county/hale\nlegacy=%s\nlegacy_location=%s\nhero=%s\nmime=%s\nbytes=%s\n' "$code" "$lcode" "$location" "$hcode" "$hmime" "$hbytes" > .github/certifications/hale-county-live.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/certifications/hale-county-live.txt
          git commit -m 'Record Hale County live pass'
          git pull --rebase origin main
          git push origin HEAD:main
