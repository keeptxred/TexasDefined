name: Verify Canyon Lake Hawks live football authority
on:
  pull_request:
    paths:
      - 'scripts/ci/verify-comal-canyon-lake-live.mjs'
      - '.github/workflows/verify-comal-canyon-lake-live.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy TexasDefined production']
    types: [completed]
    branches: [main]

# Only read public sites and the source commit. This never publishes a Worker,
# changes a release status, or overrides unrelated production protection.
permissions:
  contents: read
concurrency:
  group: canyon-lake-authority-live
  cancel-in-progress: false

jobs:
  source:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check bounded live acceptance
        run: node --check scripts/ci/verify-comal-canyon-lake-live.mjs

  live:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Limit automated browser checks to relevant changed source
        id: scope
        shell: bash
        env:
          MANUAL_ACCEPTANCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$MANUAL_ACCEPTANCE" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(src/data/high-school-football/(program-editorial-comal-canyon-lake[.]ts|school-identities[.]ts|football-program-profile[.]server[.]ts)|src/routes/texas-high-school-football-teams_[.][$]slug[.]lazy[.]tsx|public/images/high-school-football/comal-canyon-lake-2026[.]svg|scripts/ci/verify-comal-canyon-lake-live[.]mjs|[.]github/workflows/verify-comal-canyon-lake-live[.]yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Install isolated Chrome driver without editing repo
        if: steps.scope.outputs.run == 'true'
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/td-canyon-lake-chrome --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify both live public origins and three Chrome viewports
        if: steps.scope.outputs.run == 'true'
        run: |
          node --check scripts/ci/verify-comal-canyon-lake-live.mjs
          node scripts/ci/verify-comal-canyon-lake-live.mjs
      - name: Preserve complete evidence or failure report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: comal-canyon-lake-live-${{ github.run_id }}
          path: artifacts/comal-canyon-lake-live/
          retention-days: 14
          if-no-files-found: warn
