name: Sync Texas Events

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-texas-events.yml"
      - "scripts/events/sync-texas-events-safe.mjs"
      - "src/data/events-generated.ts"
      - "src/data/events-remote.ts"
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: texas-events-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync authoritative Texas events
        run: node scripts/events/sync-texas-events-safe.mjs

      - name: Commit refreshed event catalog
        run: |
          if git diff --quiet -- src/data/generated/texas-events.ts; then
            echo "Texas events catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/texas-events.ts
          git commit -m "data: refresh Texas events catalog"
          git push origin HEAD:main
