name: Sync Texas Events

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-texas-events.yml"
      - "scripts/events/sync-texas-events-safe.mjs"
      - "scripts/events/sync-ticketmaster-events.mjs"
      - "scripts/events/ticketmaster-discovery.mjs"
      - "src/data/events-generated.ts"
      - "src/data/events-remote.ts"
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: texas-events-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync authoritative Texas events
        run: node scripts/events/sync-texas-events-safe.mjs

      - name: Sync Ticketmaster Texas events
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          TICKETMASTER_IMPACT_BASE_URL: https://ticketmaster.evyy.net/c/7758914/264167/4272?subId1=texasdefined&partnerpropertyid=8837726&MediaPartnerPropertyId=8837726
        run: node scripts/events/sync-ticketmaster-events.mjs

      - name: Detect catalog changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/generated/texas-events.ts src/data/generated/ticketmaster-events.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Texas events catalog is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Texas events catalog changed."
          fi

      - name: Create event refresh branch
        if: steps.changes.outputs.changed == 'true'
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/texas-events-sync-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/data/generated/texas-events.ts src/data/generated/ticketmaster-events.json
          git commit -m "data: refresh Texas events catalog"
          git push origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Open validated event refresh pull request
        if: steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          pr_url="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'Refresh authoritative Texas events catalog' \
            --body           echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Opened $pr_url"

      - name: Prevalidate generated refresh branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          PR_URL: ${{ steps.pr.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          # Validate the exact generated commit immediately. These dispatched runs
          # are a fast fail-closed precheck; they do not impersonate the protected
          # pull_request Required merge gate.
          bash scripts/ci/dispatch-validate-branch.sh "$BRANCH" validate.yml
          bash scripts/ci/dispatch-validate-branch.sh "$BRANCH" merge-gate.yml

          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::notice title=Main advanced after generation::Leaving $PR_URL open for the owner-side finisher to reconcile and revalidate against current main."
          fi

          echo "Generated event refresh is prevalidated and ready for the protected owner-side finisher: $PR_URL"
