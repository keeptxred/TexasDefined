name: Sync Texas Events

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-texas-events.yml"
      - "scripts/events/sync-texas-events-safe.mjs"
      - "src/data/events-generated.ts"
      - "src/data/events-remote.ts"
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: texas-events-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync authoritative Texas events
        run: node scripts/events/sync-texas-events-safe.mjs

      - name: Detect catalog changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/generated/texas-events.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Texas events catalog is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Texas events catalog changed."
          fi

      - name: Create event refresh branch
        if: steps.changes.outputs.changed == 'true'
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/texas-events-sync-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/data/generated/texas-events.ts
          git commit -m "data: refresh Texas events catalog"
          git push origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Open validated event refresh pull request
        if: steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          pr_url="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'Refresh authoritative Texas events catalog' \
            --body $'Automated Texas events refresh. The branch is not merged until both the authoritative TexasDefined validation workflow and the protected Required merge gate pass against the exact generated commit. If main advances during validation, the branch is rebased and both checks are rerun before merge.')"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Opened $pr_url"

      - name: Validate against current main and merge
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          PR_URL: ${{ steps.pr.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          for cycle in 1 2 3; do
            bash scripts/ci/dispatch-validate-branch.sh "$BRANCH" validate.yml
            # Pull requests opened by GITHUB_TOKEN do not emit another workflow event,
            # so explicitly dispatch the branch-protection check on the exact head SHA.
            bash scripts/ci/dispatch-validate-branch.sh "$BRANCH" merge-gate.yml

            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              echo "Validated branch contains current main and passed the Required merge gate."
              break
            fi

            if [[ "$cycle" -eq 3 ]]; then
              echo "::error title=Main kept advancing::Refusing to merge an automation branch that could not be reconciled and revalidated against current main after three cycles."
              exit 1
            fi

            echo "Main advanced during validation; rebasing before another validation cycle."
            git rebase origin/main
            git push --force-with-lease origin "$BRANCH"
          done

          # Repository auto-merge is intentionally disabled. Once the exact head has
          # the required protected check, a normal squash merge is policy-compliant.
          gh pr merge "$PR_URL" --squash --delete-branch
          merged_at="$(gh pr view "$PR_URL" --json mergedAt --jq '.mergedAt // ""')"
          if [[ -z "$merged_at" ]]; then
            echo "::error title=Event refresh did not merge::The protected merge command returned without a recorded merge."
            exit 1
          fi
          echo "Texas events refresh merged at ${merged_at} after exact-branch validation and Required merge gate success."

      - name: Dispatch production deployment for merged catalog
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-production.yml --ref main
          echo "Production deployment dispatched explicitly because GITHUB_TOKEN-authored merges do not reliably emit downstream workflow runs."
