name: Diagnose TexasDefined live verifier outcomes

on:
  push:
    branches:
      - diagnose/live-verifier-outcomes
    paths:
      - '.github/workflows/diagnose-live-verifier-outcomes.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify direct Worker discovery
        id: live_direct_worker
        env:
          DIRECT_WORKER_ORIGIN: https://texasdefined-site.freddy-coppola.workers.dev
        run: node scripts/ci/verify-direct-worker-discovery.mjs

      - name: Verify base production surfaces
        id: live_base
        if: always()
        run: node scripts/ci/verify-production-surfaces.mjs

      - name: Verify Event structured-data production
        id: live_events
        if: always()
        run: node scripts/ci/verify-event-structured-data-production.mjs

      - name: Verify local financial production
        id: live_local_financial
        if: always()
        run: node scripts/ci/verify-local-financial-production.mjs

      - name: Verify statewide financial discovery
        id: live_statewide_financial
        if: always()
        run: node scripts/ci/verify-statewide-financial-discovery.mjs

      - name: Upload statewide financial discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statewide-financial-discovery-diagnostic-${{ github.run_id }}
          path: .artifacts/statewide-financial-discovery.json
          if-no-files-found: ignore
          retention-days: 1
