name: Validate stay affiliate options

on:
  pull_request:
    paths:
      - 'public/stay-affiliate-options.js'
      - 'scripts/data/validate-stay-affiliate-options.mjs'
      - 'scripts/data/validate-booking-car-rental-affiliate.mjs'
      - 'scripts/data/validate-outcome-analytics.mjs'
      - 'scripts/ci/verify-stay-affiliate-production.mjs'
      - 'src/platform/analytics.ts'
      - 'src/lib/affiliate-click.ts'
      - 'src/lib/texas-defined-outcome-analytics.server.ts'
      - 'src/lib/texas-defined-outcome-analytics.contract.test.ts'
      - 'src/server-entry.ts'
      - 'wrangler.jsonc'
      - 'src/routes/__root.tsx'
      - 'src/routes/event.$slug.lazy.tsx'
      - 'src/routes/explore.$category.lazy.tsx'
      - 'src/routes/explore.painted-churches-plan.tsx'
      - 'src/routes/explore.trip-planner.lazy.tsx'
      - 'src/components/editorial/DestinationVisitPlanner.tsx'
      - 'src/components/explore/TopAttractionRoadTripsContent.tsx'
      - 'src/components/explore/TexasRoute66Hub.tsx'
      - 'src/components/explore/TexasRoute66Page.tsx'
      - 'src/components/monetization/BookingCarRentalCard.tsx'
      - '.github/workflows/validate-stay-affiliate-options.yml'
      - '.github/workflows/verify-stay-affiliate-production.yml'
  push:
    branches: [main]
    paths:
      - 'public/stay-affiliate-options.js'
      - 'scripts/data/validate-stay-affiliate-options.mjs'
      - 'scripts/data/validate-booking-car-rental-affiliate.mjs'
      - 'scripts/data/validate-outcome-analytics.mjs'
      - 'scripts/ci/verify-stay-affiliate-production.mjs'
      - 'src/platform/analytics.ts'
      - 'src/lib/affiliate-click.ts'
      - 'src/lib/texas-defined-outcome-analytics.server.ts'
      - 'src/lib/texas-defined-outcome-analytics.contract.test.ts'
      - 'src/server-entry.ts'
      - 'wrangler.jsonc'
      - 'src/routes/__root.tsx'
      - 'src/routes/event.$slug.lazy.tsx'
      - 'src/routes/explore.$category.lazy.tsx'
      - 'src/routes/explore.painted-churches-plan.tsx'
      - 'src/routes/explore.trip-planner.lazy.tsx'
      - 'src/components/editorial/DestinationVisitPlanner.tsx'
      - 'src/components/explore/TopAttractionRoadTripsContent.tsx'
      - 'src/components/explore/TexasRoute66Hub.tsx'
      - 'src/components/explore/TexasRoute66Page.tsx'
      - 'src/components/monetization/BookingCarRentalCard.tsx'
      - '.github/workflows/validate-stay-affiliate-options.yml'
      - '.github/workflows/verify-stay-affiliate-production.yml'

permissions:
  contents: read

concurrency:
  group: stay-affiliate-options-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Hotels.com and Vrbo integration
        run: node scripts/data/validate-stay-affiliate-options.mjs
      - name: Validate Booking.com car-rental integration
        run: node scripts/data/validate-booking-car-rental-affiliate.mjs
      - name: Validate first-party outcome analytics
        run: node scripts/data/validate-outcome-analytics.mjs
      - name: Test first-party outcome analytics collector
        run: node --experimental-strip-types --test src/lib/texas-defined-outcome-analytics.contract.test.ts
