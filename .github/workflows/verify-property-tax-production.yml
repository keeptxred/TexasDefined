name: Verify Texas tax pages independently

on:
  # Run live verification only after a successful main-branch deployment.
  # Per-commit source validators run on pull requests; a push-time live check
  # races the Worker deployment and falsely flags newly published source rows.
  # A failed deployment is independently reported by the deploy workflow.
  workflow_run:
    workflows: ['Deploy TexasDefined production']
    types: [completed]
  workflow_dispatch:
  # Regular read-only validation catches stale or corrupted public pages
  # even when the site's deployment pipeline skips the financial smoke suite.
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  # Skipped deployment events must not cancel an independently scheduled check.
  group: texasdefined-tax-live-independent-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          # Verify the exact source revision that triggered the completed deploy.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Explain scope and deployment dependency
        run: |
          echo "## Independent Texas property-tax live verification" >> "$GITHUB_STEP_SUMMARY"
          echo "This checks the **currently served** canonical and direct-Worker pages after a successful deployment, or at a scheduled/manual checkpoint." >> "$GITHUB_STEP_SUMMARY"
          echo "Successful main-branch deployments trigger this read-only tax-history check. Failed deployments are tracked in the deployment workflow. The daily schedule independently tests currently served pages." >> "$GITHUB_STEP_SUMMARY"
      - name: Check ISD source integrity and shared template
        run: node scripts/data/validate-isd-tax-authority.mjs

      - name: Verify locally adopted ISD rates on both public origins
        run: node scripts/ci/verify-isd-tax-production.mjs

      - name: Verify independently sourced TEA history rows on both public origins
        run: node scripts/ci/verify-tea-isd-production.mjs

      - name: Verify verified local-rate histories and Woodlands on both origins
        env:
          TEXAS_TAX_VERIFY_ONLY: '1'
        run: node scripts/ci/verify-local-financial-production.mjs

      - name: Verify all currently verified local tax-rate observations on both production origins
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ftkznprjljkhymknvhye.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/verify-texas-tax-live-observations.mjs
