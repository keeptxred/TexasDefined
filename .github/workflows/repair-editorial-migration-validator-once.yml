name: Verify retired editorial migration repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retired-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify lazy Texas Life migration repair remains applied
        shell: bash
        run: |
          set -euo pipefail
          file='scripts/data/validate-editorial-migration.mjs'
          grep -Fq 'byBrand(allEditorialArticles, query.brandId)' "$file"
          grep -Fq 'loadTexasLifeSplitArticles' "$file"
          grep -Fq 'import("./texas-life-split")' "$file"
          node "$file"
          echo 'Editorial migration repair remains applied and its validator passes.'
