name: Verify authority freshness after cache self-heal

on:
  workflow_run:
    workflows:
      - Purge authority cache after production deploy
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repaired revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Independently verify governed authority canonical freshness
        run: node scripts/ci/verify-authority-canonical-freshness.mjs
