name: Purge authority cache after production deploy

on:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  purge:
    # Only successful protected deployments own a finished release to invalidate.
    # A cancelled or failed run must never purge image URLs while a newer build
    # may still be replacing the Worker static-asset manifest.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: texasdefined-publication
    env:
      # Cache invalidation is intentionally isolated behind a narrowly scoped
      # credential. Do not reuse deploy/general Cloudflare tokens here.
      CLOUDFLARE_CACHE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_API_TOKEN }}
      CLOUDFLARE_CACHE_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_CACHE_API_TOKEN != '' }}
      CLOUDFLARE_ZONE_NAME: texasdefined.com
      CLOUDFLARE_PURGE_METRO_PROXIMITY: 'false'

    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # A newer protected deploy already owns its own cache purge. An older
      # workflow_run must not invalidate and verify the earlier asset manifest
      # while the replacement Worker is still deploying.
      - name: Skip stale cache work superseded by a newer production deployment
        id: release_scope
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERING_DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          response="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100")"
          if jq -e --argjson original "$TRIGGERING_DEPLOY_RUN_ID" '
            [.workflow_runs[]
              | select(.name == "Deploy TexasDefined production")
              | select(.id > $original)
              | select(.status != "completed" or .conclusion == "success")
            ] | length > 0
          ' <<<"$response" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Newer protected deployment owns cache invalidation; skipping superseded release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report targeted cache-purge capability
        shell: bash
        run: |
          if [[ "${CLOUDFLARE_CACHE_TOKEN_PRESENT}" == 'true' ]]; then
            echo 'Dedicated Cloudflare cache-purge token is available.'
          else
            echo '::warning title=Targeted cache purge unavailable::CLOUDFLARE_CACHE_API_TOKEN is not configured. Canonical freshness will still be checked, but the repair workflow remains fail-closed until global purge capability is available.'
          fi

      - name: Purge governed authority HTML
        if: ${{ env.CLOUDFLARE_CACHE_TOKEN_PRESENT == 'true' && steps.release_scope.outputs.skip != 'true' }}
        id: authority_purge
        continue-on-error: true
        run: node scripts/ci/purge-cloudflare-cache.mjs

      - name: Verify governed authority canonical freshness
        if: ${{ always() && steps.release_scope.outputs.skip != 'true' }}
        id: authority_freshness
        continue-on-error: true
        run: node scripts/ci/verify-authority-canonical-freshness.mjs

      - name: Enforce authority cache self-heal
        if: ${{ always() && steps.release_scope.outputs.skip != 'true' }}
        shell: bash
        env:
          PURGE_OUTCOME: ${{ steps.authority_purge.outcome }}
          FRESHNESS_OUTCOME: ${{ steps.authority_freshness.outcome }}
        run: |
          if [[ "${FRESHNESS_OUTCOME}" != 'success' ]]; then
            echo "::error title=Authority cache self-heal failed::freshness=${FRESHNESS_OUTCOME:-not-run}. The canonical authority pages were not proven fresh after deployment."
            exit 1
          fi

          if [[ "${PURGE_OUTCOME}" != 'success' ]]; then
            echo "::error title=Authority global cache purge not proven::purge=${PURGE_OUTCOME:-not-run}, freshness=${FRESHNESS_OUTCOME}. One canonical probe is fresh, but without a successful zone purge other Cloudflare edges may still serve stale authority HTML."
            exit 1
          fi

          echo 'Authority cache purge completed and governed canonical pages are fresh.'