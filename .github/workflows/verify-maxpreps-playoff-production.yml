name: Verify MaxPreps 6A D1 and D2 production widgets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/verify-maxpreps-playoff-production.yml'
      - 'scripts/ci/verify-maxpreps-playoff-production.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout scoped production verifier
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare existing Chrome and isolated Playwright dependency
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-wp-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Check both 2026 UIL 6A playoff widgets on desktop and mobile
        run: node scripts/ci/verify-maxpreps-playoff-production.mjs
      - name: Preserve screenshots and widget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxpreps-playoffs-2026-evidence
          path: artifacts/maxpreps-playoffs-2026/
          if-no-files-found: warn
          retention-days: 7
