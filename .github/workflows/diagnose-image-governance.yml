name: Diagnose image governance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  image-seo:
    name: Diagnose image SEO governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/data/validate-image-seo.mjs

  governance-doc:
    name: Diagnose governance documentation assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Every public, indexable TexasDefined directory/detail page' docs/site-image-governance.md
          grep -Fq 'Exact-subject reusable real image' docs/site-image-governance.md
          grep -Fq 'Photorealistic AI fallback' docs/site-image-governance.md
          grep -Fq 'must emit `noindex, follow, max-image-preview:large`' docs/site-image-governance.md
          grep -Fq 'must not be emitted in an indexable sitemap' docs/site-image-governance.md

  reconciler-policy:
    name: Diagnose real-first AI-fallback reconciler assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          grep -Fq '@cf/black-forest-labs/flux-1-schnell' scripts/data/populate-missing-site-images.mjs
          grep -Fq 'async function generateAiJpeg' scripts/data/populate-missing-site-images.mjs
          grep -Fq 'source: "ai-generated"' scripts/data/populate-missing-site-images.mjs
          grep -Fq 'source: "free-use"' scripts/data/populate-missing-site-images.mjs
          grep -Fq 'unresolved; preserving placeholder and failing closed' scripts/data/populate-missing-site-images.mjs
          ! grep -Fq 'generatedRepresentative(' scripts/data/populate-missing-site-images.mjs
          ! grep -Fq 'Generated representative image · Texas Defined' scripts/data/populate-missing-site-images.mjs
          grep -Fq 'CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' .github/workflows/populate-missing-site-images.yml
          grep -Fq 'CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}' .github/workflows/populate-missing-site-images.yml

  event-image-policy:
    name: Diagnose event image compliance assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'export function isCompliantMajorEventImage' src/data/major-event-schema-enrichment.server.ts
          grep -Fq 'export function hasCompliantMajorEventImageServer' src/data/major-event-schema-enrichment.server.ts
          grep -Fq 'approvedForCommercialUse === true' src/data/major-event-schema-enrichment.server.ts
          grep -Fq 'commons.wikimedia.org' src/data/major-event-schema-enrichment.server.ts
          grep -Fq 'AI[- ]generated' src/data/major-event-schema-enrichment.server.ts
          grep -Fq 'imageCompliant: hasCompliantMajorEventImageServer(data.slug)' src/data/major-event-authority.ts
          grep -Fq 'robots: page.imageCompliant ? undefined : "noindex, follow, max-image-preview:large"' 'src/routes/event.$slug.tsx'
          grep -Fq '.filter((event) => hasCompliantMajorEventImageServer(event.slug))' 'src/routes/sitemap[.]xml.ts'
          grep -Fq 'slug ? hasCompliantMajorEventImageServer(slug) : true' 'src/routes/sitemap[.]xml.ts'

  sports-image-policy:
    name: Diagnose sports image coverage assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Expected governed hero coverage for all 84 seeded sports venues after wave 7' scripts/data/validate-sports-venue-photo-additions-final.mjs
          grep -Fq 'AI-generated photorealistic editorial depiction of' scripts/data/validate-sports-venue-photo-additions-final.mjs
          grep -Fq 'No sports venue remains on the generic image fallback' scripts/data/validate-sports-venue-photo-additions-final.mjs

  indexation-quality:
    name: Diagnose indexation quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/data/validate-indexation-quality.mjs

  sitemap-routes:
    name: Diagnose sitemap routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/data/validate-sitemap-routes.mjs

  machine-indexing:
    name: Diagnose machine indexing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/data/validate-machine-indexing.mjs

  public-route-governance:
    name: Diagnose public route governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/data/validate-public-route-governance.mjs

  major-events:
    name: Diagnose major event authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/data/validate-major-event-authority.mjs
