name: Materialize two pinned Wikimedia photo variants (one-time PR)

on:
  pull_request:
    paths:
      - '.github/workflows/materialize-two-oversized-wikimedia.yml'
      - 'scripts/assets/materialize-two-oversized-wikimedia-photos.mjs'

permissions:
  contents: write

concurrency:
  group: materialize-two-wikimedia-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  exact-photo-assets:
    # Never run arbitrary fork PR code with a writable token.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/verify-oversized-images-live-20261102' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate two precise image variants with existing Sharp dependency
        run: node scripts/assets/materialize-two-oversized-wikimedia-photos.mjs
      - name: Commit validated binary images back to this isolated PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- public/images/editorial/optimized/freedmens-town-tenth-street-1200.webp public/images/editorial/optimized/dallas-holocaust-human-rights-museum-1200.webp
          if git diff --cached --quiet; then
            echo 'No new bytes; original pinned assets are already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets(images): pin 1200px optimized exact-photo Wikimedia variants'
          git push origin HEAD:${{ github.head_ref }}
