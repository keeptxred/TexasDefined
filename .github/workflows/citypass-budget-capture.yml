name: CityPASS bundle capture

on:
  push:
    branches: [feature/citypass-perf-fix-temp2]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Apply lazy resolver probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text: raise SystemExit(f'missing expected text in {path}')
              p.write_text(text.replace(old,new))
          Path('src/components/monetization/CityPassCallout.tsx').write_text('''import { lazy, Suspense } from "react";\n\nexport type CityPassMarket = "Dallas" | "Houston" | "San Antonio";\nexport type CityPassSurface = "destination" | "city" | "sports-venue";\n\ntype CityPassCalloutProps = { market?: CityPassMarket; surface?: CityPassSurface; slug?: string; placement?: "inline" | "rail" };\n\nconst CityPassCalloutContent = lazy(() => import("./CityPassCalloutContent").then((module) => ({ default: module.CityPassCalloutContent })));\n\nexport function CityPassCallout(props: CityPassCalloutProps) {\n  return <Suspense fallback={null}><CityPassCalloutContent {...props} /></Suspense>;\n}\n''')
          p=Path('src/components/monetization/CityPassCalloutContent.tsx')
          text=p.read_text()
          text=text.replace('import { CITYPASS_AFFILIATE_URL, CITYPASS_GUIDE_PATH, type CityPassMarket } from "@/data/citypass";', '''import { CITYPASS_AFFILIATE_URL, CITYPASS_GUIDE_PATH, cityPassMarketForCitySlug, cityPassMarketForDestinationSlug, cityPassMarketForSportsVenueSlug, type CityPassMarket } from "@/data/citypass";\nimport type { CityPassSurface } from "./CityPassCallout";''')
          text=text.replace('export function CityPassCalloutContent({ market, placement = "inline" }: { market: CityPassMarket; placement?: "inline" | "rail" }) {\n  const isRail = placement === "rail";\n  const copy = COPY[market];', '''function marketFor(surface?: CityPassSurface, slug?: string) {\n  if (!surface || !slug) return null;\n  if (surface === "destination") return cityPassMarketForDestinationSlug(slug);\n  if (surface === "city") return cityPassMarketForCitySlug(slug);\n  return cityPassMarketForSportsVenueSlug(slug);\n}\n\nexport function CityPassCalloutContent({ market, surface, slug, placement = "inline" }: { market?: CityPassMarket; surface?: CityPassSurface; slug?: string; placement?: "inline" | "rail" }) {\n  const resolvedMarket = market ?? marketFor(surface, slug);\n  if (!resolvedMarket) return null;\n  const isRail = placement === "rail";\n  const copy = COPY[resolvedMarket];''')
          text=text.replace('aria-label={`${market} CityPASS trip-planning option`}', 'aria-label={`${resolvedMarket} CityPASS trip-planning option`}')
          p.write_text(text)
          replace('src/routes/destination.$slug.tsx','import { CityPassCallout, cityPassMarketForDestinationSlug } from "@/components/monetization/CityPassCallout";','import { CityPassCallout } from "@/components/monetization/CityPassCallout";')
          replace('src/routes/destination.$slug.tsx','  const cityPassMarket = cityPassMarketForDestinationSlug(destination.slug);\n','')
          replace('src/routes/destination.$slug.tsx','{cityPassMarket ? <CityPassCallout market={cityPassMarket} placement="rail" /> : null}','<CityPassCallout surface="destination" slug={destination.slug} placement="rail" />')
          replace('src/routes/$kind.$slug.lazy.tsx',"import { CityPassCallout, cityPassMarketForCitySlug } from '@/components/monetization/CityPassCallout';","import { CityPassCallout } from '@/components/monetization/CityPassCallout';")
          replace('src/routes/$kind.$slug.lazy.tsx',"  const cityPassMarket = entity.kind === 'city' ? cityPassMarketForCitySlug(entity.slug) : null;\n",'')
          replace('src/routes/$kind.$slug.lazy.tsx','{cityPassMarket ? <CityPassCallout market={cityPassMarket} /> : null}',"{entity.kind === 'city' ? <CityPassCallout surface=\"city\" slug={entity.slug} /> : null}")
          replace('src/components/sports/SportsVenueQuickAnswers.tsx',"import { CityPassCallout, cityPassMarketForSportsVenueSlug } from '@/components/monetization/CityPassCallout';","import { CityPassCallout } from '@/components/monetization/CityPassCallout';")
          replace('src/components/sports/SportsVenueQuickAnswers.tsx','  const cityPassMarket = slug ? cityPassMarketForSportsVenueSlug(slug) : null;\n','')
          replace('src/components/sports/SportsVenueQuickAnswers.tsx','{cityPassMarket ? <CityPassCallout market={cityPassMarket} /> : null}','{slug ? <CityPassCallout surface="sports-venue" slug={slug} /> : null}')
          PY
      - run: npm run build
      - name: Capture budget
        shell: bash
        run: |
          npm run performance:validate > .citypass-budget-probe.txt 2>&1 || true
          cat .citypass-budget-probe.txt
      - name: Commit probe
        shell: bash
        run: |
          rm -f .github/workflows/citypass-budget-capture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: capture lazy CityPASS bundle result"
          git push
