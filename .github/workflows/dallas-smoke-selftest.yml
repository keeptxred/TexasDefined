name: Dallas smoke serializer self-test

on:
  push:
    branches:
      - fix/dallas-smoke-react-boundary-20260910

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify React SSR boundary handling and safeguards
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/dallas.html <<'HTML'
          <section aria-labelledby="county-feature-heading"><h2 id="county-feature-heading">The story of <!-- -->Dallas County</h2><p>Old Red Courthouse</p><h2>The county in numbers</h2></section>
          HTML
          grep -Fq 'id="county-feature-heading"' /tmp/dallas.html
          grep -Eq 'The story of (<!-- -->)?Dallas County' /tmp/dallas.html
          grep -Fq 'Old Red Courthouse' /tmp/dallas.html
          grep -Fq 'The county in numbers' /tmp/dallas.html
          ! grep -Fq 'The story of Dallas County' /tmp/dallas.html
          echo 'React SSR boundary form is accepted without weakening section/content checks.'
