name: Backfill TexasDefined placeholder heroes

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum placeholder hero images to replace in this run
        required: true
        default: '5'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '10'
          - '20'
  push:
    branches: [main]
    paths:
      - 'scripts/news/backfill-placeholder-heroes.mjs'
      - '.github/workflows/backfill-placeholder-heroes.yml'

permissions:
  contents: read

concurrency:
  group: texasdefined-placeholder-hero-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: texasdefined-publication
    env:
      KEEP_TX_RED_SUPABASE_URL: https://ftkznprjljkhymknvhye.supabase.co
      KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KEEP_TX_RED_SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Replace placeholder heroes without publishing content
        run: node scripts/news/backfill-placeholder-heroes.mjs --limit=${{ inputs.limit || '20' }}
