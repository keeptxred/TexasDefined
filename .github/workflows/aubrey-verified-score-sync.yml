name: Validate Aubrey historical verified finals
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/data/update-aubrey-verified-results.mjs'
      - 'scripts/ci/test-aubrey-verified-results.mjs'
      - 'src/data/high-school-football/aubrey-auto-results*'
      - 'src/data/high-school-football/aubrey-postseason-fixtures.snapshot.json'
      - 'src/data/high-school-football/football-program-profile.server.ts'
      - '.github/workflows/aubrey-verified-score-sync.yml'
permissions:
  contents: read
concurrency:
  group: aubrey-historical-score-tests
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard manually cited historic Aubrey finals
        run: node --test scripts/ci/test-aubrey-verified-results.mjs
      - name: Validate Aubrey and statewide public-research enrollment
        run: |
          node --test scripts/data/inventory-statewide-football-scores.test.mjs
          node --test scripts/ci/validate-football-refresh-scheduling.test.mjs
