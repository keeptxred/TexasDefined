name: Validate Aubrey sourced score snapshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/data/update-aubrey-verified-results.mjs'
      - 'scripts/ci/test-aubrey-verified-results.mjs'
      - 'src/data/high-school-football/aubrey-auto-results*'
      - 'src/data/high-school-football/aubrey-postseason-fixtures.snapshot.json'
      - 'src/data/high-school-football/football-program-profile.server.ts'
      - '.github/workflows/aubrey-verified-score-sync.yml'

# No separate paid-feed schedule: the statewide next-day public-source job
# now finds overdue Aubrey results and creates an editorial evidence queue.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate historical sourced Aubrey snapshots only
        run: |
          node --check scripts/data/update-aubrey-verified-results.mjs
          node --test scripts/ci/test-aubrey-verified-results.mjs
