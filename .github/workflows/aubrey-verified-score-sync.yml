name: Aubrey verified scores
on:
  workflow_dispatch:
  schedule:
    - cron: '10 9 * 8-12 *'
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/ci/test-aubrey-verified-results.mjs
      - name: Record missing independent source licenses
        if: ${{ vars.AUBREY_SCORE_FEED_PRIMARY_URL == '' || vars.AUBREY_SCORE_FEED_SECONDARY_URL == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='BLOCKED: Aubrey football auto-score source connections'
          if ! gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create --title "$title" --body 'Two separately hosted licensed machine-readable feeds are required. Add repository variables AUBREY_SCORE_FEED_PRIMARY_URL and AUBREY_SCORE_FEED_SECONDARY_URL and optional bearer-token secrets of the same names ending TOKEN. Source schema and safeguards: docs/football-authority/AUBREY_AUTO_SCORES.md. Never scrape MaxPreps or publish an unconfirmed final.'
          fi
          echo '::error title=Licensed score feeds unavailable::Aubrey scores cannot update until two authorized providers are configured.'
          exit 1
      - name: Import matching licensed scores
        if: ${{ vars.AUBREY_SCORE_FEED_PRIMARY_URL != '' && vars.AUBREY_SCORE_FEED_SECONDARY_URL != '' }}
        id: import
        env:
          AUBREY_SCORE_FEED_PRIMARY_URL: ${{ vars.AUBREY_SCORE_FEED_PRIMARY_URL }}
          AUBREY_SCORE_FEED_SECONDARY_URL: ${{ vars.AUBREY_SCORE_FEED_SECONDARY_URL }}
          AUBREY_SCORE_FEED_PRIMARY_TOKEN: ${{ secrets.AUBREY_SCORE_FEED_PRIMARY_TOKEN }}
          AUBREY_SCORE_FEED_SECONDARY_TOKEN: ${{ secrets.AUBREY_SCORE_FEED_SECONDARY_TOKEN }}
        run: node scripts/data/update-aubrey-verified-results.mjs
      - name: Flag overdue games that still lack both matching confirmations
        if: ${{ steps.import.outputs.needs_review == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='Aubrey football: independent source confirmation needed'
          if ! gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create --title "$title" --body 'The scheduled two-provider importer found at least one overdue Aubrey fixture without two independently matching final reports. No invented result was published. Check both licensed provider feeds and the game-day source, then rerun the bounded importer.'
          fi
      - name: Open a protected score update PR
        if: ${{ steps.import.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/aubrey-results-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add src/data/high-school-football/aubrey-auto-results.snapshot.json
          git commit -m 'Update independently confirmed Aubrey football results'
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title 'Publish independently verified Aubrey football finals' --body 'Two independent authorized score feeds agreed on exact game identities and scores. Only the Aubrey generated result snapshot changes. Protected merge gate and automated finisher must verify before publication.'
