name: Validate Aubrey football score history

on:
  pull_request:
    paths:
      - 'scripts/data/update-aubrey-verified-results.mjs'
      - 'scripts/ci/test-aubrey-verified-results.mjs'
      - 'src/data/high-school-football/aubrey-auto-results*'
      - 'src/data/high-school-football/aubrey-postseason-fixtures.snapshot.json'
      - 'src/data/high-school-football/football-program-profile.server.ts'
      - '.github/workflows/aubrey-verified-score-sync.yml'

# Statewide next-day public-source research is now scheduled in
# refresh-football-scores-brackets.yml. Retain the historic Aubrey feed
# reconciler's tests only; never require paid providers or auto-publish.
permissions:
  contents: read

concurrency:
  group: aubrey-score-history-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate published scores and source identity
        run: node --test scripts/ci/test-aubrey-verified-results.mjs
