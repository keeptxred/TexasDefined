name: Temp Validation Diagnostic

on:
  push:
    branches:
      - phase4-relocation-tools

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-relocation-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture canonical validation output
        run: |
          set +e
          npm run validate > validation-diagnostic.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> validation-diagnostic.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation-diagnostic.log
          git commit -m "Capture temporary validation diagnostic"
          git push origin HEAD:phase4-relocation-tools
