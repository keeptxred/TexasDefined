name: Aubrey one-page production visual certification
on:
  push:
    branches:
      - qa/aubrey-production-visual-20261017
    paths:
      - scripts/ci/verify-aubrey-production-visual.mjs
      - .github/workflows/verify-aubrey-production-visual.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aubrey-one-page-production-certification
  cancel-in-progress: true
jobs:
  verify-aubrey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chrome driver on free runner
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-wp-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify Aubrey live desktop and mobile page
        run: node scripts/ci/verify-aubrey-production-visual.mjs
      - name: Save Aubrey browser screenshots and assertion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aubrey-production-desktop-mobile
          path: artifacts/aubrey-production-visual/
          retention-days: 14
          if-no-files-found: warn
