name: Bing indexing configuration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bing-indexing.yml'
      - 'public/robots.txt'
      - 'src/routes/sitemap[.]xml.ts'
      - 'src/routes/sitemap-explore[.]xml.ts'

permissions:
  contents: read

jobs:
  configure-bing-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Enable and verify Cloudflare Crawler Hints
        shell: bash
        run: |
          set -euo pipefail

          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }

          api='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          curl --fail-with-body --silent --show-error -H "$auth" --get \
            --data-urlencode 'name=texasdefined.com' \
            --data-urlencode "account.id=$CLOUDFLARE_ACCOUNT_ID" \
            "$api/zones" -o "$workdir/zones.json"

          zone_id="$(python3 - "$workdir/zones.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          zones = [z for z in (data.get('result') or []) if z.get('name') == 'texasdefined.com' and z.get('status') == 'active']
          assert data.get('success') is True and len(zones) == 1, f'Expected one active texasdefined.com zone, got {len(zones)}'
          print(zones[0]['id'])
          PY
          )"

          curl --fail-with-body --silent --show-error -H "$auth" \
            "$api/zones/$zone_id/settings" -o "$workdir/settings.json"

          crawler_state="$(python3 - "$workdir/settings.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('success') is True, 'Cloudflare zone settings lookup failed'
          matches = [item for item in (data.get('result') or []) if item.get('id') == 'crawler_hints']
          if len(matches) != 1:
              raise SystemExit('Cloudflare API did not expose a crawler_hints zone setting for texasdefined.com')
          setting = matches[0]
          if setting.get('editable') is False and setting.get('value') != 'on':
              raise SystemExit('Crawler Hints is present but is not editable for this zone/token')
          print(setting.get('value') or '')
          PY
          )"

          if [ "$crawler_state" != 'on' ]; then
            curl --fail-with-body --silent --show-error \
              -X PATCH \
              -H "$auth" \
              -H 'Content-Type: application/json' \
              --data '{"value":"on"}' \
              "$api/zones/$zone_id/settings/crawler_hints" \
              -o "$workdir/crawler-hints-update.json"

            python3 - "$workdir/crawler-hints-update.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('success') is True, data.get('errors') or 'Crawler Hints update failed'
          result = data.get('result') or {}
          assert result.get('id') == 'crawler_hints' and result.get('value') == 'on', result
          print('Cloudflare Crawler Hints enabled.')
          PY
          else
            echo 'Cloudflare Crawler Hints already enabled.'
          fi

          curl --fail-with-body --silent --show-error -H "$auth" \
            "$api/zones/$zone_id/settings/crawler_hints" -o "$workdir/crawler-hints.json"

          python3 - "$workdir/crawler-hints.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data.get('success') is True, data.get('errors') or 'Crawler Hints verification failed'
          result = data.get('result') or {}
          assert result.get('id') == 'crawler_hints' and result.get('value') == 'on', result
          print('Crawler Hints state verified: on.')
          PY

      - name: Verify Bing crawl and sitemap discovery on production
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          curl --fail-with-body --silent --show-error --location \
            https://texasdefined.com/robots.txt -o "$workdir/robots.txt"

          grep -Fq 'User-agent: Bingbot' "$workdir/robots.txt"
          grep -Fq 'Sitemap: https://texasdefined.com/sitemap.xml' "$workdir/robots.txt"
          grep -Fq 'Sitemap: https://texasdefined.com/sitemap-explore.xml' "$workdir/robots.txt"

          for sitemap in sitemap.xml sitemap-explore.xml; do
            curl --fail-with-body --silent --show-error --location \
              "https://texasdefined.com/$sitemap" -o "$workdir/$sitemap"
            grep -Fq '<urlset' "$workdir/$sitemap"
            grep -Fq '<loc>https://texasdefined.com/' "$workdir/$sitemap"
          done

          echo 'Bingbot access and both canonical TexasDefined sitemaps verified on production.'
