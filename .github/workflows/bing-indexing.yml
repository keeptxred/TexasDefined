name: Bing indexing configuration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bing-indexing.yml'
      - 'public/robots.txt'
      - 'src/routes/sitemap[.]xml.ts'
      - 'src/routes/sitemap-explore[.]xml.ts'

permissions:
  contents: read

jobs:
  configure-bing-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Enable and verify Cloudflare Crawler Hints
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }

          api='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          curl --fail-with-body --silent --show-error -H "$auth" --get \
            --data-urlencode 'name=texasdefined.com' \
            --data-urlencode "account.id=$CLOUDFLARE_ACCOUNT_ID" \
            "$api/zones" -o "$workdir/zones.json"

          zone_count="$(jq '[.result[] | select(.name == "texasdefined.com" and .status == "active")] | length' "$workdir/zones.json")"
          test "$zone_count" = '1' || { echo "Expected one active texasdefined.com zone, got $zone_count"; exit 1; }
          zone_id="$(jq -r '.result[] | select(.name == "texasdefined.com" and .status == "active") | .id' "$workdir/zones.json")"

          curl --fail-with-body --silent --show-error -H "$auth" \
            "$api/zones/$zone_id/settings" -o "$workdir/settings.json"

          setting_count="$(jq '[.result[] | select(.id == "crawler_hints")] | length' "$workdir/settings.json")"
          test "$setting_count" = '1' || { echo 'Cloudflare API did not expose a crawler_hints zone setting for texasdefined.com'; exit 1; }
          crawler_state="$(jq -r '.result[] | select(.id == "crawler_hints") | .value' "$workdir/settings.json")"
          crawler_editable="$(jq -r '.result[] | select(.id == "crawler_hints") | .editable' "$workdir/settings.json")"

          if [ "$crawler_state" != 'on' ]; then
            test "$crawler_editable" != 'false' || { echo 'Crawler Hints is present but not editable for this zone/token'; exit 1; }
            curl --fail-with-body --silent --show-error \
              -X PATCH \
              -H "$auth" \
              -H 'Content-Type: application/json' \
              --data '{"value":"on"}' \
              "$api/zones/$zone_id/settings/crawler_hints" \
              -o "$workdir/crawler-hints-update.json"
            test "$(jq -r '.success' "$workdir/crawler-hints-update.json")" = 'true'
            echo 'Cloudflare Crawler Hints enabled.'
          else
            echo 'Cloudflare Crawler Hints already enabled.'
          fi

          curl --fail-with-body --silent --show-error -H "$auth" \
            "$api/zones/$zone_id/settings/crawler_hints" -o "$workdir/crawler-hints.json"
          test "$(jq -r '.success' "$workdir/crawler-hints.json")" = 'true'
          test "$(jq -r '.result.id' "$workdir/crawler-hints.json")" = 'crawler_hints'
          test "$(jq -r '.result.value' "$workdir/crawler-hints.json")" = 'on'
          echo 'Crawler Hints state verified: on.'

      - name: Verify Bing crawl and sitemap discovery on production
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          curl --fail-with-body --silent --show-error --location \
            https://texasdefined.com/robots.txt -o "$workdir/robots.txt"
          grep -Fq 'User-agent: Bingbot' "$workdir/robots.txt"
          grep -Fq 'Sitemap: https://texasdefined.com/sitemap.xml' "$workdir/robots.txt"
          grep -Fq 'Sitemap: https://texasdefined.com/sitemap-explore.xml' "$workdir/robots.txt"

          for sitemap in sitemap.xml sitemap-explore.xml; do
            curl --fail-with-body --silent --show-error --location \
              "https://texasdefined.com/$sitemap" -o "$workdir/$sitemap"
            grep -Fq '<urlset' "$workdir/$sitemap"
            grep -Fq '<loc>https://texasdefined.com/' "$workdir/$sitemap"
          done

          echo 'Bingbot access and both canonical TexasDefined sitemaps verified on production.'
