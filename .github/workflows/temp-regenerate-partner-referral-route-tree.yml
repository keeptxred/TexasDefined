name: TEMP Regenerate partner referral route tree

on:
  push:
    branches:
      - fix/partner-referral-reporting-replay-20260917b
    paths:
      - '.github/workflows/temp-regenerate-partner-referral-route-tree.yml'
      - 'src/routes/admin.partner-referrals.tsx'
      - 'src/routes/admin.partner-referrals.lazy.tsx'
      - 'src/routes/admin.tsx'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/partner-referral-reporting-replay-20260917b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate current route tree through production build
        run: npm run build
      - name: Commit generated route tree if changed
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo 'Route tree already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routeTree.gen.ts
          git commit -m 'Regenerate route tree for partner referral reporting'
          git push origin HEAD:fix/partner-referral-reporting-replay-20260917b
