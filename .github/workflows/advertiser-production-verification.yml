name: Verify advertiser production

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/advertiser-production-verification.yml'
      - 'scripts/ci/verify-advertiser-production.mjs'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/advertiser-production-verification.yml'
      - 'scripts/ci/verify-advertiser-production.mjs'
  workflow_run:
    workflows:
      - 'Deploy TexasDefined production'
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: texasdefined-advertiser-production-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify advertiser production surfaces
        env:
          ORIGIN: https://texasdefined.com
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/ci/verify-advertiser-production.mjs
