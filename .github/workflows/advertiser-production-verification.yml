name: Verify advertiser production

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/advertiser-production-verification.yml'
      - 'scripts/ci/verify-advertiser-production.mjs'
  workflow_run:
    workflows:
      - 'Deploy TexasDefined production'
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texasdefined-advertiser-production-verification
  cancel-in-progress: false

jobs:
  syntax:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check advertiser production verifier syntax without probing undeployed code
        run: node --check scripts/ci/verify-advertiser-production.mjs

  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out triggering deployed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify advertiser production surfaces
        env:
          ORIGIN: https://texasdefined.com
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/ci/verify-advertiser-production.mjs
