name: Verify GSC manual-next production

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-gsc-manual-next-production-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    # Protected caller invokes this reusable job only after successful deploy.
    # Manual dispatch remains available for diagnostics.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Reusable workflow inherits the protected deployment's exact SHA.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live GSC manual-next cohort
        run: node scripts/ci/verify-gsc-manual-next-production.mjs
