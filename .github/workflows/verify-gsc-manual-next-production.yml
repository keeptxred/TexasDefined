name: Verify GSC manual-next production

on:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-gsc-manual-next-production
  cancel-in-progress: true

jobs:
  verify:
    # Run only after a successful production deployment, never after a failed
    # or cancelled one. Explicit dispatch remains available for diagnosis.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run.head_sha is the exact revision deployed by the upstream
          # workflow; manual dispatch checks the requested source revision.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live GSC manual-next cohort
        run: node scripts/ci/verify-gsc-manual-next-production.mjs
