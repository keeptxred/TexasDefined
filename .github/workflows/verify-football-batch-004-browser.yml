name: Verify Batch 004 football production browser
on:
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: football-batch-004-production-browser
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Chrome browser driver using free runner
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-wp-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify 25 school routes, all county and Austin city reciprocal links, sitemap, mobile and desktop
        env:
          ACCEPTANCE_SHA: ${{ github.sha }}
        run: node scripts/ci/verify-football-batch-004-browser.mjs
      - name: Preserve browser acceptance report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-batch-004-browser-acceptance
          path: artifacts/football-batch-004/
          if-no-files-found: warn
          retention-days: 14
