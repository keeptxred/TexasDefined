name: Verify Fayette LCRA feed

on:
  pull_request:
    paths:
      - "src/data/fishing/lcra-lake-level-csv.ts"
      - "src/data/fishing/live-lake-level-fetch.server.ts"
      - "src/data/fishing/__tests__/lcra-lake-level-csv.test.ts"
      - "scripts/ci/verify-lcra-fayette-live-feed.ts"
      - ".github/workflows/verify-fishing-lcra-feed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run LCRA parser fixtures
        run: node --experimental-strip-types --test src/data/fishing/__tests__/lcra-lake-level-csv.test.ts
      - name: Verify current LCRA Fayette CSV
        run: node --experimental-strip-types scripts/ci/verify-lcra-fayette-live-feed.ts
