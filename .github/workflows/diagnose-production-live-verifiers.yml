name: Diagnose production live verifiers

on:
  push:
    branches:
      - diagnostic/prod-live-verifiers-20260909
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose production live verifiers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compare Barton Springs SSR on custom domain and direct Worker
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const origins = [
            'https://texasdefined.com',
            'https://texasdefined-site.freddy-coppola.workers.dev',
          ];
          const required = [
            'Add an experience around Barton Springs Pool',
            'Recent Austin inventory signals:',
            'TexasDefined handles the destination planning',
            'campaign=texasdefined-destination-barton-springs-pool',
            'rel="sponsored noopener noreferrer"',
          ];
          for (const origin of origins) {
            const url = `${origin}/destination/barton-springs-pool?diagnostic=${Date.now()}-${Math.random().toString(16).slice(2)}`;
            const response = await fetch(url, {
              cache: 'no-store',
              headers: { 'user-agent': 'TexasDefined-CI-Diagnostic/1.1' },
              signal: AbortSignal.timeout(30000),
            });
            const body = await response.text();
            console.log(`DIAG origin=${origin}`);
            console.log(`DIAG status=${response.status} bytes=${body.length} final=${response.url}`);
            for (const name of ['cf-cache-status','age','cache-control','etag','x-worker-revision','x-texasdefined-revision','server','cf-ray']) {
              console.log(`DIAG header ${name}=${response.headers.get(name) ?? '<none>'}`);
            }
            for (const needle of required) console.log(`DIAG contains ${JSON.stringify(needle)}=${body.includes(needle)}`);
            for (const marker of ['Entry & reservations','Official visitor information','Build a better day','</body>']) {
              const i = body.indexOf(marker);
              console.log(`DIAG marker ${JSON.stringify(marker)} index=${i}`);
              if (i >= 0) console.log(`DIAG sample ${marker}: ${body.slice(Math.max(0, i - 300), Math.min(body.length, i + 900)).replace(/\s+/g, ' ')}`);
            }
          }
          NODE

      - name: Verify direct Worker discovery
        id: direct_worker
        if: always()
        env:
          DIRECT_WORKER_ORIGIN: https://texasdefined-site.freddy-coppola.workers.dev
        run: node scripts/ci/verify-direct-worker-discovery.mjs

      - name: Verify base production surfaces
        id: base
        if: always()
        env:
          DIRECT_WORKER_ORIGIN: https://texasdefined-site.freddy-coppola.workers.dev
        run: node scripts/ci/verify-production-surfaces.mjs

      - name: Verify Event structured-data production
        id: event
        if: always()
        run: node scripts/ci/verify-event-structured-data-production.mjs

      - name: Verify local financial production
        id: local_financial
        if: always()
        run: node scripts/ci/verify-local-financial-production.mjs

      - name: Verify statewide financial discovery
        id: statewide_financial
        if: always()
        run: node scripts/ci/verify-statewide-financial-discovery.mjs

      - name: Summarize verifier outcomes
        if: always()
        shell: bash
        env:
          DIRECT_WORKER_OUTCOME: ${{ steps.direct_worker.outcome }}
          BASE_OUTCOME: ${{ steps.base.outcome }}
          EVENT_OUTCOME: ${{ steps.event.outcome }}
          LOCAL_FINANCIAL_OUTCOME: ${{ steps.local_financial.outcome }}
          STATEWIDE_FINANCIAL_OUTCOME: ${{ steps.statewide_financial.outcome }}
        run: |
          {
            echo '## Production live-verifier diagnostic'
            echo
            echo '| Verifier | Raw outcome |'
            echo '|---|---|'
            echo "| Direct Worker | ${DIRECT_WORKER_OUTCOME:-not-run} |"
            echo "| Base production | ${BASE_OUTCOME:-not-run} |"
            echo "| Event structured data | ${EVENT_OUTCOME:-not-run} |"
            echo "| Local financial | ${LOCAL_FINANCIAL_OUTCOME:-not-run} |"
            echo "| Statewide financial | ${STATEWIDE_FINANCIAL_OUTCOME:-not-run} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$DIRECT_WORKER_OUTCOME" != success || "$BASE_OUTCOME" != success || "$EVENT_OUTCOME" != success || "$LOCAL_FINANCIAL_OUTCOME" != success || "$STATEWIDE_FINANCIAL_OUTCOME" != success ]]; then
            exit 1
          fi
