name: Report unusual business experiment

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Report window in days (1-90)"
        required: false
        default: "30"
  schedule:
    - cron: "23 13 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/analytics/report-unusual-business-experiment.mjs"
      - ".github/workflows/report-unusual-business-experiment.yml"

permissions:
  contents: read

concurrency:
  group: unusual-business-experiment-report
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: texasdefined-publication
    steps:
      - name: Authorize private unusual-business analytics report
        run: echo "Protected texasdefined-publication environment gate passed."

  report:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build aggregate experiment report
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REPORT_WINDOW_DAYS: ${{ github.event.inputs.days || '30' }}
        run: node scripts/analytics/report-unusual-business-experiment.mjs
