name: CityPASS validation diagnostic

on:
  push:
    branches:
      - feature/citypass-texas-evergreen

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/citypass-texas-evergreen
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Capture full validation output
        shell: bash
        run: |
          set +e
          node scripts/ci/run-validation-suite.mjs full > .citypass-validation-diagnostic.txt 2>&1
          status=$?
          echo "exit_status=${status}" >> .citypass-validation-diagnostic.txt
          rm .github/workflows/citypass-validation-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .citypass-validation-diagnostic.txt .github/workflows/citypass-validation-diagnostic.yml
          git commit -m "ci: capture CityPASS validation diagnostic"
          git push origin HEAD:feature/citypass-texas-evergreen
          exit 0
