name: Audit static search-intent overlap

on:
  pull_request:
    paths:
      - 'src/routes/**'
      - 'src/lib/public-routes.ts'
      - 'scripts/data/audit-static-search-intent-overlap.mjs'
      - '.github/workflows/audit-static-search-intent-overlap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report high-overlap static search intent
        run: node scripts/data/audit-static-search-intent-overlap.mjs
