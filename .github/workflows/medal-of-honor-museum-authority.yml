name: Medal of Honor Host City Museum authority verification

on:
  pull_request:
    paths:
      - 'src/data/medal-of-honor-host-city-museum.ts'
      - 'src/data/destination-preserved-catalog.ts'
      - 'src/data/fixtures/texas-military-museums-historic-sites-guide.ts'
      - 'src/data/fixtures/texas-medal-of-honor-heroes.ts'
      - 'src/data/fixtures/cooke-county-gainesville-red-river-muenster-north-texas.ts'
      - 'scripts/data/validate-medal-of-honor-host-city-museum.mjs'
      - 'scripts/data/verify-medal-of-honor-host-city-museum-live.mjs'
      - 'scripts/data/monitor-medal-of-honor-host-city-museum.mjs'
      - '.github/workflows/medal-of-honor-museum-authority.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/medal-of-honor-host-city-museum.ts'
      - 'src/data/destination-preserved-catalog.ts'
      - 'src/data/fixtures/texas-military-museums-historic-sites-guide.ts'
      - 'src/data/fixtures/texas-medal-of-honor-heroes.ts'
      - 'src/data/fixtures/cooke-county-gainesville-red-river-muenster-north-texas.ts'
      - 'scripts/data/validate-medal-of-honor-host-city-museum.mjs'
      - 'scripts/data/verify-medal-of-honor-host-city-museum-live.mjs'
      - '.github/workflows/medal-of-honor-museum-authority.yml'
  schedule:
    - cron: '27 15 * * 1'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy TexasDefined production']
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  authority:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate museum data, sources, photo provenance and internal links
        run: node scripts/data/validate-medal-of-honor-host-city-museum.mjs
      - name: Monitor official museum sources for changed public facts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: monitor
        continue-on-error: true
        run: node scripts/data/monitor-medal-of-honor-host-city-museum.mjs
      - name: Save source-check report
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: medal-of-honor-museum-source-review
          path: artifacts/museum-source-review/
          retention-days: 90
          if-no-files-found: warn
      - name: Open or update issue when current official information requires review
        if: steps.monitor.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='Museum source drift: Medal of Honor Host City Museum'
          body="The weekly primary-source audit of the Gainesville museum detected a possible change or retrieval problem. Check the report artifact for this workflow run, compare official museum hours, admission and field-trip handbook, and update the authority page only after confirming actual changes. Canonical: /destination/medal-of-honor-host-city-museum-gainesville. Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "Museum source drift: Medal of Honor Host City Museum") | .number' | head -1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Fail source drift verification until facts are reviewed
        if: steps.monitor.outcome == 'failure'
        run: exit 1

  verify-live:
    name: Check published Gainesville museum, discovery and SEO
    # On every production attempt, fail and file an issue when publishing failed.
    # Run same public acceptance checks weekly, not only after deployment.
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEPLOYED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify successful deployment and public HTML/XML, not just repository source
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" && "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo '::error title=TexasDefined production deployment failed::Museum cannot be certified on a failed deployment'
            exit 1
          fi
          if ! test -f src/data/medal-of-honor-host-city-museum.ts; then
            echo '::error title=Outdated release::This deployed revision predates the museum; publication remains uncertified'
            exit 1
          fi
          node --check scripts/data/verify-medal-of-honor-host-city-museum-live.mjs
          node scripts/data/verify-medal-of-honor-host-city-museum-live.mjs
      - name: Preserve public acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medal-of-honor-museum-live-evidence-${{ github.run_id }}
          path: artifacts/museum-live-qa/
          if-no-files-found: warn
          retention-days: 30
      - name: Open or update failure issue instead of silently skipping acceptance
        if: steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='Gainesville museum: production acceptance failed'
          body="The museum is NOT certified as publicly published. Release: $DEPLOYED_SHA. Audit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Inspect the live-evidence artifact; fix deployment, canonical, sitemap, JSON-LD or missing incoming links. No Cloudflare connector retries required."
          existing="$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "Gainesville museum: production acceptance failed") | .number' | head -1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Enforce failed acceptance as failed job
        if: steps.live.outcome == 'failure'
        run: exit 1
