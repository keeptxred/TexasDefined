name: Verify free Christmas canonical HTML

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed

permissions:
  contents: read
  statuses: write

concurrency:
  group: free-christmas-canonical-production
  cancel-in-progress: true

jobs:
  verify-free-christmas-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: texasdefined-publication
    env:
      CLOUDFLARE_CACHE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Publish pending status
        run: node scripts/ci/publish-github-status.mjs texasdefined-free-christmas-live pending "Refreshing and verifying free Christmas canonical HTML"

      - name: Purge free Christmas canonical cache
        id: purge
        run: node scripts/ci/purge-free-christmas-html-cache.mjs

      - name: Verify bare canonical HTML
        id: live
        run: node scripts/ci/verify-free-christmas-canonical-html.mjs

      - name: Publish final status
        if: always()
        env:
          STAGE_OUTCOME: ${{ steps.live.outcome }}
        run: node scripts/ci/publish-github-status.mjs texasdefined-free-christmas-live "$STAGE_OUTCOME" "Free Christmas canonical HTML is current" "Free Christmas canonical HTML is stale or unavailable"
