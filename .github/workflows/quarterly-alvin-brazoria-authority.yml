name: Alvin and Brazoria County monthly authority verification
on:
  schedule:
    - cron: '37 14 15 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/quarterly-alvin-brazoria-authority.yml'
      - 'scripts/data/verify-alvin-brazoria-authority.mjs'
      - 'src/data/city-authority-profiles.ts'
      - 'src/data/county-profile.ts'
      - 'src/data/local-government-profile.ts'
      - 'src/data/fixtures/brazoria-county-brazos-gulf-angleton.ts'
      - 'src/data/museum-authority-new-destinations.ts'
      - 'src/data/museum-authority-network.ts'
      - 'src/data/museum-visitor-faqs.ts'
      - 'public/museum-verification-manifest.json'
      - 'src/components/content/CountyGuideSections.tsx'
      - 'src/components/content/EntityDepthSections.tsx'
      - 'src/components/editorial/AlvinHistoricalPhotographs.tsx'
      - 'src/components/editorial/MuseumAuthorityNetworkSection.tsx'
      - 'src/routes/$kind.$slug.lazy.tsx'
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate review script syntax
        run: node --check scripts/data/verify-alvin-brazoria-authority.mjs
      - name: Install isolated Chrome for public source retrieval fallback
        if: github.event_name != 'pull_request'
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/td-alvin-browser --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify Alvin and Brazoria County live text, links, canonicals and source relationships
        id: check
        continue-on-error: true
        run: node scripts/data/verify-alvin-brazoria-authority.mjs
      - name: Preserve full, dated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alvin-brazoria-authority-${{ github.run_id }}
          path: artifacts/alvin-brazoria-authority/latest.json
          if-no-files-found: warn
          retention-days: 90
      - name: Notify owner via existing implementation PR on scheduled drift
        if: steps.check.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 7673 --repo "$GITHUB_REPOSITORY" --body "Monthly Alvin/Brazoria authority check found missing page data or a live/source mismatch. Review run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID and its dated evidence artifact. Fix and redeploy; this audit does not automatically rewrite editorial facts."
      - name: Fail on unresolved drift
        if: steps.check.outcome == 'failure'
        run: exit 1
