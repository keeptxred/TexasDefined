name: Quarterly Alvin and Brazoria County authority verification
on:
  schedule:
    - cron: '37 14 15 1,4,7,10 *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/quarterly-alvin-brazoria-authority.yml'
      - 'scripts/data/verify-alvin-brazoria-authority.mjs'
      - 'src/data/city-authority-profiles.ts'
      - 'src/data/county-profile.ts'
      - 'src/data/fixtures/brazoria-county-brazos-gulf-angleton.ts'
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate review script syntax
        run: node --check scripts/data/verify-alvin-brazoria-authority.mjs
      - name: Verify Alvin and Brazoria County live text, links, canonicals and source relationships
        id: check
        continue-on-error: true
        run: node scripts/data/verify-alvin-brazoria-authority.mjs
      - name: Preserve full, dated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alvin-brazoria-authority-${{ github.run_id }}
          path: artifacts/alvin-brazoria-authority/latest.json
          if-no-files-found: warn
          retention-days: 90
      - name: Notify owner via existing implementation PR on scheduled drift
        if: steps.check.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 7673 --repo "$GITHUB_REPOSITORY" --body "Quarterly Alvin/Brazoria authority check found missing page data or a live/source mismatch. Review run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID and its dated evidence artifact. Fix and redeploy; this audit does not automatically rewrite editorial facts."
      - name: Fail on unresolved drift
        if: steps.check.outcome == 'failure'
        run: exit 1
