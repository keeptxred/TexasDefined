name: Houston Group Events Post-release Quality
on:
  schedule:
    - cron: '17 13 * * 2'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/data/corporate-events-houston-build2.ts'
      - 'scripts/ci/check-houston-events-postrelease.mjs'
      - '.github/workflows/houston-events-postrelease.yml'
permissions:
  contents: read
jobs:
  source-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Houston Build 2 source
        run: node scripts/ci/check-houston-events-postrelease.mjs
      - name: Check operator links on schedule or manual run only
        if: github.event_name != 'pull_request'
        run: node scripts/ci/check-houston-events-postrelease.mjs --links
      - name: Retain QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: houston-events-postrelease-qa
          path: artifacts/corporate-events-postrelease/report.json
          retention-days: 30
