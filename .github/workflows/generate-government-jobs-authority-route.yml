name: Generate government jobs authority route

on:
  push:
    branches: [content/texas-government-jobs-authority-20261110]
    paths: ['.github/workflows/generate-government-jobs-authority-route.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: texas-government-jobs-route-generation
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/content/texas-government-jobs-authority-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/texas-government-jobs-authority-20261110
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generate canonical TanStack routes through existing production build
        run: npm run build
      - name: Require exact new generated route and substantial content contract
        run: |
          node -e "const fs=require('node:fs');const s=fs.readFileSync('src/routeTree.gen.ts','utf8');if(!s.includes('./routes/texas-government-jobs'))throw Error('New government route not registered')"
          node scripts/data/validate-texas-question-guides.mjs
      - name: Commit generated route tree without touching main or bypassing checks
        run: |
          set -euo pipefail
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo 'Generated route tree already current' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routeTree.gen.ts
          git commit -m 'build: register reviewed Texas government jobs guide'
          git push origin HEAD:content/texas-government-jobs-authority-20261110
          echo 'Generated router committed to research branch' >> "$GITHUB_STEP_SUMMARY"
