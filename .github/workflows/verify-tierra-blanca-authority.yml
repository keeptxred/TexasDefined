name: Tierra Blanca Creek authority quarterly verification

on:
  workflow_dispatch:
  schedule:
    # Quarterly editorial/source and live-page check: Jan/Apr/Jul/Oct 10, 14:17 UTC.
    - cron: "17 14 10 1,4,7,10 *"

permissions:
  contents: read

concurrency:
  group: tierra-blanca-creek-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out TexasDefined
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate code, sources and reciprocal discovery
        run: node scripts/data/validate-tierra-blanca-authority.mjs
      - name: Verify live canonical, factual details, and explore sitemap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, sys, re
          url = "https://texasdefined.com/explore/tierra-blanca-creek"
          sitemap = "https://texasdefined.com/sitemap-explore.xml"
          headers = {"User-Agent": "TexasDefined-Quarterly-Authority/1.0"}
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=25) as r:
                  assert r.status == 200, (url, r.status)
                  return r.read().decode("utf-8", errors="replace")
          html = get(url)
          for token in ("Tierra Blanca Creek", "Buffalo Lake", "Prairie Dog Town Fork", "canonical", "Palo Duro"):
              assert token.lower() in html.lower(), f"Live page missing {token}"
          xml = get(sitemap)
          assert "<loc>https://texasdefined.com/explore/tierra-blanca-creek</loc>" in xml, "Guide missing from live Explore sitemap"
          print("PASS: live Tierra Blanca guide and Explore sitemap")
          PY
