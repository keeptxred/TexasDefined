name: Apply current county density runtime fix

on:
  push:
    branches:
      - fix/county-density-runtime-current
    paths:
      - '.github/workflows/apply-current-county-density-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/county-density-runtime-current
      - name: Apply bounded formatter fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          profile = Path('src/data/county-profile.ts')
          text = profile.read_text()
          old = 'function formatDensity(value: number) {'
          new = 'export function formatDensity(value: number) {'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one private density formatter, found {text.count(old)}')
          profile.write_text(text.replace(old, new, 1))

          guide = Path('src/components/content/CountyGuideSections.tsx')
          text = guide.read_text()
          old = "import type { CountyProfile } from '@/data/county-profile';"
          new = "import { formatDensity, type CountyProfile } from '@/data/county-profile';"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one CountyProfile type-only import, found {text.count(old)}')
          guide.write_text(text.replace(old, new, 1))

          validator = Path('scripts/data/validate-county-density-runtime.mjs')
          validator.write_text("""import fs from 'node:fs';\n\nconst profile = fs.readFileSync('src/data/county-profile.ts', 'utf8');\nconst guide = fs.readFileSync('src/components/content/CountyGuideSections.tsx', 'utf8');\n\nconst required = [\n  [profile, 'export function formatDensity(value: number) {', 'county profile must export the shared density formatter'],\n  [guide, \"import { formatDensity, type CountyProfile } from '@/data/county-profile';\", 'county guide must import the shared density formatter'],\n  [guide, 'formatDensity(profile.populationDensityPerSquareMile)', 'county guide must format density through the shared formatter'],\n];\n\nfor (const [source, needle, message] of required) {\n  if (!source.includes(needle)) throw new Error(message);\n}\n\nconsole.log('County density runtime contract passed.');\n""")

          Path('.github/workflows/apply-current-county-density-fix.yml').unlink()
          PY
      - name: Verify bounded runtime contract
        run: node scripts/data/validate-county-density-runtime.mjs
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/county-profile.ts src/components/content/CountyGuideSections.tsx scripts/data/validate-county-density-runtime.mjs .github/workflows/apply-current-county-density-fix.yml
          git commit -m 'Fix county density SSR runtime on current main'
          git push origin HEAD:fix/county-density-runtime-current
