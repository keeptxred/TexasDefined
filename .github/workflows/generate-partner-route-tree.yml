name: Generate partner route tree

on:
  push:
    branches:
      - fix/partner-referral-reporting-current-main
    paths:
      - '.github/workflows/generate-partner-route-tree.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/partner-referral-reporting-current-main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate route tree through production build
        run: npm run build
      - name: Commit generated route tree if changed
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo 'routeTree.gen.ts already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routeTree.gen.ts
          git commit -m 'Generate partner referral route tree'
          git push origin HEAD:fix/partner-referral-reporting-current-main
