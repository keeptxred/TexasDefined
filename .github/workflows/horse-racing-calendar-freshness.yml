name: Texas horse-racing calendar freshness
on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/ci/watch-horse-racing-schedules.mjs'
      - 'scripts/ci/watch-horse-racing-schedules.test.mjs'
      - '.github/workflows/horse-racing-calendar-freshness.yml'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out TexasDefined race calendar references
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test bounded source and date detection
        run: node --test scripts/ci/watch-horse-racing-schedules.test.mjs
      - name: Review four official race calendars, raise de-duplicated source issue
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/watch-horse-racing-schedules.mjs
