name: Five Texas guides independent live authority acceptance

on:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: five-texas-guides-independent-live
  cancel-in-progress: true

jobs:
  verify-live-five-guides:
    name: Check five guides, source links and licensed images on two public origins
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check canonical guide and primary-source editorial contracts
        run: node scripts/ci/check-five-texas-guide-authority.mjs --static
      - name: Verify live HTML, factual corrections, indexability and three licensed photos
        run: node scripts/ci/verify-five-texas-guide-live.mjs
