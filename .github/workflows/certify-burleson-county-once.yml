name: Certify Burleson County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-burleson-county-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 6641161cf9d155a02d27de737b8eb1ad0653d3ed
    steps:
      - name: Publish pending status
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data '{"state":"pending","context":"burleson-county-live-cert","description":"Checking Burleson County live page, redirect and hero"}' >/dev/null

      - name: Verify Burleson County live page, redirect and hero
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          agent='TexasDefined/1.0 (+https://texasdefined.com)'
          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          page='https://texasdefined.com/county/burleson'
          legacy='https://texasdefined.com/article/burleson-county-caldwell-somerville-brazos-central-texas'
          hero='https://commons.wikimedia.org/wiki/Special:Redirect/file/Burleson_County_courthouse.jpg?width=1600'

          code="$(curl -A "$agent" --retry 5 --retry-all-errors --retry-delay 3 --max-time 60 -sS -o "$work/page" -w '%{http_code}' "$page?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}" || true)"
          [ "$code" = 200 ]
          grep -Fq 'Burleson County: Caldwell, Somerville, the Brazos and a Central Texas Crossroads' "$work/page"
          grep -Fq 'The county in numbers' "$work/page"
          grep -Fq 'County seat' "$work/page"
          grep -Fq '2020 population' "$work/page"
          grep -Fq 'County feature' "$work/page"
          grep -Fq 'https://texasdefined.com/county/burleson' "$work/page"

          rcode="$(curl -A "$agent" --retry 5 --retry-all-errors --retry-delay 3 --max-time 60 -sS -o /dev/null -D "$work/rh" -w '%{http_code}' "$legacy" || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$work/rh")"
          echo "Burleson legacy=$rcode location=$location"
          [ "$rcode" = 301 ]
          [ "$location" = 'https://texasdefined.com/county/burleson' ]

          hcode="$(curl -A "$agent" -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 -sS -D "$work/hh" -o "$work/hb" -w '%{http_code}' "$hero" || true)"
          hmime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/hh" | cut -d';' -f1)"
          hbytes="$(wc -c < "$work/hb" 2>/dev/null || echo 0)"
          echo "Burleson page=$code hero=$hcode mime=$hmime bytes=$hbytes"
          [ "$hcode" = 200 ]
          [[ "$hmime" =~ ^image/(jpeg|png|webp)$ ]]
          [ "$hbytes" -gt 50000 ]

      - name: Publish success status
        if: ${{ steps.verify.outcome == 'success' }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data '{"state":"success","context":"burleson-county-live-cert","description":"Burleson live page, structured/editorial layers, redirect and hero passed"}' >/dev/null

      - name: Publish failure status
        if: ${{ failure() }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data '{"state":"failure","context":"burleson-county-live-cert","description":"Burleson county-specific production verification failed"}' >/dev/null
