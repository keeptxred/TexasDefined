name: Generate Academy Texas location seed

on:
  pull_request:
    paths:
      - 'scripts/data/generate-academy-location-seed.mjs'
      - '.github/workflows/generate-academy-location-seed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Normalize directory bases for Academy relative links
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/data/generate-academy-location-seed.mjs';
          const source = fs.readFileSync(path, 'utf8');
          const updated = source.replace(
            "const url = new URL(decodeHtml(href), base);",
            "const url = new URL(decodeHtml(href), base.endsWith('/') ? base : `${base}/`);",
          );
          if (updated === source) throw new Error('Expected URL normalization source token was not found');
          fs.writeFileSync(path, updated);
          NODE
      - name: Self-test Academy first-party crawler
        run: node scripts/data/generate-academy-location-seed.mjs --self-test
      - name: Generate Academy Texas seed from official directory
        run: node scripts/data/generate-academy-location-seed.mjs --live-output academy-texas-locations.json
      - name: Upload generated seed
        uses: actions/upload-artifact@v4
        with:
          name: academy-texas-locations
          path: academy-texas-locations.json
          if-no-files-found: error
          retention-days: 1
