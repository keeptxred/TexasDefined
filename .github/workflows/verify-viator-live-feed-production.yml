name: Verify Viator live API production

on:
  workflow_run:
    workflows: [Deploy TexasDefined production]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Read-only, bounded, post-release check. A failed Viator upstream must
    # alert without rolling back unrelated TexasDefined editorial content.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate live Viator API product previews and attribution
        run: node scripts/ci/verify-viator-live-feed-production.mjs
