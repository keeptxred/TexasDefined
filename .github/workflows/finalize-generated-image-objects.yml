name: Finalize governed image remediation

on:
  push:
    branches:
      - chat8/image-discover-final-current5-20261003
    paths:
      - .github/workflows/finalize-generated-image-objects.yml

permissions:
  contents: write
  statuses: write

jobs:
  build-final-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chat8/image-discover-final-current5-20261003
          fetch-depth: 0

      - name: Verify exact current main base
        shell: bash
        run: |
          set -euxo pipefail
          expected_main='62dfe44f63f9e7a2595453a98afb5f4258d1555d'
          git fetch origin 'refs/heads/main:refs/remotes/origin/main' 'refs/heads/chat8/image-discover-final-20261002:refs/remotes/origin/chat8/image-discover-final-20261002'
          test "$(git rev-parse origin/main)" = "$expected_main"
          git merge-base --is-ancestor origin/main HEAD

      - name: Restore safe governed text corrections
        shell: bash
        run: |
          set -euxo pipefail
          for path in \
            src/data/article-image-readiness-overrides.ts \
            src/data/county-series.server.ts \
            src/lib/editorial-image-delivery.ts; do
            git cat-file -e "origin/chat8/image-discover-final-20261002:${path}"
            git show "origin/chat8/image-discover-final-20261002:${path}" > "${path}"
          done

      - name: Validate governed image inputs
        shell: bash
        run: |
          set -euxo pipefail
          test -f scripts/assets/materialize-generated-images.mjs
          count="$(find assets/generated/chappell-hill-bluebonnet-festival -maxdepth 1 -type f -name 'clean-v4-20260914.webp.b64.*' | wc -l)"
          echo "clean chunk count=${count}"
          test "$count" -eq 10
          test -f public/images/sports-venues/xtreme-raceway-park.jpg
          grep -F "sourceName: 'site-owner supplied media'" src/data/sports-venue-images.ts
          grep -F "author: 'Microsoft Copilot AI image'" src/data/sports-venue-images.ts
          grep -F "licenseName: 'AI-generated image supplied for TexasDefined use'" src/data/sports-venue-images.ts

      - name: Materialize governed Chappell source
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/assets/materialize-generated-images.mjs
          test -s public/images/events/chappell-hill-bluebonnet-festival-20260914.webp

      - name: Install governed derivative tooling
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libvips-tools ffmpeg
          vips --version
          ffmpeg -version | head -n 1

      - name: Upscale governed Chappell derivative to 1600px
        shell: bash
        run: |
          set -euxo pipefail
          src='public/images/events/chappell-hill-bluebonnet-festival-20260914.webp'
          tmp='public/images/events/.chappell-hill-bluebonnet-festival-20260914.large.webp'
          width="$(vipsheader -f width "$src")"
          height="$(vipsheader -f height "$src")"
          echo "Chappell source ${width}x${height}"
          test "$width" -gt 0
          test "$height" -gt 0
          ffmpeg -hide_banner -loglevel error -y -i "$src" -vf 'scale=1600:-2:flags=lanczos' "$tmp"
          out_width="$(vipsheader -f width "$tmp")"
          out_height="$(vipsheader -f height "$tmp")"
          echo "Chappell derivative ${out_width}x${out_height}"
          test "$out_width" -eq 1600
          test "$out_height" -ge 1
          mv "$tmp" "$src"

      - name: Upscale governed Xtreme derivative proportionally to 1600px
        shell: bash
        run: |
          set -euxo pipefail
          src='public/images/sports-venues/xtreme-raceway-park.jpg'
          tmp='/tmp/xtreme-raceway-park.large.jpg'
          width="$(vipsheader -f width "$src")"
          height="$(vipsheader -f height "$src")"
          echo "Xtreme source ${width}x${height}"
          test "$width" -gt 0
          test "$height" -gt 0
          factor="$(awk -v w="$width" 'BEGIN { printf "%.12f", 1600 / w }')"
          echo "Xtreme scale factor=${factor}"
          vips resize "$src" "$tmp" "$factor" --kernel lanczos3
          out_width="$(vipsheader -f width "$tmp")"
          out_height="$(vipsheader -f height "$tmp")"
          echo "Xtreme derivative ${out_width}x${out_height}"
          test "$out_width" -eq 1600
          test "$out_height" -ge 1
          mv "$tmp" "$src"
          printf '%s\n' "$out_width" > /tmp/xtreme-width.txt
          printf '%s\n' "$out_height" > /tmp/xtreme-height.txt

      - name: Align Xtreme registry dimensions to the real derivative
        shell: bash
        run: |
          set -euxo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'src/data/sports-venue-images.ts';
          const width = Number(fs.readFileSync('/tmp/xtreme-width.txt', 'utf8').trim());
          const height = Number(fs.readFileSync('/tmp/xtreme-height.txt', 'utf8').trim());
          if (width !== 1600 || !Number.isInteger(height) || height < 1) throw new Error(`Unexpected Xtreme derivative dimensions ${width}x${height}`);
          const source = fs.readFileSync(file, 'utf8');
          const match = source.match(/'xtreme-raceway-park': \{[\s\S]*?\n  \},/);
          if (!match) throw new Error('Xtreme registry block not found');
          const block = match[0];
          for (const marker of [
            "imageUrl: '/images/sports-venues/xtreme-raceway-park.jpg'",
            "sourceName: 'site-owner supplied media'",
            "author: 'Microsoft Copilot AI image'",
            "licenseName: 'AI-generated image supplied for TexasDefined use'",
          ]) {
            if (!block.includes(marker)) throw new Error(`Xtreme safe provenance marker missing: ${marker}`);
          }
          const updatedBlock = block.replace(/width: \d+,\n    height: \d+,/, `width: ${width},\n    height: ${height},`);
          if (updatedBlock === block) throw new Error('Xtreme dimensions were not updated');
          fs.writeFileSync(file, source.replace(block, updatedBlock));
          console.log(`Xtreme registry dimensions aligned to ${width}x${height}`);
          NODE

      - name: Rechunk governed Chappell derivative and update checksum
        shell: bash
        run: |
          set -euxo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          const imagePath = 'public/images/events/chappell-hill-bluebonnet-festival-20260914.webp';
          const bytes = fs.readFileSync(imagePath);
          const encoded = bytes.toString('base64');
          const dir = 'assets/generated/chappell-hill-bluebonnet-festival';
          const prefix = 'clean-v4-20260914.webp.b64.';
          const parts = 10;
          const chunkSize = Math.ceil(encoded.length / parts);
          for (let index = 0; index < parts; index += 1) {
            fs.writeFileSync(path.join(dir, `${prefix}${String(index).padStart(2, '0')}`), encoded.slice(index * chunkSize, (index + 1) * chunkSize) + '\n');
          }
          const sha = crypto.createHash('sha256').update(bytes).digest('hex');
          const materializer = 'scripts/assets/materialize-generated-images.mjs';
          const source = fs.readFileSync(materializer, 'utf8');
          const oldSha = '9664491618145e39ce2ebac354ae65325dba7d65d9557dc9d13206fe8ead62d8';
          if (!source.includes(oldSha)) throw new Error('Expected governed Chappell checksum not found');
          fs.writeFileSync(materializer, source.replace(oldSha, sha));
          console.log(`EVENT_SHA256=${sha}`);
          NODE
          rm -f public/images/events/chappell-hill-bluebonnet-festival-20260914.webp public/images/events/chappell-hill-bluebonnet-festival.webp
          node scripts/assets/materialize-generated-images.mjs
          test "$(vipsheader -f width public/images/events/chappell-hill-bluebonnet-festival-20260914.webp)" -eq 1600

      - name: Validate governed registries before staging
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/data/validate-curated-sports-venue-image-layer.mjs
          node scripts/data/validate-sports-venue-photo-additions-final.mjs

      - name: Stage only governed remediation
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/workflows/finalize-generated-image-objects.yml
          git add src/data/article-image-readiness-overrides.ts src/data/county-series.server.ts src/data/sports-venue-images.ts src/lib/editorial-image-delivery.ts
          git add -f assets/generated/chappell-hill-bluebonnet-festival/clean-v4-20260914.webp.b64.* scripts/assets/materialize-generated-images.mjs public/images/sports-venues/xtreme-raceway-park.jpg
          git add -u .github/workflows/finalize-generated-image-objects.yml
          git diff --cached --check
          git diff --cached --name-status
          test -z "$(git diff --name-only)"

      - name: Create immutable Git commit object and publish its SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const owner = 'keeptxred';
          const repo = 'TexasDefined';
          const token = process.env.GH_TOKEN;
          const api = async (path, body) => {
            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}${path}`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify(body),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${path} ${response.status}: ${text}`);
            return text ? JSON.parse(text) : {};
          };

          const parent = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const treeSha = execFileSync('git', ['show', '-s', '--format=%T', parent], { encoding: 'utf8' }).trim();
          const raw = execFileSync('git', ['diff', '--cached', '--name-status', '-z'], { encoding: 'buffer' });
          const fields = raw.toString('utf8').split('\0').filter(Boolean);
          const entries = [];
          for (let i = 0; i < fields.length;) {
            const code = fields[i++];
            const file = fields[i++];
            if (!file) throw new Error(`Malformed staged diff near ${code}`);
            if (code.startsWith('D')) {
              entries.push({ path: file, mode: '100644', type: 'blob', sha: null });
              continue;
            }
            const bytes = fs.readFileSync(file);
            const blob = await api('/git/blobs', { content: bytes.toString('base64'), encoding: 'base64' });
            entries.push({ path: file, mode: '100644', type: 'blob', sha: blob.sha });
          }
          if (entries.length === 0) throw new Error('No staged remediation changes found');
          const tree = await api('/git/trees', { base_tree: treeSha, tree: entries });
          const created = await api('/git/commits', {
            message: 'Upgrade governed generated images for Discover',
            tree: tree.sha,
            parents: [parent],
          });
          await api(`/statuses/${parent}`, {
            state: 'success',
            context: 'image-finalizer/final-commit',
            description: created.sha,
          });
          const payload = {
            sha: created.sha,
            parent,
            changedPaths: entries.map((entry) => entry.path),
            xtreme: {
              width: Number(fs.readFileSync('/tmp/xtreme-width.txt', 'utf8').trim()),
              height: Number(fs.readFileSync('/tmp/xtreme-height.txt', 'utf8').trim()),
            },
          };
          fs.writeFileSync('/tmp/final-commit.json', JSON.stringify(payload, null, 2));
          console.log(`FINAL_COMMIT_SHA=${created.sha}`);
          console.log(`PARENT_SHA=${parent}`);
          console.log(`CHANGED_PATHS=${entries.map((entry) => entry.path).join(',')}`);
          NODE

      - name: Publish final commit evidence
        uses: actions/upload-artifact@v4
        with:
          name: governed-image-final-commit
          path: /tmp/final-commit.json
          retention-days: 1
