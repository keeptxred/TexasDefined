name: Finalize generated image objects

on:
  push:
    branches:
      - chat8/image-discover-final-current-20261002
    paths:
      - .github/workflows/finalize-generated-image-objects.yml

permissions:
  contents: write

jobs:
  build-final-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chat8/image-discover-final-current-20261002
          fetch-depth: 0

      - name: Verify refreshed main baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main chat8/image-discover-final-20261002
          git merge-base --is-ancestor 5d6959862996b7024d0a2fe2553fc0d96d3971e2 HEAD

      - name: Replay governed source corrections
        shell: bash
        run: |
          set -euo pipefail
          git show origin/chat8/image-discover-final-20261002:src/data/article-image-readiness-overrides.ts > src/data/article-image-readiness-overrides.ts
          git show origin/chat8/image-discover-final-20261002:src/data/county-series.server.ts > src/data/county-series.server.ts
          git show origin/chat8/image-discover-final-20261002:src/data/sports-venue-images.ts > src/data/sports-venue-images.ts
          git show origin/chat8/image-discover-final-20261002:src/lib/editorial-image-delivery.ts > src/lib/editorial-image-delivery.ts

      - name: Materialize governed Chappell Hill image
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assets/materialize-generated-images.mjs
          test -s public/images/events/chappell-hill-bluebonnet-festival-20260914.webp

      - name: Install ImageMagick
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          command -v convert
          command -v identify

      - name: Resize Chappell Hill generated image
        shell: bash
        run: |
          set -euo pipefail
          convert public/images/events/chappell-hill-bluebonnet-festival-20260914.webp -filter Lanczos -resize 1600x -quality 90 public/images/events/chappell-hill-bluebonnet-festival-20260914.webp
          identify public/images/events/chappell-hill-bluebonnet-festival-20260914.webp

      - name: Resize Xtreme Raceway generated image
        shell: bash
        run: |
          set -euo pipefail
          test -s public/images/sports-venues/xtreme-raceway-park.jpg
          file public/images/sports-venues/xtreme-raceway-park.jpg
          convert public/images/sports-venues/xtreme-raceway-park.jpg -filter Lanczos -resize 1600x -quality 92 public/images/sports-venues/xtreme-raceway-park.jpg
          identify public/images/sports-venues/xtreme-raceway-park.jpg

      - name: Rechunk Chappell Hill image and update checksum
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const imagePath = 'public/images/events/chappell-hill-bluebonnet-festival-20260914.webp';
          const bytes = fs.readFileSync(imagePath);
          const encoded = bytes.toString('base64');
          const dir = 'assets/generated/chappell-hill-bluebonnet-festival';
          const prefix = 'clean-v4-20260914.webp.b64.';
          const parts = 10;
          const chunkSize = Math.ceil(encoded.length / parts);
          for (let index = 0; index < parts; index += 1) {
            fs.writeFileSync(path.join(dir, `${prefix}${String(index).padStart(2, '0')}`), encoded.slice(index * chunkSize, (index + 1) * chunkSize) + '\n');
          }
          const sha = crypto.createHash('sha256').update(bytes).digest('hex');
          const materializer = 'scripts/assets/materialize-generated-images.mjs';
          const source = fs.readFileSync(materializer, 'utf8');
          const updated = source.replace(/expectedSha256: "[a-f0-9]{64}"/, `expectedSha256: "${sha}"`);
          if (source === updated) throw new Error('Could not update event checksum');
          fs.writeFileSync(materializer, updated);
          console.log(`EVENT_SHA256=${sha}`);
          NODE

      - name: Stage and validate final tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-generated-image-objects.yml
          git add src/data/article-image-readiness-overrides.ts src/data/county-series.server.ts src/data/sports-venue-images.ts src/lib/editorial-image-delivery.ts
          git add -f assets/generated/chappell-hill-bluebonnet-festival/clean-v4-20260914.webp.b64.* scripts/assets/materialize-generated-images.mjs public/images/sports-venues/xtreme-raceway-park.jpg
          git add -u .github/workflows/finalize-generated-image-objects.yml
          git diff --cached --check
          git diff --cached --name-status

      - name: Create remote Git commit object without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const owner = 'keeptxred';
          const repo = 'TexasDefined';
          const token = process.env.GH_TOKEN;
          const api = async (path, body) => {
            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}${path}`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify(body),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${path} ${response.status}: ${text}`);
            return JSON.parse(text);
          };
          const parent = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const treeSha = execFileSync('git', ['show', '-s', '--format=%T', parent], { encoding: 'utf8' }).trim();
          const raw = execFileSync('git', ['diff', '--cached', '--name-status'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          const entries = [];
          for (const line of raw) {
            const [code, ...pathParts] = line.split('\t');
            const file = pathParts.at(-1);
            if (code.startsWith('D')) {
              entries.push({ path: file, mode: '100644', type: 'blob', sha: null });
              continue;
            }
            const bytes = fs.readFileSync(file);
            const blob = await api('/git/blobs', { content: bytes.toString('base64'), encoding: 'base64' });
            entries.push({ path: file, mode: '100644', type: 'blob', sha: blob.sha });
          }
          const tree = await api('/git/trees', { base_tree: treeSha, tree: entries });
          const created = await api('/git/commits', { message: 'Upgrade governed generated images for Discover', tree: tree.sha, parents: [parent] });
          console.log(`FINAL_COMMIT_SHA=${created.sha}`);
          console.log(`PARENT_SHA=${parent}`);
          console.log(`CHANGED_PATHS=${entries.map((entry) => entry.path).join(',')}`);
          NODE
