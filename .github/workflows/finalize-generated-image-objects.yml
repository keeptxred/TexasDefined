name: Finalize generated image objects

on:
  push:
    branches:
      - chat8/image-discover-final-20261002
    paths:
      - .github/workflows/finalize-generated-image-objects.yml

permissions:
  contents: write

jobs:
  build-final-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chat8/image-discover-final-20261002
          fetch-depth: 0
      - name: Build governed 1600px derivatives
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || { echo "Branch no longer contains current main"; exit 1; }
          node scripts/assets/materialize-generated-images.mjs

          sudo apt-get update
          sudo apt-get install -y webp

          EVENT_SRC="public/images/events/chappell-hill-bluebonnet-festival-20260914.webp"
          EVENT_PNG="$(mktemp --suffix=.png)"
          EVENT_WEBP="$(mktemp --suffix=.webp)"
          dwebp "$EVENT_SRC" -png -o "$EVENT_PNG"
          cwebp -quiet -q 90 -resize 1600 1067 "$EVENT_PNG" -o "$EVENT_WEBP"
          mv "$EVENT_WEBP" "$EVENT_SRC"
          rm -f "$EVENT_PNG"

          CONVERT_BIN="$(command -v magick || command -v convert || true)"
          test -n "$CONVERT_BIN"
          XTREME_SRC="public/images/sports-venues/xtreme-raceway-park.jpg"
          XTREME_OUT="$(mktemp --suffix=.jpg)"
          "$CONVERT_BIN" "$XTREME_SRC" -filter Lanczos -resize 1600x -quality 92 "$XTREME_OUT"
          mv "$XTREME_OUT" "$XTREME_SRC"

          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const imagePath = 'public/images/events/chappell-hill-bluebonnet-festival-20260914.webp';
          const bytes = fs.readFileSync(imagePath);
          const encoded = bytes.toString('base64');
          const dir = 'assets/generated/chappell-hill-bluebonnet-festival';
          const prefix = 'clean-v4-20260914.webp.b64.';
          const parts = 10;
          const chunkSize = Math.ceil(encoded.length / parts);
          for (let index = 0; index < parts; index += 1) {
            fs.writeFileSync(path.join(dir, `${prefix}${String(index).padStart(2, '0')}`), encoded.slice(index * chunkSize, (index + 1) * chunkSize) + '\n');
          }
          const sha = crypto.createHash('sha256').update(bytes).digest('hex');
          const materializer = 'scripts/assets/materialize-generated-images.mjs';
          const source = fs.readFileSync(materializer, 'utf8');
          const updated = source.replace(/expectedSha256: "[a-f0-9]{64}"/, `expectedSha256: "${sha}"`);
          if (source === updated) throw new Error('Could not update event checksum');
          fs.writeFileSync(materializer, updated);
          console.log(`EVENT_SHA256=${sha}`);
          NODE

          rm .github/workflows/finalize-generated-image-objects.yml
          webpinfo -summary public/images/events/chappell-hill-bluebonnet-festival-20260914.webp
          identify public/images/sports-venues/xtreme-raceway-park.jpg
          git add -f assets/generated/chappell-hill-bluebonnet-festival/clean-v4-20260914.webp.b64.* scripts/assets/materialize-generated-images.mjs public/images/sports-venues/xtreme-raceway-park.jpg
          git add -u .github/workflows/finalize-generated-image-objects.yml
          git diff --cached --check
      - name: Create remote Git commit object without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const owner = 'keeptxred';
          const repo = 'TexasDefined';
          const token = process.env.GH_TOKEN;
          const api = async (path, body) => {
            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}${path}`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify(body),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${path} ${response.status}: ${text}`);
            return JSON.parse(text);
          };
          const parent = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const commit = JSON.parse(execFileSync('git', ['show', '-s', '--format={"tree":"%T"}', parent], { encoding: 'utf8' }));
          const status = execFileSync('git', ['diff', '--cached', '--name-status', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const entries = [];
          for (let i = 0; i < status.length;) {
            const code = status[i++];
            const file = status[i++];
            if (code.startsWith('D')) {
              entries.push({ path: file, mode: '100644', type: 'blob', sha: null });
              continue;
            }
            const bytes = fs.readFileSync(file);
            const blob = await api('/git/blobs', { content: bytes.toString('base64'), encoding: 'base64' });
            entries.push({ path: file, mode: '100644', type: 'blob', sha: blob.sha });
          }
          const tree = await api('/git/trees', { base_tree: commit.tree, tree: entries });
          const created = await api('/git/commits', { message: 'Upgrade governed generated images for Discover', tree: tree.sha, parents: [parent] });
          console.log(`FINAL_COMMIT_SHA=${created.sha}`);
          console.log(`PARENT_SHA=${parent}`);
          console.log(`CHANGED_PATHS=${entries.map((entry) => entry.path).join(',')}`);
          NODE
