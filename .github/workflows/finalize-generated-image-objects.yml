name: Finalize generated image objects

on:
  push:
    branches:
      - chat8/image-discover-final-current3-20261002
    paths:
      - .github/workflows/finalize-generated-image-objects.yml

permissions:
  contents: write

jobs:
  build-final-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chat8/image-discover-final-current3-20261002
          fetch-depth: 0

      - name: Verify current main ancestry
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main chat8/image-discover-final-20261002
          git merge-base --is-ancestor origin/main HEAD || { echo "Branch no longer contains current main"; exit 1; }

      - name: Restore governed text corrections
        shell: bash
        run: |
          set -euxo pipefail
          for path in \
            src/data/article-image-readiness-overrides.ts \
            src/data/county-series.server.ts \
            src/data/sports-venue-images.ts \
            src/lib/editorial-image-delivery.ts; do
            git cat-file -e "origin/chat8/image-discover-final-20261002:${path}"
            git show "origin/chat8/image-discover-final-20261002:${path}" > "${path}"
          done

      - name: Validate governed image inputs
        shell: bash
        run: |
          set -euxo pipefail
          test -f scripts/assets/materialize-generated-images.mjs
          count="$(find assets/generated/chappell-hill-bluebonnet-festival -maxdepth 1 -type f -name 'clean-v4-20260914.webp.b64.*' | wc -l)"
          echo "clean chunk count=${count}"
          test "$count" -eq 10
          test -f public/images/sports-venues/xtreme-raceway-park.jpg

      - name: Materialize governed event image
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/assets/materialize-generated-images.mjs
          test -s public/images/events/chappell-hill-bluebonnet-festival-20260914.webp

      - name: Ensure image conversion tooling
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick python3-pil
          command -v convert
          python3 - <<'PY'
          from PIL import features
          assert features.check('webp'), 'Pillow lacks WebP support'
          print('Pillow WebP support: yes')
          PY

      - name: Decode governed event image with Pillow
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from PIL import Image
          src = 'public/images/events/chappell-hill-bluebonnet-festival-20260914.webp'
          with Image.open(src) as image:
              image.load()
              print('source format=', image.format, 'size=', image.size, 'mode=', image.mode)
              assert image.size == (800, 600), f'unexpected governed source size: {image.size}'
          PY

      - name: Resize governed event image with Pillow
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from PIL import Image
          src = 'public/images/events/chappell-hill-bluebonnet-festival-20260914.webp'
          tmp = 'public/images/events/.chappell-hill-bluebonnet-festival-20260914.large.webp'
          with Image.open(src) as image:
              image.load()
              resized = image.resize((1600, 1200), Image.Resampling.LANCZOS)
              resized.save(tmp, 'WEBP', quality=90, method=6)
          PY
          test -s public/images/events/.chappell-hill-bluebonnet-festival-20260914.large.webp

      - name: Validate resized event image with Pillow
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from PIL import Image
          tmp = 'public/images/events/.chappell-hill-bluebonnet-festival-20260914.large.webp'
          with Image.open(tmp) as check:
              check.load()
              print('resized format=', check.format, 'size=', check.size, 'mode=', check.mode)
              assert check.size == (1600, 1200), f'bad resized output: {check.size}'
          PY
          mv public/images/events/.chappell-hill-bluebonnet-festival-20260914.large.webp public/images/events/chappell-hill-bluebonnet-festival-20260914.webp

      - name: Resize governed Xtreme Raceway image
        shell: bash
        run: |
          set -euxo pipefail
          src='public/images/sports-venues/xtreme-raceway-park.jpg'
          tmp='public/images/sports-venues/.xtreme-raceway-park.large.jpg'
          convert "$src" -filter Lanczos -resize '1600x' -quality 92 "$tmp"
          test -s "$tmp"
          mv "$tmp" "$src"
          identify "$src"

      - name: Rechunk governed event image and update checksum
        shell: bash
        run: |
          set -euxo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          const imagePath = 'public/images/events/chappell-hill-bluebonnet-festival-20260914.webp';
          const bytes = fs.readFileSync(imagePath);
          const encoded = bytes.toString('base64');
          const dir = 'assets/generated/chappell-hill-bluebonnet-festival';
          const prefix = 'clean-v4-20260914.webp.b64.';
          const parts = 10;
          const chunkSize = Math.ceil(encoded.length / parts);
          for (let index = 0; index < parts; index += 1) {
            fs.writeFileSync(path.join(dir, `${prefix}${String(index).padStart(2, '0')}`), encoded.slice(index * chunkSize, (index + 1) * chunkSize) + '\n');
          }
          const sha = crypto.createHash('sha256').update(bytes).digest('hex');
          const materializer = 'scripts/assets/materialize-generated-images.mjs';
          const source = fs.readFileSync(materializer, 'utf8');
          const updated = source.replace(/expectedSha256: "[a-f0-9]{64}"/, `expectedSha256: "${sha}"`);
          if (source === updated) throw new Error('Could not update event checksum');
          fs.writeFileSync(materializer, updated);
          console.log(`EVENT_SHA256=${sha}`);
          NODE

      - name: Stage final governed remediation
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/workflows/finalize-generated-image-objects.yml
          git add src/data/article-image-readiness-overrides.ts src/data/county-series.server.ts src/data/sports-venue-images.ts src/lib/editorial-image-delivery.ts
          git add -f assets/generated/chappell-hill-bluebonnet-festival/clean-v4-20260914.webp.b64.* scripts/assets/materialize-generated-images.mjs public/images/sports-venues/xtreme-raceway-park.jpg
          git add -u .github/workflows/finalize-generated-image-objects.yml
          git diff --cached --check
          git diff --cached --name-status

      - name: Create final commit object and ready branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const owner = 'keeptxred';
          const repo = 'TexasDefined';
          const token = process.env.GH_TOKEN;
          const api = async (path, body) => {
            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}${path}`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify(body),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${path} ${response.status}: ${text}`);
            return JSON.parse(text);
          };

          const parent = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const treeSha = execFileSync('git', ['show', '-s', '--format=%T', parent], { encoding: 'utf8' }).trim();
          const raw = execFileSync('git', ['diff', '--cached', '--name-status', '-z'], { encoding: 'buffer' });
          const fields = raw.toString('utf8').split('\0').filter(Boolean);
          const entries = [];
          for (let i = 0; i < fields.length;) {
            const code = fields[i++];
            const file = fields[i++];
            if (!file) throw new Error(`Malformed staged diff near ${code}`);
            if (code.startsWith('D')) {
              entries.push({ path: file, mode: '100644', type: 'blob', sha: null });
              continue;
            }
            const bytes = fs.readFileSync(file);
            const blob = await api('/git/blobs', { content: bytes.toString('base64'), encoding: 'base64' });
            entries.push({ path: file, mode: '100644', type: 'blob', sha: blob.sha });
          }
          if (entries.length === 0) throw new Error('No staged remediation changes found');
          const tree = await api('/git/trees', { base_tree: treeSha, tree: entries });
          const created = await api('/git/commits', { message: 'Upgrade governed generated images for Discover', tree: tree.sha, parents: [parent] });
          const readyRef = 'refs/heads/chat8/image-discover-final-ready3-20261002';
          await api('/git/refs', { ref: readyRef, sha: created.sha });
          console.log(`FINAL_COMMIT_SHA=${created.sha}`);
          console.log(`PARENT_SHA=${parent}`);
          console.log(`READY_REF=${readyRef}`);
          console.log(`CHANGED_PATHS=${entries.map((entry) => entry.path).join(',')}`);
          NODE
