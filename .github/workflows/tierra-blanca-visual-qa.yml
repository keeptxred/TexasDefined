name: Tierra Blanca Creek real Chrome authority QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/routes/explore.tierra-blanca-creek.lazy.tsx'
      - 'src/components/explore/TierraBlancaVisitorEvidence.tsx'
      - 'scripts/ci/verify-tierra-blanca-visual.mjs'
      - '.github/workflows/tierra-blanca-visual-qa.yml'
  # A workflow-only maintenance change can verify already-live editorial DOM
  # immediately, even when a separate site's global postdeploy gate fails.
  # Push evidence is never certified as proof of an unpublished Worker commit.
  push:
    branches: [main]
    paths:
      - '.github/workflows/tierra-blanca-visual-qa.yml'
  workflow_run:
    workflows: ["Deploy TexasDefined production"]
    types: [completed]
    branches: [main]
  # A monthly real-browser recheck catches shared layout/CSS drift.
  schedule:
    - cron: '47 14 16 * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: tierra-blanca-chrome-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  acceptance-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate single-page two-viewport Chrome specification
        run: |
          node --check scripts/ci/verify-tierra-blanca-visual.mjs
          node scripts/ci/verify-tierra-blanca-visual.mjs --self-test

  production-chrome:
    # A deployed Worker can be healthy even when an unrelated global publish
    # gate fails (for example a fishing sitemap check). Independently prove
    # that the Worker really published before accepting real-browser evidence.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exactly deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Verify source deployment really published to both live origins
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
            echo "yes" > /tmp/tierra-published.txt
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEPLOY_RUN_ID/jobs?per_page=100" > /tmp/tierra-deploy-jobs.json
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const jobs = JSON.parse(fs.readFileSync('/tmp/tierra-deploy-jobs.json', 'utf8')).jobs || [];
          const deployed = jobs.find(job => job.name === 'deploy');
          const names = ['Deploy TexasDefined Worker', 'Verify direct Worker health', 'Verify canonical production health'];
          const proof = names.map(name => ({ name, conclusion: deployed?.steps?.find(step => step.name === name)?.conclusion || 'missing' }));
          const published = proof.every(step => step.conclusion === 'success');
          fs.writeFileSync('/tmp/tierra-published.txt', published ? 'yes' : 'no');
          console.log(JSON.stringify({ published, originRun: process.env.DEPLOY_RUN_ID, proof }));
          NODE
          fi
          echo "yes" >/dev/null
          echo "published=$(cat /tmp/tierra-published.txt)" >> "$GITHUB_OUTPUT"
      # A deployment can fail on the article merge, then succeed on an unrelated
      # later commit. Checking only HEAD^ misses that unverified article revision.
      # Cache ONLY a completed real browser pass for the current acceptance inputs.
      - name: Restore evidence of prior successful real Chrome acceptance
        if: steps.published.outputs.published == 'yes'
        id: proven
        uses: actions/cache/restore@v4
        with:
          path: .artifacts/tierra-blanca-chrome-validated.txt
          key: tierra-blanca-real-chrome-v2-${{ hashFiles('src/routes/explore.tierra-blanca-creek.lazy.tsx', 'src/components/explore/TierraBlancaVisitorEvidence.tsx', 'scripts/ci/verify-tierra-blanca-visual.mjs', '.github/workflows/tierra-blanca-visual-qa.yml') }}
      - name: Require unproven revisions to receive real Chrome acceptance
        if: steps.published.outputs.published == 'yes'
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "schedule" || "${{ steps.proven.outputs.cache-hit }}" != "true" || ! -s .artifacts/tierra-blanca-chrome-validated.txt ]]; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "Run Chrome: current source revision has no verified evidence, or this is a forced/monthly recheck."
          else
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "Reusing saved successful Chrome acceptance for the exact article, evidence module, workflow and QA script."
          fi
      - name: Set up browser without project-wide dependency changes
        if: steps.scope.outputs.changed == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-tierra-blanca-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Protect bounded test scope
        if: steps.scope.outputs.changed == 'yes'
        run: node scripts/ci/verify-tierra-blanca-visual.mjs --self-test
      - name: Verify actual production map, imagery, article and layout
        id: live_chrome
        if: steps.scope.outputs.changed == 'yes'
        env:
          TARGET_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/ci/verify-tierra-blanca-visual.mjs
      - name: Mark current source contract verified only after Chrome passed
        if: steps.scope.outputs.changed == 'yes' && steps.proven.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          printf 'VERIFIED %s %s\\n' "${{ github.event.workflow_run.head_sha || github.sha }}" "$(date -u +%FT%TZ)" > .artifacts/tierra-blanca-chrome-validated.txt
      - name: Cache verified Chrome acceptance for this exact source contract
        if: steps.scope.outputs.changed == 'yes' && steps.proven.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .artifacts/tierra-blanca-chrome-validated.txt
          key: tierra-blanca-real-chrome-v2-${{ hashFiles('src/routes/explore.tierra-blanca-creek.lazy.tsx', 'src/components/explore/TierraBlancaVisitorEvidence.tsx', 'scripts/ci/verify-tierra-blanca-visual.mjs', '.github/workflows/tierra-blanca-visual-qa.yml') }}
      - name: Preserve real mobile and desktop visual evidence
        id: visual_artifact
        if: always() && steps.scope.outputs.changed == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: tierra-blanca-authority-visual-${{ github.run_id }}
          path: artifacts/tierra-blanca-authority-visual/
          if-no-files-found: error
          retention-days: 14
      # Publish independently inspectable proof of a real Chrome run, not a
      # green pre-merge specification or cached HEAD-only acceptance.
      - name: Record verified Chrome outcome on exact deployed commit
        if: ${{ always() && steps.scope.outputs.changed == 'yes' && github.event_name != 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CHROME_RESULT: ${{ steps.live_chrome.outcome }}
          VISUAL_ARTIFACT_RESULT: ${{ steps.visual_artifact.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CHROME_RESULT" == "success" && "$VISUAL_ARTIFACT_RESULT" == "success" ]]; then
            state=success
            description="Real desktop and mobile Chrome map, FWS photo and layout acceptance passed"
          else
            state=failure
            description="Real desktop/mobile Chrome acceptance failed or did not execute"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$DEPLOYED_SHA" -f state="$state" -f context="texasdefined-tierra-blanca-chrome" -f description="$description" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
