name: Repair editorial image specificity

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/data/repair-editorial-image-specificity.mjs"
      - ".github/workflows/repair-editorial-image-specificity.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/data/repair-editorial-image-specificity.mjs"
      - ".github/workflows/repair-editorial-image-specificity.yml"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: editorial-image-specificity-repair
  cancel-in-progress: false

jobs:
  source-syntax:
    name: Validate editorial image repair source (PR only)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scripts/data/repair-editorial-image-specificity.mjs

  repair:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure JPEG conversion support
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
      - name: Replace weak matches with verified Texas images
        run: node scripts/data/repair-editorial-image-specificity.mjs
      # Creating a reviewable branch must never silently change public images
      # or bypass source rights and protected production validation.
      - name: Open reviewed editorial image repair pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git add src/assets scripts/data/missing-site-image-report.json
          if git diff --cached --quiet; then
            echo 'No image repairs to propose.'
            exit 0
          fi
          branch="automation/editorial-image-specificity-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "fix(images): propose Texas-specific editorial image repairs"
          git push origin "$branch"
          gh pr create --repo "$REPOSITORY" --base main --head "$branch" \
            --title 'Review Texas-specific editorial image repairs' \
            --body 'Review every changed image for location and subject specificity, rights, attribution and visual quality before merging. Generated by the existing image repair script. This workflow cannot merge, deploy or push to main; protected repository CI and normal review must pass.'
          # GITHUB_TOKEN-created pull requests do not automatically trigger PR
          # Actions. Run the canonical validator against the exact proposed SHA.
          bash scripts/ci/dispatch-validate-branch.sh "$branch" validate.yml
