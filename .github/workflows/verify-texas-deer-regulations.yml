name: Verify Texas deer regulations

on:
  schedule:
    - cron: '27 13 * * 2'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/data/hunting/authority-deer.ts'
      - 'src/data/hunting/deer-season-dates.json'
      - 'scripts/data/verify-texas-deer-regulations.mjs'
      - 'scripts/data/sync-texas-deer-seasons.mjs'
      - 'scripts/data/verify-texas-deer-production.mjs'
      - '.github/workflows/verify-texas-deer-regulations.yml'
  pull_request:
    paths:
      - 'src/data/hunting/authority-deer.ts'
      - 'src/data/hunting/deer-season-dates.json'
      - 'src/data/hunting/deer-season-format.ts'
      - 'scripts/data/verify-texas-deer-regulations.mjs'
      - 'scripts/data/sync-texas-deer-seasons.mjs'
      - 'scripts/data/verify-texas-deer-production.mjs'
      - '.github/workflows/verify-texas-deer-regulations.yml'
      - '.github/workflows/finish-texas-deer-season-sync.yml'

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: texas-deer-regulations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deer-regulation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate date dataset, content and primary-source contracts
        run: |
          node scripts/data/sync-texas-deer-seasons.mjs --offline
          node scripts/data/sync-texas-deer-seasons.mjs --self-test
          node scripts/data/verify-texas-deer-regulations.mjs --offline
          node scripts/data/validate-hunting-authority.mjs
          node scripts/data/verify-texas-deer-production.mjs --self-test
      - name: Verify current live deer page on date-neutral PRs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet origin/main HEAD -- src/data/hunting/deer-season-dates.json; then
            node scripts/data/verify-texas-deer-production.mjs
          else
            echo 'PR changes governed dates; live page will be checked after the protected deployment, not before publication.'
          fi
      - name: Compare TPWD animal and statewide calendars
        if: github.event_name != 'pull_request'
        id: official
        run: |
          node scripts/data/sync-texas-deer-seasons.mjs
          node scripts/data/verify-texas-deer-regulations.mjs
      - name: Detect data changes
        if: success() && github.event_name != 'pull_request'
        id: changes
        run: |
          if git diff --quiet -- src/data/hunting/deer-season-dates.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Submit bounded official-date update through a protected PR
        if: success() && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/tpwd-deer-dates-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add -- src/data/hunting/deer-season-dates.json
          git commit -m 'data(hunting): sync verified TPWD deer season dates'
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title 'Refresh verified TPWD deer season and regulations' \
            --body 'Automated TPWD deer season and structured-regulation sync, including consecutive annual season rollover. Both current official TPWD calendars must match all eight date ranges. Structured legal facts (bag limits, harvest reporting, antler spread and special-late eligibility) must parse from the current official deer page, and only src/data/hunting/deer-season-dates.json can change. The trusted finisher independently re-fetches the sources and validates protected CI, auto-merge and production deployment. Unparseable/contradictory official sources fail safely with a deduplicated issue; routine annual rollovers do not require manual approval.'
      - name: Verify live deer guide, all eight dates, image and structured data
        id: live
        if: success() && steps.changes.outputs.changed == 'false' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: node scripts/data/verify-texas-deer-production.mjs
      - name: Open one review issue on source, parsing or scheduling failure
        if: failure() && steps.official.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title='TPWD deer rules verification needs review'
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "The official TPWD deer check did not validate. Review the deer rules and the exact source response before editing. An annual season rollover, county rule change or ambiguous data must NOT auto-merge. Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "Existing editorial review issue #$existing; skipping duplicate."
          fi

      - name: Open one review issue if the published deer guide fails verification
        if: failure() && steps.live.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='Texas deer guide live production verification failed'
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "The scheduled check could not confirm the live Texas deer hunting authority guide, its verified eight date rows, canonical, public-domain deer image, or structured data. Review production HTML and source before making changes. Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "Existing live deer guide review issue #$existing; no duplicate."
          fi
