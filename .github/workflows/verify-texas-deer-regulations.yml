name: Verify Texas deer regulations

on:
  schedule:
    - cron: '27 13 * * 2'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/data/hunting/authority-deer.ts'
      - 'src/data/hunting/deer-season-dates.json'
      - 'src/data/hunting/deer-season-format.ts'
      - 'scripts/data/verify-texas-deer-regulations.mjs'
      - 'scripts/data/sync-texas-deer-seasons.mjs'
      - '.github/workflows/verify-texas-deer-regulations.yml'
      - '.github/workflows/finish-texas-deer-season-sync.yml'

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

concurrency:
  group: texas-deer-regulations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deer-regulation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate date dataset, content and primary-source contracts
        run: |
          node scripts/data/sync-texas-deer-seasons.mjs --offline
          node scripts/data/sync-texas-deer-seasons.mjs --self-test
          node scripts/data/verify-texas-deer-regulations.mjs --offline
          node scripts/data/validate-hunting-authority.mjs
      - name: Compare TPWD animal and statewide calendars
        if: github.event_name != 'pull_request'
        id: official
        run: |
          node scripts/data/sync-texas-deer-seasons.mjs
          node scripts/data/verify-texas-deer-regulations.mjs
      - name: Detect data changes
        if: success() && github.event_name != 'pull_request'
        id: changes
        run: |
          if git diff --quiet -- src/data/hunting/deer-season-dates.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Submit bounded official-date update through a protected PR
        if: success() && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/tpwd-deer-dates-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add -- src/data/hunting/deer-season-dates.json
          git commit -m 'data(hunting): sync verified TPWD deer season dates'
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title 'Refresh verified TPWD deer season dates' \
            --body 'Automated same-season deer date correction. Both official TPWD calendars agree on all eight ranges. Only src/data/hunting/deer-season-dates.json is editable by this job. The separate, trusted finisher validates the exact diff, full branch CI and protected merge gate before auto-merge and deploy. New season years, source drift and non-date regulatory changes fail closed and require review.'
      - name: Open one review issue on source, parsing or scheduling failure
        if: failure() && steps.official.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title='TPWD deer rules verification needs review'
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "The official TPWD deer check did not validate. Review the deer rules and the exact source response before editing. An annual season rollover, county rule change or ambiguous data must NOT auto-merge. Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "Existing editorial review issue #$existing; skipping duplicate."
          fi
