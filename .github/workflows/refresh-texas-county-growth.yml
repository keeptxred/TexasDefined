name: Refresh Census County Population Growth

on:
  schedule:
    - cron: '17 13 15 * *'
  workflow_dispatch:
  push:
    branches: [main, 'feat/texas-county-growth-annual-20261028']
    paths:
      - '.github/workflows/refresh-texas-county-growth.yml'
      - 'scripts/data/refresh-texas-county-growth.mjs'
      - 'scripts/data/refresh-texas-county-growth.test.mjs'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: texas-census-county-growth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate all 254 county data safeguards
        run: node --test scripts/data/refresh-texas-county-growth.test.mjs
      - name: Check next official Census county release
        run: node scripts/data/refresh-texas-county-growth.mjs
      - name: Detect verified new source data
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('src/data/generated/texas-county-growth-current.json', 'utf8'));
          if (d.rows.length !== 254 || new Set(d.rows.map(r => r.fips)).size !== 254) {
            throw new Error('Census county snapshot is incomplete');
          }
          console.log('Validated Vintage', d.vintage, 'with all 254 Texas counties');
          NODE
          if git diff --quiet -- src/data/generated/texas-county-growth-current.json &&
             git ls-files --error-unmatch src/data/generated/texas-county-growth-current.json >/dev/null 2>&1; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "Official Census county data checked; no updated source release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Bootstrap full verified source snapshot on candidate branch
        if: steps.changes.outputs.changed == 'yes' && github.ref_name == 'feat/texas-county-growth-annual-20261028'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/texas-county-growth-current.json
          git commit -m "data: bootstrap official Census Texas county source snapshot"
          # Rebase the bot-generated snapshot over any independent feature-branch edits.
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Open protected verified-source PR
        if: steps.changes.outputs.changed == 'yes' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/texas-county-growth-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/data/generated/texas-county-growth-current.json
          git commit -m "data: advance verified Census Texas county population growth"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Refresh verified Texas county population growth" \
            --body "Official Census county totals only. Verifies exactly 254 distinct Texas FIPS, official state-total reconciliation, unchanged county identities and an annual 2020-base vintage. Existing protected exact-branch validation and automatic merger finish publication. No visitor Census downloads."
