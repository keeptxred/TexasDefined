name: Validate editorial image uniqueness

on:
  pull_request:
    paths:
      - "src/data/fixtures/**"
      - "src/data/index.ts"
      - "scripts/data/validate-editorial-image-duplicates.mjs"
      - "package.json"
      - ".github/workflows/validate-editorial-image-uniqueness.yml"
  push:
    branches: [main]
    paths:
      - "src/data/fixtures/**"
      - "src/data/index.ts"
      - "scripts/data/validate-editorial-image-duplicates.mjs"
      - "package.json"
      - ".github/workflows/validate-editorial-image-uniqueness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-image-uniqueness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reject duplicate editorial hero images
        run: npm run data:validate:editorial-images
