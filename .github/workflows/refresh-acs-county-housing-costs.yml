name: Refresh ACS county housing costs

on:
  workflow_dispatch:
  schedule:
    - cron: '41 11 6 * *'
  pull_request:
    paths:
      - '.github/workflows/refresh-acs-county-housing-costs.yml'
      - 'scripts/data/refresh-county-housing-costs.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-acs-county-housing-costs.yml'
      - 'scripts/data/refresh-county-housing-costs.mjs'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-acs-county-housing-costs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate compact official Census snapshot
        run: node scripts/data/refresh-county-housing-costs.mjs
      - name: Validate complete Texas county snapshot
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('src/data/acs-county-housing-costs.snapshot.json', 'utf8'));
          if (!Array.isArray(data.rows) || data.rows.length !== 254) throw new Error(`Expected all 254 Texas county rows; found ${data.rows?.length ?? 0}`);
          const fips = new Set();
          let suppressed = 0;
          for (const row of data.rows) {
            if (!/^48\d{3}$/.test(String(row.fips))) throw new Error(`Invalid Texas county FIPS ${row.fips}`);
            if (fips.has(row.fips)) throw new Error(`Duplicate county FIPS ${row.fips}`);
            fips.add(row.fips);
            for (const key of ['medianHouseholdIncome','medianHomeValue','medianGrossRent','medianMonthlyOwnerCosts']) {
              if (!(key in row)) throw new Error(`Missing ${key} field for ${row.fips}`);
              const value = row[key];
              if (value === null) { suppressed += 1; continue; }
              if (!Number.isFinite(value) || value < 0) throw new Error(`Invalid ${key} for ${row.fips}: ${value}`);
            }
          }
          console.log(`Validated all ${data.rows.length} Texas county rows; ${suppressed} Census-suppressed/unavailable estimate cells preserved as null.`);
          NODE
      - name: Commit bootstrap snapshot into source PR
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- src/data/acs-county-housing-costs.snapshot.json; then
            echo 'ACS snapshot is already current in this pull request.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/acs-county-housing-costs.snapshot.json
          git commit -m 'Refresh ACS county housing cost snapshot'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Open refresh pull request when scheduled data changed
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/acs-county-housing-costs.snapshot.json; then
            echo 'ACS snapshot is unchanged.'
            exit 0
          fi
          branch="data/acs-housing-costs-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add src/data/acs-county-housing-costs.snapshot.json
          git commit -m 'Refresh ACS county housing cost snapshot'
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title 'Refresh ACS county housing cost snapshot' \
            --body 'Refreshes the compact Texas county housing/cost snapshot from the official U.S. Census Bureau 2020–2024 ACS 5-year Table-Based Summary File. Generated by the guarded refresh workflow; no Census API key is used.'
