name: Refresh ACS county housing costs

on:
  workflow_dispatch:
  schedule:
    - cron: '41 11 6 * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-acs-county-housing-costs.yml'
      - 'scripts/data/refresh-county-housing-costs.mjs'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-acs-county-housing-costs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate compact official Census snapshot
        run: node scripts/data/refresh-county-housing-costs.mjs
      - name: Validate near-complete snapshot
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('src/data/acs-county-housing-costs.snapshot.json', 'utf8'));
          if (!Array.isArray(data.rows) || data.rows.length < 250) throw new Error(`Expected at least 250 Texas county rows; found ${data.rows?.length ?? 0}`);
          for (const row of data.rows) {
            for (const key of ['fips','medianHouseholdIncome','medianHomeValue','medianGrossRent','medianMonthlyOwnerCosts']) {
              if (row[key] == null) throw new Error(`Missing ${key} for ${row.fips || 'unknown county'}`);
            }
          }
          console.log(`Validated ${data.rows.length} Texas county rows.`);
          NODE
      - name: Open refresh pull request when data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/acs-county-housing-costs.snapshot.json; then
            echo 'ACS snapshot is unchanged.'
            exit 0
          fi
          branch="data/acs-housing-costs-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add src/data/acs-county-housing-costs.snapshot.json
          git commit -m 'Refresh ACS county housing cost snapshot'
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title 'Refresh ACS county housing cost snapshot' \
            --body 'Refreshes the compact Texas county housing/cost snapshot from the official U.S. Census Bureau 2020–2024 ACS 5-year Table-Based Summary File. Generated by the guarded refresh workflow; no Census API key is used.'
