name: Validate aquarium machine discovery

on:
  pull_request:
    paths:
      - 'public/aquariums.json'
      - 'public/citation-magnets.json'
      - 'src/data/aquarium-marine-collection.ts'
      - 'src/routes/explore.aquariums.tsx'
      - 'src/routes/llms[.]txt.ts'
      - 'scripts/data/validate-aquarium-machine-discovery.mjs'
      - '.github/workflows/validate-aquarium-machine-discovery.yml'
  push:
    branches:
      - main
    paths:
      - 'public/aquariums.json'
      - 'public/citation-magnets.json'
      - 'src/data/aquarium-marine-collection.ts'
      - 'src/routes/explore.aquariums.tsx'
      - 'src/routes/llms[.]txt.ts'
      - 'scripts/data/validate-aquarium-machine-discovery.mjs'
      - '.github/workflows/validate-aquarium-machine-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate aquarium machine-discovery contract
        run: node scripts/data/validate-aquarium-machine-discovery.mjs
