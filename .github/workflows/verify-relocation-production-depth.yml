name: Verify relocation production depth

on:
  pull_request:
    paths:
      - '.github/workflows/verify-relocation-production-depth.yml'
      - 'src/data/fixtures/relocation-evergreen-depth*.ts'
      - 'src/data/fixtures/lazy-migrated-editorial.ts'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-relocation-production-depth.yml'
      - 'src/data/fixtures/relocation-evergreen-depth*.ts'
      - 'src/data/fixtures/lazy-migrated-editorial.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live relocation guides use depth records
        env:
          PRODUCTION_ORIGIN: https://texasdefined.com
        run: |
          node <<'NODE'
          const origin = process.env.PRODUCTION_ORIGIN;
          const revision = `${process.env.GITHUB_SHA}-${process.env.GITHUB_RUN_ID}`;
          const checks = [
            {
              label: 'Austin',
              path: '/article/moving-to-austin-guide',
              needles: [
                'Austin-area relocation gets easier when the address is treated as a bundle of systems',
                'About 11 minutes',
              ],
            },
            {
              label: 'Dallas–Fort Worth',
              path: '/article/moving-to-dallas-fort-worth-guide',
              needles: [
                'The best DFW location is rarely the one with the strongest city reputation in isolation',
                'About 12 minutes',
              ],
            },
            {
              label: 'San Antonio',
              path: '/article/moving-to-san-antonio-guide',
              needles: [
                'San Antonio is easiest to compare when the decision is built around systems rather than neighborhood reputation',
                'About 11 minutes',
              ],
            },
            {
              label: 'El Paso',
              path: '/article/moving-to-el-paso-guide',
              needles: [
                'Water belongs in the housing budget',
                'About 11 minutes',
              ],
            },
          ];

          let failed = false;
          for (const check of checks) {
            const url = `${origin}${check.path}?verify=${encodeURIComponent(`${revision}-${check.label}`)}`;
            const response = await fetch(url, {
              redirect: 'follow',
              cache: 'no-store',
              signal: AbortSignal.timeout(30_000),
              headers: {
                'cache-control': 'no-cache',
                'user-agent': 'TexasDefined-CI-Relocation-Smoke/1.0',
              },
            });
            const body = await response.text();
            const missing = check.needles.filter((needle) => !body.includes(needle));
            if (!response.ok || missing.length > 0) {
              failed = true;
              console.error(`::error title=Relocation production depth failure::${check.label}: HTTP ${response.status}; missing ${missing.join(' | ') || 'none'}`);
              console.error(`[${check.label}] response sample: ${body.slice(0, 1400).replace(/\s+/g, ' ')}`);
            } else {
              console.log(`[${check.label}] verified at ${check.path}: ${check.needles.join(' | ')}`);
            }
          }

          if (failed) process.exit(1);
          console.log(`Verified ${checks.length} live relocation guides use the enriched depth records.`);
          NODE
