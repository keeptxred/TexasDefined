name: Verify relocation production depth

on:
  pull_request:
    paths:
      - '.github/workflows/verify-relocation-production-depth.yml'
      - 'src/data/fixtures/relocation-evergreen-depth*.ts'
      - 'src/data/fixtures/lazy-migrated-editorial.ts'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-relocation-production-depth.yml'
      - 'src/data/fixtures/relocation-evergreen-depth*.ts'
      - 'src/data/fixtures/lazy-migrated-editorial.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live relocation guides use depth records
        env:
          PRODUCTION_ORIGIN: https://texasdefined.com
        run: |
          node <<'NODE'
          const origin = process.env.PRODUCTION_ORIGIN;
          const revision = `${process.env.GITHUB_SHA}-${process.env.GITHUB_RUN_ID}`;
          const minReadingMinutes = 3;
          const checks = [
            {
              label: 'Austin',
              path: '/article/moving-to-austin-guide',
              depthNeedle: 'Austin-area relocation gets easier when the address is treated as a bundle of systems',
            },
            {
              label: 'Dallas–Fort Worth',
              path: '/article/moving-to-dallas-fort-worth-guide',
              depthNeedle: 'The best DFW location is rarely the one with the strongest city reputation in isolation',
            },
            {
              label: 'San Antonio',
              path: '/article/moving-to-san-antonio-guide',
              depthNeedle: 'San Antonio is easiest to compare when the decision is built around systems rather than neighborhood reputation',
            },
            {
              label: 'El Paso',
              path: '/article/moving-to-el-paso-guide',
              depthNeedle: 'Water belongs in the housing budget',
            },
          ];

          let failed = false;
          for (const check of checks) {
            const url = `${origin}${check.path}?verify=${encodeURIComponent(`${revision}-${check.label}`)}`;
            const response = await fetch(url, {
              redirect: 'follow',
              cache: 'no-store',
              signal: AbortSignal.timeout(30_000),
              headers: {
                'cache-control': 'no-cache',
                'user-agent': 'TexasDefined-CI-Relocation-Smoke/1.0',
              },
            });
            const body = await response.text();
            const depthPresent = body.includes(check.depthNeedle);
            const readingTimeMatch = body.match(/About\s+(\d+)\s+minutes?/i);
            const readingMinutes = readingTimeMatch ? Number(readingTimeMatch[1]) : 0;
            const readingTimeHealthy = readingMinutes >= minReadingMinutes;

            if (!response.ok || !depthPresent || !readingTimeHealthy) {
              failed = true;
              const problems = [
                !depthPresent ? `missing depth marker: ${check.depthNeedle}` : null,
                !readingTimeMatch ? 'missing rendered reading-time byline' : null,
                readingTimeMatch && !readingTimeHealthy
                  ? `rendered reading time ${readingMinutes}m is below ${minReadingMinutes}m minimum`
                  : null,
              ].filter(Boolean);
              console.error(`::error title=Relocation production depth failure::${check.label}: HTTP ${response.status}; ${problems.join(' | ') || 'unexpected response'}`);
              console.error(`[${check.label}] response sample: ${body.slice(0, 1400).replace(/\s+/g, ' ')}`);
            } else {
              console.log(`[${check.label}] verified at ${check.path}: enriched depth marker present; computed reading time ${readingMinutes}m.`);
            }
          }

          if (failed) process.exit(1);
          console.log(`Verified ${checks.length} live relocation guides use enriched depth records with computed reading times of at least ${minReadingMinutes} minutes.`);
          NODE
