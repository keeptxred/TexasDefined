name: Quarterly Texas State Railroad authority and source review

on:
  schedule:
    # Monthly operational-source review; historical chronology is also reviewed on each run.
    - cron: '23 14 5 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/quarterly-texas-state-railroad-authority.yml'
      - 'scripts/data/validate-texas-state-railroad-authority.mjs'
      - 'scripts/ci/verify-texas-state-railroad-production.mjs'
      - 'src/data/fixtures/texas-state-railroad-rusk-palestine-history-guide.ts'
      - 'src/data/fixtures/lazy-historic-supporting.ts'
      - 'src/data/fixtures/anderson-county-palestine-railroads-piney-woods-texas.ts'
      - 'src/data/fixtures/anderson-county-palestine-railroads-dogwoods-east-texas.ts'
      - 'src/data/fixtures/cherokee-county-rusk-jacksonville-caddo-mounds-piney-woods-texas.ts'
      - 'src/data/small-town-destinations-wave5.ts'
      - 'src/data/curated-tourism-collections.ts'
      - 'src/data/museum-expansion-statewide-wave8.ts'
      - 'src/data/museum-authority-network.ts'
      - 'src/data/museum-visitor-faqs.ts'
      - 'src/components/editorial/MuseumDossierContent.tsx'
      - 'src/data/region-authority-overviews.ts'
      - 'public/images/editorial/texas-state-railroad-depot-schematic.svg'
      - 'src/data/museum-authority-heroes.ts'
      - 'src/data/major-event-expanded-authority-tranche58.server.ts'
      - 'src/data/fixtures/texas-explained-support-articles-2.ts'
      - 'src/data/fixtures/texas-historic-travel-transportation-guide.ts'
      - 'src/components/explore/CuratedTourismPage.tsx'
      - 'src/routes/destination.$slug.tsx'

permissions:
  contents: read
  issues: write

concurrency:
  group: quarterly-texas-state-railroad-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-history-and-visitor-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check page history, source transparency and reciprocal links
        run: |
          node --check scripts/data/validate-texas-state-railroad-authority.mjs
          node scripts/data/validate-texas-state-railroad-authority.mjs
      - name: Verify deployed railroad pages, links and sitemaps
        if: github.event_name != 'pull_request'
        run: |
          node --check scripts/ci/verify-texas-state-railroad-production.mjs
          node scripts/ci/verify-texas-state-railroad-production.mjs
      - name: Open one monthly editorial source-review ticket
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="Texas State Railroad authority source check: $(date -u +%Y-%m)"
          open_count="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "in:title \"${title}\"" --json title --jq "[.[] | select(.title == \"${title}\")] | length")"
          if [[ "${open_count}" != "0" ]]; then
            echo "The current month already has an open source-review ticket."
            exit 0
          fi
          cat > /tmp/railroad-review.md <<'EOF'
          Monthly operational and editorial verification for `/article/texas-state-railroad-rusk-palestine-history-guide` and its county/destination cross-links.

          - Recheck the [official excursion calendar and FAQ](https://texasstaterailroad.net/faq-2/): depot location, travel times, accessible boarding, operator, train assignments and seasonal excursions. Do not convert ticket availability into a guarantee.
          - Recheck [Union Pacific / Texas & Eastern freight interchange](https://www.up.com/shipping/short-line/lines/tsr) and confirm that the operating carrier and current cargo remain accurate.
          - Confirm 1883 prison, 1884 ironworks, the 1880s Capitol iron, 1909 Palestine link, 1917 closure and 1919 Rusk State Hospital with [Texas State Library](https://www.tsl.texas.gov/exhibits/prisons/lease/rusk.html) and [Handbook of Texas](https://www.tshaonline.org/handbook/entries/texas-state-railroad). Don't infer the unverified route through Houston.
          - Review film and rolling-stock statements with [Texas Film Commission](https://gov.texas.gov/film/trail/texas-state-railroad), operator and rights-holder; do not promise access to storage yards or abandoned movie cars.
          - Confirm photo license and credit for the Wikimedia Commons photographs on the guide and museum page, check mobile layout, metadata, image loading, redirects, AEO question-and-answer clarity, indexability, sitemap lastmod and live canonical source.
          - Revise editorial content only when underlying verified facts actually change; update `updatedAt` on substantive changes. Run `node scripts/data/validate-texas-state-railroad-authority.mjs` and verify the live release.

          Related pages: `/county/anderson`, `/county/cherokee`, `/destination/palestine`, `/destination/heritage-center-cherokee-county-rusk`, `/explore/scenic-trains`.
          EOF
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body-file /tmp/railroad-review.md --label "editorial" || gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body-file /tmp/railroad-review.md
