name: Temporary Buc-ee's coordinate audit

on:
  push:
    branches:
      - audit/bucees-census-coordinates
    paths:
      - .github/workflows/temp-geocode-bucees.yml

permissions:
  contents: read

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve unresolved Buc-ee's coordinates with OSM Nominatim
        shell: bash
        run: |
          node <<'NODE'
          const rows = [
            ['bucees-14','780 Hwy-35 N Byp','Alvin','77511'],
            ['bucees-21','931 Loop 274','Angleton','77515'],
            ['bucees-28','1700 Highway 71 East','Bastrop','78602'],
            ['bucees-3','801 N Brooks','Brazoria','77422'],
            ['bucees-32','27106 US-290','Cypress','77433'],
            ['bucees-48','1402 South IH-45','Ennis','75119'],
            ['bucees-16','2375 E Austin St','Giddings','78942'],
            ['bucees-59','165 State Highway 77','Hillsboro','76645'],
            ['bucees-1','899 Oyster Creek Drive','Lake Jackson','77566'],
            ['bucees-26','205 IH-45 South','Madisonville','77864'],
            ['bucees-44','1550 Central Texas Expressway','Melissa','75454'],
            ['bucees-75','3245 N IH 35','San Marcos','78666'],
            ['bucees-36','506 W. IH 20','Terrell','75160'],
            ['bucees-18','40900 US Hwy 290 Bypass','Waller','77484'],
          ];

          async function lookup(query) {
            const url = new URL('https://nominatim.openstreetmap.org/search');
            url.searchParams.set('q', query);
            url.searchParams.set('format', 'jsonv2');
            url.searchParams.set('limit', '3');
            url.searchParams.set('countrycodes', 'us');
            url.searchParams.set('addressdetails', '1');
            const response = await fetch(url, {
              headers: {
                accept: 'application/json',
                'user-agent': 'TexasDefined-Coordinate-Audit/1.0 (https://texasdefined.com)',
              },
              signal: AbortSignal.timeout(20000),
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
          }

          const output = [];
          for (const [id, street, city, zip] of rows) {
            const queries = [
              `Buc-ee's, ${street}, ${city}, TX ${zip}`,
              `${street}, ${city}, TX ${zip}`,
              `Buc-ee's, ${city}, TX ${zip}`,
            ];
            let match = null;
            let used = null;
            let error = null;
            for (const query of queries) {
              try {
                const results = await lookup(query);
                match = results.find((candidate) => {
                  const display = String(candidate.display_name ?? '').toLowerCase();
                  return display.includes('texas') && (display.includes(city.toLowerCase()) || display.includes(zip));
                }) ?? results[0] ?? null;
                if (match) { used = query; break; }
              } catch (err) {
                error = err instanceof Error ? err.message : String(err);
              }
              await new Promise((resolve) => setTimeout(resolve, 1100));
            }
            output.push({
              id, street, city, zip, used,
              latitude: match ? Number(match.lat) : null,
              longitude: match ? Number(match.lon) : null,
              displayName: match?.display_name ?? null,
              osmType: match?.osm_type ?? null,
              osmId: match?.osm_id ?? null,
              error: match ? null : error,
            });
            await new Promise((resolve) => setTimeout(resolve, 1100));
          }
          console.log('BUCEES_NOMINATIM_RESULTS=' + JSON.stringify(output));
          console.log(`Resolved ${output.filter((row) => Number.isFinite(row.latitude)).length}/${output.length}`);
          NODE
