name: Temporary indexing regression smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-indexing-regression-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-indexing-regression-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify legacy tools redirect and Texas regions indexing
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'

          deployed='false'
          for attempt in $(seq 1 30); do
            headers="$(mktemp)"
            status="$(curl --max-time 45 --silent --show-error --max-redirs 0 -D "$headers" -o /dev/null -w '%{http_code}' "$origin/tools?from=gsc" || true)"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$headers")"
            rm -f "$headers"
            if [ "$status" = '301' ] && [[ "$location" == *'/decide/financial-tools?from=gsc'* ]]; then
              deployed='true'
              echo "Legacy tools redirect detected on attempt $attempt."
              break
            fi
            echo "Redirect not deployed yet (attempt $attempt/30; status ${status:-000}; location ${location:-none})."
            sleep 10
          done
          test "$deployed" = 'true' || { echo 'Legacy /tools redirect did not deploy within retry window.' >&2; exit 1; }

          python3 <<'PY'
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          origin='https://texasdefined.com'
          article='/article/texas-regions-explained'

          def get(path):
              req=urllib.request.Request(origin+path, headers={'User-Agent':'TexasDefinedIndexingRegressionSmoke/1.0'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  assert response.status == 200, (path, response.status)
                  return response.read().decode('utf-8', errors='replace')

          def robots(html):
              return [m.group(1).lower() for m in re.finditer(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\']([^"\']+)', html, re.I)]

          def canonicals(html):
              return re.findall(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)', html, re.I)

          html=get(article)
          assert 'Texas Regions Explained' in html, 'Texas regions article content missing'
          assert not any('noindex' in value for value in robots(html)), 'Texas regions article unexpectedly noindex'
          assert canonicals(html)==[origin+article], f'Texas regions canonical mismatch: {canonicals(html)}'

          explained=get('/texas-explained')
          assert article in explained, 'Texas regions article missing inbound discovery from Texas Explained'

          seen=set(); queue=[origin+'/sitemap.xml']; visited=set()
          while queue and len(visited)<50:
              url=queue.pop(0)
              if url in visited: continue
              visited.add(url)
              req=urllib.request.Request(url, headers={'User-Agent':'TexasDefinedIndexingRegressionSmoke/1.0'})
              with urllib.request.urlopen(req, timeout=45) as response: payload=response.read()
              root=ET.fromstring(payload)
              local=root.tag.rsplit('}',1)[-1]
              locs=[el.text.strip() for el in root.iter() if el.tag.rsplit('}',1)[-1]=='loc' and el.text]
              if local=='sitemapindex': queue.extend(locs)
              else: seen.update(locs)

          assert origin+article in seen, 'Texas regions article missing from sitemap graph'
          assert origin+'/tools' not in seen, 'Redirect-only /tools leaked into sitemap graph'
          assert origin+'/decide/financial-tools' in seen, 'Canonical financial tools hub missing from sitemap graph'
          print(f'Indexing regression smoke passed across {len(visited)} sitemap document(s).')
          PY
