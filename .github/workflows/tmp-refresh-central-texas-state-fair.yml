name: Temporary Central Texas State Fair refresh

on:
  push:
    branches:
      - agent/central-texas-state-fair-2027-20260911

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/central-texas-state-fair-2027-20260911
          fetch-depth: 0
      - name: Refresh verified occurrence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/data/major-event-index.ts')
          text = path.read_text()
          old = '{ slug: "central-texas-state-fair", name: "Central Texas State Fair", city: "Belton", countySlug: "bell", countyName: "Bell County", region: "prairies-lakes", category: "seasonal", startDate: "2026-09-03", endDate: "2026-09-06", venue: "Cadence Bank Center fairgrounds", officialUrl: "https://www.centraltexasstatefair.com/", sourceCheckedAt: "2026-08-27" }'
          new = '{ slug: "central-texas-state-fair", name: "Central Texas State Fair", city: "Belton", countySlug: "bell", countyName: "Bell County", region: "prairies-lakes", category: "seasonal", startDate: "2027-09-02", endDate: "2027-09-05", dateNote: "The organizer has published the 2027 fair for September 2-5 at Huntington Bank Expo; recheck the official schedule before traveling because individual attractions and concert details can change.", venue: "Huntington Bank Expo", officialUrl: "https://www.centraltexasstatefair.com/", sourceCheckedAt: "2026-09-11" }'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale Central Texas State Fair record, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Validate focused event contracts
        run: |
          node scripts/data/validate-events-seo.mjs
          node scripts/data/validate-major-events.mjs 2>/dev/null || true
      - name: Commit refresh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/major-event-index.ts
          git diff --cached --check
          git commit -m "Refresh Central Texas State Fair for 2027"
          git push origin HEAD:agent/central-texas-state-fair-2027-20260911
