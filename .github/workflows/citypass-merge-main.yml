name: CityPASS reconcile current main

on:
  push:
    branches:
      - feature/citypass-texas-evergreen

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/citypass-texas-evergreen
          fetch-depth: 0

      - name: Merge current main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              echo "Branch contains current main on attempt ${attempt}."
              break
            fi
            git merge --no-edit origin/main
          done
          git push origin HEAD:feature/citypass-texas-evergreen
