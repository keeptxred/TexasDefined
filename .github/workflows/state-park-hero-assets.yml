name: Sync state park hero assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/data/sync-state-park-hero-assets.mjs"
      - "scripts/data/cloudflare-workers-ai-shim.mjs"
      - ".github/workflows/state-park-hero-assets.yml"

permissions:
  contents: write

concurrency:
  group: state-park-hero-assets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NODE_OPTIONS: --import=./scripts/data/cloudflare-workers-ai-shim.mjs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ensure JPEG conversion support
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi

      - name: Resolve and generate park-specific JPEGs
        run: node scripts/data/sync-state-park-hero-assets.mjs

      - name: Commit generated hero assets
        if: always()
        run: |
          git config user.name "Texas Defined Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/images/state-parks src/data/state-park-hero-map.ts scripts/data/state-park-hero-report.json
          if git diff --cached --quiet; then
            echo "No state park hero changes to commit."
            exit 0
          fi
          git commit -m "chore: attach park-specific state park hero JPEGs [skip ci]"
          git pull --rebase origin main
          git push
