name: Verify all sports venue heroes production

on:
  pull_request:
    paths:
      - 'scripts/ci/verify-sports-venue-heroes-production-all.mjs'
      - '.github/workflows/verify-sports-venue-heroes-production-all.yml'
      - 'src/data/sports-venue-images.ts'
      - 'src/data/sports-venue-images-additions.ts'
      - 'src/data/sports-venue-images-additions-wave2.ts'
      - 'src/data/sports-venue-images-additions-wave3.ts'
      - 'src/data/sports-venue-images-additions-wave4.ts'
      - 'src/data/sports-venue-images-additions-wave5.ts'
      - 'src/data/sports-venue-images-additions-wave6.ts'
      - 'src/data/sports-venue-images-additions-wave7.ts'
      - 'src/routes/api.sports-venue-hero.ts'
      - 'src/routes/sports-venue.$slug.tsx'
      - 'src/components/sports/SportsVenueQuickAnswers.tsx'
      - 'src/components/sports/SportsVenueGuidePage.tsx'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/verify-sports-venue-heroes-production-all.mjs'
      - '.github/workflows/verify-sports-venue-heroes-production-all.yml'
      - 'src/data/sports-venue-images.ts'
      - 'src/data/sports-venue-images-additions.ts'
      - 'src/data/sports-venue-images-additions-wave2.ts'
      - 'src/data/sports-venue-images-additions-wave3.ts'
      - 'src/data/sports-venue-images-additions-wave4.ts'
      - 'src/data/sports-venue-images-additions-wave5.ts'
      - 'src/data/sports-venue-images-additions-wave6.ts'
      - 'src/data/sports-venue-images-additions-wave7.ts'
      - 'src/routes/api.sports-venue-hero.ts'
      - 'src/routes/sports-venue.$slug.tsx'
      - 'src/components/sports/SportsVenueQuickAnswers.tsx'
      - 'src/components/sports/SportsVenueGuidePage.tsx'
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sports-venue-heroes-production-all-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exhaustive audit contract
        run: node scripts/ci/verify-sports-venue-heroes-production-all.mjs --contract-only

  live-production:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_ORIGIN: https://texasdefined.com
    steps:
      - uses: actions/checkout@v4
      - name: Verify all governed sports venue heroes in production
        run: node scripts/ci/verify-sports-venue-heroes-production-all.mjs
