name: Softball route-tree sync (feature branch only)
on:
  push:
    branches:
      - feature/texas-womens-softball-authority-20261011
    paths:
      - 'src/routes/sports.softball*.tsx'
      - '.github/workflows/softball-route-tree-sync.yml'

permissions:
  contents: write

jobs:
  update-generated-routes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/texas-womens-softball-authority-20261011
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate TanStack router registry through normal build
        run: npm run build > /dev/null
      - name: Commit generated tree only
        run: |
          git add src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(routes): generate softball route registry"
            git push origin HEAD:feature/texas-womens-softball-authority-20261011
          fi
