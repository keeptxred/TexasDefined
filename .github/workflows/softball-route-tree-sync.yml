name: One-time sports route tree sync
on:
  push:
    branches: [feature/texas-womens-softball-authority-20261011]
    paths:
      - 'src/routes/sports-venues.lazy.tsx'
      - '.github/workflows/softball-route-tree-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/texas-womens-softball-authority-20261011
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build > /dev/null
      - name: Commit generated route registry
        run: |
          git add src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(routes): register lazy sports venue directory"
            git push origin HEAD:feature/texas-womens-softball-authority-20261011
          fi
