name: Verify Texas reservoirs article browser

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/verify-texas-reservoirs-article-browser.mjs'
      - '.github/workflows/verify-texas-reservoirs-article-browser.yml'
  workflow_run:
    workflows: ['Deploy TexasDefined production']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texas-reservoirs-browser-${{ github.event.workflow_run.head_sha || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      should_verify: ${{ steps.scope.outputs.should_verify }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate verifier and scope this run
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DEPLOY_RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [[ ! -f scripts/ci/verify-texas-reservoirs-article-browser.mjs ]]; then
            echo 'Historical release predates the reservoir browser script.'
            echo 'should_verify=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node --check scripts/ci/verify-texas-reservoirs-article-browser.mjs
          if [[ "$EVENT" == "workflow_dispatch" || "$EVENT" == "pull_request" ]]; then
            echo 'should_verify=true' >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "workflow_run" && "$DEPLOY_RESULT" == "success" ]] && \
            git diff --name-only HEAD^ HEAD | grep -Eq \
            '^(src/data/fixtures/texas-lakes-reservoirs-explained(-stub)?[.]ts|src/components/editorial/ArticleBody[.]tsx|scripts/ci/verify-texas-reservoirs-article-browser[.]mjs|[.]github/workflows/verify-texas-reservoirs-article-browser[.]yml)$'; then
            echo 'should_verify=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_verify=false' >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: scope
    if: ${{ needs.scope.outputs.should_verify == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare system Chrome and isolated Playwright
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-reservoir-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify real article at mobile/desktop and probe editorial links
        run: node scripts/ci/verify-texas-reservoirs-article-browser.mjs
      - name: Upload screenshots and per-link evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-reservoirs-article-browser-${{ github.run_id }}
          path: artifacts/texas-reservoirs-article-browser/
          if-no-files-found: warn
          retention-days: 14
