name: Whole-site production page audit

on:
  schedule:
    - cron: '17 13 * * 1'
  pull_request:
    paths:
      - '.github/workflows/audit-whole-site-production.yml'
      - 'scripts/ci/audit-production-pages.mjs'
      - 'scripts/ci/audit-production-link-graph.mjs'
      - 'scripts/data/validate-public-link-graph.mjs'
      - 'scripts/data/validate-layout-dead-space.mjs'
      - 'src/routes/**'
      - 'src/components/**'
      - 'src/data/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whole-site-production-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-production:
    name: Crawl every sitemap-listed production page
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit every production URL
        run: npm run production:pages:audit
      - name: Upload complete page-quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texasdefined-whole-site-page-audit
          path: |
            /tmp/texasdefined-page-audit.json
            /tmp/texasdefined-page-audit.tsv
          if-no-files-found: warn

  audit-link-graph:
    name: Build public internal-link graph
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate link-graph audit contract
        run: node scripts/data/validate-public-link-graph.mjs
      - name: Crawl public internal-link graph
        run: node scripts/ci/audit-production-link-graph.mjs
      - name: Upload public link-graph report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texasdefined-public-link-graph
          path: |
            /tmp/texasdefined-link-graph.json
            /tmp/texasdefined-link-graph.tsv
          if-no-files-found: warn
