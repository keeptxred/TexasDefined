name: GSC exact 1000 alternate URL audit
on:
  pull_request:
    paths:
      - 'ops/seo/gsc-alternate-2026-11-27.json'
      - 'scripts/ci/audit-gsc-alternate-1000.mjs'
      - '.github/workflows/gsc-alternate-exact-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
jobs:
  exact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASELINE_SHA: 2f64dd4bb1f872edada23c29ce31cdb442d6751f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact owner manifest
        run: node scripts/ci/audit-gsc-alternate-1000.mjs --manifest-only
      - name: Require the corrected release to reach protected production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASELINE_SHA/status" --jq '[.statuses[] | select(.context == "texasdefined-production") | .state] | first // "missing"')
            if [[ "$state" == success ]]; then exit 0; fi
            if [[ "$state" == failure || "$state" == error ]]; then echo "::error::Corrected release failed or was superseded; audit must be re-scoped to verified descendant"; exit 1; fi
            sleep 20
          done
          echo "::error::Protected release did not complete within bounded wait"
          exit 1
      - name: Individually fetch and validate all 1000 supplied URLs
        run: node scripts/ci/audit-gsc-alternate-1000.mjs
      - name: Preserve all per-URL evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-gsc-alternate-1000
          path: artifacts/gsc-alternate-2026-11-27/
          if-no-files-found: warn
          retention-days: 30
