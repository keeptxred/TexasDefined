name: Verify Yoakum Heritage Museum post-deploy
on:
  workflow_run:
    workflows: ['Deploy TexasDefined production']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: yoakum-museum-production-qa
  cancel-in-progress: false
jobs:
  live:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Require museum QA source in this release
        id: eligibility
        shell: bash
        run: |
          if [[ -f scripts/ci/verify-yoakum-museum-production.mjs ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Historical release predates Yoakum source; NOT production-certified."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Syntax check exact-revision museum probe
        if: steps.eligibility.outputs.eligible == 'true'
        run: node --check scripts/ci/verify-yoakum-museum-production.mjs
      - name: Check live Yoakum destination, attribution and county sources
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/ci/verify-yoakum-museum-production.mjs
