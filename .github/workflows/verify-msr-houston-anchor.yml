name: Verify MSR Houston same-document mobile anchor

on:
  pull_request:
    paths:
      - 'scripts/ci/verify-msr-houston-browser.mjs'
      - '.github/workflows/verify-msr-houston-anchor.yml'

permissions:
  contents: read

jobs:
  mobile-anchor:
    name: Chrome desktop/mobile MSR Houston acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare exact Chrome browser runner
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-wp-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify existing MSR Houston page and real anchor interaction
        env:
          PRODUCTION_ORIGIN: https://texasdefined.com
        run: node scripts/ci/verify-msr-houston-browser.mjs
      - name: Preserve desktop/mobile visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msr-houston-anchor-${{ github.run_id }}
          path: artifacts/msr-houston-browser/
          if-no-files-found: warn
          retention-days: 7
