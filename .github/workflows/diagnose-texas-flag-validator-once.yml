name: Diagnose Texas flag validator once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-texas-flag-validator-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending validator status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"texas-flag-source-validator","description":"Running isolated Texas flag authority validator"}' >/dev/null
      - name: Run Texas flag authority validator
        id: validate
        run: node scripts/data/validate-texas-flag-authority.mjs
      - name: Publish validator success
        if: ${{ steps.validate.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"texas-flag-source-validator","description":"Texas flag authority validator passed"}' >/dev/null
      - name: Publish validator failure
        if: ${{ failure() && steps.validate.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"texas-flag-source-validator","description":"Texas flag authority validator failed"}' >/dev/null
