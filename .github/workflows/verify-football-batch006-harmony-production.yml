name: Verify Harmony football production authority
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football-batch006-harmony-production-acceptance
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Chrome browser driver
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-harmony-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify Harmony desktop/mobile and Upshur County reciprocal links
        env:
          ACCEPTANCE_SHA: ${{ github.sha }}
        run: node scripts/ci/verify-football-batch006-harmony-production.mjs
      - name: Preserve acceptance report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmony-football-production-acceptance
          path: artifacts/football-batch006-harmony/
          if-no-files-found: warn
          retention-days: 14
