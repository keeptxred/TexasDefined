name: Verify property tax import contract

on:
  pull_request:
    paths:
      - 'supabase/functions/import-texas-property-tax-rates/**'
      - 'supabase/migrations/*tax*'
      - '.github/workflows/sync-property-tax-rates.yml'
      - 'src/data/property/texas-tax-rates*'
      - 'src/routes/property-tax.taxing-unit.$unit.tsx'
      - 'scripts/ci/property-tax-sync-contract.test.mjs'
      - 'scripts/ci/property-tax-change-ledger-contract.test.mjs'
      - 'scripts/ci/property-tax-history-integrity.test.mjs'
      - 'scripts/ci/property-tax-history-year-gaps.test.mjs'
      - 'src/routes/texas-property-tax-rate-history.lazy.tsx'
      - 'src/components/property/TaxingUnitSearch.tsx'
      - 'src/lib/financial/property-tax-history.ts'
      - 'scripts/ci/property-tax-zero-levy-contract.test.mjs'
      - 'scripts/ci/verify-texas-tax-local-sources.mjs'
      - 'scripts/ci/verify-texas-tax-local-sources.test.mjs'
      - 'scripts/ci/verify-texas-tax-source-archive.mjs'
      - 'scripts/ci/verify-texas-tax-source-archive.test.mjs'
      - 'scripts/ci/report-texas-tax-source-gaps.mjs'
      - 'scripts/ci/report-texas-tax-source-gaps.test.mjs'
      - 'scripts/ci/verify-local-financial-production.mjs'
      - 'scripts/ci/tax-history-row-contract.mjs'
      - 'scripts/ci/tax-history-row-contract.test.mjs'
      - '.github/workflows/verify-property-tax-import.yml'
      - '.github/workflows/verify-property-tax-production.yml'
      - 'src/data/school-district-tax-rates.ts'
      - 'src/data/texas-data-download.ts'
      - 'src/data/property/county-property-enrichment.generated.ts'
      - 'scripts/ci/verify-texas-tax-live-observations.mjs'
      - 'scripts/ci/verify-texas-tax-live-observations.test.mjs'
      - 'scripts/ci/texas-school-tax-identity-and-pagination.test.mjs'
      - 'scripts/ci/county-property-pr5289-reconciliation.test.mjs scripts/data/county-property-snapshot-codec.test.mjs'
      - 'src/data/property/county-property-supplement.server.ts'
      - 'src/data/property/county-property-complete.functions.ts'
      - 'scripts/data/sync-county-property-data.mjs'
      - 'scripts/data/county-property-snapshot-codec.mjs'
      - 'scripts/data/county-property-snapshot-codec.test.mjs'
      - 'src/routes/property-tax.county.$county.tsx'
      - 'src/routes/property-tax.counties.tsx'
      - 'scripts/data/validate-county-property-enrichment.mjs'
      - '.github/workflows/sync-county-property-data.yml'

permissions:
  contents: read

jobs:
  tax-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify importer rollback, provenance and override invariants
        run: node --experimental-strip-types --test scripts/ci/property-tax-history-year-gaps.test.mjs scripts/ci/property-tax-sync-contract.test.mjs scripts/ci/property-tax-change-ledger-contract.test.mjs scripts/ci/property-tax-history-integrity.test.mjs scripts/ci/property-tax-zero-levy-contract.test.mjs scripts/ci/verify-texas-tax-local-sources.test.mjs scripts/ci/verify-texas-tax-source-archive.test.mjs scripts/ci/tax-history-row-contract.test.mjs
      - name: Regress dynamic tax provenance, school record pagination and county-source reconciliation
        run: node --test scripts/ci/verify-texas-tax-live-observations.test.mjs scripts/ci/texas-school-tax-identity-and-pagination.test.mjs scripts/ci/county-property-pr5289-reconciliation.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check shared Edge and runner TypeScript importer
        run: deno check --node-modules-dir=none supabase/functions/import-texas-property-tax-rates/index.ts scripts/ci/verify-texas-tax-local-sources.mjs scripts/ci/verify-texas-tax-source-archive.mjs scripts/ci/report-texas-tax-source-gaps.mjs
