name: Validate coastal authority

on:
  pull_request:
    paths:
      - 'src/data/coastal-places.ts'
      - 'src/components/content/CountyCoastalPlaces.tsx'
      - 'src/routes/$kind.$slug.lazy.tsx'
      - 'src/routes/explore.$category.tsx'
      - 'src/routes/explore.$category.lazy.tsx'
      - 'src/routes/sitemap-explore*xml.ts'
      - 'public/content/explore-category-authority/beaches-coast.html'
      - 'public/content/explore-category-authority/beaches-coast-directory.html'
      - 'scripts/data/validate-coastal-authority.mjs'
      - '.github/workflows/validate-coastal-authority.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/coastal-places.ts'
      - 'src/components/content/CountyCoastalPlaces.tsx'
      - 'src/routes/$kind.$slug.lazy.tsx'
      - 'src/routes/explore.$category.tsx'
      - 'src/routes/explore.$category.lazy.tsx'
      - 'src/routes/sitemap-explore*xml.ts'
      - 'public/content/explore-category-authority/beaches-coast.html'
      - 'public/content/explore-category-authority/beaches-coast-directory.html'
      - 'scripts/data/validate-coastal-authority.mjs'
      - '.github/workflows/validate-coastal-authority.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate 52-place Texas coast authority
        run: node scripts/data/validate-coastal-authority.mjs
      - name: Temporary Events origin probe
        env:
          PROBE_SHA: ${{ github.sha }}
          PROBE_RUN: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const origin = 'https://texasdefined.com';
          const nonce = `${process.env.PROBE_SHA}-${process.env.PROBE_RUN}-${Date.now()}`;
          const paths = ['/events', '/events/tournaments', '/events/panhandle-events', '/sitemap.xml'];
          const results = {};
          for (const path of paths) {
            const response = await fetch(`${origin}${path}?probe=${encodeURIComponent(nonce)}`, {
              headers: { 'cache-control': 'no-cache', pragma: 'no-cache', 'user-agent': 'TexasDefined-GitHub-Origin-Probe/1.0' },
              redirect: 'follow',
            });
            results[path] = { status: response.status, headers: Object.fromEntries(response.headers), text: await response.text() };
          }
          const marker = (text, needle) => text.includes(needle) ? 1 : 0;
          const statewide = (text) => marker(text, 'What’s happening across Texas') || marker(text, "What&#x27;s happening across Texas") || marker(text, 'What&apos;s happening across Texas');
          const noindex = (text) => /<meta[^>]+name=["']robots["'][^>]+content=["'][^"']*noindex/i.test(text) || /<meta[^>]+content=["'][^"']*noindex[^"']*["'][^>]+name=["']robots["']/i.test(text);
          const e = results['/events'];
          const t = results['/events/tournaments'];
          const p = results['/events/panhandle-events'];
          const s = results['/sitemap.xml'];
          console.log(`probe_nonce=${nonce}`);
          console.log(`events_status=${e.status}`);
          console.log(`events_statewide_h1=${statewide(e.text)}`);
          console.log(`tournaments_status=${t.status}`);
          console.log(`tournaments_how_to_plan=${marker(t.text, 'How to plan it')}`);
          console.log(`tournaments_source_policy=${marker(t.text, 'Source policy')}`);
          console.log(`tournaments_browse_category=${marker(t.text, 'Browse category')}`);
          console.log(`tournaments_statewide_h1=${statewide(t.text)}`);
          console.log(`tournaments_cf_cache_status=${t.headers['cf-cache-status'] ?? ''}`);
          console.log(`tournaments_age=${t.headers.age ?? ''}`);
          console.log(`panhandle_status=${p.status}`);
          console.log(`panhandle_how_to_plan=${marker(p.text, 'How to plan it')}`);
          console.log(`panhandle_source_policy=${marker(p.text, 'Source policy')}`);
          console.log(`panhandle_statewide_h1=${statewide(p.text)}`);
          console.log(`panhandle_noindex=${noindex(p.text) ? 1 : 0}`);
          console.log(`panhandle_cf_cache_status=${p.headers['cf-cache-status'] ?? ''}`);
          console.log(`panhandle_age=${p.headers.age ?? ''}`);
          console.log(`sitemap_status=${s.status}`);
          console.log(`sitemap_has_panhandle=${marker(s.text, '<loc>https://texasdefined.com/events/panhandle-events</loc>')}`);
          console.log(`sitemap_has_tournaments=${marker(s.text, '<loc>https://texasdefined.com/events/tournaments</loc>')}`);
          NODE
