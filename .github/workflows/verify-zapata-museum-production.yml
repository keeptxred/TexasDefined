name: Verify Zapata museum production

on:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/verify-zapata-museum-production.yml'
      - 'scripts/ci/verify-zapata-museum-production.mjs'
      - 'src/components/editorial/ZapataCountyMuseumAuthority.tsx'
      - 'src/data/museum-expansion-statewide-wave9.ts'
      - 'public/images/zapata-county-museum-history-editorial.svg'

permissions:
  contents: read

concurrency:
  group: zapata-museum-production-smoke
  cancel-in-progress: true

jobs:
  source:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposed museum code
        uses: actions/checkout@v4

      - name: Verify rights-safe museum source before merging
        run: node scripts/ci/verify-zapata-museum-production.mjs --source-only

  museum:
    # Production verification is meaningful only after deployment. Do not fail
    # a PR by asking the still-live old release to satisfy its new page contract.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact deployed museum verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify current live Zapata County Museum authority page
        run: node scripts/ci/verify-zapata-museum-production.mjs
