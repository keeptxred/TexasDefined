name: Certify Deaf Smith County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-deaf-smith-county-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Diagnose SEO validator
        id: seo
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run seo:validate > /tmp/seo.log 2>&1
          code=$?
          cat /tmp/seo.log
          tail -n 8 /tmp/seo.log | tr '\n' ' ' | cut -c1-125 > /tmp/seo-tail
          exit $code
      - name: Diagnose data validator
        id: data
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run data:validate > /tmp/data.log 2>&1
          code=$?
          cat /tmp/data.log
          tail -n 8 /tmp/data.log | tr '\n' ' ' | cut -c1-125 > /tmp/data-tail
          exit $code
      - name: Publish diagnostic statuses
        if: always()
        shell: bash
        env:
          SEO: ${{ steps.seo.outcome }}
          DATA: ${{ steps.data.outcome }}
        run: |
          set -euo pipefail
          post() {
            local context="$1" state="$2" desc="$3"
            desc="${desc//\\/ }"; desc="${desc//\"/ }"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$desc\"}" >/dev/null
          }
          if [ "$SEO" = success ]; then post deaf-smith-seo-detail success 'SEO validation passed'; else post deaf-smith-seo-detail failure "$(cat /tmp/seo-tail)"; fi
          if [ "$DATA" = success ]; then post deaf-smith-data-detail success 'Data validation passed'; else post deaf-smith-data-detail failure "$(cat /tmp/data-tail)"; fi
