name: Certify Deaf Smith County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-deaf-smith-county-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Find first failing SEO validator
        shell: bash
        run: |
          set -uo pipefail
          validators=(validate-generated-page-quality validate-public-route-governance validate-indexation-quality validate-crawl-demand validate-freshness-signals validate-machine-indexing validate-aeo-answer-layers validate-homepage-seo validate-texas-explained-seo validate-things-unique-to-texas validate-texas-icon-link-depth validate-texas-weather-authority validate-texas-food-history validate-texas-culture-citation-index validate-explore-category-seo validate-explore-region-seo validate-explore-topical-authority validate-article-discover-seo validate-author-eeat validate-entity-template-quality validate-image-seo validate-search-rendering-performance validate-content-duplication validate-sitemap-routes validate-internal-link-discovery validate-search-intent-ctr validate-seo-ci-contract)
          for validator in "${validators[@]}"; do
            if ! node "scripts/data/${validator}.mjs"; then
              context="seo-fail-${validator#validate-}"
              curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "{\"state\":\"failure\",\"context\":\"$context\",\"description\":\"First failing SEO validator\"}" >/dev/null
              exit 1
            fi
          done
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data '{"state":"success","context":"seo-all-individual","description":"All SEO validators passed"}' >/dev/null
