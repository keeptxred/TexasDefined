name: Certify Deaf Smith County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-deaf-smith-county-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: County property validation
        id: county_property
        continue-on-error: true
        run: npm run county-property:validate
      - name: SEO validation
        id: seo
        continue-on-error: true
        run: npm run seo:validate
      - name: Data validation
        id: data
        continue-on-error: true
        run: npm run data:validate
      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Bundle budget
        id: performance
        continue-on-error: true
        run: npm run performance:validate
      - name: Editorial image uniqueness
        id: images
        continue-on-error: true
        run: npm run data:validate:editorial-images
      - name: Source and canonical checks
        id: source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          target='89725652843b7b3ea8b1d26b6c73eeba395a7b9d'
          fixture='src/data/fixtures/deaf-smith-county-hereford-xit-cattle-ogallala-panhandle-texas.ts'
          registry='src/data/county-series-profiles-south-plains.ts'
          git merge-base --is-ancestor "$target" HEAD
          test -f "$fixture"
          grep -Fq 'countySlug: "deaf-smith"' "$registry"
          grep -Fq 'Deaf Smith County: Hereford, XIT Ranch Country and the Western Texas Panhandle' "$fixture"
          ! grep -n 'www\.texasdefined\.com' "$fixture" "$registry" src/data/county-series.ts src/data/county-series.server.ts
          git diff --check
      - name: Hero HTTP and MIME
        id: hero
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          hero='https://commons.wikimedia.org/wiki/Special:Redirect/file/Deaf_Smith_County%2C_TX%2C_Courthouse_IMG_4835.JPG?width=1600'
          code="$(curl -A 'TexasDefined/1.0 (+https://texasdefined.com)' -L --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 -sS -D "$work/h" -o "$work/b" -w '%{http_code}' "$hero" || true)"
          mime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/h" | cut -d';' -f1)"
          bytes="$(wc -c < "$work/b" 2>/dev/null || echo 0)"
          echo "HTTP=$code MIME=$mime bytes=$bytes"
          [ "$code" = 200 ] && [[ "$mime" =~ ^image/(jpeg|png|webp)$ ]] && [ "$bytes" -gt 50000 ]
      - name: Live county page
        id: page
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          code="$(curl -A 'TexasDefined/1.0 (+https://texasdefined.com)' --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$work/page" -w '%{http_code}' "https://texasdefined.com/county/deaf-smith?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}" || true)"
          [ "$code" = 200 ]
          grep -Fq 'Deaf Smith County: Hereford, XIT Ranch Country and the Western Texas Panhandle' "$work/page"
          grep -Fq 'The county in numbers' "$work/page"
          grep -Fq 'County seat' "$work/page"
          grep -Fq '2020 population' "$work/page"
          grep -Fq 'County feature' "$work/page"
          grep -Fq 'Hereford' "$work/page"
          grep -Fq 'https://texasdefined.com/county/deaf-smith' "$work/page"
      - name: Legacy redirect
        id: redirect
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          code="$(curl -A 'TexasDefined/1.0 (+https://texasdefined.com)' --max-redirs 0 -sS -D "$work/h" -o /dev/null -w '%{http_code}' 'https://texasdefined.com/article/deaf-smith-county-hereford-xit-cattle-ogallala-panhandle-texas' || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$work/h")"
          echo "HTTP=$code location=$location"
          [[ "$code" =~ ^30(1|8)$ ]] && [[ "$location" == *'/county/deaf-smith'* ]]
      - name: Publish granular statuses
        if: always()
        shell: bash
        env:
          COUNTY_PROPERTY: ${{ steps.county_property.outcome }}
          SEO: ${{ steps.seo.outcome }}
          DATA: ${{ steps.data.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PERFORMANCE: ${{ steps.performance.outcome }}
          IMAGES: ${{ steps.images.outcome }}
          SOURCE: ${{ steps.source.outcome }}
          HERO: ${{ steps.hero.outcome }}
          PAGE: ${{ steps.page.outcome }}
          REDIRECT: ${{ steps.redirect.outcome }}
        run: |
          set -euo pipefail
          post() {
            local context="$1" outcome="$2" desc="$3" state
            [ "$outcome" = success ] && state=success || state=failure
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$desc\"}" >/dev/null
          }
          post deaf-smith-county-property "$COUNTY_PROPERTY" 'County property validation'
          post deaf-smith-seo "$SEO" 'SEO validation group'
          post deaf-smith-data "$DATA" 'Data validation group'
          post deaf-smith-build "$BUILD" 'Production build'
          post deaf-smith-performance "$PERFORMANCE" 'Client bundle budget'
          post deaf-smith-image-uniqueness "$IMAGES" 'Editorial image uniqueness'
          post deaf-smith-source "$SOURCE" 'Source ancestry and canonical-host checks'
          post deaf-smith-hero "$HERO" 'Hero HTTP and MIME check'
          post deaf-smith-live-page "$PAGE" 'Live structured and editorial page'
          post deaf-smith-legacy-redirect "$REDIRECT" 'Legacy permanent redirect'
          if [ "$COUNTY_PROPERTY" = success ] && [ "$SEO" = success ] && [ "$DATA" = success ] && [ "$BUILD" = success ] && [ "$PERFORMANCE" = success ] && [ "$IMAGES" = success ] && [ "$SOURCE" = success ] && [ "$HERO" = success ] && [ "$PAGE" = success ] && [ "$REDIRECT" = success ]; then
            post deaf-smith-county-production success 'Deaf Smith County certification passed'
          else
            post deaf-smith-county-production failure 'Deaf Smith County certification failed; see granular statuses'
            exit 1
          fi
