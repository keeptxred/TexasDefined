name: Certify Deaf Smith County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-deaf-smith-county-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Find first failing delegated SEO validator
        shell: bash
        run: |
          set -uo pipefail
          validators=(validate-website-search-action validate-global-search-destinations validate-explore-route-registration validate-destination-data-integrity validate-destination-relationships validate-explore-profile-enrichment validate-destination-card-enrichment validate-remote-homepage-destinations validate-texas-resources-seo validate-texas-living-seo validate-living-authority validate-shop-schema validate-data-center-seo validate-place-directory-seo validate-financial-tools-seo validate-guides-seo validate-practical-guides-seo validate-property-tax-guide-seo validate-calculator-app-seo validate-knowledge-graph-platform validate-internal-linking validate-internal-link-policy-release validate-internal-link-golden-corpus validate-knowledge-graph-behavior validate-citation-magnets validate-citation-downloads validate-gsc-evergreen-recovery)
          for validator in "${validators[@]}"; do
            if ! node "scripts/data/${validator}.mjs"; then
              context="delegated-fail-${validator#validate-}"
              context="${context:0:95}"
              curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "{\"state\":\"failure\",\"context\":\"$context\",\"description\":\"First failing delegated SEO validator\"}" >/dev/null
              exit 1
            fi
          done
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data '{"state":"success","context":"delegated-seo-all-pass","description":"All delegated SEO validators passed"}' >/dev/null
