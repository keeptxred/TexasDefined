name: Diagnose TexasDefined live origin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-live-origin.yml'

permissions:
  contents: write

env:
  MARKER: .github/certification/live-origin-diagnostic.json

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Probe custom domain and direct Worker
        shell: bash
        run: |
          set -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          work="$(mktemp -d)"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          response="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api" || true)"
          subdomain="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or {}).get("subdomain", ""))' <<<"$response" 2>/dev/null || true)"
          direct="https://texasdefined-site.${subdomain}.workers.dev"
          custom="https://texasdefined.com"
          export work direct custom MARKER GITHUB_SHA
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, datetime
          routes = ['/', '/robots.txt', '/sitemap.xml', '/article/history-of-the-texas-flag', '/article/texas-flag-etiquette-display-guide', '/texas-symbols', '/texas-history']
          origins = {'custom': os.environ['custom'], 'worker': os.environ['direct']}
          result = {
              'target_sha': os.environ['GITHUB_SHA'],
              'recorded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'origins': origins,
              'routes': {},
          }
          for label, origin in origins.items():
              result['routes'][label] = {}
              for route in routes:
                  body = pathlib.Path(os.environ['work']) / f"{label}-{route.strip('/').replace('/', '_') or 'home'}.body"
                  headers = pathlib.Path(os.environ['work']) / f"{label}-{route.strip('/').replace('/', '_') or 'home'}.headers"
                  cmd = ['curl','-A','Mozilla/5.0 TexasDefinedDiagnostic/1.0','--silent','--show-error','--location','--max-time','35','-D',str(headers),'-o',str(body),'-w','%{http_code}|%{url_effective}|%{time_total}', origin + route]
                  try:
                      proc = subprocess.run(cmd, capture_output=True, text=True, timeout=45)
                      parts = proc.stdout.strip().split('|', 2)
                      status = parts[0] if parts else ''
                      effective = parts[1] if len(parts) > 1 else ''
                      elapsed = parts[2] if len(parts) > 2 else ''
                      body_bytes = body.read_bytes()[:800] if body.exists() else b''
                      header_text = headers.read_text(errors='replace')[-1800:] if headers.exists() else ''
                      result['routes'][label][route] = {
                          'http': status,
                          'effective_url': effective,
                          'time_total': elapsed,
                          'curl_exit': proc.returncode,
                          'curl_stderr': proc.stderr[-800:],
                          'headers_tail': header_text,
                          'body_prefix_b64': base64.b64encode(body_bytes).decode(),
                      }
                  except Exception as exc:
                      result['routes'][label][route] = {'exception': repr(exc)}
          pathlib.Path(os.environ['MARKER']).parent.mkdir(parents=True, exist_ok=True)
          pathlib.Path(os.environ['MARKER']).write_text(json.dumps(result, indent=2) + '\n')
          PY
          git add "$MARKER"
          git commit -m 'Record live origin diagnostic' || true
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
