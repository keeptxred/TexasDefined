name: Certify Red River County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-red-river-county-once.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/certify-red-river-county-once.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HERO_URL: https://commons.wikimedia.org/wiki/Special:Redirect/file/Clarksville_June_2018_32_(Red_River_County_Courthouse).jpg?width=1600
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Capture validated main revision
        shell: bash
        run: echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Red River County source and canonical host policy
        shell: bash
        run: |
          set -euo pipefail
          test -f src/data/fixtures/red-river-county-clarksville-red-river-gateway-northeast-texas.ts
          grep -Fq 'countySlug: "red-river"' src/data/county-series-profiles-continued.ts
          grep -Fq '["red-river-county-clarksville-red-river-gateway-northeast-texas", "red-river"]' src/data/county-series.ts
          grep -Fq 'Red River County: Clarksville, the Red River and an Old Gateway into Texas' src/data/fixtures/red-river-county-clarksville-red-river-gateway-northeast-texas.ts
          if grep -n 'www\.texasdefined\.com' src/data/fixtures/red-river-county-clarksville-red-river-gateway-northeast-texas.ts src/data/county-series-profiles-continued.ts src/data/county-series.ts; then
            echo 'Non-canonical www TexasDefined hostname found.' >&2
            exit 1
          fi

      - name: Verify county hero source
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; trap 'rm -rf "$workdir"' EXIT
          status="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$workdir/headers" -o "$workdir/body" -w '%{http_code}' "$HERO_URL")"
          test "$status" = '200'
          mime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$workdir/headers" | cut -d';' -f1)"
          case "$mime" in image/jpeg|image/png|image/webp) ;; *) echo "Unexpected hero MIME: $mime" >&2; exit 1;; esac
          test "$(wc -c < "$workdir/body")" -gt 50000
          echo "Hero source verified: HTTP $status $mime $(wc -c < "$workdir/body") bytes"

      - name: Run normal repository validation
        run: npm run validate

      - name: Confirm main did not move during validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          test "$latest" = "$TARGET_SHA" || { echo "main moved from $TARGET_SHA to $latest; refusing stale deployment" >&2; exit 1; }

      - name: Deploy exact validated current main
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm run deploy

      - name: Verify live Red River County page, structured layer, redirect, and hero
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          county='/county/red-river'
          legacy='/article/red-river-county-clarksville-red-river-gateway-northeast-texas'
          expected_title='Red River County: Clarksville, the Red River and an Old Gateway into Texas'
          workdir="$(mktemp -d)"; trap 'rm -rf "$workdir"' EXIT
          ok=0
          for attempt in $(seq 1 12); do
            status="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$workdir/page" -w '%{http_code}' "$origin$county?verify=${TARGET_SHA}-${GITHUB_RUN_ID}-$attempt")"
            if [ "$status" = '200' ] && grep -Fq "$expected_title" "$workdir/page" && grep -Fq 'The county in numbers' "$workdir/page" && grep -Fq 'County seat' "$workdir/page" && grep -Fq '2020 population' "$workdir/page" && grep -Fq 'County feature' "$workdir/page" && grep -Fq 'Clarksville' "$workdir/page" && grep -Fq 'https://texasdefined.com/county/red-river' "$workdir/page"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = '1' || { echo 'Live Red River County structured/editorial layers did not appear.' >&2; exit 1; }
          legacy_status="$(curl --max-redirs 0 -sS -D "$workdir/legacy-headers" -o /dev/null -w '%{http_code}' "$origin$legacy")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$workdir/legacy-headers")"
          test "$legacy_status" = '301'
          [[ "$location" == *'/county/red-river'* ]]
          hero_status="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$workdir/hero-headers" -o "$workdir/hero" -w '%{http_code}' "$HERO_URL")"
          hero_mime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$workdir/hero-headers" | cut -d';' -f1)"
          test "$hero_status" = '200'
          case "$hero_mime" in image/jpeg|image/png|image/webp) ;; *) echo "Live hero MIME invalid: $hero_mime" >&2; exit 1;; esac
          test "$(wc -c < "$workdir/hero")" -gt 50000
          echo "PASS county=$county structured=yes editorial=yes legacy=$legacy_status hero=$hero_status mime=$hero_mime target=$TARGET_SHA"

# Temporary PR-only change to make the certification run observable; never merge.
