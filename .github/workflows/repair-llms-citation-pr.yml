name: Repair llms citation resources

on:
  pull_request:
    paths:
      - '.github/verification/repair-llms-citation-trigger.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add manifest citation resources to llms.txt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/routes/llms[.]txt.ts')
          text = path.read_text()
          anchor = '- Texas food traditions: https://texasdefined.com/texas-food-trail\n'
          additions = (
              '- Texas food history: https://texasdefined.com/texas-food-history\n'
              '- Chili con carne history: https://texasdefined.com/texas-chili-con-carne-history\n'
              '- Chicken-fried steak guide: https://texasdefined.com/texas-chicken-fried-steak-guide\n'
              '- Texas breakfast taco guide: https://texasdefined.com/texas-breakfast-taco-guide\n'
              '- Texas brand origin stories: https://texasdefined.com/texas-brand-origin-stories\n'
              '- Dr Pepper Texas history: https://texasdefined.com/dr-pepper-texas-history\n'
          )
          if additions in text:
              print('Citation resources already present; no edit required.')
          else:
              if anchor not in text:
                  raise SystemExit('Expected Texas food traditions anchor not found')
              path.write_text(text.replace(anchor, anchor + additions, 1))
          PY
          node scripts/data/validate-citation-magnets.mjs
          git diff --check
      - name: Commit repair to current main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/routes/llms[.]txt.ts; then
            echo 'No repair commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/routes/llms[.]txt.ts'
          git commit -m 'Sync llms citation resources with manifest'
          git push origin HEAD:main
