name: Indexing remediation production smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/indexing-remediation-smoke.yml'
      - 'src/data/destination-audit.ts'
      - 'src/data/destination-curation-all.ts'
      - 'src/data/destination-curation-batch45.ts'
      - 'src/data/destination-curation-batch53.ts'
      - 'src/routes/texas-closing-cost-calculator.tsx'
      - 'src/routes/texas-home-affordability-calculator.tsx'
      - 'src/routes/texas-utility-cost-calculator.tsx'
      - 'src/data/fixtures/finance-evergreen-depth.ts'
      - 'src/data/fixtures/lazy-migrated-editorial.ts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indexing-remediation-production-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify destination provenance and finance depth live
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          destinations=(
            caddo-lake
            possums-kingdom-lake
            lake-travis
            lake-conroe
            toledo-bend-reservoir
            guadalupe-river
            enchanted-rock
            palo-duro-canyon
            blue-hole-wimberley
            big-bend-chisos-basin
            gruene-historic-district
          )

          ready=0
          for attempt in $(seq 1 30); do
            status="$(curl --max-time 45 -sS -o /tmp/sitemap-explore.xml -w '%{http_code}' "$origin/sitemap-explore.xml" || true)"
            if [ "$status" = '200' ] \
              && grep -Fq "$origin/destination/caddo-lake" /tmp/sitemap-explore.xml \
              && curl --max-time 45 -fsSL "$origin/texas-closing-cost-calculator" -o /tmp/closing.html \
              && grep -Fq 'Build the full transaction budget' /tmp/closing.html \
              && curl --max-time 45 -fsSL "$origin/texas-home-affordability-calculator" -o /tmp/affordability.html \
              && grep -Fq 'Pressure-test the result' /tmp/affordability.html; then
              ready=1
              echo "Deployment reached indexing-remediation revision on attempt $attempt."
              break
            fi
            echo "Waiting for indexing-remediation deployment (attempt $attempt/30)."
            sleep 10
          done
          test "$ready" = '1' || { echo 'Production did not reach indexing-remediation revision.' >&2; exit 1; }

          for slug in "${destinations[@]}"; do
            url="$origin/destination/$slug"
            curl --retry 3 --retry-connrefused --max-time 45 -fsSL "$url" -o "/tmp/$slug.html"
            grep -Fq "<link rel=\"canonical\" href=\"$url\"" "/tmp/$slug.html" || {
              echo "Missing self canonical: $url" >&2; exit 1;
            }
            if grep -Fq 'noindex, follow' "/tmp/$slug.html"; then
              echo "Verified destination unexpectedly rendered noindex: $url" >&2; exit 1;
            fi
            grep -Fq "$url" /tmp/sitemap-explore.xml || {
              echo "Verified destination missing from sitemap: $url" >&2; exit 1;
            }
          done

          grep -Fq 'check the current NPS Chisos Basin access page' /tmp/big-bend-chisos-basin.html || {
            echo 'Chisos Basin did not render refreshed 2026 NPS planning guidance.' >&2; exit 1;
          }

          curl --max-time 45 -fsSL "$origin/texas-utility-cost-calculator" -o /tmp/utility.html
          grep -Fq '/article/texas-utility-costs-guide' /tmp/utility.html || {
            echo 'Utility calculator missing reciprocal utility-guide link.' >&2; exit 1;
          }

          for spec in \
            'texas-closing-costs-guide|Closing costs and cash to close are not the same number' \
            'texas-utility-costs-guide|Use a full year when you can' \
            'salary-needed-to-buy-a-house-in-texas|Debt-to-income is a lender measure, not a household budget'; do
            slug="${spec%%|*}"
            marker="${spec#*|}"
            url="$origin/article/$slug"
            curl --max-time 45 -fsSL "$url" -o "/tmp/article-$slug.html"
            grep -Fq "$marker" "/tmp/article-$slug.html" || {
              echo "Deep evergreen marker missing from $url: $marker" >&2; exit 1;
            }
            grep -Fq "<link rel=\"canonical\" href=\"$url\"" "/tmp/article-$slug.html" || {
              echo "Deep evergreen missing self canonical: $url" >&2; exit 1;
            }
            if grep -Fq 'noindex, follow' "/tmp/article-$slug.html"; then
              echo "Deep evergreen unexpectedly noindex: $url" >&2; exit 1;
            fi
          done

          echo 'Indexing remediation production smoke passed.'

      - name: Record passing live verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          printf '%s\n' 'Production indexing remediation smoke passed: destination provenance + finance depth verified live.' > .github/indexing-remediation-smoke-passed.txt
          git add .github/indexing-remediation-smoke-passed.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record indexing remediation production smoke pass'
          git push origin HEAD:main
