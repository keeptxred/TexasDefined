name: Temporary sync generated route tree

on:
  push:
    branches:
      - fix/partner-referral-reporting-final
    paths:
      - '.github/workflows/temp-sync-route-tree.yml'

permissions:
  contents: write

jobs:
  sync-route-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/partner-referral-reporting-final
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate route tree through production build
        run: npm run build
      - name: Commit generated route tree when changed
        shell: bash
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo 'Route tree already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routeTree.gen.ts
          git commit -m 'Commit generated partner referral route tree'
          git push origin HEAD:fix/partner-referral-reporting-final
