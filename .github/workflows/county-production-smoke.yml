name: County production smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/county-production-smoke.yml'
      - 'scripts/ci/verify-county-production.mjs'
      - 'src/routes/county.tsx'
      - 'src/routes/county.lazy.tsx'
      - 'src/routes/api.find-my-county.ts'
  workflow_run:
    workflows: ['Deploy TexasDefined production']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: county-production-smoke-${{ github.event.workflow_run.id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-county-production:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify county hub and finder production
        env:
          PRODUCTION_ORIGIN: https://texasdefined.com
          GITHUB_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/ci/verify-county-production.mjs
