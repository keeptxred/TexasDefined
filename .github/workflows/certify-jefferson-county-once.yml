name: Certify Jefferson County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-jefferson-county-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"jefferson-county-live","description":"Verifying Jefferson County live page, redirect and hero"}' >/dev/null
      - name: Verify Jefferson County
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          fixture='src/data/fixtures/jefferson-county-beaumont-port-arthur-spindletop-gulf-coast-texas.ts'
          registry='src/data/county-series-profiles-east-texas.ts'
          page='https://texasdefined.com/county/jefferson'
          legacy='https://texasdefined.com/article/jefferson-county-beaumont-port-arthur-spindletop-gulf-coast-texas'
          hero='https://upload.wikimedia.org/wikipedia/commons/8/84/Jefferson_County_Courthouse%2C_Beaumont%2C_Texas.jpg'
          agent='TexasDefined/1.0 (+https://texasdefined.com)'
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          test -f "$fixture"
          grep -Fq 'countySlug: "jefferson"' "$registry"
          ! grep -n 'www\.texasdefined\.com' "$fixture" "$registry"

          page_ok=''
          for attempt in $(seq 1 10); do
            code="$(curl -A "$agent" --retry 3 --retry-all-errors --retry-delay 2 --max-time 45 -sS -o "$work/page" -w '%{http_code}' "${page}?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$code" = 200 ] \
              && grep -Fq 'Jefferson County: Spindletop, Ship Channels and the Texas Gulf Coast' "$work/page" \
              && grep -Fq 'The county in numbers' "$work/page" \
              && grep -Fq 'County seat' "$work/page" \
              && grep -Fq '2020 population' "$work/page" \
              && grep -Fq 'County feature' "$work/page" \
              && grep -Fq 'https://texasdefined.com/county/jefferson' "$work/page"; then
              page_ok=1
              break
            fi
            sleep 4
          done
          test "$page_ok" = 1

          redirect_code="$(curl -A "$agent" --max-time 30 -sS -D "$work/rh" -o /dev/null -w '%{http_code}' "$legacy")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$work/rh")"
          test "$redirect_code" = 301
          test "$location" = 'https://texasdefined.com/county/jefferson'

          hero_code="$(curl -A "$agent" -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$work/hh" -o "$work/hb" -w '%{http_code}' "$hero")"
          hero_mime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/hh" | cut -d';' -f1)"
          hero_bytes="$(wc -c < "$work/hb")"
          test "$hero_code" = 200
          [[ "$hero_mime" =~ ^image/(jpeg|png|webp)$ ]]
          test "$hero_bytes" -gt 50000
          echo "page=200 redirect=$redirect_code location=$location hero=$hero_code mime=$hero_mime bytes=$hero_bytes"
      - name: Publish success status
        if: ${{ steps.verify.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"jefferson-county-live","description":"Jefferson live page, structured layer, redirect and hero passed"}' >/dev/null
      - name: Publish failure status
        if: ${{ failure() && steps.verify.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"jefferson-county-live","description":"Jefferson county-specific live certification failed"}' >/dev/null
