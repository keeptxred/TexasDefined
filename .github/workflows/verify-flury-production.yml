name: Verify Flury authority on production

on:
  # Verification must run AFTER deployment, not on a pre-release main push.
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy TexasDefined production]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flury-live-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check live Flury and Editorial Policy on canonical and direct Worker origins
        run: node scripts/ci/verify-flury-production.mjs
