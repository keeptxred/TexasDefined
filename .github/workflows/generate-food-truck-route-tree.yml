name: Generate food-truck lazy route tree

on:
  push:
    branches:
      - feature/texas-food-trucks-300

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/texas-food-trucks-300
          fetch-depth: 0

      - name: Reconcile latest main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate route tree with production build
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git diff -- src/routeTree.gen.ts

      - name: Commit generated tree and reconciliation
        shell: bash
        run: |
          git add src/routeTree.gen.ts
          if git diff --cached --quiet && git diff --quiet HEAD origin/main; then
            echo "No generated route-tree change"
            exit 0
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Generate lazy food-truck route bindings"
          fi
          git push origin HEAD:feature/texas-food-trucks-300
