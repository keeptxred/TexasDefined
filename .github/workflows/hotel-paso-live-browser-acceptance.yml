name: Hotel Paso del Norte live browser acceptance

on:
  pull_request:
    paths:
      - "scripts/ci/verify-hotel-paso-del-norte-live-browser.mjs"
      - ".github/workflows/hotel-paso-live-browser-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotel-paso-browser-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  targeted-live-qa:
    name: Check hotel page and El Paso reciprocal links (two viewports)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare runner Chrome and isolated browser dependency
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-hotel-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify only hotel, El Paso city and El Paso county
        run: node scripts/ci/verify-hotel-paso-del-norte-live-browser.mjs
      - name: Preserve mobile/desktop screenshots and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-paso-del-norte-live-acceptance
          path: artifacts/hotel-paso-del-norte-qa/
          if-no-files-found: warn
          retention-days: 14
