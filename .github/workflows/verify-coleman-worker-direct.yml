name: Verify Coleman County Worker direct

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-coleman-worker-direct.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Verify direct Worker surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          marker='.github/certification/coleman-worker-direct.json'
          target="$(git rev-parse HEAD)"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          response="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api")"
          subdomain="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["result"]["subdomain"])' <<<"$response")"
          origin="https://texasdefined-site.${subdomain}.workers.dev"
          work="$(mktemp -d)"
          page_status="$(curl -A 'TexasDefinedWorkerVerifier/1.0' --silent --show-error --max-time 45 -o "$work/page" -w '%{http_code}' "${origin}/county/coleman" || true)"
          editorial=no; structured=no; canonical=no
          grep -Fq 'Coleman County: Cattle Trails, Camp Colorado and West-Central Texas' "$work/page" && editorial=yes || true
          grep -Fq 'The county in numbers' "$work/page" && grep -Fq 'County seat' "$work/page" && grep -Fq '2020 population' "$work/page" && structured=yes || true
          grep -Fq 'https://texasdefined.com/county/coleman' "$work/page" && canonical=yes || true
          legacy_status="$(curl -A 'TexasDefinedWorkerVerifier/1.0' --silent --show-error --max-time 30 -D "$work/lh" -o /dev/null -w '%{http_code}' "${origin}/article/coleman-county-coleman-santa-anna-camp-colorado-west-central-texas" || true)"
          legacy_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$work/lh")"
          python3 - "$marker" "$target" "$origin" "$page_status" "$editorial" "$structured" "$canonical" "$legacy_status" "$legacy_location" <<'PY'
          import json, pathlib, sys, datetime
          path,target,origin,page,editorial,structured,canonical,legacy,location=sys.argv[1:]
          ok=page=='200' and editorial=='yes' and structured=='yes' and canonical=='yes' and legacy=='301' and location=='https://texasdefined.com/county/coleman'
          pathlib.Path(path).write_text(json.dumps({
            'county':'coleman','status':'pass' if ok else 'fail','stage':'worker-direct','target_sha':target,
            'worker_origin':origin,'page_http':page,'editorial':editorial,'structured':structured,'canonical':canonical,
            'legacy_http':legacy,'legacy_location':location,'recorded_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          },indent=2)+'\n')
          if not ok: raise SystemExit(1)
          PY
          git add "$marker"
          git commit -m 'Record Coleman County direct Worker verification'
          git push origin HEAD:main
