name: Verify Texas brand locator production

on:
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Resolve deployed revision
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_run' ]]; then
            echo "sha=$WORKFLOW_RUN_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Publish pending locator status
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ steps.target.outputs.sha }}
        run: node scripts/ci/publish-github-status.mjs texasdefined-brand-locator-live pending "Verifying Texas brand locator in production"

      - name: Verify Texas brand locator production
        id: locator
        env:
          GITHUB_SHA: ${{ steps.target.outputs.sha }}
          PRODUCTION_ORIGIN: https://texasdefined.com
        run: node scripts/ci/verify-brand-locator-production.mjs

      - name: Publish locator verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ steps.target.outputs.sha }}
          STAGE_OUTCOME: ${{ steps.locator.outcome }}
        run: node scripts/ci/publish-github-status.mjs texasdefined-brand-locator-live "$STAGE_OUTCOME" "Texas brand locator production smoke passed" "Texas brand locator production smoke failed"
