name: Finalize image and Discover remediation

on:
  push:
    branches:
      - chat8/image-discover-final-20261002
    paths:
      - .github/workflows/materialize-large-generated-images.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chat8/image-discover-final-20261002
          fetch-depth: 0
      - name: Apply current-main-safe governed delivery corrections
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main chat8/close-production-image-blockers-20261001-r2
          git merge-base --is-ancestor origin/main HEAD || { echo "Branch no longer contains current main"; exit 1; }

          git show origin/chat8/close-production-image-blockers-20261001-r2:src/data/article-image-readiness-overrides.ts > src/data/article-image-readiness-overrides.ts
          git show origin/chat8/close-production-image-blockers-20261001-r2:src/lib/editorial-image-delivery.ts > src/lib/editorial-image-delivery.ts
          git show origin/chat8/close-production-image-blockers-20261001-r2:src/data/county-series.server.ts > src/data/county-series.server.ts

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src/data/sports-venue-images.ts';
          const source = fs.readFileSync(path, 'utf8');
          const blockPattern = /(\'xtreme-raceway-park\': \{[\s\S]*?licenseUrl: \'https:\/\/texasdefined\.com\/sports-venue\/xtreme-raceway-park\',\n\s*)width: 600,\n\s*height: 400,/;
          if (!blockPattern.test(source)) throw new Error('Expected Xtreme generated-media block not found');
          const updated = source.replace(blockPattern, '$1width: 1600,\n    height: 1067,');
          fs.writeFileSync(path, updated);
          NODE

          rm .github/workflows/materialize-large-generated-images.yml

          git diff --check
          git diff -- src/data/article-image-readiness-overrides.ts src/lib/editorial-image-delivery.ts src/data/county-series.server.ts src/data/sports-venue-images.ts
      - name: Commit final governed image corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/materialize-large-generated-images.yml src/data/article-image-readiness-overrides.ts src/lib/editorial-image-delivery.ts src/data/county-series.server.ts src/data/sports-venue-images.ts
          git diff --cached --quiet && exit 0
          git commit -m "Apply governed image readiness overrides"
          git push origin HEAD:chat8/image-discover-final-20261002
