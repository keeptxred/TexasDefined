name: Research municipal-limit county geometry (not certification)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/data/verify-city-municipal-gis.py'
      - '.github/workflows/verify-city-municipal-gis.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/data/verify-city-municipal-gis.py'
      - '.github/workflows/verify-city-municipal-gis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    name: Compile municipal GIS research helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/data/verify-city-municipal-gis.py
  research:
    name: Capture municipal GIS spatial candidates - human approval required
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free geometry libraries
        run: python -m pip install --disable-pip-version-check 'shapely>=2,<3' 'pyproj>=3,<4'
      - name: Compute research-only intersections and source digests
        run: python scripts/data/verify-city-municipal-gis.py --city all --output artifacts/city-authority-gis/research.json
      - name: Upload research candidates, not acceptance certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-authority-gis-candidates
          path: artifacts/city-authority-gis/
          if-no-files-found: warn
          retention-days: 30
