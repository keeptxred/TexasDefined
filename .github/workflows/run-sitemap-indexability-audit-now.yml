name: Run sitemap indexability audit now

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect known failing production routes
        run: |
          node <<'NODE'
          const urls = [
            'https://texasdefined.com/do/homestead-exemption',
            'https://texasdefined.com/partner-with-us',
            'https://texasdefined.com/texas-icons',
          ];
          for (const url of urls) {
            console.log(`===== ${url} =====`);
            try {
              const response = await fetch(url, {
                redirect: 'manual',
                headers: { 'cache-control': 'no-cache', pragma: 'no-cache', 'user-agent': 'TexasDefined-SEO-Diagnostic/1.0' },
              });
              console.log('status:', response.status);
              console.log('location:', response.headers.get('location'));
              console.log('content-type:', response.headers.get('content-type'));
              console.log('cache-control:', response.headers.get('cache-control'));
              console.log('x-robots-tag:', response.headers.get('x-robots-tag'));
              const html = await response.text();
              console.log('canonical:', html.match(/<link\b[^>]*\brel=["']canonical["'][^>]*>/i)?.[0] ?? html.match(/<link\b[^>]*\bhref=["'][^"']+["'][^>]*\brel=["']canonical["'][^>]*>/i)?.[0] ?? '(missing)');
              console.log('robots:', (html.match(/<meta\b[^>]*\bname=["'](?:robots|googlebot)["'][^>]*>/gi) ?? []).join(' | ') || '(missing)');
              console.log('title:', html.match(/<title\b[^>]*>([\s\S]*?)<\/title>/i)?.[1]?.trim() ?? '(missing)');
            } catch (error) {
              console.log('fetch error:', error instanceof Error ? error.message : String(error));
            }
          }
          NODE

      - name: Audit every submitted sitemap page
        if: always()
        env:
          AUDIT_CONCURRENCY: "12"
          AUDIT_RETRIES: "2"
          AUDIT_TIMEOUT_MS: "15000"
          AUDIT_OUTPUT: tmp/sitemap-page-indexability-audit.json
        run: node scripts/ci/audit-sitemap-page-indexability.mjs

      - name: Upload sitemap indexability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-page-indexability-audit-now
          path: tmp/sitemap-page-indexability-audit.json
          if-no-files-found: warn
          retention-days: 3
