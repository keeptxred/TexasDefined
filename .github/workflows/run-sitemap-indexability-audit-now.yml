name: Run sitemap indexability audit now

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect known failing production routes
        shell: bash
        run: |
          set -u
          for url in \
            https://texasdefined.com/do/homestead-exemption \
            https://texasdefined.com/partner-with-us \
            https://texasdefined.com/texas-icons
          do
            echo "===== $url ====="
            body="$(mktemp)"
            headers="$(mktemp)"
            curl -sS --max-time 20 -D "$headers" -o "$body" "$url" || true
            echo "--- response headers ---"
            grep -Ei '^(HTTP/|location:|content-type:|cache-control:|x-robots-tag:)' "$headers" || true
            echo "--- canonical tags ---"
            grep -Eio '<link[^>]+rel=["'"']canonical["'"'][^>]*>|<link[^>]+href=["'"'][^"'"']+["'"'][^>]+rel=["'"']canonical["'"'][^>]*>' "$body" || true
            echo "--- robots meta ---"
            grep -Eio '<meta[^>]+name=["'"'](robots|googlebot)["'"'][^>]*>|<meta[^>]+content=["'"'][^"'"']+["'"'][^>]+name=["'"'](robots|googlebot)["'"'][^>]*>' "$body" || true
            echo "--- title ---"
            grep -Eio '<title[^>]*>[^<]*</title>' "$body" | head -n 1 || true
            rm -f "$body" "$headers"
          done

      - name: Audit every submitted sitemap page
        env:
          AUDIT_CONCURRENCY: "12"
          AUDIT_RETRIES: "2"
          AUDIT_TIMEOUT_MS: "15000"
          AUDIT_OUTPUT: tmp/sitemap-page-indexability-audit.json
        run: node scripts/ci/audit-sitemap-page-indexability.mjs

      - name: Upload sitemap indexability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-page-indexability-audit-now
          path: tmp/sitemap-page-indexability-audit.json
          if-no-files-found: warn
          retention-days: 3
