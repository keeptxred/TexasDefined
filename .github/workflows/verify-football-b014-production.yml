name: Football Batch014 production Chrome 25-school acceptance
on:
  workflow_run:
    workflows: ['Deploy TexasDefined production']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
  deployments: read
  actions: read
concurrency:
  group: football-b014-25-school-chrome
  cancel-in-progress: false
jobs:
  chrome:
    if: ${{ (github.event_name == 'issue_comment' && github.event.issue.number == 5794 && github.actor == 'keeptxred' && github.event.comment.body == '/run-b014-chrome') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scope Batch014 Chrome to an active, ungraduated assignment
        id: batch_scope
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const reg=JSON.parse(readFileSync('docs/football-authority/REGISTRY.json','utf8'));
          const archived=reg.completedBatches?.some(b=>b.number===14 && b.state==='VERIFIED_BATCH_014_COMPLETE');
          const assigned=(reg.schoolRecords||[]).filter(s=>s.batch===14);
          const authored=assigned.filter(s=>s.status==='IMPLEMENTED'&&s.actualProductionVerified===false).length;
          const explicitlyRequested=process.env.GITHUB_EVENT_NAME!=='workflow_run';
          if(reg.batch?.number===14 && !archived && authored===25 && reg.batch?.slugs?.length===25){
            appendFileSync(process.env.GITHUB_OUTPUT,'active=true'+String.fromCharCode(10));
            console.log('Batch014 25/25 source authored: real Chrome required for this signed release.');
          }else if(reg.batch?.number===14 && !archived && authored<25 &&
                   assigned.length===25 && reg.batch?.slugs?.length===25 && !explicitlyRequested){
            appendFileSync(process.env.GITHUB_OUTPUT,'active=false'+String.fromCharCode(10));
            console.log('PENDING_SOURCE_AUTHORING '+authored+'/25: no production certificate claimed.');
          }else if(archived && (reg.batch?.number!==14 || reg.batch?.state==='VERIFIED_BATCH_014_COMPLETE')){
            appendFileSync(process.env.GITHUB_OUTPUT,'active=false'+String.fromCharCode(10));
            console.log('Batch014 already certified; preserve original immutable Chrome artifact.');
          }else{
            throw new Error('Batch014 source incomplete or inconsistent; no silent manual acceptance');
          }
          NODE
      - name: Resolve exact live Worker to verified GitHub source SHA
        if: steps.batch_scope.outputs.active == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/pin-football-b010-production-release.mjs
      - name: Require exact signed production release for active Batch014
        if: steps.batch_scope.outputs.active == 'true' && steps.release.outputs.ready != 'true'
        run: |
          echo 'No exact signed Worker/source release: cannot skip 75 Chrome cases.' >&2
          exit 1
      - name: Check out exact published source
        if: steps.batch_scope.outputs.active == 'true' && steps.release.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
      - name: Install isolated real Chrome driver
        if: steps.batch_scope.outputs.active == 'true' && steps.release.outputs.ready == 'true'
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/td-b014-chrome --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Verify all Batch014 schools and counties in real Chrome
        if: steps.batch_scope.outputs.active == 'true' && steps.release.outputs.ready == 'true'
        env:
          FOOTBALL_CHROME_SOURCE_SHA: ${{ steps.release.outputs.sha }}
          FOOTBALL_EXPECTED_WORKER_VERSION: ${{ steps.release.outputs.worker }}
        run: |
          node --check scripts/ci/verify-football-b014-production.mjs
          node scripts/ci/verify-football-b014-production.mjs
      - name: Upload compact Batch014 machine evidence
        if: always() && steps.batch_scope.outputs.active == 'true' && steps.release.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: football-b014-25-school-production-chrome
          path: artifacts/b014-chrome-report.json
          retention-days: 7
          if-no-files-found: error