name: Certify Wood County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-wood-county-once.yml'

permissions:
  contents: write

concurrency:
  group: certify-wood-county-production
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HERO_URL: https://commons.wikimedia.org/wiki/Special:Redirect/file/Wood_courthouse_tx_2010.jpg?width=1600
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Repair current route-governance regression
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path

          registry = Path('src/lib/public-routes.ts')
          text = registry.read_text()
          alias = '  "/article/high-school-football-newcomers",\n'
          marker = 'export const REDIRECT_ONLY_PATHS = [\n'
          if alias not in text:
              if marker not in text:
                  raise SystemExit('REDIRECT_ONLY_PATHS marker missing')
              text = text.replace(marker, marker + alias, 1)
              registry.write_text(text)

          fixture = Path('src/data/fixtures/texas-life-split.ts')
          text = fixture.read_text()
          old = 'href: "/article/high-school-football-newcomers"'
          new = 'href: "/article/texas-high-school-football-newcomers"'
          if old in text:
              text = text.replace(old, new)
              fixture.write_text(text)
          PY
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/lib/public-routes.ts src/data/fixtures/texas-life-split.ts
            git commit -m 'Fix Texas football alias route governance'
            git push origin HEAD:main
          fi

      - name: Certify current main
        id: certify
        shell: bash
        run: |
          set +e
          git fetch origin main
          git reset --hard origin/main
          target="$(git rev-parse HEAD)"
          echo "target_sha=$target" >> "$GITHUB_OUTPUT"
          : > /tmp/wood-cert.log
          fail_stage=''

          echo '=== source checks ===' | tee -a /tmp/wood-cert.log
          test -f src/data/fixtures/wood-county-quitman-mineola-lake-fork-piney-woods-texas.ts || fail_stage='source-fixture'
          grep -Fq 'countySlug: "wood"' src/data/county-series-profiles-northeast.ts || fail_stage='source-registry'
          grep -Fq '["wood-county-quitman-mineola-lake-fork-piney-woods-texas", "wood"]' src/data/county-series.ts || fail_stage='source-legacy-map'
          if grep -n 'www\.texasdefined\.com' src/data/fixtures/wood-county-quitman-mineola-lake-fork-piney-woods-texas.ts src/data/county-series-profiles-northeast.ts src/data/county-series.ts >> /tmp/wood-cert.log; then fail_stage='canonical-host'; fi

          echo '=== hero source ===' | tee -a /tmp/wood-cert.log
          hero_status="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D /tmp/hero-headers -o /tmp/hero-body -w '%{http_code}' "$HERO_URL")"
          hero_mime="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' /tmp/hero-headers | cut -d';' -f1)"
          hero_bytes="$(wc -c < /tmp/hero-body)"
          echo "hero source: HTTP $hero_status $hero_mime $hero_bytes bytes" | tee -a /tmp/wood-cert.log
          if [ "$hero_status" != '200' ] || ! [[ "$hero_mime" =~ ^image/(jpeg|png|webp)$ ]] || [ "$hero_bytes" -le 50000 ]; then fail_stage='hero-source'; fi

          if [ -z "$fail_stage" ]; then
            echo '=== npm run validate ===' | tee -a /tmp/wood-cert.log
            npm run validate >> /tmp/wood-cert.log 2>&1
            validate_code=$?
            echo "validate exit=$validate_code" | tee -a /tmp/wood-cert.log
            [ "$validate_code" -eq 0 ] || fail_stage='validation'
          fi

          if [ -z "$fail_stage" ]; then
            git fetch origin main
            latest="$(git rev-parse origin/main)"
            if [ "$latest" != "$target" ]; then
              echo "main moved after validation: $target -> $latest" | tee -a /tmp/wood-cert.log
              fail_stage='main-moved-after-validation'
            fi
          fi

          if [ -z "$fail_stage" ]; then
            echo '=== npm run deploy ===' | tee -a /tmp/wood-cert.log
            npm run deploy >> /tmp/wood-cert.log 2>&1
            deploy_code=$?
            echo "deploy exit=$deploy_code" | tee -a /tmp/wood-cert.log
            [ "$deploy_code" -eq 0 ] || fail_stage='deployment'
          fi

          if [ -z "$fail_stage" ]; then
            echo '=== live verification ===' | tee -a /tmp/wood-cert.log
            origin='https://texasdefined.com'
            county='/county/wood'
            legacy='/article/wood-county-quitman-mineola-lake-fork-piney-woods-texas'
            expected_title='Wood County: Quitman, Mineola, Lake Fork and the Edge of the Piney Woods'
            ok=0
            for attempt in $(seq 1 12); do
              status="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o /tmp/wood-page -w '%{http_code}' "$origin$county?verify=${target}-${GITHUB_RUN_ID}-$attempt")"
              if [ "$status" = '200' ] && grep -Fq "$expected_title" /tmp/wood-page && grep -Fq 'The county in numbers' /tmp/wood-page && grep -Fq 'County seat' /tmp/wood-page && grep -Fq '2020 population' /tmp/wood-page && grep -Fq 'County feature' /tmp/wood-page && grep -Fq 'Quitman' /tmp/wood-page && grep -Fq 'https://texasdefined.com/county/wood' /tmp/wood-page; then ok=1; break; fi
              sleep 5
            done
            echo "county HTTP=$status editorial_structured=$ok" | tee -a /tmp/wood-cert.log
            [ "$ok" -eq 1 ] || fail_stage='live-county'

            if [ -z "$fail_stage" ]; then
              legacy_status="$(curl --max-redirs 0 -sS -D /tmp/legacy-headers -o /dev/null -w '%{http_code}' "$origin$legacy")"
              location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' /tmp/legacy-headers)"
              echo "legacy HTTP=$legacy_status location=$location" | tee -a /tmp/wood-cert.log
              if [ "$legacy_status" != '301' ] || ! [[ "$location" == *'/county/wood'* ]]; then fail_stage='legacy-redirect'; fi
            fi
          fi

          if [ -z "$fail_stage" ]; then overall='pass'; else overall='fail'; fi
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          echo "fail_stage=$fail_stage" >> "$GITHUB_OUTPUT"
          echo "hero_status=$hero_status" >> "$GITHUB_OUTPUT"
          echo "hero_mime=$hero_mime" >> "$GITHUB_OUTPUT"
          echo "hero_bytes=$hero_bytes" >> "$GITHUB_OUTPUT"
          echo "RESULT overall=$overall stage=${fail_stage:-none} target=$target" | tee -a /tmp/wood-cert.log
          exit 0

      - name: Record certification diagnostics
        if: always()
        shell: bash
        env:
          OVERALL: ${{ steps.certify.outputs.overall }}
          FAIL_STAGE: ${{ steps.certify.outputs.fail_stage }}
          TARGET_SHA: ${{ steps.certify.outputs.target_sha }}
          HERO_STATUS: ${{ steps.certify.outputs.hero_status }}
          HERO_MIME: ${{ steps.certify.outputs.hero_mime }}
          HERO_BYTES: ${{ steps.certify.outputs.hero_bytes }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p ops/certifications
          cp /tmp/wood-cert.log ops/certifications/wood-county-production.log
          cat > ops/certifications/wood-county-production.json <<EOF
          {
            "county": "Wood",
            "canonical": "https://texasdefined.com/county/wood",
            "target_sha": "$TARGET_SHA",
            "overall": "$OVERALL",
            "fail_stage": "$FAIL_STAGE",
            "hero_http": "$HERO_STATUS",
            "hero_mime": "$HERO_MIME",
            "hero_bytes": "$HERO_BYTES",
            "run_id": "$GITHUB_RUN_ID",
            "certified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ops/certifications/wood-county-production.json ops/certifications/wood-county-production.log
          git commit -m 'Record Wood County production certification diagnostics'
          git push origin HEAD:main
