name: Patch cavern fallbacks into Explore sitemap

on:
  pull_request:
    paths:
      - '.github/workflows/patch-cavern-sitemap-fallbacks.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch sitemap and self-remove
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/routes/sitemap-explore[.]xml.ts';
          let source = fs.readFileSync(path, 'utf8');
          const importNeedle = '        const { preservedExploreDestinations } = await import("@/data/destination-preserved-catalog");\n';
          const importReplacement = importNeedle + '        const { publicCavernDestinationFallbacks } = await import("@/data/public-cavern-destinations");\n';
          if (!source.includes(importNeedle)) throw new Error('Could not find preserved catalog import');
          source = source.replace(importNeedle, importReplacement);
          const mergeNeedle = '        rawDestinations.push(...cityPassDestinationExpansion.filter((destination) => destination.slug && !resolvedSlugs.has(destination.slug)));\n';
          const mergeReplacement = mergeNeedle + '        const expandedSlugs = new Set(rawDestinations.map((destination) => destination.slug));\n        rawDestinations.push(...publicCavernDestinationFallbacks.filter((destination) => destination.slug && !expandedSlugs.has(destination.slug)));\n';
          if (!source.includes(mergeNeedle)) throw new Error('Could not find citypass expansion merge');
          source = source.replace(mergeNeedle, mergeReplacement);
          fs.writeFileSync(path, source);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/routes/sitemap-explore[.]xml.ts'
          git rm .github/workflows/patch-cavern-sitemap-fallbacks.yml
          git commit -m "Include public cavern fallbacks in Explore sitemap"
          git push origin HEAD:${{ github.head_ref }}
