name: Reconcile base event lifecycle with main

on:
  push:
    branches:
      - agent/gsc-base-event-lifecycle-20260913

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gsc-base-event-lifecycle-20260913
          fetch-depth: 0
      - name: Merge current main and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/reconcile-base-event-lifecycle.yml
          git commit -m "Remove temporary lifecycle reconciliation workflow"
          git push origin HEAD:agent/gsc-base-event-lifecycle-20260913
