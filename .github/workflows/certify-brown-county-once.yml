name: Certify Brown County production once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/certify-brown-county-once.yml'

permissions:
  contents: write

concurrency:
  group: certify-brown-county-once
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HERO_URL: https://commons.wikimedia.org/wiki/Special:Redirect/file/Brown_County_Courthouse_%281_of_1%29.jpg
      MARKER: .github/certification/brown-county.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Validate, deploy, verify, and record Brown County
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          record() {
            status="$1"; stage="$2"; target="$3"; detail="$4"
            mkdir -p "$(dirname "$MARKER")"
            python3 - "$MARKER" "$status" "$stage" "$target" "$detail" <<'PY'
          import json, pathlib, sys, datetime
          path, status, stage, target, detail = sys.argv[1:]
          pathlib.Path(path).write_text(json.dumps({
            'county':'brown','status':status,'stage':stage,'target_sha':target,
            'detail':detail[-12000:],'recorded_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }, indent=2)+'\n', encoding='utf-8')
          PY
            git add -- "$MARKER"
            git commit -m "Record Brown County production ${status}" >/dev/null || true
            git push origin HEAD:main
          }

          target="$(git rev-parse HEAD)"
          fixture='src/data/fixtures/brown-county-brownwood-pecan-bayou-lake-brownwood-camp-bowie-texas.ts'
          test -f "$fixture" || { record fail source "$target" 'Brown fixture missing'; exit 1; }
          grep -Fq 'countySlug: "brown"' src/data/county-series-profiles-rolling-plains.ts || { record fail source "$target" 'Brown profile registration missing'; exit 1; }
          if grep -n 'www\.texasdefined\.com' "$fixture" src/data/county-series-profiles-rolling-plains.ts >/tmp/brown-www.txt; then
            record fail canonical-host "$target" "$(cat /tmp/brown-www.txt)"; exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          hs="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$tmp/source-h" -o "$tmp/source-b" -w '%{http_code}' "$HERO_URL" || true)"
          hm="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$tmp/source-h" | cut -d';' -f1)"
          hb="$(wc -c < "$tmp/source-b" 2>/dev/null || echo 0)"
          if [ "$hs" != 200 ] || ! [[ "$hm" =~ ^image/(jpeg|png|webp)$ ]] || [ "$hb" -le 50000 ]; then
            record fail hero-source "$target" "HTTP=$hs MIME=$hm bytes=$hb"; exit 1
          fi

          if ! npm run validate >/tmp/brown-validate.log 2>&1; then
            record fail validation "$target" "$(tail -180 /tmp/brown-validate.log)"; exit 1
          fi

          git fetch origin main
          latest="$(git rev-parse origin/main)"
          [ "$latest" = "$target" ] || { record fail concurrency "$target" "main moved before deployment to $latest"; exit 1; }

          if ! npm run deploy >/tmp/brown-deploy.log 2>&1; then
            record fail deployment "$target" "$(tail -180 /tmp/brown-deploy.log)"; exit 1
          fi

          work="$(mktemp -d)"
          ok=0
          for attempt in $(seq 1 12); do
            ps="$(curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 -sS -o "$work/page" -w '%{http_code}' "https://texasdefined.com/county/brown?verify=${target}-${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$ps" = 200 ] \
              && grep -Fq 'Brown County: Brownwood, Pecan Bayou, Lake Brownwood and Camp Bowie' "$work/page" \
              && grep -Fq 'The county in numbers' "$work/page" \
              && grep -Fq 'County seat' "$work/page" \
              && grep -Fq 'County feature' "$work/page" \
              && grep -Fq 'https://texasdefined.com/county/brown' "$work/page"; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { record fail live-page "$target" "last_status=$ps"; exit 1; }

          legacy='https://texasdefined.com/article/brown-county-brownwood-pecan-bayou-lake-brownwood-camp-bowie-texas'
          ls="$(curl --max-redirs 0 -sS -D "$work/lh" -o /dev/null -w '%{http_code}' "$legacy" || true)"
          loc="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,""); sub(/^location:[[:space:]]*/,""); print; exit}' "$work/lh")"
          if [ "$ls" != 301 ] || ! [[ "$loc" == *'/county/brown'* ]]; then record fail legacy-redirect "$target" "HTTP=$ls location=$loc"; exit 1; fi

          his="$(curl -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS -D "$work/hh" -o "$work/hb" -w '%{http_code}' "$HERO_URL" || true)"
          him="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,""); sub(/^content-type:[[:space:]]*/,""); v=$0} END{print v}' "$work/hh" | cut -d';' -f1)"
          hib="$(wc -c < "$work/hb" 2>/dev/null || echo 0)"
          if [ "$his" != 200 ] || ! [[ "$him" =~ ^image/(jpeg|png|webp)$ ]] || [ "$hib" -le 50000 ]; then record fail live-hero "$target" "HTTP=$his MIME=$him bytes=$hib"; exit 1; fi

          record pass complete "$target" "validate=PASS deploy=PASS page=200 structured=yes editorial=yes legacy=301 location=$loc hero=$his mime=$him bytes=$hib"
