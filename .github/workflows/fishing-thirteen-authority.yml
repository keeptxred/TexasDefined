name: Fishing thirteen-page authority and TPWD source governance
on:
  pull_request:
    paths:
      - 'src/components/fishing/**'
      - 'src/data/fishing/**'
      - 'src/routes/fishing.**'
      - 'scripts/data/validate-fishing-species-depth.mjs'
      - 'scripts/data/validate-fishing-field-identification.mjs'
      - 'scripts/ci/check-fishing-species-tpwd-sources.mjs'
      - 'scripts/ci/validate-fishing-thirteen-authority.mjs'
      - '.github/workflows/fishing-thirteen-authority.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/fishing/**'
      - 'src/data/fishing/**'
      - 'src/routes/fishing.**'
      - 'scripts/ci/validate-fishing-thirteen-authority.mjs'
      - '.github/workflows/fishing-thirteen-authority.yml'
  schedule:
    - cron: '13 11 * * 1,4'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: fishing-thirteen-authority-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editorial-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all new machine-verifier syntax
        run: |
          node --check scripts/data/validate-fishing-field-identification.mjs
          node --check scripts/ci/check-fishing-species-tpwd-sources.mjs
          node --check scripts/ci/validate-fishing-thirteen-authority.mjs
          node --check scripts/ci/check-fishing-13-source-state.mjs
          node --check scripts/ci/verify-fishing-thirteen-production.mjs
          node --check scripts/ci/verify-fishing-thirteen-mobile.mjs
      - name: Validate the thirteen fishing authority pages
        run: node scripts/ci/validate-fishing-thirteen-authority.mjs
      - name: Existing fishing techniques validation
        run: node scripts/data/validate-fishing-techniques.mjs
      - name: Existing fishing species depth validation
        run: node scripts/data/validate-fishing-species-depth.mjs
      - name: Validate all 22 TPWD freshwater fish guides and image provenance
        run: node scripts/data/validate-fishing-field-identification.mjs
      - name: Existing fishing regulations validation
        run: node scripts/data/validate-fishing-regulations.mjs
  check-tpwd-official-sources:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: source_scope
        name: Require external TPWD recheck only when official-source claims change in PR
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD > /tmp/fishing-source-changes.txt
          if grep -Eq '^(src/data/fishing/|src/components/fishing/|src/routes/fishing\.(regulations|techniques|species)|scripts/ci/check-fishing-(13-source-state|species-tpwd-sources)\.mjs)' /tmp/fishing-source-changes.txt; then
            echo "review=true" >> "$GITHUB_OUTPUT"
            echo "Official-source-sensitive fishing changes require live TPWD validation"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "Loader/SSR-only PR: no official TPWD claim changed. Scheduled Mon/Thu source verification remains fail-closed."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: tpwd
        if: ${{ steps.source_scope.outputs.review == 'true' }}
        name: Confirm regulations, lake technique evidence and report state
        run: node scripts/ci/check-fishing-13-source-state.mjs
      - id: tpwd_species
        if: ${{ steps.source_scope.outputs.review == 'true' }}
        name: Check 22 species identities and supplemental TPWD evidence without changing source dates
        run: node scripts/ci/check-fishing-species-tpwd-sources.mjs
      - name: Open deduplicated official source investigation issue
        if: ${{ failure() && (steps.tpwd.conclusion == 'failure' || steps.tpwd_species.conclusion == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh issue list --repo "$GH_REPO" --state open --search 'Fishing authority official TPWD source review' --json number --jq 'length')"
          if [[ "$count" == "0" ]]; then
            gh issue create --repo "$GH_REPO" --title 'Fishing authority official TPWD source review required' \
              --body 'Scheduled source verification could not confirm one or more official TPWD regulations, reservoir technique examples, lake alerts, paused report availability signatures or the 22 TPWD freshwater fish fact sheets or supplemental evidence sources for all 28 published guides. Investigate the failed run, confirm the affected reservoir evidence, report publication state, active fishing rules and Lake Abilene closure against TPWD, update code and evidence only after factual verification, then rerun. Do not stamp unchanged source dates from a link-only check.'
          fi
