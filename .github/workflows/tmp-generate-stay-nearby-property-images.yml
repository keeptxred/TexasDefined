name: TEMP Generate exact Stay Nearby property images

on:
  push:
    branches:
      - fix/stay-nearby-exact-property-images
    paths:
      - '.github/workflows/tmp-generate-stay-nearby-property-images.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update exact-property source references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          generator = Path('scripts/media/generate-stay-nearby-property-images.mjs')
          text = generator.read_text()
          old = 'https://images.trvl-media.com/lodging/5000000/4800000/4790100/4790030/77313365.jpg?impolicy=resizecrop&ra=fill&rh=575&rw=575'
          new = 'https://www.hilton.com/im/en/FTWMDGI/21739421/ftwmdgi-fortworth-tx-hgi-exterior-day-1-.jpg?ch=2799&cw=5000&gravity=NorthWest&impolicy=crop&rh=430&rw=768&xposition=0&yposition=265'
          if old not in text:
              raise SystemExit('Expected Hilton Garden Inn reference URL not found')
          generator.write_text(text.replace(old, new))

          verifier = Path('scripts/ci/verify-stay-nearby-production.mjs')
          text = verifier.read_text()
          old = "'Homewood Suites by Hilton Fort Worth Medical Center, TX'"
          new = "'Homewood Suites by Hilton Fort Worth Medical Center'"
          if old not in text:
              raise SystemExit('Expected Homewood Suites canonical name not found')
          verifier.write_text(text.replace(old, new))
          PY
      - name: Generate exact-property raster imagery
        run: node scripts/media/generate-stay-nearby-property-images.mjs
      - name: Commit generated property imagery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public scripts/media/generate-stay-nearby-property-images.mjs scripts/ci/verify-stay-nearby-production.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Generate exact Stay Nearby property images"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload generated property imagery for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stay-nearby-exact-property-images
          if-no-files-found: warn
          retention-days: 2
          path: |
            public/stay-nearby-ai-property-images.json
            public/images/stay-nearby/properties/**
