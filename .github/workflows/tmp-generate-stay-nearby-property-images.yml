name: TEMP Generate exact Stay Nearby property images

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stay-nearby-exact-property-images-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate exact-property raster imagery
        run: node scripts/media/generate-stay-nearby-property-images.mjs
      - name: Upload generated property imagery for explicit review
        uses: actions/upload-artifact@v4
        with:
          name: stay-nearby-exact-property-images
          if-no-files-found: error
          retention-days: 2
          path: |
            public/stay-nearby-ai-property-images.json
            public/images/stay-nearby/properties/**
