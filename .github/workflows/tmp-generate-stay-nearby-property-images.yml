name: TEMP Generate exact Stay Nearby property images

on:
  push:
    branches:
      - fix/stay-nearby-exact-property-images
    paths:
      - '.github/workflows/tmp-generate-stay-nearby-property-images.yml'

permissions:
  contents: write

concurrency:
  group: stay-nearby-exact-property-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile exact-property source contracts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, before, after, label) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`${label}: expected source text not found in ${path}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceExact(
            'scripts/media/generate-stay-nearby-property-images.mjs',
            "https://images.trvl-media.com/lodging/5000000/4800000/4790100/4790030/77313365.jpg?impolicy=resizecrop&ra=fill&rh=575&rw=575",
            "https://www.hilton.com/im/en/FTWMDGI/21739421/ftwmdgi-fortworth-tx-hgi-exterior-day-1-.jpg?ch=2799&cw=5000&gravity=NorthWest&impolicy=crop&rh=430&rw=768&xposition=0&yposition=265",
            'Hilton Garden Inn exact-property reference',
          );

          replaceExact(
            'scripts/ci/verify-stay-nearby-production.mjs',
            "'Homewood Suites by Hilton Fort Worth Medical Center, TX'",
            "'Homewood Suites by Hilton Fort Worth Medical Center'",
            'canonical Fort Worth Homewood Suites name',
          );

          const validatorPath = 'scripts/data/validate-expedia-affiliate.mjs';
          const validator = fs.readFileSync(validatorPath, 'utf8');
          const oldLoop = `  for (const venue of pilots) {
            const matches = registry.properties.filter((property) =>
              (property.contexts ?? []).some((context) => context.kind === 'venue' && context.key === venue));
            if (matches.length !== 3) errors.push(\`${'${venue}'} is a redesigned venue guide and must have exactly 3 curated Stay Nearby choices; found ${'${matches.length}'}.\`);
            const ranks = matches
              .flatMap((property) => property.contexts.filter((context) => context.kind === 'venue' && context.key === venue))
              .map((context) => context.rank)
              .sort((a, b) => a - b);
            if (ranks.join(',') !== '1,2,3') errors.push(\`${'${venue}'} must have deterministic Stay Nearby relevance ranks 1,2,3.\`);
          }

          integratedProperties = registry.properties.filter((property) =>
            (property.contexts ?? []).some((context) => context.kind === 'venue' && pilots.has(context.key)));`;
          const newLoop = `  const curatedVenueKeys = new Set(registry.properties.flatMap((property) =>
            (property.contexts ?? [])
              .filter((context) => context.kind === 'venue')
              .map((context) => context.key)));

          for (const venue of curatedVenueKeys) {
            if (!pilots.has(venue)) errors.push(\`${'${venue}'} has curated Stay Nearby cards but is not a current redesigned venue guide.\`);
            const matches = registry.properties.filter((property) =>
              (property.contexts ?? []).some((context) => context.kind === 'venue' && context.key === venue));
            if (matches.length !== 3) errors.push(\`${'${venue}'} must have exactly 3 curated Stay Nearby choices when curated results are configured; found ${'${matches.length}'}.\`);
            const ranks = matches
              .flatMap((property) => property.contexts.filter((context) => context.kind === 'venue' && context.key === venue))
              .map((context) => context.rank)
              .sort((a, b) => a - b);
            if (ranks.join(',') !== '1,2,3') errors.push(\`${'${venue}'} must have deterministic Stay Nearby relevance ranks 1,2,3.\`);
          }

          integratedProperties = registry.properties.filter((property) =>
            (property.contexts ?? []).some((context) => context.kind === 'venue' && pilots.has(context.key)));`;
          if (!validator.includes(oldLoop)) throw new Error('curated Stay Nearby validator loop: expected source text not found');
          let next = validator.replace(oldLoop, newLoop);
          next = next.replace(
            `console.log(\`Expedia / Stay Nearby validation passed: approved tracking remains click-loaded, curated hotel selection remains evidence-backed and capped at three cards, ${'${pilots.size}'} redesigned venue guides are automatically image-gated, rights-cleared affiliate property photos remain preferred, every remaining hotel card has a unique first-party photorealistic exact-property AI raster grounded to an exact address and verified property source, generic hotel imagery and SVG fallbacks are prohibited, and future venue-guide additions fail closed until compliant property imagery exists.\`);`,
            `console.log(\`Expedia / Stay Nearby validation passed: approved tracking remains click-loaded, curated hotel selection remains evidence-backed and capped at three cards, ${'${integratedProperties.length}'} configured redesigned-guide hotel cards are image-gated, rights-cleared affiliate property photos remain preferred, every remaining configured hotel card has a unique first-party photorealistic exact-property AI raster grounded to an exact address and verified property source, and generic hotel imagery and SVG fallbacks are prohibited.\`);`,
          );
          fs.writeFileSync(validatorPath, next);
          NODE
      - name: Commit reconciled source contracts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/media/generate-stay-nearby-property-images.mjs scripts/data/validate-expedia-affiliate.mjs scripts/ci/verify-stay-nearby-production.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile exact-property image generation with current venue rollout"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Generate exact-property raster imagery
        run: node scripts/media/generate-stay-nearby-property-images.mjs
      - name: Validate generated Stay Nearby assets
        run: node scripts/data/validate-expedia-affiliate.mjs
      - name: Commit generated raster assets
        shell: bash
        run: |
          git add -A public
          if git diff --cached --quiet; then
            echo "No generated asset changes to commit."
            exit 0
          fi
          git commit -m "Generate exact Stay Nearby property images"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload generated property imagery for explicit review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stay-nearby-exact-property-images
          if-no-files-found: warn
          retention-days: 2
          path: |
            public/stay-nearby-ai-property-images.json
            public/images/stay-nearby/properties/**
