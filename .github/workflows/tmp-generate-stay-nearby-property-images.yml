name: TEMP Finalize Stay Nearby images

on:
  push:
    branches:
      - fix/stay-nearby-exact-property-images
    paths:
      - '.github/workflows/tmp-generate-stay-nearby-property-images.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: texasdefined-publication
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore complete generated image batch
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: keeptxred/TexasDefined
          run-id: 34660491097
          name: stay-nearby-exact-property-images
          path: public
      - name: Reconcile final source guards
        run: node scripts/media/finalize-stay-nearby-source.mjs
      - name: Regenerate W Dallas from verified exterior
        run: |
          rm -f public/images/stay-nearby/properties/w-dallas.png
          node scripts/media/generate-stay-nearby-property-images.mjs
      - name: Validate exact-property policy
        run: node scripts/data/validate-expedia-affiliate.mjs
      - name: Commit final assets and guards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public scripts/media/generate-stay-nearby-property-images.mjs scripts/ci/verify-stay-nearby-production.mjs scripts/data/validate-expedia-affiliate.mjs
          git commit -m "Finalize exact Stay Nearby property imagery"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload finalized images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stay-nearby-exact-property-images-final
          if-no-files-found: warn
          retention-days: 2
          path: |
            public/stay-nearby-ai-property-images.json
            public/images/stay-nearby/properties/**
