name: TEMP Generate exact Stay Nearby property images

on:
  push:
    branches:
      - fix/stay-nearby-exact-property-images
    paths:
      - '.github/workflows/tmp-generate-stay-nearby-property-images.yml'

permissions:
  contents: write
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: texasdefined-publication
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore reviewed partial exact-property images
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: keeptxred/TexasDefined
          run-id: 34660424666
          name: stay-nearby-exact-property-images
          path: public
      - name: Reconcile generator references and resume support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          generator = Path('scripts/media/generate-stay-nearby-property-images.mjs')
          text = generator.read_text()
          replacements = {
            'https://images.trvl-media.com/lodging/5000000/4800000/4790100/4790030/77313365.jpg?impolicy=resizecrop&ra=fill&rh=575&rw=575': 'https://www.hilton.com/im/en/FTWMDGI/21739421/ftwmdgi-fortworth-tx-hgi-exterior-day-1-.jpg?ch=2799&cw=5000&gravity=NorthWest&impolicy=crop&rh=430&rw=768&xposition=0&yposition=265',
            'https://images.trvl-media.com/lodging/7000000/6190000/6180300/6180205/0c207564.jpg?impolicy=resizecrop&ra=fill&rh=575&rw=575': 'https://www.hilton.com/im/en/FTWMCHW/7582292/homewood-fwmc-003-exterior-at-dusk.jpg?ch=2203&cw=5250&gravity=NorthWest&impolicy=crop&rh=806&rw=1920&xposition=0&yposition=648',
            'https://dallasnews.imgix.net/1548885550-hiltonanatole.jpg': 'https://assets.hiltonstatic.com/hilton-asset-cache/image/upload/c_fill%2Cw_1920%2Ch_1080%2Cq_70%2Cf_auto%2Cg_auto/Imagery/Property%20Photography/Hilton%20Full%20Service/D/DFWANHH/DFWAN_Anatole_Exterior%20NS_C2_10000x6500_SW%C2%A92015.jpg',
          }
          for old, new in replacements.items():
            text = text.replace(old, new)
          reference_map_marker = "const RESEARCHED_REFERENCE_IMAGE_BY_ID = Object.freeze({\n"
          if "RESEARCHED_REFERENCE_IMAGE_BY_ID = Object.freeze({\n  'hotel-mockingbird-dallas':" not in text:
            insert = "  'hotel-mockingbird-dallas': 'https://cache.marriott.com/is/image/marriotts7prod/tx-dalnb-hotel-exterior-30022%3AWide-Hor?fit=constrain&wid=1336',\n  'drury-plaza-dallas-arlington': 'https://cms.druryhotels.com/media/469312/188_exterior_03.jpg?anchor=center&height=844&mode=crop&rnd=133667410030000000&width=1318',\n"
            text = text.replace(reference_map_marker, reference_map_marker + insert, 1)
          fetch_marker = "async function fetchOfficialReference(sourceUrl, propertyId) {\n  const failures = [];\n"
          if 'Prefer manually verified exact-property references when available.' not in text:
            researched_first = "  // Prefer manually verified exact-property references when available.\n  const preferredResearchedImageUrl = RESEARCHED_REFERENCE_IMAGE_BY_ID[propertyId];\n  if (preferredResearchedImageUrl) {\n    try {\n      const reference = await downloadReferenceImage(preferredResearchedImageUrl, sourceUrl);\n      console.log(`Using manually verified exact-property visual reference for ${propertyId}.`);\n      return { ...reference, referenceSource: 'manually-verified-exact-property-reference' };\n    } catch (error) {\n      failures.push(`preferred researched ${preferredResearchedImageUrl} (${error instanceof Error ? error.message : String(error)})`);\n    }\n  }\n"
            text = text.replace(fetch_marker, fetch_marker + researched_first, 1)
          generate_marker = "async function generatePropertyImage(property) {\n  const address = ADDRESS_BY_ID[property.id];\n  const sourceUrl = officialSource(property);\n"
          if 'Reusing reviewed exact-property raster' not in text:
            reuse = "  const reuseSources = Object.freeze({ 'courtyard-fort-worth-university-drive': 'official-property-page', 'hilton-garden-inn-fort-worth-medical-center': 'manually-verified-exact-property-reference', 'homewood-suites-fort-worth-medical-center': 'manually-verified-exact-property-reference', 'graduate-dallas': 'manually-verified-exact-property-reference', 'the-highland-dallas': 'manually-verified-exact-property-reference', 'live-by-loews-arlington': 'official-property-page', 'loews-arlington-hotel': 'official-property-page' });\n  let priorItem = null;\n  if (fs.existsSync(MANIFEST_PATH)) {\n    try { priorItem = JSON.parse(fs.readFileSync(MANIFEST_PATH, 'utf8'))?.items?.find((item) => item.propertyId === property.id) || null; } catch {}\n  }\n  for (const extension of ['png', 'jpg', 'jpeg', 'webp']) {\n    const existingPath = path.join(OUTPUT_DIR, `${property.id}.${extension}`);\n    if (!fs.existsSync(existingPath)) continue;\n    const bytes = fs.readFileSync(existingPath);\n    if (bytes.length < 25_000) throw new Error(`Existing image for ${property.id} is unexpectedly small (${bytes.length} bytes).`);\n    const referenceSource = priorItem?.referenceImageSource || reuseSources[property.id];\n    if (!referenceSource) throw new Error(`Existing image for ${property.id} lacks preserved exact-property reference provenance.`);\n    console.log(`Reusing reviewed exact-property raster for ${property.id}.`);\n    return { address, sourceUrl, referenceImageUrl: 'reused-reviewed-raster', referenceSource, bytes, format: imageFormat(bytes) };\n  }\n"
            text = text.replace(generate_marker, generate_marker + reuse, 1)
          generator.write_text(text)
          verifier = Path('scripts/ci/verify-stay-nearby-production.mjs')
          vtext = verifier.read_text().replace("'Homewood Suites by Hilton Fort Worth Medical Center, TX'", "'Homewood Suites by Hilton Fort Worth Medical Center'")
          verifier.write_text(vtext)
          PY
          rm -f public/images/stay-nearby/properties/hotel-mockingbird-dallas.png
      - name: Generate remaining exact-property raster imagery
        run: node scripts/media/generate-stay-nearby-property-images.mjs
      - name: Commit generated property imagery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public scripts/media/generate-stay-nearby-property-images.mjs scripts/ci/verify-stay-nearby-production.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Generate exact Stay Nearby property images"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload generated property imagery for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stay-nearby-exact-property-images
          if-no-files-found: warn
          retention-days: 2
          path: |
            public/stay-nearby-ai-property-images.json
            public/images/stay-nearby/properties/**
