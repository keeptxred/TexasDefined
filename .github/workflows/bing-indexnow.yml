name: Bing IndexNow

on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Submit every canonical sitemap URL (use only for recovery/backfill)'
        required: false
        default: false
        type: boolean
      urls:
        description: 'Optional canonical URLs for explicit publish/update/delete/redirect notification (space or comma separated)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: texasdefined-publication
    timeout-minutes: 10
    env:
      PUBLIC_INDEXING_ENABLED: ${{ vars.PUBLIC_INDEXING_ENABLED }}
      INDEXNOW_STRICT: 'true'
      INDEXNOW_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full && 'true' || 'false' }}
      INDEXNOW_URLS: ${{ github.event_name == 'workflow_dispatch' && inputs.urls || '' }}
      INDEXNOW_FRESHNESS_HOURS: ${{ github.event_name == 'schedule' && '48' || '168' }}

    steps:
      - name: Check out TexasDefined
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Bing Webmaster meta tag is live
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 https://texasdefined.com/)"
          printf '%s' "$html" | grep -F '<meta name="msvalidate.01" content="74E5E79AEC351CF6D2577A6FC6A125DF" />'

      - name: Run guarded IndexNow submission
        run: node scripts/seo/submit-indexnow.mjs

      - name: Record indexing safeguard
        if: always()
        run: |
          {
            echo '## Bing / IndexNow'
            echo
            echo 'Scheduled runs submit only URLs with recent sitemap lastmod values.'
            echo 'Manual runs may submit explicit canonical URLs or request a guarded full recovery submission.'
            echo 'The submission script is a hard no-op unless PUBLIC_INDEXING_ENABLED=true.'
            echo 'Normal production deployment treats IndexNow transport failures as non-fatal; this dedicated diagnostic workflow runs in strict mode.'
          } >> "$GITHUB_STEP_SUMMARY"
