name: Bing IndexNow

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Submit every canonical URL instead of only recently changed URLs
        required: false
        type: boolean
        default: false
      urls:
        description: Optional clean canonical/former URLs for publish, delete, or redirect lifecycle notification
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: texasdefined-indexnow
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: texasdefined-publication
    timeout-minutes: 15
    env:
      PUBLIC_INDEXING_ENABLED: ${{ vars.PUBLIC_INDEXING_ENABLED }}
      INDEXNOW_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full && 'true' || 'false' }}
      INDEXNOW_URLS: ${{ github.event_name == 'workflow_dispatch' && inputs.urls || '' }}
      INDEXNOW_FRESHNESS_HOURS: ${{ github.event_name == 'schedule' && '3' || '2' }}

    steps:
      - name: Check out TexasDefined
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify Bing Webmaster meta tag is live
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 https://texasdefined.com/)"
          printf '%s' "$html" | grep -F '<meta name="msvalidate.01" content="74E5E79AEC351CF6D2577A6FC6A125DF" />'

      - name: Verify production crawler, canonical, sitemap and asset access
        run: node scripts/seo/verify-search-production.mjs

      - name: Notify IndexNow of canonical meaningful changes
        run: node scripts/seo/submit-indexnow.mjs

      - name: Record indexing safeguard
        if: always()
        run: |
          {
            echo '## Bing / IndexNow'
            echo
            echo 'Scheduled runs notify only sitemap URLs with recent lastmod values; cosmetic deployments are ignored.'
            echo 'Manual-only full refreshes and explicit publish/delete/redirect submissions remain gated behind workflow_dispatch.'
            echo 'Every submission path requires PUBLIC_INDEXING_ENABLED=true; otherwise no URLs are submitted.'
            echo 'Googlebot, Bingbot, Applebot, DuckDuckBot, OAI-SearchBot and anonymous crawler access is checked against production before notification.'
          } >> "$GITHUB_STEP_SUMMARY"
