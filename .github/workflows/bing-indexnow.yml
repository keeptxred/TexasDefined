name: Bing IndexNow

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bing-indexnow.yml'
      - 'public/0c2b08423ce5be707dd931f57239acf1.txt'
      - 'scripts/seo/submit-indexnow.mjs'
      - 'src/routes/sitemap[.]xml.ts'
      - 'src/routes/sitemap-explore[.]xml.ts'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: texasdefined-publication
    timeout-minutes: 15
    steps:
      - name: Check out TexasDefined
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TexasDefined
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Submit live URLs to IndexNow
        run: node scripts/seo/submit-indexnow.mjs
