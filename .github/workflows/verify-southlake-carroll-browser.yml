name: Verify Southlake Carroll football production browser
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/verify-southlake-carroll-browser.mjs'
      - '.github/workflows/verify-southlake-carroll-browser.yml'
      - 'src/routes/texas-high-school-football-teams_.$slug.lazy.tsx'
      - 'src/data/high-school-football/football-program-profile.server.ts'
      - 'src/routes/$kind.$slug.lazy.tsx'
      - 'public/expedia-travel.js'
      - 'public/stay-affiliate-options.js'
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football-authority-southlake-carroll-production
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare real Chrome browser without modifying app dependencies
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-wp-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Audit Southlake Carroll and Tarrant County on desktop and mobile Chrome
        run: node scripts/ci/verify-southlake-carroll-browser.mjs
      - name: Preserve screenshots and factual acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: southlake-carroll-browser-acceptance
          path: artifacts/southlake-carroll-qa/
          if-no-files-found: warn
          retention-days: 14
