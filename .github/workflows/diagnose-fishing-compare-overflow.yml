name: Diagnose fishing compare horizontal overflow (temporary)
on:
  pull_request:
    paths:
      - 'scripts/ci/diagnose-fishing-compare-overflow.mjs'
      - '.github/workflows/diagnose-fishing-compare-overflow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated read-only browser driver
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install --prefix /tmp/texasdefined-fishing-overflow-qa --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Identify exact outside-viewport DOM nodes on live compare page
        run: node scripts/ci/diagnose-fishing-compare-overflow.mjs
