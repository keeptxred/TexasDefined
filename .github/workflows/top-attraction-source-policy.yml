name: Top 25 authority source policy

on:
  push:
    branches: [main]
    paths:
      - 'src/data/top-attraction-authority-sources.ts'
      - 'scripts/data/validate-top-attraction-source-policy.mjs'
      - '.github/workflows/top-attraction-source-policy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/data/top-attraction-authority-sources.ts'
      - 'scripts/data/validate-top-attraction-source-policy.mjs'
      - '.github/workflows/top-attraction-source-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Top 25 authority source policy
        run: node scripts/data/validate-top-attraction-source-policy.mjs
