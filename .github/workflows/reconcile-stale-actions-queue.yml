name: Reconcile stale Actions queue

on:
  pull_request:
    paths:
      - "scripts/ci/reconcile-stale-actions-queue.mjs"
      - "scripts/ci/reconcile-stale-actions-queue.test.mjs"
      - ".github/workflows/reconcile-stale-actions-queue.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ci/reconcile-stale-actions-queue.mjs"
      - "scripts/ci/reconcile-stale-actions-queue.test.mjs"
      - ".github/workflows/reconcile-stale-actions-queue.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "Inspect only; do not cancel obsolete runs"
  workflow_run:
    workflows: ["Deploy TexasDefined production"]
    types: [completed]
  schedule:
    - cron: "13 */6 * * *"

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: texasdefined-stale-actions-reconciliation
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify protected queue-selection contract
        run: |
          node --check scripts/ci/reconcile-stale-actions-queue.mjs
          node --test scripts/ci/reconcile-stale-actions-queue.test.mjs

  reconcile:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify safety invariants before performing any cancellation
        run: node --test scripts/ci/reconcile-stale-actions-queue.test.mjs
      - name: Cancel only verified jobless superseded Actions runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            node scripts/ci/reconcile-stale-actions-queue.mjs --dry-run
          else
            node scripts/ci/reconcile-stale-actions-queue.mjs --cancel
          fi
      - name: Independently recover the McAllen two-viewport Chrome QA
        # The legacy run may be stuck before queue creation, so its recovery
        # must not depend on GitHub accepting cancellation or deletion.
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/mcallen-day-trips-visual-qa.yml/dispatches" -f ref=main
          echo "Fresh McAllen production Chrome acceptance dispatched."
      - name: Preserve machine-readable reconciliation results
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: actions-queue-recovery-${{ github.run_id }}
          path: artifacts/actions-queue-recovery/
          if-no-files-found: warn
          retention-days: 7

  restore-mcallen:
    # This scoped recovery runs only after the new reconciliation commit has
    # actually reached healthy production, not while an old release is live.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && contains(github.event.workflow_run.head_commit.message, 'Recover stalled, obsolete GitHub Actions queue')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch one fresh McAllen mobile and desktop Chrome run after successful production deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$DEPLOYED_SHA" != "$current_main" ]]; then
            echo "Superseded deployment; do not certify a stale source."
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/mcallen-day-trips-visual-qa.yml/dispatches" -f ref=main
          echo "Triggered McAllen exact-current-main two-viewport Chrome acceptance."
