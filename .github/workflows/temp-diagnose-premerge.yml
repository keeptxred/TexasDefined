name: TEMP Diagnose canonical premerge

on:
  push:
    branches:
      - fix/partner-referral-reporting-replay-20260917
    paths:
      - '.github/workflows/temp-diagnose-premerge.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: 01 retired integration traces
        id: c01
        continue-on-error: true
        run: node scripts/ci/validate-retired-integration-traces.mjs
      - name: 02 direct-main writer inventory
        id: c02
        continue-on-error: true
        run: node scripts/ci/validate-direct-main-writer-inventory.mjs
