name: TEMP Diagnose canonical premerge wrapper

on:
  push:
    branches:
      - fix/partner-referral-reporting-replay-20260917
    paths:
      - '.github/workflows/temp-diagnose-premerge.yml'

permissions:
  contents: read

jobs:
  diagnose-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run canonical wrapper and preserve its exit
        id: wrapper
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/ci/run-premerge-validation.mjs 2>&1 | tee /tmp/premerge-wrapper.log
      - name: Wrapper emitted no failed-check annotations
        if: always()
        run: |
          if grep -q '^::error title=.* failure::' /tmp/premerge-wrapper.log; then
            exit 1
          fi
      - name: Wrapper reported canonical pass text
        if: always()
        run: grep -q '^Canonical pre-merge validation passed' /tmp/premerge-wrapper.log
      - name: Wrapper exit was successful
        if: always()
        env:
          WRAPPER_OUTCOME: ${{ steps.wrapper.outcome }}
        run: test "$WRAPPER_OUTCOME" = success
