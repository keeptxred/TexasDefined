name: Verify Van Zandt dynamic production data

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/components/sports/HighSchoolFootballLookup.tsx'
      - 'src/components/property/CountyTaxRateSection.tsx'
      - 'scripts/ci/verify-van-zandt-live-data.mjs'
      - 'scripts/ci/van-zandt-html-contract.mjs'
      - 'scripts/ci/van-zandt-html-contract.test.mjs'
      - '.github/workflows/verify-van-zandt-live-data.yml'
  workflow_run:
    workflows:
      - Deploy TexasDefined production
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: van-zandt-dynamic-production-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out audited revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regress Van Zandt source dates, references and SEO structure
        run: node --test scripts/ci/van-zandt-html-contract.test.mjs
      - name: Verify current county tax and football API contracts
        env:
          PRODUCTION_ORIGIN: https://texasdefined.com
          VERIFY_LIVE_COUNTY_HTML: ${{ github.event_name == 'workflow_run' }}
        run: node scripts/ci/verify-van-zandt-live-data.mjs
