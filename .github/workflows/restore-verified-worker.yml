name: Restore verified TexasDefined Worker

on:
  # Only the change that introduces this guarded recovery invokes it on push.
  # Ordinary code changes do not trigger rollback; the original manual path remains.
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-verified-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  actions: read

concurrency:
  group: texasdefined-production
  cancel-in-progress: false

jobs:
  restore:
    # Keep the recovery push one-time; future updates to this approved workflow
    # cannot accidentally trigger another rollback.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[recover-worker-handoff-20261108]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve latest fully verified Worker
        id: verified_target
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/verified-worker-ledger.mjs resolve

      - name: Guard one-time Nov 8 recovery from exact failed release evidence
        id: recovery_guard
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LEDGER_VERSION: ${{ steps.verified_target.outputs.version_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Read the exact previous failed production job, not an unverified
          # version typed into this workflow or a speculative Cloudflare state.
          gh run view 42513686420 --job 128831959670 --log > artifacts/verified-restore-failed-run.log
          npx wrangler deployments status --json > artifacts/verified-restore-active-guard.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const log=fs.readFileSync('artifacts/verified-restore-failed-run.log','utf8');
          const state=JSON.parse(fs.readFileSync('artifacts/verified-restore-active-guard.json','utf8'));
          const id=/[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}/i;
          function exactlyOne(label) {
            const matches=[...log.matchAll(new RegExp(label+':\\s*('+id.source+')','gi'))];
            if(matches.length!==1)throw Error('Missing or ambiguous signed GitHub log proof: '+label);
            return matches[0][1];
          }
          const before=exactlyOne('Captured baseline Worker version');
          const deployed=exactlyOne('Captured post-deploy Worker version');
          const verified=process.env.LEDGER_VERSION;
          if(!id.test(verified)||before!==verified||before===deployed)
            throw Error('Current ledger target does not match the old successful Worker in failed run');
          if(!log.includes('MSR Houston browser visual and accessibility acceptance failed')
             ||!log.includes('Published texasdefined-production: failure'))
            throw Error('Failed-run evidence does not document the expected postdeploy mobile acceptance failure');
          if(!Array.isArray(state.versions)||state.versions.length!==1
              ||Number(state.versions[0].percentage)!==100)
            throw Error('Ambiguous live Worker deployment percentages');
          const active=state.versions[0].version_id;
          if(active!==deployed&&active!==verified)
            throw Error('Live Worker changed independently; no automatic restore is authorized: '+active);
          const restore=active===deployed;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'should_restore='+String(restore)+'\n');
          console.log('GitHub-ledger recovery guard: previous verified='+verified+
            ', failed deployed='+deployed+', currently serving='+active+
            ', rollback required='+restore);
          NODE

      - name: Capture current Worker runtime diagnostics
        id: restore_diagnostics
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts
          npx wrangler deployments status --json > artifacts/verified-restore-deployment-status.json 2> artifacts/verified-restore-deployment-status.stderr || true
          npx wrangler versions list --json > artifacts/verified-restore-versions.json 2> artifacts/verified-restore-versions.stderr || true
          timeout 25s npx wrangler tail texasdefined-site --format json --status error > artifacts/verified-restore-worker-tail.jsonl 2> artifacts/verified-restore-worker-tail.stderr &
          TAIL_PID=$!
          sleep 4
          curl -sS --max-time 15 -D artifacts/verified-restore-direct.headers -o artifacts/verified-restore-direct.html "https://texasdefined-site.freddy-coppola.workers.dev/?restore_probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
          curl -sS --max-time 15 -D artifacts/verified-restore-canonical.headers -o artifacts/verified-restore-canonical.html "https://texasdefined.com/?restore_probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
          wait "${TAIL_PID}" || true

      - name: Upload current Worker runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-worker-restore-${{ github.run_id }}
          path: artifacts/verified-restore-*
          if-no-files-found: error
          retention-days: 14

      - name: Restore latest fully verified Worker version
        if: github.event_name == 'workflow_dispatch' || steps.recovery_guard.outputs.should_restore == 'true'
        shell: bash
        run: |
          npx wrangler rollback "${{ steps.verified_target.outputs.version_id }}" --message "Manual recovery: restore latest fully verified TexasDefined Worker"

      - name: Verify restored direct Worker
        env:
          PRODUCTION_HEALTH_ORIGIN: https://texasdefined-site.freddy-coppola.workers.dev
          PRODUCTION_HEALTH_LABEL: verified-restored-direct-worker
        run: node scripts/ci/verify-production-health.mjs

      - name: Verify restored canonical domain
        env:
          PRODUCTION_HEALTH_ORIGIN: https://texasdefined.com
          PRODUCTION_HEALTH_LABEL: verified-restored-canonical-domain
        run: node scripts/ci/verify-production-health.mjs

      - name: Verify restored production surfaces
        run: node scripts/ci/verify-production-surfaces.mjs

      - name: Confirm 100-percent active Worker equals verified recovery target
        if: success()
        shell: bash
        env:
          VERIFIED_TARGET_VERSION: ${{ steps.verified_target.outputs.version_id }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --json > artifacts/verified-restore-final-deployment.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const state=JSON.parse(fs.readFileSync('artifacts/verified-restore-final-deployment.json','utf8'));
          const versions=state.versions;
          if (!Array.isArray(versions) || versions.length !== 1 ||
              Number(versions[0].percentage) !== 100 ||
              versions[0].version_id !== process.env.VERIFIED_TARGET_VERSION) {
            throw Error('Rollback did not restore the exact verified Worker at 100% traffic');
          }
          console.log('Verified Worker restored at 100%:', process.env.VERIFIED_TARGET_VERSION);
          NODE
