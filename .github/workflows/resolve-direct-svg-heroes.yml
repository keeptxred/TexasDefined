name: Resolve direct SVG hero images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/data/resolve-direct-svg-heroes.mjs"
      - "scripts/data/normalize-direct-hero-jpeg-dimensions.mjs"
      - ".github/workflows/resolve-direct-svg-heroes.yml"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: resolve-direct-svg-heroes
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ensure JPEG conversion support
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi

      - name: Replace direct SVG heroes with reusable or AI JPEGs
        run: node scripts/data/resolve-direct-svg-heroes.mjs

      - name: Match replacement JPEGs to declared hero dimensions
        run: node scripts/data/normalize-direct-hero-jpeg-dimensions.mjs

      - name: Detect hero remediation changes
        id: changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- src public/images scripts/data/direct-svg-hero-report.json)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No direct SVG hero changes to preserve."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Direct SVG hero changes detected."
          fi

      - name: Create SVG hero remediation branch
        if: steps.changes.outputs.changed == 'true'
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/direct-svg-hero-remediation-${GITHUB_RUN_ID}"
          git config user.name "Texas Defined Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add src public/images scripts/data/direct-svg-hero-report.json
          git commit -m "fix: replace direct SVG hero images"
          git push origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Open reviewable SVG hero remediation pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'Replace direct SVG hero images with governed raster heroes' \
            --body $'Sitewide direct-SVG hero remediation. For each hero, automation prefers an exact/relevant commercially reusable JPEG and falls back to a subject-specific photorealistic AI JPEG when no compliant reusable image is found. Replacements are normalized to each page’s declared hero dimensions. No procedural placeholder or SVG fallback is accepted. Review scripts/data/direct-svg-hero-report.json for source and generation provenance.'

      - name: Run official validation on generated branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: bash scripts/ci/dispatch-validate-branch.sh "$BRANCH"
