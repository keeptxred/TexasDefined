name: Verify Painted Churches production once

on:
  pull_request:
    paths:
      - '.github/verification/painted-churches-pr148.txt'
      - '.github/workflows/verify-painted-churches-production-once.yml'

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: texasdefined-publication
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate complete Painted Churches authority contract
        run: |
          node scripts/data/validate-painted-churches-seo.mjs
          node scripts/data/validate-painted-church-search-intents.mjs
          node scripts/data/validate-painted-church-map.mjs
          node scripts/data/validate-painted-church-completion.mjs
      - name: Build production bundle
        run: npm run build
      - name: Enforce existing client bundle budget
        run: npm run performance:validate
      - name: Deploy TexasDefined Worker
        run: npx wrangler deploy
      - name: Verify current Painted Churches production routes
        shell: bash
        run: |
          set -euo pipefail
          origin='https://texasdefined.com'
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          fetch_assert() {
            local label="$1" path="$2" needle="$3"
            local out="$workdir/${label}.html"
            local headers="$workdir/${label}.headers"
            local attempt
            for attempt in 1 2 3 4 5 6; do
              echo "[$label] fetch attempt $attempt: ${origin}${path}"
              if curl --fail-with-body --silent --show-error --location --max-time 30 \
                -D "$headers" \
                -w "[$label] http=%{http_code} final=%{url_effective} bytes=%{size_download}\n" \
                "${origin}${path}?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" -o "$out"; then
                grep -Ei '^(HTTP/|content-type:|cache-control:|cf-cache-status:|location:)' "$headers" || true
                if grep -Fq "$needle" "$out"; then
                  echo "[$label] CONTENT_OK: $needle"
                  return 0
                fi
                echo "[$label] CONTENT_ASSERTION_FAILED: $needle"
              fi
              sleep 5
            done
            echo "[$label] production verification failed" >&2
            head -c 1200 "$out" 2>/dev/null || true
            echo >&2
            return 1
          }

          fetch_assert hub '/explore/painted-churches' 'Painted Churches of Texas'
          fetch_assert map '/explore/painted-churches/map' 'Texas Painted Churches Map'
          fetch_assert then-now '/explore/painted-churches/then-and-now' 'Texas Painted Churches, then and now.'
          fetch_assert media '/explore/painted-churches/media' 'Watch the documentary. Follow the voices behind it.'
          fetch_assert guides '/guides' 'Painted Churches of Texas'

          sitemap="$workdir/sitemap.xml"
          curl --fail-with-body --silent --show-error --location --max-time 30 \
            "${origin}/sitemap-explore.xml?verify=${GITHUB_SHA}-${GITHUB_RUN_ID}" -o "$sitemap"
          grep -Fq '/explore/painted-churches/then-and-now' "$sitemap"
          grep -Fq '/explore/painted-churches/media' "$sitemap"
          grep -Fq '/explore/painted-churches/cite' "$sitemap"

          echo 'Current Painted Churches hub, map, archival, media, Guidebook and sitemap surfaces are live in production.'
