name: Search distribution gate

on:
  pull_request:
    paths:
      - 'public/robots.txt'
      - 'public/*.txt'
      - 'scripts/seo/**'
      - 'scripts/data/validate-search-distribution.mjs'
      - '.github/workflows/bing-indexnow.yml'
      - '.github/workflows/search-distribution-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate universal search distribution contracts
        run: node scripts/data/validate-search-distribution.mjs
