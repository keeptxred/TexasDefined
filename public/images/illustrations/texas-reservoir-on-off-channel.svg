<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc"><title id="title">On-channel and off-channel reservoirs</title><desc id="desc">Two schematic diagrams: a dam forms a lake in a river valley, while a separate off-channel storage basin receives diverted water from a river.</desc><rect width="1400" height="660" fill="#f7f5ed"/><text x="700" y="56" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#243640">Two ways Texas stores surface water</text><text x="700" y="93" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#425766">Simplified diagrams · not to scale</text><rect x="42" y="128" width="635" height="460" rx="18" fill="#fff" stroke="#b4c3c3" stroke-width="3"/><rect x="723" y="128" width="635" height="460" rx="18" fill="#fff" stroke="#b4c3c3" stroke-width="3"/><text x="70" y="179" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#243640">On-channel reservoir</text><text x="751" y="179" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#243640">Off-channel reservoir</text><path d="M65 350 Q160 310 250 345 T475 350 L545 350" stroke="#397b9f" stroke-width="50" fill="none" stroke-linecap="round"/><path d="M65 350 Q160 310 250 345 T475 350 L545 350" stroke="#9bd9e9" stroke-width="29" fill="none" stroke-linecap="round"/><path d="M510 283 L540 395" stroke="#b17044" stroke-width="29" stroke-linecap="round"/><path d="M541 350 Q584 360 641 346" stroke="#397b9f" stroke-width="17" fill="none"/><text x="188" y="272" font-family="Arial,sans-serif" font-size="23" fill="#243640">River valley fills</text><path d="M255 281 L255 318" stroke="#425766" stroke-width="3"/><text x="505" y="447" font-family="Arial,sans-serif" font-size="23" text-anchor="middle" fill="#243640">Dam</text><path d="M520 418 L526 395" stroke="#425766" stroke-width="3"/><text x="70" y="543" font-family="Arial,sans-serif" font-size="19" fill="#425766">Example: Lake Travis</text><path d="M749 396 Q895 365 1010 396 T1315 395" stroke="#397b9f" stroke-width="35" fill="none" stroke-linecap="round"/><path d="M830 377 Q880 280 987 275" fill="none" stroke="#b17044" stroke-width="9" stroke-dasharray="18 10"/><path d="M1005 230 Q1118 206 1222 242 L1253 317 Q1118 355 1005 300 Z" fill="#8dc8dd" stroke="#397b9f" stroke-width="5"/><text x="1114" y="263" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#243640">Storage basin</text><text x="788" y="336" font-family="Arial,sans-serif" font-size="22" fill="#243640">River</text><text x="840" y="221" font-family="Arial,sans-serif" font-size="21" fill="#955229">Diversion / pump</text><text x="750" y="543" font-family="Arial,sans-serif" font-size="19" fill="#425766">Stored water can be away from the river channel</text><text x="700" y="630" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#425766">TexasDefined original explanatory illustration</text></svg>