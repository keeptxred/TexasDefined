<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc"><title id="title">Conservation and flood-control storage in a multipurpose reservoir</title><desc id="desc">Schematic side view showing a reservoir behind a dam, water normally stored in the conservation pool, and optional higher flood-control space.</desc><rect width="1400" height="660" fill="#f7f5ed"/><text x="700" y="58" font-family="Arial,sans-serif" font-size="37" font-weight="700" text-anchor="middle" fill="#243640">What “full” means at a reservoir</text><text x="700" y="95" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#425766">Schematic multipurpose reservoir · operations vary by lake</text><path d="M100 525 Q380 520 560 585 L1040 585 L1040 302 L1240 540 L1310 570 L1310 615 L100 615 Z" fill="#e5cdab" stroke="#a28662" stroke-width="3"/><path d="M100 444 L1000 444 L1000 560 Q600 588 365 535 Q250 500 100 525 Z" fill="#76b6d2"/><path d="M100 330 L1000 330 L1000 444 L100 444 Z" fill="#c1e3e8" opacity=".95"/><rect x="995" y="270" width="45" height="316" rx="5" fill="#8b7867" stroke="#554c48" stroke-width="4"/><path d="M1040 539 L1215 539" stroke="#397b9f" stroke-width="14"/><path d="M1250 530 l40 9 -40 9" fill="#397b9f"/><text x="1140" y="260" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#243640">Dam</text><path d="M1110 269 L1033 294" stroke="#425766" stroke-width="4"/><text x="500" y="392" font-family="Arial,sans-serif" font-size="33" font-weight="700" text-anchor="middle" fill="#243640">Flood-control space</text><text x="500" y="481" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#14394d">Conservation storage</text><path d="M100 330 L985 330" stroke="#698b9d" stroke-width="5" stroke-dasharray="15 9"/><text x="105" y="301" font-family="Arial,sans-serif" font-size="23" fill="#243640">Higher flood-pool level (when applicable)</text><path d="M100 444 L985 444" stroke="#1b6585" stroke-width="5"/><text x="1120" y="450" font-family="Arial,sans-serif" font-size="21" fill="#243640">Top of</text><text x="1120" y="476" font-family="Arial,sans-serif" font-size="21" fill="#243640">conservation</text><text x="1120" y="502" font-family="Arial,sans-serif" font-size="21" fill="#243640">pool</text><text x="700" y="641" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#425766">Conceptual drawing; not every reservoir has a designated flood-control pool · TexasDefined</text></svg>