<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Children's Health Stadium at PISD parking orientation diagram</title><desc id="desc">TexasDefined schematic showing Children's Health Stadium with west and east parking areas, south event parking, Stadium Drive and the current event access orientation. Not to scale; assignments vary by event.</desc><rect width="1200" height="800" fill="#f7f4ed"/><rect x="95" y="70" width="1010" height="650" rx="28" fill="#eee9df" stroke="#34312d" stroke-width="7"/><g stroke="#34312d" stroke-width="11" fill="none"><path d="M120 115 H1080"/><path d="M135 685 H1065"/><path d="M180 95 V705"/><path d="M1020 95 V705"/></g><g font-family="Arial,sans-serif" fill="#34312d" font-size="19" font-weight="700"><text x="600" y="105" text-anchor="middle">NORTH EVENT CIRCULATION</text><text x="600" y="710" text-anchor="middle">STADIUM DRIVE / EVENT ACCESS</text></g><rect x="435" y="175" width="330" height="390" rx="115" fill="#d8d2c4" stroke="#34312d" stroke-width="7"/><rect x="510" y="220" width="180" height="300" rx="22" fill="#dfe8d5" stroke="#725b3b" stroke-width="4"/><g font-family="Arial,sans-serif" fill="#34312d" text-anchor="middle"><text x="600" y="350" font-size="29" font-weight="700">CHILDREN'S HEALTH</text><text x="600" y="387" font-size="29" font-weight="700">STADIUM</text><text x="600" y="420" font-size="17">Prosper ISD</text></g><g fill="#e8dcc6" stroke="#725b3b" stroke-width="4"><rect x="205" y="185" width="190" height="360" rx="18"/><rect x="805" y="185" width="190" height="360" rx="18"/><rect x="420" y="590" width="360" height="70" rx="16"/></g><g font-family="Arial,sans-serif" fill="#34312d" text-anchor="middle"><text x="300" y="340" font-size="25" font-weight="700">WEST</text><text x="300" y="372" font-size="22">PARKING AREA</text><text x="900" y="340" font-size="25" font-weight="700">EAST</text><text x="900" y="372" font-size="22">PARKING AREA</text><text x="600" y="621" font-size="22" font-weight="700">SOUTH EVENT / BAND PARKING</text><text x="600" y="648" font-size="15">Assignments vary by event</text></g><g stroke="#725b3b" stroke-width="5" fill="none"><path d="M185 665 C150 635 150 575 205 540"/><path d="M1015 665 C1050 635 1050 575 995 540"/><path d="M180 160 C245 135 320 135 390 180"/><path d="M1020 160 C955 135 880 135 810 180"/></g><g font-family="Arial,sans-serif" fill="#5b544b" font-size="15" text-anchor="middle"><text x="600" y="755">Use the current Prosper ISD Stadium Maps and event-day signs for home/visitor, bus, band, ADA and special-event assignments.</text></g><g transform="translate(1060 105)" font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d"><path d="M0 52V0L-13 21M0 0L13 21" fill="none" stroke="#34312d" stroke-width="6"/><text y="78" font-size="20" font-weight="700">N</text></g><text x="35" y="790" font-family="Arial,sans-serif" fill="#5b544b" font-size="14">TexasDefined original orientation diagram · verified 2026-09-11 against Prosper ISD Stadium Maps and 2026 event logistics</text></svg>