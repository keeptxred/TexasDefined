<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Retama Park parking orientation diagram</title><desc id="desc">TexasDefined schematic showing Retama Park, general parking, VIP parking and Retama Parkway access. Not to scale.</desc><rect width="1200" height="800" fill="#f7f4ed"/><path d="M105 650 H1095" stroke="#34312d" stroke-width="14"/><path d="M220 95 V705" stroke="#34312d" stroke-width="13"/><g font-family="Arial,sans-serif" fill="#34312d" font-size="20" font-weight="700"><text x="505" y="688">RETAMA PARKWAY / I-35 FRONTAGE ACCESS</text><text x="185" y="425" transform="rotate(-90 185 425)">RETAMA / WEST APPROACH</text></g><ellipse cx="780" cy="340" rx="210" ry="145" fill="#d8d2c4" stroke="#34312d" stroke-width="7"/><ellipse cx="780" cy="340" rx="130" ry="80" fill="#f7f4ed" stroke="#8c877f" stroke-width="4"/><rect x="610" y="470" width="210" height="90" rx="18" fill="#c8c2b7" stroke="#34312d" stroke-width="5"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24211e"><text x="780" y="345" font-size="39" font-weight="700">RETAMA PARK</text><text x="715" y="525" font-size="22" font-weight="700">GRANDSTAND</text></g><rect x="290" y="230" width="270" height="300" rx="18" fill="#e8dcc6" stroke="#725b3b" stroke-width="5"/><rect x="420" y="550" width="185" height="80" rx="14" fill="#e8dcc6" stroke="#725b3b" stroke-width="4"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d" font-weight="700"><text x="425" y="365" font-size="36">GENERAL PARKING</text><text x="425" y="405" font-size="18">FREE · LIVE RACING / SIMULCAST</text><text x="512" y="597" font-size="27">VIP LOT</text></g><text x="605" y="590" font-family="Arial,sans-serif" fill="#5b544b" font-size="15">Simulcast guests: VIP lot is on the right when facing the building; enter via valet gate.</text><g transform="translate(1090 85)" font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d"><path d="M0 52V0