<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Extraco Events Center parking orientation diagram</title><desc id="desc">TexasDefined schematic of Extraco Events Center showing principal public parking, Show Pavilion parking and Lake Air Drive gates. Not to scale.</desc><rect width="1200" height="800" fill="#f7f4ed"/><rect x="130" y="90" width="940" height="620" rx="18" fill="#eee9df" stroke="#34312d" stroke-width="7"/><g stroke="#34312d" stroke-width="12" fill="none"><path d="M130 135 H1070"/><path d="M130 315 H1070"/><path d="M130 690 H1070"/><path d="M1045 90 V710"/><path d="M155 90 V710"/></g><g font-family="Arial,sans-serif" fill="#34312d" font-size="19" font-weight="700"><text x="600" y="120" text-anchor="middle">N 42ND STREET</text><text x="600" y="300" text-anchor="middle">N 44TH STREET</text><text x="600" y="742" text-anchor="middle">LAKE AIR DRIVE · PARKING GATES 2–5</text><text x="1080" y="430" transform="rotate(-90 1080 430)">COLORADO AVENUE / EAST EDGE</text><text x="118" y="430" transform="rotate(-90 118 430)">BOSQUE BOULEVARD / WEST EDGE</text></g><rect x="290" y="145" width="245" height="125" rx="20" fill="#d8d2c4" stroke="#34312d" stroke-width="5"/><text x="412" y="200" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">EXTRACO</text><text x="412" y="232" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">COLISEUM</text><rect x="705" y="405" width="250" height="150" rx="20" fill="#d8d2c4" stroke="#34312d" stroke-width="5"/><text x="830" y="472" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">SHOW</text><text x="830" y="505" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">PAVILION</text><rect x="720" y="565" width="160" height="90" rx="16" fill="#d8d2c4" stroke="#34312d" stroke-width="4"/><text x="800" y="615" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">STALL BARN</text><g fill="#e8dcc6" stroke="#725b3b" stroke-width="4"><rect x="230" y="360" width="400" height="280" rx="16"/><rect x="660" y="345" width="330" height="55" rx="10"/><rect x="895" y="565" width="95" height="90" rx="10"/></g><g font-family="Arial,sans-serif" fill="#34312d" text-anchor="middle"><text x="430" y="465" font-size="27" font-weight="700">PUBLIC PARKING</text><text x="430" y="500" font-size="17">large south-campus field</text><text x="825" y="378" font-size="18" font-weight="700">SHOW PAVILION PARKING</text><text x="942" y="605" font-size="15" font-weight="700">EVENT /</text><text x="942" y="626" font-size="15" font-weight="700">VENDOR</text></g><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="270" cy="682" r="27" fill="#e7cb5d" stroke="#34312d" stroke-width="3"/><text x="270" y="688" font-size="18" font-weight="700">5</text><circle cx="480" cy="682" r="27" fill="#e7cb5d" stroke="#34312d" stroke-width="3"/><text x="480" y="688" font-size="18" font-weight="700">4</text><circle cx="705" cy="682" r="27" fill="#e7cb5d" stroke="#34312d" stroke-width="3"/><text x="705" y="688" font-size="18" font-weight="700">3</text><circle cx="965" cy="682" r="27" fill="#e7cb5d" stroke="#34312d" stroke-width="3"/><text x="965" y="688" font-size="18" font-weight="700">2</text></g><text x="260" y="665" font-family="Arial,sans-serif" font-size="15" fill="#5b544b">Parking gates</text><g transform="translate(1000 140)" font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d"><path d="M0 52V0L-13 21M0 0L13 21" fill="none" stroke="#34312d" stroke-width="6"/><text y="78" font-size="20" font-weight="700">N</text></g><text x="40" y="782" font-family="Arial,sans-serif" fill="#5b544b" font-size="15">TexasDefined original orientation diagram · verified 2026-09-11 against Extraco Events Center official parking map · schematic only; event controls can vary</text></svg>