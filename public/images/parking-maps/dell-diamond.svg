<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Dell Diamond parking orientation diagram</title><desc id="desc">TexasDefined schematic showing Dell Diamond and its Northwest, West, East, Southwest and suite parking areas. Not to scale.</desc><rect width="1200" height="800" fill="#f7f4ed"/><path d="M95 650 H1105" stroke="#34312d" stroke-width="14"/><text x="500" y="688" font-family="Arial,sans-serif" fill="#34312d" font-size="21" font-weight="700">E PALM VALLEY BLVD / HIGHWAY 79</text><path d="M925 95 V700" stroke="#34312d" stroke-width="13"/><text x="960" y="430" transform="rotate(-90 960 430)" font-family="Arial,sans-serif" fill="#34312d" font-size="20" font-weight="700">HURRELL / EAST ACCESS</text><path d="M470 300 Q610 215 750 300 L750 505 Q610 590 470 505 Z" fill="#d8d2c4" stroke="#34312d" stroke-width="7"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24211e"><text x="610" y="385" font-size="43" font-weight="700">DELL DIAMOND</text><text x="610" y="428" font-size="18">3400 E PALM VALLEY BLVD</text></g><g fill="#e8dcc6" stroke="#725b3b" stroke-width="5"><rect x="245" y="175" width="205" height="115" rx="14"/><rect x="210" y="325" width="220" height="190" rx="14"/><rect x="790" y="240" width="185" height="250" rx="14"/><rect x="275" y="550" width="260" height="80" rx="14"/><rect x="580" y="550" width="210" height="80" rx="14"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d" font-weight="700"><text x="347" y="230" font-size="25">NORTHWEST LOT</text><text x="320" y="420" font-size="34">WEST LOT</text><text x="882" y="365" font-size="34">EAST LOT</text><text x="405" y="598" font-size="25">SOUTHWEST / BUS</text><text x="685" y="598" font-size="24">SUITE HANG TAG</text></g><text x="465" y="270" font-family="Arial,sans-serif" fill="#5b544b" font-size="15">All surrounding lots include accessible spaces.</text><g transform="translate(1090 85)" font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d"><path d="M0 52V0L-13 21M0 0L13 21" fill="none" stroke="#34312d" stroke-width="6"/><text y="78" font-size="20" font-weight="700">N</text></g><text x="42" y="772" font-family="Arial,sans-serif" fill="#5b544b" font-size="15">TexasDefined original orientation diagram · verified 2026-09-11 against the Round Rock Express official Dell Diamond parking plan · rates vary by event</text></svg>