<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Whataburger Field parking orientation diagram</title><desc id="desc">TexasDefined schematic showing Whataburger Field, the South and West parking lots, accessible parking in both lots and major SEA District approaches. Not to scale.</desc><rect width="1200" height="800" fill="#f7f4ed"/><path d="M110 650 H1090" stroke="#34312d" stroke-width="14"/><path d="M225 100 V700" stroke="#34312d" stroke-width="12"/><g font-family="Arial,sans-serif" fill="#34312d" font-size="20" font-weight="700"><text x="485" y="690">PORT AVENUE / SEA DISTRICT ACCESS</text><text x="180" y="430" transform="rotate(-90 180 430)">HARBOR DRIVE / DOWNTOWN</text></g><path d="M845 120 C900 280 910 510 845 690" fill="none" stroke="#7aa0b8" stroke-width="34"/><text x="900" y="420" transform="rotate(-83 900 420)" font-family="Arial,sans-serif" fill="#34312d" font-size="18" font-weight="700">SHIP CHANNEL / HARBOR</text><rect x="500" y="285" width="300" height="220" rx="54" fill="#d8d2c4" stroke="#34312d" stroke-width="7"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24211e"><text x="650" y="385" font-size="39" font-weight="700">WHATABURGER</text><text x="650" y="430" font-size="39" font-weight="700">FIELD</text></g><g fill="#e8dcc6" stroke="#725b3b" stroke-width="4"><rect x="300" y="220" width="190" height="300" rx="14"/><rect x="490" y="535" width="330" height="100" rx="14"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d" font-weight="700"><text x="395" y="350" font-size="34">WEST LOT</text><text x="395" y="382" font-size="17">PARKING-PASS GUESTS</text><text x="655" y="582" font-size="34">SOUTH LOT</text><text x="655" y="610" font-size="17">GENERAL GAME PARKING</text></g><g font-family="Arial,sans-serif" fill="#5b544b" font-size="16"><text x="322" y="485">ADA available</text><text x="690" y="525">ADA available in both lots</text></g><text x="4