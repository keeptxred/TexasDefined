<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Round Rock Multipurpose Complex parking orientation diagram</title><desc id="desc">TexasDefined schematic showing the current 10-field Round Rock Multipurpose Complex, North Parking Lots, South Parking Lot, clubhouse and major surrounding roads. Not to scale.</desc><rect width="1200" height="800" fill="#f7f4ed"/><path d="M100 110 H1100" stroke="#34312d" stroke-width="14"/><path d="M100 690 H1100" stroke="#34312d" stroke-width="14"/><path d="M180 90 V710" stroke="#34312d" stroke-width="12"/><g font-family="Arial,sans-serif" fill="#34312d" font-size="19" font-weight="700"><text x="490" y="80">E OLD SETTLERS BOULEVARD</text><text x="470" y="735">SPORTS CAPITAL CROSSING</text><text x="135" y="440" transform="rotate(-90 135 440)">N KENNEY FORT BOULEVARD</text></g><g fill="#d8d2c4" stroke="#34312d" stroke-width="4"><rect x="535" y="210" width="170" height="90" rx="14"/><rect x="300" y="315" width="150" height="105" rx="12"/><rect x="470" y="315" width="150" height="105" rx="12"/><rect x="640" y="315" width="150" height="105" rx="12"/><rect x="810" y="315" width="150" height="105" rx="12"/><rect x="300" y="445" width="150" height="105" rx="12"/><rect x="470" y="445" width="150" height="105" rx="12"/><rect x="640" y="445" width="150" height="105" rx="12"/><rect x="810" y="445" width="150" height="105" rx="12"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d" font-weight="700"><text x="620" y="250" font-size="20">CLUBHOUSE</text><text x="375" y="375" font-size="22">FIELDS 3/4</text><text x="545" y="375" font-size="22">FIELDS 5/6</text><text x="715" y="375" font-size="22">FIELDS 7/8</text><text x="885" y="375" font-size="22">FIELDS 9/10</text><text x="375" y="505" font-size="20">CHAMP. FIELD 2</text><text x="885" y="505" font-size="20">CHAMP. FIELD 1</text></g><g fill="#e8dcc6" stroke="#725b3b" stroke-width="4"><rect x="260" y="135"