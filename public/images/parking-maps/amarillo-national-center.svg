L / RV ROWS</text><text x="912" y="215" font-size="16">north / northeast grounds</text><text x="407" y="190" font-size="21" font-weight="700">RV / EVENT PARKING</text><text x="407" y="219" font-size="16">west-northwest rows</text><text x="417" y="335" font-size="21" font-weight="700">PARKING FIELD</text><text x="417" y="365" font-size="15">event use varies</text><text x="910" y="323" font-size="20" font-weight="700">ARENA / LIVESTOCK</text><text x="910" y="351" font-size="15">check event routing</text></g><rect x="800" y="405" width="215" height="115" rx="16" fill="#d8d2c4" stroke="#34312d" stroke-width="4"/><text x="907" y="454" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">TOMMY GRANT ARENA</text><text x="907" y="482" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">+ livestock center</text><rect x="480" y="545" width="200" height="110" rx="16" fill="#d8d2c4" stroke="#34312d" stroke-width="4"/><text x="580" y="592" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">BILL CODY ARENA</text><text x="580" y="620" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">south of ANC</text><text x="315" y="470" font-family="Arial,sans-serif" font-size="15" fill="#5b544b">Official map marks red no-trailer zones near food court / arena edges.</text><g transform="translate(1030 120)" font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d"><path d="M0 52V0L-13 21M0 0L13 21" fill="none" stroke="#34312d" stroke-width="6"/><text y="78" font-size="20" font-weight="700">N</text></g><text x="40" y="782" font-family="Arial,sans-serif" fill="#5b544b" font-size="15">TexasDefined original orientation diagram · verified 2026-09-11 against Tri-State Fairgrounds official facility map and current 2026 parking guidance · not to scale</text></svg>