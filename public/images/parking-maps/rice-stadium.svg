<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Rice Stadium parking orientation diagram</title><desc id="desc">TexasDefined schematic showing Rice Stadium football parking areas including Greenbriar, South Stadium, West Lot 3 and West Lot 4. Not to scale.</desc><rect width="1200" height="800" fill="#f7f4ed"/><g fill="none" stroke="#34312d" stroke-width="13"><path d="M105 150 H1090"/><path d="M105 650 H1090"/><path d="M245 90 V710"/><path d="M955 90 V710"/></g><g font-family="Arial,sans-serif" fill="#34312d" font-size="20" font-weight="700"><text x="520" y="133">RICE BOULEVARD</text><text x="505" y="688">UNIVERSITY BOULEVARD</text><text x="210" y="440" transform="rotate(-90 210 440)">GREENBRIAR DRIVE</text><text x="990" y="440" transform="rotate(-90 990 440)">CAMPUS EAST</text></g><ellipse cx="575" cy="375" rx="210" ry="145" fill="#d8d2c4" stroke="#34312d" stroke-width="7"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24211e"><text x="575" y="365" font-size="45" font-weight="700">RICE STADIUM</text><text x="575" y="410" font-size="18">NOT TO SCALE</text></g><g stroke="#725b3b" stroke-width="4"><rect x="275" y="205" width="160" height="165" rx="13" fill="#d8dfcf"/><rect x="330" y="520" width="190" height="105" rx="13" fill="#d6deea"/><rect x="760" y="225" width="160" height="135" rx="13" fill="#ddd5e8"/><rect x="760" y="405" width="160" height="150" rx="13" fill="#eadfa7"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d" font-weight="700"><text x="355" y="275" font-size="27">GREENBRIAR</text><text x="355" y="307" font-size="19">GENERAL</text><text x="425" y="570" font-size="24">SOUTH STADIUM</text><text x="425" y="599" font-size="17">BLUE</text><text x="840" y="285" font-size="26">WEST LOT 3</text><text x="840" y="318" font-size="18">PURPLE</text><text x="840" y="465" font-size="26">WEST LOT 4</text><text x="840" y="497" font-size="18">YELLOW / ORANGE</text></g><g transform="translate(1090 85)" font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d"><path d="M0 52V0L-13 21M0 0L13 21" fill="none" stroke="#34312d" stroke-width="6"/><text y="78" font-size="20" font-weight="700">N</text></g><text x="42" y="772" font-family="Arial,sans-serif" fill="#5b544b" font-size="15">TexasDefined original orientation diagram · verified 2026-09-11 against Rice Athletics current football parking guidance · donor assignments can change</text></svg>