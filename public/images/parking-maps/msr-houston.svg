<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">MSR Houston parking orientation diagram</title><desc id="desc">TexasDefined original schematic showing Highway 288/South CR 48 arrival, Performance Drive, track office, paddock and trailer/event parking. Not to scale.</desc><rect width="1200" height="800" fill="#f7f4ed"/><path d="M80 110H1120" stroke="#34312d" stroke-width="14"/><text x="600" y="85" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">HWY 288 → SOUTH CR 48 → PERFORMANCE DRIVE</text><path d="M600 125V675" stroke="#8a8177" stroke-width="8" stroke-dasharray="16 14"/><g fill="#e8dcc6" stroke="#725b3b" stroke-width="4"><rect x="170" y="190" width="860" height="120" rx="18"/><rect x="170" y="365" width="860" height="120" rx="18"/><rect x="170" y="540" width="860" height="120" rx="18"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d"><text x="600" y="238" font-size="30" font-weight="700">TRACK OFFICE / CHECK-IN</text><text x="600" y="276" font-size="18">sign in before track access</text><text x="600" y="413" font-size="30" font-weight="700">PADDOCK / GARAGES</text><text x="600" y="451" font-size="18">10 mph paddock</text><text x="600" y="588" font-size="30" font-weight="700">TRAILER / EVENT PARKING</text><text x="600" y="626" font-size="18">follow event instructions</text></g><text x="40" y="735" font-family="Arial,sans-serif" font-size="16" fill="#5b544b">TexasDefined original orientation diagram · verified 2026-09-14 · not to scale</text><text x="40" y="767" font-family="Arial,sans-serif" font-size="15" fill="#5b544b">Check in at the track office; paddock and trailer controls vary with events.</text></svg>