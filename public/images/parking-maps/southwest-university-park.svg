<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Southwest University Park parking orientation diagram</title><desc id="desc">TexasDefined schematic showing Southwest University Park, current guest parking garages and terminals, VIP Franklin/Durango lot and official drop-off points. Not to scale.</desc><rect width="1200" height="800" fill="#f7f4ed"/><path d="M120 650 H1090" stroke="#34312d" stroke-width="14"/><path d="M230 95 V700" stroke="#34312d" stroke-width="12"/><path d="M1010 100 V700" stroke="#34312d" stroke-width="12"/><g font-family="Arial,sans-serif" fill="#34312d" font-size="18" font-weight="700"><text x="505" y="690">SAN ANTONIO / MAIN STREET DOWNTOWN GRID</text><text x="185" y="430" transform="rotate(-90 185 430)">SANTA FE STREET</text><text x="1050" y="430" transform="rotate(-90 1050 430)">DURANGO STREET</text></g><rect x="500" y="285" width="305" height="225" rx="52" fill="#d8d2c4" stroke="#34312d" stroke-width="7"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24211e"><text x="652" y="380" font-size="34" font-weight="700">SOUTHWEST</text><text x="652" y="420" font-size="34" font-weight="700">UNIVERSITY PARK</text></g><g fill="#e8dcc6" stroke="#725b3b" stroke-width="4"><rect x="300" y="150" width="220" height="110" rx="12"/><rect x="550" y="140" width="220" height="120" rx="12"/><rect x="800" y="150" width="190" height="110" rx="12"/><rect x="305" y="530" width="215" height="95" rx="12"/><rect x="555" y="530" width="215" height="95" rx="12"/><rect x="805" y="520" width="185" height="105" rx="12"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d" font-weight="700"><text x="410" y="190" font-size="18">MILLS BUILDING</text><text x="410" y="215" font-size="18">GARAGE</text><text x="660" y="183" font-size="17">UNION PLAZA / TRANSIT</text><text x="660" y="208" font-size="17">TERMINAL PARKING</text><text x="895" y="190" font-size="18">DESTINATION EL PASO</text><text x="412" y="570" font-size="17">FRANKLIN / DURANGO</text><text x="412" y="596" font-size="16">VIP ONLY</text><text x="662" y="570" font-size="17">MAIN + SANTA FE</text><text x="662" y="596" font-size="15">GENERAL DROP-OFF</text><text x="897" y="558" font-size="16">DURANGO + FRANKLIN</text><text x="897" y="584" font-size="15">ADA DROP-OFF</text></g><text x="40" y="770" font-family="Arial,sans-serif" fill="#5b544b" font-size="15">TexasDefined original orientation diagram · verified 2026-09-11 against Southwest University Park 2026 parking guidance · pricing and event restrictions can change</text><g transform="translate(1090 85)" font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d"><path d="M0 52V0L-13 21M0 0L13 21" fill="none" stroke="#34312d" stroke-width="6"/><text y="78" font-size="20" font-weight="700">N</text></g></svg>