<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Jamail Texas Swimming Center parking orientation diagram</title><desc id="desc">TexasDefined schematic showing the Jamail Texas Swimming Center, nearby Trinity, Brazos and Health Center garage options, and the Robert Dedman drop-off approach. Not to scale.</desc><rect width="1200" height="800" fill="#f7f4ed"/><path d="M115 650 H1090" stroke="#34312d" stroke-width="14"/><path d="M230 100 V700" stroke="#34312d" stroke-width="12"/><path d="M1000 100 V700" stroke="#34312d" stroke-width="12"/><g font-family="Arial,sans-serif" fill="#34312d" font-size="19" font-weight="700"><text x="480" y="690">E MARTIN LUTHER KING JR BOULEVARD</text><text x="185" y="430" transform="rotate(-90 185 430)">TRINITY STREET</text><text x="1040" y="430" transform="rotate(-90 1040 430)">ROBERT DEDMAN DRIVE / RED RIVER</text></g><rect x="500" y="285" width="310" height="225" rx="48" fill="#d8d2c4" stroke="#34312d" stroke-width="7"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24211e"><text x="655" y="370" font-size="34" font-weight="700">JAMAIL TEXAS</text><text x="655" y="410" font-size="34" font-weight="700">SWIMMING CENTER</text></g><g fill="#e8dcc6" stroke="#725b3b" stroke-width="4"><rect x="300" y="155" width="220" height="120" rx="12"/><rect x="550" y="145" width="220" height="130" rx="12"/><rect x="800" y="155" width="215" height="120" rx="12"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d" font-weight="700"><text x="410" y="202" font-size="20">TRINITY GARAGE</text><text x="410" y="230" font-size="15">across MLK · event rates possible</text><text x="660" y="195" font-size="20">BRAZOS GARAGE</text><text x="660" y="225" font-size="15">short walk / alternate</text><text x="907" y="195" font-size="18">HEALTH CENTER</text><text x="907" y="222" font-size="18">GARAGE</text></g><circle cx="880" cy="555" r="62" fill="#eee9df" stroke="#725b3b" stroke-width="5"/><text x="880" y="547" font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d" font-size="17" font-weight="700">ATHLETE /</text><text x="880" y="572" font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d" font-size="17" font-weight="700">VISITOR DROP-OFF</text><text x="880" y="598" font-family="Arial,sans-serif" text-anchor="middle" fill="#5b544b" font-size="13">Robert Dedman side</text><text x="40" y="770" font-family="Arial,sans-serif" fill="#5b544b" font-size="14">TexasDefined original orientation diagram · verified 2026-09-11 against current Texas Swim Center parking/directions plus UT visitor garage guidance · meet-specific recommendations override this orientation map</text><g transform="translate(1090 85)" font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d"><path d="M0 52V0L-13 21M0 0L13 21" fill="none" stroke="#34312d" stroke-width="6"/><text y="78" font-size="20" font-weight="700">N</text></g></svg>