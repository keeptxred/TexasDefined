<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Foster Pavilion parking orientation diagram</title><desc id="desc">TexasDefined schematic showing Foster Pavilion, Pavilion Garage, River Front Garage, Robinson Tower surface parking, downtown public parking context and Ferrell Center shuttle. Not to scale.</desc><rect width="1200" height="800" fill="#f7f4ed"/><path d="M100 640 H1110" stroke="#34312d" stroke-width="14"/><path d="M230 120 V690" stroke="#34312d" stroke-width="12"/><g font-family="Arial,sans-serif" fill="#34312d" font-size="20" font-weight="700"><text x="470" y="680">UNIVERSITY PARKS DRIVE</text><text x="185" y="450" transform="rotate(-90 185 450)">CLAY / DOWNTOWN GRID</text></g><rect x="520" y="290" width="300" height="210" rx="48" fill="#d8d2c4" stroke="#34312d" stroke-width="7"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24211e"><text x="670" y="385" font-size="40" font-weight="700">FOSTER</text><text x="670" y="430" font-size="38" font-weight="700">PAVILION</text></g><g fill="#e8dcc6" stroke="#725b3b" stroke-width="4"><rect x="375" y="210" width="170" height="110" rx="12"/><rect x="840" y="210" width="180" height="110" rx="12"/><rect x="365" y="475" width="170" height="105" rx="12"/><rect x="840" y="470" width="180" height="110" rx="12"/><rect x="80" y="180" width="120" height="380" rx="12"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d" font-weight="700"><text x="460" y="258" font-size="20">PAVILION</text><text x="460" y="285" font-size="20">GARAGE</text><text x="930" y="258" font-size="20">RIVER FRONT</text><text x="930" y="285" font-size="20">GARAGE</text><text x="450" y="520" font-size="18">ROBINSON TOWER</text><text x="450" y="545" font-size="18">SURFACE PARKING</text><text x="930" y="520" font-size="18">FERRELL CENTER</text><text x="930" y="545" font-size="16">FREE SHUTTLE</text><text x="140" y="375" font-size="18" transform="rotate(-90 140 375)">DOWNTOWN PUBLIC LOTS</text></g><text x="40" y="770" font-family="Arial,sans-serif" fill="#5b544b" font-size="15">TexasDefined original orientation diagram · verified 2026-09-11 against Baylor Foster Pavilion parking guidance · construction and event assignments can change</text><g transform="translate(1090 85)" font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d"><path d="M0 52V0L-13 21M0 0L13 21" fill="none" stroke="#34312d" stroke-width="6"/><text y="78" font-size="20" font-weight="700">N</text></g></svg>