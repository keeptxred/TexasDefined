<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Reckling Park parking orientation diagram</title><desc id="desc">TexasDefined schematic showing Reckling Park, current 2026 baseball parking color groups, Greenbriar general parking context and surrounding Rice University streets. Not to scale.</desc><rect width="1200" height="800" fill="#f7f4ed"/><path d="M110 650 H1090" stroke="#34312d" stroke-width="14"/><path d="M240 100 V700" stroke="#34312d" stroke-width="12"/><g font-family="Arial,sans-serif" fill="#34312d" font-size="20" font-weight="700"><text x="515" y="690">UNIVERSITY BOULEVARD / RICE CAMPUS</text><text x="195" y="430" transform="rotate(-90 195 430)">GREENBRIAR DRIVE</text></g><path d="M530 270 Q735 250 815 395 Q745 540 530 520 Q450 395 530 270Z" fill="#d8d2c4" stroke="#34312d" stroke-width="7"/><text x="645" y="408" font-family="Arial,sans-serif" text-anchor="middle" fill="#24211e" font-size="43" font-weight="700">RECKLING PARK</text><g fill="#e8dcc6" stroke="#725b3b" stroke-width="4"><rect x="310" y="150" width="200" height="105" rx="12"/><rect x="530" y="140" width="180" height="115" rx="12"/><rect x="730" y="150" width="180" height="105" rx="12"/><rect x="930" y="165" width="145" height="90" rx="12"/><rect x="310" y="535" width="220" height="90" rx="12"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d" font-weight="700"><text x="410" y="195" font-size="20">YELLOW</text><text x="620" y="192" font-size="20">ORANGE</text><text x="820" y="195" font-size="20">RED</text><text x="1002" y="205" font-size="20">PURPLE</text><text x="420" y="575" font-size="18">GREENBRIAR LOT</text><text x="420" y="600" font-size="16">GENERAL PARKING</text></g><text x="650" y="570" font-family="Arial,sans-serif" fill="#5b544b" font-size="16">2026 baseball parking map uses donor/season color zones</text><text x="40" y="770" font-family="Arial,sans-serif" fill="#5b544b" font-size="15">Te