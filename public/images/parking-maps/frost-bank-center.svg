<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Frost Bank Center parking orientation diagram</title>
  <desc id="desc">TexasDefined schematic showing Frost Bank Center, major approach roads, current color-coded parking categories and the Pink Lot rideshare pickup area. Not to scale.</desc>
  <rect width="1200" height="800" fill="#f7f4ed"/>
  <path d="M90 650 H1110" stroke="#34312d" stroke-width="14"/>
  <path d="M970 90 V710" stroke="#34312d" stroke-width="14"/>
  <g font-family="Arial,sans-serif" fill="#34312d" font-size="20" font-weight="700">
    <text x="520" y="688">E HOUSTON STREET / I-10 ACCESS</text>
    <text x="1005" y="430" transform="rotate(-90 1005 430)">FROST BANK CENTER DRIVE / I-35</text>
  </g>
  <rect x="430" y="275" width="340" height="225" rx="48" fill="#d8d2c4" stroke="#34312d" stroke-width="7"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#24211e">
    <text x="600" y="375" font-size="42" font-weight="700">FROST BANK</text>
    <text x="600" y="423" font-size="42" font-weight="700">CENTER</text>
  </g>
  <g fill="#e8dcc6" stroke="#725b3b" stroke-width="4">
    <rect x="150" y="190" width="210" height="110" rx="14"/>
    <rect x="150" y="335" width="210" height="110" rx="14"/>
    <rect x="150" y="480" width="210" height="110" rx="14"/>
    <rect x="820" y="185" width="180" height="105" rx="14"/>
    <rect x="820" y="330" width="180" height="105" rx="14"/>
    <rect x="820" y="475" width="180" height="105" rx="14"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d" font-weight="700">
    <text x="255" y="235" font-size="24">CURRENT</text><text x="255" y="266" font-size="24">COLOR-CODED LOTS</text>
    <text x="255" y="380" font-size="22">RED · SILVER</text><text x="255" y="412" font-size="22">BLACK · ORANGE</text>
    <text x="255" y="525" font-size="22">TEAL + EVENT-</text><text x="255" y="557" font-size="22">SPECIFIC PARKING</text>
    <text x="910" y="228" font-size="23">PINK LOT</text><text x="910" y="258" font-size="19">RIDESHARE PICKUP</text>
    <text x="910" y="375" font-size="20">PRE-PURCHASE</text><text x="910" y="405" font-size="20">PARKING ADVISED</text>
    <text x="910" y="520" font-size="19">VERIFY EVENT LOT</text><text x="910" y="550" font-size="19">BEFORE TRAVEL</text>
  </g>
  <g transform="translate(1090 85)" font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d">
    <path d="M0 52V0L-13 21M0 0L13 21" fill="none" stroke="#34312d" stroke-width="6"/>
    <text y="78" font-size="20" font-weight="700">N</text>
  </g>
  <text x="40" y="760" font-family="Arial,sans-serif" fill="#5b544b" font-size="15">TexasDefined original orientation diagram · verified 2026-10-19 against Frost Bank Center official parking guidance · not to scale</text>
  <text x="40" y="782" font-family="Arial,sans-serif" fill="#5b544b" font-size="15">Exact parking inventory, prices and access routes vary by event; use the linked official venue map before travel.</text>
</svg>