<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Frost Bank Center parking orientation diagram</title><desc id="desc">TexasDefined schematic showing Frost Bank Center lots 1 through 7, major roads and rideshare location. Not to scale.</desc><rect width="1200" height="800" fill="#f7f4ed"/><path d="M90 650 H1110" stroke="#34312d" stroke-width="14"/><path d="M970 90 V710" stroke="#34312d" stroke-width="14"/><g font-family="Arial,sans-serif" fill="#34312d" font-size="20" font-weight="700"><text x="520" y="688">E HOUSTON STREET / I-10 ACCESS</text><text x="1005" y="430" transform="rotate(-90 1005 430)">FROST BANK CENTER DRIVE / I-35</text></g><rect x="485" y="310" width="285" height="200" rx="50" fill="#d8d2c4" stroke="#34312d" stroke-width="7"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24211e"><text x="627" y="398" font-size="39" font-weight="700">FROST BANK</text><text x="627" y="442" font-size="39" font-weight="700">CENTER</text></g><g fill="#e8dcc6" stroke="#725b3b" stroke-width="4"><rect x="180" y="520" width="170" height="100" rx="12"/><rect x="370" y="520" width="155" height="100" rx="12"/><rect x="545" y="520" width="205" height="100" rx="12"/><rect x="790" y="350" width="145" height="180" rx="12"/><rect x="300" y="185" width="200" height="105" rx="12"/><rect x="520" y="170" width="180" height="120" rx="12"/><rect x="720" y="170" width="180" height="120" rx="12"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d" font-weight="700"><text x="265" y="578" font-size="28">LOT 1</text><text x="447" y="578" font-size="28">LOT 2</text><text x="647" y="578" font-size="28">LOT 3</text><text x="862" y="445" font-size="30">LOT 4</text><text x="400" y="245" font-size="28">LOT 5</text><text x="610" y="235" font-size="28">LOT 6</text><text x="810" y="235" font-size="28">LOT 7</text></g><text x="360" y="320" font-family="Arial,sans-serif" fill="#5b544b" font-size="16">Rideshare pickup zone: Lot 5</text><g transform="translate(1090 85)" font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d"><path d="M0 52V0L-13 21M0 0L13 21" fill="none" stroke="#34312d" stroke-width="6"/><text y="78" font-size="20" font-weight="700">N</text></g><text x="40" y="772" font-family="Arial,sans-serif" fill="#5b544b" font-size="15">TexasDefined original orientation diagram · verified 2026-09-11 against Frost Bank Center official parking and egress maps · event assignments can vary</text></svg>