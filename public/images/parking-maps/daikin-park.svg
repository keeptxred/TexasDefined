<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Daikin Park parking orientation diagram</title><desc id="desc">TexasDefined schematic showing Astros Lots A, B and C east of Daikin Park and major downtown streets. Not to scale.</desc><rect width="1200" height="800" fill="#f7f4ed"/><g fill="none" stroke="#34312d" stroke-width="13" stroke-linecap="round"><path d="M80 150 H1120"/><path d="M80 650 H1120"/><path d="M235 95 V705"/><path d="M920 95 V705"/></g><g font-family="Arial,sans-serif" fill="#34312d" font-size="20" font-weight="700"><text x="480" y="133">CONGRESS / PRESTON</text><text x="520" y="687">TEXAS AVENUE</text><text x="205" y="440" transform="rotate(-90 205 440)">CRAWFORD STREET</text><text x="955" y="420" transform="rotate(-90 955 420)">ST. EMANUEL STREET</text></g><rect x="280" y="255" width="300" height="285" rx="70" fill="#d8d2c4" stroke="#34312d" stroke-width="7"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24211e"><text x="430" y="370" font-size="44" font-weight="700">DAIKIN PARK</text><text x="430" y="415" font-size="20">501 CRAWFORD STREET</text></g><g fill="#e8dcc6" stroke="#725b3b" stroke-width="5"><rect x="630" y="220" width="145" height="130" rx="14"/><rect x="790" y="220" width="120" height="130" rx="14"/><rect x="630" y="395" width="280" height="155" rx="14"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d" font-weight="700"><text x="702" y="285" font-size="34">LOT A</text><text x="850" y="285" font-size="34">LOT B</text><text x="770" y="470" font-size="40">LOT C</text><text x="770" y="505" font-size="17">SINGLE-GAME PARKING</text></g><text x="700" y="590" font-family="Arial,sans-serif" fill="#5b544b" font-size="16">ADA spaces are provided in Astros-operated Lots A, B and C.</text><g transform="translate(1100 90)" font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d"><path d="M0 52V0L-13 21M0 0L13 21" fill="none" stroke="#34312d" stroke-width="6"/><text y="78" font-size="20" font-weight="700">N</text></g><text x="42" y="772" font-family="Arial,sans-serif" fill="#5b544b" font-size="15">TexasDefined original orientation diagram · verified 2026-09-11 against the Houston Astros official parking map · downtown private lots are omitted</text></svg>