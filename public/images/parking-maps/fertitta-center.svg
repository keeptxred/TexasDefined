<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Fertitta Center parking orientation diagram</title><desc id="desc">TexasDefined schematic showing Fertitta Center basketball parking areas including Tan Lot 15C, Stadium Garage Orange and Blue Lot parking. Not to scale.</desc><rect width="1200" height="800" fill="#f7f4ed"/><g fill="none" stroke="#34312d" stroke-width="13"><path d="M95 155 H1105"/><path d="M95 650 H1105"/><path d="M250 90 V710"/><path d="M960 90 V710"/></g><g font-family="Arial,sans-serif" fill="#34312d" font-size="20" font-weight="700"><text x="510" y="138">HOLMAN STREET</text><text x="515" y="688">WHEELER / CAMPUS SOUTH</text><text x="215" y="435" transform="rotate(-90 215 435)">CULLEN BOULEVARD</text><text x="995" y="430" transform="rotate(-90 995 430)">EAST CAMPUS</text></g><rect x="520" y="300" width="300" height="210" rx="48" fill="#d8d2c4" stroke="#34312d" stroke-width="7"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24211e"><text x="670" y="392" font-size="42" font-weight="700">FERTITTA</text><text x="670" y="438" font-size="42" font-weight="700">CENTER</text></g><g stroke="#725b3b" stroke-width="4"><rect x="325" y="205" width="165" height="130" rx="13" fill="#d8bfa9"/><rect x="800" y="205" width="155" height="150" rx="13" fill="#e9d5c6"/><rect x="315" y="405" width="175" height="155" rx="13" fill="#d6deea"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d" font-weight="700"><text x="407" y="265" font-size="29">TAN LOT</text><text x="407" y="298" font-size="19">15C</text><text x="877" y="260" font-size="27">STADIUM GARAGE</text><text x="877" y="293" font-size="19">ORANGE</text><text x="402" y="480" font-size="31">BLUE LOT</text><text x="402" y="515" font-size="17">16B / 16C WEST SIDE</text></g><text x="545" y="560" font-family="Arial,sans-serif" fill="#5b544b" font-size="16">ADA spaces are available in gameday lots on a first-come basis.</text><g transform="translate(1100 90)" font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d"><path d="M0 52V0L-13 21M0 0L13 21" fill="none" stroke="#34312d" stroke-width="6"/><text y="78" font-size="20" font-weight="700">N</text></g><text x="40" y="772" font-family="Arial,sans-serif" fill="#5b544b" font-size="15">TexasDefined original orientation diagram · verified 2026-09-11 against UH Fertitta Center gameday parking guidance · weekday lot availability can change</text></svg>