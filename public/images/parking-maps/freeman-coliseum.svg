    <text x="206" y="162">LOT 8</text><text x="585" y="162">LOT 7</text><text x="960" y="162">LOT 6</text>
    <text x="689" y="263">LOT 5</text><text x="1036" y="439">LOT 4</text><text x="196" y="470">LOT 9</text>
    <text x="247" y="632">LOT 1</text><text x="599" y="632">LOT 2</text><text x="927" y="632">LOT 3</text>
  </g>
  <g stroke="#7a604c" stroke-width="3" fill="#eadac4" text-anchor="middle" font-weight="700">
