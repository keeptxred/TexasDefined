  <text x="53" y="59" font-size="27" font-weight="700">FREEMAN CAMPUS — VISITOR ORIENTATION</text>
  <text x="870" y="58" font-size="17">NOT TO SCALE</text>
  <path d="M55 672 H1135" stroke="#5d5a53" stroke-width="16"/>
  <text x="473" y="703" font-size="20" font-weight="700">EAST HOUSTON STREET</text>
  <path d="M1124 110 V676" stroke="#5d5a53" stroke-width="15"/>
  <text x="1153" y="456" font-size="16" transform="rotate(-90 1153 456)">FROST BANK CENTER DRIVE</text>
  <g fill="#d5e4cd" stroke="#5e7560" stroke-width="3">
    <rect x="55" y="110" width="302" height="90" rx="9"/>
    <rect x="375" y="110" width="420" height="90" rx="9"/>
    <rect x="813" y="110" width="294" height="90" rx="9"/>
