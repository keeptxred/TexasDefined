<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Freeman Coliseum parking orientation diagram</title><desc id="desc">TexasDefined schematic showing Freeman Coliseum grounds lots and adjacent Frost Bank Center. Not to scale.</desc><rect width="1200" height="800" fill="#f7f4ed"/><path d="M90 655 H1110" stroke="#34312d" stroke-width="14"/><path d="M980 90 V710" stroke="#34312d" stroke-width="13"/><g font-family="Arial,sans-serif" fill="#34312d" font-size="20" font-weight="700"><text x="510" y="694">E HOUSTON STREET</text><text x="1015" y="430" transform="rotate(-90 1015 430)">FROST BANK CENTER DRIVE</text></g><rect x="500" y="315" width="285" height="190" rx="48" fill="#d8d2c4" stroke="#34312d" stroke-width="7"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#24211e"><text x="642" y="398" font-size="40" font-weight="700">FREEMAN</text><text x="642" y="442" font-size="40" font-weight="700">COLISEUM</text></g><g fill="#e8dcc6" stroke="#725b3b" stroke-width="4"><rect x="210" y="520" width="145" height="100" rx="12"/><rect x="375" y="520" width="145" height="100" rx="12"/><rect x="790" y="505" width="145" height="115" rx="12"/><rect x="805" y="340" width="130" height="125" rx="12"/><rect x="790" y="185" width="145" height="110" rx="12"/><rect x="590" y="180" width="165" height="110" rx="12"/><rect x="390" y="180" width="165" height="110" rx="12"/><rect x="205" y="185" width="145" height="105" rx="12"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d" font-weight="700"><text x="282" y="578" font-size="27">LOT 1</text><text x="447" y="578" font-size="27">LOT 2</text><text x="862" y="568" font-size="27">LOT 3</text><text x="870" y="405" font-size="27">LOT 4</text><text x="862" y="245" font-size="27">LOT 5</text><text x="672" y="240" font-size="25">LOTS 6 / 7</text><text x="472" y="240" font-size="25">LOT 8</text><text x="277" y="242" font-size="25">LOT 9</text></g><text x="210" y="320" font-family="Arial,sans-serif" fill="#5b544b" font-size="15">Gate B is the recommended mobility-impaired drop-off for Freeman events.</text><g transform="translate(1090 85)" font-family="Arial,sans-serif" text-anchor="middle" fill="#34312d"><path d="M0 52V0L-13 21M0 0L13 21" fill="none" stroke="#34312d" stroke-width="6"/><text y="78" font-size="20" font-weight="700">N</text></g><text x="40" y="772" font-family="Arial,sans-serif" fill="#5b544b" font-size="15">TexasDefined original orientation diagram · verified 2026-09-11 against Freeman Coliseum grounds map and 2026 event parking guidance · open lots vary by event</text></svg>