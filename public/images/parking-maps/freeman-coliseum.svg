<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Freeman Coliseum, Expo Halls and Frost Bank Center parking orientation schematic</title>
<desc id="desc">Original TexasDefined schematic, not to scale, based on the official 2026 campus map. East Houston Street runs along the south side, Frost Bank Center Drive on the east, Freeman Coliseum west of Frost Bank Center, Expo Halls and barns to the north. Lots 1, 2 and 3 are to the south; lot 9 is west of the Coliseum; lots 8, 7 and 6 span the far north; lot 5 lies below lot 7; lot 4 is on the east. Open lots and gates vary by event; always consult the official event map.</desc>
<rect width="1200" height="800" fill="#f6f3eb"/>
<g font-family="Arial,sans-serif" fill="#34312d">
