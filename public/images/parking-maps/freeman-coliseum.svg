    <text x="142" y="280">STALL BARN</text>
    <text x="404" y="268">EXPO HALLS</text><text x="404" y="296" font-size="18">A / B / C</text>
    <text x="689" y="354">EXPO HALL 2</text>
    <text x="480" y="471">FREEMAN</text><text x="480" y="502">COLISEUM</text>
