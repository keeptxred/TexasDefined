<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Texas Motor Speedway parking orientation diagram</title>
  <desc id="desc">A TexasDefined-created schematic showing Texas Motor Speedway, major approach roads, general parking and preferred parking zones. Not to scale.</desc>
  <rect width="1200" height="800" fill="#f7f4ed"/>
  <g fill="none" stroke="#34312d" stroke-width="14" stroke-linecap="round">
    <path d="M1000 60 V730"/>
    <path d="M100 700 H1100"/>
    <path d="M115 610 H970"/>
    <path d="M150 160 C250 120 330 125 420 155"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="23" fill="#34312d" font-weight="700">
    <text x="1028" y="390" transform="rotate(90 1028 390)">I-35W</text>
    <text x="515" y="690">TEXAS 114</text>
    <text x="500" y="598">VICTORY CIRCLE</text>
    <text x="175" y="135">DALE EARNHARDT WAY / NORTH APPROACH</text>
  </g>
  <g transform="translate(640 330)">
    <ellipse cx="0" cy="0" rx="225" ry="150" fill="#d8d2c4" stroke="#34312d" stroke-width="9"/>
    <ellipse cx="0" cy="0" rx="125" ry="72" fill="#f7f4ed" stroke="#34312d" stroke-width="6"/>
    <text x="0" y="-5" font-family="Arial, sans-serif" font-size="34" text-anchor="middle" font-weight="700" fill="#24211e">TEXAS MOTOR</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="34" text-anchor="middle" font-weight="700" fill="#24211e">SPEEDWAY</text>
  </g>
  <g stroke="#725b3b" stroke-width="4">
    <path d="M125 205 H385 V500 H120 Z" fill="#e8dcc6"/>
    <path d="M390 215 H470 V500 H390 Z" fill="#ddd0b6"/>
    <path d="M470 215 H505 V500 H470 Z" fill="#cab995"/>
    <rect x="505" y="510" width="175" height="75" rx="12" fill="#e8dcc6"/>
    <rect x="700" y="510" width="150" height="75" rx="12" fill="#ddd0b6"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#34312d" font-weight="700" text-anchor="middle">
    <text x="255" y="330" font-size="28">GENERAL PARKING</text>
    <text x="255" y="365" font-size="20">WEST FIELD</text>
    <text x="430" y="320" font-size="20" transform="rotate(-90 430 320)">PREFERRED PARKING</text>
    <text x="488" y="320" font-size="18" transform="rotate(-90 488 320)">PREMIUM / PASS LOTS</text>
    <text x="592" y="550" font-size="20">EXPRESS / BUS AREA</text>
    <text x="775" y="550" font-size="20">CAMPING / VIP AREA</text>
  </g>
  <g fill="none" stroke="#725b3b" stroke-width="5" stroke-dasharray="12 10">
    <path d="M90 540 C205 565 315 545 420 500"/>
    <path d="M420 500 C500 520 545 550 590 610"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#5b544b">
    <text x="70" y="780" font-size="17">TexasDefined original orientation diagram · verified 2026-09-11 against Texas Motor Speedway official directions/parking material and a reusable track map · not to scale</text>
  </g>
  <g transform="translate(1090 120)" font-family="Arial, sans-serif" text-anchor="middle" fill="#34312d">
    <path d="M0 55 L0 0 L-14 22 M0 0 L14 22" fill="none" stroke="#34312d" stroke-width="6"/>
    <text x="0" y="82" font-size="22" font-weight="700">N</text>
  </g>
</svg>