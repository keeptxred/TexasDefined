<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title desc"><title id="title">Topwater frog diagram</title><desc id="desc">A frog crosses vegetation, pauses in openings, and the hookset follows felt weight.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c65a34"/></marker></defs><rect width="640" height="220" fill="#fbf7f0"/><path d="M20 72c40-10 80 10 120 0s80-10 120 0 80 10 120 0 80-10 120 0 80 10 120 0" fill="none" stroke="#9aafa7" stroke-width="3"/><ellipse cx="120" cy="78" rx="45" ry="18" fill="#9aa56f"/><ellipse cx="205" cy="75" rx="50" ry="19" fill="#9aa56f"/><path d="M255 72c65-10 128-8 180 2" stroke="#c65a34" stroke-width="4" fill="none" marker-end="url(#a)"/><ellipse cx="456" cy="74" rx="28" ry="14" fill="#8b6a55"/><path d="M471 80l18 14M442 80l-18 14" stroke="#30231b" stroke-width="3"/><text x="32" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">land on / beside cover</text><text x="176" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">walk or pull</text><text x="320" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">pause in openings</text><text x="464" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">feel weight</text></svg>