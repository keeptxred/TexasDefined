<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title desc"><title id="title">Contour trolling pass diagram</title><desc id="desc">A boat follows a repeatable contour while a diving lure runs at a controlled depth.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c65a34"/></marker></defs><rect width="640" height="220" fill="#fbf7f0"/><path d="M20 72c40-10 80 10 120 0s80-10 120 0 80 10 120 0 80-10 120 0 80 10 120 0" fill="none" stroke="#9aafa7" stroke-width="3"/><path d="M20 170c80-18 130 12 205-4 80-17 135 14 205-2 64-15 114-1 190 4" fill="none" stroke="#8b6a55" stroke-width="4"/><path d="M88 54h82l-16 19H104z" fill="#8b6a55"/><path d="M160 67c70 18 132 34 206 64" fill="none" stroke="#30231b" stroke-width="3"/><ellipse cx="385" cy="138" rx="26" ry="9" fill="#c65a34"/><path d="M70 32c120-18 225-10 330 18" fill="none" stroke="#c65a34" stroke-width="4" marker-end="url(#a)"/><text x="32" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">mark target depth</text><text x="147.2" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">set speed</text><text x="262.4" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">set line length</text><text x="377.6" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">follow contour</text><text x="492.8" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">repeat line</text></svg>