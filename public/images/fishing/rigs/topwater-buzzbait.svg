<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title desc"><title id="title">Buzzbait or plopper diagram</title><desc id="desc">A surface lure travels steadily across shallow water and past cover.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c65a34"/></marker></defs><rect width="640" height="220" fill="#fbf7f0"/><path d="M20 72c40-10 80 10 120 0s80-10 120 0 80 10 120 0 80-10 120 0 80 10 120 0" fill="none" stroke="#9aafa7" stroke-width="3"/><path d="M70 70h390" stroke="#c65a34" stroke-width="4" marker-end="url(#a)"/><circle cx="245" cy="70" r="16" fill="none" stroke="#30231b" stroke-width="3"/><path d="M229 70h32M245 54v32" stroke="#30231b" stroke-width="3"/><path d="M480 50v70M500 60v60" stroke="#6b5749" stroke-width="7"/><text x="32" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">cast</text><text x="176" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">start retrieve</text><text x="320" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">keep on surface</text><text x="464" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">deflect past cover</text></svg>