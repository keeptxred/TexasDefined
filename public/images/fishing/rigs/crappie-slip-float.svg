<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title desc"><title id="title">Crappie slip-float diagram</title><desc id="desc">A slip float and stop suspend a jig or minnow above cover at a repeatable depth.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c65a34"/></marker></defs><rect width="640" height="220" fill="#fbf7f0"/><path d="M20 72c40-10 80 10 120 0s80-10 120 0 80 10 120 0 80-10 120 0 80 10 120 0" fill="none" stroke="#9aafa7" stroke-width="3"/><ellipse cx="260" cy="72" rx="11" ry="28" fill="#c65a34"/><path d="M260 20v160" stroke="#30231b" stroke-width="3"/><rect x="250" y="35" width="20" height="5" fill="#30231b"/><circle cx="260" cy="145" r="7" fill="#8b6a55"/><path d="M260 152v20" stroke="#30231b" stroke-width="3"/><path d="M253 173q7 13 14 0" fill="none" stroke="#30231b" stroke-width="3"/><path d="M390 145l20-24 18 24 20-31 18 31" fill="none" stroke="#6b5749" stroke-width="5"/><text x="32" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">main line</text><text x="147.2" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">slip float</text><text x="262.4" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">stop</text><text x="377.6" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">weight if needed</text><text x="492.8" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">jig or minnow</text></svg>