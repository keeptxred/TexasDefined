<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title desc"><title id="title">Popper cadence diagram</title><desc id="desc">A popper moves in short bursts separated by pauses beside a target.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c65a34"/></marker></defs><rect width="640" height="220" fill="#fbf7f0"/><path d="M20 72c40-10 80 10 120 0s80-10 120 0 80 10 120 0 80-10 120 0 80 10 120 0" fill="none" stroke="#9aafa7" stroke-width="3"/><ellipse cx="155" cy="73" rx="34" ry="11" fill="#8b6a55"/><path d="M188 69q22-18 42 0M198 77q28 20 53 2" fill="none" stroke="#c65a34" stroke-width="4"/><path d="M276 72h110" stroke="#c65a34" stroke-width="4" stroke-dasharray="18 14" marker-end="url(#a)"/><path d="M465 54v54M483 48v60" stroke="#6b5749" stroke-width="7"/><text x="32" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">cast to target</text><text x="176" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">pop</text><text x="320" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">pause</text><text x="464" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">repeat</text></svg>