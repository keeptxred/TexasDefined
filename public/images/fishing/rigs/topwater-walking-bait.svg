<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title desc"><title id="title">Walking topwater diagram</title><desc id="desc">A walking bait zig-zags across the surface with brief pauses.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c65a34"/></marker></defs><rect width="640" height="220" fill="#fbf7f0"/><path d="M20 72c40-10 80 10 120 0s80-10 120 0 80 10 120 0 80-10 120 0 80 10 120 0" fill="none" stroke="#9aafa7" stroke-width="3"/><polyline points="70,70 125,52 180,73 235,51 290,72 345,52 400,72" fill="none" stroke="#c65a34" stroke-width="4" marker-end="url(#a)"/><ellipse cx="425" cy="71" rx="34" ry="10" fill="#8b6a55"/><path d="M430 80q7 16 14 0" fill="none" stroke="#30231b" stroke-width="3"/><text x="32" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">cast beyond target</text><text x="176" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">slack-line taps</text><text x="320" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">side-to-side walk</text><text x="464" y="204" font-family="system-ui,sans-serif" font-size="14" fill="#6b5749">brief pause</text></svg>