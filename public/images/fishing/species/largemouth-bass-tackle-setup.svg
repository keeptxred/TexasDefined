<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title desc"><title id="title">Largemouth bass tackle setup</title><desc id="desc">Three bass-fishing tackle situations: general-purpose, heavy cover, and clear or pressured water.</desc><rect width="640" height="280" fill="#fbf7f0"/><text x="32" y="34" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#30231b">General purpose</text><path d="M32 72h145" stroke="#30231b" stroke-width="7" stroke-linecap="round"/><circle cx="142" cy="101" r="22" fill="none" stroke="#8b6a55" stroke-width="7"/><path d="M176 72l56 22" stroke="#30231b" stroke-width="4"/><text x="32" y="140" font-family="system-ui,sans-serif" font-size="13" fill="#6b5749">medium to medium-heavy outfit</text><text x="240" y="34" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#30231b">Heavy cover</text><path d="M240 72h142" stroke="#30231b" stroke-width="9" stroke-linecap="round"/><circle cx="346" cy="101" r="23" fill="none" stroke="#8b6a55" stroke-width="8"/><path d="M382 72l56 22" stroke="#30231b" stroke-width="6"/><path d="M434 54v88M451 48v94M468 65v77" stroke="#9aa56f" stroke-width="7"/><text x="240" y="140" font-family="system-ui,sans-serif" font-size="13" fill="#6b5749">more power • abrasion resistance</text><text x="32" y="190" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#30231b">Clear / pressured water</text><path d="M32 225h170" stroke="#30231b" stroke-width="5" stroke-linecap="round"/><circle cx="160" cy="250" r="18" fill="none" stroke="#8b6a55" stroke-width="5"/><path d="M201 225c115 4 190 18 302 35" fill="none" stroke="#30231b" stroke-width="2"/><circle cx="506" cy="260" r="5" fill="#c65a34"/><text x="232" y="215" font-family="system-ui,sans-serif" font-size="13" fill="#6b5749">lighter presentation • longer cast</text></svg>