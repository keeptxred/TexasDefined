<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc"><title id="title">Vertical jigging tackle setup</title><desc id="desc">Short responsive rod and reel with low-stretch line dropping a weighted jig vertically beneath the angler.</desc><rect width="640" height="260" fill="#fbf7f0"/><path d="M56 64h190" stroke="#30231b" stroke-width="8" stroke-linecap="round"/><path d="M222 64l78 30" stroke="#30231b" stroke-width="5"/><circle cx="183" cy="98" r="27" fill="none" stroke="#8b6a55" stroke-width="8"/><circle cx="183" cy="98" r="8" fill="#8b6a55"/><path d="M300 94v108" stroke="#30231b" stroke-width="3"/><path d="M286 201h28l-14 30z" fill="#c65a34"/><path d="M24 42c90-8 175 5 270 0s175-9 320 0" fill="none" stroke="#9aafa7" stroke-width="3"/><text x="56" y="30" font-family="system-ui,sans-serif" font-size="15" fill="#6b5749">short responsive rod</text><text x="138" y="144" font-family="system-ui,sans-serif" font-size="15" fill="#6b5749">reel</text><text x="320" y="126" font-family="system-ui,sans-serif" font-size="15" fill="#6b5749">low-stretch line / leader</text><text x="330" y="222" font-family="system-ui,sans-serif" font-size="15" fill="#6b5749">enough jig weight to stay vertical</text></svg>