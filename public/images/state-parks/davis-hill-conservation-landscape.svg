<title id="heroTitle">Interpretive illustration of Davis Hill conservation habitats</title>
<desc id="heroDesc">An original artist's impression of a gently rising forested East Texas upland with bottomland trees and a winding river. It is not an actual view, entrance route, or geographic survey of Davis Hill State Natural Area.</desc>
