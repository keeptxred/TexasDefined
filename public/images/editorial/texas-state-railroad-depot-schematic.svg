<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Texas State Railroad depot and downtown museum schematic</title><desc id="desc">Standard Piney Woods Express travels east from Palestine Depot to Rusk Depot and returns. The downtown Rusk museum is a separate road stop.</desc><rect width="1000" height="420" rx="18" fill="#f5f2e9"/><g font-family="Arial,sans-serif" fill="#24362c"><text x="42" y="49" font-size="29" font-weight="bold">Texas State Railroad • Piney Woods route</text><text x="42" y="79" font-size="19">Schematic — not to scale; not a road or track-access map</text><path d="M130 180H780" fill="none" stroke="#466a50" stroke-width="10" stroke-linecap="round"/><path d="M130 180H780" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="10 11"/><circle cx="130" cy="180" r="15" fill="#24362c"/><circle cx="780" cy="180" r="15" fill="#24362c"/><text x="45" y="128" font-size="21" font-weight="bold">WEST • Palestine</text><text x="45" y="151" font-size="17">789 Park Road 70</text><text x="660" y="128" font-size="21" font-weight="bold">EAST • Rusk</text><text x="660" y="151" font-size="17">535 Park Road 76</text><text x="290" y="220" font-size="20">Approx. 25 miles each way</text><text x="45" y="260" font-size="20" font-weight="bold">Normal boarding</text><text x="45" y="285" font-size="18">Arrive 45 minutes early</text><text x="660" y="260" font-size="20" font-weight="bold">Depot layover</text><text x="660" y="285" font-size="18">Approx. 75–80 minutes</text><path d="M780 197V325H545" fill="none" stroke="#a57238" stroke-width="4" stroke-dasharray="7 6"/><text x="45" y="345" font-size="20" font-weight="bold">Separate downtown road stop:</text><text x="45" y="372" font-size="18">Heritage Center • 208 S Henderson St, Rusk</text><text x="45" y="400" font-size="15">Source: Texas State Railroad operator FAQ and Piney Woods Express excursion descriptions • Texas Defined</text></g></svg>
