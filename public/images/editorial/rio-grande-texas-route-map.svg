<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Schematic route of the Rio Grande through Texas</title>
  <desc id="desc">A simplified downstream route from El Paso through Big Bend, Amistad, Eagle Pass, Laredo, Falcon Reservoir, the Lower Rio Grande Valley and the Gulf of Mexico.</desc>
  <rect width="1600" height="900" fill="#f4efe6"/>
  <text x="120" y="110" font-family="Georgia,serif" font-size="58" fill="#352f2a">Rio Grande through Texas</text>
  <text x="122" y="160" font-family="Arial,sans-serif" font-size="24" fill="#6f6258">Schematic downstream route — not to scale</text>
  <path d="M150 260 C280 220 330 320 430 330 C540 340 560 470 675 470 C790 470 840 385 940 430 C1040 475 1085 575 1200 590 C1320 605 1390 690 1455 760" fill="none" stroke="#2f7fa3" stroke-width="18" stroke-linecap="round"/>
  <path d="M530 190 C560 260 590 340 630 430" fill="none" stroke="#7a9cb5" stroke-width="10" stroke-linecap="round"/>
  <path d="M790 245 C790 320 790 390 760 455" fill="none" stroke="#7a9cb5" stroke-width="10" stroke-linecap="round"/>
  <text x="470" y="170" font-family="Arial,sans-serif" font-size="22" fill="#5d5148">Pecos River</text>
  <text x="785" y="220" font-family="Arial,sans-serif" font-size="22" fill="#5d5148">Devils River</text>
  <g fill="#aa5b3d" stroke="#f4efe6" stroke-width="8">
    <circle cx="165" cy="257" r="18"/><circle cx="420" cy="330" r="18"/><circle cx="676" cy="470" r="18"/><circle cx="825" cy="406" r="18"/><circle cx="980" cy="456" r="18"/><circle cx="1170" cy="584" r="18"/><circle cx="1330" cy="646" r="18"/><circle cx="1450" cy="758" r="18"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#352f2a">
    <text x="125" y="225" font-size="30" font-weight="700">El Paso</text>
    <text x="350" y="292" font-size="30" font-weight="700">Big Bend</text>
    <text x="600" y="525" font-size="30" font-weight="700">Amistad / Del Rio</text>
    <text x="792" y="365" font-size="26" font-weight="700">Eagle Pass</text>
    <text x="950" y="420" font-size="30" font-weight="700">Laredo</text>
    <text x="1090" y="645" font-size="30" font-weight="700">Falcon Reservoir</text>
    <text x="1210" y="705" font-size="28" font-weight="700">Lower Rio Grande Valley</text>
    <text x="1330" y="815" font-size="30" font-weight="700">Gulf of Mexico</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="22" fill="#6f6258">
    <text x="350" y="365">Santa Elena · Mariscal · Boquillas</text>
    <text x="945" y="500">Webb County</text>
    <text x="1090" y="675">Zapata County</text>
  </g>
  <rect x="115" y="815" width="865" height="2" fill="#d5c8ba"/>
  <text x="115" y="852" font-family="Arial,sans-serif" font-size="20" fill="#7a6f65">TexasDefined editorial schematic. Use official maps and current agency guidance for navigation and river trips.</text>
</svg>