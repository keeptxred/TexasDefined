<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Texas natural regions — boundary-informed 10-region orientation map</title>
  <desc id="desc">A TexasDefined boundary-informed orientation map of the ten major Texas natural regions used by Texas Parks and Wildlife. Boundaries are generalized for statewide reading and are not survey-grade GIS data.</desc>
