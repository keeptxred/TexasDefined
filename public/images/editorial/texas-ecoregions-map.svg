      .legend{font:600 21px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#25322d}
      .legend-small{font:500 18px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#5c6963}
      .region-label{font:700 21px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#18241f;text-anchor:middle;paint-order:stroke;stroke:#fffaf2;stroke-width:5px;stroke-linejoin:round}
